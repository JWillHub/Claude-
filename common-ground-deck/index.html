<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" type="image/png" href="icon-192.png"><meta name="theme-color" content="#1B1530"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="CG Deck"><meta name="apple-mobile-web-app-status-bar-style" content="default"><style>[hidden]{display:none!important}</style></head><body>
<title>Common Ground Deck</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Layout: hub-and-spoke. Home is a bento of big color tiles; planning is a 4-step tap wizard ending in a swipeable card deck. */
:root{
  --bg:#F6F4FB; --surface:#FFFFFF; --ink:#1B1530; --muted:#6B6680; --line:#E4E0EF;
  --coral:#FF9077; --sun:#FFD45C; --mint:#74DDB5; --sky:#8FC6FF; --grape:#BBA6FF; --blockink:#1B1530;
  --warn:#C9301F; --warn-bg:#FFE1DC; --focus:#5B3FD9;
  --f-display:"Fredoka", "Trebuchet MS", system-ui, sans-serif;
  --f-body:"Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#14111D; --surface:#1F1B2C; --ink:#F1EEF8; --muted:#A39DB8; --line:#312B44; --warn:#FF8A7A; --warn-bg:#3D1F1C; --focus:#C9B8FF; color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14111D; --surface:#1F1B2C; --ink:#F1EEF8; --muted:#A39DB8; --line:#312B44; --warn:#FF8A7A; --warn-bg:#3D1F1C; --focus:#C9B8FF; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.app{max-width:600px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);font-weight:600;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:32px;line-height:1.1}h2{font-size:24px;line-height:1.15}h3{font-size:19px;line-height:1.2}
p{margin:0}
button{font:inherit;color:inherit}
*{-webkit-tap-highlight-color:transparent}
button:focus,[role="button"]:focus{outline:none}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,[role="button"]:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.lt,.tile,.pick,.pill,.small,.btn,.iconbtn,.hero,.cta,.dial button,.scale button{transition:transform .12s ease}
.lt:active,.tile:active,.pick:active,.pill:active,.small:active,.btn:active,.iconbtn:active,.hero:active,.cta:active,.dial button:active,.scale button:active{transform:scale(.96)}
.coral{background:var(--coral)}.sun{background:var(--sun)}.mint{background:var(--mint)}.sky{background:var(--sky)}.grape{background:var(--grape)}
.coral,.sun,.mint,.sky,.grape{color:var(--blockink)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:10px;padding-block:14px}
.iconbtn{appearance:none;border:0;width:42px;height:42px;border-radius:14px;background:var(--surface);display:grid;place-items:center;cursor:pointer;box-shadow:0 1px 0 var(--line)}
.iconbtn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.logo{font-family:var(--f-display);font-weight:700;font-size:21px;letter-spacing:-.02em;display:flex;align-items:center;gap:7px}
.logo i{width:22px;height:22px;border-radius:7px;background:var(--mint);display:inline-block;position:relative;transform:rotate(-8deg)}
.logo i::after{content:"";position:absolute;inset:5px;border-radius:4px;background:var(--coral)}
.ptitle{flex:1;min-width:0;font-family:var(--f-display);font-weight:700;font-size:23px;letter-spacing:-.02em;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;-webkit-user-select:none;user-select:none;border-radius:10px;transition:opacity .15s}
.ptitle:active{opacity:.6}
.bar .thm{margin-left:auto}
.crumb{margin-left:auto;font-weight:800;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
main{display:flex;flex-direction:column;gap:18px}
.kicker{font-weight:800;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.hello{display:flex;flex-direction:column;gap:6px;padding-top:6px}
.hero{appearance:none;border:0;cursor:pointer;text-align:left;border-radius:28px;padding:22px;display:grid;grid-template-columns:1fr auto;gap:6px 14px;align-items:end;min-height:160px;position:relative;overflow:hidden}
.hero .big{font-family:var(--f-display);font-weight:700;font-size:30px;line-height:1.05;grid-column:1}
.hero .sub{grid-column:1;font-weight:600;opacity:.85}
.hero .go{grid-column:2;grid-row:1/3;width:58px;height:58px;border-radius:50%;background:var(--blockink);color:var(--coral);display:grid;place-items:center;font-size:26px;font-weight:700}
.hero::before{content:"";position:absolute;right:-30px;top:-40px;width:150px;height:150px;border-radius:50%;background:var(--sun);opacity:.85}
.hero>*{position:relative}
@media (prefers-reduced-motion: no-preference){.hero::before{animation:bubble 9s ease-in-out infinite;will-change:transform}}
@keyframes bubble{0%,100%{transform:translate(0,0) scale(1)}25%{transform:translate(-10px,8px) scale(1.04)}50%{transform:translate(-4px,16px) scale(.98)}75%{transform:translate(6px,6px) scale(1.03)}}
.bento{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{appearance:none;border:0;cursor:pointer;border-radius:24px;padding:16px 18px;text-align:left;display:flex;flex-direction:column;gap:2px;min-height:118px;justify-content:flex-end}
.tile b{font-family:var(--f-display);font-size:40px;line-height:1;font-weight:700}
.tile span{font-weight:800}
.tile:nth-child(1){border-radius:24px 24px 24px 8px}.tile:nth-child(4){border-radius:8px 24px 24px 24px}
.strip{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 4px;margin:0 -2px;scrollbar-width:none;-webkit-mask-image:linear-gradient(90deg,#000 88%,transparent);mask-image:linear-gradient(90deg,#000 88%,transparent)}
.strip .pill:last-child{margin-right:28px}
.strip::-webkit-scrollbar{display:none}
.pill{appearance:none;flex:none;border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:700;font-size:14px;cursor:pointer;white-space:nowrap}
.pill[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
/* wizard */
.progress{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.progress span{height:8px;border-radius:99px;background:var(--line)}
.progress span.on{background:var(--ink)}
.q{display:flex;flex-direction:column;gap:4px}
.q p{color:var(--muted);font-weight:600}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pick{appearance:none;border:3px solid transparent;cursor:pointer;border-radius:20px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:8px;min-height:104px;justify-content:space-between;transition:transform .12s}
.pick svg{width:32px;height:32px;stroke:var(--blockink);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.pick b{font-family:var(--f-display);font-size:18px;font-weight:600;line-height:1.1}
.pick small{font-weight:700;opacity:.75;font-size:12.5px}
.pick[aria-pressed="true"]{border-color:var(--ink);transform:scale(.97);box-shadow:inset 0 0 0 3px var(--surface)}
.pick.concern{flex-direction:row;align-items:center;min-height:60px;padding:10px 12px;gap:8px;border-radius:18px}
.pick.concern>span:first-child{min-width:0}
.pick.concern b{display:block;font-size:15px;line-height:1.15}
.pick.concern small{display:block;font-size:12px;line-height:1.25;margin-top:1px}
.pick.concern .tick{width:22px;height:22px;font-size:12px;align-self:center;flex:none}
.pick .tick{width:26px;height:26px;border-radius:50%;border:2.5px solid var(--blockink);display:grid;place-items:center;font-weight:800;font-size:14px;align-self:flex-end}
.pick[aria-pressed="true"] .tick{background:var(--blockink);color:#FFFFFF}
.pick.crisis{background:rgba(255,59,48,.38);color:var(--ink)}
.pick.crisis[aria-pressed="true"]{background:rgba(255,59,48,.6)}
.pick.crisis .tick{border-color:var(--warn)}.pick.crisis[aria-pressed="true"] .tick{background:var(--warn);color:var(--surface)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:50;transform:translate(-50%,20px);opacity:0;background:var(--ink);color:var(--bg);font-weight:800;font-size:14px;border-radius:999px;padding:10px 18px;transition:opacity .25s,transform .3s cubic-bezier(.2,.9,.3,1.2);pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
.cta.cta-hide{opacity:0;transform:translateY(24px);pointer-events:none;transition:opacity .25s ease,transform .3s cubic-bezier(.2,.9,.3,1.2)}
.cta.cta-hide.cta-on{opacity:1;transform:none;pointer-events:auto}
.cta{position:sticky;bottom:calc(12px + env(safe-area-inset-bottom,0px));appearance:none;border:0;cursor:pointer;border-radius:20px;padding:17px 20px;background:var(--ink);color:var(--bg);font-family:var(--f-display);font-weight:600;font-size:19px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 10px 30px rgba(20,17,29,.25)}
.cta:disabled{opacity:.4;cursor:default}
.dial{background:var(--surface);border-radius:26px;padding:20px;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;text-align:center}
.dial button{appearance:none;border:0;width:56px;height:56px;border-radius:18px;background:var(--sky);color:var(--blockink);font-size:28px;font-weight:800;cursor:pointer}
.dial b{font-family:var(--f-display);font-size:56px;line-height:1;font-weight:700;font-variant-numeric:tabular-nums}
.dial small{display:block;font-weight:800;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;font-size:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.grid3 .pick{min-height:116px;align-items:center;text-align:center;justify-content:center}
.grid3 .pick svg{width:46px;height:46px}
/* deck */
.stack{position:relative;width:100%;max-width:440px;aspect-ratio:1/1;margin:0 auto 30px;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.card{position:absolute;inset:0;border-radius:30px;padding:22px;display:flex;flex-direction:column;gap:10px;overflow:hidden;box-shadow:0 10px 30px rgba(20,17,29,.18);transition:transform .32s cubic-bezier(.2,.8,.3,1),opacity .32s;will-change:transform;cursor:grab}
.card.dragging{transition:none;cursor:grabbing}
.card.tap{cursor:pointer}
.card .acts{align-items:center;justify-content:space-between}
.taphint{font-weight:800;font-size:14px;opacity:.75}
@media (hover:hover){.card.tap:hover .taphint{opacity:1}}
.card.plain{background:var(--surface);color:var(--ink);border:2px dashed var(--line)}
.stacknav{display:flex;align-items:center;justify-content:center;gap:16px;margin-top:-8px}
.stacknav .iconbtn:disabled{opacity:.35;cursor:default}
.stacknav span{font-weight:800;font-size:14px;color:var(--muted);min-width:64px;text-align:center;font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion: reduce){.card{transition:none}}
.card .when{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:13px;letter-spacing:.06em;text-transform:uppercase}
.card .when b{font-family:var(--f-display);font-size:15px;letter-spacing:0;background:var(--blockink);color:#FFFFFF;padding:4px 10px;border-radius:999px;font-weight:600;font-variant-numeric:tabular-nums}
.card.plain .when b{background:var(--ink);color:var(--bg)}
.card h2{font-size:27px}
.card .grow{flex:1}
.card .acts{display:flex;gap:8px;flex-wrap:wrap}
.small{appearance:none;border:2px solid currentColor;background:transparent;border-radius:999px;padding:7px 14px;font-weight:800;font-size:14px;cursor:pointer}
.small.solid{background:var(--blockink);border-color:var(--blockink);color:#FFFFFF}
.ev{font-weight:800;font-size:12.5px;display:inline-flex;align-items:center;gap:6px}
.ev i{letter-spacing:2px;font-style:normal;font-size:11px}
.dots{display:flex;gap:6px;justify-content:center}
.dots span{width:8px;height:8px;border-radius:50%;background:var(--line)}
.box{background:var(--surface);border-radius:24px;padding:18px 20px;display:flex;flex-direction:column;gap:10px}
.box ul,.box ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.box h3{font-size:18px}
.alert{background:var(--warn-bg);border-radius:22px;padding:16px 18px;display:flex;flex-direction:column;gap:4px}
.alert b{color:var(--warn);font-family:var(--f-display);font-size:18px;font-weight:600}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row input{flex:1;min-width:0}
input[type="text"],input[type="search"],input[type="date"],textarea{font:inherit;font-size:16px;padding:13px 15px;border-radius:16px;border:2px solid var(--line);background:var(--surface);color:var(--ink);width:100%}
textarea{min-height:88px;resize:vertical}
.btn{appearance:none;border:0;cursor:pointer;border-radius:16px;padding:13px 18px;background:var(--ink);color:var(--bg);font-weight:800}
.btn.alt{background:var(--surface);color:var(--ink);border:2px solid var(--line)}
.hint{font-size:13.5px;color:var(--muted);font-weight:600}
.label{font-weight:800;font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
/* library */
.lib{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.groups{display:flex;flex-direction:column;gap:20px}
.grp .gh{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.grp .gh h2{font-size:21px;display:flex;align-items:center;gap:8px}
.grp .gh h2 span{font:800 12px var(--f-body);color:var(--blockink);border-radius:999px;padding:2px 9px}
.gall{appearance:none;border:0;cursor:pointer;flex:none;font:inherit;font-weight:800;font-size:13px;color:var(--ink);background:var(--surface);box-shadow:0 1px 0 var(--line);border-radius:999px;padding:6px 13px;transition:transform .12s}
.gall:active{transform:scale(.94)}
.hrow{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;scroll-snap-type:x mandatory;padding:2px 0 4px;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch;touch-action:pan-x pan-y;scroll-behavior:smooth}
.hrow::-webkit-scrollbar{display:none}
.lt.mini{flex:none;width:calc((100% - 10px) / 2);min-height:128px;scroll-snap-align:start;transition:opacity .15s}
.lt.mini:active{transform:none;opacity:.8}
.pdots{display:flex;justify-content:center;gap:6px;margin-top:8px}
.pdots i{width:6px;height:6px;border-radius:3px;background:var(--line);transition:width .25s,background .25s}
.pdots i.on{width:18px;background:var(--ink)}
.lt.mini b{font-size:16px}

.lt{appearance:none;border:0;cursor:pointer;border-radius:20px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:150px}
.lt b{font-family:var(--f-display);font-size:17.5px;line-height:1.15;font-weight:600}
.lt .meta{font-weight:800;font-size:12px;opacity:.75;margin-top:auto}
.lt span.c{font-weight:800;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;opacity:.7}
.study{background:var(--surface);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.st-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.st-yr{font-family:var(--f-display);font-weight:700;font-size:22px;line-height:1;color:var(--muted);font-variant-numeric:tabular-nums}
.study h3{font-size:18px;line-height:1.25}
.study p{font-size:15px}
.study .cite{font-size:13px;color:var(--muted);line-height:1.4}
.st-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;border-top:2px dashed var(--line);padding-top:12px}
.st-tags{display:flex;flex-wrap:wrap;gap:6px}
.st-tag{font-size:12px;font-weight:700;color:var(--muted);border:1.5px solid var(--line);border-radius:999px;padding:2px 9px}
.study a{appearance:none;text-decoration:none;color:var(--bg);background:var(--ink);font-weight:800;font-size:13.5px;border-radius:999px;padding:7px 13px;white-space:nowrap}
.tagpill{display:inline-block;font-weight:800;font-size:11.5px;padding:3px 9px;border-radius:999px;margin-right:4px}
details.g{border-radius:22px;overflow:hidden}
details.g summary{list-style:none;cursor:pointer;padding:16px 18px;font-family:var(--f-display);font-size:19px;font-weight:600;display:flex;justify-content:space-between;gap:10px}
details.g summary::-webkit-details-marker{display:none}
details.g summary::after{content:"+";font-weight:700}
details.g[open] summary::after{content:"–"}
details.g .gb{background:var(--surface);color:var(--ink);padding:16px 18px;display:flex;flex-direction:column;gap:10px;font-size:15px}
.gb ul,.gb ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.gb .hint{font-size:13px}
/* notes */
.seg{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:4px;background:var(--line);padding:4px;border-radius:16px}
.seg button{appearance:none;border:0;background:transparent;border-radius:12px;padding:11px 4px;font:inherit;font-weight:800;font-size:14px;color:var(--muted);cursor:pointer;transition:background .15s}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.15)}
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cgrid>:last-child:nth-child(odd){grid-column:1/-1}
.cpick{appearance:none;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:16px;padding:10px 12px;min-height:60px;display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left;cursor:pointer;font:inherit;transition:transform .12s ease,background .15s,border-color .15s}
.cpick:active{transform:scale(.97)}
.cpick>span{min-width:0}
.cpick b{display:block;font-weight:800;font-size:14.5px;line-height:1.25}
.cpick small{display:block;font-size:12px;color:var(--muted);font-weight:600;line-height:1.3}
.cpick .ck{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center}
.cpick[aria-pressed="true"]{border-color:var(--ink);background:color-mix(in srgb,var(--mint) 30%,var(--surface))}
.cpick[aria-pressed="true"] .ck{background:var(--ink);border-color:var(--ink)}
.cpick[aria-pressed="true"] .ck::after{content:"";width:9px;height:5px;border-left:2.5px solid var(--bg);border-bottom:2.5px solid var(--bg);transform:rotate(-45deg) translate(1px,-1px)}
.cpick.crisis{width:100%;border-color:transparent;background:rgba(255,59,48,.36)}
.cpick.crisis .ck{border-color:rgba(255,59,48,.65)}
.cpick.crisis b{color:var(--ink)}
.cpick.crisis[aria-pressed="true"]{border-color:transparent;background:rgba(255,59,48,.58)}
.cpick.crisis[aria-pressed="true"] .ck{background:var(--warn);border-color:var(--warn)}
.rows{display:flex;flex-direction:column;gap:6px}
.rowbtn{appearance:none;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:14px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;font:inherit;cursor:pointer;text-align:left}
.rowbtn b{font-weight:800}.swr{position:relative;border-radius:14px;overflow:hidden;transition:height .26s ease,opacity .26s ease,margin .26s ease}
.swr .rowbtn{position:relative;z-index:1;width:100%;touch-action:pan-y;transition:transform .28s cubic-bezier(.2,.9,.3,1.15)}
.swr.drag .rowbtn{transition:none}
.swdel{position:absolute;inset:0 0 0 auto;width:110px;appearance:none;border:0;cursor:pointer;background:#F2362B;color:#fff;font:inherit;font-weight:800;font-size:14px;
  display:flex;align-items:center;justify-content:flex-end;gap:6px;padding-right:16px;border-radius:14px;opacity:0;transition:opacity .15s}
.swr.open .swdel,.swr.drag .swdel{opacity:1}
.swdel svg{width:18px;height:18px;fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.swdel:active{background:#D61F15}
.lh{display:flex;justify-content:space-between;align-items:center}
.seeall{appearance:none;border:0;cursor:pointer;background:var(--surface);box-shadow:0 1px 0 var(--line);color:var(--ink);font:inherit;font-weight:800;font-size:13px;border-radius:999px;padding:5px 12px;transition:transform .12s}
.seeall:active{transform:scale(.95)}

 {id:"lloydevans2014",a:"Lloyd-Evans B, Mayo-Wilson E, Harrison B, et al.",y:2014,t:"A systematic review and meta-analysis of randomised controlled trials of peer support for people with severe mental illness",j:"BMC Psychiatry",v:"14:39",type:"Meta-analysis",tags:["Peer support","Recovery"],
  f:"Pooled 18 trials. Found little evidence that peer support changed hospital admission or overall symptoms, but some evidence for gains in hope, recovery, and empowerment. Authors flagged risk of bias in many trials."},
 {id:"fuhr2014",a:"Fuhr DC, Salisbury TT, De Silva MJ, et al.",y:2014,t:"Effectiveness of peer-delivered interventions for severe mental illness and depression on clinical and psychosocial outcomes: a systematic review and meta-analysis",j:"Social Psychiatry and Psychiatric Epidemiology",v:"49(11):1691-1702",type:"Meta-analysis",tags:["Peer support","Depression"],
  f:"For serious mental illness, peer-delivered care produced outcomes comparable to care from professionals, with a modest gain in hope. For depression, peer support showed a benefit over usual care."},
 {id:"pitt2013",a:"Pitt V, Lowe D, Hill S, et al.",y:2013,t:"Consumer-providers of care for adult clients of statutory mental health services",j:"Cochrane Database of Systematic Reviews",v:"Issue 3, CD004807",type:"Systematic review",tags:["Peer support"],
  f:"People with lived experience working as providers achieved psychosocial, symptom, and service-use outcomes similar to non-peer staff. No evidence of harm was found."},
 {id:"white2020",a:"White S, Foster R, Marks J, et al.",y:2020,t:"The effectiveness of one-to-one peer support in mental health services: a systematic review and meta-analysis",j:"BMC Psychiatry",v:"20:534",type:"Meta-analysis",tags:["Peer support","Recovery"],
  f:"One-to-one peer support had small positive effects on self-reported recovery, hope, and empowerment. Effects on clinical symptoms and hospitalization were not clearly established."},
 {id:"smit2023",a:"Smit D, Miguel C, Vrijsen JN, et al.",y:2023,t:"The effectiveness of peer support for individuals with mental illness: systematic review and meta-analysis",j:"Psychological Medicine",v:"53(11):5332-5341",type:"Meta-analysis",tags:["Peer support","Recovery"],
  f:"Pooled 28 randomized trials (about 4,150 people). Peer support produced small but significant improvements in both clinical recovery and personal recovery. Study quality was modest."},
 {id:"johnson2018",a:"Johnson S, Lamb D, Marston L, et al.",y:2018,t:"Peer-supported self-management for people discharged from a mental health crisis team: a randomised controlled trial",j:"The Lancet",v:"392(10145):409-418",type:"RCT",tags:["Peer support","Crisis","Transitions"],
  f:"After discharge from crisis care, people who worked through a self-management workbook with a peer worker had fewer readmissions to acute care over the following year than controls."},
 {id:"davidson2012",a:"Davidson L, Bellamy C, Guy K, Miller R",y:2012,t:"Peer support among persons with severe mental illnesses: a review of evidence and experience",j:"World Psychiatry",v:"11(2):123-128",type:"Review",tags:["Peer support","Recovery"],
  f:"Peer staff performed at least as well as non-peer staff, with some evidence of better engagement among people hard to reach through traditional services, plus gains in hope and self-care."},
 {id:"repper2011",a:"Repper J, Carter T",y:2011,t:"A review of the literature on peer support in mental health services",j:"Journal of Mental Health",v:"20(4):392-411",type:"Review",tags:["Peer support"],
  f:"Peer workers were associated with increased hope, empowerment, and social inclusion for the people they served. The review also described workplace challenges like role clarity and boundaries."},
 {id:"shalaby2020",a:"Shalaby RAH, Agyapong VIO",y:2020,t:"Peer support in mental health: literature review",j:"JMIR Mental Health",v:"7(6):e15572",type:"Review",tags:["Peer support"],
  f:"Summarized peer support models, benefits for service users and for peers themselves, and recurring barriers including stigma from colleagues, unclear roles, and limited training."},
 {id:"solomon2004",a:"Solomon P",y:2004,t:"Peer support/peer provided services underlying processes, benefits, and critical ingredients",j:"Psychiatric Rehabilitation Journal",v:"27(4):392-401",type:"Theory",tags:["Peer support"],
  f:"Defined categories of peer services and explained why they work, pointing to experiential knowledge, social support, and the helper-therapy principle, where helping others benefits the helper."},
 {id:"mead2001",a:"Mead S, Hilton D, Curtis L",y:2001,t:"Peer support: a theoretical perspective",j:"Psychiatric Rehabilitation Journal",v:"25(2):134-141",type:"Theory",tags:["Peer support"],

 {id:"leamy2011",a:"Leamy M, Bird V, Le Boutillier C, Williams J, Slade M",y:2011,t:"Conceptual framework for personal recovery in mental health: systematic review and narrative synthesis",j:"British Journal of Psychiatry",v:"199(6):445-452",type:"Systematic review",tags:["Recovery"],

 {id:"cook2012",a:"Cook JA, Copeland ME, Jonikas JA, et al.",y:2012,t:"Results of a randomized controlled trial of mental illness self-management using Wellness Recovery Action Planning",j:"Schizophrenia Bulletin",v:"38(4):881-891",type:"RCT",tags:["Recovery","Skills"],

 {id:"bassuk2016",a:"Bassuk EL, Hanson J, Greene RN, Richard M, Laudet A",y:2016,t:"Peer-delivered recovery support services for addictions in the United States: a systematic review",j:"Journal of Substance Abuse Treatment",v:"63:1-9",type:"Systematic review",tags:["Substance use","Peer support"],

 {id:"eddie2019",a:"Eddie D, Hoffman L, Vilsaint C, et al.",y:2019,t:"Lived experience in new models of care for substance use disorder: a systematic review of peer recovery support services and recovery coaching",j:"Frontiers in Psychology",v:"10:1052",type:"Systematic review",tags:["Substance use","Peer support"],
  f:"Peer recovery support was associated with less substance use, better treatment retention, and lower relapse rates. The evidence base was still described as developing."},
 {id:"stanley2018",a:"Stanley B, Brown GK, Brenner LA, et al.",y:2018,t:"Comparison of the Safety Planning Intervention with follow-up vs usual care of suicidal patients treated in the emergency department",j:"JAMA Psychiatry",v:"75(9):894-900",type:"Cohort study",tags:["Crisis","Skills"],
  f:"In a comparison of 1,640 veterans across nine emergency departments, a safety plan plus follow-up calls was linked to about 45% fewer suicidal behaviors over six months and about double the odds of attending outpatient care, compared with usual care. Not randomized."},
 {id:"balban2023",a:"Balban MY, Neri E, Kogon MM, et al.",y:2023,t:"Brief structured respiration practices enhance mood and reduce physiological arousal",j:"Cell Reports Medicine",v:"4(1):100895",type:"RCT",tags:["Anxiety","Skills"],

 {id:"zaccaro2018",a:"Zaccaro A, Piarulli A, Laurino M, et al.",y:2018,t:"How breath-control can change your life: a systematic review on psycho-physiological correlates of slow breathing",j:"Frontiers in Human Neuroscience",v:"12:353",type:"Systematic review",tags:["Anxiety","Skills"],

 {id:"khoury2015",a:"Khoury B, Sharma M, Rush SE, Fournier C",y:2015,t:"Mindfulness-based stress reduction for healthy individuals: a meta-analysis",j:"Journal of Psychosomatic Research",v:"78(6):519-528",type:"Meta-analysis",tags:["Stress","Skills"],

 {id:"hofmann2012",a:"Hofmann SG, Asnaani A, Vonk IJJ, Sawyer AT, Fang A",y:2012,t:"The efficacy of cognitive behavioral therapy: a review of meta-analyses",j:"Cognitive Therapy and Research",v:"36(5):427-440",type:"Review of meta-analyses",tags:["Anxiety","Depression","Skills"],

 {id:"ekers2014",a:"Ekers D, Webster L, Van Straten A, et al.",y:2014,t:"Behavioural activation for depression; an update of meta-analysis of effectiveness and sub group analysis",j:"PLoS ONE",v:"9(6):e100100",type:"Meta-analysis",tags:["Depression","Skills"],

 {id:"cuijpers2018",a:"Cuijpers P, de Wit L, Kleiboer A, Karyotaki E, Ebert DD",y:2018,t:"Problem-solving therapy for adult depression: an updated meta-analysis",j:"European Psychiatry",v:"48:27-37",type:"Meta-analysis",tags:["Depression","Stress","Skills"],

 {id:"schuch2016",a:"Schuch FB, Vancampfort D, Richards J, et al.",y:2016,t:"Exercise as a treatment for depression: a meta-analysis adjusting for publication bias",j:"Journal of Psychiatric Research",v:"77:42-51",type:"Meta-analysis",tags:["Depression","Skills"],

 {id:"lundahl2010",a:"Lundahl BW, Kunz C, Brownell C, Tollefson D, Burke BL",y:2010,t:"A meta-analysis of motivational interviewing: twenty-five years of empirical studies",j:"Research on Social Work Practice",v:"20(2):137-160",type:"Meta-analysis",tags:["Substance use","Skills"],

 {id:"masi2011",a:"Masi CM, Chen HY, Hawkley LC, Cacioppo JT",y:2011,t:"A meta-analysis of interventions to reduce loneliness",j:"Personality and Social Psychology Review",v:"15(3):219-266",type:"Meta-analysis",tags:["Connection"],

 {id:"holtlunstad2010",a:"Holt-Lunstad J, Smith TB, Layton JB",y:2010,t:"Social relationships and mortality risk: a meta-analytic review",j:"PLoS Medicine",v:"7(7):e1000316",type:"Meta-analysis",tags:["Connection"],

 {id:"g54321",name:"5-4-3-2-1 Grounding",cat:"Regulate",roles:["open","core"],min:5,demand:1,fit:{anxiety:3,trauma:3,stress:2,anger:2,substance:1,crisis:1},ev:"Practice",refs:[],
  sum:"Use the five senses to pull attention back to the room.",
  steps:["Ask for a 0-10 rating of how distressed they feel.","Name 5 things you can see, slowly and out loud.","Name 4 things you can feel (feet on floor, chair at your back).","Name 3 things you can hear.","Name 2 things you can smell, or 2 smells you like.","Name 1 thing you can taste, or take a sip of water.","Rate distress again and ask what changed."],
  why:"Directing attention to present sensory input interrupts worry and intrusive memories. It is a staple of distress-tolerance skills training; trials of this exact exercise are limited.",
  ad:{nfmh:"Keep it seated and allow pointing instead of naming if speech is hard.",community:"Works anywhere, including a car or park bench. Nothing to carry.",group:"Go around the room, one sense per person."}},
 {id:"sigh",name:"Physiological Sigh",cat:"Regulate",roles:["open"],min:5,demand:1,fit:{anxiety:3,stress:3,anger:2,sleep:1,trauma:1,crisis:1},ev:"Moderate",refs:["balban2023","zaccaro2018"],
  sum:"Two inhales through the nose, one long exhale. Lowers arousal fast.",
  steps:["Breathe in through the nose.","Take a second short sip of air on top to fill the lungs.","Exhale slowly through the mouth, longer than the inhale.","Repeat for 1 to 5 minutes at a comfortable pace.","Check in: what do you notice in your body now?"],
  why:"A long exhale slows heart rate. In a month-long trial, daily cyclic sighing improved mood more than mindfulness meditation.",
  ad:{nfmh:"Check with nursing for anyone with COPD or breathing restrictions; keep it gentle.",community:"Discreet enough to do in public.",group:"Lead three rounds together to settle the room at the start."}},
 {id:"paced",name:"Slow Paced Breathing",cat:"Regulate",roles:["open","core"],min:6,demand:1,fit:{anxiety:3,stress:2,sleep:2,anger:1},ev:"Moderate",refs:["zaccaro2018"],
  sum:"Breathe in for 4, out for 6, about six breaths a minute.",
  steps:["Sit with feet flat and one hand on the belly.","Breathe in through the nose for a count of 4.","Breathe out for a count of 6.","Continue for 5 minutes. If counting is stressful, just lengthen the exhale.","Practice once a day so it's available when stress spikes."],
  why:"Breathing near six per minute raises heart rate variability, a marker of the body's calming system.",
  ad:{nfmh:"Shorten to 3 minutes; counting out loud for them helps.",community:"Suggest practicing at a set time, like before bed.",group:"Use a slow count out loud or a visual like raising a hand on the inhale."}},
 {id:"pmr",name:"Progressive Muscle Relaxation",cat:"Regulate",roles:["core"],min:12,demand:1,fit:{anxiety:3,stress:3,sleep:3,anger:2},ev:"Strong",refs:["manzoni2008"],
  sum:"Tense and release muscle groups to feel the difference between tight and relaxed.",
  steps:["Get comfortable. Eyes can be open or closed.","Make fists for 5 seconds, then release for 10. Notice the change.","Move through arms, shoulders (lift to ears), face, stomach, legs, feet.","Tense to about half effort, never to pain.","Finish with three slow breaths and a check-in."],
  why:"Relaxation training has a medium-to-large effect on anxiety in pooled trials and helps with falling asleep.",

 {id:"bodyscan",name:"Body Scan",cat:"Regulate",roles:["core"],min:10,demand:1,fit:{stress:2,sleep:2,anxiety:2},ev:"Moderate",refs:["khoury2015"],
  sum:"Slowly move attention through the body, noticing without changing anything.",
  steps:["Invite a comfortable position; eyes open is fine.","Start at the feet and move attention upward a region at a time.","Notice sensations: warmth, pressure, tightness, nothing at all.","When the mind wanders, return to the last area without judgment.","Close by asking what they noticed."],
  why:"A core MBSR practice. In pooled studies of healthy adults, MBSR produced large reductions in stress.",
  ad:{nfmh:"Keep it to 5 minutes; some residents find body focus distressing, so offer breath or sound as an anchor instead.",community:"Better in a quiet indoor space.",group:"Give the option to keep eyes open and stay aware of the room. For trauma survivors, offer an exit."}},
 {id:"mindful",name:"Mindful Minute",cat:"Regulate",roles:["open","close"],min:3,demand:1,fit:{stress:2,anxiety:2,depression:1},ev:"Moderate",refs:["khoury2015"],
  sum:"One minute of noticing breath and sounds to arrive in the session.",
  steps:["Set a one-minute timer.","Notice the breath going in and out.","When thoughts show up, name them 'thinking' and return to the breath.","When the timer ends, ask for one word to describe how they feel."],

 {id:"window",name:"Window of Tolerance Map",cat:"Learn",roles:["core"],min:15,demand:2,fit:{trauma:3,anxiety:2,anger:2,crisis:1},ev:"Practice",refs:[],writing:true,
  sum:"Map the zones of too much, just right, and too little, and what moves you between them.",
  steps:["Draw three bands: top (overwhelmed, panicky, angry), middle (able to think and feel), bottom (numb, shut down).","Ask what each zone looks and feels like for them.","List early signs they're leaving the middle zone.","List what helps them come back from above and from below.","Keep the map for future sessions."],
  why:"Gives shared language for overwhelm and helps people choose a skill that matches their state. It's psychoeducation drawn from trauma-informed care, not a tested standalone treatment.",
  ad:{nfmh:"Use simple words like 'too revved up' and 'too shut down'. You can draw it for them.",community:"Do it verbally and send a photo of the drawing if allowed.",group:"Draw it on a board and collect examples from the room."}},
 {id:"container",name:"Container Exercise",cat:"Regulate",roles:["close"],min:5,demand:1,fit:{trauma:2,anxiety:1,stress:1,grief:1},ev:"Practice",refs:[],
  sum:"Imagine placing hard thoughts in a secure container to set them down until later.",
  steps:["Ask them to picture a container strong enough to hold what came up today.","Let them describe it: size, lock, where it's kept.","Imagine placing today's difficult thoughts inside and closing it.","Remind them they can open it again with support.","End with a grounding breath."],

 {id:"ba",name:"Plan One Small Thing",cat:"Act",roles:["core"],min:12,demand:2,fit:{depression:3,hope:2,lonely:1,grief:1,transition:1},ev:"Strong",refs:["ekers2014"],
  sum:"Behavioral activation: schedule one specific, doable activity before the next visit.",
  steps:["Explain the idea: action comes before motivation, not after.","Pick one activity that's either enjoyable or gives a sense of accomplishment.","Make it smaller than feels necessary (5 minutes of a walk, not 30).","Decide the day, time, and place.","Name what might get in the way and a backup plan.","Follow up next session without judgment."],
  why:"Behavioral activation is as effective as CBT for depression and simple enough to support in peer sessions.",
  ad:{nfmh:"Choose activities possible within facility routines, like the courtyard or activity room.",community:"Can do the first step together during the session.",group:"Each person names their small thing and reports back next week."}},
 {id:"pleasure",name:"Enjoy and Achieve List",cat:"Act",roles:["core"],min:12,demand:2,fit:{depression:3,hope:2,selfworth:1},ev:"Strong",refs:["ekers2014"],writing:true,
  sum:"Build a personal menu of activities that bring enjoyment or a sense of accomplishment.",

 {id:"values",name:"Values Compass",cat:"Reflect",roles:["core"],min:15,demand:2,fit:{hope:3,depression:2,transition:2,substance:2,selfworth:2},ev:"Moderate",refs:["atjak2015"],

 {id:"selfcomp",name:"Self-Compassion Break",cat:"Reflect",roles:["core","close"],min:7,demand:1,fit:{selfworth:3,grief:2,depression:2,trauma:1,anxiety:1},ev:"Moderate",refs:["macbeth2012"],

 {id:"ccc",name:"Catch, Check, Change",cat:"Reflect",roles:["core"],min:15,demand:3,fit:{anxiety:2,depression:2,selfworth:2,anger:2},ev:"Moderate",refs:["hofmann2012"],writing:true,

 {id:"urge",name:"Urge Surfing",cat:"Regulate",roles:["core"],min:10,demand:2,fit:{substance:3,anger:2},ev:"Emerging",refs:["bowen2009"],

 {id:"triggers",name:"Trigger and Coping Map",cat:"Plan",roles:["core"],min:15,demand:2,fit:{substance:3,trauma:2,anger:2,anxiety:1},ev:"Moderate",refs:["cook2012","bassuk2016"],writing:true,

 {id:"wrap",name:"Wellness Toolbox (WRAP)",cat:"Plan",roles:["core"],min:20,demand:2,fit:{hope:2,depression:2,substance:2,transition:2,crisis:1,anxiety:1},ev:"Moderate",refs:["cook2012"],writing:true,

 {id:"safety",name:"Safety Plan",cat:"Plan",roles:["core"],min:20,demand:2,fit:{crisis:5,hope:1},ev:"Moderate",refs:["stanley2018"],writing:true,
  sum:"Stanley-Brown style plan: warning signs, coping, people, professionals, safer environment.",

 {id:"sleep",name:"Wind-Down Routine",cat:"Act",roles:["core"],min:12,demand:1,fit:{sleep:3,anxiety:1,stress:1,depression:1},ev:"Moderate",refs:["trauer2015"],

 {id:"writing",name:"Expressive Writing",cat:"Reflect",roles:["core"],min:15,demand:2,fit:{grief:2,stress:2,trauma:1,relation:1},ev:"Emerging",refs:["frattaroli2006"],writing:true,

 {id:"gratitude",name:"Three Good Things",cat:"Reflect",roles:["close"],min:5,demand:1,fit:{depression:1,hope:2,selfworth:1},ev:"Emerging",refs:["davis2016"],

 {id:"connect",name:"Connection Map",cat:"Connect",roles:["core"],min:15,demand:2,fit:{lonely:3,transition:2,relation:2,substance:1,hope:1},ev:"Moderate",refs:["masi2011","holtlunstad2010"],writing:true,

 {id:"story",name:"Purposeful Recovery Story",cat:"Connect",roles:["core"],min:10,demand:1,fit:{hope:3,selfworth:2,lonely:2,substance:2,depression:1},ev:"Moderate",refs:["davidson2012","mead2001"],

 {id:"oars",name:"Change Talk Conversation",cat:"Connect",roles:["core"],min:15,demand:2,fit:{substance:3,hope:2,transition:2,anger:1,depression:1},ev:"Moderate",refs:["lundahl2010"],

 {id:"griefbonds",name:"Memory Sharing",cat:"Connect",roles:["core"],min:15,demand:1,fit:{grief:3,lonely:1},ev:"Practice",refs:["wittouck2011"],
  sum:"Invite stories about the person who died and ways to stay connected.",

 {id:"stop",name:"STOP and Time-Out Plan",cat:"Regulate",roles:["core","open"],min:10,demand:2,fit:{anger:3,relation:2,substance:1,stress:1},ev:"Moderate",refs:["lee2018"],
  sum:"DBT's STOP skill: Stop, Take a step back, Observe, Proceed mindfully, plus a plan for stepping away.",
  steps:["Name the earliest body signs of anger (jaw, fists, heat).","Practice STOP: Stop (freeze, don't react), Take a step back (step away or take a breath), Observe what's happening inside and around you, Proceed mindfully (ask what will make things better or worse).","Build a time-out plan: what you'll say, where you'll go, how long, when you'll come back.","Rehearse once out loud."],

 {id:"istate",name:"I-Statements and Boundaries",cat:"Connect",roles:["core"],min:12,demand:2,fit:{relation:3,anger:2,selfworth:1},ev:"Practice",refs:[],

 {id:"hopemap",name:"Hope Map",cat:"Plan",roles:["core","close"],min:12,demand:2,fit:{hope:3,transition:2,depression:1,substance:1},ev:"Moderate",refs:["snyder2002"],writing:true,

 {id:"nextstep",name:"One Next Step",cat:"Plan",roles:["close"],min:4,demand:1,fit:{},ev:"Practice",refs:[],

  ,{id:"tipp",src:"DBT",name:"TIPP for Intense Emotion",cat:"Regulate",roles:["open","core"],min:8,demand:1,fit:{anger:3,anxiety:3,stress:2,substance:2},ev:"Emerging",refs:["valentine2015","zaccaro2018"],
   sum:"Four fast ways to bring big emotion down when it's too high to think: temperature, intense movement, paced breathing, paired relaxation.",
   steps:["Rate the emotion 0-10. TIPP is for when it's 7 or higher.","Temperature: lean over and put your face in cold water, or hold a cold pack or cold, wet cloth over your eyes and cheeks, while holding your breath for about 30 seconds. Keep the water above 50°F.","Intense movement: if able, walk fast or march in place for 1-2 minutes.","Paced breathing: breathe out longer than you breathe in, about 5-6 breaths a minute.","Paired relaxation: tense a muscle group on the in-breath, let go on the out-breath.","Rate again. Use whichever part helped most next time."],
   why:"A DBT distress-tolerance skill that works on the body first, because intense arousal makes problem-solving hard. Cold water on the face triggers the dive reflex, which quickly slows the heart. Caution from the DBT handout: very cold water lowers heart rate fast, so anyone with a heart or medical condition, a low heart rate from medication, or an eating disorder should get medical approval first. Skip intense movement if mobility is limited.",
   ad:{nfmh:"Seated version: cool cloth, paced breathing, and paired relaxation only.",community:"A cold bottle of water from a store works for the first step.",group:"Teach it as a menu and let each person pick one part to practice."}}
  ,{id:"wisemind",src:"DBT",name:"Wise Mind",cat:"Reflect",roles:["core","close"],min:10,demand:2,fit:{anger:2,relation:2,substance:2,stress:2,selfworth:1,transition:2},ev:"Emerging",refs:["valentine2015","neacsiu2010"],
   sum:"Find the middle ground between emotion mind and reasonable mind before making a choice.",
   steps:["Draw two overlapping circles: emotion mind and reasonable mind.","Ask: what does emotion mind want right now? What does reasonable mind say?","The overlap is wise mind: what feels right and makes sense.","Take three slow breaths and ask quietly, \"What would wise mind do?\"","Notice the first calm answer. Check it isn't just one side talking.","Name one action that fits wise mind."],
   why:"A core DBT mindfulness skill. It gives people a simple frame for pausing between a feeling and a decision. Evidence comes from DBT skills training as a whole rather than this exercise alone.",
   ad:{nfmh:"Draw the circles for them and point instead of writing.",community:"Sketch it on a napkin or phone note.",group:"Have members share a time they acted from each 'mind'."}}
  ,{id:"whatskills",src:"DBT",name:"Observe, Describe, Participate",cat:"Regulate",roles:["open","core"],min:8,demand:1,fit:{anxiety:2,stress:2,trauma:1,depression:1,anger:1},ev:"Emerging",refs:["khoury2015","valentine2015"],
   sum:"DBT's three 'what' skills: notice without reacting, put words to it, then throw yourself into the moment.",
   steps:["Observe: pick one thing (a sound, a breath, an object). Just notice it for 30 seconds.","Describe: put words to only the facts. \"I hear a fan. My hands are warm.\"","Leave out judgments like good, bad, should.","Participate: choose a simple activity (folding a towel, a song) and do it with full attention.","Debrief: what pulled attention away, and how did you bring it back?"],
   why:"Mindfulness practice has moderate evidence for reducing stress and anxiety. These three steps are the beginner mindfulness skills taught in DBT groups.",
   ad:{nfmh:"Use a familiar object like a photo or blanket.",community:"Observe the scene around you on a walk.",group:"Pass an object around; each person describes one fact about it."}}
  ,{id:"accepts",src:"DBT",name:"ACCEPTS Distraction",cat:"Plan",roles:["core"],min:12,demand:1,fit:{substance:3,anxiety:2,stress:2,anger:2,crisis:1,grief:1},ev:"Emerging",refs:["valentine2015"],
   sum:"Seven ways to ride out a crisis urge without making it worse: Activities, Contributing, Comparisons, Emotions, Pushing away, Thoughts, Sensations.",
   steps:["Explain this is short-term: distraction gets you through the wave, not the problem.","Go through each letter and write one idea that would work for them.","Activities: a game, a show, a chore.","Contributing: help someone, send a kind text.","Comparisons: a time you got through something hard.","Emotions: a funny video or an uplifting song.","Pushing away: put the problem on a shelf until a set time.","Thoughts: count, puzzle, name things by category.","Sensations: a strong mint, a warm shower, squeezing a stress ball.","Circle the top three to try first."],
   why:"A DBT distress-tolerance skill. Planned distraction helps people avoid acting on urges while an emotion peaks. Pair it with a safety plan if risk is present.",
   ad:{nfmh:"Pick ideas that work in their room and schedule.",community:"Save the list in their phone notes.",group:"Build one shared list on a whiteboard."}}
  ,{id:"improve",src:"DBT",name:"IMPROVE the Moment",cat:"Regulate",roles:["core"],min:10,demand:1,fit:{stress:3,grief:2,anxiety:2,depression:1,hope:2},ev:"Practice",refs:["valentine2015"],
   sum:"Make a painful moment more bearable with Imagery, Meaning, Prayer, Relaxation, One thing, Vacation, Encouragement.",
   steps:["Imagery: picture a safe, calm place in detail.","Meaning: find any purpose or lesson, even small.","Prayer or connecting to something bigger, if that fits their beliefs.","Relaxation: loosen the shoulders, unclench the jaw.","One thing in the moment: focus only on what you're doing now.","Vacation: take a short, planned break.","Encouragement: say a supportive phrase out loud.","Ask which two they'd actually use."],
   why:"A DBT distress-tolerance skill for times a situation can't be changed right away. Offer prayer only if the person brings faith up or welcomes it.",
   ad:{nfmh:"Imagery and encouragement work well bedside.",community:"A 10-minute 'vacation' could be a walk or a coffee.",group:"Each member writes their own encouragement phrase."}}
  ,{id:"soothekit",src:"DBT",name:"Self-Soothe Kit",cat:"Plan",roles:["core","close"],min:12,demand:1,fit:{anxiety:2,stress:3,grief:2,sleep:2,trauma:2,lonely:1},ev:"Practice",refs:["valentine2015"],
   sum:"Build a small kit of comforting things for each of the five senses.",

   why:"A DBT distress-tolerance skill. Having comfort ready ahead of time makes it easier to reach for in a hard moment instead of an unhealthy habit.",

  ,{id:"proscons",src:"DBT",name:"Pros and Cons of an Urge",cat:"Reflect",roles:["core"],min:12,demand:2,fit:{substance:3,anger:2,relation:1,crisis:1},ev:"Emerging",refs:["valentine2015","bowen2009"],
   sum:"A four-box grid comparing acting on an urge with resisting it, short term and long term.",
   steps:["Name the urge (use, lash out, quit, isolate).","Draw a four-box grid: pros and cons of acting on it, pros and cons of resisting.","Fill in short-term and long-term effects in each box.","Look at the long-term column together.","Ask: which choice fits the life you want?","Keep the grid somewhere they'll see it when the urge hits."],
   why:"A DBT distress-tolerance skill that makes the long-term cost of an urge visible in the moment. Done ahead of time, it gives people something to read when thinking is foggy.",
   ad:{nfmh:"Use it for urges like refusing care or isolating.",community:"Photograph the grid so it's on their phone.",group:"Work one example together, then individually."}}
  ,{id:"radaccept",src:"DBT",name:"Radical Acceptance",cat:"Reflect",roles:["core"],min:15,demand:2,fit:{grief:3,transition:3,stress:2,anger:2,selfworth:1},ev:"Emerging",refs:["valentine2015"],
   sum:"Accept reality as it is, without approving of it, so the fight with what can't change stops adding suffering.",
   steps:["Explain: pain + not accepting = suffering. Acceptance is not approval.","Name a fact they keep fighting (a loss, a diagnosis, a past event).","Notice body signs of fighting it: clenched jaw, tight chest.","Practice the words: \"It is what it is. I can't change that it happened.\"","Relax the hands, open the palms, breathe out slowly.","Ask: now that this is accepted, what can I do next?","Expect to repeat it. Acceptance often has to be chosen many times."],
   why:"A DBT distress-tolerance skill. Struggling against facts that can't change tends to keep distress high. Go gently with fresh grief or trauma, and don't use it to accept anything unsafe.",
   ad:{nfmh:"Fits losses of independence, home, or health.",community:"Use it for housing or legal situations they can't change today.",group:"Share examples of 'turning the mind' toward acceptance."}}
  ,{id:"willing",src:"DBT",name:"Willing Hands and Half-Smile",cat:"Regulate",roles:["open","close"],min:4,demand:1,fit:{anger:3,stress:2,relation:2,grief:1},ev:"Practice",refs:["valentine2015"],
   sum:"Use the body to soften resistance: relaxed open palms and a slight upturn of the lips.",
   steps:["Notice tight fists, crossed arms, or a clenched jaw.","Willing hands: rest hands on the thighs, palms up, fingers relaxed.","Half-smile: relax the face and let the lips turn up just slightly.","Hold for 1-2 minutes while breathing slowly.","Ask what shifted in the body or mood."],
   why:"DBT skills for accepting reality through the body. Changing posture and facial tension is a quick way to signal safety to yourself. Effects are modest and individual.",
   ad:{nfmh:"Easy to do seated or lying down.",community:"Works on a bus or before a hard phone call.",group:"Try it together at the start of group."}}
  ,{id:"checkfacts",src:"DBT",name:"Check the Facts",cat:"Reflect",roles:["core"],min:12,demand:2,fit:{anxiety:2,anger:3,relation:3,selfworth:2,stress:1},ev:"Emerging",refs:["valentine2015","hofmann2012"],
   sum:"Ask whether an emotion and its intensity fit the actual facts of the situation.",
   steps:["Name the emotion and rate it 0-10.","What happened? Describe only what a camera would record.","What am I assuming or interpreting?","Am I expecting a threat or catastrophe? How likely is it really?","Does the emotion and its size fit the facts?","If yes, problem-solve. If no, try Opposite Action."],
   why:"A DBT emotion-regulation skill that overlaps with CBT's thought checking. Separating facts from interpretations often lowers the intensity of anger, fear, and shame.",

  ,{id:"opposite",src:"DBT",name:"Opposite Action",cat:"Act",roles:["core"],min:12,demand:2,fit:{depression:3,anxiety:2,anger:2,lonely:2,selfworth:2,hope:2},ev:"Emerging",refs:["valentine2015","ekers2014"],
   sum:"When an emotion doesn't fit the facts, act opposite to its urge: approach instead of avoid, be gentle instead of attack.",
   steps:["Name the emotion and its urge (fear → avoid, sadness → withdraw, anger → attack, shame → hide).","Check the facts: does the emotion fit? If it does, don't use this skill.","Pick the opposite action (approach, get active, be gentle, show up).","Do it all the way, including posture and tone.","Repeat until the emotion eases.","Plan one opposite action for this week."],
   why:"A DBT emotion-regulation skill with roots in behavioral activation and exposure, which have solid evidence for depression and anxiety.",

const GUIDE=[
 {t:"What peer support is",b:`<p>Peer support is help offered by someone with lived experience of mental health or substance use challenges who is trained to use that experience on purpose. The relationship is mutual and non-hierarchical. You walk alongside the person rather than directing them.</p><p>It rests on four ideas from the research and practice literature: shared experience builds trust, hope is contagious, people are the experts on their own lives, and helping others strengthens the helper.</p>`},
 {t:"Core values",b:`<ul><li><b>Hope:</b> recovery is possible and you are evidence of it.</li><li><b>Self-determination:</b> the person chooses their goals and path.</li><li><b>Mutuality:</b> both people learn; power is shared.</li><li><b>Dignity and respect:</b> people-first language, no labels.</li><li><b>Lived experience:</b> used intentionally, for their benefit.</li><li><b>Strengths focus:</b> start with what's working.</li></ul><p class="hint">Based on the National Practice Guidelines for Peer Supporters (iNAPS) and SAMHSA's working definition of recovery.</p>`},
 {t:"CHIME: what recovery is made of",b:`<p>A review of 97 papers found five processes behind personal recovery (Leamy et al., 2011). Use them to check whether your sessions cover more than symptoms.</p><ul><li><b>Connectedness:</b> relationships, community, belonging</li><li><b>Hope and optimism:</b> belief that change is possible</li><li><b>Identity:</b> a sense of self beyond the diagnosis</li><li><b>Meaning:</b> purpose, roles, spirituality</li><li><b>Empowerment:</b> control, responsibility, strengths</li></ul>`},
 {t:"Intentional Peer Support: four tasks",b:`<ol><li><b>Connection:</b> build a relationship where both people feel heard.</li><li><b>Worldview:</b> get curious about how they make sense of their experience, and notice your own assumptions.</li><li><b>Mutuality:</b> share responsibility for the relationship, including saying what doesn't work.</li><li><b>Moving towards:</b> focus on what they want to create, not only what they want to avoid.</li></ol><p class="hint">Mead, Hilton &amp; Curtis (2001) and later IPS training materials.</p>`},
 {t:"Purposeful self-disclosure",b:`<p>Before you share, ask yourself three questions: Whose need does this meet? Is it brief? Does it point toward what helped?</p><ul><li>Share the process of recovery, not graphic detail of the worst times.</li><li>Keep it short, then hand the focus back.</li><li>Don't compare ("I had it worse") or prescribe ("do what I did").</li><li>It's fine not to share. Disclosure is a tool, not a requirement.</li></ul>`},
 {t:"Scope: what peers do and don't do",b:`<p><b>Peers do:</b> listen, share lived experience, teach and practice coping skills, help with goal setting, connect people to resources and community, advocate, and model recovery.</p><p><b>Peers don't:</b> diagnose, give medication or treatment advice, do trauma processing or therapy, or keep secrets that involve safety. When a question is clinical, the answer is "That's a great question for your prescriber. Want help figuring out how to ask?"</p>`},
 {t:"Boundaries and ethics",b:`<ul><li>Be clear at the start about confidentiality and its limits: risk to self or others, abuse of a child or vulnerable adult, and court orders.</li><li>No dual relationships: not friends on social media, no money, no romantic contact.</li><li>Gifts, rides, and contact outside hours follow agency policy.</li><li>When you're unsure, bring it to supervision before acting.</li><li>Protect your own recovery. Boundaries keep the work sustainable.</li></ul>`},
 {t:"Trauma-informed principles",b:`<p>SAMHSA's six principles apply to every setting:</p><ol><li>Safety</li><li>Trustworthiness and transparency</li><li>Peer support</li><li>Collaboration and mutuality</li><li>Empowerment, voice, and choice</li><li>Cultural, historical, and gender issues</li></ol><p>In practice: explain what you're doing and why, offer choices (where to sit, whether to close the door, eyes open or closed), and never pressure someone to tell their story.</p>`},
 {t:"Crisis response",b:`<ul><li>Ask directly: "Are you thinking about suicide?" Asking does not plant the idea.</li><li>Stay calm, listen, and don't leave someone alone if risk seems imminent.</li><li>Follow your facility's crisis protocol and bring in clinical staff right away.</li><li>988 Suicide &amp; Crisis Lifeline: call or text <b>988</b>. Veterans press 1 after dialing.</li><li>Call 911 for immediate danger to life.</li><li>Document per policy and debrief with your supervisor.</li></ul>`},
 {t:"Running groups",b:`<ul><li><b>Open:</b> welcome, agreements (confidentiality, one voice at a time, right to pass), and a brief check-in round.</li><li><b>Middle:</b> one skill or topic, practiced rather than lectured. Use pairs to give quieter members a voice.</li><li><b>Close:</b> takeaway round and a grounding moment, especially after heavy topics.</li><li>For someone who dominates: thank them, summarize, and invite others ("Let's hear from someone who hasn't spoken yet").</li><li>If someone becomes distressed, pause the group, ground together, and check in privately after.</li></ul>`},
 {t:"Working in an NFMH",b:`<ul><li>Coordinate with nursing and activity staff on timing, mobility, and medication schedules.</li><li>Keep sessions shorter and more concrete; repeat key points and leave something written.</li><li>Honor resident rights: the choice to decline, privacy, and being addressed as an adult.</li><li>Many residents face loss of independence, home, and relationships. Validate that grief.</li><li>Be a steady, predictable presence. Consistency builds trust in residential settings.</li></ul>`},
 {t:"Community sessions",b:`<ul><li>Agree on a meeting place that's private enough and safe for both of you.</li><li>Check in on basic needs: food, housing, transportation, phone.</li><li>Know your agency's policy on transporting clients and home visits.</li><li>Tell someone where you'll be. Leave if a setting feels unsafe.</li><li>Use what's around you: a walk, a library card, a bus route practice run.</li></ul>`},
 {t:"Documentation tips",b:`<ul><li>Write in plain, respectful language. Imagine the person reading it.</li><li>Use their words in quotes when it matters.</li><li>Note strengths and progress, not only problems.</li><li>Record what you did (skill taught, resource linked), how they responded, and the next step.</li><li>Document safety concerns and who you notified.</li></ul>`},
 {t:"Taking care of yourself",b:`<p>Peer workers report high rates of stress, partly from role ambiguity and hearing stories close to their own. Protect your recovery with regular supervision, your own wellness plan, time off you actually take, and people outside work. Noticing your own warning signs is part of the job, not a failure at it.</p>`}
];

function score(t){
  let s=0;S.concerns.forEach(c=>s+=(t.fit[c]||0));
  if(S.energy==="low"){if(t.demand===3)s-=2.5;else if(t.demand===2)s-=.6;}
  if(S.energy==="high"&&t.cat==="Regulate")s+=1;
  if((S.setting==="community")&&t.writing)s-=.7;
  if(S.setting==="nfmh"){if(t.demand===3)s-=2;if(t.writing)s-=.4;}
  if(S.setting==="group"&&t.id==="safety")s-=99;
  return s;
}
function ranked(role,exclude){
  return TECH.filter(t=>t.roles.includes(role)&&!exclude.includes(t.id)).map(t=>({t,s:score(t)})).sort((a,b)=>b.s-a.s||a.t.min-b.t.min);
}
function pick(role,key,exclude){
  const r=ranked(role,exclude);if(!r.length)return null;
  const i=(S.swap[key]||0)%Math.min(r.length,6);return r[i].t;
}

  const coreList=[];

  if(!crisis){const c1=pick("core","core1",used);if(c1){coreList.push(c1);used.push(c1.id);}}
  if(twoCores||(crisis&&coreM>=30)){const c2=pick("core","core2",used);if(c2){coreList.push(c2);used.push(c2.id);}}

 function apply(anim){if(anim){r.classList.add("thx");clearTimeout(apply.t);apply.t=setTimeout(function(){r.classList.remove("thx")},520);}
  var t=cur();r.setAttribute("data-theme",t);document.querySelectorAll(".thm").forEach(function(b){b.setAttribute("aria-label",t==="dark"?"Switch to light mode":"Switch to dark mode");b.setAttribute("aria-pressed",String(t==="dark"));});}
 apply(false);
