  return t ? t.key : null;
}
function pickProviders(p){
  const us = p && p.results && p.results.US; if(!us) return null;
  const sl = a => (a || []).slice(0, 20).map(x => ({ n:x.provider_name, l:x.logo_path }));
  const rent = sl([...(us.rent || []), ...(us.buy || [])].filter((x, i, a) => a.findIndex(y => y.provider_id === x.provider_id) === i));
  return { link:us.link, stream:sl([...(us.flatrate || []), ...(us.free || []), ...(us.ads || [])]), rent };
}
// One logo per service: "Paramount+ Premium", "Paramount+ Essential", "Paramount+ Amazon Channel" and
// "Paramount+ Roku Premium Channel" all count as Paramount+. The plainest name's logo is the one kept.
const PROV_EXTRA = new Set(['premium','essential','basic','standard','with','ads','ad','supported','showtime','amazon','apple','tv','channel','channels','roku','plus','kids','the']);
function provKey(n){
  const w = (n || '').toLowerCase().replace(/\+/g, ' plus ').replace(/[^a-z0-9 ]+/g, ' ').split(/\s+/).filter(Boolean);
  while(w.length > 1 && PROV_EXTRA.has(w[w.length - 1])) w.pop();
  // "Amazon Channel", "Apple TV Channel" and similar in the middle: cut at the first add-on word after the brand
  const cut = w.findIndex((x, i) => i > 0 && ['amazon','apple','roku','with','premium','essential','basic','standard'].includes(x));
  return (cut > 0 ? w.slice(0, cut) : w).filter((x, i, a) => !(i === a.length - 1 && x === 'plus' && a.length > 1)).join(' ') || n;
}
function uniqProv(list){
  const out = [], at = new Map();
  (list || []).forEach(x => {
    const k = provKey(x.n);
    if(!at.has(k)){ at.set(k, out.length); out.push(x); }
    else if(x.n.length < out[at.get(k)].n.length) out[at.get(k)] = x;
  });
  return out;
}
function provHTML(p){
  if(p) p = { ...p, stream:uniqProv(p.stream), rent:uniqProv(p.rent) };
  if(!p || (!p.stream.length && !p.rent.length)) return '';
  const row = a => `<div class="plogos">${a.slice(0, 8).map(x => `<img src="${IMG}w92${x.l}" alt="${esc(x.n)}" title="${esc(x.n)}">`).join('')}</div>`;
  return `<div class="prov fadein">${p.stream.length ? '<div class="lbl">Stream it on</div>' + row(p.stream) : '<div class="lbl">Rent or buy</div>' + row(p.rent)}</div>`;
}

/* ---------- Diary ---------- */
function renderDiary(){
  const v = $('#v-diary');
  const head = `<h2 class="vt">Diary</h2><p class="vs">Every film you've rated, by the day you rated it.</p>`;
  const logged = new Set(entries.map(e => e.tmdb));
  const ymd = t => { const d = new Date(t); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
  const items = [
    ...entries.map(e => ({ ...e, kind:'e' })),
    ...Object.entries(ratings).filter(([k, r]) => !k.startsWith('tv') && !logged.has(+k) && r.at > 1e12)
      .map(([k, r]) => ({ kind:'r', id:k, tmdb:+k, title:r.title, year:r.year, poster:r.poster, rating:r.r, date:ymd(r.at), added:r.at }))
  ];
  if(!items.length){ v.innerHTML = head + `<div class="empty">Nothing here yet.</div>`; return; }
  const sorted = items.sort((a, b) => b.date.localeCompare(a.date) || b.added - a.added);
  let html = head + '<div class="pad">', cur = '';
  for(const e of sorted){
    const [y, mo, d] = e.date.split('-');
    const dt = new Date(+y, +mo - 1, +d);
    const label = dt.toLocaleString(undefined, { month:'long', year:'numeric' });
    if(label !== cur){ html += `<div class="month">${label}</div>`; cur = label; }

function reviewData(){
  const yr = new Date().getFullYear();
  const list = Object.entries(ratings).filter(([k, r]) => !k.startsWith('tv') && r.at && new Date(r.at).getFullYear() === yr).map(([k, r]) => ({ id:+k, ...r }));
  const all = list.length ? list : Object.entries(ratings).filter(([k]) => !k.startsWith('tv')).map(([k, r]) => ({ id:+k, ...r }));
  const avg = all.length ? all.reduce((a, f) => a + f.r, 0) / all.length : 0;
  const top = [...all].sort((a, b) => b.r - a.r || b.at - a.at).slice(0, 5);
  const gc = {}; all.forEach(f => (f.g || (movies.get(f.id) || {}).genres || []).forEach(g => { if(GNAME[g]) gc[g] = (gc[g] || 0) + 1; }));
  const topG = Object.entries(gc).sort((a, b) => b[1] - a[1])[0];
  const dc = {}; all.forEach(f => { if(f.year) { const d = Math.floor(+f.year / 10) * 10; dc[d] = (dc[d] || 0) + 1; } });

}

async function saveReviewImage(d, btn){
  btn.textContent = 'Making image…';
  const W = 1080, H = 1350, c = document.createElement('canvas'); c.width = W; c.height = H;
  const x = c.getContext('2d');
  const g = x.createLinearGradient(0, 0, W, H); g.addColorStop(0, '#2a1d2e'); g.addColorStop(1, '#0c0a0f');
  x.fillStyle = g; x.fillRect(0, 0, W, H);
  try{ await document.fonts.load('700 100px "Barlow Condensed"'); }catch(e){}
  const disp = (sz) => `700 ${sz}px "Barlow Condensed", "Arial Narrow", sans-serif`;
  x.textAlign = 'center';
  x.fillStyle = '#b8242c'; x.font = disp(54); x.fillText('ROLLING CREDITS', W / 2, 110);
  x.fillStyle = '#9c93a9'; x.font = '600 34px system-ui, sans-serif'; x.fillText(d.thisYear ? `MY ${d.yr} IN FILM` : 'MY FILM LIFE SO FAR', W / 2, 165);
  x.fillStyle = '#b8242c'; x.font = disp(230); x.fillText(String(d.count), W / 2, 390);
  x.fillStyle = '#f4efe9'; x.font = '600 38px system-ui, sans-serif'; x.fillText('films rated', W / 2, 445);
  const load = src => new Promise(res => { const im = new Image(); im.crossOrigin = 'anonymous'; im.onload = () => res(im); im.onerror = () => res(null); im.src = src; });
  const imgs = await Promise.all(d.top.map(f => f.poster ? load(IMG + 'w342' + f.poster) : Promise.resolve(null)));
  const pw = 176, ph = 264, gap = 22, total = d.top.length * pw + (d.top.length - 1) * gap; let px = (W - total) / 2;
  d.top.forEach((f, i) => {
    x.save(); x.beginPath(); x.roundRect(px, 510, pw, ph, 16); x.clip();
    if(imgs[i]) x.drawImage(imgs[i], px, 510, pw, ph); else { x.fillStyle = '#262030'; x.fillRect(px, 510, pw, ph); x.fillStyle = '#9c93a9'; x.font = '600 22px system-ui'; x.fillText(f.title.slice(0, 14), px + pw / 2, 650); }
    x.restore();
    x.fillStyle = '#b8242c'; x.font = disp(40); x.fillText(fmtR(f.r) + '★', px + pw / 2, 830);
    px += pw + gap;
  });
  const stats = [[d.avg ? d.avg.toFixed(1) + '★' : '—', 'AVERAGE RATING'], [d.genre.toUpperCase(), 'FAVORITE GENRE'], [d.decade.toUpperCase(), 'YOUR DECADE'], [String(d.fives), 'FIVE-STAR FILMS']];
  stats.forEach(([v, l], i) => {
    const cx = i % 2 ? W * 0.72 : W * 0.28, cy = 960 + Math.floor(i / 2) * 170;
    x.fillStyle = '#f4efe9'; x.font = disp(76); x.fillText(v, cx, cy);
    x.fillStyle = '#9c93a9'; x.font = '700 26px system-ui, sans-serif'; x.fillText(l, cx, cy + 46);
  });
  let blob = null;
  try{ blob = await new Promise(r => c.toBlob(r, 'image/png')); }catch(e){}
  if(!blob){ btn.textContent = 'Could not make the image'; return; }
  const file = new File([blob], `reel-log-${d.yr}.png`, { type:'image/png' });
  btn.textContent = 'Save as image';
  if(navigator.canShare && navigator.canShare({ files:[file] })){ try{ await navigator.share({ files:[file], title:'My year in film' }); return; }catch(e){ if(e.name === 'AbortError') return; } }
  // sharing isn't available here: show the image so it can be pressed and held to save
  const url = URL.createObjectURL(blob);
  const holder = btn.parentElement.querySelector('.revimg') || btn.insertAdjacentElement('afterend', Object.assign(document.createElement('div'), { className:'revimg' }));
  holder.innerHTML = `<img src="${url}" alt="Your year in film" style="width:100%;border-radius:14px;margin-top:14px">`;
}

// The token goes in the address so the browser can send each request straight away (a custom header would make it
// ask the relay for permission first, an extra round trip). If the relay is an older copy that only reads the header, fall back.
let rdHeaderMode = false;
async function rd(path, opt = {}){
  const key = store.get(K_RD, ''); if(!key) throw new Error('rdnokey');
  const base = new URL(RD_API + path);
  Object.entries(opt.q || {}).forEach(([k, v]) => base.searchParams.set(k, v));
  const send = hdr => {
    const u = new URL(base), init = {};
    if(hdr) init.headers = { Authorization:'Bearer ' + key }; else u.searchParams.set('auth_token', key);
    if(opt.form){ init.method = 'POST'; init.body = new URLSearchParams(opt.form).toString(); init.headers = { ...(init.headers || {}), 'Content-Type':'application/x-www-form-urlencoded' }; }
    return fetch(u, init);
  };
  let r;
  try{
    r = await send(rdHeaderMode);
    if(!rdHeaderMode && r.status === 401){
      const j = await r.clone().json().catch(() => ({}));
      if(j.error === 'No token'){ rdHeaderMode = true; r = await send(true); }
    }
  }catch(e){ throw new Error('rdblocked'); }
  if(r.status === 401) throw new Error('rdbadkey');
  if(r.status === 403) throw new Error('rddenied');
  if(r.status === 204) return null;
  if(!r.ok){ let msg = 'http ' + r.status; try{ const j = await r.json(); if(j && j.error) msg = String(j.error).replace(/_/g, ' '); }catch(e){} throw new Error(msg); }
  return r.json();
}
const rdErr = e => e.message === 'rdnokey' ? 'Add your Real-Debrid API token in Settings.'

  : e.message === 'rddenied' ? 'Real-Debrid refused the request. Check that your subscription is active.'
  : e.message === 'rdblocked' ? 'Could not reach Real-Debrid. Check your connection and try again.'
  : ['nokey', 'badkey', 'blocked'].includes(e.message) ? errText(e)
  : 'Real-Debrid returned an error (' + esc(e.message) + '). Try again in a minute.';

// "The.Matrix.1999.1080p.BluRay.x264" → { title:'The Matrix', year:'1999', tv:false }
const CUT = /\b(S\d{1,2}(E\d{1,3})?|Season\s*\d+|\d{1,2}x\d{2}|2160p|1080p|720p|480p|4k|uhd|blu ?ray|brrip|bdrip|web ?dl|webrip|web|hdtv|dvdrip|remux|x26[45]|h ?26[45]|hevc|10bit|complete|proper|repack|extended|unrated|imax|hdr|multi)\b/i;
function parseName(n){
  let t = String(n || '').replace(VIDEO, '').replace(/^\s*(\[[^\]]*\]|www\.\S+)\s*[-–]?\s*/i, '').replace(/[._]+/g, ' ').replace(/\s+/g, ' ').trim();
  const tv = /\bS\d{1,2}(E\d{1,3})?\b|\bSeason\s*\d+|\b\d{1,2}x\d{2}\b|\bComplete Series\b/i.test(t);
  const c = t.search(CUT); let head = c > 0 ? t.slice(0, c) : t;
  let year = null, at = -1;
  for(const m of head.matchAll(/(?:^|[\s(\[])((?:19|20)\d{2})(?=[\s)\]]|$)/g)) if(m.index > 0){ year = m[1]; at = m.index; }
  if(at > 0) head = head.slice(0, at);
  const title = head.replace(/[\[(][^\])]*[\])]/g, ' ').replace(/[\s\-–:(\[]+$/, '').replace(/\s+/g, ' ').trim() || t;
  return { title, year, tv };
}
const epOf = p => { const m = String(p).match(/S(\d{1,2})\s?E(\d{1,3})/i) || String(p).match(/\b(\d{1,2})x(\d{2})\b/); return m ? { s:+m[1], e:+m[2] } : null; };
const seasonOf = n => { const m = String(n).match(/\bS(\d{1,2})(?!\d|\s?E\d)/i) || String(n).match(/Season\s*(\d+)/i); return m ? 'Season ' + +m[1] : ''; };
const qualOf = n => { const m = String(n).match(/2160p|1080p|720p|480p|\b4k\b/i); return m ? m[0].toLowerCase().replace('4k', '2160p') : ''; };
const fmtSize = x => x ? (x >= 1e9 ? (x / 1e9).toFixed(1) + ' GB' : Math.round(x / 1e6) + ' MB') : '';
const baseName = p => String(p).split('/').pop();

const libMeta = m => ({ id:m.id, title:m.title, year:m.year, poster:m.poster, genres:m.genres || [], vote:m.vote || 0, votes:m.votes || 0, date:m.date || '' });
async function matchItem(it){
  const q = parseName(it.name);
  const path = q.tv ? '/search/tv' : '/search/movie', yk = q.tv ? 'first_air_date_year' : 'year';
  const tries = q.year ? [{ query:q.title, [yk]:q.year }, { query:q.title }] : [{ query:q.title }];

  }
  return null;
}

let syncing = null;
function syncLib(){
  if(syncing) return syncing;
  syncing = (async () => {
    const all = [];
    for(let page = 1; page <= 40; page++){
      const list = await rd('/torrents', { q:{ page, limit:500 } }) || [];
      all.push(...list);
      if(list.length < 500) break;
    }
    const items = {};
    for(const t of all){
      if(t.status !== 'downloaded') continue;
      const old = rdLib.items[t.id];
      items[t.id] = old && old.name === t.filename ? old : { name:t.filename, bytes:t.bytes, added:t.added };
    }
    rdLib.items = items;
    Object.keys(infoCache).forEach(t => { if(!items[t]) delete infoCache[t]; }); store.set(K_TINFO, infoCache);
    // things removed from Real-Debrid also leave Continue watching
    const goneLinks = new Set();
    Object.keys(prog).forEach(k => { const p = prog[k]; if(p.tid && !items[p.tid]){ if(p.link) goneLinks.add(p.link); delete prog[k]; } });
    goneLinks.forEach(l => delete linkCache[l]); store.set(K_LINKS, linkCache); saveProg();
    let fatal = null;
    await Promise.all(Object.values(items).filter(it => it.m === undefined).map(async it => {
      if(fatal) return;
      try{ it.m = await matchItem(it); }catch(e){ if(['nokey', 'badkey', 'blocked'].includes(e.message)) fatal = e; }
    }));
    rdLib.synced = Date.now(); saveLib();
    if(fatal) throw fatal;
    return rdLib;
  })();
  syncing.finally(() => { syncing = null; }).catch(() => {});
  return syncing;
}

function trackProgress(v, box, link, title, meta){
  const k = meta.key, start = prog[k] && prog[k].t > 20 ? prog[k].t : 0;
  let lastSave = 0, finished = false;
  if(start){
    const note = document.createElement('div'); note.className = 'small lres';
    note.innerHTML = `Resuming from ${clock(start)} · <button>Start over</button>`;
    v.after(note);

    v.addEventListener('loadedmetadata', () => { if(v.currentTime < 1) try{ v.currentTime = start; }catch(e){} }, { once:true });
  }
  const save = () => {
    if(finished || !v.duration || !isFinite(v.duration) || v.currentTime < 5) return;
    prog[k] = { t:v.currentTime, d:v.duration, at:Date.now(), tid:meta.tid, id:meta.id, title, label:meta.label || '', link, ...progMeta(meta) };

(function pullToRefresh(){
  let y0 = null, pulled = 0, el = null;
  const ready = () => view === 'library' && !sheetStack.length && window.scrollY <= 0 && store.get(K_RD, '');
  const bar = () => el || (el = Object.assign(document.createElement('div'), { className:'ptr' }), document.body.appendChild(el), el);
  document.addEventListener('touchstart', e => { y0 = ready() && e.touches.length === 1 ? e.touches[0].clientY : null; pulled = 0; }, { passive:true });
  document.addEventListener('touchmove', e => {
    if(y0 == null) return;
    pulled = Math.max(0, e.touches[0].clientY - y0);
    if(pulled < 8){ bar().style.opacity = 0; return; }
    const p = Math.min(pulled / 90, 1), b = bar();
    b.textContent = p >= 1 ? 'Release to sync' : 'Pull to sync';
    b.style.opacity = p; b.style.transform = `translate(-50%, ${Math.min(pulled * 0.5, 50)}px)`;
  }, { passive:true });
  document.addEventListener('touchend', () => {
    if(y0 == null) return;
    const go = pulled >= 90; y0 = null;
    const b = bar();
    if(go){
      const lib = $('#v-library > div');
      b.textContent = 'Syncing…';
      Promise.resolve(lib && lib._sync && lib._sync()).finally(() => { b.style.opacity = 0; b.style.transform = 'translate(-50%, 0)'; });
    } else { b.style.opacity = 0; b.style.transform = 'translate(-50%, 0)'; }
  }, { passive:true });
})();

    audio:'<path d="M5 9.5v5h3.5L13 18V6L8.5 9.5z"/><path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a7.5 7.5 0 0 1 0 11"/>',
    cc:'<rect x="3.5" y="5.5" width="17" height="13" rx="2.5"/><path d="M10.5 10.2a2 2 0 1 0 0 3.6M16.5 10.2a2 2 0 1 0 0 3.6"/>',
    size:'<path d="M4 18 8.5 6 13 18M5.6 14h5.8M15 18l2.8-7.5L20.5 18M15.8 16h4"/>',
    palette:'<path d="M12 3.5a8.5 8.5 0 1 0 0 17c1.2 0 1.8-.8 1.8-1.7 0-1.3-1.2-1.6-1.2-2.8 0-1 .8-1.7 1.8-1.7h2.3a3.8 3.8 0 0 0 3.8-3.8C20.5 6.6 16.7 3.5 12 3.5z"/><circle cx="7.8" cy="11" r=".9"/><circle cx="10.5" cy="7.5" r=".9"/><circle cx="14.6" cy="7.5" r=".9"/>',
    home:'<path d="M4 11 12 4.5 20 11v8.5h-5.5v-5h-5v5H4z"/>'
  };
  const isCacheKey = k => /^(reellog|rclib)\.c\d?\./.test(k) || /^longbox\.c\d+\./.test(k) || k === 'rclib.links' || k === 'rclib.tinfo';
  const ico = k => `<span class="sic"><svg viewBox="0 0 24 24">${IC[k]}</svg></span>`;
  const row = (id, icon, label, sub, value, tone) => `<button class="srow" id="${id}">${ico(icon)}<span class="slab">${label}${sub ? `<small>${sub}</small>` : ''}</span>${value ? `<span class="sval ${tone || ''}">${value}</span>` : ''}<span class="schev"></span></button>`;
  const LANGS = [['en','English'],['es','Spanish'],['fr','French'],['de','German'],['it','Italian'],['pt','Portuguese'],['ja','Japanese'],['ko','Korean'],['zh','Chinese'],['hi','Hindi'],['ru','Russian']];
  const ACCENTS = [['#b8242c','Red'],['#e23a44','Crimson'],['#e8902a','Amber'],['#2fa86b','Green'],['#1aa3a3','Teal'],['#3b7ddd','Blue'],['#8a5cf6','Violet'],['#e0457b','Pink'],['#ffffff','White']];
  const PICKS = {};
  const pick = (id, cur, opts) => { PICKS[id] = opts; return `<button class="ssel gsel" id="${id}" value="${esc(cur)}">${esc((opts.find(o => String(o[0]) === String(cur)) || opts[0])[1])}</button>`; };
  // a picker button: opens the glass list, then behaves like a changed select (el.value + el.onchange)
  const wirePicks = box => $$('.gsel[id]', box).forEach(el => { const opts = PICKS[el.id]; if(!opts) return;
    el.onclick = () => glassPick(opts, el.value, v => { el.value = v; el.textContent = opts.find(o => String(o[0]) === v)[1]; el.onchange && el.onchange({ target:el }); }); });
  const sw = (id, icon, label, sub, on) => `<label class="srow sw">${ico(icon)}<span class="slab">${label}${sub ? `<small>${sub}</small>` : ''}</span><input type="checkbox" id="${id}" ${on ? 'checked' : ''}><i class="swi"></i></label>`;
  const selRow = (icon, label, sub, sel) => `<div class="srow static">${ico(icon)}<span class="slab">${label}${sub ? `<small>${sub}</small>` : ''}</span>${sel}</div>`;
  const langName = c => (LANGS.find(x => x[0] === c) || [])[1];
  // a settings section as its own page (glass back button), repainted when something changes
  const subPage = (title, build) => {
    const pg = sheet(`<h2 class="stitle">${esc(title)}</h2><div class="spg"></div>`, { tall:true, page:true });
    const draw = () => { if(!pg.el.isConnected) return; const box = $('.spg', pg.body); build(box, draw); wirePicks(box); };
    draw(); pg.refresh = draw; pg.onClose = () => paint();
    return pg;
  };
  const paint = () => {
    if(!b.isConnected) return;
    const tm = !!store.get(K_KEY, '');
    $('#setbody', b).innerHTML = `
      <div class="sgroup smain"><div class="scard">
        ${row('g-conn', 'cloud', 'Connections', '', tm ? '' : 'Set up', 'warn')}
        ${NATIVE ? row('g-play', 'next', 'Player', '') : ''}
        ${row('g-look', 'palette', 'Look and feel', '')}
        ${row('g-data', 'down', 'Your data', '')}
      </div></div>
      <div class="sgroup smain"><div class="scard">
        ${NATIVE ? '<div class="srow static" id="appupd"></div>' : ''}
        ${row('s-about', 'info', 'About', '')}
      </div></div>`;
    $('#g-conn', b).onclick = () => subPage('Connections', box => {
      const tm = !!store.get(K_KEY, ''), rd = !!store.get(K_RD, ''), om = !!store.get(K_OMDB, ''), n = libTitles().length;
      box.innerHTML = `<div class="scard">
        ${row('s-tmdb', 'film', 'TMDB', 'Posters, titles and details', tm ? 'Connected' : 'Set up', tm ? 'ok' : 'warn')}
        ${row('s-rd', 'cloud', 'Real-Debrid', 'Your library and playback', rd ? (n ? n + ' title' + (n === 1 ? '' : 's') : 'Connected') : 'Set up', rd ? 'ok' : '')}
        ${row('s-omdb', 'tomato', 'Rotten Tomatoes', 'Critic scores on title cards', om ? 'On' : 'Off', om ? 'ok' : '')}</div>`;
      $('#s-tmdb', box).onclick = () => keySheet({ name:'TMDB', what:'Rolling Credits gets every poster, title and detail from TMDB. A free key switches it on.',
        how:'themoviedb.org → sign in → Settings → API → copy the API key (or the read access token).', link:'https://www.themoviedb.org/settings/api',
        key:K_KEY, placeholder:'Paste your TMDB key', verify:true });
      $('#s-rd', box).onclick = () => keySheet({ name:'Real-Debrid', what:'Your Real-Debrid library becomes the Library tab, with a Play button on every title you have.',
        how:'real-debrid.com/apitoken → copy your API token.', link:'https://real-debrid.com/apitoken', key:K_RD, placeholder:'Paste your API token', secret:true,
        extra:'<button class="btn ghost" id="ks-lib">Open my library</button>',
        onSave:v => { if(!v){ rdLib = { synced:0, items:{} }; saveLib(); } },
        wire:(kb, ks) => { const x = $('#ks-lib', kb); if(x) x.onclick = () => { ks.close(); closeAllSheets(); setTimeout(openLibrary, 60); }; } });
      $('#s-omdb', box).onclick = () => keySheet({ name:'Rotten Tomatoes', what:'Adds Rotten Tomatoes critic scores to title cards, using a free OMDb key (up to 1,000 lookups a day; each title is looked up once a week).',
        how:'omdbapi.com → API Key → choose the free tier → the key arrives by email.', link:'https://www.omdbapi.com/apikey.aspx', key:K_OMDB, placeholder:'Paste your OMDb key' });
    });
    const gp = $('#g-play', b); if(gp) gp.onclick = () => subPage('Player', box => {
      const g = (k, d) => store.get(k, d);
      box.innerHTML = `<div class="sgh">Episodes</div><div class="scard">
        ${sw('p-auto', 'next', 'Auto-play next episode', 'A 10-second countdown when the credits start', g(K_AUTOPLAY, true))}
        ${sw('p-skip', 'skip', 'Skip intros automatically', 'Jumps past intros and recaps, with a tap to undo', g(K_PL_SKIP, false))}</div>
        <div class="sgh">Sound</div><div class="scard">
        ${sw('p-mid', 'moon', 'Midnight mode by default', 'Every video starts with loud peaks evened out', g(K_PL_MID, false))}
        ${selRow('audio', 'Audio language', 'When a file has more than one', pick('p-al', g(K_PL_AUD, ''), [['', 'Last used'], ...LANGS]))}</div>
        <div class="sgh">Subtitles</div><div class="scard">
        ${selRow('cc', 'Subtitle language', '', pick('p-tl', g(K_PL_TXT, ''), [['', 'Last used'], ['off', 'Off'], ...LANGS]))}
        ${selRow('size', 'Size', '', pick('p-ts', g(K_PL_SIZE, 'm'), [['s', 'Small'], ['m', 'Medium'], ['l', 'Large'], ['xl', 'Extra large']]))}
        ${selRow('cc', 'Style', '', pick('p-tst', g(K_PL_STYLE, 'shadow'), [['shadow', 'White with shadow'], ['outline', 'White with outline'], ['box', 'White on dark box'], ['yellow', 'Yellow with shadow']]))}
        <div class="subprev ${g(K_PL_STYLE, 'shadow')} s-${g(K_PL_SIZE, 'm')}"><span>This is how subtitles will look.</span></div></div>`;
      const bind = (id, k, isBool) => { const el = $('#' + id, box); el.onchange = () => { store.set(k, isBool ? el.checked : el.value); if(!isBool) draw2(); }; };
      const draw2 = () => { const pv = $('.subprev', box); pv.className = `subprev ${store.get(K_PL_STYLE, 'shadow')} s-${store.get(K_PL_SIZE, 'm')}`; };
      bind('p-auto', K_AUTOPLAY, true); bind('p-skip', K_PL_SKIP, true); bind('p-mid', K_PL_MID, true);
      bind('p-al', K_PL_AUD); bind('p-tl', K_PL_TXT); bind('p-ts', K_PL_SIZE); bind('p-tst', K_PL_STYLE);
    });
    $('#g-look', b).onclick = () => subPage('Look and feel', (box, redraw) => {
      const cur = store.get(K_ACCENT, ACCENTS[0][0]);
      box.innerHTML = `<div class="sgh">Accent color</div><div class="scard"><div class="srow static acc">${ACCENTS.map(([c, n]) =>
          `<button class="accsw${c === cur ? ' on' : ''}" data-c="${c}" aria-label="${n}" style="--c:${c}"></button>`).join('')}</div></div>
        <div class="sgh">Start on</div><div class="scard">
        ${selRow('home', 'When the app opens', '', pick('l-start', store.get(K_START, 'discover'), [['discover', 'Discover'], ['library', 'Library'], ['last', 'Last page I was on']]))}</div>
        <div class="sgh">Browsing</div><div class="scard">
        ${sw('hide', 'eye', "Hide what I've rated", 'Keeps Discover and Genres fresh', hideRated)}</div>`;
      $$('.accsw', box).forEach(x => x.onclick = () => { store.set(K_ACCENT, x.dataset.c); applyAccent(); hap(); redraw(); });
      $('#l-start', box).onchange = e => store.set(K_START, e.target.value);
      $('#hide', box).onchange = e => { hideRated = e.target.checked; store.set(K_HIDE, hideRated); built.discover = built.genres = built.tv = false; };
    });
    $('#g-data', b).onclick = () => subPage('Your data', box => {
      box.innerHTML = `<div class="scard">
        ${row('exp', 'down', 'Back up', 'Save ratings, diary and lists to a file')}
        ${row('imp', 'up', 'Restore', 'Bring them back from a backup file')}
        <div class="srow static stor"><span class="slab">Storage<small id="stinfo">Measuring…</small><i class="stbar"><b id="stfill"></b></i></span><button class="pill sclr" id="stclr">Clear cache</button></div></div>
        <input type="file" id="file" accept=".json,application/json" hidden>`;
      // Storage: your own data vs. cached data (title details, stream links), and a button to clear the cache
      const measure = () => {
        let mine = 0, cache = 0;
        for(let i = 0; i < localStorage.length; i++){
          const k = localStorage.key(i), n = (k.length + (localStorage.getItem(k) || '').length) * 2;
          if(isCacheKey(k)) cache += n; else mine += n;
        }
        const mb = n => n < 1e6 ? Math.max(1, Math.round(n / 1e3)) + ' KB' : (n / 1e6).toFixed(1) + ' MB';
        const el = $('#stinfo', box); if(!el) return;
        el.textContent = `Yours ${mb(mine)} · Cache ${mb(cache)} · 5 MB max`;
        $('#stfill', box).style.width = Math.min(100, (mine + cache) / 5e6 * 100).toFixed(1) + '%';
      };
      measure();
      $('#stclr', box).onclick = () => {
        for(let i = localStorage.length - 1; i >= 0; i--){ const k = localStorage.key(i); if(isCacheKey(k)) localStorage.removeItem(k); }
        try{ sessionStorage.clear(); }catch(e){}
        if(typeof linkCache === 'object') Object.keys(linkCache).forEach(k => delete linkCache[k]);
        measure(); toast('Cache cleared. Your ratings and library are untouched.');
      };
      $('#exp', box).onclick = async () => {
        const json = JSON.stringify({ app:'reellog', v:5, entries, ratings, watch, seen, favs }, null, 1);
        if(NATIVE){   // in the Android app: Android's own "Save to" screen (Downloads, Drive, ...)
          try{ const r = await callNative('RCFiles', 'save', { name:`rolling-credits-${today()}.json`, data:json, mime:'application/json' }); if(r && r.saved) toast('Backup saved'); }
          catch(e){ toast('Could not save the backup'); }
          return;
        }
        const blob = new Blob([json], { type:'application/json' });
        const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
        a.download = `rolling-credits-${today()}.json`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
      };
      $('#imp', box).onclick = () => $('#file', box).click();
      $('#file', box).onchange = importBackup;
    });
    $('#s-about', b).onclick = () => sheet(`<h2 class="stitle">About</h2>
      <p class="small" style="font-size:13.5px;line-height:1.55">Film data and posters from TMDB. This product uses the TMDB API but is not endorsed or certified by TMDB.</p>
      <p class="small" style="font-size:13.5px;line-height:1.55">IMDb ratings: information courtesy of IMDb (imdb.com), used with permission for personal, non-commercial use.</p>
      <p class="small" style="font-size:13.5px;line-height:1.55">Streaming availability from JustWatch. Rotten Tomatoes scores via OMDb. Intro timestamps from TheIntroDB.</p>`);
    if(NATIVE){ fillUpdate(b); checkForUpdate(); }
  };
  // One connection: what it's for, where to get the key, the key itself
  function keySheet(o){
    const cur = store.get(o.key, '');
    const ks = sheet(`<h2 class="stitle">${esc(o.name)}</h2>
      <p class="kswhat">${esc(o.what)}</p>
      <div class="kshow"><b>Where to get it</b><span>${esc(o.how)}</span><a href="${esc(o.link)}" target="_blank" rel="noopener">Open ${esc(o.link.replace(/^https:\/\/(www\.)?/, '').split('/')[0])} ↗</a></div>
      <input id="ks-in" ${o.secret ? 'type="password"' : ''} value="${esc(cur)}" placeholder="${esc(o.placeholder)}" autocomplete="off" spellcheck="false">
      <button class="btn" id="ks-save">${cur ? 'Save changes' : 'Connect'}</button>
      ${cur ? '<button class="btn ghost" id="ks-del">Disconnect</button>' : ''}
      ${cur && o.extra ? o.extra : ''}`);
    const kb = ks.body, btn = $('#ks-save', kb);
    const finish = (v, first) => {
      o.onSave && o.onSave(v);
      if(o.key === K_KEY && (first || !v)){ built.discover = built.genres = built.tv = false; setView(view); }
      ks.close(); paint(); sheetStack.forEach(x => x.refresh && x.refresh()); toast(v ? `${esc(o.name)} connected` : `${esc(o.name)} disconnected`);
    };
    btn.onclick = async () => {
      const v = $('#ks-in', kb).value.trim(); if(!v){ $('#ks-in', kb).focus(); return; }
      if(!store.set(o.key, v)){ btn.textContent = 'Could not save — storage is full'; return; }
      if(!o.verify){ finish(v, !cur); return; }
      btn.textContent = 'Checking…'; btn.disabled = true;
      try{ await tmdb('/configuration'); finish(v, !cur); }
      catch(err){
        btn.disabled = false;
        if(err.message === 'badkey'){ store.set(o.key, cur); btn.textContent = 'TMDB rejected that key — check it and try again'; }
        else{ btn.textContent = 'Saved (could not check it right now)'; setTimeout(() => finish(v, !cur), 900); }
      }
    };
    const del = $('#ks-del', kb); if(del) del.onclick = () => { store.set(o.key, ''); finish('', false); };
    o.wire && o.wire(kb, ks);
  }
  async function importBackup(ev){
    const f = ev.target.files[0]; if(!f) return;
    try{
      const data = JSON.parse(await f.text());
      const list = Array.isArray(data) ? data : data.entries || [];
      const ids = new Set(entries.map(e => e.id)); let n = 0, rn = 0;
      for(const e of list) if(e && e.id && e.tmdb && e.date && !ids.has(e.id)){ entries.push(e); n++; }
      if(data.watch) for(const [id, w] of Object.entries(data.watch)) if(!watch[id] && !ratings[id]) watch[id] = w;
      if(data.seen) for(const [id, w] of Object.entries(data.seen)) if(!seen[id] && !ratings[id]) seen[id] = w;
      if(data.favs) for(const [id, p] of Object.entries(data.favs)) if(!favs[id]) favs[id] = p;
      if(data.ratings) for(const [id, r] of Object.entries(data.ratings)) if(!ratings[id] || (r.at || 0) > (ratings[id].at || 0)){ ratings[id] = r; rn++; }
      if(!data.ratings) list.forEach(e => { if(e.rating && !ratings[e.tmdb]){ ratings[e.tmdb] = { r:e.rating, title:e.title, year:e.year, poster:e.poster, at:e.added || 0 }; rn++; } });
      saveAll(); afterChange(); paint(); toast(`Restored ${n} diary entr${n === 1 ? 'y' : 'ies'} and ${rn} rating${rn === 1 ? '' : 's'}`);
    }catch(e){ toast('That file is not a Rolling Credits backup.'); }
  }
  paint();
}

/* ================= go ================= */
history.replaceState({ rl:0 }, '');
{ const st = store.get('rclib.start', 'discover'), last = store.get('rclib.lastview', 'discover');
  setView(st === 'last' && last && last !== 'films' ? last : st === 'library' ? 'library' : 'discover'); }
setTimeout(() => { if(store.get(K_KEY, '')) repairTitles(); }, 2500);
if('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
