al energy of the expanding universe in general relativity is tricky and debated. Light loses energy as it gets redshifted, and the total amount of dark energy grows as space expands."],"terms":["The energy of motion, ½mv² at everyday speeds.","Mass times velocity; conserved in isolated systems.","The spinning version of momentum; conserved when no outside twisting force acts.","A change that leaves the laws of physics the same.","The result connecting each continuous symmetry to a conserved quantity."],"s":"Energy, momentum, angular momentum and electric charge are conserved, meaning their totals stay the same, in isolated systems. Emmy Noether's theorem connects each one to a symmetry: physics staying the same over time gives energy conservation, staying the same from place to place gives momentum conservation, and staying the same in every direction gives angular momentum conservation. In an expanding universe, total energy isn't simply conserved, because space isn't the same over time on cosmic scales.","why":"Conservation laws let physicists predict results without tracking every detail, from car crashes to particle collisions. They guide engineering, explain things in astronomy from planet formation to pulsars, and have repeatedly led to the discovery of new particles."},"entropy":{"how":["Rudolf Clausius defined a change in entropy as the heat transferred divided by temperature. Earlier, Sadi Carnot showed that no heat engine running between a hot temperature T<sub>h</sub> and a cold temperature T<sub>c</sub> can be more efficient than 1 − T<sub>c</sub>/T<sub>h</sub>. A power plant running between 800 K and 300 K can turn at most 62.5% of its heat into work, and real plants do worse.","Ludwig Boltzmann connected entropy to counting arrangements: S = k<sub>B</sub> ln W, where W is the number of microstates (exact arrangements of particles) that match a macrostate (what we actually measure, like temperature and pressure). Messy states win because there are vastly more ways to be messy than to be orderly. With trillions of trillions of particles, the odds against entropy noticeably decreasing are so huge that the second law is effectively absolute.","The third law says entropy approaches a minimum as temperature approaches absolute zero, which means absolute zero can never actually be reached. Labs have cooled matter to trillionths of a kelvin, but never to zero.","Entropy is connected to information. Rolf Landauer showed that erasing one bit of information must give off a tiny minimum amount of heat. This solves the 'Maxwell's demon' puzzle: an imaginary tiny being that sorts fast and slow molecules would eventually have to erase its memory, creating entropy.","The early universe had very low entropy, not because it was hot and even, but because gravity favors clumping, so a smooth spread of matter is actually a very orderly state for gravity. Black holes have enormous entropy, proportional to the area of their horizon. Why the universe started in such a low-entropy state, giving time its direction, is unexplained."],"x":["Sadi Carnot's 1824 work on steam engines and Rudolf Clausius's 1850s work established the second law. Ludwig Boltzmann connected entropy to counting microscopic arrangements in the 1870s.\nNo machine has ever broken it, and the physics built on it accurately predicts heat capacities, chemical reactions and engine efficiencies.","Entropy isn't simply 'disorder'; that's a loose comparison. It counts how many microscopic arrangements match a large-scale state.\nLife doesn't break the second law. Living things lower their own entropy by increasing the entropy of their surroundings, mostly by giving off heat.","Why the early universe had such low entropy, which gives time its direction, is a deep open question. How entropy works for black holes and for the universe's far-future 'heat death' is also being studied."],"terms":["One exact arrangement of all of a system's particles.","A system's large-scale state, described by things like temperature and pressure.","The highest possible efficiency of a heat engine: 1 − T<sub>c</sub>/T<sub>h</sub>.","Erasing one bit of information always gives off at least a tiny minimum amount of heat.","A possible far-future state of maximum entropy, where no usable energy differences are left."],"s":"Entropy measures how many microscopic arrangements match a system's large-scale state. The second law of thermodynamics says the total entropy of an isolated system never decreases, which is why heat flows from hot to cold and why no engine can be 100% efficient. It's a statistical law: decreases aren't impossible, just so unlikely for large systems that they never happen in practice. It's often linked to the direction of time.","why":"Entropy controls engines, refrigerators, chemical reactions, weather and the efficiency of every power source. It connects physics to information and computing, explains why living things need a constant supply of energy and underlies our sense that time flows in one direction."},"em":{"how":["Maxwell's four equations describe all classical electricity and magnetism. Gauss's law: electric charges create electric fields. Gauss's law for magnetism: there are no single magnetic poles, so magnetic field lines always form loops. Faraday's law: a changing magnetic field creates an electric field, the idea behind generators and transformers. The Ampère–Maxwell law: electric currents and changing electric fields create magnetic fields.","Put together, they predict waves. A changing electric field creates a magnetic field, which creates an electric field, and the disturbance travels on its own at c = 1/√(μ<sub>0</sub>ε<sub>0</sub>), which matches the measured speed of light. In these waves, the electric and magnetic fields are perpendicular to each other and to the direction of travel; the direction of the electric field is called polarization.","Light carries energy and momentum, so it pushes on things. Sunlight at Earth pushes with only about 9 micronewtons per square meter on a reflective surface. That's tiny, but solar sails like Japan's IKAROS (2010) have used it to travel through space.","Every object gives off thermal radiation. An ideal 'blackbody' follows Planck's law, with a peak wavelength given by Wien's law, λ<sub>max</sub> ≈ 2.898 mm·K / T. The Sun (about 5,800 K) peaks near 500 nm in visible light, a human body (310 K) near 9.3 µm in infrared, and the CMB (2.7 K) near 1 mm in microwaves. Total power rises as T⁴ (the Stefan–Boltzmann law), so doubling an object's temperature makes it give off 16 times more energy.","Earth's atmosphere mainly lets through visible light and many radio wavelengths, plus some infrared. Ultraviolet, X-rays and gamma rays are blocked, which protects life but means astronomers need space telescopes like Chandra (X-rays) and Fermi (gamma rays). Viewing the same object at different wavelengths reveals different physics."],"x":["Michael Faraday showed in 1831 that changing magnetic fields create electric currents. James Clerk Maxwell's equations predicted electromagnetic waves moving at the measured speed of light, and in 1887 Heinrich Hertz produced radio waves, confirming them.\nWilhelm Röntgen discovered X-rays in 1895, and radio, microwave and infrared astronomy have since revealed views of the universe invisible to our eyes.","Radiation isn't always dangerous. Radio waves, visible light and infrared are non-ionizing; only high-energy ultraviolet, X-rays and gamma rays can break molecular bonds directly.\nColor isn't 'in' light like paint; it's how your brain interprets specific mixes of wavelengths.","Classical electromagnetism is settled, and its quantum version, quantum electrodynamics, is one of the most precisely tested theories in physics. Open questions include whether single magnetic poles (monopoles) exist, since none have been found, and where galaxies' magnetic fields come from."],"terms":["A self-sustaining vibration of electric and magnetic fields traveling at light speed.","An ideal object that absorbs all light and gives off a spectrum that depends only on its temperature.","The peak wavelength of blackbody radiation is inversely proportional to temperature.","The direction of a light wave's electric field.","A range of wavelengths that passes through Earth's atmosphere to the ground."],"s":"Maxwell's equations, from the 1860s, combined electricity and magnetism into one theory and showed that light is an electromagnetic wave traveling at speed c. The electromagnetic spectrum includes radio waves, microwaves, infrared, visible light, ultraviolet, X-rays and gamma rays, which differ only in wavelength. Astronomers observe across the whole spectrum because different processes give off different wavelengths.","why":"Electromagnetism runs the modern world: power grids, motors, radio, Wi-Fi, fiber optics and every electronic device. It's also how we learn about almost everything in astronomy; nearly all our knowledge of the universe beyond Earth arrived as electromagnetic radiation."},"states-of-matter":{"how":["Temperature measures the average energy of motion of particles. In solids, particles vibrate around fixed spots; in liquids, they stay close but slide past each other; in gases, they move freely and occasionally collide. Phase changes happen when thermal energy overcomes the forces holding particles together. They absorb or release 'latent heat' without changing temperature: melting ice stays at 0 °C until it's all melted.","Phase diagrams show which state is stable at each temperature and pressure. Water's triple point, where ice, liquid water and vapor all exist together, is at 0.01 °C and very low pressure. Above its critical point (374 °C and very high pressure), liquid and gas become impossible to tell apart. Water is also unusual because its solid form is less dense than its liquid, so ice floats.","Plasma forms when particles have enough energy to knock electrons off atoms, usually at thousands of degrees or more, or when strong electric fields strip them off. Because its particles are charged, plasma conducts electricity and reacts strongly to magnetic fields. Stars, the solar wind, lightning, auroras, neon signs and fusion experiments are all plasmas.","At the extremes: near absolute zero, certain atoms merge into a single quantum state called a Bose–Einstein condensate, and helium-4 becomes a superfluid that flows with zero friction. At enormous densities, matter becomes degenerate, as in white dwarfs and neutron stars. At around two trillion kelvin, protons and neutrons melt into quark–gluon plasma, which has been recreated by smashing heavy atoms together in particle colliders."],"x":["The kinetic theory of gases, developed by Daniel Bernoulli, James Clerk Maxwell and Ludwig Boltzmann, explained pressure and temperature as the motion of molecules. William Crookes described glowing 'radiant matter' in glass tubes in 1879, and Irving Langmuir named it plasma in 1928. Bose–Einstein condensates, predicted in 1924–25, were first made in 1995 by Eric Cornell and Carl Wieman, who cooled rubidium atoms to about 170 billionths of a degree above absolute zero.","Glass isn't a slowly flowing liquid; old windows that are thicker at the bottom were just made unevenly. Glass is a solid without a regular crystal structure.\nBoiling doesn't need high temperatures: lower the pressure enough and water boils at room temperature, as it would on Mars.\nThere are far more than four states; physicists recognize many, including superfluids, liquid crystals, supercritical fluids and quark–gluon plasma.","New phases of matter are still being discovered, including topological phases and 'time crystals', which repeat in time instead of in space. Exactly how glass forms is still debated. Inside giant planets and neutron stars, matter exists in states that labs can only partly recreate, so their properties are uncertain."],"terms":["A change from one state of matter to another, like melting or boiling.","Energy absorbed or released during a phase change without changing temperature.","The temperature and pressure where three phases exist together.","An ionized gas of free electrons and ions that conducts electricity.","A state where atoms near absolute zero share a single quantum state.","A fluid that flows with zero friction (viscosity)."],"s":"The familiar states of matter, solid, liquid and gas, depend on how strongly particles are held together compared with their thermal energy. Heating breaks the bonds, and pressure pushes particles together. A fourth state, plasma, forms when atoms are broken into free electrons and nuclei; it makes up stars and most of the visible matter in the universe. Exotic states like Bose–Einstein condensates and degenerate matter appear at extreme temperatures and densities.","why":"States of matter control weather, geology, cooking, engineering and the insides of planets and stars. Plasma physics is key to understanding the Sun, space weather and fusion energy, and exotic quantum states are leading to new technologies."},"big-bang":{"how":["Cosmology uses Einstein's general relativity, plus one assumption called the cosmological principle: on the largest scales, the universe looks the same everywhere and in every direction. With that assumption, Einstein's equations simplify into the Friedmann equations, which connect how fast the universe expands to what it contains. The size of the universe is tracked by one number, the scale factor <i>a</i>. When <i>a</i> doubles, the distance between distant galaxies doubles, and so does the wavelength of light traveling between them. That stretching is the cosmological redshift: 1 + z = <i>a</i>(now) / <i>a</i>(then).","Run the clock backward and the universe gets smaller, denser and hotter. The temperature of radiation goes as 1/<i>a</i>, so halving the size doubles the temperature. As the young universe cooled, new things became stable at each temperature step: protons and neutrons after about a microsecond, the first atomic nuclei after a few minutes, and neutral atoms after 380,000 years. Each step left clues we can still measure today.","The standard model of cosmology is called ΛCDM: a cosmological constant (Λ, dark energy) plus cold dark matter (CDM), along with ordinary matter and light. It needs only six numbers, such as the amounts of ordinary and dark matter, and from them it correctly predicts the microwave background pattern, how galaxies cluster, how bright distant supernovae look, and how much of each light element exists.","Galaxies grew from tiny density differences in the early universe, about 1 part in 100,000. Dark matter clumped first. Ordinary matter fell into those clumps later, forming the first stars a few hundred million years after the Big Bang, then galaxies, clusters, and a giant 'cosmic web' of filaments and empty voids.","If dark energy stays constant, expansion keeps speeding up. In about 100 billion years, galaxies beyond our local group will be too far away to see, and over trillions of years star formation will end, leaving a cold, dark 'heat death'. Recent data hint that dark energy might change over time, which would allow other endings, so the final fate is still open."],"x":["Three independent observations point to the Big Bang. In 1929, Edwin Hubble showed that galaxies move away from us at speeds proportional to their distance, which is what uniform expansion predicts. In 1965, Arno Penzias and Robert Wilson detected the cosmic microwave background, the predicted afterglow of the hot early universe. And the measured ratios of hydrogen, helium and deuterium in untouched ancient gas match nuclear-physics predictions for the first few minutes.\nThe model also made predictions that were confirmed later. Distant galaxies, which we see as they were billions of years ago, look younger and messier than nearby ones. The background radiation was hotter in the past, and astronomers have measured that higher temperature in distant gas clouds, exactly as predicted.","The Big Bang was not an explosion into empty space, and it did not happen at a center point. Every location in today's universe was part of that hot, dense state, and expansion happens everywhere at once. There is no edge and no middle that galaxies are flying away from.\nThe model also does not say the universe came from 'nothing' or explain what caused it. It describes how the universe changed starting from a very early hot state. Questions about 'time zero', or what came before, are beyond what current physics can test.","Our physics stops working at the Planck time, about 10<sup>-43</sup> s, when both quantum effects and gravity were important at once. Without a theory of quantum gravity, we can't say what the starting state was. Ideas being explored include eternal inflation, a 'bounce' from an earlier contracting universe, and theories where time itself emerges.\nAnother mystery is why there is more matter than antimatter. The early universe should have made almost equal amounts of both, which would have destroyed each other. Something tipped the balance toward matter by about one part in a billion, and nobody knows what."],"terms":["A number that describes how big the universe is compared with today; all large cosmic distances grow in proportion to it.","How much light's wavelength has been stretched; 1 + z equals how many times the universe has grown since the light was emitted.","The well-tested assumption that, on very large scales, the universe is the same everywhere and looks the same in every direction.","The standard model of cosmology: dark energy as a cosmological constant (Λ) plus cold dark matter, with ordinary matter and radiation.","About 5.4 × 10<sup>−44</sup> s; the earliest time our current theories can describe before quantum gravity takes over."],"s":"The Big Bang model says the universe began in an extremely hot, dense state about 13.8 billion years ago and has been expanding and cooling ever since. It was not an explosion at one point in space: space itself stretches everywhere at once. Three separate lines of evidence back it up: galaxies are moving apart (redshift), the whole sky glows with leftover microwave radiation, and the amounts of hydrogen and helium match what the theory predicts. The model does not explain the very first instant; before about 10<sup>-43</sup> s (the Planck time) we would need a theory of quantum gravity, which does not exist yet.","why":"The Big Bang model is the framework the rest of cosmology fits into. It gives the universe's age, explains the microwave glow of the sky, and predicts how much hydrogen and helium exist. It also tells us where we came from: the hydrogen in your body formed in the first few minutes, while carbon, oxygen and iron were made later inside stars. And because the early universe reached energies far beyond any particle accelerator, it is a natural laboratory for testing fundamental physics."},"cmb":{"how":["Before 380,000 years, the universe was hotter than 3,000 K, so hydrogen atoms were broken apart (ionized). Light kept bouncing off free electrons, so light and matter moved together as one hot, glowing fluid, a bit like the inside of the Sun. When it cooled enough for electrons to stick to nuclei, an event called recombination, light could suddenly travel in straight lines. The CMB is that released light. Since then, the universe has expanded about 1,100 times, stretching the light from an orange glow to microwaves.","The early fluid had sound waves in it. Dark matter clumps pulled matter inward, and the pressure of light pushed back, so the fluid oscillated, like a spring. When the light was released, those waves froze in place. The biggest wave that had time to squeeze once sets a standard size of about 150 megaparsecs (about 490 million light-years) today, which appears on the sky as about 1 degree. That shows up as the first peak in the CMB power spectrum, a graph of how much the temperature varies at each angular size.","The peaks act like a precise measuring tool. The first peak's position shows that space is flat on large scales. The heights of the other peaks reveal how much ordinary matter there is and show that there must be about five times more dark matter. Fitting the whole graph gives the age of the universe to within about 0.15%.","The CMB light is also slightly polarized, meaning its waves tend to vibrate in certain directions. Scattering at recombination made a pattern called E-modes, which has been mapped. Gravity from galaxies along the way twists some of that into B-modes, which have also been measured. A different kind of B-mode, from gravitational waves made during inflation, has not been found yet.","Later events leave marks too. Hot gas in galaxy clusters gives CMB light a small energy boost (the Sunyaev–Zel'dovich effect), which lets astronomers find thousands of clusters. And because we move at about 370 km/s relative to the CMB, one half of the sky looks about 0.1% warmer than the other."],"x":["Arno Penzias and Robert Wilson found the CMB by accident in 1965 as a steady hiss in a radio antenna they could not get rid of; it earned the 1978 Nobel Prize. NASA's COBE satellite (1989) showed its spectrum is the most perfect blackbody ever measured in nature and detected its tiny variations, earning the 2006 Nobel Prize.\nWMAP (2001–2010) and Planck (2009–2013) mapped those variations in fine detail. The sizes of the hot and cold spots reveal the universe's shape, the amounts of ordinary matter, dark matter and dark energy, and the expansion rate. Just six numbers fit thousands of data points.","The CMB is not light from the Big Bang 'moment'. It was released about 380,000 years later, when the universe became transparent. Before that, light was trapped in hot plasma.\nIt also doesn't come from one place. Every point in space gave off this light, and we see the shell of it that has been traveling toward us for 13.8 billion years. Observers in other galaxies see their own shell.","A few large features on the CMB map are a bit surprising, such as an unusually large 'cold spot' and an alignment of the biggest patterns. They might just be chance.\nThe biggest goal is to detect B-mode polarization from gravitational waves made during inflation. Experiments like BICEP/Keck and the Simons Observatory are searching; finding it would be strong evidence that inflation happened."],"terms":["The time, about 380,000 years after the Big Bang, when electrons joined nuclei to make neutral atoms and the universe became transparent.","The shell of space, as seen from Earth, where the CMB light last bounced off matter before traveling to us.","A graph showing how strongly the CMB temperature varies on each size scale across the sky.","Bumps in the power spectrum caused by sound waves in the early universe's hot plasma.","A small change in CMB light caused by bouncing off hot electrons in galaxy clusters."],"s":"About 380,000 years after the Big Bang, the universe cooled to about 3,000 K, cool enough for electrons to join nuclei and form neutral atoms. Light could then travel freely for the first time. That light, stretched by expansion into microwaves, still fills the whole sky today: the cosmic microwave background (CMB). It is almost perfectly even, at 2.725 K, but has tiny hot and cold spots, about 1 part in 100,000, that mark the seeds of future galaxies. Satellites like COBE, WMAP and Planck used it to measure the universe's age and makeup.","why":"The CMB is the most precise dataset in cosmology. It pins down the main numbers of the standard model to about 1%, gives the clearest picture of the early universe, and preserves the seeds of every galaxy. Any new idea in physics, from extra kinds of neutrinos to unusual dark energy, has to agree with it."},"expansion":{"how":["Cosmologists use two kinds of distance. Comoving distance is measured on a grid that stretches with the universe, so it stays the same for galaxies carried along by expansion. Proper distance is what a ruler would measure today. Proper distance equals the scale factor times comoving distance, so it grows at a rate proportional to the distance itself. That gives Hubble's law: v = H × d.","The expansion rate H changes over time; H<sub>0</sub> is its value today. Its inverse, 1/H<sub>0</sub>, is called the Hubble time and is about 14.5 billion years for H<sub>0</sub> = 67.4 km/s/Mpc, which happens to be close to the actual age of the universe.","Cosmological redshift is not quite the same as a Doppler shift from something moving through space. Light's wavelength stretches by exactly as much as the universe expanded while it traveled. A galaxy at redshift z = 1 sent its light when the universe was half its current size. The James Webb Space Telescope has confirmed galaxies beyond z = 14, when the universe was less than 300 million years old.","For most of history, the gravity of matter slowed expansion down. About 5 billion years ago, dark energy took over and expansion began to speed up. Because of that, light that galaxies more than about 16 billion light-years away emit today will never reach us.","H<sub>0</sub> is measured several independent ways. The 'distance ladder' uses Cepheid variable stars, red giant stars and Type Ia supernovae. Another method uses the CMB plus the ΛCDM model. Others use a standard spacing between galaxies, lensed quasars whose images flicker at different times, and gravitational-wave events called 'standard sirens'. Nearby methods tend to give about 73; early-universe methods give about 67."],"x":["Light from distant galaxies is shifted toward red. Vesto Slipher measured these redshifts in the 1910s, and Hubble combined them with distances from Cepheid stars to find the straight-line relationship. Modern surveys now extend this to millions of galaxies.\nDistances are built in steps called the cosmic distance ladder: parallax for nearby stars, Cepheids and other 'standard candles' for nearby galaxies, and Type Ia supernovae for faraway ones. A separate route calculates the expansion rate from the CMB using a model of cosmic history.","Galaxies aren't flying through space away from us; the space between them is stretching. That is why very distant galaxies can move apart faster than light without breaking relativity: relativity limits motion through space, not the growth of space.\nExpansion doesn't stretch everything. Atoms, people, planets and galaxies are held together by forces far stronger than expansion at their size. It only shows up between galaxy groups that aren't held together by gravity.","The Hubble tension: Planck's CMB data give about 67 km/s/Mpc, while the SH0ES team's supernova measurements give about 73. Both have small error bars. JWST has double-checked the Cepheid measurements, and scientists still disagree about whether hidden errors explain the gap.\nIf the difference is real, it could mean new physics, such as an extra form of energy in the early universe or dark energy that changes over time."],"terms":["Today's expansion rate: how fast galaxies recede for each unit of distance, in km/s per megaparsec.","1/H₀, about 14.5 billion years; a rough natural timescale for the universe's age.","Distance measured on a grid that stretches with the universe, so it stays fixed for galaxies carried along by expansion.","A chain of measuring methods, each one calibrating the next, used to reach greater and greater distances.","The distance beyond which light given off now can never reach us, because expansion is speeding up."],"s":"Distant galaxies move away from us at speeds roughly proportional to their distance, a pattern called Hubble's law (v = H<sub>0</sub>d). We see it as redshift: their light is stretched to longer wavelengths. That the universe is expanding is certain, but its exact current rate is disputed. Measurements based on the early universe give about 67 km/s per megaparsec, while measurements using nearby stars and supernovae give about 73. Whether that gap is a measurement error or a sign of new physics is an open question.","why":"The expansion rate sets the universe's age, size and future, and every distance measurement beyond our galactic neighborhood depends on it. The unresolved gap between the two ways of measuring H<sub>0</sub>, known as the Hubble tension, is one of the strongest hints that our standard model of cosmology might be missing something."},"dark-matter":{"how":["The leading model is cold dark matter: particles that move slowly compared with light and interact mostly or only through gravity. Since they barely collide, they don't lose energy and flatten into disks like gas does. Instead they form large, roughly round 'halos' that extend far beyond the visible parts of galaxies. The Milky Way's halo has a mass of roughly a trillion Suns, about ten times more than all its stars and gas.","Dark matter was essential for building galaxies. In the early universe, light kept ordinary matter smooth, but dark matter ignores light, so it started clumping early. After atoms formed, ordinary matter fell into those clumps. Without that head start, galaxies wouldn't have had time to form. Computer simulations that include cold dark matter reproduce the real 'cosmic web' of filaments, clusters and voids very well.","The evidence comes from many scales. Gravitational lensing shows where mass is, not just where light is. In the colliding Bullet Cluster, most of the mass is with the galaxies, not with the hot gas that crashed together in the middle. And the pattern of the CMB requires matter that didn't interact with light.","The main alternative is MOND (Modified Newtonian Dynamics), which changes gravity at extremely small accelerations, around 10<sup>−10</sup> m/s². It fits the rotation of many galaxies well, but it struggles with galaxy clusters, the CMB and gravitational lensing unless some unseen mass is added anyway.","Scientists search in three ways. Direct detection uses ultra-sensitive detectors deep underground that wait for a dark matter particle to bump an atomic nucleus. Indirect detection looks for gamma rays or other particles made when dark matter particles destroy each other. Collider searches at the LHC look for energy that goes missing in collisions. None has found a confirmed signal yet."],"x":["In the 1930s, Fritz Zwicky noticed that galaxies in the Coma Cluster moved too fast to be held together by the mass he could see. In the 1970s, Vera Rubin and Kent Ford showed that stars far from the centers of spiral galaxies orbit just as fast as stars closer in, even though the visible mass thins out.\nMore evidence followed: gravitational lensing maps mass directly, the Bullet Cluster shows mass separated from hot gas after a collision, the CMB pattern needs extra matter that doesn't interact with light, and simulations need dark matter to build galaxies in time.","Dark matter isn't just ordinary matter that happens to be dark, like dust, rogue planets or dim stars. Measurements limit ordinary matter to about 5% of the universe, and searches for dark compact objects rule them out as the main ingredient.\nIt also isn't the same as dark energy. Dark matter clumps and pulls with gravity; dark energy is spread evenly and speeds up expansion. They only share the word 'dark', which here means 'invisible'.","Possible candidates include WIMPs (weakly interacting massive particles), axions, sterile neutrinos and primordial black holes. Underground detectors like LZ and XENONnT have ruled out much of the expected WIMP range without finding anything. Axion searches such as ADMX are continuing.\nSmaller puzzles, like how dark matter is spread out in the centers of small galaxies, are still debated and may hint at what it is."],"terms":["A large, roughly round cloud of dark matter surrounding a galaxy.","A graph of how fast stars or gas orbit at different distances from a galaxy's center.","The bending of light by mass, which distorts or magnifies objects behind it.","Weakly Interacting Massive Particle: a long-favored dark matter candidate that would interact through gravity and maybe the weak force.","A proposed, extremely light particle that could also be dark matter.","Modified Newtonian Dynamics: an alternative idea that changes gravity at very small accelerations instead of adding dark matter."],"s":"Galaxies spin too fast, galaxy clusters hold together too tightly, and light bends too much for the matter we can see to explain. The leading explanation is dark matter: a kind of matter that has gravity but doesn't give off, absorb or reflect light. Its gravitational effects are well measured, but what it is made of is unknown. Decades of experiments haven't detected a dark matter particle, and the alternative idea of changing the laws of gravity struggles to explain all the evidence at once.","why":"Dark matter makes up about 85% of all matter in the universe. It shaped every galaxy, including ours, and figuring out what it is will likely reveal physics beyond the Standard Model. Whether it turns out to be a new particle, something stranger, or a sign that gravity needs rewriting, the answer will change physics."},"dark-energy":{"how":["In general relativity, both energy and pressure create gravity. Something with strong enough negative pressure, with a pressure-to-energy ratio w below −1/3, makes expansion speed up instead of slow down. A cosmological constant has w = −1 exactly: a fixed energy density that is part of empty space.","That energy density is tiny by everyday standards, about 6 × 10<sup>−27</sup> kg/m³, the same as roughly three or four hydrogen atoms per cubic meter. It dominates the universe only because it fills all of space and, unlike matter, doesn't thin out as space expands.","Each ingredient of the universe thins out differently. Matter density drops as 1/<i>a</i>³ because the volume grows. Radiation drops as 1/<i>a</i>⁴ because its wavelength also stretches. A cosmological constant stays the same. So radiation dominated the first ~50,000 years, matter dominated for the next ~10 billion, and dark energy took over a few billion years ago. Acceleration began about 5–6 billion years ago.","Other explanations include quintessence (a slowly changing energy field) and theories that modify gravity on cosmic scales. DESI describes dark energy with two numbers, w<sub>0</sub> and w<sub>a</sub>, and its recent results suggest dark energy is weakening.","Dark energy decides the universe's future. If it is constant, expansion speeds up forever. If it gets stronger ('phantom' energy, w < −1), it could eventually tear apart galaxies, stars and even atoms in a 'Big Rip'. If it fades, expansion could slow and, in some models, reverse."],"x":["The 1998 supernova results from two competing teams, the Supernova Cosmology Project and the High-Z Supernova Search Team, were later confirmed by independent methods. The CMB shows space is flat, which requires a certain total density; matter supplies only about 32% of it, leaving the rest to dark energy.\nBaryon acoustic oscillations, a standard spacing between galaxies left over from early-universe sound waves, act as a cosmic ruler and also show the acceleration.","Dark energy doesn't push apart galaxies, stars or planets from the inside; its effect only matters over hundreds of millions of light-years.\nA cosmological constant doesn't thin out as space expands, which is why it now dominates while matter has faded in importance. That describes how it behaves, not where it comes from.","Quantum physics, in a simple estimate, predicts a vacuum energy about 10<sup>120</sup> times bigger than what we measure, one of the worst mismatches in all of physics. Nobody knows why the real value is so small but not zero.\nDESI's 2024–2025 results, combined with supernova and CMB data, suggest dark energy may be weakening, at a confidence level of roughly 2.8 to 4.2 sigma depending on which data are combined. More data from DESI, Euclid and the Rubin Observatory should decide whether this is real."],"terms":["A constant energy density of empty space, added to Einstein's equations, that makes expansion speed up.","The ratio of a substance's pressure to its energy density; w = −1 for a cosmological constant.","A proposed energy field whose strength can change over time, as an alternative to a constant.","A standard spacing of about 500 million light-years between galaxies, left by early-universe sound waves and used as a cosmic ruler.","A possible ending in which ever-stronger dark energy rips apart all structures."],"s":"In 1998, two teams found that distant exploding stars (Type Ia supernovae) were dimmer than expected, which meant the expansion of the universe is speeding up. That discovery won the 2011 Nobel Prize. The simplest explanation is a cosmological constant: a small amount of energy that belongs to empty space itself. Recent results from the DESI survey (2024–2025) hint that dark energy might be getting weaker over time, which would mean it is not a constant, but this is not yet confirmed.","why":"Dark energy makes up about two-thirds of the universe's total energy and controls its long-term fate. Its measured size is also the biggest known mismatch between theory and observation in physics, so explaining it will likely require new ideas about gravity, quantum physics, or both."},"inflation":{"how":["Inflation proposes that an energy field, called the inflaton, briefly filled space with nearly constant energy. Like a temporary, much stronger version of dark energy, it drove exponential expansion. To solve the problems it was designed for, space must have grown by a factor of at least about 10<sup>26</sup> in a tiny fraction of a second. The field slowly 'rolled' down its energy hill, keeping inflation going until it reached the bottom.","It solves three puzzles. The horizon problem: opposite sides of the CMB sky have the same temperature to 1 part in 100,000, even though without inflation they could never have exchanged heat. Inflation says they started as one tiny connected patch. The flatness problem: space is flat to within about 0.4%, which would need extreme fine-tuning; inflation stretches any curve flat, like the surface of a balloon blown up enormously. The relic problem: exotic particles predicted by some theories would be diluted until undetectable.","Its most impressive prediction is about quantum fluctuations. Tiny random jitters in the inflaton field were stretched to enormous sizes and became the density differences that grew into galaxies. Inflation predicts those ripples should be almost, but not exactly, the same strength at all sizes, a spectral index slightly below 1. Planck measured about 0.965, matching the prediction.","Inflation should also make primordial gravitational waves. Their strength is measured by the tensor-to-scalar ratio r. Current measurements show r is below 0.036, which has already ruled out some of the simplest inflation models, while others still fit.","When inflation ended, the inflaton's energy turned into ordinary particles and radiation. This 'reheating' started the hot Big Bang that standard cosmology describes."],"x":["Alan Guth proposed inflation in 1980, and Andrei Linde, Andreas Albrecht and Paul Steinhardt improved it. It was designed to explain why distant regions have the same temperature and why space is flat. It predicted that early density ripples would be almost equally strong at all sizes, with a slight tilt.\nPlanck measured that tilt (spectral index about 0.965), which agrees with simple inflation models. This supports inflation but doesn't prove it, because other ideas could in principle produce a similar pattern.","Inflation is not the Big Bang itself, and it's not today's accelerating expansion, even though both involve exponential growth. It's a separate, proposed phase at the very beginning.\nIt's also not one single theory but a family of hundreds of models, which critics say makes it hard to test.","What field drove inflation, why it started and how it ended are unknown. Some versions lead to 'eternal inflation' and a multiverse, which many physicists think can't be tested.\nSome critics, including Paul Steinhardt, one of inflation's founders, argue alternatives like a 'bouncing' universe deserve equal attention. Finding primordial B-modes in the CMB, or ruling them out more tightly, is the most decisive test."],"terms":["The proposed energy field that drove inflation.","The puzzle of why distant parts of the CMB have the same temperature even though they seemingly were never in contact.","The puzzle of why space is so precisely flat, which would need finely tuned starting conditions without inflation.","A number describing how the strength of early density ripples changes with size; measured at about 0.965.","How strong primordial gravitational waves are compared with density ripples; currently measured to be below 0.036.","The end of inflation, when the inflaton's energy turned into hot matter and radiation."],"s":"Inflation is the idea that in the first tiny fraction of a second, the universe expanded extremely fast, doubling in size over and over. It explains why the universe is so smooth and flat, and its prediction for the pattern of early ripples matches CMB data well. It is still a hypothesis: its key signature, gravitational waves imprinted on the CMB's polarization, hasn't been detected, and nobody knows what caused it.","why":"If inflation happened, the largest structures in the universe started as quantum effects, linking the physics of the very smallest things to the very largest. It also takes us back to energies about a trillion times higher than the Large Hadron Collider can reach. Detecting primordial gravitational waves would be one of the biggest discoveries in physics."},"bbn":{"how":["About one second after the Big Bang, at around 10 billion K, protons and neutrons stopped turning into each other, because the weak-force reactions became too slow. That left about 1 neutron for every 6 protons. Free neutrons decay, with a lifetime of about 15 minutes, so by the time fusion could start the ratio had dropped to about 1 to 7.","Fusion starts with deuterium: one proton plus one neutron. It forms easily but breaks easily too, and there were about 1.6 billion photons for every proton or neutron. Even when the average photon was too weak, enough high-energy photons remained to break deuterium apart. This 'deuterium bottleneck' lasted until the temperature dropped to about a billion kelvin, about three minutes in.","Once deuterium survived, reactions quickly built helium-4, the most tightly bound light nucleus, and nearly every neutron ended up inside helium. With 1 neutron per 7 particles, that gives about 25% of the mass as helium, exactly what we see in the oldest gas clouds.","Building heavier elements was hard because there are no stable nuclei with 5 or 8 particles, so there were missing stepping stones. Meanwhile, the universe kept expanding and cooling. By about 20 minutes, fusion had stopped, leaving traces of deuterium (about 25 atoms per million hydrogen atoms), helium-3 and a tiny bit of lithium-7.","Because the results depend on how fast the universe expanded and how much ordinary matter it contained, BBN also tests new physics. It shows there are about three light types of neutrino and limits any extra light particles."],"x":["Ralph Alpher, Hans Bethe and George Gamow described how elements could form in the early universe in 1948. Using measured nuclear reaction rates, the theory predicts the amounts of each light element with only one input: the ratio of ordinary matter to photons.\nThat ratio, measured separately from the CMB, gives amounts of deuterium and helium-4 that match observations of distant gas clouds and old stars. Two unrelated methods agreeing is strong confirmation.","The Big Bang didn't make most of the elements. It made almost nothing heavier than lithium, because the universe cooled within about 20 minutes, before heavier nuclei could build up. Carbon, oxygen, iron and almost everything in rocks and living things were made later inside stars.","The 'lithium problem': old stars contain about three times less lithium-7 than predicted. Possible explanations include stars destroying some lithium, uncertainties in nuclear reaction rates, or new physics, and none is settled."],"terms":["The delay in building nuclei because energetic photons kept breaking deuterium apart until the universe cooled enough.","The relative numbers of neutrons and protons, which set how much helium formed.","The amount of an element made in the Big Bang, before stars changed it.","The number of protons and neutrons per photon, about 6 × 10<sup>−10</sup>; the main input to BBN predictions.","The effective number of neutrino-like particle types in the early universe; measured to be close to 3."],"s":"In the first few minutes after the Big Bang, the universe was hot and dense enough for nuclear fusion. Protons and neutrons combined into helium, deuterium (heavy hydrogen) and a little lithium before expansion cooled everything down. The predicted amounts match what we see in the oldest gas clouds, which is a strong test of the Big Bang model. The one mismatch is lithium-7, which is found at only about a third of the predicted amount.","why":"BBN is the earliest part of cosmic history we can check directly with data. Its success shows that nuclear physics worked the same way a few minutes after the Big Bang as it does in labs today, and it puts tight limits on undiscovered particles."},"observable":{"how":["The edge of the observable universe is called the particle horizon: the farthest distance from which light could have reached us since the beginning. Because of expansion during the light's trip, that distance is now about 46.5 billion light-years in every direction, making the observable universe about 93 billion light-years across.","It holds an enormous amount. Estimates of the number of galaxies range from about 200 billion to 2 trillion, depending on how many tiny faint galaxies are counted. That means roughly 10<sup>22</sup> to 10<sup>24</sup> stars and about 10<sup>80</sup> protons. Every cubic centimeter of space still contains about 410 CMB photons and more than 300 leftover neutrinos.","There are several different 'edges'. The Hubble sphere, about 14 billion light-years away, is where galaxies recede at the speed of light today. The cosmic event horizon, about 16–17 billion light-years away, is the limit beyond which light sent now will never reach us. The particle horizon, about 46 billion light-years away, is the limit of what we can see at all. Galaxies beyond the Hubble sphere move away faster than light, yet we still see light they sent long ago.","Looking farther away means looking back in time. The most distant galaxies we see appear as they were less than 300 million years after the Big Bang. Beyond them lies the CMB. Before that, the universe was opaque, so earlier times could only be seen with neutrinos or gravitational waves.","Because expansion is speeding up, distant galaxies will slowly fade from view. In roughly 100–150 billion years, observers in the merged Milky Way–Andromeda galaxy would see no other galaxies at all."],"x":["The size comes from the measured age of the universe and how it expanded. Light emitted 13.8 billion years ago traveled through space that kept stretching, so the places that emitted it are now about 46 billion light-years away.\nThe farthest thing we see directly is the CMB. JWST has confirmed galaxies whose light left them about 13.5 billion years ago, within roughly 300 million years of the Big Bang.","The observable universe being centered on us doesn't mean we're at the center of the universe. Every observer has their own observable bubble centered on them.\nIts boundary isn't a physical wall. There is almost certainly more universe beyond it; its light just hasn't reached us yet, and because expansion is speeding up, some of it never will.","Whether the whole universe is finite or infinite is unknown. Measurements show space is flat to within about 0.4%, which fits an infinite universe but also a very large finite one."],"terms":["The farthest distance from which light could have reached us since the Big Bang; the edge of the observable universe.","The distance at which galaxies are currently moving away at the speed of light.","The distance beyond which light given off now will never reach us.","Distance measured on a grid that stretches with the universe.","How long ago the light we see from an object left it."],"s":"The observable universe is the region close enough that its light has had time to reach us. Its radius is much more than 13.8 billion light-years, about 46.5 billion, because space kept expanding while the light traveled. The entire universe may be much bigger, or even infinite, but we can never see beyond this limit.","why":"The observable universe sets the limit of what we can ever study directly. Everything beyond it has to be inferred, mostly by assuming the universe is the same everywhere. Understanding its edges also clears up common confusion about distances, speeds and the age of the universe."},"fate-universe":{"how":["In about 4.5 billion years, the Milky Way and the Andromeda galaxy will pass close to each other and may merge; recent studies put the chance of a merger within 10 billion years at about 50%. The Sun slowly gets brighter, and within about a billion years Earth's oceans will begin to evaporate. In about 5 billion years, the Sun will become a red giant.","The current star-forming era will last trillions of years, but star formation slows as gas runs out, and around 100 trillion years from now the last small red dwarf stars will fade. Meanwhile, accelerating expansion will carry other galaxy groups out of view within about 100–150 billion years, leaving each group alone.","Next comes an era of dead stars: white dwarfs, neutron stars, brown dwarfs and black holes. If protons decay, ordinary matter slowly disappears. Over about 10<sup>67</sup> to 10<sup>100</sup> years, black holes evaporate through Hawking radiation, the biggest ones last. After that, the universe holds only an ever-thinner, ever-colder mist of particles and radiation: heat death.","Other endings depend on how dark energy behaves. If it gets stronger over time, it could tear apart galaxy clusters, galaxies, planets and finally atoms in a finite time: the Big Rip. If it fades and turns negative, expansion could stop and reverse into a Big Crunch. Current data can't decide yet, but most fit continued expansion."],"x":["Measurements of the CMB, supernovae and galaxy clustering show that expansion has been speeding up for about 5 billion years and that space is flat, so with constant dark energy there is no collapse. Models of stars give lifetimes from about 10 billion years for the Sun to trillions for red dwarfs. DESI's 2024–2025 hints that dark energy may be weakening have reopened possibilities once thought unlikely.","'Heat death' doesn't mean the universe gets hot. It means maximum entropy: no temperature differences left to do useful work, with temperatures close to absolute zero.\nThe Sun dying in about 5 billion years isn't the end of the universe; new stars will keep forming for trillions of years.\nNone of these scenarios matters on a human timescale; even the closest is billions of years away.","What dark energy is, and whether it changes, decides which future is right. Other open questions include whether protons eventually decay, which would erase ordinary matter over more than 10<sup>34</sup> years, and whether our universe's vacuum could suddenly change state. Some cosmologists propose cyclic models in which the universe repeats."],"terms":["A far-future state of maximum entropy where no usable energy differences remain.","A possible ending where strengthening dark energy tears apart all structures.","A possible ending where expansion reverses and the universe collapses.","The current era of the universe, in which stars form and shine.","A proposed, extremely slow breakdown of protons predicted by some theories; never observed."],"s":"The universe's long-term future depends mostly on dark energy. If dark energy is constant, expansion speeds up forever: distant galaxies disappear from view, star formation ends over trillions of years, stars burn out, black holes eventually evaporate, and the universe becomes cold, dark and nearly empty, a 'heat death'. If dark energy gets stronger, a 'Big Rip' is possible; if it weakens or reverses, expansion could slow or even end in a 'Big Crunch'.","why":"The fate of the universe brings together dark energy, the life cycles of stars, black holes and thermodynamics, and studying it improves our understanding of each. It also answers one of humanity's oldest questions: how does the story end?"},"quantum-gravity":{"how":["The scale of quantum gravity comes from combining gravity's constant, the speed of light and Planck's constant. This gives the Planck length (1.6 × 10<sup>−35</sup> m), the Planck time (5.4 × 10<sup>−44</sup> s) and the Planck energy (about 10<sup>19</sup> GeV), roughly a million billion times beyond what the Large Hadron Collider can reach. That huge gap is why direct tests are so hard.","String theory says fundamental particles are actually tiny one-dimensional strings vibrating in different patterns, like notes on a guitar string. One vibration pattern behaves exactly like the graviton, the proposed particle of gravity, so gravity appears naturally. But the math only works with extra dimensions of space, ten dimensions in total, with the extra ones curled up too small to see. String theory has produced important mathematics, but it allows an enormous number of possible universes and hasn't made a unique testable prediction.","Loop quantum gravity instead treats space itself as quantum: areas and volumes come in tiny separate units, connected in networks. It doesn't need extra dimensions, but showing that it turns into smooth general relativity on large scales, and making testable predictions, are still challenges. Applied to cosmology, it suggests the Big Bang might have been a 'bounce' from an earlier shrinking universe.","Other ideas include the possibility that spacetime emerges from quantum entanglement. An important clue any theory must explain is that a black hole's entropy is proportional to the area of its horizon, not its volume; string theory has reproduced this for certain black holes."],"x":["Treating gravity like the other forces in quantum field theory fails: the calculations give infinite answers that can't be removed. General relativity predicts its own breakdown at singularities. The black hole information paradox shows that combining Hawking's quantum result with relativity leads to contradictions. And at the Planck scale, about 1.6 × 10<sup>−35</sup> m, quantum jitters of spacetime itself should become important.","String theory isn't one tested theory but a large mathematical framework; 'theory' here means a candidate idea, not an established explanation like evolution or general relativity.\nQuantum gravity doesn't say gravity is wrong at everyday scales; any successful theory must match general relativity everywhere it's been tested.\nThe Planck length isn't proven to be the smallest possible length; it marks the scale where our current theories are expected to fail.","Almost everything is unknown: whether spacetime is smooth or made of tiny pieces, whether extra dimensions exist, what replaces the Big Bang singularity and how information escapes from black holes. Clues might come from tiny delays in gamma rays from distant explosions, from the CMB, from gravitational waves, or from tabletop experiments testing whether gravity can entangle two masses."],"terms":["About 1.6 × 10<sup>−35</sup> m; the scale where quantum gravity effects are expected to take over.","The proposed quantum particle of gravity.","A framework where fundamental particles are vibrating strings; it requires extra dimensions.","An approach where space is built from tiny separate quantum units of area and volume.","The idea that all the information inside a region can be stored on its boundary."],"s":"General relativity and quantum mechanics are each extremely well tested, but they don't work together where both matter: inside black holes and at the Big Bang. A theory of quantum gravity would describe spacetime itself using quantum rules. The leading candidates are string theory, which replaces point particles with tiny vibrating strings, and loop quantum gravity, which builds space out of tiny separate units. Neither has been confirmed by experiment.","why":"Quantum gravity is needed to understand the beginning of the universe, the insides of black holes and the true nature of space and time. It's widely considered the deepest unsolved problem in theoretical physics."},"antimatter":{"how":["Antiparticles have the same mass and spin as their partners but opposite electric charge and other opposite properties. Some neutral particles, like the photon, are their own antiparticles. Physicists describe matter and antimatter with three symmetries: C (swapping particles for antiparticles), P (mirror reflection) and T (reversing time). Their combination, CPT, is believed to always hold.","Annihilation turns mass completely into energy. An electron and a positron usually produce two gamma-ray photons of 511 keV each, flying in opposite directions. PET scanners detect these pairs coming from a radioactive tracer, often fluorine-18 attached to sugar, to map activity inside the body.","Antimatter forms wherever enough energy is concentrated: in particle accelerators, cosmic rays hitting the atmosphere, certain radioactive decays, around pulsars and black holes, and in thunderstorms, where satellites have detected bursts of positrons. Positrons annihilating near the center of our galaxy produce a measurable 511 keV glow.","Storing antimatter is hard because it annihilates on contact with any container. Charged antiparticles are held in Penning traps using electric and magnetic fields, and neutral antihydrogen is held by carefully shaped magnetic fields. CERN's Antiproton Decelerator slows down antiprotons for experiments, and researchers are building portable traps to carry antiprotons by truck to other labs."],"x":["Paul Dirac's 1928 equation for the electron predicted a positively charged partner. Carl Anderson discovered the positron in cosmic rays in 1932. The antiproton was made at Berkeley in 1955. CERN made the first antihydrogen atoms in 1995 and has since trapped them for minutes at a time. In 2023, the ALPHA-g experiment showed that antihydrogen falls down under gravity, as general relativity predicts.","Antimatter doesn't fall up, and it doesn't have 'negative mass'; it has normal positive mass.\nAntimatter isn't just science fiction or made in labs: a banana gives off a positron about once every 75 minutes from the decay of potassium-40.\nAntimatter isn't a practical fuel: making it takes far more energy than it releases, and all the antiprotons CERN has ever made would power a light bulb for only a few minutes.","The Big Bang should have made equal amounts of matter and antimatter, yet about one extra matter particle per billion pairs survived after the rest annihilated. Explaining this requires processes where matter and antimatter behave differently (CP violation) beyond what the Standard Model provides. Scientists search for matter–antimatter differences in neutrinos, particle decays and precise measurements of antihydrogen."],"terms":["A particle with the same mass as another but opposite charge and other opposite properties.","The antiparticle of the electron, with a positive charge.","A difference in how matter and antimatter behave under combined charge and mirror symmetry.","The excess of matter over antimatter in the universe.","A device that holds charged particles using electric and magnetic fields."],"s":"Every particle has an antiparticle with the same mass and opposite charge: electrons have positrons and protons have antiprotons. When a particle meets its antiparticle, they annihilate, turning all their mass into energy. Antimatter is made regularly in particle accelerators, radioactive decay, cosmic-ray collisions and even thunderstorms, and it's used in medical PET scans. Why the universe is made almost entirely of matter is one of physics' great mysteries.","why":"Antimatter tests the basic symmetries of nature, is a powerful medical tool and is at the heart of the question of why anything exists at all. Explaining why there's more matter than antimatter would reveal new physics from the universe's first moments."},"nature-of-time":{"how":["In Newton's physics, time is absolute: one universal clock ticking the same everywhere. Einstein replaced this. In special relativity, time depends on relative motion, and observers moving differently can disagree about whether distant events happen at the same time. In general relativity, clocks deeper in gravity run slower. Time becomes one dimension of four-dimensional spacetime.","The basic laws of mechanics, electromagnetism and gravity work the same if you reverse time; a video of orbiting planets looks just as believable played backward. The weak force shows a tiny exception, far too small to explain everyday one-way processes. The direction we experience, eggs breaking but never un-breaking, comes from the second law of thermodynamics: entropy (disorder) increases.","Entropy increases because the universe started in an extremely low-entropy state. Every direction of time we notice traces back to this: the thermodynamic arrow, the fact that we remember the past and not the future, waves spreading outward from their sources, and the expansion of the universe.","In quantum mechanics, time isn't something you measure like position; it's the background the equations run along. In some approaches to quantum gravity, time disappears from the basic equations completely and may only emerge approximately, through entanglement with clocks. Experiments with entangled photons have demonstrated simple versions of this idea."],"x":["Time dilation is measured all the time: atomic clocks flown on airplanes (Hafele–Keating, 1971), GPS satellites and optical clocks separated by just millimeters all confirm relativity's predictions. Particle accelerators show fast-moving unstable particles living longer. The second is defined by cesium atoms, and the best optical clocks now keep time to better than one part in 10<sup>18</sup>.","Time dilation isn't an illusion or a broken clock; all physical processes, including aging, slow down equally.\nThe 'block universe' view, where past, present and future all exist equally, is a common interpretation of relativity, not a proven fact.\nTraveling to the future is real in a small way, through time dilation; traveling to the past is still speculative and runs into serious paradoxes and physical obstacles.","Is time fundamental, or does it emerge from something deeper, maybe quantum entanglement? Why did the universe begin with such low entropy? Is there really a flowing 'now', or is that something our minds create? Some versions of quantum gravity, like the Wheeler–DeWitt equation, have no time variable at all, a puzzle called 'the problem of time'."],"terms":["The one-way direction of time in everyday life, linked to increasing entropy.","A clock running slower because of motion or gravity.","The view that past, present and future all exist equally in spacetime.","When a physical law works the same with time running backward.","The conflict between how time works in quantum mechanics and in general relativity."],"s":"Physics treats time in surprisingly different ways. In relativity, time is a dimension woven into spacetime; it passes at different rates depending on speed and gravity, and there's no single universal 'now'. In quantum mechanics, time is just a background parameter. Most basic laws of physics work equally well forward and backward, yet we experience a clear direction of time, which physicists trace back to the universe's very orderly beginning. Whether time is fundamental or emerges from something deeper is unknown.","why":"Time is part of every physical law, measurement and experience. Understanding it connects relativity, thermodynamics, cosmology and quantum gravity, and precise timekeeping keeps GPS, phone networks and financial systems running."},"multiverse":{"how":["Beyond our horizon: if space is infinite and the same everywhere, as observations allow, there are infinitely many regions the size of our observable universe. Since there are only so many ways to arrange matter in such a region, some would repeat ours exactly. This is the least speculative version, following from standard cosmology plus one simple assumption about space.","Eternal inflation: in many inflation models, inflation stops in some regions while continuing in others. Each region where it stops becomes a 'bubble' with its own hot Big Bang, possibly with different physical constants. The bubbles are separated forever by space that is still inflating.","Many-worlds: in Hugh Everett's interpretation, the wavefunction never collapses. Each measurement links the observer to the system, and every possible outcome happens in a separate branch, and the branches stop interacting. It makes the same predictions as standard quantum mechanics, so it's an interpretation rather than a separately testable theory.","Landscape and fine-tuning: string theory seems to allow an enormous number of stable vacuum states, each with different physics. Combined with eternal inflation, this has been used to explain why our universe's constants seem fine-tuned for life: we must find ourselves in a region where we can exist. This is called the anthropic principle, and it's controversial."],"x":["Regions beyond our horizon follow directly from the observable universe being finite while space may be much larger or infinite. Eternal inflation came from inflation models in the 1980s, developed by Alexander Vilenkin and Andrei Linde. Hugh Everett proposed the many-worlds interpretation in 1957. The string landscape idea arose in the early 2000s, when theorists estimated string theory might allow 10<sup>500</sup> or more possible vacuum states.","The multiverse isn't one theory but a family of very different ideas, some much more speculative than others.\nMany-worlds doesn't let you visit or communicate with other branches; they don't interact.\nThe multiverse isn't established science. It sits at the boundary between physics and philosophy, and many physicists question whether ideas that can't be tested belong in science.","Proposed tests include searching the CMB for circular marks left by collisions with other bubble universes (none found so far) and checking whether the value of dark energy matches multiverse-based predictions. Critics argue that a theory that can predict anything really predicts nothing. Supporters reply that if well-tested theories imply a multiverse, it deserves serious attention even if parts of it can never be observed."],"terms":["A proposed collection of many universes or regions with possibly different properties.","A scenario where inflation never stops everywhere, continually creating bubble universes.","The view that every possible quantum outcome happens, each in a separate branch.","The huge set of possible vacuum states allowed by string theory.","The idea that the conditions we observe must allow observers like us to exist."],"s":"'Multiverse' covers several different ideas that other universes, or regions beyond our observable universe, might exist: endless space with regions beyond our view, 'bubble universes' created by eternal inflation, the many-worlds interpretation of quantum mechanics, and string theory's huge 'landscape' of possible universes. Some versions follow from established theories, but none has been directly tested, and whether they ever can be is debated.","why":"Multiverse ideas test the limits of scientific explanation, raising questions about what counts as a testable theory and why the laws of physics are the way they are. Because they follow from serious theories, understanding them clarifies what those theories actually imply."},"radioactivity":{"how":["Whether a nucleus is stable depends on its balance of protons and neutrons. Light stable nuclei have roughly equal numbers; heavier ones need extra neutrons to offset the growing electric repulsion between protons. Nuclei with too many neutrons undergo beta-minus decay, where a neutron becomes a proton and gives off an electron and an antineutrino. Those with too many protons undergo beta-plus decay or electron capture. Very heavy nuclei often give off alpha particles.","Each individual nucleus decays at a random moment, but large numbers are predictable. The amount remaining drops exponentially: N = N<sub>0</sub> × (1/2)<sup>t/T</sup>, where T is the half-life. Iodine-131's half-life is 8 days, carbon-14's is 5,730 years and uranium-238's is 4.47 billion years. Alpha decay happens by quantum tunneling, which is why half-lives can differ enormously for small differences in energy.","Radiometric dating compares how much of the original (parent) isotope is left with how much of its decay product (daughter) has built up. Carbon-14, made by cosmic rays and absorbed by living things, dates organic remains up to about 50,000 years old. Uranium–lead dating of zircon crystals reaches billions of years, giving Earth's age as about 4.54 billion years.","Radiation harms living tissue by knocking electrons off atoms and damaging DNA. Alpha particles are stopped by paper or skin but are dangerous if breathed in or swallowed. Beta particles are stopped by a few millimeters of aluminum. Gamma rays need thick lead or concrete. These same properties make radioactivity useful in cancer treatment, medical imaging, smoke detectors and spacecraft power."],"x":["Henri Becquerel discovered radioactivity in 1896 when uranium salts fogged photographic plates kept in the dark. Marie and Pierre Curie discovered polonium and radium, and Marie Curie became the first person to win Nobel Prizes in two different sciences. Ernest Rutherford identified alpha and beta radiation and, with Frederick Soddy, showed that radioactivity turns one element into another. Willard Libby developed radiocarbon dating in the late 1940s.","Not all radiation is equally dangerous, and everyone receives natural background radiation, about 3 millisieverts per year on average, from radon gas, rocks, cosmic rays and food.\nThings exposed to gamma rays or X-rays don't become radioactive; irradiated food is safe to eat.\nA sample isn't gone after two half-lives: each half-life removes half of what's left, so after two, a quarter remains, and after ten, about 0.1%.","Some decays are barely measurable: xenon-124 has a half-life of about 10<sup>22</sup> years, a trillion times the age of the universe. Physicists are searching for even rarer processes, like neutrinoless double-beta decay, which would show whether neutrinos are their own antiparticles. The 'neutron lifetime puzzle', a disagreement of about 9 seconds between two ways of measuring how long free neutrons last, is still unsolved."],"terms":["The time it takes for half of a radioactive sample to decay.","A helium-4 nucleus given off by some heavy nuclei.","A decay where a neutron becomes a proton (or the reverse), giving off an electron or positron.","A very high-energy photon given off by an excited nucleus.","Finding an object's age from the ratio of a radioactive isotope to its decay products."],"s":"Radioactive nuclei are unstable and change on their own, giving off particles or energy. The main types are alpha decay (giving off a helium nucleus), beta decay (a neutron turning into a proton or the reverse, giving off an electron or positron) and gamma decay (giving off high-energy light). Each isotope decays at a fixed rate described by its half-life, which ranges from tiny fractions of a second to billions of years. That makes radioactivity both a hazard and a precise natural clock.","why":"Radioactivity dates Earth, fossils and archaeological finds, powers nuclear medicine and spacecraft, and heats Earth's interior, helping drive plate tectonics. Understanding it is essential for using nuclear technology safely."},"fission":{"how":["When uranium-235 absorbs a slow neutron, it becomes an unstable uranium-236 nucleus that stretches and splits, often into barium and krypton plus 2–3 fast neutrons. About 200 MeV is released, mostly as the energy of the flying fragments, which becomes heat. Gram for gram, fission releases millions of times more energy than burning coal.","To keep a steady chain reaction, on average exactly one neutron from each split must cause another split. Most reactors use a moderator, usually water or graphite, to slow neutrons down, because U-235 captures slow neutrons much more easily. Control rods made of neutron-absorbing materials like boron adjust the reaction rate. A small number of 'delayed neutrons', released seconds after fission, make reactors controllable on human timescales.","In a pressurized water reactor, the most common type, water both slows the neutrons and carries heat to a steam generator; the steam spins turbines connected to generators. Natural uranium is only 0.7% U-235, so fuel is 'enriched' to about 3–5%. Used fuel contains radioactive fission products and plutonium that keep giving off heat and radiation for a long time.","Fission weapons bring a supercritical mass together extremely quickly, so the chain reaction grows explosively in under a microsecond. More peacefully, reactors also make medical isotopes like molybdenum-99, the source of technetium-99m used in tens of millions of medical scans each year."],"x":["Otto Hahn and Fritz Strassmann detected fission products in 1938, and Lise Meitner and Otto Frisch explained that uranium nuclei were splitting. In December 1942, Enrico Fermi's team achieved the first self-sustaining chain reaction under the stands of a University of Chicago stadium. The first nuclear power plant connected to a grid started in Obninsk, USSR, in 1954. Accidents at Three Mile Island (1979), Chernobyl (1986) and Fukushima (2011) reshaped safety rules worldwide.\nAt Oklo in Gabon, natural uranium deposits ran fission reactions on their own about 2 billion years ago.","A power reactor can't explode like a nuclear bomb. Reactor fuel is about 3–5% uranium-235, far below weapons-grade (around 90%). Reactor accidents involve overheating, steam or hydrogen explosions and radioactive leaks, not nuclear explosions.\nThe clouds from cooling towers are water vapor, not radiation or smoke.\nFor each unit of electricity produced, nuclear power's death rate, including accidents, is among the lowest of any energy source.","Storing used fuel safely for the long term, since it stays highly radioactive for thousands of years, is unresolved in most countries; in October 2026, Finland's Onkalo became the first deep underground repository licensed to operate. Small modular reactors and new designs aim to improve safety and lower costs, and fuel recycling could get more energy out and reduce waste."],"terms":["A self-sustaining series of fissions, each one triggered by neutrons from earlier ones.","The minimum amount of fissile material needed to keep a chain reaction going.","A material that slows neutrons so they cause fission more easily.","A neutron-absorbing rod used to control a reactor's power.","Increasing the fraction of uranium-235 in uranium fuel."],"s":"Fission splits a heavy nucleus, usually uranium-235 or plutonium-239, into two lighter nuclei after it absorbs a neutron. Each split releases about 200 MeV of energy and two or three new neutrons, which can cause more splits in a chain reaction. Nuclear reactors control this chain reaction carefully to produce steady heat for making electricity; about 9% of the world's electricity comes from fission.","why":"Fission provides roughly a quarter of the world's low-carbon electricity, powers submarines and aircraft carriers, makes medical isotopes and shaped twentieth-century history through nuclear weapons. Its benefits and risks remain central to energy decisions."},"fusion-energy":{"how":["Deuterium–tritium (D–T) fusion is the easiest reaction. It produces helium-4 and a neutron and releases 17.6 MeV. Deuterium is plentiful in seawater. Tritium is rare and radioactive, with a half-life of 12.3 years, so future reactors plan to make it by letting fusion neutrons hit lithium in a surrounding 'blanket'.","The Sun uses its immense gravity and density to fuse hydrogen; reactors on Earth have to make up for that with higher temperatures, over 100 million K. The Lawson criterion sets the target: plasma density times temperature times how long the energy is held in must pass a certain threshold for fusion to keep itself going.","Magnetic confinement holds the plasma with strong magnetic fields. Tokamaks use a doughnut-shaped chamber, outside magnetic coils and an electric current flowing through the plasma. Stellarators, like Germany's Wendelstein 7-X, use complicated twisted coils instead. Instabilities, turbulence and heat hitting the walls are the main engineering challenges.","Inertial confinement uses lasers to crush a tiny fuel capsule to extreme density in billionths of a second, so it fuses before it can fly apart. At NIF, 192 laser beams heat a small gold cylinder, and its X-rays squeeze a peppercorn-sized capsule. A power plant would need to repeat this about ten times per second."],"x":["Fusion research began in the 1950s. The tokamak, a doughnut-shaped magnetic bottle developed in the Soviet Union, became the leading design after strong results in 1968. In its final experiments in 2023, the UK's JET set a fusion energy record of 69 megajoules. The National Ignition Facility reached ignition on December 5, 2022, producing 3.15 MJ from 2.05 MJ of laser energy, and has since beaten that. The international ITER tokamak is being built in France.","NIF's ignition didn't produce net energy overall: its lasers used roughly 300 MJ from the grid to deliver about 2 MJ to the target. A power plant will need much higher gain and many shots per second.\nFusion reactors can't melt down or run out of control; if anything goes wrong, the plasma cools and fusion simply stops.\nFusion isn't free of radioactivity: neutrons make reactor materials radioactive, and tritium is radioactive, but the waste lasts much less time than fission waste.","ITER aims to produce ten times more fusion power than the heating power put into its plasma; its schedule has been delayed, with full deuterium–tritium operation planned for the late 2030s. Private companies are developing compact tokamaks with powerful superconducting magnets, stellarators and other designs, several aiming for demonstration plants in the 2030s. Making tritium and finding materials that can survive intense neutron bombardment are still key challenges."],"terms":["Gas heated until electrons separate from nuclei, forming a charged fluid that conducts electricity.","A doughnut-shaped device that holds plasma with magnetic fields.","A magnetic confinement device that uses twisted outside coils instead of a current in the plasma.","The required combination of density, temperature and confinement time for net fusion energy.","When fusion reactions produce enough heat to keep themselves going."],"s":"Fusion power aims to copy the Sun's energy source on Earth, usually by fusing two types of heavy hydrogen, deuterium and tritium,
