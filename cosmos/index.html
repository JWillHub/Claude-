date, no observation confirms or refutes a multiverse.\nThe central obstacle is the measure problem: in eternal inflation, infinite numbers of observers make probabilities ill-defined without a prescription, and different prescriptions yield different predictions. Critics argue that without a well-defined measure, multiverse theories cannot make testable predictions.","Scientists have looked for 'bruises' in the Big Bang's leftover glow that might show where our universe bumped into another bubble universe. Nothing has been found so far. Many scientists wonder whether these ideas can ever be tested at all."]],"supernovae":[["How we know","Historical supernovae (1006, 1054 — whose remnant is the Crab Nebula — 1572 and 1604) were recorded worldwide. Baade and Zwicky (1934) proposed that supernovae form neutron stars.\nSN 1987A in the Large Magellanic Cloud was detected by Kamiokande-II, IMB and Baksan through 24 or so neutrinos, confirming the energy budget and time scale of core collapse (2002 Nobel Prize to Koshiba). JWST observations in 2024 found emission lines from argon ionized by a central compact source, the strongest evidence yet for a neutron star in its remnant. Light echoes have allowed spectra of the historical Tycho and Cassiopeia A events.","In 1054, Chinese astronomers saw a new 'guest star' that was visible even in daytime. Its leftover cloud is the Crab Nebula. In 1987, a supernova in a nearby galaxy sent neutrinos to Earth that scientists caught in underground detectors."],["Common misconceptions","A nova is not a small supernova. A classical nova is a thermonuclear runaway in a thin hydrogen layer accreted onto a white dwarf, about 10<sup>4</sup> times less energetic, and the white dwarf survives and can erupt again.\nBetelgeuse's 2019–2020 'Great Dimming' was caused by a dust cloud and surface cooling, not an impending explosion. It will explode sometime in roughly the next 100,000 years, and at about 170 pc it poses no danger; harmful effects on Earth's ozone require a supernova within about 10 pc.","When Betelgeuse explodes someday, it won't hurt us; it's much too far away. It will just look like an extremely bright star, maybe even visible in daytime, for weeks to months."],["Still unknown","The explosion mechanism is not fully settled: which progenitors explode, the role of rotation and magnetic fields, and how neutron-star versus black-hole outcomes map onto progenitor mass. The Type Ia progenitor channel (single- versus double-degenerate, Chandrasekhar versus sub-Chandrasekhar mass) is debated, with consequences for cosmological systematics.\nDetectors in the SuperNova Early Warning System (SNEWS 2.0) are ready to catch the next Galactic event's neutrinos minutes to hours before the optical light. The Rubin Observatory's LSST will discover millions of supernovae over its survey.","Our galaxy should have a supernova about once or twice every 100 years, but none has been seen up close since 1604. Scientists are waiting for the next one, ready to study it with every kind of detector."]],"quasars":[["How we know","Schmidt (1963) identified 3C 273's spectral lines as hydrogen redshifted by z = 0.158, implying enormous luminosity; Salpeter and Zel'dovich (1964) and Lynden-Bell (1969) proposed accretion onto supermassive black holes.\nEvidence includes rapid variability (light-crossing arguments limit sizes to light-days), relativistically broadened Fe Kα lines, reverberation measurements, and the EHT image of the M87* jet base. Gas-dynamical and maser masses (NGC 4258) and GRAVITY interferometry of broad-line regions confirm the inferred black hole masses.","In 1963, astronomer Maarten Schmidt figured out that a 'star' called 3C 273 was actually billions of light-years away, which meant it had to be unbelievably bright. Its brightness flickered over months, meaning it was tiny compared with a galaxy. The only explanation: a giant black hole eating gas."],["Common misconceptions","Quasars are not a separate class of object from ordinary galaxies; they are phases. Most massive galaxies, including the Milky Way, host a supermassive black hole that is currently quiet: Sgr A* accretes at about 10<sup>−8</sup> of its Eddington rate.\nQuasar light does not come from the black hole itself, but from the disk and corona outside the horizon, typically at radii of 3–100 r<sub>s</sub>.","Quasars aren't stars; they just looked like dots of light in old telescopes. And the light doesn't come from the black hole itself, but from super-hot gas swirling around it."],["Still unknown","How the first quasars grew so large so quickly is unsolved: a 10⁹ M<sub>☉</sub> black hole at z ≈ 7.5 (age about 700 Myr) requires near-continuous Eddington-limited growth from heavy seeds, or super-Eddington episodes. JWST's abundant faint AGN and 'little red dots' at z ≈ 4–9, and an overmassive black hole in UHZ1 at z ≈ 10.1, sharpen this question.\nHow jets are launched and collimated, what triggers quasar activity (mergers or secular inflow), and how much feedback is needed to quench galaxies remain debated.","How did such giant black holes grow so big so soon after the Big Bang? The James Webb telescope found mysterious 'little red dots' in the early universe that might be growing black holes, but scientists are still figuring them out."]],"fate-universe":[["What the evidence says","Supernovae, BAO and the CMB show that expansion is accelerating with w ≈ −1. For ΛCDM this implies indefinite expansion, because a positive constant Λ cannot be overcome once matter is diluted; recollapse would require dark energy to change sign.\nCurrent constraints come from a 13.8-billion-year baseline. The DESI preference for w<sub>0</sub> > −1 and w<sub>a</sub> < 0 at 2.8–4.2σ, if confirmed, would mean the asymptotic future is not determined by present data alone. Even a pure Λ is a fit, not an explanation.","Scientists know space has been speeding up its stretching for about 5 billion years. New measurements hint that dark energy might be getting weaker, which could change the ending, so scientists are watching closely."],["Common misconceptions","'Heat death' does not mean high temperature; it means thermodynamic equilibrium with no free energy gradients to sustain processes. The de Sitter horizon itself has a Gibbons–Hawking temperature T = ħH/(2πk<sub>B</sub>) ≈ 2 × 10<sup>−30</sup> K.\nThe expanding universe also does not 'run out of energy' in a conserved sense. Global energy conservation is not defined in general relativity without a time-translation symmetry, and the energy in Λ grows with volume. What runs down is low-entropy free energy.","'Heat death' actually means everything gets super cold, not hot! It means energy is spread out so evenly that nothing interesting can happen anymore. And don't worry: all of this is billions to trillions of years away."],["Still unknown","It is unknown whether protons decay, whether dark energy is constant, and whether the electroweak vacuum is absolutely stable. With m<sub>H</sub> ≈ 125.1 GeV and m<sub>t</sub> ≈ 172.5 GeV, Standard Model extrapolations suggest a metastable vacuum with a tunneling lifetime vastly longer than 10<sup>100</sup> years. New physics at high energy could change this.\nFar-future quantum effects, such as Poincaré recurrences, Boltzmann brains in de Sitter space, and the possible decay of de Sitter space itself, are theoretical puzzles that test the consistency of combining cosmology with quantum mechanics.","Will protons, the building blocks of atoms, last forever, or slowly break down after unimaginable amounts of time? Could the universe end and start over? Scientists don't know."]],"states-of-matter":[["History","Van der Waals (1873) explained liquid–gas transitions and the critical point; Andrews measured CO<sub>2</sub>'s critical point (1869). Kamerlingh Onnes liquefied helium (1908) and discovered superconductivity (1911); Kapitsa, Allen and Misener found superfluidity in 1938. Langmuir coined 'plasma' in 1928.\nBose–Einstein condensates of rubidium and sodium were created in 1995. Landau's theory of phase transitions and Wilson's renormalization-group explanation of universality (1982 Nobel Prize) underpin modern understanding, and the quark–gluon plasma was established at RHIC in 2005.","Scientists figured out that temperature is just how fast molecules jiggle. Plasma got its name in 1928. In 1995, scientists cooled atoms to less than a millionth of a degree above absolute zero and made a strange new state of matter where atoms act like one giant super-atom."],["Common misconceptions","There are not just three (or four) states of matter. Physicists identify many phases distinguished by symmetry, order and topology: liquid crystals, superfluids, superconductors, spin glasses, quasicrystals and multiple high-pressure ice phases (more than 20 are known).\nGlass is not a slowly flowing liquid. Thicker bottoms on old window panes come from manufacturing; the viscosity of window glass at room temperature implies flow times far longer than the age of the universe. Glass is an amorphous solid formed when a liquid is cooled faster than it can crystallize, and the nature of the glass transition is itself unsolved.","Old windows aren't thicker at the bottom because glass flows; they were just made unevenly. And water can boil at room temperature if the air pressure is low enough!"],["Still unknown","The theory of the glass transition, the mechanism of high-temperature (cuprate and nickelate) superconductivity, and the full QCD phase diagram at high baryon density, including whether a critical point exists (being searched for at RHIC's beam energy scan) and whether color-superconducting phases occur in neutron stars, are major open problems.\nThe behavior of hydrogen and water at multi-megabar pressures inside giant planets, including the transition to metallic hydrogen, is still debated, with experiments at diamond-anvil cells and laser-shock facilities reporting partly conflicting results.","Scientists keep discovering new and weird states of matter. Even everyday glass still has some unsolved mysteries!"]]};
const Y={"big-bang":{"how":{"s":["Assuming the cosmological principle, the metric reduces to the Friedmann–Lemaître–Robertson–Walker (FLRW) form, in which the only dynamical variable is <i>a</i>(t) (normalized to 1 today) plus a constant spatial curvature <i>k</i>. Inserting this into Einstein's field equations gives the first Friedmann equation, which relates the Hubble rate H = ȧ/<i>a</i> to the total energy density:<span class=\"eq\"><span class=\"eql\">H² = (8πG/3)ρ − <i>k</i>c²/<i>a</i>² + Λc²/3</span></span>Light emitted at time t<sub>e</sub> arrives stretched by 1 + z = 1/<i>a</i>(t<sub>e</sub>), so redshift is a direct readout of how much the universe has grown.","Energy conservation in an expanding volume, ρ̇ + 3H(ρ + p/c²) = 0, gives ρ ∝ <i>a</i><sup>−3(1+w)</sup> for a component with equation of state p = wρc². Radiation (w = 1/3) dilutes as <i>a</i><sup>−4</sup>, matter (w = 0) as <i>a</i><sup>−3</sup>, and a cosmological constant (w = −1) not at all. Solving the Friedmann equation era by era gives <i>a</i> ∝ t<sup>1/2</sup> while radiation dominates, <i>a</i> ∝ t<sup>2/3</sup> while matter dominates, and exponential growth once Λ takes over. Radiation and matter densities were equal at z ≈ 3,400, about 50,000 years after the Big Bang.","Because photon temperature scales as T = T<sub>0</sub>(1 + z), the thermal history is a sequence of freeze-outs set by comparing reaction rates Γ with the expansion rate H. Quarks and gluons confine into hadrons near kT ≈ 155 MeV (t ~ 10 μs); neutrinos decouple near 1 MeV (t ~ 1 s); light nuclei form near 0.07 MeV (t ~ 3 min); and hydrogen recombines near 0.26 eV (T ≈ 3,000 K, t ≈ 380,000 yr). Each transition left a fossil: the neutron-to-proton ratio, the D/H ratio, the CMB, and a predicted cosmic neutrino background.","The concordance model, ΛCDM, fits the data with six parameters. Planck 2018 gives Ω<sub>b</sub>h² = 0.0224, Ω<sub>c</sub>h² = 0.120, the acoustic angle 100θ<sub>*</sub> = 1.0411, reionization optical depth τ = 0.054, and primordial amplitude A<sub>s</sub> ≈ 2.1 × 10<sup>−9</sup> with spectral tilt n<sub>s</sub> ≈ 0.965. Derived quantities follow by integration; for example the age is<span class=\"eq\"><span class=\"eql\">t<sub>0</sub> = ∫<sub>0</sub><sup>∞</sup> dz / [(1 + z) H(z)]</span><span class=\"eql\">≈ 13.79 Gyr</span></span>Spatial curvature is consistent with zero, |Ω<sub>k</sub>| ≲ 0.002.","Structure grows by gravitational instability from initial density contrasts δ ~ 10<sup>−5</sup>. In linear theory, cold dark matter perturbations grow as δ ∝ <i>a</i> during matter domination, while baryons stay locked to photons until recombination and then fall into the existing potential wells. Nonlinear collapse produces halos that host the first stars at z ~ 20–30; N-body simulations reproduce the observed cosmic web of filaments, walls and voids. If Λ is constant, the growth factor saturates and expansion becomes exponential with an e-folding time of about 17.5 Gyr."],"m":["Einstein's math for gravity has a surprising result: a universe full of stuff can't just sit still. It has to be growing or shrinking. Ours is growing, so if you play the movie backward, everything gets closer, denser and hotter.","As the universe grew and cooled, things formed in a certain order, a bit like steam cooling into water and then into ice. First came tiny particles, then the centers of atoms, then whole atoms, then stars, galaxies, planets and eventually us. Each stage left clues we can still find today.","At the start, the universe was almost perfectly smooth, with tiny lumps about 1 part in 100,000. Gravity slowly pulled those lumps together. Over hundreds of millions of years they became the first stars and galaxies, which today form a giant web stretching across space.","What about the future? Space will probably keep stretching faster and faster. In about 100 billion years, other galaxies will drift out of sight, and after trillions of years the stars will burn out. That said, scientists are still checking whether dark energy is changing, which could change the ending."]},"why":{"s":"The Big Bang framework is the coordinate system for all of cosmology: it converts redshift into time and distance, predicts the CMB spectrum and the light-element abundances from first principles, and supplies the initial conditions for galaxy formation. It also traces the origin of matter itself: primordial hydrogen and most helium date from the first minutes, while heavier elements were synthesized later in stars. Because the early universe reached energies far beyond any accelerator, precision cosmology constrains particle physics, including the number of light neutrino species and the sum of neutrino masses.","m":"The Big Bang story explains where everything came from, including you. The hydrogen in the water you drink was made in the first few minutes of the universe, about 13.8 billion years ago!"},"terms":[["Scale factor","<i>a</i>(t): the dimensionless factor multiplying all comoving separations in the FLRW metric, normalized to <i>a</i>(t<sub>0</sub>) = 1; H = ȧ/<i>a</i>.","How stretched the universe is compared with now."],["Redshift (z)","Defined by 1 + z = λ<sub>obs</sub>/λ<sub>emit</sub> = 1/<i>a</i>(t<sub>emit</sub>); a geometric consequence of expansion, not a Doppler shift through static space.","When light gets stretched toward red because space grew."],["Cosmological principle","The hypothesis that the universe is statistically homogeneous and isotropic on scales ≳ 100 Mpc; it restricts the metric to the FLRW form.","The idea that the universe looks about the same everywhere if you zoom out far enough."],["ΛCDM","The six-parameter concordance model: flat FLRW geometry with a cosmological constant, cold dark matter, baryons, photons and three neutrino species, seeded by nearly scale-invariant adiabatic Gaussian perturbations.","Scientists' main 'recipe' for the universe."],["Planck time","t<sub>P</sub> = √(ħG/c⁵) ≈ 5.39 × 10<sup>−44</sup> s, the time scale at which quantum fluctuations of spacetime geometry are expected to be order unity.","The tiniest slice of time our science can talk about."]]},"cmb":{"how":{"s":["Recombination happened far below the 13.6 eV ionization energy of hydrogen because photons outnumber baryons by about 1.6 × 10⁹. The Saha equation shows that even at kT ≈ 0.3 eV, the high-energy Wien tail of the photon distribution contains enough ionizing photons to keep hydrogen mostly ionized. Once the free-electron fraction dropped, the Thomson scattering rate Γ = n<sub>e</sub>σ<sub>T</sub>c fell below H, and photons last scattered at z<sub>*</sub> ≈ 1,090, about 372,000 years after the Big Bang. The last-scattering 'surface' is a shell with thickness Δz ≈ 80.","Before decoupling, baryons and photons behaved as a single fluid with sound speed<span class=\"eq\"><span class=\"eql\">c<sub>s</sub> = c / √[3(1 + R)]</span><span class=\"eql\">R = 3ρ<sub>b</sub>/4ρ<sub>γ</sub></span></span>Dark matter potential wells drove compressions; photon pressure drove rarefactions. The comoving distance a sound wave travels before decoupling, the sound horizon r<sub>s</sub> ≈ 144 Mpc, subtends θ<sub>*</sub> = r<sub>s</sub>/D<sub>A</sub> ≈ 0.596° on the sky. That angle fixes the harmonic spacing of the acoustic peaks.","The temperature field is expanded as ΔT/T(θ, φ) = Σ <i>a</i><sub>ℓm</sub>Y<sub>ℓm</sub>(θ, φ), and the power spectrum C<sub>ℓ</sub> = ⟨|<i>a</i><sub>ℓm</sub>|²⟩ is plotted as D<sub>ℓ</sub> = ℓ(ℓ + 1)C<sub>ℓ</sub>/2π. Multipole ℓ corresponds to an angle of roughly 180°/ℓ. The first peak at ℓ ≈ 220 fixes the geometry (spatially flat); baryon loading R enhances odd peaks relative to even ones, measuring Ω<sub>b</sub>h²; and the height of the third peak measures Ω<sub>c</sub>h². Photon diffusion (Silk damping) exponentially suppresses power at ℓ ≳ 1,000.","Thomson scattering of a local quadrupole anisotropy produces linear polarization. It is decomposed into curl-free E-modes, sourced by density perturbations, and divergence-free B-modes, which primordial density perturbations cannot produce at linear order. E-modes and the TE cross-correlation are measured precisely. Weak gravitational lensing by large-scale structure converts some E-mode power into B-modes, which have been detected. Primordial B-modes from inflationary gravitational waves remain undetected: r < 0.036 (BICEP/Keck, 95% confidence).","Secondary effects carry later information. Inverse-Compton scattering off hot cluster gas (the thermal Sunyaev–Zel'dovich effect) shifts photons to higher frequencies, giving ΔT/T = −2y at low frequency, with Compton parameter y = ∫ (kT<sub>e</sub>/m<sub>e</sub>c²) n<sub>e</sub>σ<sub>T</sub> dl and a null near 217 GHz. Lensing smooths the acoustic peaks and lets the projected mass be reconstructed. Our velocity of about 370 km/s relative to the CMB rest frame produces a 3.36 mK dipole, ΔT/T ≈ v/c."],"m":["Imagine the early universe as a thick, glowing fog. Light kept bumping into loose electrons and couldn't go anywhere. At about 380,000 years old, the universe cooled enough for electrons to settle into atoms, the fog cleared, and light flew free. That light is still traveling today, stretched by expanding space into microwaves.","Before the fog cleared, the universe was actually full of sound waves! Gravity pulled matter together, and light pushed it apart again, so the whole universe vibrated a little like a ringing bell. When the fog cleared, those vibrations froze into the hot and cold spots we see.","By measuring the sizes of those spots, scientists worked out the universe's age, its shape (flat, like a sheet of paper, not curved like a ball), and that there must be lots of invisible dark matter.","Fun facts: we're moving through this glow at about 370 km/s, so the sky looks a tiny bit warmer in the direction we're heading. And a small part of the fuzzy static on old analog TVs came from this leftover light from the Big Bang."]},"why":{"s":"The CMB is the cleanest cosmological probe because its physics is linear perturbation theory in a well-understood plasma. It fixes the baryon and dark matter densities, the acoustic scale and the primordial spectrum to better than 1%, and it calibrates the standard ruler used in galaxy surveys. Any extension of ΛCDM, such as extra relativistic species (N<sub>eff</sub>), massive neutrinos, early dark energy or nonzero curvature, must reproduce the measured C<sub>ℓ</sub>, which makes the CMB the main arbiter of the Hubble tension.","m":"It's the oldest light we can ever see, a baby picture of the whole universe. Almost everything we know about the universe's age and recipe comes from studying it."},"terms":[["Recombination","The epoch (z ≈ 1,100) at which the free-electron fraction fell steeply as protons captured electrons; delayed relative to kT = 13.6 eV by the high photon-to-baryon ratio.","When atoms first formed and the cosmic fog cleared."],["Last scattering surface","The thin shell (Δz ≈ 80) around any observer at which CMB photons had their final Thomson scattering, defined by the peak of the visibility function.","The 'wall' of fog we see the leftover glow coming from."],["Power spectrum","The variance of the spherical-harmonic coefficients, C<sub>ℓ</sub> = ⟨|<i>a</i><sub>ℓm</sub>|²⟩, as a function of multipole ℓ; it contains all information in a Gaussian random field.","A chart showing how big the hot and cold spots are."],["Acoustic peaks","Harmonic maxima in C<sub>ℓ</sub> at ℓ ≈ 220, 540, 810, ... produced by standing acoustic oscillations of the photon–baryon fluid frozen at decoupling.","Signals of the sound waves that rang through the baby universe."],["Sunyaev–Zel'dovich effect","The spectral distortion of the CMB produced by inverse-Compton scattering off hot electrons in clusters, with amplitude given by the Compton y parameter; independent of the cluster's redshift.","A shadow in the leftover glow that reveals hidden galaxy clusters."]]},"expansion":{"how":{"s":["In FLRW coordinates the proper distance to a comoving galaxy is d<sub>p</sub>(t) = <i>a</i>(t)χ, where χ is the fixed comoving distance. Differentiating gives ḋ<sub>p</sub> = (ȧ/<i>a</i>)d<sub>p</sub> = H(t)d<sub>p</sub>: Hubble's law is exact at all distances for this definition of recession velocity, so it is not limited to v ≪ c. Galaxies beyond the Hubble radius c/H<sub>0</sub> ≈ 4.4 Gpc currently recede faster than light, and we see many of them.","Observable distances depend on the expansion history through the comoving distance<span class=\"eq\"><span class=\"eql\">χ(z) = c ∫<sub>0</sub><sup>z</sup> dz′ / H(z′)</span></span>with H(z) = H<sub>0</sub>[Ω<sub>m</sub>(1 + z)³ + Ω<sub>r</sub>(1 + z)⁴ + Ω<sub>Λ</sub>]<sup>1/2</sup> in flat ΛCDM. In a flat universe the luminosity distance is d<sub>L</sub> = (1 + z)χ and the angular-diameter distance is d<sub>A</sub> = χ/(1 + z). Comparing d<sub>L</sub> from standard candles with d<sub>A</sub> from standard rulers tests the model independently.","Expanding <i>a</i>(t) around today defines the deceleration parameter q<sub>0</sub> = −ä<i>a</i>/ȧ² = Ω<sub>m</sub>/2 − Ω<sub>Λ</sub> ≈ −0.53, so expansion is accelerating. Acceleration began when Ω<sub>m</sub>(1 + z)³ fell below 2Ω<sub>Λ</sub>, at z ≈ 0.63, about 6 billion years ago. The Hubble time 1/H<sub>0</sub> ≈ 14.5 Gyr is close to the age (13.8 Gyr) because early deceleration and late acceleration roughly cancel; this near-equality holds only in the present epoch.","Accelerated expansion creates a cosmic event horizon, the proper distance d<sub>EH</sub> = c<i>a</i>(t<sub>0</sub>) ∫<sub>t<sub>0</sub></sub><sup>∞</sup> dt/<i>a</i>(t) ≈ 16.7 billion light-years. Events beyond it now will never be observed. Galaxies above z ≈ 1.8 are already outside it: we receive light they emitted long ago, but light they emit today will never reach us.","H<sub>0</sub> is measured by several methods with different systematics. The distance ladder runs from geometric anchors (Gaia parallaxes, detached eclipsing binaries in the Large Magellanic Cloud, the NGC 4258 water maser) through Cepheids, the tip of the red giant branch (TRGB) or J-region asymptotic giant branch stars, to Type Ia supernovae in the Hubble flow. Inverse-ladder methods calibrate baryon acoustic oscillations with the CMB sound horizon. Time-delay strong lenses measure Δt ∝ 1/H<sub>0</sub>. Gravitational-wave standard sirens give d<sub>L</sub> directly; GW170817 alone gave H<sub>0</sub> = 70 (+12/−8) km/s/Mpc."],"m":["Picture galaxies as dots drawn on a balloon. Blow up the balloon and every dot moves away from every other dot, and dots that start farther apart separate faster. That's exactly the pattern astronomers see: a galaxy twice as far away moves away twice as fast.","As light travels across stretching space, the light wave itself gets stretched, making it redder. The more it's stretched, the longer it has been traveling. The most distant galaxies ever seen have light stretched about 15 times, from when the universe was less than 300 million years old!","Here's a mind-bender: very distant galaxies are moving away from us faster than light. That doesn't break Einstein's speed limit, because nothing is racing through space; space itself is growing. Some galaxies are so far away that light they shine today will never, ever reach us.","For billions of years, gravity slowed the stretching down. But around 5 billion years ago, it started speeding up instead, pushed by mysterious dark energy."]},"why":{"s":"H<sub>0</sub> sets the absolute scale of cosmology: every physical distance, luminosity, mass and age derived from redshift scales with h = H<sub>0</sub>/(100 km/s/Mpc). The tension between early-universe (sound-horizon-calibrated) and late-universe (ladder-calibrated) values is the most significant persistent anomaly in ΛCDM. Proposed resolutions, such as early dark energy that shrinks r<sub>s</sub>, extra relativistic species, or modified late-time dynamics, each make testable predictions for the CMB damping tail and BAO.","m":"How fast space stretches tells us how old the universe is and what will happen to it. Right now, scientists can't agree on the exact speed, which might mean there's something new out there to discover."},"terms":[["Hubble constant (H₀)","The present expansion rate H(t<sub>0</sub>) = ȧ/<i>a</i>|<sub>0</sub>, in km/s/Mpc; often written H<sub>0</sub> = 100h km/s/Mpc.","How fast space is stretching right now."],["Hubble time","t<sub>H</sub> = 1/H<sub>0</sub> ≈ 977.8/h Gyr ≈ 14.5 Gyr for h = 0.674; equals the age only for a coasting (<i>a</i> ∝ t) universe.","A rough guide to the universe's age based on its stretching speed."],["Comoving distance","χ, the coordinate separation on the expanding grid; related to proper distance by d<sub>p</sub> = <i>a</i>(t)χ and computed as c∫dz/H(z).","Distance on a 'stretchy map' that grows along with space."],["Cosmic distance ladder","The sequence of overlapping calibrations (parallax → Cepheids or TRGB → Type Ia supernovae) by which geometric distances are extended to the Hubble flow.","A step-by-step way of measuring farther and farther away."],["Cosmic event horizon","The maximum proper distance from which light emitted now can ever reach us, finite in an accelerating universe: about 16.7 billion light-years for Planck ΛCDM.","The line past which light can never reach us, ever."]]},"dark-matter":{"how":{"s":["For a circular orbit, v<sub>c</sub>(r) = √[GM(<r)/r]. If luminous mass dominated, v<sub>c</sub> would decline as r<sup>−1/2</sup> (Keplerian) beyond the stellar disk; instead H I 21-cm rotation curves stay roughly flat to tens of kiloparsecs. Flat v<sub>c</sub> implies M(<r) ∝ r and density ρ ∝ r<sup>−2</sup>, an isothermal-like halo. Cold dark matter simulations predict the Navarro–Frenk–White profile<span class=\"eq\"><span class=\"eql\">ρ(r) = ρ<sub>s</sub> / [(r/r<sub>s</sub>)(1 + r/r<sub>s</sub>)²]</span></span>The Milky Way's halo mass is about 10<sup>12</sup> solar masses, roughly ten times its baryonic mass.","On cluster scales, the virial theorem (2K + U = 0) gives M ~ σ²R/G from galaxy velocity dispersions σ, as Zwicky first did in 1933. X-ray gas in hydrostatic equilibrium yields M(<r) = −(kT r/Gμm<sub>p</sub>)(d ln n/d ln r + d ln T/d ln r). Lensing measures projected mass directly; for a point lens the Einstein radius is θ<sub>E</sub> = √[(4GM/c²)D<sub>ls</sub>/(D<sub>l</sub>D<sub>s</sub>)]. All three methods give mass-to-light ratios of a few hundred in solar units, with baryons about 15% of the total.","Cosmologically, dark matter is required because baryonic perturbations cannot grow before recombination: photon pressure holds them in oscillation. Dark matter perturbations grow logarithmically during radiation domination and as δ ∝ <i>a</i> afterward, so by z ≈ 1,100 they have built potential wells for baryons to fall into. Without them, ΔT/T ~ 10<sup>−5</sup> fluctuations could not grow into nonlinear structure (δ ≳ 1) by today. The CMB's third acoustic peak independently measures a nonoscillating matter component.","'Cold' means the particles were nonrelativistic at decoupling, so free-streaming erases only very small structures. Warm dark matter (keV-scale) suppresses power below dwarf-galaxy scales; Lyman-α forest and Milky Way satellite counts require thermal-relic masses above a few keV. A thermal relic that froze out of equilibrium has<span class=\"eq\"><span class=\"eql\">Ω<sub>χ</sub>h² ≈ 0.1 ×</span><span class=\"eql\">(3 × 10<sup>−26</sup> cm³ s<sup>−1</sup> / ⟨σv⟩)</span></span>so a weak-scale annihilation cross section naturally yields the observed density: the 'WIMP miracle'.","Detection strategies are complementary. Direct detection seeks keV-scale nuclear recoils in liquid-xenon time-projection chambers (LZ, XENONnT, PandaX-4T), which are now sensitive enough to have detected solar ⁸B neutrinos scattering coherently off nuclei, the onset of the 'neutrino fog'. Indirect detection searches for annihilation products from dense regions; the Fermi-LAT Galactic Center GeV excess may instead come from unresolved millisecond pulsars. Axion haloscopes such as ADMX convert axions to microwave photons in a strong magnetic field, scanning μeV-scale masses."],"m":["Think of dark matter as an invisible scaffolding holding the universe together. It doesn't glow, reflect or block light, so we can't see it. But it has gravity, and lots of it: about five times more than all the normal stuff in the universe.","Every galaxy, including ours, sits inside a giant ball of dark matter called a halo. Our galaxy's halo weighs about as much as a trillion Suns! Because dark matter doesn't bump into things, it doesn't flatten into a disk like the stars do. It just forms a big fuzzy cloud.","Dark matter was the universe's head start. In the beginning, it clumped together first, then normal matter fell into those clumps and made stars and galaxies. Without it, we might not have galaxies at all, and so no Sun, no Earth and no us.","Scientists hunt for it in three ways: super-sensitive detectors buried deep underground (to block out other particles), space telescopes looking for flashes from dark matter particles colliding, and giant particle smashers trying to make it themselves."]},"why":{"s":"Dark matter makes up about 84% of the matter density and set the gravitational scaffolding for every galaxy. Its properties, including mass, self-interaction cross section and coupling to Standard Model particles, are imprinted on halo structure, the matter power spectrum and the CMB. Identifying it would be the first direct evidence for a particle beyond the Standard Model; failure to find any particle across the accessible parameter space would push the field toward ultralight bosons, primordial black holes or modified gravity.","m":"Most of the matter in the universe is something we've never seen or touched. Figuring out what it is would be one of the biggest discoveries in science."},"terms":[["Dark matter halo","The extended, approximately spherical, gravitationally bound dark matter distribution around a galaxy, typically described by an NFW or Einasto profile.","A giant invisible ball of dark matter around a galaxy."],["Rotation curve","The circular velocity v<sub>c</sub>(r) = √[GM(<r)/r] as a function of galactocentric radius; flatness at large r is the classic signature of a halo.","A chart of how fast stars circle a galaxy."],["Gravitational lensing","Deflection of light by mass, with angle α = 4GM/(c²b) for a point mass; strong lensing produces multiple images, weak lensing small coherent shape distortions.","When gravity bends light like a magnifying glass."],["WIMP","Weakly Interacting Massive Particle: a GeV–TeV thermal relic with roughly weak-scale annihilation cross section, ⟨σv⟩ ≈ 3 × 10<sup>−26</sup> cm³/s.","A possible kind of dark matter particle."],["Axion","A pseudoscalar Nambu–Goldstone boson of the Peccei–Quinn symmetry proposed to solve the strong CP problem; produced nonthermally (misalignment), so it is cold despite its tiny mass.","Another possible dark matter particle, super light."],["MOND","Modified Newtonian Dynamics: below acceleration a<sub>0</sub> ≈ 1.2 × 10<sup>−10</sup> m/s², the effective acceleration becomes √(a<sub>N</sub>a<sub>0</sub>); a phenomenological alternative to dark matter on galactic scales.","An idea that gravity works differently far from galaxy centers."]]},"dark-energy":{"how":{"s":["The second Friedmann (acceleration) equation shows why pressure matters:<span class=\"eq\"><span class=\"eql\">ä/<i>a</i> = −(4πG/3) Σ<sub>i</sub>(ρ<sub>i</sub> + 3p<sub>i</sub>/c²)</span></span>In general relativity pressure gravitates. A component with w < −1/3 makes ρ + 3p/c² negative and therefore drives ä > 0. A cosmological constant contributes ρ<sub>Λ</sub> = Λc²/8πG with p<sub>Λ</sub> = −ρ<sub>Λ</sub>c², the stress-energy of a Lorentz-invariant vacuum.","The observed value is ρ<sub>Λ</sub> = Ω<sub>Λ</sub>ρ<sub>crit</sub>, where ρ<sub>crit</sub> = 3H<sub>0</sub>²/8πG ≈ 8.5 × 10<sup>−27</sup> kg/m³, giving ρ<sub>Λ</sub> ≈ 5.8 × 10<sup>−27</sup> kg/m³ (about 3.5 hydrogen-atom masses per cubic meter), or an energy scale ρ<sub>Λ</sub><sup>1/4</sup> ≈ 2.3 meV in natural units. In ΛCDM, Ω<sub>m</sub> and Ω<sub>Λ</sub> were equal at z ≈ 0.3 and acceleration began at z ≈ 0.63, about 6 billion years ago.","For a general component, ρ ∝ <i>a</i><sup>−3(1+w)</sup>. Dynamical models are usually parametrized by the Chevallier–Polarski–Linder form w(<i>a</i>) = w<sub>0</sub> + w<sub>a</sub>(1 − <i>a</i>). Quintessence, a scalar field φ rolling in a potential V(φ), has<span class=\"eq\"><span class=\"eql\">w = (½φ̇² − V) / (½φ̇² + V)</span></span>so −1 ≤ w ≤ 1. Values w < −1 ('phantom') require a negative kinetic term or a modified gravity sector. DESI's preferred region (w<sub>0</sub> ≈ −0.7 to −0.85, w<sub>a</sub> < 0) implies w crossed −1 in the past, which a single canonical scalar cannot do.","Observational probes measure either geometry or growth. Geometric probes include supernova luminosity distances d<sub>L</sub>(z) and BAO, which measure D<sub>M</sub>(z)/r<sub>d</sub> transverse and D<sub>H</sub>(z)/r<sub>d</sub> = c/[H(z)r<sub>d</sub>] along the line of sight, with r<sub>d</sub> ≈ 147 Mpc the sound horizon at baryon drag. Growth probes, such as redshift-space distortions (fσ<sub>8</sub>), weak lensing and cluster counts, test whether structure grows as general relativity predicts for the measured expansion. Disagreement between the two would indicate modified gravity rather than a new energy component.","The long-term future depends on w. For w = −1, the universe asymptotes to de Sitter space with H<sub>∞</sub> = H<sub>0</sub>√Ω<sub>Λ</sub> and an e-folding time of about 17.5 Gyr. For constant w < −1, ρ grows and the scale factor diverges in finite time (a Big Rip), roughly (2/3)|1 + w|<sup>−1</sup>H<sub>0</sub><sup>−1</sup>(1 − Ω<sub>m</sub>)<sup>−1/2</sup> from now. Thawing or decaying fields could instead return w → 0 or even turn the effective energy density negative, allowing eventual recollapse."],"m":["Dark energy seems to be a kind of energy built into empty space itself. Here's the strange part: when space stretches, there's more space, so there's more dark energy, and it pushes even harder. That's why the expansion is speeding up.","It's incredibly thin: in a box one meter on each side, dark energy is equal to the mass of just a few hydrogen atoms. But space is so enormous that, added up, it's the biggest ingredient in the universe.","Long ago, there was so much matter packed close together that its gravity won and slowed expansion down. As space stretched, matter spread out and got weaker, while dark energy stayed the same. About 5 billion years ago, dark energy took the lead.","What happens next depends on what dark energy really is. If it stays the same, the universe stretches forever. If it gets stronger, it could someday rip everything apart (the 'Big Rip'). If it fades, the stretching could slow down. New surveys are trying to find out."]},"why":{"s":"Dark energy dominates today's energy budget and determines the asymptotic fate of the universe. Its magnitude is also the sharpest naturalness problem in physics: zero-point energies of known fields, cut off at the Planck scale, overshoot ρ<sub>Λ</sub> by about 120 orders of magnitude (about 60 even with a TeV cutoff). Confirmation that w evolves would rule out a pure cosmological constant and point toward a new dynamical field or a failure of general relativity on cosmological scales.","m":"It's most of the universe, it decides how the universe will end, and nobody knows what it is. That makes it one of the biggest mysteries in science."},"terms":[["Cosmological constant (Λ)","Λ, a constant term in Einstein's equations, G<sub>μν</sub> + Λg<sub>μν</sub> = (8πG/c⁴)T<sub>μν</sub>; equivalent to vacuum energy with ρ<sub>Λ</sub> = Λc²/8πG and w = −1.","A steady push built into empty space."],["Equation of state (w)","w = p/(ρc²); it sets the dilution law ρ ∝ <i>a</i><sup>−3(1+w)</sup>. Acceleration requires w < −1/3.","A number that describes how dark energy behaves."],["Quintessence","A dynamical scalar field with canonical kinetic term rolling in a potential V(φ), giving time-dependent w ≥ −1.","An idea that dark energy could change over time."],["Baryon acoustic oscillations","The imprint of the sound horizon at baryon drag, r<sub>d</sub> ≈ 147 comoving Mpc (about 480 million light-years), in the galaxy correlation function; a standard ruler for D<sub>M</sub>(z) and H(z).","A built-in 'ruler' in how galaxies are spread out."],["Big Rip","The finite-time divergence of the scale factor (and tearing apart of bound systems) that occurs for constant w < −1.","A possible ending where everything gets pulled apart."]]},"inflation":{"how":{"s":["The horizon problem: in a decelerating universe the comoving Hubble radius (<i>a</i>H)<sup>−1</sup> grows, so regions now observed in opposite directions on the CMB were never in causal contact. Without inflation, the particle horizon at recombination subtends only about 2° on today's sky, yet the CMB is isotropic to 10<sup>−5</sup>. A period with ä > 0 shrinks (<i>a</i>H)<sup>−1</sup>, so the whole observable universe originated within one causally connected patch.","The flatness problem: the Friedmann equation gives Ω − 1 = <i>k</i>c²/(<i>a</i>H)², so |Ω − 1| grows as t during radiation domination and as t<sup>2/3</sup> during matter domination. Today's |Ω<sub>k</sub>| ≲ 0.002 requires |Ω − 1| ≲ 10<sup>−60</sup> at the Planck time without inflation. During inflation, (<i>a</i>H)<sup>−1</sup> shrinks by a factor e<sup>N</sup>, driving Ω → 1. About 50–60 e-folds suffice, depending on the reheating temperature.","In single-field slow roll, a scalar φ obeys φ̈ + 3Hφ̇ + V′(φ) = 0 with H² ≈ V/(3M<sub>Pl</sub>²), where M<sub>Pl</sub> is the reduced Planck mass. Inflation requires small slow-roll parameters<span class=\"eq\"><span class=\"eql\">ε = (M<sub>Pl</sub>²/2)(V′/V)²</span><span class=\"eql\">η = M<sub>Pl</sub>² V″/V</span></span>Inflation ends when ε reaches about 1, after which φ oscillates about its minimum and decays into Standard Model particles (reheating), producing the hot Big Bang.","Quantum fluctuations of φ, of amplitude δφ ≈ H/2π per Hubble time, are stretched beyond the horizon and freeze in as curvature perturbations. The resulting power spectra are<span class=\"eq\"><span class=\"eql\">P<sub>ℛ</sub> = H²/(8π²εM<sub>Pl</sub>²)</span><span class=\"eql\">n<sub>s</sub> − 1 ≈ 2η − 6ε</span><span class=\"eql\">r ≈ 16ε</span></span>Planck's A<sub>s</sub> ≈ 2.1 × 10<sup>−9</sup> and red tilt n<sub>s</sub> < 1 fit these predictions. Single-field slow roll also predicts nearly Gaussian statistics; Planck measures f<sub>NL</sub><sup>local</sup> = −0.9 ± 5.1, consistent with that.","Tensor modes (primordial gravitational waves) have amplitude set by H alone, P<sub>t</sub> = 2H²/(π²M<sub>Pl</sub>²), so r measures the inflationary energy scale, V<sup>1/4</sup> ≈ 1.04 × 10<sup>16</sup> GeV × (r/0.01)<sup>1/4</sup>. The bound r < 0.036 already excludes simple monomial potentials such as m²φ² and φ⁴. Plateau potentials, including Starobinsky R² inflation and Higgs inflation (predicting n<sub>s</sub> ≈ 0.965, r ≈ 0.004), remain viable, although a 2025 analysis combining ACT, Planck and DESI data prefers a slightly higher n<sub>s</sub> ≈ 0.974 that puts some pressure on them."],"m":["Imagine blowing up a balloon so fast that in a tiny fraction of a second it goes from smaller than an atom to bigger than a grapefruit. Inflation says the baby universe did something like that, driven by a special kind of energy that filled space.","This would explain some puzzles. Why are opposite sides of the sky exactly the same temperature? Because before inflation, they were right next to each other and had time to even out. Why is space so flat? Because stretching something enormously smooths it out, like how Earth looks flat when you stand on it.","Here's the coolest part: the tiniest quantum jiggles during inflation got stretched to giant sizes. Those became the lumps that grew into galaxies. If inflation is right, every galaxy started as a microscopic quantum wobble!","When inflation ended, its energy turned into a super-hot soup of particles, which is where the regular Big Bang story picks up."]},"why":{"s":"Inflation, if correct, explains why the universe is large, flat and smooth, and provides a causal mechanism for the seeds of all structure. It also links cosmology to physics at energies of order 10<sup>15</sup>–10<sup>16</sup> GeV, near the grand-unification scale and far beyond collider reach. A detection of primordial B-modes would measure that energy scale and constitute indirect evidence for quantized gravitational perturbations.","m":"If it's true, the galaxies in the sky began as tiny quantum jitters. That would connect the smallest things in nature to the biggest."},"terms":[["Inflaton","The scalar field whose potential energy drives inflation; its identity (a new field, the Higgs or a geometric degree of freedom) is unknown.","The mystery energy that may have powered the growth spurt."],["Horizon problem","The causal disconnection, in a decelerating cosmology, of CMB regions separated by more than about 2°, despite their equal temperature.","Why far-apart parts of the sky match so perfectly."],["Flatness problem","The fine-tuning of |Ω − 1| to ~10<sup>−60</sup> at early times needed to produce today's near-flatness without inflation.","Why space is so flat."],["Spectral index","n<sub>s</sub>, defined by P<sub>ℛ</sub>(<i>k</i>) ∝ <i>k</i><sup>n<sub>s</sub>−1</sup>; n<sub>s</sub> = 1 is exact scale invariance. Measured n<sub>s</sub> ≈ 0.965 (Planck 2018).","A number describing the pattern of early lumps."],["Tensor-to-scalar ratio (r)","r = P<sub>t</sub>/P<sub>ℛ</sub> at a pivot scale; in slow roll r ≈ 16ε, and it fixes the energy scale of inflation. Current bound r < 0.036 (95%).","How strong inflation's space-ripples were."],["Reheating","The transfer of inflaton energy into Standard Model particles after inflation, through perturbative decay or nonperturbative preheating, setting the initial temperature of the hot Big Bang.","When inflation's energy turned into hot particles."]]},"bbn":{"how":{"s":["At T ≳ 1 MeV, weak reactions n + ν<sub>e</sub> ↔ p + e<sup>−</sup> and n + e<sup>+</sup> ↔ p + ν̄<sub>e</sub> keep neutrons and protons in equilibrium, with<span class=\"eq\"><span class=\"eql\">n/p = exp(−Δmc²/kT)</span><span class=\"eql\">Δmc² = 1.293 MeV</span></span>The weak rate falls as Γ ∝ G<sub>F</sub>²T⁵, faster than H ∝ T², so the reactions freeze out at T ≈ 0.8 MeV, where n/p ≈ 1/6. Free neutron decay (lifetime τ<sub>n</sub> ≈ 879 s) then lowers n/p to about 1/7 by the time nuclei can form.","Deuterium has a binding energy of only 2.22 MeV, and with η<sup>−1</sup> ≈ 1.6 × 10⁹ photons per baryon, photodissociation by the Wien tail destroys it until about η<sup>−1</sup>e<sup>−B<sub>D</sub>/kT</sup> ≲ 1, which occurs at kT ≈ 0.07 MeV (T ≈ 8 × 10⁸ K, t ≈ 3 minutes). This 'deuterium bottleneck' holds back all subsequent reactions, which proceed rapidly once it breaks.","Nearly all surviving neutrons end up in ⁴He, the most tightly bound light nucleus, giving<span class=\"eq\"><span class=\"eql\">Y<sub>p</sub> ≈ 2(n/p) / [1 + (n/p)] ≈ 0.25</span></span>Full network calculations with measured nuclear cross sections give Y<sub>p</sub> = 0.2470 at the Planck η. Because no stable nuclei exist with mass number 5 or 8, and the Coulomb barrier rises as the plasma cools, production stalls at trace ⁷Li (made mostly as ⁷Be); essentially no carbon forms.","The yields are sensitive to physics in distinct ways. D/H decreases steeply with η (∝ η<sup>−1.6</sup>), because more baryons burn deuterium more efficiently, making it the best baryometer. Y<sub>p</sub> depends weakly on η but strongly on the expansion rate: H ∝ g<sub>*</sub><sup>1/2</sup>T², so extra relativistic species raise H, freeze n/p out earlier and increase helium. This constrains the effective number of neutrino species, N<sub>eff</sub>.","Observed primordial abundances come from the least-processed environments: D/H from absorption in metal-poor quasar absorption systems (2.527 ± 0.030 × 10<sup>−5</sup>), Y<sub>p</sub> from H II regions in metal-poor dwarf galaxies extrapolated to zero metallicity (0.245 ± 0.003), and ⁷Li/H from the 'Spite plateau' in metal-poor halo stars (about 1.6 × 10<sup>−10</sup>, versus a predicted 4.7–5.6 × 10<sup>−10</sup>). The ³He abundance is harder to measure because stars both make and destroy it."],"m":["In the first second, the universe was a soup of protons and neutrons, about six protons for every neutron. Neutrons don't last long on their own (about 15 minutes), so the clock was ticking.","To build bigger atom centers, the first step is to stick a proton and a neutron together, making deuterium. But the universe was so full of energetic light that new deuterium kept getting knocked apart. For about three minutes, nothing could stick.","Once things cooled enough, deuterium survived, and then helium formed incredibly fast. Almost every neutron ended up inside helium, which is why about a quarter of the normal matter in the universe is helium.","Why didn't it keep going and make carbon or oxygen? There's no stable combination of 5 or 8 particles, so it's like trying to climb stairs with missing steps. And the universe was cooling and spreading out quickly, so after about 20 minutes, the cosmic kitchen closed."]},"why":{"s":"BBN is the earliest epoch tested quantitatively, probing physics at t ~ 1 s through 20 min. It provided the first robust measurement of the baryon density, showing that baryons make up only about 5% of the critical density, a central argument for nonbaryonic dark matter. It constrains N<sub>eff</sub>, the neutron lifetime, possible variation of fundamental constants, and the decays of hypothetical long-lived particles that would inject energy and alter the yields.","m":"It proves our science works even in the universe's first few minutes, and it explains where most of the hydrogen and helium in the universe came from."},"terms":[["Deuterium bottleneck","The delay of nucleosynthesis until kT ≈ 0.07 MeV because photodissociation of the weakly bound deuteron (2.22 MeV) by the abundant photons prevents its accumulation.","The traffic jam that held up making atoms."],["Neutron-to-proton ratio","Set in equilibrium by exp(−1.293 MeV/kT); frozen at about 1/6 near 0.8 MeV and reduced to about 1/7 by neutron decay before nucleosynthesis.","How many neutrons there were compared with protons."],["Primordial abundance","The abundance of a nuclide before stellar processing, inferred by extrapolating observations of metal-poor systems to zero metallicity.","How much of each element the Big Bang made."],["Baryon-to-photon ratio","η = n<sub>b</sub>/n<sub>γ</sub> ≈ 6.1 × 10<sup>−10</sup>; the single free parameter of standard BBN, related to the baryon density by Ω<sub>b</sub>h² ≈ η/(2.74 × 10<sup>−8</sup>).","How much matter there was compared with light."],["N_eff","The effective number of relativistic neutrino species, defined via ρ<sub>rad</sub> = ρ<sub>γ</sub>[1 + (7/8)(4/11)<sup>4/3</sup>N<sub>eff</sub>]; the Standard Model predicts 3.044.","A count of ghostly neutrino types in the early universe."]]},"observable":{"how":{"s":["A radial null geodesic in FLRW satisfies c dt = <i>a</i>(t) dχ, so the comoving distance light travels between times t<sub>1</sub> and t<sub>2</sub> is χ = c∫dt/<i>a</i>(t). Integrating from t = 0 to today gives the particle horizon:<span class=\"eq\"><span class=\"eql\">χ<sub>p</sub> = c ∫<sub>0</sub><sup>∞</sup> dz / H(z) ≈ 46 Gly</span></span>Its proper size today equals its comoving size because <i>a</i>(t<sub>0</sub>) = 1. The CMB surface sits just inside it, at about 45 billion light-years.","Three different horizons are often confused. The Hubble sphere, radius c/H ≈ 14.5 billion light-years, separates objects receding slower than c from faster. The particle horizon (about 46 billion light-years) bounds what we can see today. The event horizon (about 16.7 billion light-years proper) bounds which events occurring now can ever affect us. Because the Hubble sphere is smaller than the particle horizon, we routinely observe galaxies whose current recession velocity exceeds c: in ΛCDM, every source with z ≳ 1.5 is superluminal today.","Different distance measures diverge at high redshift. For JWST galaxy MoM-z14 at z = 14.44, the light-travel (lookback) time is about 13.5 billion years, the current comoving distance is about 34 billion light-years, and the angular-diameter distance is only about 2.2 billion light-years, so the angular size of a fixed-size object reaches a minimum near z ≈ 1.6 and grows again beyond it. Lookback time is t<sub>L</sub> = ∫<sub>0</sub><sup>z</sup> dz′/[(1 + z′)H(z′)].","The contents of the observable volume (about 4 × 10<sup>80</sup> m³) follow from the density parameters: ρ<sub>crit</sub> ≈ 8.5 × 10<sup>−27</sup> kg/m³ and Ω<sub>b</sub> ≈ 0.049 give about 1.5 × 10<sup>53</sup> kg of baryons, roughly 10<sup>80</sup> protons, and about 10<sup>89</sup> CMB photons and a similar number of relic neutrinos. Galaxy counts are uncertain: deep-field extrapolations gave about 2 × 10<sup>12</sup>, while New Horizons measurements of the optical background from beyond Pluto point to a few × 10<sup>11</sup>.","The horizon evolves. In ΛCDM the comoving particle horizon grows toward a finite asymptote of about 62 billion light-years, because the comoving event horizon shrinks as expansion accelerates. Sources beyond the current event horizon will appear to freeze and fade, redshifting to infinity, but not vanish from the sky; in about 150 billion years nearly every galaxy outside the merged Local Group will have redshifted beyond practical detectability."],"m":["We sit at the center of a giant bubble containing everything whose light has had time to reach us. The bubble is about 93 billion light-years across. Every observer, everywhere, has their own bubble.","What's inside? Somewhere between 200 billion and 2 trillion galaxies. Each holds millions to trillions of stars. Scientists estimate there may be more stars in the observable universe than grains of sand on all of Earth's beaches.","Looking far away is like looking into the past. When we see a galaxy 13 billion light-years away, we see how it looked 13 billion years ago, when the universe was young.","In the far future, as space keeps speeding up, other galaxies will slowly disappear from view. Hundreds of billions of years from now, anyone living in our galaxy would see an empty, dark sky beyond it and might never learn other galaxies exist."]},"why":{"s":"The horizon sets the fundamental limit of empirical cosmology: only one realization of the cosmic density field is observable, which imposes cosmic variance on large-angle CMB and galaxy-survey statistics. Horizon geometry also underlies the horizon problem that motivates inflation, the interpretation of superluminal recession, and the information-theoretic bounds proposed in de Sitter holography. Knowing the observable volume makes it possible to estimate total numbers of galaxies, stars and baryons.","m":"It's everything we can possibly see, the limit of our cosmic view. Beyond it, we can only make educated guesses."},"terms":[["Particle horizon","The comoving distance χ<sub>p</sub> = c∫dt/<i>a</i> that light has traveled since t = 0; bounds the region from which any signal can have reached us. About 46 Gly today.","The edge of the bubble we can see."],["Hubble sphere","The sphere of radius c/H(t), on which the recession velocity v = Hd equals c; not a causal horizon, and currently smaller than the particle horizon.","Where galaxies are moving away as fast as light."],["Cosmic event horizon","The proper distance c∫<sub>t<sub>0</sub></sub><sup>∞</sup>dt/<i>a</i> beyond which events now can never be observed; finite (about 16.7 Gly) because of acceleration.","The line past which light will never reach us."],["Comoving distance","χ = c∫dz/H(z), the separation on the expanding coordinate grid; equal to proper distance at the present epoch.","Distance on a stretchy map of space."],["Lookback time","The light-travel time ∫dz/[(1 + z)H] from emission to observation; equal to c<sup>−1</sup> × light-travel distance and always less than the age.","How far back in time you're looking."]]},"fusion":{"how":{"s":["Two nuclei of charge Z<sub>1</sub>e and Z<sub>2</sub>e must overcome a Coulomb barrier of about Z<sub>1</sub>Z<sub>2</sub> × 1.44 MeV·fm / r, roughly 1 MeV for two protons. The mean thermal energy at the solar core is only kT ≈ 1.35 keV. Fusion proceeds by tunneling with Gamow factor P ∝ exp(−√(E<sub>G</sub>/E)), where E<sub>G</sub> = 2m<sub>r</sub>c²(παZ<sub>1</sub>Z<sub>2</sub>)² ≈ 493 keV for p + p. The product of this rising tunneling probability and the falling Maxwell–Boltzmann tail produces the Gamow peak, a narrow window near 6 keV where nearly all reactions occur.","The pp chain begins with p + p → d + e<sup>+</sup> + ν<sub>e</sub>, which requires a weak-interaction conversion of a proton to a neutron during the brief encounter. Its cross section is so small (about 10<sup>−47</sup> cm² at keV energies) that a given proton waits roughly 10<sup>10</sup> years, which is why the Sun is long-lived. Then d + p → ³He + γ, and ³He + ³He → ⁴He + 2p (pp-I, about 83% of terminations in the Sun), with pp-II and pp-III branches via ⁷Be and ⁸B producing higher-energy neutrinos.","In the CNO cycle, carbon, nitrogen and oxygen nuclei act as catalysts: ¹²C(p,γ)¹³N(β<sup>+</sup>)¹³C(p,γ)¹⁴N(p,γ)¹⁵O(β<sup>+</sup>)¹⁵N(p,α)¹²C. The slowest step, ¹⁴N(p,γ)¹⁵O, sets the rate. The temperature sensitivity differs strongly between the two processes:<span class=\"eq\"><span class=\"eql\">ε<sub>pp</sub> ∝ ρT⁴</span><span class=\"eql\">ε<sub>CNO</sub> ∝ ρZ<sub>CNO</sub>T<sup>16–20</sup></span></span>so the CNO cycle dominates above a core temperature of about 1.7 × 10⁷ K and supplies about 1% of the Sun's energy.","After hydrogen exhaustion, helium burns at T ≈ 10⁸ K by the triple-alpha process: two α particles form ⁸Be, which is unbound by 92 keV and lives about 8 × 10<sup>−17</sup> s, and a third α must be captured during that time. The rate is viable only because of a resonance, the 7.65 MeV 0⁺ 'Hoyle state' in ¹²C, predicted by Hoyle in 1953 and then found experimentally. ¹²C(α,γ)¹⁶O follows; its poorly known rate controls the C/O ratio in white dwarfs and influences supernova progenitors.","Stars are self-regulating. Hydrostatic equilibrium, dP/dr = −Gm(r)ρ/r², together with the virial theorem, 2K + U = 0, implies that a star losing energy contracts and heats up: it has a negative effective heat capacity. If fusion runs too fast, the core expands and cools, reducing the rate. This thermostat holds the solar luminosity steady at L<sub>☉</sub> = 3.83 × 10<sup>26</sup> W, consuming about 6 × 10<sup>11</sup> kg of hydrogen per second."],"m":["Fusion means smashing tiny atom centers together until they stick. The problem: they're all positively charged, so they push each other away like the same ends of two magnets. Even at 15 million degrees, they usually aren't fast enough to touch.","So how does it happen? Quantum physics! Tiny particles can sometimes 'tunnel' through a barrier they shouldn't be able to cross, a bit like a ghost walking through a wall. It's rare for each particle, but the Sun has so many that it happens constantly.","In the Sun, four hydrogen centers end up as one helium center. The helium weighs a tiny bit less than the four hydrogens did, and that missing mass becomes energy. The Sun turns about 4 million tonnes of matter into energy every single second.","Getting that energy out is slow. Light bounces around inside the Sun for thousands of years before reaching the surface, then takes just 8 minutes to reach Earth! The Sun stays balanced: gravity squeezes inward while the heat pushes outward.","Later in life, stars fuse heavier things, like helium into carbon. The biggest stars build elements all the way up to iron. Gold, silver and uranium come from even more extreme events, like neutron stars crashing together."]},"why":{"s":"Stellar fusion generates most of the luminosity of galaxies and synthesizes nearly all elements from carbon to iron, while neutron-capture processes in stellar environments create heavier ones. Its microphysics (tunneling rates, weak interactions and nuclear resonances) sets stellar lifetimes, and with them the time scales of galaxy evolution and planetary habitability. Solar neutrino measurements also revealed neutrino oscillation, a direct link between stellar physics and particle physics.","m":"Without fusion there would be no sunlight, no heat on Earth and no elements like carbon and oxygen to make living things. You are literally made of stuff cooked inside stars."},"terms":[["Coulomb barrier","The electrostatic repulsion barrier between nuclei, height ≈ 1.44 Z<sub>1</sub>Z<sub>2</sub> MeV·fm / (R<sub>1</sub> + R<sub>2</sub>); far above stellar thermal energies.","The 'push-away' force between atom centers."],["Quantum tunneling","Barrier penetration with probability ∝ exp(−2∫√[2m(V − E)]/ħ dr); for Coulomb barriers this gives the Gamow factor exp(−√(E<sub>G</sub>/E)).","When a tiny particle sneaks through a wall."],["Proton–proton chain","The reaction sequence 4p → ⁴He + 2e<sup>+</sup> + 2ν<sub>e</sub> beginning with the weak p + p → d step; dominant in stars below about 1.3 M<sub>☉</sub>.","The Sun's main recipe for turning hydrogen into helium."],["CNO cycle","Catalytic hydrogen burning using C, N and O nuclei, with energy generation ∝ T<sup>16–20</sup>; dominant in more massive stars and leaves ¹⁴N enriched.","A faster fusion recipe used by bigger stars."],["Triple-alpha process","3 ⁴He → ¹²C + γ via the unstable ⁸Be ground state and the 7.65 MeV Hoyle resonance; requires T ≈ 10⁸ K.","How stars turn helium into carbon."],["Hydrostatic equilibrium","Balance between the outward pressure gradient and gravity, dP/dr = −Gm(r)ρ(r)/r², which holds to high precision in stable stars.","The tug-of-war between gravity and heat that keeps a star steady."]]},"stellar-life":{"how":{"s":["Main-sequence structure follows from four coupled equations: hydrostatic equilibrium, mass continuity dm/dr = 4πr²ρ, energy generation dL/dr = 4πr²ρε, and energy transport. In radiative zones,<span class=\"eq\"><span class=\"eql\">dT/dr = −3κρL / (64πσr²T³)</span></span>while convection takes over where this gradient exceeds the adiabatic one (the Schwarzschild criterion). Dimensional analysis with Kramers or electron-scattering opacity gives L ∝ M<sup>3</sup>–M<sup>4</sup>, and radius increases roughly as R ∝ M<sup>0.8</sup>.","The Hertzsprung–Russell diagram plots L against effective temperature, defined by L = 4πR²σT<sub>eff</sub>⁴, so lines of constant radius are diagonal. The main sequence spans about 0.08 M<sub>☉</sub> (T<sub>eff</sub> ≈ 2,700 K) to more than 100 M<sub>☉</sub> (T<sub>eff</sub> > 40,000 K). The lower bound is set by the onset of electron degeneracy before the core reaches hydrogen-ignition temperature, producing brown dwarfs; the upper bound is set by radiation pressure approaching the Eddington limit.","When core hydrogen is exhausted, an inert He core contracts and heats while hydrogen burns in a surrounding shell; the envelope expands and cools, and the star ascends the red giant branch. In stars below about 2 M<sub>☉</sub> the core becomes degenerate, and helium ignites explosively in the helium flash at about 10⁸ K; above about 2 M<sub>☉</sub> ignition is quiescent. Core helium burning then lasts about 10% of the main-sequence lifetime (the horizontal branch or red clump).","Low- and intermediate-mass stars ascend the asymptotic giant branch, with alternating H and He shells that undergo thermal pulses. Dredge-up brings carbon and s-process elements (Sr, Ba, Pb) to the surface, and slow winds of up to about 10<sup>−4</sup> M<sub>☉</sub>/yr strip the envelope. The exposed hot core ionizes the ejected gas as a planetary nebula for about 10⁴ years before cooling as a white dwarf of 0.5–1.4 M<sub>☉</sub>.","Above about 8 M<sub>☉</sub>, cores reach the temperatures for carbon, neon, oxygen and silicon burning, each stage shorter than the last: for a 25 M<sub>☉</sub> star, hydrogen lasts about 7 Myr and silicon about 1 day, because thermal neutrino losses grow steeply with temperature. Silicon burning by quasi-equilibrium photodisintegration and α-capture builds an iron-group core. Iron-peak nuclei have the highest binding energy per nucleon, so fusion can no longer release energy; once the core exceeds its effective Chandrasekhar mass, it collapses."],"m":["Stars are born in huge, cold clouds of gas and dust. When part of a cloud gets heavy enough, gravity squeezes it together. It spins into a flat disk with a hot ball in the middle. When the center reaches 10 million degrees, fusion switches on, and a star is born!","Stars come in colors that show their temperature: blue stars are hottest, then white, yellow (like our Sun), orange and red. Most stars in our galaxy are small, cool red dwarfs, too faint to see with your eyes.","When a star like the Sun runs out of hydrogen in its center, it puffs up into a red giant, hundreds of times wider. It then burns helium for a while, puffs up again and gently blows its outer layers into space. Those glowing layers make a beautiful 'planetary nebula', and the leftover core becomes a white dwarf.","Giant stars live fast. They burn through heavier and heavier fuels, layer by layer like an onion, until their center fills with iron. Iron can't be burned for energy, so the core collapses in less than a second and the star explodes as a supernova!","Small red dwarfs are the opposite: they sip fuel so slowly they'll shine for trillions of years. The universe isn't old enough for any of them to have died yet."]},"why":{"s":"Stellar evolution supplies the clocks and chemistry of astrophysics. Isochrone fits to star clusters provide ages, including lower limits on the age of the universe from globular clusters (about 12–13 Gyr). Stars recycle processed material into the interstellar medium, raising metallicity over cosmic time and producing the elements needed for planets and life. Stellar evolution models also underlie the interpretation of galaxy spectra, supernova progenitors and the populations of compact binaries detected by gravitational waves.","m":"Stars make the ingredients for planets and people, and knowing how they live and die tells us what will happen to our own Sun."},"terms":[["Main sequence","The core-hydrogen-burning phase, about 90% of a star's nuclear lifetime, along which stars lie in a narrow band of the HR diagram set by mass.","A star's long 'grown-up' stage."],["Hertzsprung–Russell diagram","L versus T<sub>eff</sub> (or absolute magnitude versus color), with radius set by L = 4πR²σT<sub>eff</sub>⁴; evolutionary tracks trace stellar structural changes.","A chart sorting stars by brightness and color."],["Spectral class","The O–B–A–F–G–K–M (plus L, T, Y for substellar objects) sequence of decreasing T<sub>eff</sub>, defined by line strengths, with numeric subtypes 0–9 and luminosity classes I–V.","A letter grade for a star's temperature."],["Red giant","A post-main-sequence star with an inert or He-burning core and an extended convective envelope (R ~ 10–100 R<sub>☉</sub>), T<sub>eff</sub> ≈ 3,500–5,000 K.","An old star that has puffed up hugely."],["Planetary nebula","An expanding shell of AGB ejecta, photoionized by the hot (T > 30,000 K) remnant core; unrelated to planets, despite the historical name.","The colorful cloud left when a Sun-like star dies."],["Supernova","An explosive stellar event radiating about 10<sup>42</sup>–10<sup>43</sup> J optically; either core collapse in massive stars or thermonuclear disruption of a white dwarf.","A gigantic star explosion."]]},"compact":{"how":{"s":["Fermions confined to volume V fill momentum states up to the Fermi momentum p<sub>F</sub> = ħ(3π²n)<sup>1/3</sup>. Even at T = 0 this produces pressure. For nonrelativistic electrons<span class=\"eq\"><span class=\"eql\">P = (3π²)<sup>2/3</sup>ħ² n<sub>e</sub><sup>5/3</sup> / (5m<sub>e</sub>)</span></span>and in the ultrarelativistic limit P ∝ ħc n<sub>e</sub><sup>4/3</sup>. Balancing P ∝ ρ<sup>5/3</sup> against gravity gives R ∝ M<sup>−1/3</sup>: more massive white dwarfs are smaller.","As mass increases, electrons become relativistic and the equation of state softens to P ∝ ρ<sup>4/3</sup>, the critical index at which gravity and pressure scale identically with radius. Equilibrium then exists only at one mass:<span class=\"eq\"><span class=\"eql\">M<sub>Ch</sub> ≈ 5.83 μ<sub>e</sub><sup>−2</sup> M<sub>☉</sub></span><span class=\"eql\">≈ 1.44 M<sub>☉</sub> (μ<sub>e</sub> = 2)</span></span>Above it, no white dwarf can be static. Chandrasekhar derived this in 1930–1935 (1983 Nobel Prize).","In a collapsing iron core, densities above about 10<sup>9</sup> g/cm³ drive electron capture, p + e<sup>−</sup> → n + ν<sub>e</sub>, neutronizing matter. Neutron degeneracy and, more importantly, the repulsive short-range nuclear force halt collapse at about 2–3 times nuclear saturation density (ρ<sub>0</sub> ≈ 2.7 × 10<sup>14</sup> g/cm³). The maximum neutron-star mass (the Tolman–Oppenheimer–Volkoff limit) depends on the unknown equation of state; observations require M<sub>max</sub> ≳ 2.1 M<sub>☉</sub>.","Conservation of angular momentum and magnetic flux during collapse produces rapid rotation and fields of 10⁸–10<sup>15</sup> G. A rotating magnetized neutron star radiates as a magnetic dipole, spinning down at a rate<span class=\"eq\"><span class=\"eql\">Ė = −(B²R⁶Ω⁴ sin²α) / (6c³)</span></span>(Gaussian units). From the period P and its derivative Ṗ one infers a surface field B ≈ 3.2 × 10<sup>19</sup>√(PṖ) G and a characteristic age τ = P/2Ṗ. Millisecond pulsars have been 'recycled' (spun up) by accretion from a binary companion.","A white dwarf in a binary that accretes toward M<sub>Ch</sub> (single-degenerate channel), or that merges with another white dwarf (double-degenerate), can ignite carbon in its degenerate core. Because degenerate pressure barely depends on temperature, burning runs away and unbinds the star in a Type Ia supernova, producing about 0.6 M<sub>☉</sub> of ⁵⁶Ni whose decay chain (⁵⁶Ni → ⁵⁶Co → ⁵⁶Fe) powers the light curve. Which channel dominates is still debated."],"m":["When a star dies, its core can shrink into something incredibly small and dense. What stops it from shrinking forever? A quantum rule: tiny particles like electrons refuse to be crammed into the same 'seat'. When they're squeezed too tight, they push back hard.","A white dwarf holds as much mass as the Sun, squished into something the size of Earth. One teaspoon would weigh about as much as an elephant! Weirdly, heavier white dwarfs are smaller. Over billions of years, white dwarfs cool down and their insides may even turn into a giant crystal.","Neutron stars are even more extreme. They form when a giant star's core collapses and electrons are squeezed into protons, turning them into neutrons. A neutron star packs more than the Sun's mass into a ball about 20 km wide, the size of a city. A teaspoon would weigh about a billion tonnes on Earth.","Many neutron stars spin incredibly fast, some hundreds of times per second, and shoot beams of radio waves like a lighthouse. Those are called pulsars. Some have magnetic fields so strong they would wipe out every credit card on Earth from halfway to the Moon."]},"why":{"s":"Compact objects are laboratories for matter at densities unreachable on Earth and for strong-field gravity. White dwarf cooling ages date the Galactic disk and halo. Binary pulsars provided the first evidence for gravitational radiation and remain among the most precise tests of general relativity. Neutron star mergers are a major source of r-process elements such as gold and platinum, and Type Ia supernovae are the standardizable candles that revealed cosmic acceleration.","m":"They're the densest things we know of besides black holes. Studying them teaches us about matter at its most extreme, and crashing neutron stars made much of the gold on Earth."},"terms":[["Degeneracy pressure","Pressure arising from the Pauli exclusion principle in a dense Fermi gas, independent of temperature at T ≪ T<sub>F</sub>.","The push-back when tiny particles are crammed too tightly."],["Chandrasekhar limit","The maximum mass, ≈ 5.83/μ<sub>e</sub>² M<sub>☉</sub> ≈ 1.44 M<sub>☉</sub>, of a cold body supported by relativistic electron degeneracy.","The heaviest a white dwarf can be."],["Pulsar","A rotating, magnetized neutron star whose beamed radio (or X-ray, γ-ray) emission sweeps past Earth, producing pulses with periods of 1.4 ms to tens of seconds.","A spinning neutron star that blinks like a lighthouse."],["Magnetar","A neutron star with an inferred dipole field of 10<sup>14</sup>–10<sup>15</sup> G, powered by magnetic-field decay; the source of soft gamma repeaters and giant flares.","A neutron star with a super-strong magnet."],["Type Ia supernova","Thermonuclear disruption of a carbon–oxygen white dwarf; peak luminosity correlates with light-curve decline rate (the Phillips relation), making it a standardizable candle.","A white dwarf explosion used to measure distances."]]},"black-holes":{"how":{"s":["The Schwarzschild metric for a nonrotating mass,<span class=\"eq\"><span class=\"eql\">ds² = −(1 − r<sub>s</sub>/r)c²dt²</span><span class=\"eql\">+ (1 − r<sub>s</sub>/r)<sup>−1</sup>dr²</span><span class=\"eql\">+ r²dΩ²</span></span>has a coordinate singularity at r = r<sub>s</sub>, removable in other coordinates such as Kruskal–Szekeres, and a true curvature singularity at r = 0. Inside r<sub>s</sub>, r becomes timelike, so decreasing r is as inevitable as moving forward in time. A distant observer sees infalling clocks redshift by √(1 − r<sub>s</sub>/r) and asymptotically freeze at the horizon.","Orbits around black holes have features absent in Newtonian gravity. The photon sphere at r = 1.5r<sub>s</sub> allows unstable circular light orbits, and its lensed image sets the shadow diameter of about 5.2 r<sub>s</sub> (for a nonrotating hole). The innermost stable circular orbit (ISCO) lies at 3r<sub>s</sub> for Schwarzschild, moving inward to r<sub>s</sub>/2 for prograde orbits around a maximally spinning Kerr hole. The binding energy at the ISCO sets the radiative efficiency of accretion, η ≈ 5.7% (no spin) to 42% (maximal spin).","Rotating (Kerr) black holes have angular momentum J = a<sub>*</sub>GM²/c with 0 ≤ a<sub>*</sub> ≤ 1. Outside the horizon lies the ergosphere, where frame dragging forces everything to co-rotate. The Penrose process and its magnetic analogue, the Blandford–Znajek mechanism, extract rotational energy, which is thought to power relativistic jets. Spins are measured from X-ray reflection spectra (relativistically broadened Fe Kα lines), continuum fitting and gravitational waveforms.","Accretion luminosity is limited by radiation pressure on electrons balancing gravity on protons, the Eddington luminosity<span class=\"eq\"><span class=\"eql\">L<sub>Edd</sub> = 4πGMm<sub>p</sub>c/σ<sub>T</sub></span><span class=\"eql\">≈ 1.26 × 10<sup>31</sup> W (M/M<sub>☉</sub>)</span></span>Quasars radiating near L<sub>Edd</sub> require masses of 10⁸–10<sup>10</sup> M<sub>☉</sub>. Growing such masses by z > 7 from stellar-mass seeds is difficult, motivating heavy-seed (direct-collapse) or super-Eddington growth models; JWST has found active black holes at z ≈ 10.","Quantum field theory near a horizon predicts thermal (Hawking) emission at<span class=\"eq\"><span class=\"eql\">T<sub>H</sub> = ħc³/(8πGMk<sub>B</sub>)</span><span class=\"eql\">≈ 6 × 10<sup>−8</sup> K (M<sub>☉</sub>/M)</span></span>with entropy S = k<sub>B</sub>A/(4ℓ<sub>P</sub>²), proportional to horizon area A. Stellar-mass black holes are far colder than the CMB, so they currently gain mass. The area theorem (classically, A never decreases) was tested with the 2025 signal GW250114, whose ringdown confirmed the final horizon area exceeded the initial sum at high confidence."],"m":["Every object has an 'escape speed', how fast you'd need to launch something to leave it for good. For Earth it's about 11 km per second. Squeeze something small enough and its escape speed rises past the speed of light. Since nothing is faster than light, nothing can get out. The boundary is called the event horizon.","If you fell toward a small black hole, its gravity would pull much harder on your feet than your head, stretching you out like a noodle. Scientists really call this 'spaghettification'! Near a giant black hole the stretching is gentler, so you might cross the event horizon without feeling it, though you could never come back.","Time gets weird near black holes too. To someone watching from far away, you'd seem to slow down, turn redder and fade, never quite falling in.","Black holes come in small sizes (a few to 100 Suns' worth) and giant sizes (millions to billions of Suns). Nearly every big galaxy has a giant one in the middle. When a black hole swallows gas, the gas swirls into a glowing disk so bright it can outshine a whole galaxy.","Stephen Hawking figured out that black holes should very, very slowly leak energy and shrink. For a normal black hole, it would take far, far longer than the universe has existed."]},"why":{"s":"Black holes test general relativity in its strong-field, dynamical regime and connect gravity, thermodynamics and quantum theory through Hawking radiation and the information problem. Supermassive black holes regulate galaxy growth through feedback, and their masses correlate tightly with host-galaxy bulge properties (the M–σ relation). Accretion onto black holes powers the most luminous persistent sources in the universe, and black hole mergers are now the dominant source of detected gravitational waves.","m":"They're where our best theories break down, so they might unlock new physics. They also help shape how galaxies grow."},"terms":[["Event horizon","The boundary of the causal past of future null infinity; for Schwarzschild, the null surface r = r<sub>s</sub> = 2GM/c².","The point of no return."],["Singularity","A region where curvature invariants diverge and classical general relativity loses predictivity; a point (Schwarzschild) or ring (Kerr).","The mystery center where our science stops working."],["Accretion disk","Rotationally supported inflow in which viscous stresses transport angular momentum outward and convert gravitational energy to radiation; thin disks radiate thermally with T ∝ r<sup>−3/4</sup>.","A glowing whirlpool of gas falling into a black hole."],["Spaghettification","Radial stretching and lateral compression of an extended body by differential gravity (tidal tensor ∝ GM/r³) near a compact object.","Getting stretched like a noodle near a black hole."],["Hawking radiation","Thermal emission from black holes at T<sub>H</sub> = ħc³/8πGMk<sub>B</sub>, implying evaporation in t ≈ 2 × 10<sup>67</sup> yr (M/M<sub>☉</sub>)³.","A super-faint glow that slowly shrinks black holes."],["Ergosphere","The region outside a Kerr horizon, bounded by the static limit r = GM/c² (1 + √(1 − a<sub>*</sub>²cos²θ)), within which no observer can remain stationary relative to infinity.","A zone around a spinning black hole where space swirls."]]},"grav-waves":{"how":{"s":["Linearizing Einstein's equations around flat space, g<sub>μν</sub> = η<sub>μν</sub> + h<sub>μν</sub>, in the transverse-traceless gauge gives the wave equation □h<sub>ij</sub> = 0 in vacuum: two polarizations (h<sub>+</s
