 the ground, atmospheric turbulence limits resolution to about 0.5–1″ unless corrected by adaptive optics. Different wavelength bands require different optics and detectors, from radio dishes and interferometers to grazing-incidence X-ray mirrors, and much of the spectrum is accessible only from space. The largest optical telescopes under construction have apertures of 25–39 m.","m":"A telescope is a giant light bucket. It collects light with a big mirror or lens and focuses it so we can see faint, faraway things. The bigger the mirror, the fainter and sharper things look. Some telescopes see radio waves or X-rays, and some have to go into space because our air blocks certain kinds of light.","r":["em","spectroscopy","multi-messenger","units"]},{"id":"spectroscopy","t":"Spectroscopy","c":"Observing","st":"est","sc":null,"fig":"","s":"Spectroscopy disperses light by wavelength, revealing the discrete absorption and emission lines that encode the composition, temperature, density, pressure, velocity and magnetic field of the emitting gas. Line positions identify atomic and molecular transitions; Doppler shifts give line-of-sight velocities to centimeters per second in the best exoplanet spectrographs; line ratios and widths give physical conditions. Nearly all quantitative astrophysics, from stellar classification and chemical abundances to cosmological redshifts, depends on spectroscopy.","m":"Spectroscopy means splitting light into a rainbow and studying it closely. Each element leaves its own pattern of lines in the rainbow, like a barcode. That's how scientists know what stars are made of without visiting them, how fast things are moving and even whether a star has planets.","r":["atoms","em","telescopes","expansion"]},{"id":"night-sky","t":"The Night Sky","c":"Observing","st":"est","sc":null,"fig":"","s":"The night sky is described in a celestial coordinate system tied to Earth's rotation and orbit: right ascension and declination on the celestial sphere, with the ecliptic marking the Sun's apparent annual path. Earth's rotation produces diurnal motion around the celestial poles, its orbit makes different constellations visible each season, and precession of its axis shifts the coordinate grid by about 50″ per year. Under dark skies, roughly 4,500–9,000 stars are visible to the naked eye, but artificial light now hides most of them for most of humanity.","m":"The night sky changes because Earth spins and travels around the Sun. Stars seem to move across the sky each night, and different constellations appear in different seasons. Planets wander among the stars. Far from city lights you can see thousands of stars and the glowing band of the Milky Way.","r":["units","the-moon","galaxies","telescopes"]},{"id":"multi-messenger","t":"Multi-Messenger Astronomy","c":"Observing","st":"est","sc":null,"fig":"","s":"Multi-messenger astronomy combines information carried by different physical signals: electromagnetic radiation, gravitational waves, neutrinos and cosmic rays. Each messenger probes different physics and escapes from different environments; neutrinos and gravitational waves emerge from the dense interiors of collapsing stars and mergers, where light is trapped. Coordinated detections have been achieved for SN 1987A (neutrinos and light), the binary neutron star merger GW170817 (gravitational waves, gamma rays and a kilonova) and the blazar TXS 0506+056 (a high-energy neutrino coincident with a gamma-ray flare).","m":"For thousands of years, astronomers could only study space using light. Now we have new messengers: gravitational waves, ghostly neutrinos and speedy particles called cosmic rays. When one event sends out several messengers at once, scientists can learn way more about it.","r":["grav-waves","neutrinos","em","supernovae"]},{"id":"rockets","t":"Rockets and Spaceflight","c":"Space exploration","st":"est","sc":1.7,"fig":"","s":"A rocket accelerates by expelling reaction mass at high speed, so its performance is governed by momentum conservation rather than by pushing against air. The Tsiolkovsky rocket equation, Δv = v<sub>e</sub> ln(m<sub>0</sub>/m<sub>f</sub>), shows that achievable velocity change grows only logarithmically with propellant mass. Reaching low Earth orbit requires about 9.3–10 km/s of Δv including gravity and drag losses, which with chemical exhaust speeds of 3–4.5 km/s forces propellant to be 85–95% of launch mass. Staging, reusable boosters and high-efficiency electric propulsion are the main ways engineers work within this constraint.","m":"A rocket pushes hot gas out the bottom really fast, and the gas pushes the rocket the other way, just like a balloon zooming around when you let go. Rockets carry their own oxygen, so they work in space. To stay in orbit you need to go sideways about 28,000 km/h, which is why rockets are mostly fuel!","r":["newton","conservation","interplanetary","missions"]},{"id":"missions","t":"Landmark Missions","c":"Space exploration","st":"est","sc":null,"fig":"","s":"Since Sputnik 1 in 1957, robotic and crewed missions have reconnoitered every planet, landed on the Moon, Mars, Venus, Titan, asteroids and a comet, returned samples from the Moon, asteroids and a comet's dust, and sent probes beyond the heliopause. Mission design is constrained by Δv, power, communications, radiation and thermal environment, and each successful mission typically pairs targeted questions with unexpected discoveries. Human spaceflight has kept people continuously in orbit since November 2000 and, with Artemis II in April 2026, returned crews to lunar distance for the first time since 1972.","m":"Since the first satellite in 1957, humans and robots have explored our whole solar system. Astronauts have walked on the Moon, robots have driven on Mars, probes have landed on a comet and on Saturn's moon Titan, and two Voyager spacecraft have left the Sun's bubble entirely.","r":["rockets","interplanetary","telescopes","the-moon"]},{"id":"interplanetary","t":"Getting to Other Planets","c":"Space exploration","st":"est","sc":11.5,"fig":"","s":"Interplanetary trajectories are designed with orbital mechanics, optimizing Δv, flight time and arrival conditions. The minimum-energy two-impulse transfer between circular coplanar orbits is the Hohmann transfer, half an ellipse tangent to both orbits; a trip to Mars takes about 8.5 months and requires launch windows every 26 months. Gravity assists exchange momentum with planets to change heliocentric velocity without propellant, and aerobraking uses atmospheric drag to reduce orbital energy. Modern trajectories combine these techniques with numerical optimization and low-thrust electric propulsion.","m":"Getting to another planet is like throwing a ball to a friend on a moving merry-go-round. You don't aim where the planet is; you aim where it will be. Spacecraft follow curved paths around the Sun and launch only when the planets line up. They can also slingshot around planets to speed up for free!","r":["rockets","newton","missions","solar-system"]},{"id":"radioactivity","t":"Radioactivity","c":"Nuclear physics","st":"est","sc":-14.5,"fig":"","s":"Radioactivity is the spontaneous transformation of unstable nuclei, emitting alpha particles, electrons or positrons with neutrinos, gamma rays or other radiation. Each nucleus decays randomly with a constant probability per unit time, so a sample decays exponentially with a characteristic half-life ranging from below 10<sup>−21</sup> s to over 10<sup>24</sup> years. The process is governed by the strong, weak and electromagnetic interactions, and its regularity makes radioactive isotopes precise clocks for dating rocks, meteorites and archaeological materials, as well as tools in medicine and energy.","m":"Some atoms have unstable centers that eventually break down, shooting out particles or energy. That's radioactivity. Each kind of radioactive atom has a 'half-life', the time it takes for half of a sample to change. Half-lives can be less than a second or billions of years, which lets scientists use them as clocks to date rocks and fossils.","r":["atoms","forces","fission","standard-model"]},{"id":"fission","t":"Nuclear Fission","c":"Nuclear physics","st":"est","sc":-14,"fig":"","s":"Nuclear fission splits a heavy nucleus such as ²³⁵U or ²³⁹Pu, usually after it absorbs a neutron, into two medium-mass fragments, releasing about 200 MeV and an average of about 2.4 prompt neutrons. Because each fission can induce more than one further fission, a self-sustaining chain reaction is possible. Power reactors control it using moderators, neutron absorbers and the small fraction of delayed neutrons. About 440 reactors supply roughly 9% of the world's electricity with very low life-cycle carbon emissions, while long-term waste disposal, cost and proliferation remain central challenges.","m":"Fission means splitting a big atom center, like uranium, into two smaller pieces. When it splits, it releases a huge amount of energy and a few neutrons, which can split more atoms in a chain reaction. Nuclear power plants control this chain reaction to make heat, which boils water to make electricity.","r":["radioactivity","emc2","fusion-energy","atoms"]},{"id":"fusion-energy","t":"Fusion Power","c":"Nuclear physics","st":"strong","sc":-15,"fig":"","s":"Fusion power aims to generate electricity from light-nucleus fusion, chiefly deuterium–tritium: D + T → ⁴He (3.5 MeV) + n (14.1 MeV). It requires plasma temperatures above about 100 million K, confined long enough and densely enough to satisfy the Lawson criterion, so that fusion heating exceeds losses. Magnetic confinement (tokamaks, stellarators) and inertial confinement (laser-driven implosions) are the main approaches. The U.S. National Ignition Facility achieved target gain above 1 in December 2022, but no facility has yet produced net electricity, and materials, tritium breeding and economics remain unresolved.","m":"Scientists are trying to build fusion power plants: little Suns on Earth! They heat special kinds of hydrogen to over 100 million degrees, hotter than the Sun's core, so the atoms fuse and release energy. It's super hard, but in 2022 one experiment finally got more energy out of its fuel than its lasers put in.","r":["fusion","emc2","fission","states-of-matter"]},{"id":"colliders","t":"Colliders and Detectors","c":"Nuclear physics","st":"est","sc":-18,"fig":"","s":"Particle colliders accelerate beams to near light speed and collide them to convert kinetic energy into new particles through E = mc², probing distances down to about 10<sup>−19</sup> m. Discovery reach depends on the center-of-mass energy √s and on luminosity, which sets event rates. The Large Hadron Collider at CERN, a 26.7 km ring colliding protons at 13.6 TeV, discovered the Higgs boson in 2012. Detectors surround the collision points with layered tracking, calorimetry and muon systems, using real-time triggers to select about one interesting event in 10<sup>5</sup> from up to about a billion collisions per second.","m":"Particle colliders speed tiny particles up to almost the speed of light and crash them together. The energy of the crash turns into brand-new particles! Giant detectors, some as big as buildings, act like super-fast cameras that photograph the pieces. The Large Hadron Collider is a 27 km ring buried underground in Europe.","r":["standard-model","higgs","special-rel","emc2"]},{"id":"quantum-gravity","t":"Quantum Gravity","c":"Frontier physics","st":"open","sc":-34.8,"fig":"","s":"Quantum gravity is the unfinished theory that would describe gravity, and spacetime itself, consistently with quantum mechanics. General relativity quantized as an ordinary field theory is non-renormalizable: it works as a low-energy effective theory but loses predictive power near the Planck energy, about 1.22 × 10<sup>19</sup> GeV. A full theory is needed to describe black hole interiors, the Big Bang and the fate of information in black hole evaporation. Leading approaches include string theory and loop quantum gravity; holography has made notable theoretical progress, but none has been tested experimentally.","m":"Einstein's gravity explains big things, and quantum physics explains tiny things, but they don't fit together. Inside black holes and at the very start of the universe, we need both at once. Scientists are searching for 'quantum gravity', a theory that combines them. Ideas include tiny vibrating strings and space made of tiny chunks, but none has been proven yet.","r":["general-rel","black-holes","standard-model","nature-of-time"]},{"id":"antimatter","t":"Antimatter","c":"Frontier physics","st":"est","sc":-15,"fig":"","s":"Every charged fermion has an antiparticle with identical mass and spin but opposite charges, as Dirac's relativistic electron equation implied in 1928. Antimatter is produced routinely in cosmic-ray interactions, radioactive β<sup>+</sup> decay and accelerators, and positron emission tomography (PET) uses it in medicine. CPT symmetry requires equal masses and lifetimes, confirmed to parts per trillion for antiprotons and antihydrogen. Yet the observable universe contains essentially no primordial antimatter. Explaining this matter–antimatter asymmetry requires CP violation and baryon-number violation beyond what the Standard Model provides.","m":"Every kind of particle has an opposite twin with the opposite charge, called antimatter. When matter and antimatter touch, they both vanish in a flash of pure energy! Scientists make tiny amounts of it, and hospitals use it in PET scans. The big mystery: why is the universe made of matter instead of an equal mix?","r":["standard-model","emc2","big-bang","colliders"]},{"id":"nature-of-time","t":"The Nature of Time","c":"Frontier physics","st":"open","sc":null,"fig":"","s":"In physics, time is a coordinate in four-dimensional spacetime whose measured intervals depend on motion and gravity. Relativity has replaced absolute time with proper time along worldlines and made simultaneity frame-dependent, effects measured by atomic clocks at the level of millimeter height differences. The fundamental laws of physics are almost entirely time-symmetric, yet experience and thermodynamics show a strong arrow of time, traced to the low entropy of the early universe. In quantum gravity, time may not be fundamental at all.","m":"What is time? Physics has some surprising answers. Einstein showed time can run faster or slower depending on speed and gravity, and that there's no single 'now' for everyone. Most laws of physics work just as well backward as forward, so why does time only seem to go one way? Scientists think it's connected to how the universe began.","r":["special-rel","general-rel","entropy","quantum-gravity"]},{"id":"multiverse","t":"The Multiverse","c":"Frontier physics","st":"open","sc":27,"fig":"","s":"The multiverse is a family of hypotheses that physical reality is larger than our observable universe and contains regions or branches with different conditions. Distinct versions arise from cosmic inflation, from the Everett interpretation of quantum mechanics, and from the landscape of string theory vacua. Most are consequences of theories proposed for other reasons, not separate postulates. They are controversial because the other regions or branches are, by construction, largely or entirely unobservable, and whether such ideas can be tested is debated.","m":"Could there be other universes? Some scientists think so. Maybe space goes on forever beyond what we can see. Maybe inflation keeps making new 'bubble universes'. Maybe every quantum choice splits the universe into many copies. These ideas are fascinating, but none has been proven, and some might never be testable.","r":["inflation","quantum-gravity","observable","duality"]},{"id":"supernovae","t":"Supernovae","c":"Astrophysics","st":"est","sc":13,"fig":"","s":"Supernovae are stellar explosions that briefly radiate up to about 10<sup>10</sup> L<sub>☉</sub> and release around 10<sup>44</sup> J of kinetic energy. Core-collapse supernovae (Types II, Ib and Ic) occur when the iron core of a star above about 8 M<sub>☉</sub> collapses to a neutron star, releasing about 3 × 10<sup>46</sup> J, 99% of it as neutrinos. Type Ia supernovae are thermonuclear disruptions of carbon–oxygen white dwarfs. Supernovae enrich galaxies with heavy elements, drive interstellar turbulence and, as standardizable candles, revealed cosmic acceleration.","m":"A supernova is a gigantic star explosion, so bright it can outshine a whole galaxy for weeks. Big stars explode when their cores collapse, and some white dwarfs explode after stealing too much material from a partner star. Supernovae spread elements like oxygen, calcium and iron across space: ingredients for future planets and people.","r":["stellar-life","compact","fusion","dark-energy"]},{"id":"quasars","t":"Quasars and Active Galaxies","c":"Astrophysics","st":"est","sc":13,"fig":"","s":"Quasars are the most luminous persistent sources in the universe: active galactic nuclei in which accretion onto supermassive black holes of 10⁷–10<sup>10</sup> M<sub>☉</sub> produces 10<sup>38</sup>–10<sup>41</sup> W, often outshining the entire host galaxy from a region smaller than the Solar System. Quasars, Seyfert galaxies, radio galaxies and blazars are unified as one phenomenon viewed at different orientations and accretion rates. The most distant known quasars are at z ≈ 7.6, and JWST has found fainter active nuclei to z ≈ 10, challenging models of early black-hole growth.","m":"Quasars are the brightest things in the universe that keep shining for a long time. They're giant black holes gobbling up gas so fast that the gas swirling around them glows brighter than a thousand galaxies! Some shoot out jets of particles at nearly the speed of light.","r":["black-holes","galaxies","expansion","multi-messenger"]},{"id":"fate-universe","t":"The Fate of the Universe","c":"Cosmology","st":"open","sc":27,"fig":"","s":"The long-term fate of the universe depends almost entirely on dark energy. If dark energy is a cosmological constant, ΛCDM predicts eternal exponential expansion toward an asymptotic de Sitter state, with an e-folding time of about 17.5 Gyr, followed over 10<sup>14</sup>–10<sup>100</sup> years by the end of star formation, the dynamical decay of galaxies and the Hawking evaporation of black holes. Time-varying dark energy, hinted at by 2024–2025 DESI data, would permit other outcomes. Extrapolations beyond about 10<sup>14</sup> years also depend on untested physics such as proton decay.","m":"How will the universe end? It depends on dark energy. The most likely future: space keeps stretching faster, stars slowly burn out over trillions of years, and the universe becomes cold and dark. But if dark energy changes, it could end with everything ripped apart or squeezed back together.","r":["dark-energy","entropy","stellar-life","black-holes"]},{"id":"states-of-matter","t":"States of Matter and Plasma","c":"Classical physics","st":"est","sc":-9,"fig":"","s":"States of matter are distinct phases characterized by different symmetries and responses to stress: solids break translational symmetry, liquids and gases do not, and plasmas are ionized gases dominated by collective electromagnetic effects. Phase transitions occur where the Gibbs free energies of phases are equal; first-order transitions involve latent heat, while continuous transitions show critical behavior described by universal exponents. Beyond the everyday phases are quantum states such as superfluids, superconductors and Bose–Einstein condensates, as well as degenerate matter and quark–gluon plasma at extreme densities and temperatures.","m":"Everything is a solid, liquid or gas, or a fourth state called plasma. It depends on how much the particles jiggle compared with how tightly they hold on to each other. Plasma is super-hot gas where electrons get knocked off atoms. It's what stars, lightning and neon signs are made of, and it's the most common visible state in the universe!","r":["entropy","atoms","the-sun","fusion-energy"]},{"id":"units","t":"Measuring Distance","c":"Observing","st":"est","sc":16,"fig":"1 ly = <b>9.461 × 10<sup>15</sup> m</b> · 1 pc = <b>3.26 ly</b> · 1 AU = <b>1.496 × 10<sup>11</sup> m</b>","s":"Astronomical distances are measured through a chain of methods. The astronomical unit (exactly 149,597,870,700 m) is calibrated by radar and spacecraft ranging. Trigonometric parallax defines the parsec, the distance at which 1 AU subtends 1 arcsecond (3.086 × 10<sup>16</sup> m ≈ 3.26 light-years). Beyond parallax, standard candles and standard rulers, including Cepheids, the tip of the red giant branch, Type Ia supernovae and baryon acoustic oscillations, extend the scale to cosmological distances, where distance depends on the expansion history and must be defined carefully.","m":"Space is so big that astronomers use special units, like the light-year: how far light travels in a year, about 9.5 trillion km. They measure distances step by step, from nearby stars to faraway galaxies. The nearest star after the Sun is about 4.2 light-years away, so we see it as it was over 4 years ago.","r":["observable","expansion"]}];
const X={"big-bang":[["How we know","The model rests on independent, quantitative tests. Galaxy redshifts follow v = H<sub>0</sub>d at low z and the full FLRW distance–redshift relation at high z. COBE/FIRAS measured the CMB as a blackbody to better than 1 part in 10<sup>4</sup>, which essentially requires a hot, dense, thermalized past. The primordial helium mass fraction Y<sub>p</sub> ≈ 0.245 and deuterium ratio D/H ≈ 2.5 × 10<sup>−5</sup> agree with nucleosynthesis at the same baryon density that the CMB acoustic peaks independently imply.\nThe model also passed tests it was not built to pass. The CMB temperature measured in distant gas clouds via molecular and atomic excitation and the Sunyaev–Zel'dovich effect scales as T<sub>0</sub>(1 + z). Supernova light curves at redshift z are stretched in time by exactly (1 + z), confirming that redshift reflects expansion rather than 'tired light'. Galaxy populations evolve systematically with lookback time.","Scientists have three main clues. Galaxies are all moving away from each other, which means they were closer together in the past. There is a leftover glow of heat filling all of space, like the warmth left in an oven after baking. And the oldest gas in the universe has just the mix of hydrogen and helium that a hot young universe would make.\nWhen we look at faraway galaxies, we see them as they were long ago, because their light took billions of years to reach us. Those ancient galaxies look younger and messier, just as the Big Bang idea predicts."],["Common misconceptions","The Big Bang did not occur at a location. In an FLRW universe every point is equivalent, and the 'center' question has no answer because the expansion is a property of the metric, not a velocity field radiating from somewhere. If the universe is spatially infinite now, it was infinite at early times too, merely denser.\nThe model is also not a theory of the origin of the universe. It describes evolution from a hot, dense state onward. The classical singularity at <i>a</i> = 0 signals a breakdown of general relativity rather than a physical event, and statements about 'before' the Big Bang are currently untestable.","The Big Bang was not like a bomb exploding in empty space. There was no 'outside' for it to explode into. Instead, space itself started stretching everywhere at once, so there is no center of the universe.\nThe Big Bang theory also does not say what caused the universe or what came before it. It explains what happened after the universe was already very hot and tiny."],["Still unknown","The pre-Planck-time state is unknown. Candidate completions include inflation embedded in an eternally inflating spacetime, bouncing cosmologies in which a contracting phase precedes expansion, and quantum-cosmology proposals such as the Hartle–Hawking no-boundary state.\nThe universe also carries a baryon asymmetry, η = n<sub>b</sub>/n<sub>γ</sub> ≈ 6.1 × 10<sup>−10</sup>, that requires the Sakharov conditions: baryon-number violation, C and CP violation, and departure from equilibrium. The CP violation known in the Standard Model is far too small to produce it, so new physics is implied. In addition, the Hubble tension and the 2024–2025 hints of evolving dark energy test whether ΛCDM is complete.","No one knows exactly what happened at the very first moment, because our best theories stop working there. We also don't know why the universe is made of matter and not an equal mix of matter and antimatter, which should have canceled each other out."]],"cmb":[["How we know","Penzias and Wilson's 1965 detection of a 3.5 K isotropic excess at 4.08 GHz matched the relic radiation predicted by Alpher, Herman and Gamow, and Dicke's group immediately identified it (1978 Nobel Prize). COBE/FIRAS (1990) found a blackbody with no distortion to |y| < 1.5 × 10<sup>−5</sup> and |μ| < 9 × 10<sup>−5</sup>; COBE/DMR detected anisotropies at ΔT/T ~ 10<sup>−5</sup> (2006 Nobel Prize).\nWMAP (2001–2010) and Planck (2009–2013) measured the spectrum to ℓ ~ 2,500 in temperature and polarization. Ground-based telescopes, including the Atacama Cosmology Telescope (whose 2025 DR6 release extended precision polarization measurements) and the South Pole Telescope, have independently reproduced Planck's ΛCDM parameters, including its value H<sub>0</sub> ≈ 67–68 km/s/Mpc.","Two scientists found the CMB by accident in 1965 when their radio antenna kept picking up a strange hiss from every direction. Later, space telescopes made detailed maps of it.\nThe sizes of the hot and cold spots act like a fingerprint. By studying them, scientists worked out how old the universe is and what it is made of."],["Common misconceptions","The CMB is not light from t = 0. Before recombination the universe was optically thick, and the photon mean free path was far shorter than the Hubble length, so we see only the last-scattering surface, analogous to the photosphere of a star.\nThe CMB has no single source location. Every comoving point emitted it, and an observer at any time sees a spherical shell at the comoving distance light could travel since decoupling, currently about 45 billion light-years. The 'microwave' character is purely a consequence of redshift: the radiation was emitted with a spectrum peaking near 1 μm.","The CMB is not from the exact start of the universe. It was released about 380,000 years later, when the universe cooled enough for light to travel freely. Before that, the universe was like a thick hot fog."],["Still unknown","Large-angle anomalies, including the low quadrupole, quadrupole–octopole alignment, hemispherical power asymmetry and the Cold Spot, appear at roughly 2–3σ. Because cosmic variance limits low-ℓ measurements, their significance depends on how they were selected after the fact, and they may be flukes.\nThe central target is primordial B-mode polarization, whose amplitude would give the inflationary energy scale, V<sup>1/4</sup> ≈ 1.04 × 10<sup>16</sup> GeV × (r/0.01)<sup>1/4</sup>. The Simons Observatory and future satellite missions such as LiteBIRD aim for σ(r) ~ 10<sup>−3</sup>. Spectral distortions (μ and y) offer another, largely untapped probe of energy injection in the early universe.","Scientists are hunting for a special swirl pattern in the CMB. If they find it, it would show the universe went through a super-fast growth spurt in its first instant."]],"expansion":[["How we know","Slipher's 1910s spectra showed most spiral nebulae redshifted. Lemaître (1927) derived the linear relation from general relativity and estimated its slope, and Hubble (1929) confirmed it using Cepheid-calibrated distances, though his H<sub>0</sub> ≈ 500 km/s/Mpc was about seven times too high because of calibration errors. In 2018 the IAU recommended the name Hubble–Lemaître law.\nModern constraints combine Type Ia supernova compilations (Pantheon+, Union3, DES-SN5YR) with BAO from SDSS and DESI. The redshift dependence of H(z) is now measured directly from z ≈ 0.1 to z ≈ 2.3 via BAO and the Lyman-α forest.","When a galaxy moves away from us, its light gets stretched and shifts toward red, a bit like how a siren's sound gets lower as an ambulance drives away. Almost every galaxy shows this red shift, and farther galaxies show more of it."],["Common misconceptions","Recession velocities above c do not violate special relativity, which constrains relative velocities of objects at the same spacetime point. Over cosmological distances there is no unique way to compare velocity vectors, and the growth rate of proper distance is not bounded by c.\nGravitationally bound systems do not participate in Hubble flow. Their equilibrium size is set by internal dynamics; Λ contributes a negligible repulsive term, of order Λc²r/3, which for the Solar System is about 10<sup>−22</sup> of the Sun's gravity at Earth. Expansion is meaningful only between unbound structures, on scales larger than galaxy groups.","Galaxies are not flying through space like rockets. The space between them is growing. Your body and the Earth are not getting bigger, because the forces holding them together are much stronger than this stretching."],["Still unknown","The tension persists across ladder variants. JWST observations confirmed the HST Cepheid photometry, ruling out crowding as the explanation, but TRGB/JAGB analyses by the Chicago–Carnegie group give values near 70 km/s/Mpc, so the calibration of the supernova rung is contested. Independent late-universe methods (lensing time delays, megamasers, surface-brightness fluctuations) generally scatter between 70 and 76.\nOn the theory side, no proposed modification fits all data comfortably: early dark energy, for example, worsens tension with large-scale-structure amplitude (S<sub>8</sub>). Larger samples of gravitational-wave standard sirens could provide an independent arbitration within about a decade.","Two careful methods for measuring how fast space is stretching give different answers: about 67 and about 73. Either someone has a small mistake, or there is new physics we don't understand yet. Scientists are working hard to find out which."]],"dark-matter":[["How we know","Zwicky's 1933 Coma Cluster velocity dispersion of about 1,000 km/s implied a mass-to-light ratio hundreds of times the solar value. Rubin and Ford's optical and later radio (H I) rotation curves in the 1970s showed flat v<sub>c</sub>(r) in spiral galaxies.\nThe decisive modern evidence is multi-probe. The Bullet Cluster (1E 0657−558) shows the weak-lensing mass peaks offset from the X-ray gas by about 8σ, consistent with collisionless dark matter and implying σ/m ≲ 1 cm²/g. CMB peak ratios require Ω<sub>c</sub>/Ω<sub>b</sub> ≈ 5.4. Weak-lensing surveys (DES, KiDS, HSC) map projected mass on degree scales.","Stars at the edges of galaxies move just as fast as stars near the middle. With only the matter we can see, the outer stars should move slower, like outer planets in our solar system do. Something invisible must be adding extra gravity.\nScientists can also see dark matter's gravity bend light from galaxies behind it, like a lens."],["Common misconceptions","Dark matter is not unseen baryons. BBN and the CMB both fix Ω<sub>b</sub>h² ≈ 0.022, too small to account for it; MACHO and EROS microlensing surveys exclude compact objects from about 10<sup>−7</sup> to about 10 solar masses as the dominant component.\nNor is it dark energy. Dark matter has w ≈ 0, clusters gravitationally and dilutes as <i>a</i><sup>−3</sup>; dark energy has w ≈ −1, is spatially smooth and drives acceleration. Massive Standard Model neutrinos are dark matter in principle but are 'hot' and contribute Ω<sub>ν</sub> < 0.5%.","Dark matter is not just dust or dead stars. Scientists checked, and there isn't nearly enough of those. It is also different from dark energy: dark matter pulls things together, while dark energy pushes space apart."],["Still unknown","Particle candidates span roughly 80 orders of magnitude in mass: ultralight 'fuzzy' bosons (~10<sup>−22</sup> eV), QCD axions (μeV–meV), sterile neutrinos (keV), WIMPs (GeV–TeV) and primordial black holes, with an open window near 10<sup>17</sup>–10<sup>22</sup> g. Xenon experiments are approaching the neutrino fog for WIMP masses above about 10 GeV.\nSmall-scale tensions, such as the core–cusp problem, 'too big to fail' and the diversity of rotation-curve shapes, may reflect baryonic feedback or dark matter self-interaction. MOND reproduces the baryonic Tully–Fisher relation v⁴ = GMa<sub>0</sub> with a<sub>0</sub> ≈ 1.2 × 10<sup>−10</sup> m/s², but fails for clusters and the CMB without additional unseen mass; wide-binary tests reported since 2023 remain disputed.","Nobody knows what dark matter is made of. Scientists have built very sensitive detectors deep underground to catch a dark matter particle, but none has been found yet."]],"dark-energy":[["How we know","The High-Z Supernova Search Team (Riess, Schmidt) and the Supernova Cosmology Project (Perlmutter) found z ~ 0.5 Type Ia supernovae about 0.25 magnitude fainter than in a decelerating Ω<sub>m</sub> = 1 universe, implying q<sub>0</sub> < 0.\nIndependent confirmation followed. CMB peak positions require Ω<sub>tot</sub> ≈ 1 while the matter content is only Ω<sub>m</sub> ≈ 0.315. The BAO standard ruler, first detected by SDSS and 2dFGRS in 2005, independently traces D(z). The integrated Sachs–Wolfe effect (CMB × large-scale-structure cross-correlation) detects the decay of gravitational potentials that occurs only when expansion is not matter-dominated.","Scientists measured exploding stars of known brightness in faraway galaxies. They were dimmer than expected, which meant they were farther away, so the universe's expansion must be speeding up. Other measurements agree."],["Common misconceptions","Dark energy does not act as a force inside bound systems. For Λ, the repulsive acceleration term is Λc²r/3 ≈ 10<sup>−35</sup> s<sup>−2</sup> × r, negligible against internal gravity at galactic and smaller scales; bound objects keep a fixed size.\n'Negative pressure' does not mean outward pushing in the everyday sense. A uniform pressure exerts no net force; its effect is through the ρ + 3p/c² source term in the acceleration equation. Likewise, the constant density of Λ despite expansion is consistent with energy conservation: in the adiabatic relation dE = −p dV, negative p means the energy in a comoving volume increases as it expands.","Dark energy doesn't push you or the Earth around. Its effect only matters across enormous distances between groups of galaxies."],["Still unknown","The cosmological constant problem has no accepted solution. Proposals include anthropic selection in a landscape of vacua, which Weinberg used in 1987 to predict a small positive Λ before its discovery; unknown cancellation mechanisms; and degravitation or sequestering models.\nThe DESI DR2 results (2025) favor w<sub>0</sub>w<sub>a</sub>CDM over ΛCDM at 2.8σ (with Pantheon+ supernovae), 3.8σ (Union3) and 4.2σ (DES-SN5YR). Because the significance depends on the supernova compilation and on modeling the low-redshift calibration, independent tests are essential: further DESI data, Euclid, the Rubin Observatory's LSST supernova and weak-lensing samples, and the Roman Space Telescope.","Scientists don't know what dark energy is. A new survey has hinted that it might be getting weaker over time. If that is true, it would change our picture of the universe's future, but more data is needed."]],"inflation":[["How we know","Guth (1981) proposed inflation to solve the horizon, flatness and magnetic-monopole problems; Linde and Albrecht–Steinhardt (1982) introduced slow-roll 'new inflation', and Starobinsky (1980) had earlier proposed an R² model. Mukhanov, Chibisov, Hawking, Guth–Pi and others calculated the perturbation spectrum.\nPredictions borne out since then include spatial flatness, adiabatic Gaussian perturbations with a slight red tilt (n<sub>s</sub> < 1 detected at more than 8σ), super-horizon correlations visible as the TE anticorrelation near ℓ ≈ 100, and the coherent acoustic phases that require perturbations to exist on super-horizon scales.","Inflation was invented to explain a puzzle: opposite sides of the universe have almost the exact same temperature, even though they seem too far apart to have ever shared heat. If the universe grew super fast from a tiny region, that region could have evened out first."],["Common misconceptions","Inflation is not the Big Bang itself, nor an explosion. It is a prior (or embedding) phase whose end, reheating, produces the hot radiation-dominated state; the 'hot Big Bang' begins after inflation.\nInflationary expansion faster than light does not conflict with relativity, for the same reason Hubble recession can exceed c: the metric expands, and no signal is outrunning light locally. Inflation also does not require the observable universe to have been 'smaller than an atom' in any absolute sense; it describes the growth of a causally connected patch by at least about e<sup>60</sup> ≈ 10<sup>26</sup>.","Inflation is not the same as the expansion we see today. It was a much faster, much earlier burst that ended in a tiny fraction of a second."],["Still unknown","The inflaton's identity and potential are unknown, and the r constraint is approaching the plateau-model predictions of r ~ 10<sup>−3</sup>. Critics (Ijjas, Steinhardt, Loeb and others) argue that inflation needs fine-tuned initial conditions and, through eternal inflation, predicts a multiverse that weakens its testability, a 'measure problem'. Proponents argue that its successful predictions are generic.\nAlternatives such as bouncing or ekpyrotic cosmologies, string-gas cosmology, and emergent scenarios aim to reproduce the scalar spectrum. Most predict a negligibly small r, so a detection of primordial B-modes would strongly favor inflation.","We don't know what caused inflation or if it really happened. Some versions even suggest there could be many universes, but there is no way to test that yet."]],"bbn":[["How we know","Alpher, Bethe and Gamow (1948) proposed primordial element synthesis; Hayashi (1950) added weak-interaction n/p equilibrium; Wagoner, Fowler and Hoyle (1967) produced the first modern network calculations.\nToday the agreement is quantitative and independent. The η inferred from BBN deuterium alone, Ω<sub>b</sub>h² = 0.0221 ± 0.0004 (with the 2020 LUNA measurement of the d(p,γ)³He rate), matches the CMB acoustic-peak value Ω<sub>b</sub>h² = 0.0224 ± 0.0001. These two measurements probe physics roughly 380,000 years apart.","Scientists know how fast atoms fuse from experiments on Earth. Using that, they calculated what the early universe should have made. The oldest gas clouds in space match those predictions very closely."],["Common misconceptions","BBN did not produce the heavy elements. It ended with about 75% H, 25% ⁴He by mass, about 10<sup>−5</sup> of D and ³He, and about 10<sup>−10</sup> of ⁷Li. Carbon and heavier nuclei require the triple-alpha process at stellar densities, which the rapidly expanding, dilute early universe never reached.\nThe ingredients for BBN, protons and neutrons, existed from about 10 μs (after the quark–hadron transition), but nuclei could not survive until about 3 minutes because of photodissociation, not because of a lack of nucleons.","The Big Bang didn't make the oxygen you breathe or the iron in your blood. Those came from stars much later. The Big Bang mostly made hydrogen and helium."],["Still unknown","The cosmological lithium problem is a factor of about 3 deficit in observed ⁷Li. Proposed explanations include depletion in stellar atmospheres by diffusion and turbulent mixing, which seems the most likely; revised nuclear rates, now largely excluded by experiment; and new physics such as decaying particles. A separate puzzle, the 'neutron lifetime anomaly', has beam experiments giving τ<sub>n</sub> ≈ 888 s and bottle experiments ≈ 878 s, a difference of about 4σ.\nNext-generation CMB measurements of N<sub>eff</sub> (SM value 3.044) and percent-level Y<sub>p</sub> from the CMB damping tail will tighten constraints on light relics.","There is one small mystery: old stars have less lithium than scientists predict. Nobody is sure why."]],"observable":[["How we know","The horizon's size follows from the measured expansion history H(z), now determined from z ≈ 0 to 2.3 by supernovae and BAO, and anchored at z ≈ 1,090 by the CMB. The most distant directly observed objects are the CMB (z ≈ 1,090) and spectroscopically confirmed galaxies near z ≈ 14.4.\nThe homogeneity scale, beyond which galaxy counts in spheres scale as r³ to within 1%, is about 70–100 h<sup>−1</sup> Mpc in SDSS and WiggleZ data, much smaller than the horizon, so the observable universe is a fair statistical sample. Claimed larger structures, such as the Hercules–Corona Borealis Great Wall and the Giant Arc, are debated in significance.","Light has been traveling for 13.8 billion years. But space kept stretching while it traveled, so the place where the oldest light started is now much farther away, about 46 billion light-years."],["Common misconceptions","The observable universe is not the whole universe, and its edge is not a physical boundary. It is observer-dependent: an observer in a galaxy 10 billion light-years away has a horizon centered on itself. Being at the center of our horizon reflects only the geometry of looking outward, not a special cosmic position.\nIts radius is not 13.8 billion light-years. That is the light-travel distance, which equals c × age only in a static universe. Expansion during transit means the source of the oldest light is now about 46 billion light-years away.","We are not in the middle of the universe. Everyone, everywhere, has their own bubble of what they can see, centered on them. The edge of our view is not the edge of the universe."],["Still unknown","Whether the universe is spatially finite is unknown. Curvature limits (|Ω<sub>k</sub>| ≲ 0.002) imply that if space is positively curved, its radius of curvature exceeds about 250 billion light-years. Searches for 'matched circles' in the CMB, the signature of a small multiply connected topology, exclude a topology scale smaller than the CMB diameter.\nBefore recombination the universe is opaque to light, but not to neutrinos or gravitational waves. The cosmic neutrino background (decoupled at about 1 s) and a primordial gravitational-wave background (possibly from inflation) are, in principle, observable windows to earlier epochs, though both are currently beyond reach.","No one knows if the universe goes on forever or just is really, really big. Our measurements can't tell the difference yet."]],"fusion":[["How we know","Eddington (1920) proposed hydrogen-to-helium fusion from Aston's mass measurements; Gamow's tunneling theory (1928) and Bethe's 1939 analysis of the pp chain and CNO cycle (1967 Nobel Prize) made it quantitative.\nSolar neutrinos test the theory in the core directly. Davis's chlorine experiment, SAGE/GALLEX, Super-Kamiokande and SNO confirmed the flux once neutrino flavor oscillation was included; SNO's neutral-current measurement matched the standard solar model's ⁸B flux to within about 10%. Borexino measured the pp, ⁷Be, pep and ⁸B neutrinos and, in 2020, CNO neutrinos. Helioseismology independently confirms the predicted sound-speed profile to about 0.1%.","Fusion in the Sun makes tiny particles called neutrinos that fly straight out. Detectors deep underground catch a few of them, which proves fusion really is happening in the Sun's core right now."],["Common misconceptions","Stars do not burn in the chemical sense, and the Sun is not an explosion held in check. The core's power density is only about 275 W/m³, comparable to a compost heap; the luminosity is large because the fusing volume is enormous.\nPhotons created in the core do not stream directly out. They random-walk through the radiative zone with a mean free path of millimeters to centimeters, so energy takes roughly 10⁴–10⁵ years (estimates vary with the assumed opacity profile) to reach the convection zone. The solar neutrinos we detect, by contrast, escape in about 2 seconds.","The Sun is not on fire like a campfire. Fire is a chemical reaction. The Sun's energy comes from atoms squeezing together, which is a different and far more powerful process."],["Still unknown","The solar abundance problem remains open. Spectroscopic photospheric metallicities revised downward around 2009 produce interior models that disagree with helioseismology; newer abundance determinations (2022) partly restore agreement, and CNO neutrino fluxes are beginning to measure core metallicity directly.\nThe ¹²C(α,γ)¹⁶O rate at stellar energies is uncertain by about 20–30%, propagating into black-hole mass-gap predictions for gravitational-wave populations. Underground accelerators such as LUNA and JUNA measure reaction rates near Gamow-peak energies to reduce extrapolation errors.","Scientists still aren't sure exactly how much of each element the Sun contains, or exactly where the very heaviest elements, like gold, are made."]],"stellar-life":[["How we know","Spectral classification (Harvard OBAFGKM, Cannon and Payne-Gaposchkin) and the HR diagram (Hertzsprung 1911, Russell 1913) established the systematics; Payne (1925) showed that stars are mostly hydrogen.\nModern tests are precise. Asteroseismology from Kepler and TESS measures stellar interior structure and ages to about 10%; Gaia's parallaxes for more than a billion stars sharpen cluster HR diagrams; eclipsing binaries give masses and radii to about 1%. Supernova progenitors identified in pre-explosion images confirm red supergiants of 8–18 M<sub>☉</sub> as Type II-P progenitors.","We can't watch one star for billions of years. Instead, astronomers look at lots of stars at different ages, like looking at a crowd with babies, kids, adults and elders to learn how people grow up."],["Common misconceptions","Red giants do not form because a star runs out of fuel; their cores are contracting while shell burning becomes more luminous, and the envelope responds by expanding. Total luminosity increases.\nMost stars do not end as supernovae. The initial mass function, roughly dN/dM ∝ M<sup>−2.35</sup> (Salpeter) above 1 M<sub>☉</sub> and flatter below, makes stars above 8 M<sub>☉</sub> only about 0.3% of stars by number. The Sun will become a red giant in about 5 Gyr and then a white dwarf of about 0.54 M<sub>☉</sub>.","Our Sun will not blow up as a supernova. It is not big enough. In about 5 billion years it will swell into a red giant and then shrink into a white dwarf."],["Still unknown","Mass loss is the largest uncertainty in massive-star evolution: line-driven wind rates, luminous-blue-variable eruptions and binary stripping strongly affect final masses. Over 70% of O stars interact with a companion, so single-star tracks are idealizations.\nConvective overshoot, rotational mixing and magnetic fields are approximated by tunable parameters in one-dimensional codes such as MESA. Three-dimensional hydrodynamic simulations of convective shells are beginning to replace these approximations.","Scientists are still working out exactly how big stars explode, and which ones end up as black holes instead of neutron stars."]],"compact":[["How we know","Sirius B, a white dwarf, was resolved in 1862, and its high density was recognized by the 1920s. Bell Burnell and Hewish discovered pulsars in 1967. The Hulse–Taylor binary pulsar (1974) showed orbital decay matching general-relativistic gravitational-wave emission to within 0.2% (1993 Nobel Prize).\nMass measurements via Shapiro delay give PSR J0740+6620 at 2.08 ± 0.07 M<sub>☉</sub>. NICER pulse-profile modeling gives radii of about 12–13 km for 1.4–2.1 M<sub>☉</sub> stars, and the GW170817 tidal-deformability limit Λ<sub>1.4</sub> ≲ 800 excludes very stiff equations of state.","Scientists measured a star called Sirius B and found it was as heavy as the Sun but only as big as Earth. Later, astronomer Jocelyn Bell Burnell found stars that blink like lighthouses, which turned out to be spinning neutron stars."],["Common misconceptions","A neutron star is not simply a giant nucleus of neutrons. It is layered: a crust of neutron-rich nuclei in an electron lattice; an inner crust with free superfluid neutrons and possibly 'nuclear pasta' phases; and a core of neutrons with about 5–10% protons and electrons, possibly containing hyperons or deconfined quarks at the center.\nWhite dwarfs do not 'burn'. Their luminosity is residual thermal energy, radiated over billions of years; the coolest known white dwarfs (about 4,000 K) constrain the age of the Galactic disk to about 8–10 Gyr.","Pulsars don't actually blink on and off. They shine beams like a lighthouse, and we see a flash each time the beam sweeps past Earth."],["Still unknown","The dense-matter equation of state above 2ρ<sub>0</sub> is not known: whether cores contain quark matter, how stiff the equation of state is, and the exact TOV maximum mass (about 2.2–2.5 M<sub>☉</sub>). Combining NICER, more merger tidal measurements and post-merger oscillation signals from future detectors should narrow it.\nThe origin of magnetar fields of about 10<sup>15</sup> G, the mechanism of fast radio bursts (at least some from magnetars, as SGR 1935+2154 showed in 2020), and the Type Ia progenitor channel are all active problems.","Nobody knows exactly what is deep inside a neutron star. It might contain strange kinds of matter that can't exist anywhere else."]],"black-holes":[["How we know","Schwarzschild found the exterior solution in 1916; Oppenheimer and Snyder (1939) described collapse; Kerr (1963) found the rotating solution; Penrose's 1965 singularity theorem showed that collapse generically produces singularities (2020 Nobel Prize).\nObservational evidence is now overwhelming. Cygnus X-1 has a compact companion of about 21 M<sub>☉</sub>, far above any neutron-star limit. Stellar orbits at the Galactic Center, notably S2 with a 16-year period and pericenter of about 120 AU, give Sgr A* a mass of 4.3 × 10⁶ M<sub>☉</sub> (2020 Nobel Prize to Genzel and Ghez). The EHT imaged the shadows of M87* (2019) and Sgr A* (2022), with diameters matching Kerr predictions to about 10%.","Scientists watched stars race around the center of our galaxy for over 20 years. They are pulled by something with 4 million times the Sun's mass that we can't see. Telescopes around the world also teamed up to take pictures of the dark shadow of two black holes."],["Common misconceptions","Black holes do not 'suck' more strongly than other masses at the same distance. Outside the matter distribution, the field of a 10 M<sub>☉</sub> black hole is identical to that of a 10 M<sub>☉</sub> star; only close to r<sub>s</sub> do relativistic effects dominate.\nAn infalling observer does not notice anything locally special at the horizon of a large black hole. Tidal acceleration across a body of length ℓ is about 2GMℓ/r³, which at r<sub>s</sub> scales as 1/M², so 'spaghettification' happens outside the horizon only for stellar-mass holes and inside it for supermassive ones.","Black holes don't suck everything in. From far away, a black hole pulls just like any other object with the same mass. If the Sun turned into a black hole, Earth would keep orbiting normally, though it would get very cold."],["Still unknown","The information paradox asks whether Hawking evaporation destroys quantum information. Recent semiclassical calculations of the Page curve, using quantum extremal surfaces and 'islands', suggest information is preserved, but the mechanism in a fully dynamical theory is unresolved.\nIt is also unknown whether singularities are physical or resolved by quantum gravity, and whether cosmic censorship holds generically. Astrophysically, how supermassive black holes formed so early (JWST's 'little red dots' are an active puzzle) and how jets are launched remain open.","Scientists don't know what happens at the center of a black hole, or what happens to information about things that fall in. These are some of the biggest puzzles in physics."]],"grav-waves":[["How we know","Hulse and Taylor's binary pulsar PSR B1913+16 (discovered 1974) showed orbital decay consistent with quadrupole emission to within 0.2%. GW150914, a merger of about 36 + 29 M<sub>☉</sub> black holes at about 410 Mpc, was directly detected on 14 September 2015 (2017 Nobel Prize to Weiss, Barish and Thorne).\nGW170817 (2017), a binary neutron star merger at 40 Mpc, was followed 1.7 s later by a short gamma-ray burst and then a kilonova, launching multi-messenger astronomy. The fourth observing run (O4, 2023–2025) added hundreds of candidates; the GWTC-4.0 catalog (2025) brought the total to roughly 300. GW231123, with a total mass of about 225 M<sub>☉</sub>, is the most massive confirmed merger.","Detectors called LIGO use lasers in tunnels 4 kilometers long. When a gravitational wave passes, it stretches one tunnel and squeezes the other by a tiny amount, and the lasers notice. In 2017, scientists both 'heard' and saw two neutron stars crash together."],["Common misconceptions","Gravitational waves are not sound and do not require a medium; they are oscillations of the metric itself.\nTheir small amplitude does not mean they carry little energy. GW150914 radiated about 3 M<sub>☉</sub>c² ≈ 5 × 10<sup>47</sup> J in about 0.2 s, a peak power exceeding the combined light output of all stars in the observable universe. They are faint at Earth because spacetime is extremely stiff, with an effective stiffness of order c⁴/G ≈ 10<sup>44</sup> N.","Gravitational waves aren't sound waves, even though scientists sometimes turn them into sounds to share them. They are ripples in space itself and can travel through empty space."],["Still unknown","Merging black holes in the 'pair-instability mass gap' (about 50–130 M<sub>☉</sub>), such as in GW190521 and GW231123, may form through hierarchical mergers in dense clusters or AGN disks; their formation channels are debated.\nOpen questions include whether the PTA background comes from supermassive binaries or partly from early-universe sources (its amplitude is somewhat higher than many binary models predict), the existence of continuous waves from spinning neutron stars, and any detectable stochastic background from the early universe. Third-generation detectors (Einstein Telescope, Cosmic Explorer) aim to observe mergers throughout cosmic history.","Scientists plan to put a gravitational wave detector in space in the 2030s to catch even bigger black holes crashing together."]],"galaxies":[["How we know","The 'Great Debate' (Shapley vs Curtis, 1920) was settled by Hubble's 1925 Cepheid distance to M31, establishing other galaxies as external systems. Hubble's tuning-fork classification (1926) remains in use.\nModern surveys (SDSS, GAMA, DESI) characterize millions of galaxies. HST deep fields and JWST (CEERS, JADES, COSMOS-Web) trace galaxy evolution back to z ≈ 14. Integral-field spectroscopy (MaNGA, SAMI) maps internal kinematics, and Gaia showed that the Milky Way absorbed a major satellite, Gaia–Enceladus/Sausage, about 8–11 Gyr ago.","About 100 years ago, people weren't sure if other galaxies existed. Then Edwin Hubble measured the distance to Andromeda and showed it was far outside the Milky Way. Suddenly the universe was much, much bigger."],["Common misconceptions","Galaxies are not mostly stars. In the Milky Way, stars total about 6 × 10<sup>10</sup> M<sub>☉</sub>, while the dark halo totals about 10<sup>12</sup> M<sub>☉</sub>; even the baryons are not mostly in stars, since circumgalactic gas holds a comparable mass.\nGalaxy collisions rarely produce stellar collisions. Stellar separations (about 1 pc in the solar neighborhood) are about 10⁷ stellar diameters, so stars pass each other; it is the gas and dark matter that interact strongly, triggering starbursts and AGN activity.","When galaxies crash into each other, their stars almost never hit each other, because there is so much space between them. Our galaxy may one day merge with Andromeda, billions of years from now."],["Still unknown","JWST has found more UV-luminous galaxies at z > 10 than many pre-launch models predicted, and compact red sources ('little red dots') at z ≈ 4–9 whose nature, whether dusty AGN, dense star clusters or exotic gas-enshrouded black holes, is actively debated. Bursty star formation and reduced dust may explain the overabundance without changing cosmology.\nWhat quenches star formation, how disks survive mergers, and how supermassive black holes seed and grow are open questions. The 'missing satellites' and 'too-big-to-fail' problems have eased with better feedback modeling and discoveries of ultra-faint dwarfs.","The James Webb telescope found big, bright galaxies earlier in the universe's history than scientists expected. They are figuring out how those galaxies grew up so fast."]],"exoplanets":[["How we know","Wolszczan and Frail found planets around pulsar PSR B1257+12 in 1992. Mayor and Queloz's radial-velocity detection of 51 Pegasi b (1995), a 0.47 Jupiter-mass planet with a 4.2-day orbit, opened the field around Sun-like stars (2019 Nobel Prize). HD 209458 b's transit (2000) gave the first exoplanet radius and atmosphere detection.\nKepler's homogeneous survey enabled occurrence rates; TESS surveys bright nearby stars ideal for follow-up; and JWST provides high-precision infrared spectra. The NASA Exoplanet Archive passed 6,000 confirmed planets in 2025.","The first planet around a Sun-like star was found in 1995. Since then, space telescopes like Kepler have found thousands by watching stars dim slightly when a planet passes in front."],["Common misconceptions","A planet in the habitable zone is not necessarily habitable, let alone inhabited. The zone is defined only by the possibility of surface liquid water, given an assumed atmosphere; Venus lies near its inner edge.\nDetecting a molecule associated with life is also not detecting life. Many gases (O<sub>2</sub>, CH<sub>4</sub>, even dimethyl sulfide) can arise abiotically or be misidentified at low signal-to-noise. Reanalyses of the K2-18 b JWST data find no statistically robust DMS detection.","When news says a planet is 'Earth-like', it usually just means it is about Earth's size and not too hot or cold. We don't know if it has air, water or life."],["Still unknown","It is still unknown how common true Earth analogs are around Sun-like stars, because Kepler's statistics run out at about year-long periods, and whether temperate rocky planets around M dwarfs retain atmospheres despite stellar flares and XUV irradiation (JWST's Rocky Worlds program targets this).\nThe composition of sub-Neptunes (water worlds, magma oceans with H<sub>2</sub> envelopes, or mixed) is unresolved, as is the origin of hot Jupiters (disk migration, high-eccentricity migration or in-situ formation).","We haven't found life on any other planet. Some scientists thought they saw signs of life on one planet, but other scientists disagree, and it hasn't been confirmed."]],"special-rel":[["How we know","Michelson–Morley (1887) and its modern descendants, with optical cavity resonators now reaching Δc/c ~ 10<sup>−18</sup>, find no dependence of light speed on orientation or Earth's motion. Ives–Stilwell (1938) measured transverse Doppler shifts, and storage-ring experiments with Li<sup>+</sup> ions at β = 0.34 confirmed time dilation to parts in 10<sup>9</sup>.\nThe CERN muon storage ring (1977) found the lifetime of muons at γ = 29.3 dilated as predicted to 0.1%. Optical atomic clocks detect time dilation at walking speeds of about 10 m/s (2010), and GPS satellites' clocks must be corrected by about −7 μs/day for velocity time dilation.","In 1887, scientists tried to measure light moving faster or slower depending on Earth's motion, and found no difference at all. Later, scientists flew super-accurate clocks on airplanes and found the moving clocks really did tick a tiny bit differently."],["Common misconceptions","Time dilation is not a mechanical effect on clocks; it applies to every physical process, including decays, heartbeats and atomic transitions, because it is a property of spacetime geometry.\nRelativity does not make 'everything relative'. Invariants, including c, rest mass, proper time, the spacetime interval and causal order for timelike separations, are the same for all observers. Faster-than-light travel is not merely difficult: a superluminal signal would be seen in some frames as arriving before it was sent, violating causality.","Slower time for fast-moving things isn't a trick. If one twin flew in a super-fast rocket and came back, they really would be younger than the twin who stayed home."],["Still unknown","Special relativity is extremely well tested, but some quantum-gravity proposals predict tiny Lorentz-violating effects at high energy, such as energy-dependent photon speeds. Gamma-ray burst timing (for example GRB 221009A) and TeV blazar flares place limits beyond the Planck energy for linear dispersion.\nThe Standard Model Extension parametrizes all possible Lorentz-violating terms; experiments with clocks, masers, neutrinos and antimatter (such as antihydrogen spectroscopy) continue to bound them. None has been detected.","Special relativity has passed every test so far. Scientists keep testing it more precisely in case tiny differences show up, but none have."]],"emc2":[["How we know","Cockcroft and Walton's 1932 split of ⁷Li by protons (p + ⁷Li → 2α) released 17.3 MeV, matching the measured mass difference. Positron annihilation into two 511 keV photons and pair production have been observed since the 1930s.\nThe most precise direct test (Rainville et al., 2005) compared the energies of neutron-capture γ rays in silicon and sulfur, measured by crystal diffraction, with mass differences from Penning-trap atomic-mass measurements, confirming E = mc² to 4 parts in 10⁷.","Scientists have split atoms and measured that the pieces weigh slightly less than the original. The missing mass turned into exactly the amount of energy Einstein's formula predicted."],["Common misconceptions","E = mc² is not the full energy equation; it is E for a body at rest. A moving body has E = γmc², and a massless particle has E = pc.\nThe 'relativistic mass' γm that increases with speed is a deprecated concept. Modern physics uses invariant (rest) mass m, which does not change with speed; it is energy and momentum that grow without bound as v → c. Nuclear reactions are not uniquely 'mass-converting'; they merely involve energies large enough to make the mass change measurable.","E = mc² isn't only about bombs and reactors. Even a hot drink weighs a tiny, tiny bit more than a cold one, because heat is energy, and energy has mass. The difference is far too small to notice."],["Still unknown","Mass–energy equivalence itself is not in doubt. Open questions concern the masses it reveals: why the Higgs-generated fermion masses span a factor of 10<sup>5</sup> from electron to top quark (and much more including neutrinos), and precisely how QCD dynamics distribute the proton's mass among quark and gluon energy, trace anomaly and kinetic contributions, which the planned Electron–Ion Collider at Brookhaven aims to measure.\nIn general relativity, the total mass–energy of a gravitating system is well defined only in special cases (asymptotically flat spacetimes), and there is no local gravitational energy density.","The formula is well proven. What scientists still wonder is why tiny particles have the exact masses they do."]],"general-rel":[["How we know","Eddington's 1919 eclipse expedition measured starlight deflection consistent with general relativity; modern VLBI measurements of quasar positions confirm γ = 1 to 10<sup>−4</sup>, and the Cassini radio link (2003) to 2 × 10<sup>−5</sup>. Pound and Rebka (1959) measured gravitational redshift over 22.5 m.\nStrong-field tests include the double pulsar PSR J0737−3039, which agrees with general relativity to 0.013% in its orbital decay; the EHT shadow sizes; the gravitational redshift of star S2 at Sgr A*; and the consistency of LIGO–Virgo–KAGRA waveforms with general relativity. The MICROSCOPE satellite confirmed the weak equivalence principle to about 10<sup>−15</sup>.","Einstein's theory explained a wobble in Mercury's orbit that Newton couldn't. In 1919, scientists watched stars during a solar eclipse and saw their light bent by the Sun's gravity, just as predicted."],["Common misconceptions","General relativity does not say that mass alone curves spacetime. Energy, momentum, pressure and stress all source curvature; pressure is why radiation and dark energy gravitate differently from matter.\nThe 'rubber sheet' image is misleading. It shows spatial curvature pulled down by 'real' gravity, which is circular. For slow-moving objects near Earth, nearly all of the effect comes from curvature in time (the g<sub>00</sub> component): clocks run slower lower down, and objects move toward slower time.","The trampoline picture is helpful but not perfect. Surprisingly, the main reason things fall is that time runs slightly slower closer to Earth. Newton's ideas still work great for most everyday things."],["Still unknown","General relativity has not been reconciled with quantum mechanics. Singularity theorems show that the theory predicts its own breakdown inside black holes and at the Big Bang.\nOn cosmological scales, dark energy and dark matter could indicate modified gravity rather than new components; surveys test the growth of structure against general relativity's predictions, and current data agree within uncertainties. Gravitational-wave observations constrain alternatives, such as scalar–tensor theories, massive gravitons (m<sub>g</sub> < ~10<sup>−23</sup> eV/c²) and deviations in black hole ringdown modes.","Einstein's gravity theory and quantum physics don't fit together. Combining them into one theory is one of the biggest unsolved problems in science."]],"duality":[["How we know","Young's 1801 double-slit experiment established the wave nature of light; Planck (1900) and Einstein (1905) introduced energy quanta to explain blackbody radiation and the photoelectric effect; Compton (1923) showed photon momentum. De Broglie (1924) proposed matter waves, confirmed by Davisson–Germer and G. P. Thomson (1927).\nTonomura (1989) recorded single electrons building up a double-slit pattern. Interference with C<sub>60</sub> fullerenes (Arndt and Zeilinger, 1999) and later with molecules above 25,000 atomic mass units (2019) shows that no size limit has yet been found.","Long ago, scientists shined light through two slits and saw a striped pattern only waves can make. But Einstein showed light also comes in tiny packets. Later, electrons were found to make striped patterns too."],["Common misconceptions","A quantum object is not sometimes a wave and sometimes a particle, switching according to what it 'knows' about the apparatus. It is always described by a quantum state; the experimental configuration determines which properties are measured.\nThe wavefunction is not a physical wave in ordinary space for systems of more than one particle; it lives in a 3N-dimensional configuration space. And the 'collapse' is not a disturbance caused simply by a clumsy measurement. Decoherence and entanglement with the apparatus suppress interference even when the momentum kick is negligible.","Tiny particles aren't switching back and forth on purpose. They are something new that doesn't fit either of our everyday ideas. Also, 'observing' in physics doesn't need a person watching; any detector counts."],["Still unknown","The measurement problem is unresolved: how definite outcomes arise from unitary evolution. Interpretations include Copenhagen, many-worlds, de Broglie–Bohm pilot waves, QBism and objective-collapse models (GRW, Penrose–Diósi).\nCollapse models predict spontaneous loss of interference for large masses and slight heating; experiments with levitated nanoparticles, matter-wave interferometers and underground X-ray searches (which in 2020 excluded the simplest Diósi–Penrose model) are tightening constraints. Whether a macroscopic superposition limit exists remains open.","Scientists agree on the math, but argue about what it really means. Why do we see one result when we measure? There are several ideas, and no one has proven which is right."]],"uncertainty":[["How we know","Heisenberg's 1927 paper used a gamma-ray microscope thought experiment; Kennard (1927) proved the formal inequality σ<sub>x</sub>σ<sub>p</sub> ≥ ħ/2, and Robertson (1929) generalized it.\nExperimental confirmations include single-slit diffraction of neutrons and C<sub>60</sub> molecules, whose spreading matches Δp ≈ h/w; natural linewidths of atomic transitions; and the production of squeezed light (1985) with variance below the vacuum level, now routine in gravitational-wave detectors. Ozawa's error–disturbance relations were tested with neutron spin measurements in 2012.","If you push light through a very thin slit to pin down its position, it spreads out more on the other side. That is the uncertainty principle in action."],["Common misconceptions","Uncertainty is not just measurement disturbance. Heisenberg's microscope argument mixes two ideas. The preparation uncertainty relation σ<sub>x</sub>σ<sub>p</sub> ≥ ħ/2 concerns statistical spreads in a state, independent of measurement; the error–disturbance tradeoff is a separate statement, and its naive form can be violated, as Ozawa showed.\nIt also does not mean particles have exact but unknown positions and momenta. Bell-type experiments and the Kochen–Specker theorem exclude such noncontextual hidden values.","It isn't just that our tools bump the particle. Tiny particles simply don't have an exact position and exact speed at the same time. Physics can still make very accurate predictions."],["Still unknown","The uncertainty principle is mathematically secure within quantum mechanics. Open questions concern its generalizations: whether quantum gravity modifies it at the Planck scale (generalized uncertainty principles predict Δx ≳ ℓ<sub>P</sub>), and how entropic uncertainty relations with quantum memory, now used in cryptographic proofs, are best formulated.\nPractically, the frontier is engineering states and measurements that approach or evade the standard quantum limit, through squeezing, back-action evasion and quantum nondemolition measurement, in mechanical oscillators, atomic clocks and next-generation gravitational-wave detectors.","The rule itself is well understood. Scientists even use tricks with it to make detectors like LIGO more sensitive."]],"entanglement":[["How we know","Einstein, Podolsky and Rosen (1935) argued that quantum mechanics must be incomplete; Schrödinger coined 'entanglement' the same year. Bell (1964) turned the debate into an experimental question.\nFreedman–Clauser (1972) and Aspect (1982, with fast-switched analyzers) found violations of Bell inequalities. In 2015, Delft (electron spins 1.3 km apart), Vienna and NIST (photons) closed the locality and detection loopholes simultaneously. The 'Big Bell Test' (2018) used human-generated random choices, and other experiments used light from distant quasars to choose settings. China's Micius satellite (2017) distributed entangled photons over 1,200 km.","Einstein thought entanglement seemed too strange to be real. Decades later, experiments proved it is real. Scientists have even entangled particles between places more than 1,000 kilometers apart using a satellite."],["Common misconceptions","Entanglement does not mean one particle instantaneously 'causes' a change in the other. The correlations are symmetric and acausal, and no experiment can determine which measurement 'happened first' for spacelike-separated events.\nIt is not like classical correlation, such as a pair of gloves in separate boxes. Classical common-cause correlations obey Bell inequalities; entangled systems violate them. Entanglement is also not rare: almost all multiparticle quantum states are highly entangled, and it is easily generated, but hard to preserve.","You can't use entanglement to send secret messages faster than light. Each side just sees random results until they compare notes the normal way. 'Quantum teleportation' moves information about a particle, not the particle itself."],["Still unknown","Interpretations disagree about what Bell violations mean: nonlocality, rejection of realism or counterfactual definiteness, many-worlds branching, retrocausality or superdeterminism. Experiments cannot distinguish interpretations that make identical predictions.\nPractical questions include how to build large fault-tolerant quantum computers, scalable quantum repeaters for long-distance networks, and better classification of multipartite entanglement. In theoretical physics, the conjecture that spacetime geometry emerges from entanglement (ER = EPR, Ryu–Takayanagi) is an active research program.","The hard part now is keeping lots of particles entangled at once, which is what quantum computers need. Even tiny disturbances break it."]],"atoms":[["How we know","Rutherford's 1911 gold-foil scattering showed a compact nucleus; Bohr (1913) explained hydrogen lines with quantized orbits; Schrödinger (1926) and Dirac (1928) gave the full quantum treatment; Pauli (1925) explained shell structure with the exclusion principle.\nModern measurements are extraordinarily precise. The hydrogen 1S–2S transition is known to 4 parts in 10<sup>15</sup>, and the 2019 'proton radius puzzle' was largely resolved by new hydrogen spectroscopy agreeing with muonic hydrogen's smaller radius (0.841 fm). Scanning tunneling and quantum-gas microscopes image individual atoms and even electron orbitals.","In 1909, scientists shot tiny particles at thin gold foil. Most went straight through, but a few bounced back, which showed atoms have a tiny, heavy center. Today, special microscopes can actually see individual atoms."],["Common misconceptions","Electrons do not orbit nuclei like planets. Bohr's orbits were superseded by delocalized orbitals, three-dimensional probability distributions; the ground state of hydrogen has zero orbital angular momentum, and an electron has nonzero probability density at the nucleus.\nAtoms are not 'mostly empty space' in a meaningful sense. The electron cloud fills the volume as a probability distribution, and atoms resist compression because of Pauli exclusion and electrostatics. Solids are not 'mostly empty' either: their electron densities overlap continuously.","Electrons don't circle the nucleus like planets around the Sun. They act more like a fuzzy cloud around it. Things feel solid because electrons push back against each other."],["Still unknown","Basic atomic structure is well understood, but precision questions remain: the electron's electric dipole moment (bound below 4.1 × 10<sup>−30</sup> e·cm by JILA in 2023, constraining CP-violating new physics), small discrepancies in determinations of α between Cs and Rb measurements, and isotope-shift anomalies that could indicate new bosons.\nAt the edge of the periodic table, superheavy elements (Z = 113–118 confirmed) test relativistic quantum chemistry, and laboratories are attempting to produce elements 119 and 120. Thorium-229's nuclear isomer, laser-excited in 2024, may enable a nuclear clock sensitive to changes in fundamental constants.","Scientists use super-precise measurements of atoms to look for tiny hints of new physics."]],"standard-model":[["How we know","Discoveries followed predictions: neutral currents (1973), charm (1974), the gluon (1979), the W and Z (1983), the top quark (1995), the tau neutrino (2000) and the Higgs boson (2012). LEP measured the Z line shape to show there are exactly three light neutrino species (N<sub>ν</sub> = 2.996 ± 0.007 after a 2019 reanalysis).\nPrecision tests continue to agree. The electron's anomalous magnetic moment matches QED to about 1 part in 10<sup>12</sup>. The W mass from ATLAS (2024) and CMS (2024) agrees with the Standard Model prediction of about 80.357 GeV, while CDF's 2022 value (80.434 GeV) remains an unexplained outlier. Fermilab's final muon g − 2 result (2025) reached 127 parts per billion and agrees with updated lattice-QCD-based theory.","Scientists made the Standard Model in the 1960s and 70s. It predicted particles nobody had seen yet, and over the following decades, experiments found every single one."],["Common misconceptions","The Standard Model is not merely a list of particles; it is a dynamical theory with specific symmetries that fix how particles interact and make quantitative predictions, many computed to five or more loop orders.\nIts 'free parameters' are not a sign of failure but of incompleteness: Yukawa couplings, mixing angles and the Higgs potential are measured rather than derived. 'Beyond the Standard Model' does not imply the theory is wrong within its tested domain, only that it is an effective field theory valid below some higher energy scale.","Protons and neutrons are not the smallest pieces. They are made of even smaller particles called quarks."],["Still unknown","The flavor puzzle asks why there are three generations with masses spanning about 12 orders of magnitude (including neutrinos) and why the CKM matrix is nearly diagonal. The strong CP problem asks why the QCD θ-parameter is below about 10<sup>−10</sup>, as the neutron electric dipole moment bound implies; axions are one proposed solution.\nThe hierarchy problem concerns why the Higgs mass is not driven to the Planck scale by quantum corrections. Mild tensions in B-meson decays (lepton-flavor-universality ratios) have mostly faded with improved LHCb analyses, so there is currently no confirmed laboratory deviation from the Standard Model.","The Standard Model can't explain gravity, dark matter, or why there's more matter than antimatter. So physicists know there must be more to discover."]],"higgs":[["How we know","ATLAS and CMS announced discovery on 4 July 2012. Subsequent measurements established spin-parity 0⁺ (excluding 0⁻ and 2⁺ hypotheses), couplings to W, Z, top, bottom, τ and μ (the latter at about 3σ), and a total width consistent with the Standard Model's 4.1 MeV via off-shell production. Evidence for H → Zγ was reported in 2023.\nThe measured couplings follow the predicted proportionality to mass across three orders of magnitude, from muon to top quark, one of the most striking confirmations of the mechanism.","Scientists predicted the Higgs particle in 1964 but needed a huge machine to find it. The Large Hadron Collider, a 27-kilometer ring under Switzerland and France, finally found it in 2012."],["Common misconcepti
