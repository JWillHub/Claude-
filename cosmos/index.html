mount(o){
  const C=mkCanvas(o.stage,.72),r=mulberry(11),G=[];
  for(let i=0;i<40;i++){const R=Math.sqrt(r())*1.1,th=r()*6.2832;G.push([R*Math.cos(th),R*Math.sin(th),i%4])}G.push([0,0,0]);
  let home=G.length-1,t=0,play=true,pos=[];
  o.ctl.innerHTML=`<label>${o.ms?"Time →":"Time (scale factor)"}<input type="range" id="m-exp" min="0" max="100" step="0.1" value="0"></label><button class="mbtn on" id="m-exp-play">Pause</button>`;
  const sl=o.ctl.querySelector("#m-exp"),pb=o.ctl.querySelector("#m-exp-play");
  const setPlay=v=>{play=v;pb.classList.toggle("on",v);pb.textContent=v?"Pause":"Play"};
  sl.oninput=()=>{t=+sl.value;setPlay(false)};pb.onclick=()=>{if(!play&&t>=100)t=0;setPlay(!play)};
  C.cv.onclick=e=>{const b=C.cv.getBoundingClientRect(),x=e.clientX-b.left,y=e.clientY-b.top;let best=-1,bd=1e9;pos.forEach((q,i)=>{const d=Math.hypot(q[0]-x,q[1]-y);if(d<bd){bd=d;best=i}});if(bd<40)home=best};
  let lastA=-1;
  const stop=loop(()=>{
    if(play){t+=.25;if(t>=100){t=100;setPlay(false)}sl.value=t}
    const p=PAL(o.ms),c=C.ctx,W=C.W,H=C.H,a=.55+t/100*.75,S=Math.min(W,H)*.4,cx=W/2,cy=H/2;
    c.fillStyle=bgOf(p);c.fillRect(0,0,W,H);
    const cols=p.ms?[p.b,p.c,p.d,p.e]:[p.fg,p.fg,p.fg,p.fg];
    pos=G.map(g=>[cx+(g[0]-G[home][0])*a*S,cy+(g[1]-G[home][1])*a*S]);
    pos.forEach((q,i)=>{if(i!==home)arrow(c,q[0],q[1],q[0]+(q[0]-cx)*.25,q[1]+(q[1]-cy)*.25,p.ms?"rgba(255,255,255,.4)":p.mut,1.2)});
    pos.forEach((q,i)=>{if(i===home){c.strokeStyle=p.a;c.lineWidth=2;c.beginPath();c.arc(q[0],q[1],11,0,6.2832);c.stroke();disc(c,q[0],q[1],5,p.a,p.ms?16:0);txt(c,o.ms?"YOU":"you",q[0]+15,q[1]-10,p.a,11,"left",700,p)}else disc(c,q[0],q[1],p.ms?4.2:3,cols[G[i][2]],p.ms?10:0)});
    txt(c,(o.ms?"space stretched ×":"distances ×")+(a/.55).toFixed(2),10,18,p.fg,11,"left",600,p);
    if(Math.abs(a-lastA)>.002){lastA=a;rd(o,o.ms?[["Space has stretched","×"+(a/.55).toFixed(2)],["Farther galaxies move","faster"],["Center of the universe","none!"]]
      :[["Distances since start","×"+(a/.55).toFixed(2)],["Hubble's law","v = H<sub>0</sub> × d"],["H<sub>0</sub> measured","67–73 km/s/Mpc"]])}
  });
  return()=>{stop();C.stop()}}},

"dark-matter":{t:["Galaxy rotation curve","The too-fast galaxy"],
cap:["Circular velocity v<sub>c</sub>(r) = √[GM(<r)/r] for a Milky-Way-like galaxy. Baryons alone (exponential disk plus bulge) predict a Keplerian decline, v ∝ r<sup>−1/2</sup>, beyond the disk; observed H I rotation curves stay flat, which requires M(<r) ∝ r and an extended halo (here an NFW profile). Illustrative model, not fitted data.","Stars far from a galaxy's center should orbit slowly, like outer planets do. But they don't! They zip around just as fast. Tap the button to add invisible dark matter and see what fixes it."],
leg:[["fg","Measured star speeds (illustrative)","What telescopes measure"],["b","Prediction from visible stars and gas","What we'd expect from stuff we can see"],["c","Dark matter halo's share","Extra push from dark matter"],["a","Visible + dark matter","Seen + unseen together"]],
mount(o){
  const C=mkCanvas(o.stage,.66),G=4.30e-6,Mt=6e10,rd_=3;let halo=false;
  const vv=r=>Math.sqrt(G*Mt*(1-(1+r/rd_)*Math.exp(-r/rd_))/r),vh=r=>Math.sqrt(Math.max(0,200*200*(1-(5/r)*Math.atan(r/5)))),vt=r=>Math.hypot(vv(r),vh(r));
  const rr=mulberry(4),obs=Array.from({length:14},(_,i)=>{const r=2+i*2;return[r,vt(r)+(rr()-.5)*16]});
  o.ctl.innerHTML=`<button class="mbtn" id="m-dm">${o.ms?"Add dark matter":"Add dark matter halo"}</button><label>${o.ms?"Distance from center":"Radius"}<input type="range" id="m-dm-r" min="1" max="30" step="0.5" value="25"></label>`;
  const bt=o.ctl.querySelector("#m-dm"),sl=o.ctl.querySelector("#m-dm-r");
  bt.onclick=()=>{halo=!halo;bt.classList.toggle("on",halo);bt.textContent=halo?(o.ms?"Remove dark matter":"Remove halo"):(o.ms?"Add dark matter":"Add dark matter halo");draw()};
  function draw(){
    const p=PAL(o.ms),c=C.ctx,W=C.W,H=C.H,L=40,R=W-12,T=14,B=H-34,X=r=>L+r/30*(R-L),Y=v=>B-v/300*(B-T),rs=+sl.value;

    [0,100,200,300].forEach(v=>{c.beginPath();c.moveTo(L,Y(v));c.lineTo(R,Y(v));c.stroke();txt(c,v,L-5,Y(v)+3,p.mut,9,"right",400,p)});
    [0,10,20,30].forEach(r=>txt(c,o.ms?Math.round(r*3.262)+"k":r,X(r),B+13,p.mut,9,"center",400,p));
    txt(c,o.ms?"distance from center (light-years) →":"radius (kpc) →",R,H-5,p.mut,10,"right",400,p);
    txt(c,o.ms?"speed (km/s)":"v (km/s)",L+4,T+10,p.mut,10,"left",400,p);
    const curve=(f,col,w,dash)=>{c.strokeStyle=col;c.lineWidth=w;c.setLineDash(dash||[]);c.beginPath();for(let r=.5;r<=30;r+=.25){const x=X(r),y=Y(f(r));r===.5?c.moveTo(x,y):c.lineTo(x,y)}c.stroke();c.setLineDash([])};
    curve(vv,p.b,2.2,[6,4]);if(halo){curve(vh,p.c,2,[2,4]);curve(vt,p.a,3)}

    disc(c,X(rs),Y(vv(rs)),4,p.b);if(halo)disc(c,X(rs),Y(vt(rs)),4,p.a);

      :[["At r = "+rs+" kpc, observed",Math.round(vt(rs))+" km/s"],["Visible-only prediction",Math.round(vv(rs))+" km/s"],[halo?"Halo contribution":"Shortfall",halo?Math.round(vh(rs))+" km/s (in quadrature)":Math.round(gap)+" km/s"]]);

"rockets":{t:["Rocket equation","Fuel vs. speed"],
cap:["Single-stage Tsiolkovsky equation, Δv = v<sub>e</sub> ln(m<sub>0</sub>/m<sub>f</sub>) with v<sub>e</sub> = I<sub>sp</sub>g<sub>0</sub> (vacuum values); everything except propellant counts as final mass. Because Δv grows only logarithmically with mass ratio, orbit (Δv ≈ 9.4 km/s including gravity and drag losses) requires m<sub>0</sub>/m<sub>f</sub> ≈ 8–20 for chemical propellants, which motivates staging.","Choose an engine and how much of the rocket is fuel. See how far you could get! Notice that going from 90% fuel to 95% fuel adds a lot of speed, but you'd have almost no room left for the rocket itself."],
leg:[["a","Your rocket's Δv","Your rocket's speed budget"],["mut","Δv needed for each destination","Speed needed to get there"]],
mount(o){
  const C=mkCanvas(o.stage,.56);let ve=3.3;
  o.ctl.innerHTML="";const sl=addSlider(o,"m-rk",o.ms?"How much of the rocket is fuel":"Propellant fraction of launch mass",50,97,.5,90);
  chips(o,"m-rk-e",o.ms?"Engine":"Engine (vacuum v<sub>e</sub>)",[["2.6",o.ms?"Solid":"Solid 2.6"],["3.1",o.ms?"Kerosene":"Kerosene 3.1"],["3.6",o.ms?"Methane":"Methane 3.6"],["4.4",o.ms?"Hydrogen":"Hydrogen 4.4"]],"3.6",v=>{ve=+v;draw()});
  sl.oninput=draw;ve=3.6;
  const DEST=[[9.4,"Low Earth orbit","Orbit around Earth"],[12.6,"Trans-lunar injection","Head to the Moon"],[13,"Trans-Mars injection","Head to Mars"],[18.2,"Escape the solar system","Leave the solar system"]];
  function draw(){
    const p=PAL(o.ms),c=C.ctx,W=C.W,H=C.H,f=+sl.value/100,mr=1/(1-f),dv=ve*Math.log(mr);
    c.fillStyle=bgOf(p);c.fillRect(0,0,W,H);
    const L=10,R=W-10,X=v=>L+v/20*(R-L),rows=DEST.length+1,rh=(H-34)/rows;
    DEST.forEach(([v,a,b],k)=>{const y=14+k*rh,ok=dv>=v;c.fillStyle=p.line;c.fillRect(L,y+rh*.55,R-L,4);c.fillStyle=ok?p.d:p.mut;c.fillRect(L,y+rh*.55,X(v)-L,4);disc(c,X(v),y+rh*.55+2,4,ok?p.d:p.mut);fitTxt(c,(o.ms?b:a)+"  "+v+" km/s"+(ok?"  ✓":""),L,y+rh*.45,ok?p.fg:p.mut,11,"left",ok?700:400,p,R-L)});
    const y=14+DEST.length*rh;c.fillStyle=p.a;c.fillRect(L,y+rh*.5,Math.max(2,X(Math.min(dv,20))-L),10);
    fitTxt(c,(o.ms?"Your rocket: ":"Your rocket Δv: ")+dv.toFixed(1)+" km/s",L,y+rh*.4,p.a,12,"left",700,p,R-L);
    [0,5,10,15,20].forEach(v=>txt(c,v,X(v),H-6,p.mut,9,v===0?"left":v===20?"right":"center",400,p));
    const reach=DEST.filter(d=>dv>=d[0]);
    rd(o,o.ms?[["Speed budget",dv.toFixed(1)+" km/s"],["Fuel vs. everything else","For every 1 kg of rocket, "+Number((mr-1).toPrecision(2))+" kg of fuel"],["Farthest you can go",reach.length?reach[reach.length-1][2]:"Not even orbit; add stages!"]]
      :[["Δv (single stage)",dv.toFixed(2)+" km/s"],["Mass ratio m<sub>0</sub>/m<sub>f</sub>",mr.toFixed(1)],["Reaches",reach.length?reach[reach.length-1][1]:"Not orbit: real launchers use 2–3 stages"]]);
  }
  C.onsize=draw;draw();return()=>C.stop()}},

"radioactivity":{t:["Half-life simulator","Watch atoms decay"],
cap:["Monte Carlo decay of N<sub>0</sub> = 400 nuclei, each with a decay time drawn from p(t) = λe<sup>−λt</sup>. The expected population follows N(t) = N<sub>0</sub>2<sup>−t/t<sub>1/2</sub></sup>, with Poisson fluctuations of about √N. Choosing an isotope only rescales the time axis; the statistics are memoryless and identical.","Each square is one radioactive atom. You can't predict when any single one will change, but watch: after each half-life, about half of the remaining ones have decayed!"],
leg:[["a","Undecayed nucleus","Still radioactive"],["mut","Decayed","Already changed"]],
mount(o){
  const C=mkCanvas(o.stage,.62);const N=400,rnd=mulberry(31),TD=Array.from({length:N},()=>-Math.log(1-rnd())/Math.LN2);let t=0,play=false,iso=1;
  const ISO=[["Iodine-131",8.02,"days"],["Carbon-14",5730,"years"],["Uranium-238",4.47e9,"years"]];
  o.ctl.innerHTML="";const sl=addSlider(o,"m-hl",o.ms?"Time passed (in half-lives)":"Elapsed time (half-lives)",0,6,.01,0);
  const b=document.createElement("button");b.className="mbtn";b.textContent="Play";o.ctl.append(b);
  b.onclick=()=>{if(t>=6)t=0;play=!play;b.classList.toggle("on",play);b.textContent=play?"Pause":"Play"};
  sl.oninput=()=>{t=+sl.value;play=false;b.classList.remove("on");b.textContent="Play"};
  chips(o,"m-hl-i",o.ms?"Atom type":"Isotope",ISO.map((q,k)=>[String(k),q[0]]),"1",v=>{iso=+v;last=-1});
  let last=-1;C.onsize=()=>{last=-1};
  const stop=loop(()=>{
    if(play){t+=.012;if(t>=6){t=6;play=false;b.classList.remove("on");b.textContent="Play"}sl.value=t}
    if(t===last)return;last=t;
    const p=PAL(o.ms),c=C.ctx,W=C.W,H=C.H,left=TD.filter(x=>x>t).length,q=ISO[iso];
    c.fillStyle=bgOf(p);c.fillRect(0,0,W,H);
    const gw=Math.min(W*.5,H*.86),cell=gw/20,gx=10,gy=(H-gw)/2;
    for(let k=0;k<N;k++){const x=gx+(k%20)*cell,y=gy+Math.floor(k/20)*cell,alive=TD[k]>t;c.fillStyle=alive?p.a:(p.ms?"rgba(255,255,255,.12)":p.line);c.fillRect(x+1,y+1,cell-2,cell-2)}
    const L=gx+gw+30,R=W-10,T=gy+10,B=gy+gw-18,X=h=>L+h/6*(R-L),Y=f=>B-f*(B-T);
    c.strokeStyle=p.line;c.lineWidth=1;c.beginPath();c.moveTo(L,T);c.lineTo(L,B);c.lineTo(R,B);c.stroke();
    for(let h=1;h<=6;h++){c.setLineDash([2,3]);c.beginPath();c.moveTo(X(h),T);c.lineTo(X(h),B);c.stroke();c.setLineDash([]);txt(c,h,X(h),B+12,p.mut,9,"center",400,p)}
    [1,.5,.25].forEach(f=>txt(c,f*100+"%",L-4,Y(f)+3,p.mut,9,"right",400,p));
    c.strokeStyle=p.mut;c.lineWidth=1.5;c.beginPath();for(let h=0;h<=6;h+=.05){const y=Y(.5**h);h?c.lineTo(X(h),y):c.moveTo(X(h),y)}c.stroke();
    c.strokeStyle=p.a;c.lineWidth=2.5;c.beginPath();for(let h=0;h<=t;h+=.02){const y=Y(TD.filter(x=>x>h).length/N);h?c.lineTo(X(h),y):c.moveTo(X(h),y)}c.stroke();disc(c,X(t),Y(left/N),4,p.a);
    txt(c,o.ms?"half-lives →":"half-lives →",R,B+24,p.mut,9,"right",400,p);
    const el=t*q[1],fmt=el>=1e6?words(el):Number(el.toPrecision(3)).toLocaleString();
    rd(o,o.ms?[["Time passed",fmt+" "+q[2]],["Atoms left",left+" of 400 ("+Math.round(left/4)+"%)"],["Expected by the rule",Math.round(100*.5**t)+"%"]]
      :[["Elapsed",fmt+" "+q[2]+" ("+t.toFixed(2)+" half-lives, T½ = "+(q[1]>=1e6?sci(q[1]):q[1].toLocaleString())+" "+q[2]+")"],["Remaining (simulated)",left+" / 400 = "+(left/4).toFixed(1)+"%"],["Expected, N₀ × ½<sup>t/T</sup>",(100*.5**t).toFixed(1)+"%"]]);
  });
  return()=>{stop();C.stop()}}},

"fate-universe":{t:["Possible futures","How will it end?"],
cap:["Scale factor <i>a</i>(t) (today = 1) for four scenarios. The cosmological-constant curve integrates the Friedmann equation for flat ΛCDM (Ω<sub>m</sub> = 0.31), approaching <i>a</i> ∝ exp(H<sub>0</sub>√Ω<sub>Λ</sub> t). The Big Rip (w < −1) and Big Crunch (decaying dark energy) curves are illustrative, with endpoint times chosen for display rather than fitted to data.","Each line shows how big the universe gets over time in a different possible future. Pick one to learn about it. The dashed line is today."],
leg:[["a","Selected future","The future you picked"],["mut","Other possibilities","Other possible futures"]],
mount(o){
  const C=mkCanvas(o.stage,.6);let sel="lam";
  const H0=1/14.44,Om=.31,OL=.69,aL=t=>Math.cbrt(Om/OL)*Math.sinh(1.5*Math.sqrt(OL)*H0*t)**(2/3),tn=13.8,n0=aL(tn);
  const S={lam:[t=>aL(t)/n0,70,"Cosmological constant: heat death","Forever stretching: freeze-out","Expansion accelerates forever. Galaxy groups become isolated within ~100–150 billion years; star formation ends over trillions; the universe cools toward heat death.","Space keeps stretching faster forever. Stars burn out, and the universe slowly gets cold and dark."],
    rip:[t=>t<=tn?aL(t)/n0:aL(t)/n0*((35.8-tn)/(35.8-t))**.8,35.5,"Big Rip","Big Rip","If dark energy strengthens (w < −1), expansion runs away to infinite size in finite time. Illustrated here ~22 billion years from now; clusters, galaxies, planets and finally atoms are torn apart in the last stages.","Dark energy gets stronger and stronger until it rips apart galaxies, planets and even atoms."],
    crunch:[t=>{const T=50;return(Math.sin(Math.PI*t/T)/Math.sin(Math.PI*tn/T))**(2/3)},49.8,"Big Crunch","Big Crunch","If dark energy decays and turns negative, expansion slows, stops and reverses into collapse. Some fits to recent data allow this tens of billions of years ahead; the timing here is illustrative.","Dark energy fades and flips. The universe stops growing and squeezes back together."],
    mat:[t=>(t/tn)**(2/3),70,"No dark energy","No dark energy","Without dark energy, a flat universe would keep expanding but ever more slowly. This is ruled out by observations of acceleration, but shows dark energy's effect.","Without dark energy, the universe would keep growing, but slower and slower. We know this isn't what's happening."]};
  chips(o,"m-fu",o.ms?"Future":"Scenario",[["lam",o.ms?"Freeze-out":"Heat death"],["rip","Big Rip"],["crunch","Big Crunch"],["mat",o.ms?"No dark energy":"No dark energy"]],"lam",v=>{sel=v;draw()});
  function draw(){
    const p=PAL(o.ms),c=C.ctx,W=C.W,H=C.H,L=34,R=W-10,T=14,B=H-30,X=t=>L+t/70*(R-L),Y=a=>B-Math.min(a,5)/5*(B-T);
    c.fillStyle=bgOf(p);c.fillRect(0,0,W,H);c.strokeStyle=p.line;c.lineWidth=1;c.beginPath();c.moveTo(L,T);c.lineTo(L,B);c.lineTo(R,B);c.stroke();
    [0,1,2,3,4,5].forEach(a=>txt(c,a,L-5,Y(a)+3,p.mut,9,"right",400,p));[0,20,40,60].forEach(t=>txt(c,t,X(t),B+12,p.mut,9,"center",400,p));
    txt(c,o.ms?"billions of years →":"time (billion years) →",R,H-4,p.mut,9,"right",400,p);txt(c,o.ms?"size of universe":"scale factor",L+4,T+8,p.mut,9,"left",400,p);
    c.setLineDash([3,4]);c.strokeStyle=p.fg;c.beginPath();c.moveTo(X(tn),T);c.lineTo(X(tn),B);c.stroke();c.setLineDash([]);txt(c,o.ms?"today":"today",X(tn)+4,B-6,p.fg,9,"left",600,p);
    Object.keys(S).sort((a,b)=>(a===sel)-(b===sel)).forEach(k=>{const s=S[k],on=k===sel;c.strokeStyle=on?p.a:p.mut;c.globalAlpha=on?1:.45;c.lineWidth=on?3:1.5;c.beginPath();let st=false;for(let t=.3;t<=s[1];t+=.1){const a=s[0](t);if(!(a>=0)||a>5.2)break;const x=X(t),y=Y(a);st?c.lineTo(x,y):c.moveTo(x,y);st=true}c.stroke();c.globalAlpha=1});
    const s=S[sel];rd(o,[[o.ms?"Future":"Scenario",o.ms?s[3]:s[2]],[o.ms?"What happens":"Outline",o.ms?s[5]:s[4]]]);
  }
  C.onsize=draw;draw();return()=>C.stop()}}
});

let activeModel=null;
function modelHTML(e){const m=M[e.id];if(!m)return"";const k=ms()?1:0,pal=PAL(ms());
  const leg=(m.leg||[]).length?`<div class="mleg">${m.leg.map(([key,a,b])=>`<span><i style="background:${pal[key]}"></i>${k?b:a}</span>`).join("")}</div>`:"";
  return `<section class="model${ms()?" kz":""}"><div class="mhead"><h3>${m.t[k]}</h3></div><p class="mcap">${hs()&&HSM[e.id]?HSM[e.id]:m.cap[k]}</p><div class="mstage"></div>${leg}<div class="mctl"></div><div class="mread"></div></section>`}
function mountModel(id){if(activeModel){try{activeModel()}catch(e){}activeModel=null}const m=M[id],el=document.querySelector(".model");if(!m||!el)return;
  activeModel=m.mount({stage:el.querySelector(".mstage"),ctl:el.querySelector(".mctl"),read:el.querySelector(".mread"),ms:ms()})}

let lastHash=null;
function render(){
  const id=location.hash.slice(1),e=byId[id],f=FIELDS.find(x=>x.id===id);
  if(activeModel){try{activeModel()}catch(err){}activeModel=null}
  $("#view").innerHTML=e?page(e):f?field(f):home();
  if(e)mountModel(e.id);
  document.title=e?e.t+" · Cosmos Field Guide":f?f.n+" · Cosmos Field Guide":"Cosmos Field Guide";
  if(location.hash!==lastHash){window.scrollTo(0,0);lastHash=location.hash;oTab="read"}
}
window.addEventListener("hashchange",render);
setLevel(state.level);


</script>
