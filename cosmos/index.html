ons","The Higgs field does not give mass to all matter. More than 98% of the mass of a proton or neutron comes from QCD binding energy; the Higgs gives the up and down quarks and the electron their small masses (a few MeV and 0.511 MeV).\nIt is not a 'molasses' that slows particles through friction. A massive particle is a field excitation whose dispersion relation, E² = p²c² + m²c⁴, is altered by its coupling to the constant background field, without energy loss. And the 'God particle' label is a publicity nickname with no scientific meaning.","The Higgs gives some tiny particles their mass, but most of your weight actually comes from energy inside protons and neutrons, thanks to E = mc²."],["Still unknown","The hierarchy problem is the largest open question: quantum corrections to m<sub>H</sub>² scale with the square of any heavy new-physics mass, so a light Higgs suggests either new physics near the TeV scale (supersymmetry, compositeness) or fine-tuning. The LHC has found no such new particles up to a few TeV.\nIt is also unknown whether the Higgs is elementary or composite, whether there are additional Higgs bosons, and whether the electroweak vacuum is stable; with m<sub>t</sub> ≈ 172.5 GeV, extrapolations suggest metastability near 10<sup>10</sup>–10<sup>11</sup> GeV, with a lifetime far exceeding the age of the universe.","Physicists don't know why the Higgs particle has the mass it does. It seems surprisingly light, and that puzzle may hint at new physics."]],"forces":[["How we know","Maxwell unified electricity and magnetism (1865). Fermi's 1934 theory described beta decay; Wu's 1956 experiment found parity violation. Glashow, Weinberg and Salam unified electromagnetism and the weak force (1979 Nobel Prize), predicting neutral currents (found 1973) and the W and Z (found 1983). QCD was established by deep inelastic scattering (1968–1973), three-jet events (1979) and the measured running of α<sub>s</sub>.\nGravity's inverse-square law has been tested from about 50 μm (torsion balances) to planetary scales; no deviations have been found.","Scientists discovered that electricity and magnetism are one force, then that this force is linked to the weak force. These discoveries make some think all forces might be connected."],["Common misconceptions","'Forces' in quantum field theory are not literally particles thrown back and forth like balls. Virtual particles are terms in a perturbative expansion, not observable entities, and the exchange picture applies cleanly only in perturbation theory.\nThe weak interaction is not weak because of a small coupling. At energies above about 100 GeV it is comparable in strength to electromagnetism; its low-energy feebleness is due to the mediator mass.","Friction and pushing are not separate forces. They are all electromagnetism between atoms. Gravity is so weak that a tiny magnet can lift a paper clip against the pull of the whole Earth."],["Still unknown","Whether gravity can be quantized consistently, and whether all forces unify, is unknown. String theory offers a framework but no unique testable predictions at accessible energies.\nSearches continue for new interactions: dark photons, light scalar fifth forces (tested by equivalence-principle experiments and short-range gravity), and anomalies such as the ATOMKI 'X17' claim, which MEG II did not confirm in 2024 and which remains unresolved after a weak PADME excess in 2025. Why the electroweak scale is so far below the Planck scale remains a deep puzzle.","Scientists wonder if all four forces were once one force in the early universe. They also don't know why gravity is so much weaker than the others."]],"neutrinos":[["How we know","Pauli proposed the neutrino in 1930 to conserve energy in beta decay; Cowan and Reines detected reactor antineutrinos in 1956. Davis's chlorine experiment found a solar ν<sub>e</sub> deficit beginning in 1968.\nSuper-Kamiokande (1998) observed atmospheric ν<sub>μ</sub> disappearance depending on path length, and SNO (2001–2002) showed that the total solar flux of all flavors matches solar models while the ν<sub>e</sub> component is one-third (2015 Nobel Prize to Kajita and McDonald). Reactor experiments (Daya Bay, RENO, Double Chooz, 2012) measured θ<sub>13</sub>. IceCube detected high-energy astrophysical neutrinos (2013) and neutrinos from the Galactic plane (2023), and KM3NeT reported an event of about 220 PeV in 2025.","Neutrinos were predicted in 1930 and first detected in 1956 near a nuclear reactor. Later, giant tanks of water deep underground showed that neutrinos can switch between types, which proved they have mass."],["Common misconceptions","Neutrinos are not massless, contrary to the original Standard Model; oscillations require at least two nonzero masses. They are also not 'just faster electrons': their speed differs from c by less than about 10<sup>−9</sup>, as both SN 1987A timing and accelerator measurements show (the 2011 OPERA superluminal claim was traced to a faulty cable).\nOscillation does not mean a particle changes into another particle over time like a decay. A neutrino is created in a definite flavor state, a superposition of mass states, and interference among those components changes the probability of detecting each flavor.","Neutrinos aren't rare. They are among the most common particles in the universe. A 2011 report of neutrinos going faster than light turned out to be caused by a loose cable."],["Still unknown","Key open questions: the mass ordering, which JUNO (taking data since 2025), DUNE and Hyper-Kamiokande aim to determine; whether leptonic CP violation exists (T2K and NOvA data hint at δ<sub>CP</sub> ≈ −90° in some fits, not yet significant); the absolute mass scale; and whether neutrinos are Majorana particles.\nThe cosmological bound Σm<sub>ν</sub> < 0.064 eV is close to the minimum allowed by oscillations (about 0.059 eV for normal ordering), creating mild tension that may reflect cosmological modeling. Short-baseline anomalies hinting at an eV-scale sterile neutrino have weakened, with MicroBooNE results disfavoring the simplest explanations.","Nobody knows exactly how heavy neutrinos are. A big new experiment called DUNE will study whether neutrinos could help explain why the universe has more matter than antimatter."]],"newton":[["How we know","Newton's Principia (1687) derived Kepler's empirical laws from gravitation; Halley predicted his comet's 1758 return; Le Verrier and Adams predicted Neptune (discovered 1846) from perturbations of Uranus. Cavendish (1798) measured G with a torsion balance, effectively 'weighing the Earth'.\nToday, lunar laser ranging tests Newtonian and relativistic dynamics to centimeter precision over 384,000 km, and spacecraft navigation confirms planetary ephemerides (such as JPL's DE440) at the meter level. Torsion-balance experiments confirm the inverse-square law down to about 50 μm.","Newton's laws were so good that in 1846, scientists used them to predict where an unknown planet should be. They looked there and found Neptune."],["Common misconceptions","Force is not required to keep something moving; it changes motion. The Aristotelian intuition that motion needs a sustaining force reflects everyday friction.\nAstronauts in orbit are not weightless because gravity is absent: at 400 km altitude g is still about 89% of its surface value. They are in free fall together with their spacecraft, continuously falling around Earth, so no contact force acts on them.","Astronauts float not because there's no gravity in space, but because they are falling around the Earth the whole time. And without air, a feather and a hammer fall at the same speed, as an astronaut showed on the Moon."],["Still unknown","G is measured to only about 22 parts per million (CODATA 2022), and modern experiments using different methods (torsion balances, atom interferometry, beam balances) disagree with each other by more than their stated uncertainties, suggesting unrecognized systematic errors.\nThe N-body problem has no general closed-form solution, and orbital dynamics can be chaotic: the inner Solar System has a Lyapunov time of about 5 million years, so planetary positions cannot be predicted beyond about 60 million years. Galaxy rotation curves, explained by dark matter in standard cosmology, are the main regime where Newtonian predictions from visible mass fail.","Scientists still can't measure the strength of gravity as precisely as other constants. Different experiments get slightly different numbers."]],"conservation":[["How we know","Momentum conservation was formulated by Descartes and Huygens and given its modern form by Newton. Energy conservation was established in the 1840s by Mayer, Joule and Helmholtz through measurements of the mechanical equivalent of heat (about 4.19 J/cal). Noether's 1918 theorem provided the general explanation.\nConservation laws have repeatedly guided discovery: Pauli's neutrino (1930), the antiproton production threshold at the Bevatron (1955), and missing transverse momentum used to identify W bosons and in searches for dark matter at colliders.","In the 1840s, scientists showed that energy can change form, like motion turning into heat, but the total amount stays the same. Later, mathematician Emmy Noether showed why: it comes from the rules of physics staying the same over time."],["Common misconceptions","'Conservation of energy' does not mean usable energy cannot be lost. Total energy is conserved, but entropy increases, so energy degrades into forms (such as low-temperature heat) less able to do work.\nConservation laws do not hold in frames or systems that are not isolated. A ball dropped on Earth gains kinetic energy and momentum because Earth's gravity is an external force; including Earth in the system restores conservation, with Earth's recoil being undetectably small.","In science, 'conservation of energy' means energy never disappears. When we say 'save energy' at home, we mean don't waste useful energy by letting it turn into heat that's hard to use."],["Still unknown","The status of energy conservation in cosmology is subtle: photons lose energy as they redshift, and dark energy's total amount grows with volume. Whether this is described as 'non-conservation' or reformulated with gravitational energy (via pseudo-tensors) is a matter of convention; general relativity has no unique local gravitational energy density.\nSearches continue for violations of baryon number (proton decay), lepton number (neutrinoless double beta decay), CPT and Lorentz symmetry. A discovery would point to physics beyond the Standard Model and could explain the matter–antimatter asymmetry.","In the expanding universe, the usual rule about energy gets tricky, and scientists still debate how to think about it."]],"entropy":[["How we know","Carnot (1824) analyzed ideal heat engines; Clausius (1850–1865) formulated the second law and named entropy; Kelvin stated the impossibility of perpetual-motion machines of the second kind. Boltzmann (1877) gave the statistical interpretation, and Gibbs developed ensemble theory.\nThe second law has never been observed to fail macroscopically. At small scales, fluctuation theorems predicting transient entropy decreases have been confirmed in optical-trap and molecular experiments, and quantum thermodynamics experiments with superconducting qubits and trapped ions test the same laws in the quantum regime.","Scientists studying steam engines in the 1800s discovered that heat always flows from hot to cold on its own, and no engine can turn all its heat into work. Nobody has ever found a way around this rule."],["Common misconceptions","Entropy is not simply 'disorder'. Crystallization, phase separation of oil and water, and self-assembly of lipid bilayers are spontaneous increases of total entropy (including surroundings) that produce visible order.\nLife does not violate the second law. Organisms decrease their internal entropy by exporting more entropy to their environment, mostly as waste heat; Earth receives low-entropy sunlight (from a 5,772 K source) and radiates about 20 times as many lower-energy infrared photons to space.","Entropy isn't just 'messiness'. It's about how many ways things can be arranged. Living things stay organized by releasing heat, which spreads energy out into the world around them."],["Still unknown","Why the universe began in such a low-entropy state (the 'past hypothesis') is unexplained. Proposed answers include inflation (which itself may require special initial conditions), Penrose's Weyl curvature hypothesis and cyclic or multiverse scenarios.\nHow thermodynamic irreversibility emerges from time-symmetric microscopic laws is understood statistically, but foundational questions remain, including the definition of entropy for systems far from equilibrium, the thermalization of isolated quantum systems (the eigenstate thermalization hypothesis), and the microscopic origin of black hole entropy.","Scientists wonder why the universe started out so orderly. That early order is why time seems to move in one direction."]],"em":[["How we know","Coulomb (1785) measured the inverse-square electrostatic force; Ørsted (1820) found currents produce magnetism; Faraday (1831) discovered induction. Maxwell (1865) unified them and calculated c from electrical constants; Hertz (1887) generated and detected radio waves.\nPlanck's 1900 radiation law required quantized energy exchange, and the COBE/FIRAS CMB spectrum is the most precise blackbody ever measured. QED predicts the electron's magnetic moment to about 1 part in 10<sup>12</sup>, and the photon mass is bounded below 10<sup>−18</sup> eV/c².","Michael Faraday found that moving magnets create electricity. Later, James Clerk Maxwell figured out that light is a wave of electricity and magnetism. Scientists then made invisible waves like radio waves in the lab."],["Common misconceptions","Light, radio, X-rays and gamma rays are not different phenomena: they are electromagnetic waves (or photons) differing only in frequency.\nElectromagnetic waves do not need a medium. The 19th-century 'luminiferous aether' was disproved by the Michelson–Morley experiment and made unnecessary by special relativity. And a magnetic field is not independent of the electric field: they are components of one field tensor, mixing under changes of reference frame.","Not all radiation is dangerous. Radio waves and visible light are harmless. Only high-energy kinds like X-rays and strong ultraviolet can damage cells."],["Still unknown","Classical electromagnetism is complete within its domain, but several questions remain open: whether magnetic monopoles exist (predicted by grand unified theories; not found), the classical self-force problem for point charges, and the precise value of the photon mass upper limit.\nIn astrophysics, the origin of cosmic magnetic fields (microgauss in galaxies, nanogauss limits in voids) is unknown: they may come from dynamo amplification of tiny seed fields created in the early universe or in the first stars.","Electromagnetism is very well understood. One unsolved puzzle is how galaxies got their magnetic fields."]],"solar-system":[["How we know","Kant and Laplace proposed the nebular hypothesis in the 18th century. Its modern form rests on radiometric dating (Pb–Pb ages of CAIs at 4,567.3 ± 0.2 Myr; short-lived isotopes such as ²⁶Al giving relative ages to within about 0.1 Myr), on observations of hundreds of protoplanetary disks, and on direct sampling.\nALMA's 2014 image of HL Tau showed rings and gaps in a disk less than 1 Myr old, possibly carved by forming planets. Sample-return missions (Stardust, Hayabusa2, OSIRIS-REx) show that inner and outer Solar System material mixed: Stardust found high-temperature minerals in a comet that must have formed near the Sun.","Telescopes have photographed young stars surrounded by dusty disks with gaps where new planets are forming, just like our solar system once did. Scientists date the oldest meteorites to learn the solar system's age."],["Common misconceptions","The planets did not form where they are now, and orbits were not always stable or circular; migration and scattering rearranged the giant planets and depleted the asteroid belt by a factor of about 1,000.\nThe Solar System has no sharp edge at Pluto or the heliopause. The heliopause, crossed by Voyager 1 in 2012 at 121.6 AU and Voyager 2 in 2018 at 119 AU, marks where the solar wind meets interstellar plasma, but the Sun's gravity dominates out to the Oort cloud, about 1–2 light-years away.","The asteroid belt isn't packed with rocks like in movies. The rocks are very far apart. And Earth's seasons are caused by its tilt, not how close it is to the Sun."],["Still unknown","Open questions include how planetesimals formed so quickly, why Mars is so small, where Earth's water came from (asteroids, comets or nebular gas, with D/H ratios favoring carbonaceous asteroids), and the exact timing of the giant-planet instability.\nThe hypothesized Planet Nine, a body of 5–10 Earth masses at several hundred AU proposed to explain clustered orbits of distant Kuiper belt objects, has not been found. The Rubin Observatory's survey should either detect it or largely test the clustering claim.","Some scientists think there could be an undiscovered planet far beyond Neptune, called Planet Nine. Nobody has found it yet. Scientists also debate where Earth's water came from."]],"units":[["How we know","Bessel measured the first stellar parallax (61 Cygni, 0.314″) in 1838. Leavitt discovered the Cepheid period–luminosity relation in 1912, allowing Hubble to measure distances to other galaxies. Radar ranging to Venus (1961) fixed the astronomical unit, which the IAU redefined as an exact length in 2012.\nGaia's third data release (2022) provided parallaxes for about 1.5 billion sources, and its final release (DR4, expected December 2026) will improve them. JWST has re-observed Cepheids in supernova host galaxies, confirming Hubble Space Telescope photometry.","Hold up a finger and look at it with one eye, then the other: it seems to jump. Astronomers do the same with stars, looking from opposite sides of Earth's orbit. The smaller the jump, the farther the star."],["Common misconceptions","A light-year is a distance, not a time: about 9.46 × 10<sup>15</sup> m. A parsec (3.26 light-years) is the unit preferred in professional astronomy because it relates directly to parallax.\nSeeing a galaxy 'billions of light-years away' does not mean it is now at that light-travel distance. Because the universe expanded while the light traveled, its current distance is larger; for the most distant galaxies, light emitted 13.5 billion years ago comes from objects now about 34 billion light-years away.","A light-year measures how far, not how long. When you look at the Sun, you see it as it was about 8 minutes ago, and Andromeda galaxy as it was 2.5 million years ago."],["Still unknown","The largest current uncertainty is the calibration of the supernova rung: Cepheid and TRGB/JAGB calibrations yield H<sub>0</sub> values differing by about 3–4 km/s/Mpc, and whether this reflects systematics is debated.\nFuture improvements include Gaia DR4 and DR5 parallaxes, JWST and Roman observations of distance indicators, Rubin's large Type Ia supernova samples, and standard sirens with better-localized gravitational-wave events. Together, they aim for 1% H<sub>0</sub> measurements from independent methods.","Measuring distances in space is still tricky, and small mistakes can affect big questions like how fast the universe is expanding."]],"the-sun":[["How we know","Helioseismology from GONG, SOHO and SDO has mapped the interior since the 1990s, locating the convection zone base at 0.713 R<sub>☉</sub>. Solar neutrinos confirm core fusion reactions and their rates. The Daniel K. Inouye Solar Telescope (4 m aperture) resolves surface features as small as about 20 km.\nParker Solar Probe, launched in 2018, entered the corona in 2021 and in December 2024 passed about 6.1 million km from the surface at 192 km/s, the fastest and closest approach of any spacecraft. Solar Orbiter's tilted orbit gave the first images of the Sun's poles in 2025.","Scientists listen to the Sun! Sound waves bounce around inside it and make its surface ripple, and those ripples reveal what's inside. Spacecraft watch the Sun every day, and NASA's Parker Solar Probe has flown closer to it than anything humans have ever built."],["Common misconceptions","The Sun is not yellow in space; its spectrum peaks near 500 nm in blue-green, and the combined light appears white. Scattering of blue light in the atmosphere makes it look yellow or orange near the horizon.\nThe Sun will not become a black hole or explode as a supernova; its mass is far too low. In about 5 billion years it will become a red giant, expanding to around 1 AU and possibly engulfing Earth, then shed its envelope as a planetary nebula and end as a white dwarf of about 0.54 M<sub>☉</sub>.","The Sun is actually white, not yellow! It only looks yellow or orange because our air scatters some of its light. It's also not burning like a fire, and it's too small to ever explode."],["Still unknown","The coronal heating mechanism remains debated: wave heating versus nanoflare reconnection, and how energy is transported and dissipated in fine-scale structures. Parker Solar Probe's discovery of magnetic 'switchbacks' in the young solar wind, possibly rooted in supergranulation boundaries, is a key clue.\nForecasting solar cycle amplitude a decade in advance and predicting individual flares and CME magnetic orientations days ahead remain difficult. Long-term questions include the cause of grand minima such as the Maunder Minimum (1645–1715) and how much the faint young Sun (about 70% of today's luminosity) affected early Earth's climate.","Nobody knows exactly why the Sun's outer atmosphere is millions of degrees hotter than its surface. It's like a campfire where the air above is hotter than the flames!"]],"the-moon":[["How we know","Apollo (1969–1972) returned 382 kg of samples; Luna missions returned 0.3 kg; Chang'e 5 (2020) returned 1.7 kg of young basalt, and Chang'e 6 (2024) brought back the first farside samples, including about 2.8-billion-year-old basalt. Radiometric ages of samples from different units calibrated crater-density chronology.\nIsotopic similarities in oxygen, titanium and tungsten between the Moon and Earth's mantle support formation largely from terrestrial material. LCROSS (2009) detected about 5.6% water ice by mass in Cabeus crater's ejecta. Lunar laser ranging to Apollo and Lunokhod retroreflectors measures distance to millimeters.","Astronauts brought back 382 kg of Moon rocks, and robots from other countries brought more. Those rocks are chemically a lot like Earth's, a clue that the Moon came from Earth. Mirrors left by astronauts let scientists bounce lasers off the Moon to measure its distance super precisely."],["Common misconceptions","The Moon does rotate: once per orbit, which is why we see one face. There is no permanently 'dark side'; the farside receives as much sunlight as the nearside, and through libration we see about 59% of the surface over time.\nPhases are not caused by Earth's shadow; that happens only during lunar eclipses. The Moon also does not appear larger near the horizon in measurements: the 'Moon illusion' is perceptual, and the Moon is actually about 1.5% farther away when rising than when overhead.","Moon phases aren't caused by Earth's shadow. We're just seeing different amounts of the Moon's sunny side as it goes around us. And the 'dark side' of the Moon isn't dark. It gets sunlight too; we just never see it from Earth."],["Still unknown","The isotopic similarity between Earth and Moon challenges the canonical impact model, in which most lunar material should come from the impactor. Alternatives include a high-energy, fast-spinning impact, a synestia (a vaporized, rapidly rotating Earth–Moon structure), multiple impacts, or an impactor isotopically similar to Earth.\nThe origin of the nearside–farside asymmetry, the abundance and form of polar ice (a priority for Artemis and robotic missions), and the history of an early lunar dynamo whose remnant magnetism appears in some samples remain open. Artemis II flew four astronauts around the Moon in April 2026.","Scientists are still arguing about exactly how that giant crash worked. They also want to know how much frozen water hides in dark craters near the Moon's poles, which future astronauts could use."]],"rocky-planets":[["How we know","Mariner, Venera, Magellan, Viking and MESSENGER (which orbited Mercury from 2011 to 2015) characterized the planets' surfaces and atmospheres. InSight (2018–2022) measured marsquakes, finding a liquid iron-rich core; later analyses (2023–2024) suggest it is smaller and denser than first thought, beneath a molten silicate layer.\nPerseverance has cached samples in Jezero crater's ancient lake delta; a 2025 study described mineral textures in the 'Cheyava Falls' rock as a potential biosignature that could also have abiotic origins. BepiColombo is due to enter Mercury orbit in November 2026.","Robots have visited all four rocky planets. Soviet landers survived on Venus for up to about two hours before being crushed and cooked. Rovers like Curiosity and Perseverance are exploring Mars right now, and a lander called InSight even listened to 'marsquakes'."],["Common misconceptions","Venus is not hot only because it is close to the Sun. Its high albedo (about 0.77) means it absorbs less sunlight than Earth; its surface temperature is due to its massive CO<sub>2</sub> greenhouse.\nMars is not red because of rust in a simple sense; its surface dust contains ferric iron oxides, and some evidence suggests hydrated forms such as ferrihydrite. Mars has not been dry throughout its history: valley networks, deltas, clay minerals and sulfates show liquid water was stable at the surface around 3.5–4 Gyr ago.","The hottest planet isn't Mercury, the closest to the Sun. It's Venus, because its thick air traps heat like a greenhouse; it's hot enough to melt lead! And Mars is red because its dust is rusty, not because it's hot."],["Still unknown","Whether Venus ever had oceans, and whether it is volcanically active today, are central questions; Magellan radar images show possible recent surface changes, and ESA's EnVision is planned for the 2030s. The 2020 claim of phosphine in Venus's clouds remains contested.\nHow early Mars stayed warm enough for liquid water despite a fainter young Sun is unresolved. Why Earth alone developed plate tectonics, and whether it is common on larger rocky exoplanets, is also debated.","Was there ever life on Mars? Rovers have found clues that Mars once had lakes and rivers, but no proof of life yet. Scientists also wonder whether Venus once had oceans before it turned into a hot oven."]],"giant-planets":[["How we know","Pioneer and Voyager made the first flybys in the 1970s and 1980s; Voyager 2 is still the only spacecraft to visit Uranus (1986) and Neptune (1989). Galileo's probe sampled Jupiter's atmosphere in 1995. Cassini orbited Saturn from 2004 to 2017, and its 'Grand Finale' orbits measured the rings' mass, suggesting they could be geologically young, a conclusion now debated.\nJuno, orbiting Jupiter since 2016, revealed a dilute core, deep jets and polar cyclone clusters. JWST images all four giants in the infrared. Saturn's known moon count passed 270 in 2025 after a large batch of small irregular moons was confirmed.","Space probes like Voyager, Galileo, Cassini and Juno have flown past or orbited the giant planets. Only one spacecraft, Voyager 2, has ever visited Uranus and Neptune. Neptune was even found using math before anyone saw it!"],["Common misconceptions","Gas giants are not entirely gaseous with no solid interior; much of their interiors are dense fluids. There is no surface to land on, but the transition from gas to fluid is continuous rather than a sharp boundary.\nIce giants are not made of solid ice. 'Ices' is a planetary-science term for volatile compounds (H<sub>2</sub>O, NH<sub>3</sub>, CH<sub>4</sub>) by composition; in the interior they exist as hot, dense fluids at thousands of kelvin.","Saturn isn't the only planet with rings; all four giants have them, Saturn's are just the brightest. And Jupiter isn't almost a star: it would need to be about 80 times heavier to start fusion."],["Still unknown","The core masses and formation histories of the giants, the age of Saturn's rings, and why Uranus emits so little internal heat while Neptune emits substantial heat are unresolved. A 2024 reanalysis found that Voyager 2 encountered Uranus during an unusual solar-wind compression, so its magnetosphere may not be as atypical as once thought.\nA Uranus Orbiter and Probe, the top-priority flagship mission in the U.S. planetary decadal survey, would measure its interior, composition and seasonal atmosphere, but has not yet been scheduled.","Why does Uranus spin on its side? Maybe something huge smashed into it long ago. Scientists want to send a new spacecraft to Uranus to find out."]],"ocean-moons":[["How we know","Galileo's magnetometer (1996–2003) revealed induced fields at Europa and Callisto. Cassini discovered Enceladus's south-polar plumes in 2005, flew through them repeatedly and measured gravity and libration showing a global ocean. Cassini–Huygens found Titan's methane cycle, lakes and evidence for a deep water ocean.\nHST and JWST observations suggest possible plume activity at Europa and found CO<sub>2</sub> on its surface concentrated in geologically young chaos terrain (2023), probably sourced from the ocean. Europa Clipper (launched October 2024) and ESA's JUICE (launched 2023) are en route.","The Cassini spacecraft spotted giant geysers spraying water from Enceladus and flew right through them, tasting salt and other chemicals from the ocean below. At Europa, measurements of magnetism revealed a salty ocean under the ice. Two new spacecraft are on their way to Jupiter's moons now."],["Common misconceptions","Ocean moons are not warm worlds with surface water; their surfaces are among the coldest in the Solar System (Europa about 100 K, Enceladus about 75 K), and ice shells range from a few to over 100 km thick.\nTitan's surface lakes are liquid methane and ethane, not water; its water ocean is deep below the crust. Evidence of water, energy and organics makes an ocean potentially habitable, not inhabited.","Europa's hidden ocean probably has about twice as much water as all of Earth's oceans put together! But having water doesn't mean there's definitely life; it just makes it a good place to look. And Titan's surface lakes are liquid methane, not water."],["Still unknown","Ice shell thicknesses, ocean salinity and pH, the degree of hydrothermal activity at seafloors and the efficiency of exchange between surface and ocean are uncertain. Whether Enceladus's ocean is young (tens of millions of years) or ancient affects the time available for life.\nEuropa Clipper will measure the ice shell with radar, map composition and test for an ocean via magnetic induction. NASA's Dragonfly rotorcraft, launching in 2028 to arrive at Titan in 2034, will study prebiotic chemistry. An Enceladus orbiter–lander, recommended by the U.S. decadal survey, could sample plumes directly for biosignatures.","Is anything living in these hidden oceans? Nobody knows yet. Future missions will study Europa closely and send a flying drone called Dragonfly to explore Titan."]],"small-bodies":[["How we know","Ceres was discovered in 1801. Spacecraft have since visited dozens of small bodies: Rosetta orbited comet 67P (2014–2016) and landed Philae; Dawn orbited Vesta and Ceres. Hayabusa2 returned 5.4 g from Ryugu (2020) and OSIRIS-REx 121.6 g from Bennu (2023). Bennu's samples contain 14 of the 20 protein amino acids, all five nucleobases of DNA and RNA, and evaporite salts indicating past brines.\nDART's 2022 impact shortened Dimorphos's orbit around Didymos by about 33 minutes, much more than momentum transfer alone, because ejecta added thrust (momentum enhancement factor β ≈ 3.6). ESA's Hera arrives in late 2026 to survey the result. Interstellar visitors 1I/'Oumuamua (2017), 2I/Borisov (2019) and comet 3I/ATLAS (discovered July 2025) sample other planetary systems.","Spacecraft have landed on a comet and grabbed samples from asteroids and brought them home! Samples from asteroid Bennu contain ingredients used in DNA. In 2022, NASA even crashed a spacecraft into a small asteroid on purpose to see if we could push one off course. It worked!"],["Common misconceptions","The asteroid belt is not a dense field of rocks; average spacing between asteroids larger than 1 km is about a million kilometers, and spacecraft cross it without special maneuvers.\nComet tails do not trail behind the comet along its orbit; they point away from the Sun, so a comet leaving the inner Solar System travels tail-first. And asteroids and comets are not fully distinct categories: 'active asteroids' and dormant comets blur the boundary.","Shooting stars aren't stars at all! They're tiny grains of space dust, often smaller than a grain of sand, burning up in our air. And a comet's tail always points away from the Sun, not behind the comet."],["Still unknown","The origin of the main belt's mixture of inner (S-type) and outer (C-type) material, the delivery mechanism for Earth's water and organics, and the internal structure of rubble-pile asteroids are active research areas. Interstellar objects' origins, including 'Oumuamua's nongravitational acceleration without visible coma, are debated.\nThe Rubin Observatory's LSST and NASA's planned NEO Surveyor infrared telescope (launch planned for 2027) are expected to find most remaining hazardous objects larger than 140 m. OSIRIS-APEX will study Apophis after its close Earth flyby in April 2029, and JAXA's Hayabusa2 extended mission targets asteroid 1998 KY26 in 2031.","Did comets or asteroids bring Earth its water? Scientists are still debating. New telescopes are also searching the sky to find any asteroids that could someday come too close to Earth."]],"origin-of-life":[["How we know","Pasteur's experiments (1859) refuted spontaneous generation of microbes, reframing the question as the gradual chemical origin of the first cells; Oparin and Haldane proposed a 'primordial soup' in the 1920s. Detrital zircons show liquid water by 4.4 Gyr ago; stromatolites in the Pilbara (3.48 Gyr) and isotopic signatures provide early evidence of life, while claimed older traces (3.7–4.1 Gyr) are debated.\nA 2024 molecular-clock analysis estimated LUCA at about 4.2 Gyr, with a genome encoding roughly 2,600 proteins, an anaerobic, H<sub>2</sub>-dependent metabolism and an early immune system, implying that life emerged quickly after Earth became habitable.","The oldest fossils of life are rocky layers built by tiny microbes about 3.5 billion years ago. In a famous 1952 experiment, scientists zapped a jar of gases with sparks like lightning, and it made amino acids, building blocks of life! Space rocks contain some of these ingredients too."],["Common misconceptions","Abiogenesis is distinct from evolution. Darwinian evolution explains the diversification of life once heritable replication exists; it does not address the origin of the first replicators.\nThe origin of life is not usually thought to require a single improbable event. Most researchers expect a sequence of chemically driven steps in which selection-like processes acted even before true replication. Panspermia, the transfer of life between planets, would relocate rather than solve the problem.","Scientists haven't made life from scratch in a lab, only some of its ingredients. Also, how life started and how it changed afterward (evolution) are two different questions."],["Still unknown","Key unknowns include how RNA (or a precursor polymer) was assembled and replicated before enzymes, how replication was coupled to metabolism and compartments, the source of biological homochirality, and the geochemical setting. Whether a different chemistry, such as alternative backbones or bases, could support life is under study.\nObservationally, finding an independent origin of life, such as a 'second genesis' on Mars or in an icy-moon ocean with distinct biochemistry, would show that abiogenesis is common. Experimental programs aim to build a self-replicating, evolving protocell from scratch.","Pretty much everything about how life started is still a mystery. Where did it happen? What came first? Does life start easily, or was Earth just lucky? Finding life on another world would help answer that."]],"extremophiles":[["How we know","Brock isolated Thermus aquaticus from Yellowstone hot springs in 1969. Woese and Fox identified archaea as a separate domain in 1977 using ribosomal RNA sequences. The same year, Alvin found hydrothermal vent communities on the Galápagos Rift.\nDeep drilling has recovered living microbes kilometers below land and seafloor, including in rocks over 100 million years old beneath the Pacific seafloor (2020). Experiments in low-Earth orbit (EXPOSE, Tanpopo) showed some bacteria, lichens and tardigrades survive months to years of space exposure.","Scientists found microbes living in Yellowstone's boiling hot springs. In 1977, a deep-sea submarine discovered whole communities of creatures living around hot vents on the ocean floor in total darkness. And in 2007, tardigrades survived 10 days in open space!"],["Common misconceptions","Extremophiles are not necessarily 'primitive'. They have specialized, evolved adaptations, and extremophiles belong to many lineages, including some animals and fungi.\nSurviving an extreme is not the same as growing in it. Tardigrades endure harsh conditions only in a dormant state and do not reproduce in space; claims that they are 'indestructible' overstate laboratory results.","Tardigrades aren't invincible. They survive tough conditions by drying up and going into a deep 'sleep'. And to many extremophiles, our 'normal' conditions would be deadly!"],["Still unknown","The true limits of life are not known, especially for combinations of extremes, as on Mars (cold, dry, radiation and oxidizing perchlorates together). How much biomass exists in the deep subsurface (estimates range widely, perhaps 10–20% of Earth's total) and what limits life at such low energy fluxes are debated.\nOther open questions are whether the last universal common ancestor was a thermophile, and whether thermophily reflects life's origin in hot environments or a later bottleneck such as surviving large impacts.","How hot, cold or dry is too much for life? Could tough microbes like these survive under Mars's surface or in the oceans of icy moons? Scientists are still exploring."]],"habitable-worlds":[["How we know","Kasting, Whitmire and Reynolds (1993) and Kopparapu et al. (2013) defined widely used habitable-zone limits. Kepler's statistics suggest that Earth-sized planets in the habitable zone are common, though estimates for Sun-like stars vary widely, from about 5% to about 50%.\nNearby examples include Proxima Centauri b (1.3 pc) and the TRAPPIST-1 system, with seven roughly Earth-sized planets, three or four in the habitable zone. JWST thermal-emission measurements of TRAPPIST-1 b and c show no thick CO<sub>2</sub> atmosphere, and a dedicated 500-hour 'Rocky Worlds' program is surveying nearby M-dwarf rocky planets for atmospheres.","Computer models of climate show where water could stay liquid around a star. Scientists even tested their methods on Earth by looking at it from a faraway spacecraft: Earth's light showed signs of oxygen, methane and plants. Now telescopes like JWST are checking the air of planets around other stars."],["Common misconceptions","Being in the habitable zone does not make a planet habitable; the Moon lies in the Sun's habitable zone. The habitable zone is a first filter based on stellar flux alone.\nA planet outside the habitable zone is not necessarily uninhabitable. Subsurface oceans in icy moons, sustained by tidal heat, and possibly thick hydrogen atmospheres on distant planets can maintain liquid water far beyond the classical outer edge.","Being in the 'Goldilocks zone' doesn't mean a planet has life, or even water. Our Moon is in the zone but has no air! And finding oxygen isn't a sure sign of life; sometimes it forms without living things."],["Still unknown","The frequency of Earth analogs around Sun-like stars, whether M-dwarf planets retain atmospheres, the role of plate tectonics and magnetic fields, and how to rule out false-positive biosignatures are all open.\nPlanned instruments, including the Extremely Large Telescope's planned planetary spectrograph, the Habitable Worlds Observatory (targeting launch in the 2040s) and the proposed LIFE interferometer, aim to search dozens of nearby temperate rocky planets for atmospheric biosignatures.","Can planets around small red stars keep their air when their star blasts out flares? How many Earth-like planets are out there? Nobody knows yet, and no signs of life have been confirmed on any other planet."]],"seti":[["How we know","Cocconi and Morrison (1959) proposed searching near the 1,420 MHz hydrogen line; Frank Drake's Project Ozma (1960) searched two nearby stars. The 1977 'Wow!' signal at Ohio State was never repeated; a 2024 reanalysis suggested a natural brightening of a hydrogen cloud, perhaps maser-like, as a possible cause.\nBreakthrough Listen (since 2016) has surveyed thousands of nearby stars and the Galactic plane across 1–12 GHz, using machine learning to filter radio-frequency interference. The 2020 candidate BLC1 from the direction of Proxima Centauri was traced to terrestrial interference. China's FAST telescope and MeerKAT, through commensal observing, extend sensitivity.","In 1960, astronomer Frank Drake first pointed a radio telescope at two nearby stars to listen for aliens. Today, huge telescopes scan millions of stars. In 1977, a strange signal nicknamed the 'Wow! signal' was detected, but it never came back. One mystery signal turned out to be a microwave oven in the observatory's kitchen!"],["Common misconceptions","SETI has not 'searched the sky' thoroughly. The search volume, sometimes pictured as a 'cosmic haystack' of frequency, direction, sensitivity, time, polarization and modulation, has been sampled by perhaps a fraction comparable to a small glass of water from Earth's oceans.\nUnexplained signals are not evidence of aliens. Almost all candidate signals are terrestrial interference, which is why SETI requires repeated detection from a fixed sky position across independent instruments.","We've barely started looking. One scientist compared our search so far to scooping a hot tub's worth of water out of Earth's oceans to check for fish. And the Drake equation doesn't have a 'right answer'; many of its numbers are still guesses."],["Still unknown","The Fermi paradox, the tension between the apparent ease of colonizing the galaxy within a few million years and the absence of evidence, has many proposed resolutions: life or intelligence is rare, civilizations are short-lived, they are not detectable with our methods, or we have not looked enough.\nFuture radio facilities, especially the Square Kilometre Array (under construction in Australia and South Africa), and next-generation optical and infrared surveys, will push sensitivity by orders of magnitude, allowing searches of millions of stars for transmitters comparable to Earth's strongest radars.","How often does life start? How often does it become smart? How long do civilizations last? Nobody knows, which is why the Fermi paradox is still one of the biggest puzzles about our place in the universe."]],"telescopes":[["History","Lipperhey sought a patent in 1608, and Galileo's 1609–1610 observations revealed Jupiter's moons and the phases of Venus. Newton's 1668 reflector avoided chromatic aberration. Later landmarks include the 5 m Hale (1948), the segmented 10 m Kecks (1993 and 1996), Hubble (1990) and JWST (launched 2021), with an 18-segment 6.5 m beryllium mirror at Sun–Earth L2.\nRadio astronomy began with Jansky (1932); aperture synthesis (Ryle, 1974 Nobel Prize) led to the VLA and ALMA. CCDs, invented in 1969 (2009 Nobel Prize), replaced photographic plates, raising quantum efficiency from about 1% to over 90%.","Galileo pointed one of the first telescopes at the sky in 1609 and discovered moons orbiting Jupiter. Isaac Newton invented a telescope that used a mirror instead of a lens. Today's telescopes have mirrors many meters across, and the James Webb Space Telescope, launched in 2021, has a giant gold mirror 6.5 meters wide."],["Common misconceptions","Magnification is not a telescope's key property; any image can be magnified by an eyepiece or software. What matters is collected light (sensitivity) and resolution, both set by aperture, and for ground telescopes, the atmosphere.\nSpace telescopes are not useful because they are closer to stars; the gain in distance is negligible. They avoid atmospheric blurring, absorption (of UV, X-rays and much of the infrared) and thermal emission from the warm atmosphere and ground.","Telescopes aren't mainly about zooming in. What matters most is how much light they collect and how sharp the picture is. And space telescopes don't go to space to get closer to stars; they go to get above our blurry, light-blocking air."],["What's next","The ESO Extremely Large Telescope (39 m, Chile) is under construction with first light planned for 2029; the Giant Magellan Telescope (25.4 m) and Thirty Meter Telescope depend on funding decisions. The Rubin Observatory began its 10-year LSST in 2025, producing about 20 TB of data per night. NASA's Nancy Grace Roman Space Telescope launched in August 2026 to survey dark energy, microlensing exoplanets and coronagraphic imaging.\nFuture concepts include the Habitable Worlds Observatory, next-generation VLBI including space baselines, and the Square Kilometre Array, whose first image was released in 2025.","Giant new telescopes are being built, including one in Chile with a mirror 39 meters wide, about as long as four school buses! A new observatory called Rubin photographs the whole southern sky every few nights."]],"spectroscopy":[["History","Newton dispersed sunlight with a prism (1666); Fraunhofer catalogued hundreds of solar absorption lines (1814). Bunsen and Kirchhoff (1859) identified them with laboratory elements; Lockyer and Janssen found helium in the solar spectrum (1868). Payne (1925) derived stellar abundances, and Slipher's galaxy redshifts underpinned Hubble's law.\nModern milestones include radial-velocity detection of exoplanets, quasar absorption-line studies of the intergalactic medium and large spectroscopic surveys such as SDSS and DESI, which has measured tens of millions of redshifts.","Isaac Newton first split sunlight into a rainbow with a prism. Later, scientists noticed dark lines in the Sun's rainbow and figured out each element makes its own lines. In 1925, astronomer Cecilia Payne-Gaposchkin used this to discover that stars are made mostly of hydrogen and helium, something nobody believed at first!"],["Common misconceptions","A spectrum's colors are not what produce the information; the patterns of lines and continuum shape do. Most astronomical spectra are recorded in wavelength bands far outside the visible.\nRedshift does not always indicate motion through space. Cosmological redshift arises from expansion, and gravitational redshift arises from escaping a gravitational potential (about 2 × 10<sup>−6</sup> for the Sun). For distant galaxies, interpreting z as a Doppler velocity is only an approximation.","A 'redshifted' galaxy doesn't actually look red. Its whole barcode of lines just slides toward longer waves. Some galaxies are shifted so much that their light becomes infrared, invisible to our eyes."],["What's next","Upcoming instruments include high-resolution spectrographs on extremely large telescopes, aiming to detect O<sub>2</sub> in nearby rocky exoplanet atmospheres; next-generation surveys (4MOST, PFS, WEAVE); and ANDES, which may measure the 'redshift drift' of quasar absorption lines, a direct real-time measurement of cosmic expansion over decades.\nLaboratory spectroscopy needs to keep pace: many molecular line lists, especially at high temperatures, are incomplete, limiting interpretation of exoplanet and brown-dwarf spectra.","Scientists are building super-precise instruments to find Earth-like planets by their stars' tiny wobbles, and to read the air of faraway planets looking for signs of life."]],"night-sky":[["History","Babylonian astronomers recorded planetary positions and eclipse cycles; Hipparchus catalogued about 850 stars and discovered precession (about 130 BCE); Ptolemy's Almagest listed 48 constellations. The IAU fixed 88 constellations with defined boundaries in 1922–1930.\nModern astrometry has reached microarcsecond precision: Hipparcos (1989–1993) measured about 118,000 stars, and Gaia has measured positions, parallaxes and proper motions for nearly 1.8 billion. The International Celestial Reference Frame is now defined by VLBI positions of thousands of quasars.","People all over the world used the stars for calendars, stories and finding their way. Polynesian sailors crossed the whole Pacific Ocean by following the stars! Today, astronomers officially divide the sky into 88 constellations."],["Common misconceptions","Polaris is not the brightest star in the sky; it ranks about 48th (Sirius is brightest). Its value lies in its position near the north celestial pole.\nThe stars in a constellation are generally not physically associated. They are projected along the line of sight at very different distances. The zodiac also does not align with astrological dates anymore: because of precession, the Sun now passes through each zodiac constellation about a month later than the traditional dates and also crosses Ophiuchus.","The stars in a constellation usually aren't close together at all; some are way farther away than others. And the North Star isn't the brightest star; Sirius is. The North Star is special because it barely moves while the others circle around it."],["Protecting dark skies","Satellite constellations increasingly affect the sky. More than 10,000 active satellites now orbit Earth, most of them in Starlink's constellation, producing streaks in survey images and radio interference. Mitigation includes darkened satellites, scheduling and software masking, but the long-term effect on astronomy is uncertain.\nA 2023 study using citizen-science observations found that the visible night sky brightened by about 10% per year from 2011 to 2022, much faster than satellite measurements had suggested, because satellites underestimate blue LED light. Dark-sky reserves and lighting ordinances aim to slow this trend.","Light from cities is washing out the stars, and it's getting brighter every year. Many people have never seen the Milky Way. Dark-sky parks and better outdoor lights can help bring the stars back."]],"multi-messenger":[["Key moments","Hess discovered cosmic rays in 1912 using balloon-borne electrometers. SN 1987A was the first multi-messenger source, with about two dozen neutrinos detected hours before its optical discovery. On 17 August 2017, LIGO and Virgo detected GW170817; Fermi and INTEGRAL detected a gamma-ray burst 1.7 s later; and about 70 observatories followed the kilonova AT2017gfo in NGC 4993.\nIn 2017, IceCube neutrino IceCube-170922A coincided with a flaring blazar, TXS 0506+056. IceCube later found evidence (4.2σ) for neutrinos from the Seyfert galaxy NGC 1068 (2022) and detected the Galactic plane in neutrinos (2023). KM3NeT reported an event of about 220 PeV in 2025, the most energetic neutrino yet observed.","In 2017, gravitational wave detectors 'heard' two neutron stars crash together. Less than 2 seconds later, a space telescope caught a flash of gamma rays, and soon telescopes all over the world saw the explosion. About 70 observatories joined in!"],["Common misconceptions","Cosmic rays are not rays of light; they are charged particles, mostly protons and nuclei, whose name dates from before their nature was known. Their arrival directions do not point back to sources, except possibly at the highest energies.\nMulti-messenger astronomy does not require all messengers for every event. Most gravitational-wave detections (binary black holes) have no confirmed electromagnetic counterpart, and most IceCube neutrinos remain unassociated with sources.","Cosmic rays aren't really rays; they're tiny particles flying super fast. Their paths get bent by magnetic fields in space, so it's hard to tell where they came from."],["Still unknown","The sources of most high-energy astrophysical neutrinos and of ultra-high-energy cosmic rays are unknown. Auger's dipole anisotropy above 8 EeV shows an extragalactic origin; starburst galaxies and AGN are candidates, and the 2021 'Amaterasu' particle at about 2.4 × 10<sup>20</sup> eV came from the direction of the nearly empty Local Void.\nFuture facilities include IceCube-Gen2, KM3NeT's full build-out, the Cherenkov Telescope Array Observatory (CTAO), upgraded Auger (AugerPrime), LISA in the 2030s, and next-generation gravitational-wave detectors with more frequent neutron star merger detections.","The most powerful cosmic ray particles carry as much energy as a fast-thrown baseball, packed into a single particle smaller than an atom. Nobody knows what in space can launch them that fast!"]],"rockets":[["History","Tsiolkovsky derived the rocket equation in 1903; Goddard launched the first liquid-fueled rocket in 1926. The V-2 (1944) was the first rocket to reach space. Sputnik 1 (1957) reached orbit on an R-7; Saturn V (1967–1973), with 35 MN of liftoff thrust, launched Apollo.\nSpaceX's Falcon 9 first landed a booster in 2015, and booster reuse is now routine, with individual boosters flying dozens of times. Very large, fully reusable launchers, such as SpaceX's Starship, are in flight testing.","In 1926, Robert Goddard launched the first liquid-fuel rocket; it flew for 2.5 seconds. Just 43 years later, the giant Saturn V rocket carried astronauts to the Moon. Today, some rockets land themselves back on Earth so they can be reused."],["Common misconceptions","Rockets do not push against air or the ground; they work best in vacuum, where there is no back pressure on the nozzle. Thrust comes from momentum carried away by exhaust.\nReaching orbit is mostly about going sideways fast, not going high. The ISS orbits at about 400 km altitude but at 7.66 km/s; reaching that altitude without horizontal speed would require only about 2.8 km/s, after which a rocket would simply fall back.","Rockets don't push against the air or the ground. They push against their own exhaust, which is why they work even better in space! And getting to space is easy compared with staying there: you have to go super fast sideways so you keep falling around Earth instead of back down."],["What's next","Sustainable lunar and Mars exploration requires in-orbit refueling, which remains to be demonstrated at scale; cryogenic propellant transfer and storage without boil-off are key technologies. Nuclear thermal propulsion could double chemical I<sub>sp</sub> to about 900 s, though recent U.S. demonstration programs have been scaled back.\nOther concepts, including laser-pushed light sails for interstellar probes (Breakthrough Starshot) and fusion propulsion, are long-term research topics.","Engineers are building giant reusable rockets to go to the Moon and Mars. Ion engines, which push with electrified gas, are super efficient for long trips. Someday, laser-pushed light sails might send tiny probes toward other stars."]],"missions":[["Firsts","Sputnik 1 (1957); Luna 2, first impact on the Moon (1959); Vostok 1 with Yuri Gagarin (1961); Mariner 2, first successful planetary flyby (Venus, 1962); Apollo 11, first humans on the Moon (1969); Venera 7, first landing on another planet (1970); Viking 1, first long-lived Mars lander (1976); Voyager 2, the only visits to Uranus and Neptune (1986, 1989).\nHuygens landed on Titan (2005); Voyager 1 crossed the heliopause (2012); Rosetta's Philae landed on a comet (2014); New Horizons flew past Pluto (2015) and Arrokoth (2019); Chang'e 4 made the first farside lunar landing (2019) and Chang'e 6 the first farside sample return (2024); Ingenuity made the first powered flight on another planet (2021).","First satellite: Sputnik, 1957. First person in space: Yuri Gagarin, 1961. First people on the Moon: Apollo 11, 1969. First landing on another planet: Venus, 1970. First landing on a comet: 2014. First robot on the Moon's far side: 2019."],["Common misconceptions","Voyager 1 has not left the Solar System in every sense. It crossed the heliopause, but the Sun's gravity dominates out to the Oort cloud, which it will take tens of thousands of years to traverse. It will reach a distance of about one light-day from Earth around late 2026.\nSpace is not 'zero gravity' at orbital altitudes; the ISS experiences about 90% of surface gravity. Microgravity arises because the station and crew are in continuous free fall.","Voyager 1 left the Sun's 'bubble' in 2012, but it would take tens of thousands of years to get past the far-off cloud of comets around our solar system. And the Space Station is only about 400 km up, about four hours' drive if you could drive straight up!"],["What's next","Artemis II flew four astronauts around the Moon in April 2026. Later Artemis missions aim to land crews near the lunar south pole, and China plans crewed lunar landings by 2030. Europa Clipper (arriving 2030) and JUICE (2031) will survey Jupiter's ocean moons, Dragonfly will fly on Titan from 2034, and the Psyche spacecraft reaches its metal-rich asteroid in 2029.\nThe ISS is planned to be deorbited around 2030–2031, with commercial stations intended to follow. Mars Sample Return's architecture and timeline remain uncertain after cost overruns, and China's Tianwen-3 aims to return Mars samples around 2031.","In April 2026, four astronauts flew around the Moon on Artemis II, the first people to go there since 1972. Next up is landing astronauts again, and China plans to land astronauts there too. Robots are on their way to Jupiter's icy moons, and a flying drone will explore Titan."]],"interplanetary":[["History","Hohmann published the minimum-energy transfer in 1925. Gravity assists were developed by Minovitch and others in the early 1960s and first used by Mariner 10 at Venus en route to Mercury (1974). The Voyagers exploited a 176-year planetary alignment for a Grand Tour of the outer planets.\nParker Solar Probe used seven Venus flybys to reach 6.1 million km from the Sun at 192 km/s. BepiColombo, with nine gravity assists and electric propulsion, is due to enter Mercury orbit in November 2026. Mars Global Surveyor, Mars Reconnaissance Orbiter, Venus Express and the Trace Gas Orbiter used aerobraking.","Back in 1925, engineer Walter Hohmann figured out the cheapest path between planets. In the 1970s, a rare lineup of the outer planets, happening only about once every 175 years, let Voyager 2 slingshot from Jupiter to Saturn to Uranus to Neptune."],["Common misconceptions","Spacecraft do not fly directly toward a planet's current position. They aim for where the target will be at arrival, along a curved heliocentric orbit, which is why launch windows exist.\nGravity assists do not violate energy conservation. Energy is conserved in the planet's frame; in the Sun's frame, the spacecraft gains energy and the planet loses an equal amount, which for a planet is negligible.","Flying toward the Sun is actually harder than flying away! A spacecraft starts with Earth's speed of 30 km/s around the Sun and must lose much of it to fall inward. That's why missions to Mercury take years of looping around planets."],["What's next","The current Earth–Mars launch window opens in late 2026; the next follows in early 2029. Future priorities include reliable crewed transportation to Mars (requiring in-orbit refueling and entry, descent and landing for tens of tonnes), ESA's Hera arriving at the Didymos system in late 2026, and missions to Uranus and Enceladus that would rely on Jupiter or Venus gravity assists.\nLonger term, solar sails, high-power electric propulsion and nuclear propulsion could shorten trips to the outer Solar System and enable missions such as a solar gravitational lens telescope at about 550 AU.","Engineers are working on faster rockets so astronauts could get to Mars in less time. New missions use super-efficient ion engines and loop around several planets to save fuel."]],"radioactivity":[["History","Becquerel discovered radioactivity in uranium salts in 1896; Marie and Pierre Curie isolated polonium and radium (1898). Rutherford classified alpha, beta and gamma rays and, with Soddy (1902), showed that radioactivity transmutes elements. Gamow (1928) explained alpha decay by tunneling, and Fermi's 1934 theory described beta decay.\nWu's 1956 cobalt-60 experiment showed parity violation in beta decay. Measurements of half-lives continue to improve; the longest directly measured, the double electron capture of ¹²⁴Xe (1.8 × 10<sup>22</sup> yr), was observed by XENON1T in 2019.","In 1896, Henri Becquerel noticed that uranium left marks on photo film, even in the dark. Marie Curie studied this 'radioactivity', discovered two new elements and became the first person to win Nobel Prizes in two different sciences."],["Common misconceptions","'Half-life' does not mean that half of a sample's radiation remains forever or that all of it disappears after two half-lives. After n half-lives, a fraction 2<sup>−n</sup> remains; after 10 half-lives, about 0.1%.\nExposure to radiation does not make objects or people radioactive, except for neutron irradiation, which can activate nuclei. And not all radiation is equally harmful: the effective dose in sieverts weights energy absorbed by radiation type and tissue sensitivity.","Radiation is all around us naturally, from rocks, the air and even bananas, in small, safe amounts. And after two half-lives a radioactive sample isn't gone; a quarter of it is still left."],["Open questions","The neutron lifetime puzzle, with beam and bottle measurements differing by about 9 seconds (about 4σ), is unresolved. Neutrinoless double beta decay, which would show neutrinos are Majorana particles, has not been observed, with half-life limits above 10<sup>26</sup> years.\nThe limits of nuclear stability, including the neutron drip line and the predicted 'island of stability' of superheavy nuclei near Z = 114–126 and N = 184, are being explored at facilities such as FRIB (USA, operating since 2022) and RIKEN. The response of human health to very low doses remains debated.","Some atoms decay so slowly their half-life is a trillion times the age of the universe! Scientists are also puzzling over why two ways of timing how long a free neutron lasts give different answers."]],"fission":[["History","Hahn and Strassmann identified barium among neutron-irradiated uranium products in December 1938; Meitner and Frisch explained it as fission and estimated the 200 MeV release. Fermi's team achieved the first controlled chain reaction (Chicago Pile-1) on 2 December 1942. The first grid-connected power plant began operating at Obninsk in 1954.\nAccidents at Three Mile Island (1979), Chernobyl (1986) and Fukushima (2011) shaped safety rules. Natural reactors operated at Oklo, Gabon, about 2 billion years ago, when ²³⁵U was about 3.7% of uranium.","Scientists discovered fission in 1938. In 1942, the first chain reaction was started under the stands of a stadium in Chicago. Amazingly, about 2 billion years ago nature made its own nuclear reactors in uranium rocks in Gabon, Africa!"],["Common misconceptions","A power reactor cannot explode like a nuclear weapon. Low-enriched fuel and the slow, moderated neutron spectrum make a supercritical prompt assembly impossible; reactor accidents involve overheating, steam or hydrogen explosions and radioactive releases.\nMost spent fuel's long-term hazard comes from a small fraction of actinides and fission products; volume is small (about 10,000 tonnes per year globally), and it is solid and stored rather than released.","A nuclear power plant can't blow up like a nuclear bomb; its fuel isn't concentrated enough. And the big clouds coming out of cooling towers are just water vapor, like steam from a kettle."],["Challenges and what's next","Long-term disposal of spent fuel, which stays highly radioactive for thousands of years, remains unresolved in most countries; in October 2026, Finland granted Onkalo the world's first operating license for a deep geological repository.\nSmall modular reactors (for example, BWRX-300 units under construction in Ontario), advanced designs using sodium, molten-salt or helium coolants, accident-tolerant fuels and high-assay low-enriched uranium aim to reduce cost and improve safety. Construction costs and timelines for large reactors remain a major obstacle in Western countries.","The biggest challenge is what to do with used fuel, which stays dangerous for thousands of years. In 2026, Finland approved the world's first deep underground storage for it. Engineers are also designing smaller, safer reactors."]],"fusion-energy":[["History","Thermonuclear reactions were identified as stellar power by Bethe (1939). Soviet tokamaks (T-3, 1968) achieved temperatures far above other designs, triggering worldwide adoption. JET and TFTR produced substantial D–T fusion power in the 1990s; in its final experiments in 2023, JET set a fusion energy record of 69 MJ over 5 seconds.\nOn 5 December 2022, NIF produced 3.15 MJ of fusion energy from 2.05 MJ of laser light, the first laboratory target gain above 1; later shots have exceeded a gain of 4. Long-duration records include about 1,066 s in China's EAST (H-mode, January 2025) and 1,337 s in France's WEST (February 2025).","Scientists have worked on fusion power since the 1950s. In December 2022, the National Ignition Facility in California fired 192 giant lasers at a tiny fuel pellet and got out more energy than the lasers put in, a historic first!"],["Common misconceptions","Fusion reactors cannot have a runaway chain reaction. Plasma must be actively maintained; any disturbance cools it and stops fusion within seconds, and the fuel inventory at any moment is a few grams.\nNIF's 2022 result was not net energy for the facility: the lasers consumed about 300 MJ of electricity from the grid to deliver 2 MJ to the target, so wall-plug gain was far below 1. Fusion also does produce radioactive waste, through neutron activation of structures, though mostly short- and intermediate-lived.","Fusion reactors can't melt down or explode like in movies; if anything goes wrong, the super-hot fuel cools off and fusion stops. But the 2022 success didn't power anything yet; the lasers still used far more electricity overall than the fusion produced."],["What's next","ITER, under construction in France, is planned to start research operations in 2034 and deuterium–tritium operation in 2039, aiming for Q = 10 with 500 MW of fusion power. Private companies are pursuing compact high-field tokamaks using high-temperature superconducting magnets (such as Commonwealth Fusion Systems' SPARC, aiming for first plasma around 2026–2027), stellarators, and other concepts.\nFor a power plant, key unproven elements are materials that withstand years of neutron exposure, tritium breeding and handling at scale, reliable heat and exhaust handling (divertor heat loads of about 10 MW/m²) and cost-competitive electricity.","A giant international fusion machine called ITER is being built in France, and dozens of companies are racing to build fusion power plants. It may still be a decade or more before fusion powers homes."]],"colliders":[["History","Lawrence's cyclotron (1931) began accelerator physics. The first colliding-beam rings (AdA, 1961) were followed by SPEAR (charm and tau discoveries), the SppS (W and Z, 1983), LEP (precision Z-pole physics, 1989–2000) and the Tevatron (top quark, 1995). The LHC began operation in 2008 and discovered the Higgs boson in 2012.\nThe LHC's third run (2022–2026) operated at 13.6 TeV. The ring is being upgraded to the High-Luminosity LHC, planned to begin operations around 2030 and deliver about ten times the integrated luminosity of earlier runs.","The first particle accelerator, built in 1931, could fit in your hand. Over the years they grew to kilometers long, discovering quarks, the W and Z particles, the top quark and, in 2012, the Higgs boson."],["Common misconceptions","Colliders do not 'smash particles into pieces' to reveal parts already inside them. Collision energy creates new particles that were not present before, as in pair creation of top quarks.\nThe LHC poses no danger of producing Earth-destroying black holes. Cosmic rays strike Earth, the Moon and neutron stars at much higher center-of-mass energies, and these bodies persist; formal safety assessments in 2003 and 2008 reached this conclusion.","No, the LHC can't make a black hole that swallows Earth. Cosmic rays hit Earth and the Moon with even more energy all the time, and they're fine! And colliders don't just break particles into pieces; they make brand-new particles out of energy, sometimes heavier than the ones they started with."],["What's next","After the High-Luminosity LHC, proposals include CERN's Future Circular Collider (a 91 km ring first operating as an e<sup>+</sup>e<sup>−</sup> Higgs and electroweak factory, then a 85–100 TeV hadron collider), China's CEPC, linear colliders (ILC, CLIC) and a muon collider. The update of the European Strategy for Particle Physics, being finalized in 2026, will set CERN's priorities.\nThe Electron–Ion Collider at Brookhaven, under construction, will study gluon structure and the origin of nucleon spin and mass. Key technologies under development include high-field Nb<sub>3</sub>Sn and high-temperature superconducting magnets and plasma wakefield acceleration.","The LHC is getting an upgrade to make about 10 times more collisions. Scientists are also planning an even bigger ring, about 91 km around!"]],"quantum-gravity":[["Why we need it","General relativity and quantum field theory are each extremely well tested, but they are mathematically incompatible at high energies and in strong curvature. Singularity theorems (Penrose, Hawking) show that general relativity predicts its own breakdown inside black holes and at the Big Bang, where curvature reaches Planckian values.\nHawking's 1974 result that black holes radiate thermally creates the information paradox: if radiation is exactly thermal, pure quantum states evolve into mixed states, violating unitarity. Resolving it requires a theory of quantum gravity, and recent semiclassical 'island' calculations reproducing the Page curve suggest information is preserved.","If you try to use the math for quantum physics on gravity, you get impossible answers like infinity. And both theories break down inside black holes and at the Big Bang. So something deeper must be going on."],["Common misconceptions","Quantum gravity does not mean gravity is especially weak in some exotic sense; it means the gravitational field itself is subject to quantum superposition and uncertainty. Its effects are expected to be tiny except at Planck energies or in specific regimes such as black hole horizons and the early universe.\nString theory is not a single tested theory but a framework with many possible solutions. Its mathematical consistency and links to known physics make it attractive, but a definite prediction testable with current technology has not emerged.","Here, 'string theory' doesn't mean a proven idea; it's a possible explanation scientists are still testing. And any new theory still has to agree with Einstein everywhere his ideas have been tested."],["Still unknown","Direct Planck-scale tests are far out of reach: a particle accelerator would need to be roughly 10<sup>15</sup> times more powerful than the LHC. Indirect probes include energy-dependent photon speeds from gamma-ray bursts (current limits exceed the Planck scale for linear effects), primordial gravitational waves in the CMB, and tabletop experiments proposed to test whether gravity can entangle two massive objects, which would show the gravitational field must be quantum.\nTheoretical questions include whether spacetime emerges from entanglement, how to describe de Sitter space (our universe's asymptotic state) holographically, and how singularities are resolved.","Is space smooth, or made of tiny pieces? Are there hidden extra dimensions? What really happened at the Big Bang? Scientists are designing clever experiments to look for clues."]],"antimatter":[["History","Anderson discovered the positron in cosmic-ray cloud-chamber tracks in 1932; the antiproton (1955) and antineutron (1956) were found at the Bevatron. CERN produced the first antihydrogen atoms in 1995; ATHENA and ATRAP made cold antihydrogen in 2002, and ALPHA first trapped it in 2010.\nIn 2023 ALPHA-g showed that antihydrogen falls downward with acceleration consistent with g (0.75 ± 0.13 ± 0.16 g), ruling out 'antigravity'. In 2024 BASE-STEP demonstrated transport of trapped protons by truck, the first step toward moving antiprotons to quieter laboratories for more precise measurements.","In 1928, physicist Paul Dirac's math predicted antimatter before anyone had found it. Four years later it was discovered in cosmic rays. Scientists have even made anti-hydrogen atoms, and in 2023 they showed antimatter falls down, not up, just like normal matter."],["Common misconceptions","Antimatter is not 'negative mass' and does not fall upward; it has positive energy and gravitates normally, as ALPHA-g's result confirms within current precision.\nAntimatter is not a practical energy source or propellant. Producing it consumes billions of times more energy than annihilation releases; by CERN's estimate, all the antimatter it has ever made would light a single bulb for only a few minutes.","Antimatter isn't just science fiction. A banana naturally gives off a tiny bit of antimatter about once every 75 minutes! But it's not a good fuel: making it takes way more energy than you get back."],["Still unknown","The origin of the baryon asymmetry, η ≈ 6 × 10<sup>−10</sup>, is unknown. Candidate mechanisms include electroweak baryogenesis (which requires a first-order electroweak phase transition, absent in the Standard Model with m<sub>H</sub> = 125 GeV) and leptogenesis from decays of heavy right-handed neutrinos.\nOther open questions are whether antimatter's gravitational acceleration equals g to high precision, whether neutrinos are their own antiparticles, and whether claimed anti-helium candidates in AMS-02 cosmic-ray data, which would imply antimatter regions or exotic production, are real.","When the universe began, there should have been equal amounts of matter and antimatter, which would have destroyed each other completely. But about one extra matter particle out of every billion survived, and that's what everything, including you, is made of. Nobody knows why."]],"nature-of-time":[["What we've measured","Time dilation has been measured with muons, atomic clocks on aircraft (Hafele–Keating, 1971), Gravity Probe A (1976, gravitational redshift to 7 × 10<sup>−5</sup>) and GPS. In 2010 NIST observed time dilation at walking speed and for a 33 cm height difference; in 2022 JILA measured gravitational redshift across a single millimeter-scale atomic sample.\nOptical lattice clocks now reach fractional systematic uncertainties of about 10<sup>−18</sup>, and the international metrology community is preparing to redefine the SI second based on optical transitions, possibly around 2030.","Scientists have flown super-accurate clocks on airplanes and found they tick differently than clocks on the ground, just as Einstein predicted. GPS satellites have to correct for this every day."],["Common misconceptions","Time dilation is not an illusion or a measurement artifact; it is a real difference in elapsed proper time, which is why astronaut clocks measurably lag ground clocks.\nThe block universe view, in which past, present and future are equally real, is one interpretation consistent with relativity, not a demonstrated fact. Some physicists defend 'growing block' or 'presentist' views. Physics also does not forbid time travel to the past absolutely: general relativity has solutions with closed timelike curves, but they require exotic conditions, and many physicists expect them to be excluded.","Time travel to the future is sort of real: astronauts on the Space Station age a tiny bit slower, so after six months they return a few thousandths of a second 'in the future'. Travel to the past is still science fiction."],["Still unknown","Whether time is fundamental or emergent, why the universe began in a low-entropy state, and how the 'flow' of time relates to physics are open questions.\nOther questions include whether general relativity permits time machines in principle (Hawking's chronology protection conjecture), the role of time in quantum measurement, and how quantum superpositions of clocks or gravitational fields affect time measurement, which experiments with atomic clocks in superposition are beginning to explore.","Is time a real 'thing', or does it come from something deeper? Does it actually flow, or does it just feel that way to us? Physicists and philosophers still argue about these questions."]],"multiverse":[["Where the ideas come from","Everett proposed the relative-state interpretation in 1957, later popularized by DeWitt as 'many worlds'. Vilenkin (1983) and Linde (1986) showed that inflation can be eternal. Bousso and Polchinski (2000) and the KKLT construction (2003) suggested a large landscape of string vacua, and Susskind (2003) linked it to anthropic reasoning.\nWeinberg's anthropic bound on Λ, requiring that structure could form, predicted a small positive value of the order later measured, a result taken by some as support for landscape reasoning and by others as coincidence.","Some multiverse ideas come from inflation, the super-fast growth spurt of the early universe. Others come from quantum physics or string theory. Each idea grew out of a different theory."],["Common misconceptions","The multiverse is not one theory. Different ideas, including spatially infinite universes, inflationary bubbles, quantum branches and mathematical-universe proposals, differ in physics and status, and accepting one does not imply the others.\nNor is the multiverse required by science to explain fine-tuning. Alternatives include as-yet-unknown principles that fix constants, and some apparent fine-tunings may be less severe than claimed when multiple parameters vary together.","There isn't just one multiverse idea; there are several very different ones. And in the quantum version, you can't visit other universes or meet other versions of yourself."],["Can it be tested?","Proposed observational tests include bubble-collision signatures in the CMB, effects of pre-inflationary curvature, and statistical predictions for constants. Negative spatial curvature, for example, would be expected in some bubble-universe scenarios, while detecting positive curvature at |Ω<sub>k</sub>| > 10<sup>−4</sup> would disfavor them. To
