he celestial equator; the Sun's declination ranges between ±23.44°, producing the seasons, and planets and the Moon stay near the ecliptic because orbits are nearly coplanar.","Earth's equatorial bulge, torqued by the Sun and Moon, makes the rotation axis precess with a period of about 25,770 years, moving the celestial poles around a circle of 23.4° radius and shifting the equinoxes westward along the ecliptic by about 50.3″ per year. Polaris is now about 0.6° from the north celestial pole; in about 12,000 years Vega will be the bright star near the pole. Nutation adds small periodic wobbles, the largest with an 18.6-year period. Star catalogs therefore specify an epoch, such as J2000.0.","Apparent brightness uses the logarithmic magnitude scale, m = −2.5 log<sub>10</sub>(F/F<sub>0</sub>), in which 5 magnitudes correspond to a factor of 100 in flux. The naked-eye limit is about m = 6–6.5 under pristine skies (sky brightness about 22 mag per square arcsecond); in a city, it may be m = 3–4, leaving only tens of stars. Artificial skyglow comes from upward and scattered light; blue-rich LEDs scatter more effectively via Rayleigh scattering, which scales as λ<sup>−4</sup>."],"m":["Earth spins once a day, which makes the stars seem to wheel across the sky. Earth also travels around the Sun, so each season the night side of Earth faces a different part of space, and you see different constellations.","The North Star, Polaris, sits almost directly above Earth's North Pole, so it barely moves while all the other stars circle around it. That's why travelers used it to find north.","Planets always travel along the same path across the sky that the Sun follows. You can tell a planet from a star because planets usually shine steadily instead of twinkling, and they slowly move among the stars over weeks.","Every August, Earth passes through dust left by a comet, causing the Perseid meteor shower, with dozens of shooting stars per hour under a dark sky. Grab a blanket and look up!"]},"why":{"s":"The night sky is the foundation of positional astronomy, navigation, timekeeping and calendars, and its regularities led to the first quantitative physical laws. Celestial reference frames, now defined by quasars, underpin satellite navigation and measurements of Earth's rotation. Dark skies are an environmental and cultural resource: artificial light at night disrupts wildlife, human circadian rhythms and astronomical research.","m":"Looking up is the easiest way to start exploring the universe. All you need are your eyes and a dark sky."},"terms":[["Constellation","One of 88 regions of the sky with IAU-defined boundaries, named after traditional star patterns.","A star pattern and its patch of sky."],["Ecliptic","The Sun's apparent annual path on the celestial sphere, the projection of Earth's orbital plane, inclined 23.44° to the celestial equator.","The path the Sun and planets follow across the sky."],["Celestial pole","The points where Earth's rotation axis meets the celestial sphere, around which the sky appears to rotate.","The spot in the sky that stars circle around."],["Sidereal day","Earth's rotation period relative to distant stars, 23 h 56 m 4.1 s, about 4 minutes shorter than the mean solar day.","One spin of Earth measured by the stars."],["Light pollution","Artificial brightening of the night sky from outdoor lighting, quantified in magnitudes per square arcsecond.","City light that hides the stars."],["Precession","The slow conical motion of Earth's rotation axis with a period of about 25,770 years, caused by solar and lunar torques on Earth's equatorial bulge.","Earth's very slow wobble, like a spinning top."]]},"multi-messenger":{"how":{"s":["Photons are absorbed and scattered; at TeV energies they pair-produce on extragalactic background light, γγ → e<sup>+</sup>e<sup>−</sup>, so the universe is opaque to very-high-energy gamma rays beyond about a gigaparsec, and above about 10<sup>15</sup> eV even the CMB absorbs them over Galactic distances. Neutrinos interact so weakly that they escape dense sources and travel undeflected across the universe. Charged cosmic rays are bent by magnetic fields: a proton of energy E in a field B has gyroradius r<sub>L</sub> ≈ 1.1 pc × (E/PeV)/(B/μG), so below about 10<sup>19</sup> eV their arrival directions are scrambled.","High-energy neutrinos are produced when accelerated protons collide with gas (pp) or photons (pγ), creating pions: π<sup>±</sup> decays to neutrinos and π⁰ to gamma rays, so neutrino and gamma-ray fluxes are linked. Each neutrino receives about 5% of the parent proton's energy. Cubic-kilometer detectors such as IceCube in Antarctic ice and KM3NeT in the Mediterranean detect Cherenkov light from secondary particles; muon tracks give pointing to better than 1°, while cascades give better energy resolution.","Ultra-high-energy cosmic rays, above about 5 × 10<sup>19</sup> eV, lose energy through pion production on CMB photons (the Greisen–Zatsepin–Kuzmin limit), restricting sources to within about 100 Mpc. They are detected via extensive air showers sampled by surface detector arrays and fluorescence telescopes; the Pierre Auger Observatory covers 3,000 km². Cosmic rays are accelerated by diffusive shock acceleration: particles crossing a shock repeatedly gain energy, producing a power-law spectrum dN/dE ∝ E<sup>−2</sup> at the source.","Multi-messenger detection depends on rapid alerts. Gravitational-wave detectors issue public alerts within minutes, with sky localizations of tens to thousands of square degrees; IceCube sends real-time alerts for high-energy tracks; and the SuperNova Early Warning System (SNEWS) combines neutrino detectors worldwide to announce a Galactic core collapse. Wide-field optical surveys (ZTF, Rubin) and gamma-ray and X-ray satellites (Fermi, Swift, Einstein Probe, SVOM) then search for counterparts."],"m":["Light can be blocked by dust and gas. Gravitational waves pass right through everything. Neutrinos zoom out of the hearts of exploding stars. Cosmic rays come from powerful cosmic 'particle launchers'. Each messenger tells a different part of the story.","When a detector catches something, it sends an automatic alert within minutes, and telescopes around the world rush to look at that patch of sky, like a worldwide team of detectives.","From the 2017 crash, scientists learned that gravitational waves travel at light speed, that crashing neutron stars make gold and platinum, and how fast the universe is expanding, all from one event!","Cosmic rays hit our atmosphere all the time, making showers of particles that rain down to the ground. A detector in Argentina spread over an area bigger than a large city catches the most powerful ones."]},"why":{"s":"Combining messengers provides physical information unavailable from any one: GW170817 alone measured the speed of gravity to 10<sup>−15</sup>, confirmed that neutron star mergers produce r-process elements and short gamma-ray bursts, and gave an independent H<sub>0</sub>. Neutrinos identify hadronic accelerators, directly addressing the century-old question of cosmic-ray origins. A Galactic supernova observed in neutrinos, gravitational waves and light would test the explosion mechanism in unprecedented detail.","m":"Using several messengers is like using sight, hearing and touch together: you understand way more than with one sense alone."},"terms":[["Multi-messenger astronomy","Astronomy combining two or more classes of signals (electromagnetic, gravitational-wave, neutrino, cosmic-ray) from the same source.","Studying space with several kinds of signals at once."],["Cosmic ray","A high-energy charged particle (protons, nuclei, electrons) from space, with energies up to above 10<sup>20</sup> eV.","A super-fast particle from space."],["Air shower","The cascade of secondary particles produced when a cosmic ray or gamma ray interacts in the atmosphere, spreading over kilometers at ground level.","A shower of particles made when a cosmic ray hits our air."],["Gamma-ray burst","A brief, intense gamma-ray flash: long bursts (≳ 2 s) from collapsing massive stars, short bursts mainly from compact-object mergers.","A super-powerful flash from a cosmic explosion."],["SNEWS","The SuperNova Early Warning System, which combines neutrino detectors to issue prompt alerts of a Galactic core-collapse supernova.","An alarm system for exploding stars."]]},"rockets":{"how":{"s":["A rocket engine converts propellant chemical energy into directed kinetic energy by expanding hot gas through a converging–diverging (de Laval) nozzle, which accelerates the flow to supersonic speed. Thrust is<span class=\"eq\"><span class=\"eql\">F = ṁv<sub>e</sub> + (p<sub>e</sub> − p<sub>a</sub>)A<sub>e</sub></span></span>where ṁ is mass flow, v<sub>e</sub> exhaust velocity, p<sub>e</sub> and p<sub>a</sub> exit and ambient pressures and A<sub>e</sub> the nozzle exit area. Nozzles are optimized for a particular ambient pressure, so sea-level and vacuum engines differ in expansion ratio.","Efficiency is expressed as specific impulse, I<sub>sp</sub> = v<sub>e</sub>/g<sub>0</sub> in seconds. Kerosene–oxygen engines reach about 310–340 s in vacuum, methane–oxygen about 350–380 s and hydrogen–oxygen about 450–465 s; solid motors reach about 270–300 s. Exhaust velocity scales roughly as √(T<sub>c</sub>/M), favoring hot combustion and low molecular mass, which is why hydrogen is efficient despite its low density, which in turn requires large tanks.","Integrating momentum conservation for a rocket ejecting mass gives the rocket equation:<span class=\"eq\"><span class=\"eql\">Δv = v<sub>e</sub> ln(m<sub>0</sub>/m<sub>f</sub>)</span></span>For Δv = 9.4 km/s and v<sub>e</sub> = 3.3 km/s, the mass ratio is e<sup>2.85</sup> ≈ 17, leaving only about 6% of launch mass for structure, engines and payload. Staging discards empty tanks and engines so later stages do not accelerate dead mass; each stage's Δv adds. Typical orbital rockets deliver 2–4% of their liftoff mass to low Earth orbit.","Launch trajectories trade gravity losses (about 1–1.5 km/s, from thrusting against gravity while climbing) against aerodynamic drag and structural loads at maximum dynamic pressure (max-Q). A gravity turn tips the vehicle gradually toward horizontal flight. Launching eastward gains Earth's rotational speed, 465 m/s at the equator. Electric propulsion (ion or Hall thrusters) achieves I<sub>sp</sub> of 1,500–4,000 s but thrust of only millinewtons to newtons, suiting long-duration missions such as Dawn and BepiColombo."],"m":["How well a rocket engine works depends on how fast it shoots out its exhaust. Regular rocket engines blast gas out at about 3 to 4.5 km/s. Ion engines shoot gas out way faster, but push very gently, about as hard as a sheet of paper resting on your hand.","Here's the tricky part: to go faster you need more fuel, but more fuel makes the rocket heavier, so you need even more fuel to carry that fuel! That's why a rocket is around 90% fuel at launch.","The solution is stages: when a fuel tank is empty, the rocket drops it so it doesn't carry dead weight. Launching toward the east also gives a free speed boost from Earth's spin.","Space trips are planned like a budget, but in speed instead of money. Getting to orbit costs about 9.4 km/s of 'speed budget'. Heading to the Moon or Mars from there costs a few km/s more."]},"why":{"s":"Rocket propulsion is the only proven way to reach space, and the rocket equation sets the economics of all spaceflight: satellites for communications, navigation and Earth observation, scientific missions and human exploration. Reusable first stages have substantially lowered launch costs per kilogram, enabling large satellite constellations and more frequent science missions. Advances in in-space propulsion, including nuclear thermal and electric systems, would shorten interplanetary transit times.","m":"Without rockets we'd have no satellites, so no GPS, satellite weather forecasts or pictures from other planets."},"terms":[["Thrust","The reaction force produced by expelling mass, F = ṁv<sub>e</sub> + (p<sub>e</sub> − p<sub>a</sub>)A<sub>e</sub>.","The push a rocket engine makes."],["Exhaust velocity","The effective speed of the exhaust relative to the rocket, v<sub>e</sub> = I<sub>sp</sub>g<sub>0</sub>; sets propellant efficiency.","How fast the gas shoots out the back."],["Delta-v (Δv)","The total change in velocity a vehicle can achieve or a maneuver requires; the currency of mission design.","A rocket's 'speed budget'."],["Staging","Discarding spent tanks and engines in sequence so later stages accelerate less inert mass; total Δv is the sum of stage Δvs.","Dropping empty fuel tanks along the way."],["Rocket equation","Δv = v<sub>e</sub> ln(m<sub>0</sub>/m<sub>f</sub>), relating velocity change to exhaust velocity and the ratio of initial to final mass.","The math that shows why rockets need so much fuel."]]},"missions":{"how":{"s":["Missions escalate in difficulty: flyby, orbiter, lander or rover, and sample return. A flyby requires the least Δv but gives hours of close-range data; orbiting requires a capture burn or aerobraking; landing requires dealing with descent through an atmosphere (Mars's thin atmosphere is the hardest case) or powered descent on airless bodies. Sample return adds an ascent and return, but enables laboratory analysis with instruments far exceeding what can be flown, such as nanoscale isotopic measurements.","Communication over interplanetary distances is limited by the inverse-square law. Received power follows the Friis equation, P<sub>r</sub> = P<sub>t</sub>G<sub>t</sub>G<sub>r</sub>(λ/4πd)², so data rates fall as 1/d². Voyager 1's 23 W transmitter, at more than 165 AU, delivers about 160 bits per second to NASA's 70 m antennas. NASA's Deep Space Network has three complexes spaced about 120° apart in longitude (Goldstone, Madrid and Canberra) for continuous coverage; optical (laser) communication, demonstrated by Psyche's DSOC experiment in 2023–2025, can increase data rates tenfold or more.","Power comes from solar arrays, whose output falls as 1/d², or from radioisotope thermoelectric generators beyond about 5 AU or in dusty, dark environments. RTGs convert heat from ²³⁸Pu decay (half-life 87.7 years) into electricity at about 6% efficiency; the MMRTG on Curiosity and Perseverance produced about 110 W at launch. Voyager's RTGs now provide less than half their original power, forcing instruments to be shut down progressively.","Crewed missions require life support, radiation protection and return capability. In low Earth orbit (about 400 km, 92-minute orbits), Earth's magnetic field shields against most galactic cosmic rays and solar particles, and astronauts receive about 0.5–1 mSv per day. Beyond the magnetosphere, a Mars mission could accumulate about 0.6–1 Sv over roughly three years, approaching career limits; long-duration microgravity also causes bone and muscle loss and fluid shifts affecting vision."],"m":["Missions get harder step by step: first fly past a planet, then orbit it, then land, then drive around, then bring rocks home, and finally send people.","Mars is so far away that radio messages take between 3 and 22 minutes each way. You can't drive a rover with a joystick, so rovers make many of their own driving decisions! Far from the Sun, solar panels don't work well, so some spacecraft use special nuclear batteries.","Giant 70-meter antennas in California, Spain and Australia talk to faraway spacecraft. Voyager 1's radio is about as powerful as a refrigerator light bulb, yet we can still hear it from about 25 billion km away!","Sending people is hardest. Astronauts need air, food, water and protection from radiation. Living in space for months also weakens bones and muscles, one of the challenges for a future trip to Mars."]},"why":{"s":"Space missions provide in situ data that remote observation cannot: ground truth for planetary composition, ages and processes, detection of subsurface oceans, and samples for laboratory analysis. They have changed our understanding of planetary habitability, Solar System history and Earth's own climate through comparative planetology. Earth-observation and communication satellites, descended from early missions, now underpin weather forecasting, navigation and global connectivity.","m":"Missions turned dots of light into real places we can explore, and showed us what Earth looks like from far away."},"terms":[["Flyby","A trajectory passing close to a body without orbiting it, often used for gravity assists and reconnaissance.","Zooming past a planet without stopping."],["Sample return","A mission that collects material from another body and returns it to Earth for laboratory analysis.","Bringing space rocks home."],["Deep Space Network","NASA's global network of large antennas (34 m and 70 m) at Goldstone, Madrid and Canberra for tracking and communicating with deep-space missions.","Giant antennas that talk to faraway spacecraft."],["RTG","Radioisotope thermoelectric generator: converts heat from radioactive decay (usually ²³⁸Pu) into electricity via thermocouples.","A nuclear battery for spacecraft."],["Low Earth orbit","Orbits below about 2,000 km altitude, with periods of about 88–127 minutes; the ISS orbits at about 400 km.","The region of space close to Earth."]]},"interplanetary":{"how":{"s":["For a transfer from an orbit of radius r<sub>1</sub> to r<sub>2</sub> around the Sun, the transfer ellipse has semi-major axis <i>a</i><sub>t</sub> = (r<sub>1</sub> + r<sub>2</sub>)/2. Using the vis-viva equation, the departure burn is<span class=\"eq\"><span class=\"eql\">Δv<sub>1</sub> = √(μ/r<sub>1</sub>) [√(2r<sub>2</sub>/(r<sub>1</sub> + r<sub>2</sub>)) − 1]</span></span>where μ = GM<sub>☉</sub>. For Earth to Mars, Δv<sub>1</sub> ≈ 2.9 km/s heliocentric, and the transfer takes half the ellipse's period, about 259 days. Escaping Earth from low orbit with that excess speed requires about 3.6 km/s.","A Hohmann transfer requires a specific phase angle between departure and target planets at launch: for Mars, Mars must lead Earth by about 44°. The geometry repeats every synodic period, 1/S = |1/T<sub>1</sub> − 1/T<sub>2</sub>|, which is about 780 days (26 months) for Earth–Mars and about 584 days for Earth–Venus. Mission planners use 'porkchop plots' of launch energy (C<sub>3</sub> = v<sub>∞</sub>²) versus departure and arrival dates, solving Lambert's problem for each pair.","In a gravity assist, the spacecraft's speed relative to the planet is unchanged, but the direction of its velocity rotates. In the Sun's frame, adding the planet's orbital velocity changes the spacecraft's heliocentric speed by up to about twice the planet's orbital speed, at the cost of an imperceptible change in the planet's momentum. The deflection angle δ satisfies sin(δ/2) = 1/(1 + r<sub>p</sub>v<sub>∞</sub>²/μ<sub>p</sub>), so close, slow flybys of massive planets give the largest turns.","Arriving spacecraft must shed their hyperbolic excess speed to be captured into orbit, using an orbit-insertion burn at periapsis (where the Oberth effect makes Δv most effective) and then, at planets with atmospheres, aerobraking through hundreds of passes in the upper atmosphere to lower apoapsis gradually. Low-energy trajectories exploit three-body dynamics and invariant manifolds near Lagrange points, trading time for Δv; electric propulsion trajectories spiral gradually with continuous thrust."],"m":["Everything in space is already moving. Earth zooms around the Sun at about 30 km per second, and a spacecraft launched from Earth starts with that speed. To go to Mars, it speeds up a little to swing out farther from the Sun.","The cheapest path to Mars takes about 8.5 months. The spacecraft has to arrive exactly when Mars gets there, so we can launch only about every 26 months, when the planets line up just right.","A gravity slingshot is like jumping onto a moving merry-go-round and getting flung off faster. By passing just behind a planet, a spacecraft borrows a tiny bit of the planet's speed. The planet slows down by an amount far too small to ever notice.","Landing on Mars takes about seven minutes from the top of the atmosphere to the ground: heat shield, parachute, rockets and, for the biggest rovers, a 'sky crane' that lowers them on cables. It all happens automatically, because radio messages take too long to send commands."]},"why":{"s":"Trajectory design determines which destinations are reachable with available rockets, how long missions take and what they can carry. Gravity assists made the Voyager Grand Tour, Cassini, MESSENGER, BepiColombo and Parker Solar Probe possible; without them, reaching Mercury, the outer planets or the solar corona would require far larger launchers. The same mechanics apply to planetary defense, asteroid sample return and future crewed Mars missions.","m":"Without clever space paths and slingshots, most missions to faraway planets would be impossible with the rockets we have."},"terms":[["Hohmann transfer","The two-impulse transfer between coplanar circular orbits using an ellipse tangent to both; minimum Δv for radius ratios below about 11.9.","The cheapest path between two planets."],["Launch window","The time period in which launch is possible for a given mission's energy and arrival constraints, recurring each synodic period.","The time when planets line up for a trip."],["Gravity assist","Using a planet's gravity during a flyby to change a spacecraft's heliocentric speed and direction without propellant.","A slingshot around a planet."],["Aerobraking","Lowering a spacecraft's orbit by repeated passes through the upper atmosphere, converting orbital energy to heat.","Using air drag to slow down."],["Synodic period","The time between successive identical alignments of two bodies as seen from the Sun, 1/S = |1/T<sub>1</sub> − 1/T<sub>2</sub>|.","How often two planets line up again."]]},"radioactivity":{"how":{"s":["For a nucleus with decay constant λ, the number remaining after time t is<span class=\"eq\"><span class=\"eql\">N(t) = N<sub>0</sub>e<sup>−λt</sup></span><span class=\"eql\">t<sub>1/2</sub> = ln 2 / λ</span></span>Activity A = λN is measured in becquerels (1 Bq = 1 decay/s). Decay probability is independent of age, temperature, pressure and chemistry to very high precision (except electron-capture rates, which depend slightly on electron density). The mean lifetime τ = 1/λ = t<sub>1/2</sub>/ln 2.","Alpha decay emits a ⁴He nucleus by quantum tunneling through the Coulomb barrier. Because the tunneling probability depends exponentially on the barrier, half-lives obey the Geiger–Nuttall relation, log t<sub>1/2</sub> ∝ Z/√Q<sub>α</sub>: a change in alpha energy from 4 to 9 MeV changes half-life by over 20 orders of magnitude, from ²³²Th (1.4 × 10<sup>10</sup> yr) to ²¹²Po (0.3 μs). Alpha particles deposit energy densely and stop within about 40 μm of tissue or a sheet of paper.","Beta decay is a weak-interaction process converting a neutron to a proton (β<sup>−</sup>: n → p + e<sup>−</sup> + ν̄<sub>e</sub>) or vice versa within nuclei (β<sup>+</sup> or electron capture). Energy is shared among three bodies, giving a continuous electron spectrum, which led Pauli to predict the neutrino. Gamma decay is the electromagnetic de-excitation of nuclear levels, emitting photons of keV to MeV energies; long-lived excited states (isomers), such as ⁹⁹ᵐTc used in medical imaging, have suppressed transition rates.","Radiometric dating compares parent and daughter abundances: t = (1/λ) ln(1 + D/P). Carbon-14 (t<sub>1/2</sub> = 5,730 yr), produced by cosmic rays, dates organic material to about 50,000 years after calibration for atmospheric variations. Uranium–lead dating uses two independent chains (²³⁸U → ²⁰⁶Pb, t<sub>1/2</sub> = 4.47 Gyr; ²³⁵U → ²⁰⁷Pb, 0.704 Gyr), whose concordance checks closed-system behavior and gives ages precise to about 0.1%, such as the 4.567 Gyr age of the Solar System."],"m":["An atom's center needs the right mix of protons and neutrons to be stable. If there are too many of one kind, the center changes itself by shooting out a particle. Some heavy atoms spit out a chunk made of two protons and two neutrons.","You can never predict when one single atom will decay; it's completely random. But with billions of atoms, half will decay in one half-life, then half of what's left in the next, and so on.","Living things absorb a little radioactive carbon-14. After they die it slowly decays, so measuring how much is left tells scientists how long ago something lived, up to about 50,000 years. Other radioactive atoms in rocks show Earth is about 4.5 billion years old.","Different radiation needs different shields. A sheet of paper stops alpha particles, a thin sheet of metal stops beta particles, and thick lead or concrete is needed for gamma rays. Doctors use radiation to fight cancer and to see inside the body."]},"why":{"s":"Radioactivity heats Earth's interior (about half of the roughly 47 TW of surface heat flow is radiogenic, from U, Th and ⁴⁰K), dates geological and archaeological records, powers spacecraft through RTGs and enables nuclear medicine for diagnosis (PET, SPECT) and therapy. Understanding radiation doses is essential for health: the average natural background dose is about 2.4 mSv per year globally, while acute doses above about 1 Sv cause radiation sickness.","m":"Radioactivity tells us how old Earth and fossils are, helps doctors treat cancer and even helps keep Earth's insides warm."},"terms":[["Half-life","The time for half of a population of radioactive nuclei to decay, t<sub>1/2</sub> = ln 2/λ.","The time it takes for half of a radioactive sample to change."],["Alpha particle","A ⁴He nucleus (two protons, two neutrons) emitted in alpha decay with typical energy 4–9 MeV.","A chunk of two protons and two neutrons shot out of an atom."],["Beta decay","A weak-interaction decay changing a neutron into a proton (β<sup>−</sup>) or a proton into a neutron (β<sup>+</sup>, electron capture) within a nucleus.","When an atom center shoots out an electron and changes."],["Gamma ray","A high-energy photon (typically above about 100 keV) emitted by nuclear de-excitation or other high-energy processes.","Super-energetic light from an atom's center."],["Radiometric dating","Determining age from the measured ratio of radioactive parent to stable daughter isotopes, using known decay rates.","Using radioactive atoms as clocks."]]},"fission":{"how":{"s":["Fission is energetically favorable for heavy nuclei because binding energy per nucleon peaks near iron: fragments are more tightly bound than uranium by about 0.9 MeV per nucleon. In the liquid-drop picture, an absorbed neutron's binding energy excites the compound nucleus; for ²³⁶U* this excitation (6.5 MeV) exceeds the fission barrier (about 5.5 MeV), so thermal neutrons can induce fission in ²³⁵U but not in ²³⁸U. Most of the energy, about 170 MeV, appears as fragment kinetic energy; the rest is carried by neutrons, prompt gamma rays and subsequent beta decays.","The chain reaction is characterized by the effective multiplication factor k<sub>eff</sub>, the average number of fissions caused by neutrons from one fission. For k<sub>eff</sub> = 1 the reaction is steady (critical); above 1, power grows. The neutron population varies as<span class=\"eq\"><span class=\"eql\">n(t) = n<sub>0</sub> e<sup>(k−1)t/ℓ</sup></span></span>where ℓ is the neutron generation time, about 10<sup>−4</sup> s in thermal reactors. About 0.65% of neutrons from ²³⁵U fission are delayed, emitted seconds to a minute later from fission products; this lengthens the effective generation time and makes control possible, provided the reactor stays below prompt criticality.","Fission cross sections for ²³⁵U are about 585 barns for thermal neutrons but only about 1 barn for fast ones, so most reactors slow neutrons with a moderator. Light nuclei moderate efficiently because elastic collisions transfer more energy: neutrons need about 18 collisions in hydrogen but about 115 in carbon to thermalize. Ordinary water absorbs some neutrons, requiring enrichment to about 3–5% ²³⁵U; heavy water or graphite allows natural uranium. Fast reactors omit the moderator and can breed fissile ²³⁹Pu from ²³⁸U.","Reactor control uses absorber rods (boron, cadmium, hafnium), soluble boron in coolant, and inherent negative feedback: as fuel heats, Doppler broadening of ²³⁸U absorption resonances captures more neutrons, and in water reactors, lower moderator density reduces moderation. After shutdown, fission-product decay still produces about 6–7% of full power, falling to about 1% after hours, so cooling must continue; loss of this cooling caused the Fukushima Daiichi meltdowns (2011)."],"m":["When a uranium-235 atom catches a slow neutron, it wobbles like a water balloon and splits in two, releasing a burst of energy and 2 or 3 new neutrons. A single fuel pellet about the size of a fingertip can make as much energy as a tonne of coal.","For a steady chain reaction, each split needs to cause exactly one more split. Control rods soak up extra neutrons to keep things steady, like a brake pedal.","In a power plant, the heat boils water into steam, the steam spins a turbine, and the turbine makes electricity, just like many other power plants, but without burning anything.","Reactors also make special radioactive atoms that doctors use in millions of medical scans every year."]},"why":{"s":"Fission is the largest low-carbon source of dispatchable electricity in many countries, a power source for naval vessels and some spacecraft, and the basis of nuclear weapons. Research reactors produce medical isotopes (such as ⁹⁹Mo for ⁹⁹ᵐTc) and neutron beams for materials science. Decisions about new reactors, waste repositories and fuel cycles hinge on the physics of chain reactions, decay heat and long-lived radionuclides.","m":"Fission makes lots of electricity without releasing carbon dioxide and powers some submarines. It also led to nuclear weapons, which is why it's handled very carefully."},"terms":[["Chain reaction","A self-sustaining series of fissions in which neutrons from each fission induce further fissions, characterized by k<sub>eff</sub>.","When each split atom causes more splits."],["Critical mass","The minimum mass of fissile material for k<sub>eff</sub> = 1 in a given geometry; about 52 kg for a bare sphere of ²³⁵U.","Just enough fuel to keep a chain reaction going."],["Moderator","A material (water, heavy water, graphite) that slows fast fission neutrons to thermal energies by elastic scattering.","A material that slows neutrons down."],["Control rod","A rod of neutron-absorbing material inserted into a reactor core to reduce k<sub>eff</sub> and control or stop the chain reaction.","A rod that soaks up neutrons, like a brake."],["Enrichment","Increasing the fraction of ²³⁵U above its natural 0.72%, by gas centrifuges, to 3–5% for power reactors.","Concentrating the useful kind of uranium."]]},"fusion-energy":{"how":{"s":["The D–T reaction has the largest cross section at achievable temperatures, peaking near 65 keV, with reactivity ⟨σv⟩ maximized at kT ≈ 10–20 keV (about 120–230 million K) once losses are considered. The figure of merit is the fusion triple product; for D–T ignition, where alpha heating alone balances losses,<span class=\"eq\"><span class=\"eql\">n T τ<sub>E</sub> ≳ 3 × 10<sup>21</sup> keV·s/m³</span></span>where τ<sub>E</sub> is the energy confinement time. Gain is described by Q = P<sub>fusion</sub>/P<sub>heating</sub>; ignition corresponds to Q → ∞, and practical power plants need engineering gain well above 1.","Tokamaks confine plasma in a torus using a strong toroidal magnetic field plus a poloidal field generated by a plasma current of megaamperes, producing helical field lines. Charged particles gyrate around field lines with Larmor radius r<sub>L</sub> = mv<sub>⊥</sub>/(qB), millimeters for ions in 5 T fields. Turbulent transport limits τ<sub>E</sub>; the high-confinement (H-) mode, with an edge transport barrier, roughly doubles confinement, at the cost of edge-localized-mode bursts that must be controlled. Disruptions, sudden losses of plasma current, can damage machines.","Stellarators create the twisted field entirely with external, three-dimensionally shaped coils, eliminating plasma current and disruptions and permitting steady-state operation. Their complex geometry was made practical by computer optimization; Germany's Wendelstein 7-X has demonstrated high-performance plasmas lasting several minutes. Inertial confinement instead compresses a millimeter-scale D–T capsule to about 1,000 times solid density in nanoseconds; at NIF, 192 laser beams heat a gold hohlraum whose X-rays drive the implosion.","A power plant must breed its own tritium, which has a 12.3-year half-life and does not occur naturally in useful amounts, via neutron capture in lithium blankets: ⁶Li + n → T + ⁴He + 4.8 MeV. The 14 MeV neutrons carry 80% of the energy and damage structural materials, displacing each atom many times over a component's lifetime and producing helium that embrittles metals. Developing materials that withstand this, and achieving a tritium breeding ratio above 1, are prerequisites for commercial fusion."],"m":["The easiest fusion fuel uses two heavy kinds of hydrogen, deuterium and tritium. Deuterium is found in seawater. When they fuse, they make helium and a speedy neutron, plus lots of energy.","The Sun uses its enormous gravity to squeeze hydrogen together. We can't do that on Earth, so we have to make the fuel even hotter: over 100 million degrees, about 7 times hotter than the Sun's core!","Nothing can touch something that hot without melting, so scientists hold the super-hot gas in a 'magnetic bottle' made of powerful magnets, often shaped like a doughnut. This machine is called a tokamak.","Another way uses giant lasers to squeeze a tiny fuel pellet, smaller than a peppercorn, so fast and hard that it fuses before it can fly apart."]},"why":{"s":"Fusion could provide abundant, low-carbon, dispatchable energy from fuel available for millions of years (deuterium from seawater, lithium from minerals), without long-lived high-level waste or the possibility of runaway chain reactions. Fusion research also advances plasma physics, superconducting magnets and high-power lasers, and its physics is shared with stars, supernovae and astrophysical plasmas.","m":"If it works, fusion could give the world almost endless clean energy using fuel from seawater."},"terms":[["Plasma","An ionized gas of free electrons and ions exhibiting collective electromagnetic behavior; fusion plasmas have kT ≈ 10–20 keV.","Super-hot gas where atoms lose their electrons."],["Tokamak","A toroidal magnetic confinement device combining external toroidal coils with an induced plasma current.","A doughnut-shaped magnetic bottle for fusion."],["Stellarator","A toroidal confinement device in which externally shaped 3D coils produce the twisted field, without a large plasma current.","A twisty magnetic bottle for fusion."],["Lawson criterion","The condition, expressed as a minimum nTτ<sub>E</sub>, under which fusion power can balance or exceed losses.","The recipe for getting more energy out than you put in."],["Ignition","The state where fusion self-heating (alpha particles in D–T) sustains the plasma temperature without external heating.","When fusion keeps itself going."]]},"colliders":{"how":{"s":["For two colliding beams of energy E, the center-of-mass energy is √s = 2E; for a beam hitting a fixed target of mass m, √s ≈ √(2Emc²), far less efficient at high energy. This is why modern frontier machines are colliders. Circular accelerators bend particles with dipole magnets; momentum and field are related by<span class=\"eq\"><span class=\"eql\">p [GeV/c] = 0.3 B [T] R [m]</span></span>so 6.8 TeV protons in the LHC require 8.3 T superconducting dipoles in a ring of about 2.8 km bending radius, cooled to 1.9 K with superfluid helium.","Charged particles in circular orbits radiate synchrotron radiation, with energy loss per turn ΔE ∝ E⁴/(m⁴R). Because electrons are about 1,836 times lighter than protons, their losses are about 10<sup>13</sup> times larger at the same energy and radius. This limits circular electron–positron colliders to roughly 100–200 GeV beam energy, motivating linear electron colliders or muon colliders for higher energies, while proton machines are limited mainly by magnet strength.","The event rate for a process with cross section σ is dN/dt = Lσ, where the instantaneous luminosity L = f n<sub>1</sub>n<sub>2</sub>/(4πσ<sub>x</sub>σ<sub>y</sub>) depends on bunch crossing frequency f, particles per bunch and beam size. The LHC reaches about 2 × 10<sup>34</sup> cm<sup>−2</sup>s<sup>−1</sup>; integrated over years, its experiments have recorded hundreds of inverse femtobarns. A Higgs production cross section of about 50 pb thus yields millions of Higgs bosons, of which only a small fraction is cleanly detectable.","Detectors measure particles' energy, momentum, charge and identity in concentric layers: silicon trackers in a magnetic field measure momentum from track curvature (p = 0.3BR), electromagnetic calorimeters absorb electrons and photons, hadronic calorimeters absorb hadrons, and outer muon chambers detect penetrating muons. Neutrinos and other invisible particles are inferred from missing transverse momentum. Multilevel triggers, hardware then software, reduce the 40 MHz crossing rate to about 1–5 kHz of stored events."],"m":["Particles get pushed faster and faster by electric fields, like pushing a kid on a swing at just the right moment. Giant magnets, cooled colder than outer space, steer the particles around the 27 km ring.","The particles travel in bunches of about 100 billion protons, and bunches cross up to 40 million times per second! Head-on crashes give the most energy for making new particles.","Detectors are built in layers like an onion. Inner layers track particles' paths, middle layers measure their energy, and outer layers catch muons. Neutrinos zoom through without a trace, but scientists can tell they were there from the energy that goes 'missing'.","There are so many crashes that computers must decide in millionths of a second which ones are interesting enough to save. Then scientists search for tiny 'bumps' in the data that could reveal a new particle."]},"why":{"s":"Colliders test the Standard Model at the highest controlled energies, discovered the W, Z, top quark and Higgs boson, and search for dark matter, supersymmetry and other new physics. Their technologies, superconducting magnets, ultra-high vacuum, fast electronics, distributed computing (the World Wide Web was invented at CERN in 1989) and radiation detectors, have spread into medicine (proton therapy, PET), industry and computing.","m":"Colliders discovered many of nature's smallest building blocks. And the World Wide Web was invented at CERN to help scientists share their data!"},"terms":[["Particle accelerator","A machine using electric fields to accelerate charged particles and magnetic fields to steer and focus them.","A machine that speeds up tiny particles."],["Luminosity","The rate factor L relating event rate to cross section, dN/dt = Lσ; integrated luminosity is measured in inverse femtobarns.","How many crashes a collider makes."],["Calorimeter","A detector absorbing particles to measure their energy through showers of secondary particles.","The part of a detector that measures energy."],["Trigger","A fast decision system selecting collision events of interest for permanent storage from an overwhelmingly larger rate.","The computer that picks which crashes to save."],["Electronvolt (eV)","The energy gained by an electron through a potential difference of 1 V, 1.602 × 10<sup>−19</sup> J; particle masses are quoted in eV/c².","A tiny unit of energy used for particles."]]},"quantum-gravity":{"how":{"s":["Combining G, ħ and c defines the Planck scales: length ℓ<sub>P</sub> = √(ħG/c³) = 1.616 × 10<sup>−35</sup> m, time t<sub>P</sub> = 5.39 × 10<sup>−44</sup> s, and mass m<sub>P</sub> = √(ħc/G) = 2.18 × 10<sup>−8</sup> kg. At these scales, the Compton wavelength of a particle, ħ/mc, equals its Schwarzschild radius, 2Gm/c², so quantum uncertainty and spacetime curvature become equally important and neither theory alone applies.","Treating small metric perturbations as a quantum field gives the graviton, a massless spin-2 boson. In perturbation theory, gravity's coupling has dimensions of inverse mass squared (G ~ 1/m<sub>P</sub>²), so scattering amplitudes grow as (E/m<sub>P</sub>)² and new divergences appear at each loop order (Goroff and Sagnotti showed a two-loop divergence in pure gravity in 1986). As an effective field theory, quantum gravity still makes reliable low-energy predictions, such as tiny quantum corrections to the Newtonian potential of order Għ/(c³r²).","String theory replaces point particles with one-dimensional strings of length about ℓ<sub>s</sub>; their vibration modes include a massless spin-2 state, so gravity is required by the theory. Consistent superstring theories need ten spacetime dimensions, six of which must be compactified, and the many possible compactifications create a vast 'landscape' of vacua. Loop quantum gravity instead quantizes the geometry of general relativity directly, predicting discrete spectra of area and volume operators in units of about ℓ<sub>P</sub>²; its main challenge is recovering smooth classical spacetime.","Black hole thermodynamics provides a crucial clue. Bekenstein–Hawking entropy, S = k<sub>B</sub>c³A/(4Għ), scales with area rather than volume, suggesting that the information content of a region is bounded by its boundary area (the holographic principle). The AdS/CFT correspondence (Maldacena, 1997) makes this precise in certain spacetimes, equating quantum gravity in anti-de Sitter space with a non-gravitational quantum field theory on its boundary. String theory reproduces the Bekenstein–Hawking entropy for certain extremal black holes by counting microstates."],"m":["Quantum gravity effects should show up at an incredibly tiny size called the Planck length, far, far smaller than a proton. To test it directly, you'd need a particle collider about a million billion times more powerful than the LHC. That's why it's so hard.","String theory says the tiniest particles are actually super-tiny vibrating strings, like guitar strings. Different vibrations make different particles, and one vibration acts just like gravity! But it needs extra hidden dimensions, curled up too small to see.","Loop quantum gravity says space itself is made of tiny chunks, like pixels on a screen. It suggests the Big Bang might have been a 'Big Bounce' from an earlier shrinking universe.","Other ideas suggest space and time might emerge from something even deeper, a bit like how temperature emerges from lots of jiggling molecules."]},"why":{"s":"A quantum theory of gravity is required to understand the initial singularity, the interior and final fate of black holes, and whether spacetime is fundamental or emergent. It could explain the values of constants, the cosmological constant problem and the nature of dark energy. It would also complete the unification of known physics, since every other fundamental interaction already has a quantum description.","m":"It could explain how the universe began and what's really inside black holes. It might be the biggest unsolved puzzle in physics."},"terms":[["Planck length","ℓ<sub>P</sub> = √(ħG/c³) ≈ 1.616 × 10<sup>−35</sup> m, the length scale at which quantum gravitational effects become important.","An unimaginably tiny length where gravity becomes quantum."],["Graviton","The hypothetical massless spin-2 quantum of the gravitational field.","A possible particle that carries gravity."],["String theory","A framework in which fundamental objects are one-dimensional strings (and higher-dimensional branes), requiring extra dimensions and naturally including gravity.","The idea that everything is made of tiny vibrating strings."],["Loop quantum gravity","A nonperturbative quantization of general relativity in which space is built from discrete spin-network states with quantized area and volume.","The idea that space is made of tiny chunks."],["Holographic principle","The proposal that the physics of a volume of space can be encoded on its boundary, with information bounded by area in Planck units.","The idea that a 3D space could be described on its 2D edge."]]},"antimatter":{"how":{"s":["Dirac's equation, iħγ<sup>μ</sup>∂<sub>μ</sub>ψ = mcψ, has solutions with E = +√(p²c² + m²c⁴) and E = −√(p²c² + m²c⁴). In quantum field theory, negative-energy solutions are reinterpreted as antiparticles with positive energy, so every field quantizes into both particles and antiparticles. Neutral particles such as the photon and Z are their own antiparticles; whether neutrinos are too (Majorana particles) is unknown.","Annihilation converts a particle–antiparticle pair into other particles while conserving energy, momentum and charges. An electron and positron at rest typically annihilate into two 511 keV photons emitted back-to-back, the signal PET scanners use to locate tracer molecules containing positron emitters such as ¹⁸F. Proton–antiproton annihilation produces mainly pions, releasing the full 1.88 GeV rest energy, about 1,000 times more per unit mass than fission.","Antihydrogen is made by merging antiprotons (from CERN's Antiproton Decelerator and its ELENA ring) with positrons in Penning traps, then confining the neutral anti-atoms in magnetic-minimum traps, which hold only atoms colder than about 0.5 K. The ALPHA experiment has measured the 1S–2S transition frequency of antihydrogen to about 2 parts in 10<sup>12</sup>, identical to hydrogen's. BASE has compared the antiproton and proton charge-to-mass ratios to 16 parts per trillion and their magnetic moments to parts per billion.","C (charge conjugation), P (parity) and their combination CP are violated in weak interactions. CP violation was found in neutral kaon decays (1964), later in B mesons (2001), D mesons (2019) and in 2025 for the first time in baryons, Λ<sub>b</sub> decays at LHCb. All observed quark-sector CP violation follows from the single complex phase in the CKM matrix, which is far too small to produce the observed baryon asymmetry. Leptonic CP violation in neutrino oscillations is being sought."],"m":["Antimatter particles are just like normal ones but with the opposite charge. The anti-electron, called a positron, is positive instead of negative. An antiproton is negative instead of positive.","When a particle meets its antiparticle, they turn completely into energy. In a PET scan, doctors give patients a special sugar that releases positrons. Each positron meets an electron and makes two flashes going opposite ways, which the scanner uses to build a picture of the body.","Antimatter is made naturally in lots of places: when cosmic rays hit our air, in some radioactive atoms and even in thunderstorms!","Storing antimatter is tricky because it destroys any container it touches. Scientists trap it floating in a vacuum, held only by electric and magnetic fields."]},"why":{"s":"Antimatter tests the deepest symmetries of physics: any difference between matter and antimatter in mass, charge, magnetic moment or gravity would signal violation of CPT or the equivalence principle. Explaining why matter survived the early universe is essential to understanding why anything exists at all. Antimatter also has practical uses in medical imaging (PET), materials research (positron annihilation spectroscopy) and as a probe of fundamental physics.","m":"If matter and antimatter had been perfectly balanced, they would have wiped each other out and nothing would exist. Figuring out why matter won explains why we're here."},"terms":[["Antiparticle","The partner of a particle with the same mass and spin but opposite additive quantum numbers (charge, baryon and lepton number).","A particle's opposite twin."],["Positron","The antiparticle of the electron, charge +e, mass 511 keV/c²; emitted in β<sup>+</sup> decay and produced in pair creation.","An anti-electron."],["CP violation","Violation of the combined symmetry of charge conjugation and parity, allowing matter and antimatter to behave differently.","When matter and antimatter act slightly differently."],["Baryon asymmetry","The excess of baryons over antibaryons in the universe, quantified by η = (n<sub>b</sub> − n<sub>b̄</sub>)/n<sub>γ</sub> ≈ 6 × 10<sup>−10</sup>.","Why there's more matter than antimatter."],["Penning trap","A trap using a uniform magnetic field and electrostatic quadrupole field to confine charged particles for precision measurements.","A magnetic cage for antimatter."]]},"nature-of-time":{"how":{"s":["Relativity makes elapsed time path-dependent. Proper time along a worldline is<span class=\"eq\"><span class=\"eql\">τ = ∫ √(−g<sub>μν</sub> dx<sup>μ</sup>dx<sup>ν</sup>) / c</span></span>which reduces to dτ = dt√(1 − v²/c²) in flat spacetime and dτ ≈ dt(1 + Φ/c²) in weak gravity. Clocks higher in a gravitational field run faster: about 1.1 × 10<sup>−16</sup> per meter near Earth's surface. Different observers disagree about simultaneity of spacelike-separated events but agree on proper time and causal order.","Microscopic laws are invariant (or nearly so) under time reversal. Classical mechanics and electromagnetism are T-invariant; the weak interaction violates T, observed directly in kaons (CPLEAR, 1998) and B mesons (BaBar, 2012), as CPT symmetry requires given CP violation. This tiny violation cannot account for macroscopic irreversibility, which is statistical: entropy increase follows from starting in a low-entropy macrostate, the 'past hypothesis'.","Several arrows of time point the same way: the thermodynamic arrow (entropy increases), the radiative arrow (retarded rather than advanced waves), the psychological arrow (we remember the past), the cosmological arrow (expansion) and the arrow of quantum measurement and decoherence. Most physicists consider them derived from the thermodynamic arrow and ultimately from cosmological initial conditions; records and memories require entropy-increasing processes.","In canonical quantum gravity, the Wheeler–DeWitt equation, Ĥ|Ψ⟩ = 0, contains no time parameter: the wavefunction of the universe is static. This 'problem of time' suggests time may emerge from correlations between subsystems, as in the Page–Wootters mechanism, in which one subsystem acts as a clock for the rest. Thermal time hypotheses and emergent-spacetime ideas from holography offer other routes."],"m":["Newton thought time ticked the same everywhere, like one giant cosmic clock. Einstein showed that's wrong: moving fast or being near something heavy makes your clock tick slower than someone else's. Time and space are woven together into spacetime.","Here's a puzzle: if you filmed planets orbiting the Sun and played it backward, it would look perfectly normal. Most laws of physics don't care which way time goes. So why does real life only go forward?","The answer seems to be entropy. Things naturally get more mixed up, and that gives time a direction. That happens because the universe started out incredibly neat and organized at the Big Bang.","Some scientists think time might not be a basic ingredient of the universe at all, but something that emerges, the way 'wetness' emerges from lots of water molecules."]},"why":{"s":"Time is central to every physical law, measurement standard and technology based on synchronization, from GPS and telecommunications to financial networks. Atomic clocks, now reaching 10<sup>−18</sup> fractional uncertainty, enable relativistic geodesy and searches for varying fundamental constants and dark matter. Conceptually, understanding time links thermodynamics, cosmology and quantum gravity, and bears on causality and whether the future is open or fixed.","m":"Time affects everything, from GPS to growing up. Understanding it might unlock the deepest secrets of the universe."},"terms":[["Arrow of time","The asymmetry between past and future, most fundamentally the increase of entropy toward the future.","Why time only seems to go forward."],["Time dilation","The slowing of clocks in relative motion (by 1/γ) or deeper in a gravitational potential, relative to other clocks.","When time runs slower for one clock than another."],["Block universe","The view, motivated by relativity, that all events in spacetime are equally real, without a privileged present.","The idea that all times exist at once."],["Time-reversal symmetry","Invariance of physical laws under t → −t; violated only by the weak interaction, at a small level.","When physics works the same backward and forward."],["Problem of time","The difficulty of reconciling the external time parameter of quantum mechanics with general relativity's dynamic spacetime, where the Hamiltonian constraint yields no time evolution.","The puzzle of what time means in quantum gravity."]]},"multiverse":{"how":{"s":["The simplest multiverse is an infinite or very large universe with the same laws everywhere. Our observable universe is a sphere of comoving radius about 46 billion light-years; if space is much larger, as current curvature limits allow, regions beyond our horizon exist with different initial fluctuations. In an infinite space, quantum statistics imply every finite configuration recurs, with typical separations estimated as 10<sup>10<sup>115</sup></sup> m (Tegmark).","In eternal inflation, quantum fluctuations of the inflaton can locally prolong inflation. If the expansion rate of the inflating region exceeds the rate at which inflation ends in subregions, inflation never stops globally: 'pocket' or 'bubble' universes nucleate continually, each with its own reheating and possibly different low-energy physics. Bubble collisions could leave circular temperature patterns in the CMB, which have been searched for in WMAP and Planck data without detection.","The many-worlds (Everett) interpretation takes quantum mechanics with only unitary evolution, no collapse. A measurement entangles the system, apparatus and observer, and decoherence separates the resulting branches, which no longer interfere. All outcomes occur in different branches. Its predictions for laboratory experiments are identical to other interpretations; debated issues include how to derive Born-rule probabilities.","String theory appears to admit a vast number of metastable vacua, often estimated as about 10<sup>500</sup> or more, with different particle content and cosmological constants. Combined with eternal inflation, this 'landscape' could populate many vacua. Anthropic selection would then explain why observers find a small but nonzero Λ, as Weinberg argued in 1987 before acceleration was discovered. Whether the landscape exists, and whether de Sitter vacua are consistent in string theory at all (the 'swampland' debate), is contested."],"m":["If space goes on forever, there could be endless regions beyond what we can see. Some might be so similar to ours that they'd even have another you! This idea comes from simple math about infinity.","Inflation might keep going forever in some places, making new 'bubble universes', each with its own Big Bang. Different bubbles might even have different laws of physics.","The 'many worlds' idea says that whenever something quantum could go two ways, the universe splits, and both outcomes happen in different branches. You'd never notice the other branches.","Some scientists use the multiverse to explain why our universe seems 'just right' for life. If there are countless universes with different settings, we'd naturally find ourselves in one where life can exist. Other scientists think this is giving up on finding real explanations."]},"why":{"s":"The multiverse question tests the limits of scientific explanation. If physical constants vary between regions, some apparent fine-tuning could be environmental selection rather than fundamental law. The debate sharpens questions about probability in cosmology (the measure problem), the role of anthropic reasoning, and what counts as an empirical test, influencing how physicists evaluate theories such as inflation and string theory.","m":"Even if we can never visit other universes, thinking about them helps scientists understand our own universe and what science can and can't answer."},"terms":[["Multiverse","A hypothesized set of universes or regions, beyond our observable universe, possibly with different conditions or physical constants.","The idea that there could be many universes."],["Eternal inflation","A scenario in which inflation ends locally but continues globally, endlessly producing bubble universes.","Inflation that keeps making new bubble universes."],["Many-worlds interpretation","The Everett interpretation, in which the universal wavefunction evolves unitarily and all measurement outcomes occur in decohered branches.","The idea that every quantum choice splits the universe."],["String landscape","The large set of possible metastable vacua of string theory, each with different low-energy physics.","All the possible universe 'settings' string theory allows."],["Anthropic principle","The observation that measured conditions must be compatible with the existence of observers; used as a selection effect in multiverse reasoning.","We can only find ourselves in a universe where life is possible."]]},"supernovae":{"how":{"s":["When the iron core exceeds its effective Chandrasekhar mass, electron captures and photodisintegration remove pressure support, and the core collapses in under a second at nearly free-fall speed until nuclear density halts it. The inner core bounces, launching a shock that stalls at about 150 km as it loses energy dissociating iron. The gravitational binding energy released,<span class=\"eq\"><span class=\"eql\">ΔE ≈ GM<sub>NS</sub>²/R<sub>NS</sub> ≈ 3 × 10<sup>46</sup> J</span></span>is carried mostly by neutrinos of all flavors over about 10 s.","In the delayed neutrino mechanism, about 1% of the neutrino energy is absorbed behind the stalled shock (via ν<sub>e</sub> + n → p + e<sup>−</sup>), and multidimensional instabilities, including neutrino-driven convection and the standing accretion shock instability (SASI), help revive it. Modern 3D simulations now produce successful explosions for many progenitors, with energies near 10<sup>44</sup> J (1 'bethe'). Some stars may fail to explode and collapse directly to black holes.","Type Ia light curves are powered by radioactive decay: ⁵⁶Ni → ⁵⁶Co (half-life 6.1 days) → ⁵⁶Fe (77.2 days). Peak luminosity is proportional to the ⁵⁶Ni mass (Arnett's rule), and brighter events decline more slowly (the Phillips relation, Δm<sub>15</sub>). After correction, peak magnitudes scatter by only about 0.1–0.15 mag, giving distances to about 5–7% per object. Type II-P light curves are instead powered by hydrogen recombination in the expanding envelope, producing a plateau of about 100 days.","Classification is spectroscopic: Type II shows hydrogen; Ib lacks hydrogen but shows helium; Ic lacks both, the progenitor having been stripped by winds or a binary companion; Ia lacks hydrogen and shows strong Si II. Superluminous supernovae, 10–100 times brighter, may be powered by magnetar spin-down or interaction with dense circumstellar material. After the ejecta sweep up their own mass in interstellar gas, remnants enter a Sedov–Taylor phase with R ∝ (Et²/ρ)<sup>1/5</sup>."],"m":["When a giant star's iron core gets too heavy, it collapses in less than a second, shrinking from the size of Earth to the size of a city! It then bounces back, and a flood of neutrinos helps blast the rest of the star outward.","The other kind starts with a white dwarf that steals material from a partner star or crashes into another white dwarf. It gets too heavy, ignites and explodes completely. These explosions all shine with nearly the same brightness, so astronomers use them to measure distances.","Astronomers sort supernovae by the kinds of light they give off, a bit like sorting rocks by color and texture.","Supernovae scatter elements like oxygen, calcium and iron into space. The calcium in your bones and the iron in your blood were spread by exploding stars billions of years ago. Their shock waves can even squeeze gas clouds to start forming new stars."]},"why":{"s":"Supernovae produce most oxygen, silicon, calcium and much of the iron in the universe, and supernova shocks accelerate Galactic cosmic rays to PeV energies. Their energy input regulates star formation in galaxies. Type Ia supernovae remain the primary late-universe distance indicator for H<sub>0</sub> and dark energy. A Galactic core-collapse event, expected roughly two or three times per century, would provide a neutrino and possibly gravitational-wave signal from inside the collapse.","m":"Supernovae made many of the elements in your body, and they helped scientists discover that the universe's expansion is speeding up."},"terms":[["Core-collapse supernova","Gravitational collapse of a massive star's core to a neutron star or black hole, with shock revival by neutrinos; Types II, Ib and Ic.","A giant star exploding when its core collapses."],["Type Ia supernova","Thermonuclear explosion of a carbon–oxygen white dwarf; standardizable via the luminosity–decline-rate (Phillips) relation.","A white dwarf exploding; used to measure distances."],["Nova","A thermonuclear runaway on the surface of an accreting white dwarf, releasing about 10<sup>37</sup>–10<sup>38</sup> J; the star survives.","A smaller blast on a white dwarf that doesn't destroy it."],["Supernova remnant","The expanding ejecta and shocked interstellar medium of a supernova, observed for 10⁴–10⁵ years in radio, X-ray and optical emission.","The glowing cloud left after a star explodes."],["Light curve","Brightness versus time; its rise, peak and decline encode ⁵⁶Ni mass, ejecta mass, explosion energy and progenitor envelope.","A chart of how bright something gets over time."]]},"quasars":{"how":{"s":["Accreting matter radiates the binding energy lost as it spirals inward, L = ηṀc², with efficiency η ≈ 0.06–0.42 set by black hole spin through the ISCO radius. A quasar with L = 10<sup>39</sup> W and η = 0.1 requires Ṁ ≈ 2 M<sub>☉</sub>/yr. The standard thin disk has temperature T(r) ∝ (GMṀ/σr³)<sup>1/4</sup>, peaking at about 10<sup>5</sup> K for 10⁸ M<sub>☉</sub>, which produces the 'big blue bump' in the ultraviolet. A hot corona Compton-upscatters disk photons into X-rays.","Black hole masses come from reverberation mapping: the broad emission lines respond to continuum variations after a light-travel delay τ, giving the broad-line region radius R = cτ. With line width Δv from Doppler broadening,<span class=\"eq\"><span class=\"eql\">M<sub>BH</sub> = f R Δv² / G</span></span>where f is a geometric factor of order unity. The empirical radius–luminosity relation R ∝ L<sup>1/2</sup> then allows single-epoch mass estimates for distant quasars.","The unified model places a torus of dusty gas around the accretion disk and broad-line region. Viewed face-on, we see broad lines (Type 1); edge-on, the torus hides them, leaving narrow lines (Type 2). If a relativistic jet points within a few degrees of our line of sight, Doppler boosting by a factor δ⁴ (or δ³) amplifies it and produces a blazar with rapid variability. Jets with bulk Lorentz factors Γ ~ 10 display apparent superluminal motion v<sub>app</sub> = βc sin θ/(1 − β cos θ).","Quasar spectra also probe intervening gas. Each neutral hydrogen cloud along the sightline absorbs at the redshifted Lyman-α wavelength 121.6 nm × (1 + z<sub>abs</sub>), producing the Lyman-α forest, which traces the matter power spectrum and BAO at z ≈ 2–3. Complete absorption blueward of Lyman-α (the Gunn–Peterson trough) in quasars above z ≈ 6 shows that the neutral fraction rises sharply, marking the end of reionization."],"m":["Gas spiraling into a giant black hole forms a flat, spinning disk. Rubbing and squeezing heat it to hundreds of thousands of degrees, making it glow incredibly brightly, brighter than all the stars in its galaxy combined.","Around the disk there's a thick ring of dust. Depending on our viewing angle, we might see the bright center directly or have it hidden behind the dust, which is why active galaxies can look so different.","Some active black holes shoot out jets of particles at nearly light speed, stretching farther than the width of their whole galaxy. If a jet points right at us, it looks extra bright and flickery. That's called a blazar.","Quasar light travels billions of years to reach us, passing through gas clouds along the way. Those clouds leave marks in the light, letting scientists map gas all across the universe."]},"why":{"s":"Quasars trace the growth of supermassive black holes across cosmic time and, through feedback, regulate star formation in massive galaxies; the energy released while growing a black hole exceeds the binding energy of its host bulge. Their absorption spectra map the intergalactic medium and reionization. As bright, point-like distant sources, they define the International Celestial Reference Frame used for navigation and geodesy, and they serve as background light sources for many cosmological measurements.","m":"Quasars help us study the early universe and show how giant black holes and galaxies grew up together."},"terms":[["Quasar","A high-luminosity active galactic nucleus, L ≳ 10<sup>38</sup> W, outshining its host; originally 'quasi-stellar radio source'.","A super-bright feeding black hole in a distant galaxy."],["Blazar","An AGN viewed nearly along its jet axis, showing rapid, high-amplitude variability and Doppler-boosted emission from radio to TeV gamma rays.","An active galaxy shooting its jet right at us."],["Relativistic jet","A collimated outflow at bulk Lorentz factor Γ ~ 3–30, powered by accretion and black-hole spin, extending up to megaparsecs.","A super-fast beam of particles from a black hole."],["Unified model","The orientation-plus-luminosity framework in which Seyfert types, radio galaxies, quasars and blazars arise from the same AGN structure.","The idea that active galaxies look different depending on our viewing angle."],["Lyman-alpha forest","The series of H I Lyman-α absorption lines at different redshifts in a quasar spectrum, each produced by intervening intergalactic gas.","Marks in quasar light from gas clouds along the way."]]},"fate-universe":{"how":{"s":["With constant Λ, H(t) → H<sub>∞</sub> = H<sub>0</sub>√Ω<sub>Λ</sub> ≈ 56 km/s/Mpc, and <i>a</i>(t) ∝ exp(H<sub>∞</sub>t). Structures bound today remain bound, but the Local Group becomes an island universe. The Milky Way and Andromeda, approaching at about 110 km/s, may merge; a 2025 analysis using Gaia and HST proper motions put the probability at roughly 50% within 10 billion years. Within about 150 Gyr, all galaxies beyond the Local Group will be redshifted past practical observability, and the CMB will have redshifted below detection.","Stellar evolution sets the next time scales. Main-sequence lifetimes scale roughly as t ≈ 10<sup>10</sup> yr × (M/M<sub>☉</sub>)<sup>−2.5</sup>, so the lowest-mass red dwarfs (0.08 M<sub>☉</sub>) last about 10<sup>13</sup> years. As gas is consumed, star formation ends near 10<sup>14</sup> years, closing the Stelliferous Era. Galaxies then evaporate dynamically: two-body relaxation ejects most stellar remnants over 10<sup>19</sup>–10<sup>20</sup> years, while the rest sink into central black holes.","If baryon number is violated, protons decay. Super-Kamiokande bounds τ(p → e<sup>+</sup>π⁰) > 2.4 × 10<sup>34</sup> yr; grand unified theories predict 10<sup>34</sup>–10<sup>36</sup> yr. Black holes evaporate by Hawking radiation in<span class=\"eq\"><span class=\"eql\">t<sub>evap</sub> ≈ 2 × 10<sup>67</sup> yr × (M/M<sub>☉</sub>)³</span></span>so the largest (about 10<sup>11</sup> M<sub>☉</sub>) last about 10<sup>100</sup> years. Because black holes are colder than the CMB today, evaporation cannot begin until the CMB temperature falls below theirs.","For constant w < −1, the Big Rip time is t<sub>rip</sub> − t<sub>0</sub> ≈ (2/3)|1 + w|<sup>−1</sup>H<sub>0</sub><sup>−1</sup>(1 − Ω<sub>m</sub>)<sup>−1/2</sup>, which is about 22 Gyr for w = −1.5. Bound systems are disrupted in order of decreasing binding energy, ending with atoms and nuclei. If dark energy instead decays and its density becomes negative, expansion halts and reverses (a Big Crunch); some 2025 fits of thawing-field models to DESI data place a possible turnaround tens of billions of years away, but these depend strongly on the assumed potential."],"m":["In about 4.5 billion years, our galaxy will pass close to the Andromeda galaxy and may merge with it. The Sun is slowly getting brighter, so in about a billion years Earth will become too hot for oceans, and in about 5 billion years the Sun will swell into a red giant.","Stars will keep being born for trillions of years, but eventually the gas runs out. The last tiny red dwarfs will fade after about 100 trillion years, and space will have stretched so much that other galaxies disappear from view.","Then the universe will be full of dead stars and black holes. Over unimaginably long times, even black holes will slowly evaporate. In the end the universe would be almost totally empty, dark and cold.","If dark energy grows stronger, it could someday rip apart galaxies, planets and even atoms: the Big Rip. If it weakens and reverses, the universe could stop expanding and collapse back together: the Big Crunch."]},"why":{"s":"Projecting the future tests whether our physical laws are complete across extreme time scales and connects cosmology to particle physics through proton decay, black-hole thermodynamics and vacuum stability. It also illustrates the thermodynamic arrow: in the de Sitter limit, the universe approaches a state of maximum entropy of order the horizon entropy, S ~ πc³/(GħH²) ~ 10<sup>122</sup> k<sub>B</sub>, after which no further free energy is available.","m":"It's one of the oldest questions people have asked: how will everything end? Science is finally starting to answer it."},"terms":[["Heat death","The asymptotic state of maximal entropy and no usable free energy; in ΛCDM, an empty de Sitter space at the Gibbons–Hawking temperature.","A possible ending where everything is cold and nothing happens."],["Big Rip","A finite-time singularity, <i>a</i> → ∞, for phantom dark energy (w < −1), in which bound structures are torn apart in sequence.","An ending where everything gets pulled apart."],["Big Crunch","Recollapse to high density, requiring the total effective dark-energy density to become negative or the curvature to be positive and dominant.","An ending where the universe squeezes back together."],["Stelliferous Era","The current epoch of ongoing star formation, ending about 10<sup>14</sup> years after the Big Bang when gas is exhausted and the last red dwarfs fade.","Today's era, when stars are shining."],["Proton decay","Hypothesized baryon-number-violating decay (for example p → e<sup>+</sup>π⁰) predicted by grand unified theories; lifetime bound > 2.4 × 10<sup>34</sup> yr.","The idea that protons might very slowly break down."]]},"states-of-matter":{"how":{"s":["At fixed temperature and pressure, a system minimizes its Gibbs free energy G = H − TS. The stable phase reflects the competition between enthalpy, favoring ordered, tightly bound phases at low T, and entropy, favoring disordered phases at high T. At coexistence the chemical potentials are equal, and the slope of the phase boundary is set by the Clausius–Clapeyron equation:<span class=\"eq\"><span class=\"eql\">dP/dT = L / (T Δv)</span></span>Ice's anomalous negative slope arises because liquid water is denser than ice.","First-order transitions such as melting and boiling have a discontinuous first derivative of G, with latent heat L = TΔS: 334 kJ/kg to melt ice and 2.26 MJ/kg to boil water at 1 atm. Continuous (second-order) transitions, such as the liquid–gas critical point (647 K, 22.06 MPa for water) or a ferromagnet's Curie point, have diverging correlation lengths. Their power-law behavior, for example C ∝ |T − T<sub>c</sub>|<sup>−α</sup>, is universal: systems with the same dimensionality and symmetry share exponents.","A plasma is ionized gas in which long-range Coulomb interactions dominate. Ionization fraction follows the Saha equation, which depends exponentially on ionization energy over kT. Key scales are the Debye length λ<sub>D</sub> = √(ε<sub>0</sub>k<sub>B</sub>T/n<sub>e</sub>e²), beyond which charges are screened, and the plasma frequency ω<sub>p</sub> = √(n<sub>e</sub>e²/ε<sub>0</sub>m<sub>e</sub>), the natural oscillation frequency of electrons. More than 99% of visible baryonic matter is plasma, including stars, the intergalactic medium and the solar wind.","In Bose–Einstein condensation, a macroscopic fraction of bosons occupies the lowest single-particle state below a critical temperature,<span class=\"eq\"><span class=\"eql\">T<sub>c</sub> = (2πħ²/mk<sub>B</sub>)(n/ζ(3/2))<sup>2/3</sup></span></span>when the thermal de Broglie wavelength becomes comparable to interparticle spacing. Dilute alkali gases condense at about 100 nK (Cornell, Wieman and Ketterle, 2001 Nobel Prize). Liquid ⁴He becomes superfluid at the lambda point, 2.17 K, flowing without viscosity and supporting quantized vortices, with circulation h/m.","At extreme conditions, new phases appear. Electron-degenerate matter supports white dwarfs; neutron-degenerate matter, neutron stars. Above about 155 MeV (about 1.8 × 10<sup>12</sup> K), hadrons dissolve into a quark–gluon plasma, recreated in heavy-ion collisions at RHIC and the LHC, where it behaves as a nearly perfect liquid with a viscosity-to-entropy ratio near the conjectured quantum bound ħ/4πk<sub>B</sub>. Topological phases, such as quantum Hall states, are distinguished not by symmetry breaking but by global invariants."],"m":["In a solid, particles are packed tight and just wiggle in place. In a liquid, they stay close but slide around. In a gas, they zoom around freely. Melting ice stays at exactly 0 °C until it's all melted, because the energy goes into breaking the ice apart.","Pressure matters too. On top of a tall mountain, water boils at a lower temperature, so pasta takes longer to cook! And water is weird: its solid form, ice, is lighter than liquid water, so ice floats. That's why lakes freeze from the top down and fish survive the winter.","Plasma is what you get when things get so hot that electrons are knocked off atoms. It glows, conducts electricity and can be steered with magnets. Lightning, the Sun, auroras and neon signs are all plasma.","At super-cold temperatures, atoms can merge into one big 'super-atom', and liquid helium can creep up the walls and out of its container! At the super-hot temperatures of the early universe, even protons melted into a soup of quarks."]},"why":{"s":"Phase behavior controls weather and climate (latent heat transport by water), geology (mantle convection, magma), planetary interiors (metallic hydrogen in Jupiter, high-pressure ices), materials engineering and the internal structure of stars. Plasma physics governs space weather and controlled fusion. Quantum phases underpin MRI magnets, precision sensors and quantum computing hardware, and the early universe passed through a sequence of phase transitions whose relics may still be observable.","m":"From weather and cooking to stars and fusion power, everything depends on how matter changes state."},"terms":[["Phase transition","A change of phase occurring when the free energies of two phases cross; first-order (latent heat) or continuous (critical behavior).","Changing from one state to another, like melting."],["Latent heat","The heat absorbed or released per unit mass at constant temperature during a first-order transition, L = TΔs.","Hidden energy used to melt or boil something."],["Triple point","The unique (T, P) at which three phases coexist; for water 273.16 K and 611.657 Pa.","Where solid, liquid and gas can all exist together."],["Plasma","A quasi-neutral ionized gas with many particles per Debye sphere, exhibiting collective behavior such as oscillations at ω<sub>p</sub>.","Super-hot gas with electrons knocked loose."],["Bose–Einstein condensate","A state in which a macroscopic number of bosons occupies a single quantum state, described by one macroscopic wavefunction.","Atoms so cold they act like one super-atom."],["Superfluid","A fluid flowing without viscosity because its excitation spectrum obeys the Landau criterion; ⁴He below 2.17 K, ³He below about 1–2.5 mK, depending on pressure.","A liquid that flows with no friction at all."]]}};

expansion:{t:["Expanding space","The raisin-bread universe"],
cap:["A homogeneous, isotropically expanding lattice. Recession velocities relative to the selected galaxy obey v = H<sub>0</sub>d, so every galaxy sees the same linear velocity field: the expansion has no center. In FLRW terms, proper distance d = <i>a</i>(t)χ grows with the scale factor while comoving separations χ stay fixed.","Space stretches like baking dough, and the galaxies are raisins! Tap any galaxy to stand on it. Everyone else zooms away from you, and the farther ones zoom faster."],
