<title>Cosmos Color Test</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;500;600&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=Archivo:wght@400;500;700;800;900&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap">
<style>
/* Layout: one reading column; sticky control bar; entries as a log of field notes, each with a log-scale ruler */
:root{
  --bg:#f3f4f7; --surface:#ffffff; --ink:#151a2e; --muted:#5b6178; --line:#d9dce6;
  --accent:#b4432b; --accent-soft:#f3dfd8; --blue:#2e5aa8;
  --ok:#2f7d4f; --mid:#a06a10; --open:#7a4bb0;
  --f-display:"Instrument Serif",Georgia,"Times New Roman",serif;
  --f-body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1120; --surface:#161a2c; --ink:#e7e9f2; --muted:#9aa0b8; --line:#2a3048;
  --accent:#ec8a6f; --accent-soft:#3a2420; --blue:#8fb0ee;
  --ok:#6cc792; --mid:#e2b45a; --open:#b99ae6; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1120; --surface:#161a2c; --ink:#e7e9f2; --muted:#9aa0b8; --line:#2a3048;
  --accent:#ec8a6f; --accent-soft:#3a2420; --blue:#8fb0ee;
  --ok:#6cc792; --mid:#e2b45a; --open:#b99ae6; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 64px}
header h1{font-family:var(--f-display);font-weight:600;font-size:clamp(2rem,6vw,2.8rem);line-height:1.05;margin:0;text-wrap:balance}
header p{color:var(--muted);margin:8px 0 0;max-width:60ch}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:16px 12px;border-bottom:1px solid var(--line);display:grid;gap:10px}
.brand{font-family:var(--f-display);font-weight:400;font-size:1.4rem;line-height:1;letter-spacing:-.01em;color:var(--ink);text-decoration:none;white-space:nowrap;min-width:0;cursor:pointer}
.brand i{color:var(--accent)}
.intro{color:var(--muted);margin:16px 0 0;max-width:62ch;font-size:.95rem}
.sec{margin-top:22px}
.sec h3{font-family:var(--f-display);font-weight:400;font-size:1.45rem;margin:0 0 6px}
.sec p{margin:0 0 10px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr));gap:10px;margin-top:18px}
a.tile{display:flex;flex-direction:column;gap:8px;text-decoration:none;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
a.tile:hover{border-color:var(--accent)}
a.tile svg{width:30px;height:30px;stroke:var(--accent);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
a.tile h3{font-family:var(--f-display);font-weight:400;font-size:1.5rem;line-height:1.1;margin:0}
a.tile p{margin:0;font-size:.88rem;color:var(--muted)}
a.tile .n{font:400 .74rem var(--f-mono);color:var(--muted);margin-top:auto}
.fhead{display:flex;gap:12px;align-items:center;margin-top:4px}
.fhead svg{width:36px;height:36px;flex:none;stroke:var(--accent);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.fhead h2{font-family:var(--f-display);font-weight:400;font-size:clamp(2rem,6vw,2.6rem);margin:0}
.page .sec:first-of-type{border-top:1px solid var(--line);padding-top:20px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
#q{flex:1 1 220px;min-width:0;font:inherit;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
.seg{flex:none;display:inline-flex;gap:2px;padding:2px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}
.seg button{font:600 .72rem var(--f-body);letter-spacing:.02em;border:0;border-radius:999px;background:none;color:var(--muted);padding:5px 10px;cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chip{flex:none;font:500 .8rem var(--f-body);letter-spacing:.02em;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:5px 11px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
select{font:inherit;font-size:.85rem;padding:7px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
.meta{font-size:.8rem;color:var(--muted);font-family:var(--f-mono)}
#list{display:grid;gap:14px;margin-top:18px}
article{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;min-width:0;scroll-margin-top:170px}
article.flash{border-color:var(--accent)}
.top{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.cat{font:500 .72rem var(--f-body);text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
.status{font:500 .72rem var(--f-body);letter-spacing:.04em;padding:2px 8px;border-radius:999px;border:1px solid currentColor}
.s-est{color:var(--ok)}.s-strong{color:var(--mid)}.s-open{color:var(--open)}
h2{font-family:var(--f-display);font-weight:400;font-size:1.7rem;margin:4px 0 8px;line-height:1.1;text-wrap:balance}
article p{margin:0 0 10px;max-width:65ch}
.fig{font-family:var(--f-mono);font-size:.86rem;background:var(--bg);border-left:3px solid var(--accent);padding:8px 10px;border-radius:0 6px 6px 0;margin:4px 0 12px;overflow-x:auto}
.fig b{font-weight:500;color:var(--accent)}
.ruler{margin:6px 0 12px}
.track{position:relative;height:6px;border-radius:3px;background:linear-gradient(90deg,var(--line),var(--line))}
.dot{position:absolute;top:50%;width:12px;height:12px;border-radius:50%;background:var(--accent);transform:translate(-50%,-50%);border:2px solid var(--surface)}
.ticks{display:flex;justify-content:space-between;font:400 .68rem var(--f-mono);color:var(--muted);margin-top:4px;font-variant-numeric:tabular-nums}
.rel{display:flex;flex-wrap:wrap;gap:6px;font-size:.82rem;color:var(--muted);align-items:center}
.rel a{color:var(--blue);text-decoration:none;border-bottom:1px solid transparent}
.rel a:hover{border-bottom-color:currentColor}
.empty{color:var(--muted);text-align:center;padding:40px 0}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:.78rem;color:var(--muted)}
sup{font-size:.7em}
.field{margin-top:26px}
.field h3{font:600 .78rem var(--f-body);text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:0 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:10px}
a.card{display:block;text-decoration:none;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;min-width:0}
a.card:hover{border-color:var(--accent)}
a.card .ct{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
a.card h4{font-family:var(--f-display);font-weight:400;font-size:1.35rem;margin:0;line-height:1.15}
a.card p{margin:6px 0 0;font-size:.9rem;color:var(--muted)}
.pip{flex:none;width:9px;height:9px;border-radius:50%;background:currentColor}
.crumb{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:18px 0 10px;font-size:.88rem}
.crumb a{color:var(--blue);text-decoration:none}
.page{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:22px 20px}
.page h2{font-size:clamp(2.1rem,6.5vw,2.8rem);margin:6px 0 14px}
.page p{font-size:1.05rem}
.pager{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.pager a{display:block;text-decoration:none;color:inherit;border:1px solid var(--line);border-radius:10px;padding:10px 14px;background:var(--surface);min-width:0}
.pager a:hover{border-color:var(--accent)}
.pager small{display:block;color:var(--muted);font-size:.75rem;text-transform:uppercase;letter-spacing:.08em}
.pager span{font-family:var(--f-display);font-weight:400;font-size:1.15rem}
.pager .next{text-align:right;grid-column:2}
.relhead{font:600 .78rem var(--f-body);text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:26px 0 10px}
@media (prefers-reduced-motion:no-preference){article{transition:border-color .4s}}
.model{margin:22px 0 6px;border:1px solid var(--line);border-radius:12px;background:var(--bg);padding:14px;min-width:0}
.mhead{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.mtag,.itag{font:700 .62rem var(--f-body);text-transform:uppercase;letter-spacing:.1em;color:var(--accent);border:1px solid currentColor;border-radius:999px;padding:2px 8px;white-space:nowrap}
.itag{font-size:.56rem;padding:1px 6px;vertical-align:middle;margin-left:4px;position:relative;top:-2px}
.model h3{font-family:var(--f-display);font-weight:400;font-size:1.45rem;margin:0}
.mcap{font-size:.9rem;color:var(--muted);margin:8px 0 12px}
.mstage{min-width:0}
.mstage canvas{display:block;border-radius:8px;max-width:100%;touch-action:manipulation}
.mctl{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;margin-top:12px}
.mctl label{display:flex;flex-direction:column;gap:4px;font-size:.78rem;color:var(--muted);flex:1 1 220px;min-width:0}
.mctl input[type=range]{width:100%;accent-color:var(--accent)}
.mbtn{font:600 .78rem var(--f-body);border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 13px;cursor:pointer}
.mbtn.on{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.mread{display:grid;grid-template-columns:1fr;gap:6px;margin-top:12px}
.mread div{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
.mread small{display:block;font-size:.66rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.mread b{font:500 .92rem var(--f-mono);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.mread .wide{grid-column:1/-1}
.mnote{font-size:.78rem;color:var(--muted);margin:10px 0 0}
.model.kz{background:radial-gradient(120% 90% at 20% 0%,#33287a 0%,#1b1543 60%,#120e30 100%);border:0;border-radius:22px;color:#fff;padding:18px}
.kz h3{font-family:var(--f-body);font-weight:800;font-size:1.3rem;letter-spacing:-.01em;color:#fff}
.kz .mtag{color:#ffc94a}
.kz .mcap,.kz .mnote,.kz .mctl label,.kz .mread small{color:#d4cef7}
.kz .mstage canvas{border-radius:16px}
.kz .mread div{background:rgba(255,255,255,.08);border:0;border-radius:14px}
.kz .mread b{font:800 1.02rem var(--f-body);color:#ffc94a}
.kz .mbtn{background:rgba(255,255,255,.12);border:0;color:#fff;font-weight:700}
.kz .mbtn.on{background:#ff5d8f;color:#fff}
.kz input[type=range]{accent-color:#3ee6d3}
.mleg{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:.78rem;color:var(--muted)}
.mleg span{display:inline-flex;align-items:center;gap:6px}
.mleg i{width:10px;height:10px;border-radius:3px;flex:none}
.mchips{display:flex;flex-direction:column;gap:6px;flex:1 1 100%;min-width:0}
.mchips>span{font-size:.78rem;color:var(--muted)}
.mchipset{display:grid;gap:6px}
.mchipset .mbtn{padding:8px 6px;text-align:center;line-height:1.2;min-width:0}
.smg{display:grid;grid-template-columns:auto repeat(4,minmax(0,1fr));gap:5px;align-items:stretch}
.smh{font:600 .68rem var(--f-body);color:var(--muted);text-align:center;letter-spacing:.08em}
.smr{font-size:.62rem;color:var(--muted);writing-mode:vertical-rl;transform:rotate(180deg);text-align:center;align-self:center}
.smt{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-width:0;aspect-ratio:1/1;max-height:84px;border:1.5px solid var(--k);background:color-mix(in srgb,var(--k) 12%,transparent);color:var(--ink);border-radius:8px;cursor:pointer;padding:2px}
.smt b{font:400 1.35rem var(--f-display);line-height:1}
.smt span{font-size:.6rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;max-width:100%;white-space:nowrap}
.smt.on{background:var(--k);color:var(--surface)}.smt.on span{color:var(--surface)}
.sm-h{grid-column:5}
.fb{display:grid;gap:8px}
.fbr{display:grid;grid-template-columns:7.5em 1fr 3.4em;gap:10px;align-items:center;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:9px 10px;cursor:pointer;text-align:left;font:inherit}
.fbr.on{border-color:var(--accent)}
.fbn{font-weight:600;font-size:.85rem}
.fbt{height:12px;background:var(--bg);border-radius:6px;overflow:hidden;min-width:0}
.fbt i{display:block;height:100%;border-radius:6px}
.fbv{font:500 .8rem var(--f-mono);text-align:right}
.fbs{font-size:.74rem;color:var(--muted)}
.kz .mleg,.kz .mchips>span,.kz .smh,.kz .smr{color:#d4cef7}
.kz .smt{color:#fff;border-radius:14px}.kz .smt span{color:#d4cef7}.kz .smt.on{color:#1b1543}.kz .smt.on span{color:#1b1543}
.kz .smt b{font:800 1.2rem var(--f-body)}
.kz .fbr{background:rgba(255,255,255,.08);border:0;color:#fff;border-radius:14px}.kz .fbr.on{outline:2px solid #ffc94a}
.kz .fbt{background:rgba(255,255,255,.12)}.kz .fbv{font:800 .8rem var(--f-body);color:#ffc94a}.kz .fbs{color:#d4cef7}
@media (max-width:560px){.page{padding:18px 12px}.model{margin-inline:-12px;padding:12px 10px;border-radius:10px}.model.kz{padding:14px 10px;border-radius:16px}.mstage canvas{border-radius:10px}}
button,a,input,canvas{-webkit-tap-highlight-color:transparent}
.mbtn,.seg button,.smt,.fbr,a.tile,a.card,.pager a{transition:transform .08s ease,filter .08s ease}
.mbtn:active,.seg button:active,.smt:active,.fbr:active,a.tile:active,a.card:active,.pager a:active{transform:scale(.96);filter:brightness(1.12)}
@media (prefers-reduced-motion:reduce){.mbtn,.seg button,.smt,.fbr,a.tile,a.card,.pager a{transition:none}}
.terms{display:grid;gap:0;margin:4px 0 0;border-top:1px solid var(--line)}
.terms div{display:grid;grid-template-columns:minmax(0,11em) minmax(0,1fr);gap:4px 16px;padding:10px 0;border-bottom:1px solid var(--line)}
.terms dt{font-weight:600;font-size:.95rem}
.terms dd{margin:0;color:var(--muted);font-size:.95rem}
@media (max-width:560px){.terms div{grid-template-columns:1fr}}
.toc{display:flex;flex-wrap:wrap;gap:6px;margin:16px 0 0}
.toc a{font-size:.78rem;color:var(--muted);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:4px 10px;-webkit-tap-highlight-color:transparent}
.toc a:active{transform:scale(.96)}
@media (max-width:400px){.brand{font-size:1.22rem}.seg button{padding:5px 7px;font-size:.66rem}}

/* ===== DESIGN TEST SKINS ===== */

:root[data-skin="blueprint"]{--bg:#0e2c4d;--surface:#123760;--ink:#eef5ff;--muted:#a3bfe2;--line:#2d5a8c;--accent:#ffd25a;--accent-soft:#25456b;--blue:#86dcff;--ok:#7be3a3;--mid:#ffd25a;--open:#ffa3c4;
  --f-display:"Chakra Petch",system-ui,sans-serif;--f-body:"IBM Plex Sans",system-ui,sans-serif;--f-mono:"IBM Plex Mono",ui-monospace,monospace;color-scheme:dark}
:root[data-skin="blueprint"] body{background-color:var(--bg);background-image:linear-gradient(rgba(255,255,255,.055) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.055) 1px,transparent 1px),linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:96px 96px,96px 96px,24px 24px,24px 24px;background-attachment:fixed}
:root[data-skin="blueprint"] .brand{font-weight:700;text-transform:uppercase;letter-spacing:.05em;font-size:.98rem}
:root[data-skin="blueprint"] .brand i{font-style:normal;color:var(--accent)}
:root[data-skin="blueprint"] a.tile,:root[data-skin="blueprint"] a.card,:root[data-skin="blueprint"] .page,:root[data-skin="blueprint"] .model:not(.kz),:root[data-skin="blueprint"] .mread div,:root[data-skin="blueprint"] .pager a,:root[data-skin="blueprint"] .fbr,:root[data-skin="blueprint"] .smt{border-radius:3px}
:root[data-skin="blueprint"] a.tile,:root[data-skin="blueprint"] a.card,:root[data-skin="blueprint"] .page{background:rgba(18,55,96,.88);border:1px solid #3a6ba0}
:root[data-skin="blueprint"] a.tile h3,:root[data-skin="blueprint"] .fhead h2,:root[data-skin="blueprint"] .page h2,:root[data-skin="blueprint"] h2,:root[data-skin="blueprint"] .sec h3,:root[data-skin="blueprint"] .model h3,:root[data-skin="blueprint"] a.card h4,:root[data-skin="blueprint"] .pager span{font-weight:600;text-transform:uppercase;letter-spacing:.04em}
:root[data-skin="blueprint"] a.tile h3{font-size:1.15rem}:root[data-skin="blueprint"] .page h2,:root[data-skin="blueprint"] .fhead h2{font-size:1.55rem}:root[data-skin="blueprint"] .sec h3,:root[data-skin="blueprint"] .model h3{font-size:1.05rem}:root[data-skin="blueprint"] a.card h4{font-size:.98rem}
:root[data-skin="blueprint"] .seg,:root[data-skin="blueprint"] .mbtn,:root[data-skin="blueprint"] .seg button{border-radius:3px}
:root[data-skin="blueprint"] .bar{background:var(--bg)}

:root[data-skin="museum"]{--bg:#ffffff;--surface:#ffffff;--ink:#0d0d0d;--muted:#565c68;--line:#0d0d0d;--accent:#e4322b;--accent-soft:#fde4e2;--blue:#1f4fd8;--ok:#14864a;--mid:#c98a00;--open:#6b3fd1;
  --f-display:"Archivo",system-ui,sans-serif;--f-body:"Archivo",system-ui,sans-serif;--f-mono:"IBM Plex Mono",ui-monospace,monospace;color-scheme:light}
:root[data-skin="museum-dark"]{--bg:#0b0b0b;--surface:#141414;--ink:#f4f4f0;--muted:#a9aeb8;--line:#f4f4f0;--accent:#ff4a3d;--accent-soft:#3a1512;--blue:#5584ff;--ok:#3cc47d;--mid:#f0b429;--open:#a483ff;
  --f-display:"Archivo",system-ui,sans-serif;--f-body:"Archivo",system-ui,sans-serif;--f-mono:"IBM Plex Mono",ui-monospace,monospace;color-scheme:dark}
:root[data-skin="museum-dark"] .tiles a.tile:nth-child(3n) svg,:root[data-skin="museum-dark"] a.tile.tile:nth-child(3n) svg{background:#f4f4f0;stroke:#0b0b0b}

<script>
const HS={"origin-of-life":{"how":["All known life uses the same basic system: DNA stores genetic information, RNA carries and helps translate it, and proteins built from 20 amino acids do most of the work, all inside membranes. Every living thing shares this system and nearly the same genetic code, which points to one shared ancestor called LUCA (the last universal common ancestor), estimated to have lived about 4 billion years ago.","There's a chicken-and-egg problem: DNA needs proteins to copy it, but proteins need DNA to code for them. The RNA world hypothesis offers a solution: RNA can store information like DNA and also act as a catalyst like proteins. The ribosome, the cell's protein-building machine, has an RNA core that does the key chemistry, which many scientists see as a leftover from that early era.","Where life began matters. Alkaline hydrothermal vents on the seafloor have natural energy differences across thin mineral walls, similar to the way cells make energy. Volcanic ponds on land have UV light, concentrated chemicals and wet–dry cycles that help small molecules link into chains. Each idea solves some problems but struggles with others.","Life also needs containers. Fatty acids naturally form bubble-like sacs in water that can grow and split. These 'protocells' could have held early self-copying RNA, keeping successful molecules together so they could compete: the start of evolution by natural selection."],"x":["The oldest widely accepted fossils are stromatolites, layered mounds built by mats of microbes about 3.5 billion years ago; claims of older evidence, up to about 4.1 billion years, are disputed. In 1952, the Miller–Urey experiment sent sparks through a mix of gases and produced amino acids. Later experiments made the building blocks of RNA under realistic conditions and showed that some RNA molecules, called ribozymes, can speed up reactions, including steps in copying themselves.\nAmino acids and DNA/RNA bases found in meteorites and asteroid samples show these ingredients also form in space.","The Miller–Urey experiment didn't create life; it showed that some building blocks form easily. The gap between a chemical soup and a cell that copies itself and evolves is still huge.\nThe origin of life is a separate question from evolution. Evolution explains how life diversified once it existed, not how the first life appeared.\nLife may not have taken very long to start: the rock record suggests it appeared fairly soon after Earth became habitable.","Where did life begin: deep-sea vents, ponds on land or somewhere else? Did RNA, metabolism or membranes come first? How did the genetic code develop? Did life start on Earth or arrive from elsewhere (panspermia)? And does life appear easily wherever conditions allow, or is it a rare accident? Finding a second, separate origin of life anywhere would help answer that."],"terms":["The origin of life from non-living chemistry.","The idea that early life used RNA both to store genetic information and to speed up chemical reactions.","The last universal common ancestor of all living things.","An RNA molecule that acts as a catalyst, speeding up a chemical reaction.","A simple membrane-enclosed bubble proposed as a step toward the first cells."],"s":"Life on Earth appeared at least 3.5 billion years ago and possibly more than 4 billion years ago, but how non-living chemistry became living biology is unknown. Leading ideas include an 'RNA world', where RNA both stored information and sped up reactions; life starting around hot vents on the deep seafloor; and warm volcanic ponds that kept drying out and refilling. Experiments show many of life's building blocks form easily under conditions that probably existed on early Earth.","why":"How life began is one of science's deepest questions. The answer would tell us how likely life is elsewhere, guide where and how we search for it, and connect chemistry, geology and biology into one story."},"extremophiles":{"how":["Each extreme requires special adaptations. Heat-lovers (thermophiles) have proteins with extra internal bonds and sturdier membranes, so they don't fall apart. Cold-lovers (psychrophiles) use flexible enzymes and natural antifreeze. Salt-lovers (halophiles) balance the salty outside by filling their cells with salts or protective molecules.","Acid-lovers (acidophiles) live in conditions near pH 0 by pumping out acid and keeping their insides close to neutral. The radiation-resistant bacterium Deinococcus radiodurans survives doses thousands of times deadlier than what would kill a human by quickly repairing its broken DNA. Some microbes deep underground grow so slowly that they might divide only once every few centuries.","Many extremophiles don't need sunlight. Some get energy from chemical reactions involving hydrogen, sulfur or iron, a process called chemosynthesis. At hydrothermal vents, these microbes form the base of food webs that support tubeworms, clams and shrimp.","Many extremophiles are Archaea, a group of single-celled life as different from bacteria as both are from us. Because they're so common in hot, harsh places, some researchers think early life may have started in, or passed through, similar conditions."],"x":["In the 1960s, Thomas Brock found bacteria thriving in Yellowstone's hot springs. One of them, Thermus aquaticus, provided the heat-proof enzyme behind PCR, the DNA-copying method used throughout biology and medicine. In 1977, the submarine Alvin discovered rich ecosystems at hydrothermal vents near the Galápagos, powered by chemical energy instead of sunlight. Deep drilling has found microbes kilometers underground, and one vent microbe has been grown at about 122 °C.\nIn 2007, tardigrades survived 10 days exposed to open space on a European mission.","Tardigrades aren't indestructible. They survive extremes by drying out into a dormant state called a tun, and many still die; active tardigrades are as fragile as other tiny animals.\nExtremophiles aren't rare oddities. Microbes deep underground may make up a large share of all life on Earth by mass.\n'Extreme' depends on your point of view: for many of these organisms, our normal conditions would be deadly.","What are the absolute limits of life in heat, dryness and radiation? How deep underground does life go, and how much is there? Could similar organisms survive in salty water under Mars's surface, in Europa's ocean or in Venus's clouds? Could tough microbes survive traveling between planets inside rocks?"],"terms":["An organism that thrives in conditions that are extreme by human standards.","An organism that grows best at high temperatures, roughly above 45 °C.","Making food using energy from chemical reactions instead of sunlight.","A major group of single-celled organisms, separate from bacteria and from plants, animals and fungi.","A microscopic animal that can survive extremes by drying out into a dormant state."],"s":"Extremophiles are living things that thrive in conditions once thought deadly: boiling hot springs, acidic mine water, extremely salty pools, deep-sea vents under crushing pressure, Antarctic ice and rock kilometers underground. Most are microbes, but tiny animals called tardigrades can survive extremes by going dormant. They show that life is tougher and more adaptable than scientists once thought, which widens the range of places we might find it elsewhere.","why":"Extremophiles change our idea of where life can exist, guiding the search on Mars, ocean moons and exoplanets. They're also useful: heat-proof enzymes from them power PCR testing and industrial processes, and they hint at what early life on Earth was like."},"habitable-worlds":{"how":["A planet's temperature depends on how bright its star is, how far away it is and how much light it reflects (its albedo). Starlight weakens with the square of distance, so the habitable zone is far from bright stars and very close to dim ones. Around a small red dwarf star, it can be so close that a planet's 'year' lasts only days or weeks.","The greenhouse effect matters as much as distance. Without greenhouse gases, Earth's average temperature would be about −18 °C instead of about 15 °C. Over millions of years, the carbonate–silicate cycle adjusts the amount of CO<sub>2</sub> in the air. When the climate is cold, rock weathering slows down and volcanic CO<sub>2</sub> builds up, warming the planet; when it's warm, weathering speeds up and removes CO<sub>2</sub>.","Other factors can make or break habitability. A magnetic field and enough mass help a planet keep its atmosphere. Plate tectonics may be needed to keep the carbon cycle going. Planets close to red dwarfs are probably tidally locked, with a permanent day side and night side, and are hit by strong flares that could strip away their air, although a thick atmosphere or ocean could spread heat around.","Biosignatures are signs of life that could be detected from far away. The strongest are combinations of gases that shouldn't exist together unless something keeps making them, like oxygen and methane together in Earth's air. Telling real biosignatures apart from non-living chemistry that mimics them is a central challenge."],"x":["The edges of the habitable zone come from climate models: too close and a runaway greenhouse effect takes over, as on Venus; too far and even lots of carbon dioxide can't keep the planet warm. For the Sun, careful estimates put the zone at roughly 0.95 to 1.7 AU. Earth served as a test: in 1990, the Galileo spacecraft looked at Earth from space and detected oxygen, methane and the reflection pattern of plants together, signs of life that could be seen from afar.\nJWST now measures exoplanet atmospheres, and NASA's planned Habitable Worlds Observatory aims to photograph Earth-like planets directly.","Being in the habitable zone doesn't make a planet habitable, let alone inhabited. The Moon is in the Sun's habitable zone and has no atmosphere at all.\nOxygen alone isn't proof of life; it can build up without biology, for example when starlight splits water and the hydrogen escapes into space. Biosignatures need context, ideally several gases that are out of chemical balance together.\nHabitable environments can exist outside the zone, like the ocean moons of the outer planets.","Can planets around red dwarfs, the most common stars, hold on to their atmospheres despite strong flares and tidal locking? How common are Earth-sized planets in the habitable zones of Sun-like stars? Which gas combinations would be convincing signs of life, and how can false alarms be ruled out? No exoplanet has shown confirmed signs of life yet."],"terms":["The range of distances from a star where a planet's surface could hold liquid water.","The fraction of incoming light that a surface reflects.","The temperature a planet would have from starlight alone, without greenhouse warming.","A substance or pattern that indicates past or present life.","Spinning once per orbit, so the same side always faces the star."],"s":"A habitable world is one where life as we know it could survive, which mainly means it can have liquid water. The habitable zone is the range of distances from a star where a planet's surface could keep liquid water, but habitability also depends on the planet's atmosphere, magnetic field, geology, the star's activity and more. Astronomers now look for biosignatures: gases or other signs in a planet's light that life might produce.","why":"Understanding habitability narrows the search for life to the most promising planets, shapes the design of future telescopes and improves our understanding of how Earth's own climate stays stable."},"seti":{"how":["The Drake equation multiplies several factors: how often stars form in the galaxy, the fraction of stars with planets, how many habitable planets each system has, the fractions of those where life appears, becomes intelligent and develops detectable technology, and how long such civilizations last. Exoplanet surveys have now measured the first three fairly well; the rest are basically unknown, so estimates range from far less than one to millions.","Radio SETI looks for narrow-band signals. Natural sources spread their energy across a wide range of frequencies, but a transmitter can pack it into a channel just a few hertz wide. Searches often focus on the quiet 'water hole' between the hydrogen line at 1,420 MHz and hydroxyl lines near 1,660 MHz. A real signal should shift in frequency in a way that matches the source planet's motion and must be confirmed by repeat observations.","Other technosignatures include laser pulses, infrared heat from giant structures, pollution gases in exoplanet atmospheres and unusual dimming patterns as objects pass in front of stars.","The Fermi paradox comes from a simple calculation: even slow space travel could spread across the galaxy in a few million years, which is short compared with the galaxy's age of over 13 billion years. Proposed explanations include: intelligent life is extremely rare; civilizations tend to fade or destroy themselves; they exist but can't be detected or aren't interested; or we just haven't searched enough."],"x":["SETI began with Frank Drake's Project Ozma in 1960, which listened to two nearby Sun-like stars. Breakthrough Listen, launched in 2015, uses large radio telescopes to survey a million nearby stars and the plane of the Milky Way, searching for signals much narrower than anything natural.\nThe 1977 'Wow! signal' is the most famous unexplained candidate, but it was never detected again. Many other candidates turned out to be human interference, from satellites to a microwave oven at Australia's Parkes Observatory.","Not finding signals yet doesn't mean we've searched thoroughly. One study compared the amount searched so far to a hot tub's worth of water out of all of Earth's oceans.\nUFO sightings are a separate topic; scientific SETI requires signals that others can independently confirm.\nThe Drake equation isn't a calculation with a known answer; several of its factors are almost completely unknown, so it frames the question instead of solving it.","Almost everything that matters is unknown: how often life starts, how often it becomes intelligent and technological, and how long civilizations last. Possible answers to the Fermi paradox range from 'life is rare' (the Rare Earth hypothesis) to civilizations being short-lived, too far apart, undetectable or uninterested. A single confirmed detection, or a much more thorough search that finds nothing, would change the debate."],"terms":["The Search for Extraterrestrial Intelligence.","Evidence of technology, such as artificial radio signals or industrial pollution.","A multiplication of factors that estimates the number of communicating civilizations in the galaxy.","The contradiction between high estimates of alien civilizations and the lack of any evidence for them.","A quiet radio band between hydrogen and hydroxyl lines, popular for SETI searches."],"s":"SETI, the search for extraterrestrial intelligence, looks for signs of technology: narrow radio signals, laser pulses or other 'technosignatures'. The Drake equation organizes what we don't know about how many communicating civilizations might exist in our galaxy, while the Fermi paradox asks why, given how old and large the galaxy is, we see no evidence of anyone. After more than 60 years of searching, no confirmed signal has been found.","why":"Detecting another intelligence would be one of the most important discoveries in human history. Even without a detection, SETI advances radio astronomy and data processing and sharpens questions about what lets planets and civilizations last."},"fusion":{"how":["Atomic nuclei are positively charged, so they repel each other strongly. This repulsion is called the Coulomb barrier. In the Sun's core, at about 15 million K, a typical proton has only a few hundredths of the energy needed to get over that barrier. Fusion still happens because of quantum tunneling: in quantum physics, a particle has a small chance of passing through a barrier it can't climb. Combined with a few unusually fast protons, that is enough to keep the Sun shining.","About 99% of the Sun's energy comes from the proton–proton chain. First, two protons fuse into deuterium, with one proton turning into a neutron and giving off a positron and a neutrino. This step depends on the weak force and is extremely slow: an average proton waits billions of years for it. Deuterium then quickly grabs another proton to make helium-3, and two helium-3 nuclei combine into helium-4, releasing two protons. Overall, four protons become one helium-4 nucleus, and about 0.7% of their mass turns into energy (26.7 MeV).","Stars heavier than about 1.3 Suns have hotter cores and mostly use the CNO cycle instead, where carbon, nitrogen and oxygen act as catalysts that help protons fuse without being used up. This cycle is extremely sensitive to temperature: its rate rises roughly as temperature to the 17th power, compared with about the 4th power for the proton–proton chain.","The energy then has to get out. In the Sun's inner 70%, light is absorbed and re-emitted in random directions over and over, so it takes tens of thousands of years or more to escape. In the outer 30%, hot gas rises and cool gas sinks, like boiling water (convection). The star stays balanced between gravity pulling in and pressure pushing out, called hydrostatic equilibrium. If the core heats up, it expands and cools, slowing fusion; if it cools, it shrinks and heats up. This natural thermostat keeps stars stable for billions of years.","Later in life, stars fuse heavier fuels. At about 100 million K, three helium nuclei combine into carbon (the triple-alpha process). Massive stars go on to fuse carbon, neon, oxygen and silicon, building elements up to iron. Fusing iron uses up energy instead of releasing it, because iron's nucleus is one of the most tightly bound. Heavier elements are made mostly by nuclei capturing neutrons, slowly in aging giant stars (the s-process) or rapidly in neutron star mergers (the r-process)."],"x":["In 1920, Arthur Eddington suggested stars are powered by hydrogen fusion, and in 1939 Hans Bethe worked out the reactions, earning the 1967 Nobel Prize. The strongest direct evidence is solar neutrinos, which only fusion produces. Ray Davis began detecting them in the 1960s, and the Borexino experiment measured neutrinos from specific steps, including the CNO cycle in 2020.\nHelioseismology, the study of how the Sun vibrates, measures the temperature and density of its core, matching fusion models.","Stars aren't burning in the chemical sense like a fire. Fusion is a nuclear process, not a chemical one.\nThe Sun's core isn't very intense per cubic meter. It produces about as much power per volume as a compost heap; the Sun is bright because its core is huge. Fusion is also very slow: a given proton waits billions of years on average before it fuses.","The 'solar abundance problem': different measurements of how much heavy elements the Sun contains don't match helioseismology data. Where exactly the heaviest elements, like gold and uranium, are made, and how much comes from neutron star mergers versus rare supernovae, is still being worked out."],"terms":["The electric repulsion between positively charged nuclei that must be overcome for fusion to happen.","A quantum effect that lets particles pass through barriers they don't have enough energy to climb over.","The main fusion process in Sun-like stars, turning four protons into one helium-4 nucleus.","A fusion cycle that uses carbon, nitrogen and oxygen as helpers; the main process in stars heavier than about 1.3 Suns.","The fusion of three helium-4 nuclei into carbon-12, at about 100 million K.","The balance between gravity pulling in and pressure pushing out that keeps a star stable."],"s":"Stars shine by fusing light atomic nuclei into heavier ones. In the Sun, hydrogen fuses into helium through the proton–proton chain, and the tiny bit of mass lost becomes energy, following E = mc². Heavier stars also use the CNO cycle, and late in life they fuse helium into carbon and onward, all the way up to iron. Elements heavier than iron are made mostly when neutron stars collide and in some supernovae.","why":"Fusion powers every star and has made nearly every element heavier than helium, including the carbon, oxygen and iron in your body. Copying it on Earth is a major energy goal: devices called tokamaks use magnetic fields, and the National Ignition Facility uses lasers, both aiming for a clean, nearly limitless power source."},"stellar-life":{"how":["Stars form inside cold, dense clouds of gas and dust. When a clump gets massive and cold enough, gravity beats its internal pressure and it collapses. Spinning material flattens into a disk around a young protostar, which heats up as it shrinks. When the center reaches about 10 million K and hydrogen fusion takes over, a star is born and joins the main sequence. Most stars are small: about three-quarters of the stars in the Milky Way are red dwarfs.","Astronomers sort stars by spectral type, O, B, A, F, G, K and M, from hottest (over 30,000 K, blue) to coolest (under about 3,700 K, red). The Sun is a G2 star. A Hertzsprung–Russell diagram plots brightness against temperature; most stars fall on a diagonal band called the main sequence, while giants, supergiants and white dwarfs sit in separate regions.","In stars below about 8 Suns, the core eventually runs out of hydrogen. Fusion moves to a shell around the core, the outer layers swell, and the star becomes a red giant. When the core reaches about 100 million K, helium starts fusing into carbon. Later, the star throws off its outer layers. The exposed hot core lights up that gas as a planetary nebula, and then slowly fades as a white dwarf.","Massive stars race through fuels, each faster than the last. For a star about 25 times the Sun's mass, models estimate about 7 million years of burning hydrogen, half a million years of helium, centuries of carbon, about a year of neon, months of oxygen and roughly a day of silicon. That builds layers like an onion around an iron core. When the core passes about 1.4 solar masses, it collapses in under a second and the star explodes as a core-collapse supernova. About 99% of the energy escapes as neutrinos.","Partner stars change things a lot. Most massive stars have a close companion, and about 70% will swap mass with it, which can strip, merge or trigger unusual explosions. At the other extreme, red dwarfs mix their insides completely, use almost all their hydrogen and live for trillions of years. None has died of old age yet."],"x":["Nobody can watch one star live its whole life, but astronomers see millions of stars at every stage. The Hertzsprung–Russell diagram shows clear patterns that match computer models of how stars change.\nStar clusters are especially useful because all their stars formed at the same time. Older clusters have already lost their most massive stars, which lets astronomers date them and test how long stars live.","The Sun won't explode as a supernova; it isn't massive enough. It will become a red giant in about 5 billion years, probably swallowing Mercury and Venus and maybe Earth.\nStars aren't simply 'burning out' when they die. A Sun-like star fuses only about 10% of its hydrogen during its main life.","Exactly how core-collapse supernovae explode is still being studied; computer simulations only recently began working reliably. Which massive stars leave black holes and which leave neutron stars, and how companion stars change their fates, are active questions."],"terms":["The long, stable part of a star's life, when it fuses hydrogen in its core.","A graph of stars' brightness against temperature that shows their life stages.","A letter (O, B, A, F, G, K, M) describing how hot a star's surface is.","A late-life star whose outer layers have swelled after its core ran out of hydrogen.","Glowing shells of gas thrown off by a dying Sun-like star; it has nothing to do with planets.","The explosive death of a star, either by its core collapsing or by a white dwarf exploding."],"s":"A star's mass decides how long it lives and how it dies. The Sun will fuse hydrogen for about 10 billion years in total, then swell into a red giant, shed its outer layers and leave behind a white dwarf. Stars more than about 8 times the Sun's mass end in core-collapse supernovae. Massive stars live only a few million years because they burn through their fuel much faster.","why":"Stellar evolution explains where the elements come from, how galaxies change chemically over time, and what will happen to our Sun and Earth. Star clusters act as cosmic clocks, and some stars, like Cepheid variables, have predictable brightness that lets us measure distances across the universe."},"compact":{"how":["Compact stars are supported by quantum mechanics. The Pauli exclusion principle says no two electrons can be in the same quantum state, so squeezing them together forces them to move faster. That creates degeneracy pressure, which doesn't depend on temperature, so a white dwarf stays supported even as it cools.","A typical white dwarf packs about 0.6 Suns of mass into a ball the size of Earth, so a teaspoon of it would weigh several tonnes. Strangely, heavier white dwarfs are smaller, because extra mass squeezes them more. At about 1.4 solar masses, the Chandrasekhar limit, the electrons can't push back hard enough. Over billions of years, white dwarfs cool and their carbon–oxygen insides crystallize. If a white dwarf gains mass from a companion or merges with another one, it can explode completely in a Type Ia supernova.","Neutron stars form when a massive star's core collapses. Electrons are forced into protons, turning them into neutrons and releasing neutrinos. The result packs about 1.2 to 2.3 Suns into a ball only 20–26 km across, denser than an atomic nucleus. Its gravity is about 100 billion times Earth's: something dropped from one meter would hit the surface at millions of meters per second.","Collapse makes neutron stars spin fast and strengthens their magnetic fields. Pulsars send beams of radio waves from their magnetic poles, which sweep past Earth once per rotation. Millisecond pulsars spin hundreds of times per second, as steadily as atomic clocks. Magnetars have the strongest magnetic fields known, up to about 10<sup>11</sup> tesla.","Neutron stars are thought to have layers: an iron crust, a region where neutrons and nuclei form strange 'nuclear pasta' shapes, and a core whose makeup is uncertain and might include free quarks."],"x":["In the early 1900s, astronomers found that Sirius B, the companion of the bright star Sirius, has about the Sun's mass packed into an Earth-sized body. Subrahmanyan Chandrasekhar calculated the white dwarf mass limit in 1930 and later won the 1983 Nobel Prize.\nJocelyn Bell Burnell discovered pulsars in 1967, and they were soon explained as spinning neutron stars. NASA's NICER mission now measures neutron-star sizes by timing X-rays from their surfaces.","Pulsars don't actually blink on and off; they send out steady beams that sweep across Earth as they spin, like a lighthouse. Some spin hundreds of times per second.\nA neutron star isn't just a huge ball of neutrons; its crust contains nuclei and electrons, and its core may hold more exotic matter.","The inner structure of neutron stars, described by what physicists call the equation of state, is uncertain. Their cores might contain free quarks or other exotic matter. The maximum mass a neutron star can have, roughly 2–2.3 Suns, isn't precisely known."],"terms":["Pressure from the Pauli exclusion principle that resists squeezing, even when the material is cold.","The maximum mass of a white dwarf, about 1.4 times the Sun's mass.","A spinning neutron star whose beams sweep past Earth in regular pulses.","A neutron star with an extremely strong magnetic field.","The explosion of a white dwarf; used as a standard candle to measure cosmic distances."],"s":"Dead star cores are held up not by heat but by quantum effects. White dwarfs, about the size of Earth, are supported by electron degeneracy pressure, up to a limit of about 1.4 Suns called the Chandrasekhar limit. Heavier cores collapse into neutron stars, held up by neutron pressure and nuclear forces. Pulsars are fast-spinning neutron stars whose beams sweep past Earth as regularly as clockwork.","why":"Compact stars let us study matter in conditions no lab can create: denser than atomic nuclei, with extreme magnetic fields and gravity. Type Ia supernovae from white dwarfs revealed that the universe's expansion is speeding up, pulsars test general relativity and detect gravitational waves, and neutron star collisions make gold and platinum."},"black-holes":{"how":["In 1916, Karl Schwarzschild found the first exact black-hole solution to Einstein's equations. For a non-spinning black hole, the event horizon is at the Schwarzschild radius, r<sub>s</sub> = 2GM/c². At 1.5 r<sub>s</sub> is the photon sphere, where light can orbit, and at 3 r<sub>s</sub> is the closest stable orbit for matter. Real black holes spin, which drags space around them. According to the 'no-hair theorem', a black hole is completely described by just its mass, spin and electric charge.","Tidal forces, the difference in gravity's pull across an object, depend on the black hole's size. Near a small black hole, they would stretch a person apart ('spaghettification') well before the horizon. Near a supermassive black hole, the tides at the horizon are gentle enough that an astronaut could cross without noticing at first. To someone watching from far away, a falling object seems to slow down, turn red and fade, never quite crossing the horizon.","There are different sizes. Stellar-mass black holes, about 5 to over 100 Suns, form when massive stars collapse or when black holes merge. Supermassive black holes, from about 100,000 to over 10 billion Suns, sit at the centers of most large galaxies. Intermediate-mass black holes in between are rare, but there is some evidence for them.","Gas falling in forms a hot, bright accretion disk. It turns about 6% to 40% of the infalling mass into energy, depending on the spin, far more than fusion's 0.7%. Feeding supermassive black holes power quasars, which can outshine their whole galaxy, and many shoot jets of particles at nearly the speed of light.","In 1974, Stephen Hawking showed that quantum effects should make black holes give off very faint radiation. For a black hole with the Sun's mass, its temperature would be about 60 billionths of a degree above absolute zero, colder than the CMB, so it actually absorbs more than it emits. Evaporating would take about 10<sup>67</sup> years or longer. Hawking radiation hasn't been observed."],"x":["Cygnus X-1, identified in the early 1970s, was the first strong black-hole candidate: an invisible companion too heavy to be a neutron star. The teams of Reinhard Genzel and Andrea Ghez tracked stars orbiting the center of the Milky Way for decades and showed about 4 million Suns' worth of mass packed into a tiny region.\nLIGO and Virgo have detected gravitational waves from many black-hole collisions, with signals that match general relativity. The Event Horizon Telescope imaged the shadow of M87* in 2019 and Sagittarius A* in 2022.","Black holes aren't cosmic vacuum cleaners. From far away, a black hole's gravity is the same as any object with the same mass. If the Sun were replaced by a black hole of equal mass, Earth's orbit wouldn't change.\nThey aren't always 'dense' in the everyday sense. The average density inside a supermassive black hole's horizon can be lower than water's.","The information paradox: Hawking showed that black holes slowly give off radiation and could evaporate, apparently destroying information about what fell in, which quantum mechanics doesn't allow. How this is resolved is still debated.\nHow supermassive black holes got so big so early is another puzzle; JWST has found huge black holes less than a billion years after the Big Bang."],"terms":["The boundary around a black hole beyond which nothing, not even light, can escape.","The predicted point of infinite density at a black hole's center, where general relativity stops working.","A spinning disk of hot gas spiraling into a black hole and giving off intense radiation.","The stretching of an object by extreme tidal forces near a black hole.","Very faint radiation that black holes are predicted to give off because of quantum effects.","The region around a spinning black hole where space is dragged so strongly that nothing can stay still."],"s":"A black hole is a region where space and time are curved so strongly that nothing, not even light, can escape from inside its event horizon. General relativity predicted them, and they have been confirmed by stars orbiting the center of our galaxy (2020 Nobel Prize), gravitational waves from black holes colliding, and images from the Event Horizon Telescope (M87* in 2019, Sagittarius A* in 2022). What happens at the very center, the singularity, is unknown and would need a theory of quantum gravity.","why":"Black holes test general relativity where gravity is strongest, shape how galaxies grow through the energy they release, and expose the biggest conflict in physics: making gravity and quantum mechanics work together. What happens to information that falls into a black hole is a central question in quantum gravity research."},"grav-waves":{"how":["In general relativity, accelerating masses make ripples in spacetime. A gravitational wave stretches space in one direction while squeezing it in the perpendicular direction, then switches. Its strength is measured as strain, the fractional change in length: about 10<sup>−21</sup> for the strongest signals reaching Earth, like changing the distance to the nearest star by the width of a human hair.","Pairs of black holes or neutron stars produce a 'chirp'. As they spiral together, the signal rises in frequency and strength, peaks when they merge, and then the new black hole 'rings down' as it settles. Comparing the signal with relativity's predictions reveals the masses, spins and distance.","LIGO's detectors, in Washington and Louisiana, are L-shaped laser interferometers with 4 km arms. A laser beam is split down both arms, bounced back, and recombined. A passing wave changes the two arm lengths differently, which changes how the light waves line up. Mirrors hang from multi-stage pendulums to block ground vibrations, and the beams travel through a huge vacuum. Virgo (Italy) and KAGRA (Japan) help pinpoint where signals come from.","Other detectors cover other frequencies. Pulsar timing arrays watch dozens of very steady pulsars for waves that take years to pass, probably from pairs of supermassive black holes. The planned space mission LISA, with arms 2.5 million km long, will detect waves from giant black hole mergers.","Highlights: GW150914, the first detection, turned about three Suns' worth of mass into gravitational-wave energy in a fraction of a second. GW170817, a neutron star collision, was also seen in gamma rays and light. It showed that gravitational waves travel at the speed of light, revealed a 'kilonova' that made heavy elements like gold, and gave an independent measurement of the universe's expansion rate."],"x":["The first evidence was indirect. In 1974, Russell Hulse and Joseph Taylor found a pair of neutron stars whose orbit shrinks exactly as expected if they lose energy to gravitational waves, earning the 1993 Nobel Prize. LIGO's direct detection in 2015 earned the 2017 Nobel Prize for Rainer Weiss, Barry Barish and Kip Thorne.\nThe 2017 neutron-star collision GW170817 was also seen as a gamma-ray burst and a kilonova, confirming that gravitational waves travel at light speed and that these collisions make heavy elements. In 2023, pulsar timing arrays reported evidence for a background of very long gravitational waves.","Gravitational waves aren't sound, even though detections are often turned into audio 'chirps' to illustrate them. They're vibrations in the shape of spacetime that travel through empty space.\nThey also aren't 'gravity waves', a term that means waves in oceans or the atmosphere.","Future detectors, including the space-based LISA (planned for the 2030s), will detect giant black-hole mergers. Open questions include what causes the pulsar timing background and whether gravitational waves from inflation exist."],"terms":["How much a passing gravitational wave changes a length, as a fraction of that length.","The rising-pitch signal of two compact objects spiraling together.","An instrument that measures tiny changes in length by combining laser beams.","A bright explosion powered by radioactive heavy elements made when neutron stars collide.","A network of very steady pulsars monitored to detect extremely long gravitational waves."],"s":"Accelerating masses send out ripples in spacetime that travel at the speed of light, as Einstein predicted in 1916. In 2015, LIGO first detected them from two black holes merging about 1.3 billion light-years away. The waves changed the length of LIGO's 4 km arms by less than a thousandth of a proton's width. Hundreds of events have been recorded since, including a neutron-star collision in 2017 that was also seen with telescopes.","why":"Gravitational waves give astronomy a new sense, separate from light. They reveal events that give off little or no light, like black hole collisions, test general relativity in its most extreme conditions, measure cosmic expansion independently, and show where heavy elements are made."},"galaxies":{"how":["Galaxies are grouped by shape. Spiral galaxies have rotating disks with spiral arms, often with a bar across the middle, and are still forming stars. Elliptical galaxies are smooth and round, made mostly of older stars with little gas. Lenticular galaxies are in between, and irregular galaxies have no clear shape. By number, small dwarf galaxies are by far the most common.","The Milky Way is a barred spiral. Its disk of stars is about 100,000 light-years across and about 1,000 light-years thick, surrounded by a much larger halo of dark matter. The Sun is about 26,000 light-years from the center and orbits at roughly 230 km/s, taking 225–250 million years for one lap, a 'galactic year'. Dozens of small galaxies orbit the Milky Way, including the Large and Small Magellanic Clouds.","Galaxies grew step by step. Small clumps of dark matter formed first and merged into bigger ones. Gas cooled inside them, settled into spinning disks and formed stars. When two large galaxies merge, their disks can be scrambled into an elliptical. Supernovae and central black holes heat and push out gas, which can slow or stop star formation.","Most large galaxies have a supermassive black hole at the center, and its mass is linked to the size of the galaxy's central bulge. When it is feeding on gas, it becomes an active galactic nucleus; the brightest ones are quasars.","On bigger scales, galaxies gather into groups, clusters of hundreds or thousands of galaxies, and superclusters. Our Local Group includes the Milky Way, Andromeda, Triangulum and dozens of dwarf galaxies. Together they form a cosmic web of filaments surrounding huge, nearly empty voids."],"x":["Until the 1920s, many astronomers thought 'spiral nebulae' were inside the Milky Way. In 1924, Edwin Hubble measured Cepheid stars in Andromeda and showed it is far outside our galaxy, proving the universe contains many galaxies.\nMapping the Milky Way is hard because we're inside it. The European Space Agency's Gaia mission has measured positions and motions of nearly 2 billion stars, revealing our galaxy's structure and its past collisions with smaller galaxies.","Galaxies are mostly empty space; stars almost never hit each other, even when galaxies merge. The Milky Way and Andromeda are expected to pass close or merge in several billion years, though recent studies give about a 50% chance of a merger within 10 billion years.\nMost of a galaxy's mass is dark matter, not stars.","How the first galaxies formed and grew so fast is an open question; JWST has found bright, massive galaxies earlier than many models expected. How a galaxy's growth is connected to the growth of its central black hole also isn't fully understood."],"terms":["A galaxy with a rotating disk and spiral arms where new stars are forming.","A smooth, rounded galaxy of mostly older stars with little gas.","A galaxy center that shines brightly because its supermassive black hole is feeding.","Our group of galaxies, including the Milky Way, Andromeda, Triangulum and many dwarf galaxies.","The giant network of galaxy filaments, clusters and empty voids.","The time it takes the Sun to orbit the Milky Way, about 225–250 million years."],"s":"Galaxies are huge systems of stars, gas, dust and dark matter held together by gravity. Most large galaxies have a supermassive black hole at the center; the Milky Way's, called Sagittarius A*, has about 4 million times the Sun's mass. Estimates of how many galaxies are in the observable universe range from about 200 billion to 2 trillion, depending on how many faint ones are counted.","why":"Galaxies are where stars form and where elements are recycled into new stars and planets. Studying them across time shows how the universe went from almost perfectly smooth to full of structure, and how dark matter, gas and black holes work together."},"exoplanets":{"how":["The transit method watches for a repeating dip in a star's brightness. How deep the dip is tells you the planet's size compared with the star; how often it repeats tells you its orbital period. Transits only happen when we see the orbit nearly edge-on, so many planets are missed. NASA's Kepler and TESS missions found most known planets this way.","The radial velocity method measures a star's tiny wobble as a planet pulls on it, using Doppler shifts in its light. Jupiter makes the Sun wobble at about 12.5 m/s; Earth makes it wobble at only about 9 cm/s. Combining a planet's size from transits with its mass from radial velocity gives its density, which shows whether it's rocky, watery or gassy.","Other methods fill in the gaps. Gravitational microlensing detects planets when a star passes in front of a more distant star and briefly magnifies it. Direct imaging blocks a star's glare to photograph young, hot giant planets. Astrometry tracks a star's tiny side-to-side motion.","The results have been surprising. The most common type of planet found is between Earth and Neptune in size, a kind our solar system doesn't have. 'Hot Jupiters', giant planets orbiting extremely close to their stars, orbit about 1% of Sun-like stars. Systems like TRAPPIST-1, with seven Earth-sized planets around a small cool star, show how different planetary systems can be.","During a transit, starlight passes through the planet's atmosphere, and gases leave fingerprints in the light. This is called transmission spectroscopy. JWST has detected carbon dioxide, water vapor, methane and sulfur dioxide in exoplanet atmospheres. Claims of possible life signs, like dimethyl sulfide on the planet K2-18 b, are still disputed."],"x":["In 1992, Aleksander Wolszczan and Dale Frail found planets orbiting a pulsar. In 1995, Michel Mayor and Didier Queloz found 51 Pegasi b around a Sun-like star using radial velocity, earning the 2019 Nobel Prize. Kepler (2009–2018) found thousands of planets using transits, and TESS continues the search.\nOther methods include gravitational microlensing and direct imaging, where a planet's light is separated from its star's glare.","'Earth-like' usually only means roughly Earth-sized and in the zone where liquid water could exist. It says little about whether the planet actually has water, air or life.\nMany early discoveries were 'hot Jupiters', which are easy to find but not typical. The most common type, between Earth and Neptune in size, doesn't exist in our solar system.","Whether any exoplanet has life is unknown. JWST has detected molecules like carbon dioxide and methane in some atmospheres; a 2023–2025 claim of possible signs of life on K2-18 b is disputed and unconfirmed."],"terms":["A planet passing in front of its star, causing a small, repeating dip in brightness.","A star's motion toward or away from us, used to detect the wobble caused by planets.","The range of distances from a star where liquid water could exist on a planet's surface.","A gas giant orbiting very close to its star, taking only days to complete an orbit.","A planet heavier than Earth but much lighter than Neptune.","Starlight filtered through a planet's atmosphere, revealing which gases are present."],"s":"Exoplanets are planets that orbit stars other than the Sun. Most are found by the transit method, where a star dims slightly as a planet passes in front of it, or by the radial velocity method, where the star wobbles from the planet's pull. Data from NASA's Kepler mission suggest most stars have planets. JWST can now study some exoplanet atmospheres, but no confirmed sign of life has been found.","why":"Exoplanets show that planets are common and that our solar system is just one of many possible arrangements. They test ideas about how planets form and move, and they are the targets in the search for life beyond Earth."},"supernovae":{"how":["Core collapse: when a massive star's iron core grows past about 1.4 Suns, it can no longer support itself. It collapses from about Earth's size to about 20 km in less than a second, reaches the density of an atomic nucleus and bounces. The resulting shock wave stalls, but a flood of neutrinos from the new neutron star carries enormous energy, about 10<sup>46</sup> joules, and enough of it gets absorbed to restart the shock and blast the star apart at thousands of kilometers per second.","Type Ia: a white dwarf made of carbon and oxygen gains mass from a companion star, or merges with another white dwarf, and runaway carbon fusion destroys it completely. Much of its light comes from radioactive nickel-56 decaying into cobalt and then iron. Their peak brightness can be worked out from how fast they fade, which makes them 'standard candles' for measuring distances across billions of light-years.","Astronomers classify supernovae by their spectra. Type I have no hydrogen lines, and Type II do. Types II, Ib and Ic are core collapses, and Type Ia is the white dwarf kind.","Supernovae spread oxygen, silicon, calcium, iron and other elements into space. Their debris expands for tens of thousands of years, heating gas, speeding up cosmic rays and squeezing clouds that may form new stars. Some radioactive atoms found in meteorites suggest a nearby supernova may have influenced the birth of our own Sun."],"x":["Chinese astronomers recorded a 'guest star' in 1054; its remains are the Crab Nebula, with a pulsar at its center. Tycho Brahe (1572) and Johannes Kepler (1604) saw the last supernovae in our galaxy visible to the naked eye. Supernova 1987A, in a nearby galaxy, was the closest in four centuries, and its burst of neutrinos confirmed core-collapse theory. Automated sky surveys now find tens of thousands of supernovae in distant galaxies every year.","A supernova isn't just a big nova. A nova is an explosion on a white dwarf's surface that leaves the star intact and can happen again; a supernova destroys the star or its core.\nA supernova would only threaten Earth if it happened within roughly 30–50 light-years, and no candidate star is that close. Betelgeuse, about 550 light-years away, poses no danger.","Exactly how a collapsing core's energy restarts the explosion is still being refined in 3D computer simulations, with neutrino heating and turbulence appearing to be key. For Type Ia supernovae, it's debated whether most come from a white dwarf feeding on a normal star or from two white dwarfs merging. A supernova in the Milky Way, expected once or twice per century, would be studied with neutrinos, gravitational waves and light at the same time."],"terms":["The explosion of a massive star whose iron core collapses into a neutron star or black hole.","The explosion of a white dwarf, used to measure cosmic distances.","An explosion on a white dwarf's surface that leaves the star intact.","The expanding cloud of debris and heated gas left behind by a supernova.","A graph of an object's brightness over time."],"s":"A supernova is a star exploding, and it can briefly outshine an entire galaxy. Core-collapse supernovae end the lives of stars more than about 8 times the Sun's mass. Type Ia supernovae are explosions of white dwarfs. Supernovae make and spread heavy elements, trigger new star formation, leave behind neutron stars, black holes and expanding clouds of debris, and help astronomers measure cosmic distances.","why":"Supernovae are a major source of heavy elements and cosmic rays, shape the structure and chemistry of galaxies, create neutron stars and black holes, and, as standard candles, revealed that the universe's expansion is speeding up."},"quasars":{"how":["Gas falling toward a supermassive black hole forms an accretion disk. Friction and magnetic turbulence heat it to hundreds of thousands of degrees, so it glows brightly in ultraviolet and visible light, while a very hot layer above it gives off X-rays. About 10% of the infalling mass turns into energy, so a quasar eating a few Suns' worth of gas per year shines at about 10<sup>39</sup> watts.","Farther out, fast-moving gas clouds, a doughnut-shaped ring of dust and slower gas each leave their own marks in the light. The 'unified model' says many types of active galaxies are the same structure seen from different angles: face-on we see the bright disk, while edge-on the dust ring hides it.","Some active galaxies shoot out jets of particles moving close to the speed of light, powered by the black hole's spin and magnetic fields, reaching hundreds of thousands of light-years. When a jet points almost directly at Earth, the object is called a blazar, and it looks extremely bright and changes quickly.","Quasars are useful tools. Their light passes through gas clouds on the way to us, which leave absorption lines that map hydrogen across the universe. Quasars magnified by gravitational lensing help measure the expansion rate, and the most distant ones show when the universe's hydrogen became ionized. Because they're so far away that they barely move on the sky, they also serve as fixed reference points for navigation."],"x":["In 1963, Maarten Schmidt realized that the strange spectrum of a star-like radio source, 3C 273, showed hydrogen lines redshifted by 16%, putting it about 2.4 billion light-years away. To look that bright from so far, it had to be incredibly powerful. Its brightness changed over months, so it had to be smaller than about a light-month across. Only a supermassive black hole feeding on gas could make so much power in such a small space. Quasars are now known from less than 800 million years after the Big Bang.","Quasars aren't stars; the name comes from 'quasi-stellar radio source', because they looked like stars in early telescopes.\nThe black hole itself doesn't glow; the light comes from gas heated to extreme temperatures as it spirals in.\nQuasars are mostly very far away because they were most common about 10 billion years ago, when galaxies had more gas to feed their black holes. None is close to us today.","How did black holes with a billion Suns' worth of mass form within a few hundred million years of the Big Bang? Did they start out big, or grow unusually fast from smaller black holes? JWST has found many small, compact red objects in the early universe, nicknamed 'little red dots', whose nature, possibly growing black holes, is debated. How quasar energy shuts down star formation is also an active question."],"terms":["An extremely bright active galactic nucleus powered by a feeding supermassive black hole.","An active galaxy whose jet points almost directly toward Earth.","A narrow beam of particles moving close to the speed of light, launched near a black hole.","The idea that different types of active galaxies are the same structure seen from different angles.","Many hydrogen absorption lines in a quasar's light, caused by gas clouds between us and the quasar."],"s":"Quasars are the brightest long-lasting objects in the universe: supermassive black holes swallowing gas so fast that the disk of gas around them outshines their entire galaxy, sometimes by a thousand times. They're the brightest type of active galactic nucleus, a family that also includes Seyfert galaxies and blazars. Seen across billions of light-years, they light up the early universe and show how black holes and galaxies grew together.","why":"Quasars reveal how supermassive black holes grew, show that black hole energy controls star formation in galaxies, and act as distant beacons for mapping gas between galaxies, testing cosmology and measuring Earth's orientation in space."},"newton":{"how":["Newton's first law: an object stays still or keeps moving at a constant velocity unless a net force acts on it. Mass measures how much an object resists changes in its motion (inertia). The second law: net force equals mass times acceleration, F = ma. The third law: forces come in equal and opposite pairs acting on different objects. A rocket pushes exhaust backward, and the exhaust pushes the rocket forward.","Universal gravitation says every mass attracts every other mass with a force F = Gm<sub>1</sub>m<sub>2</sub>/r². Newton proved that a round object pulls as if all its mass were at its center. From these laws he derived Kepler's three laws of planetary motion: orbits are ellipses; a planet sweeps out equal areas in equal times, moving faster when closer to the Sun; and the square of the orbital period is proportional to the cube of the orbit's size, T² = 4π²a³/GM. That last rule lets astronomers 'weigh' planets, stars and black holes by watching things orbit them.","Orbits follow directly. The speed for a circular orbit is √(GM/r), and escape speed is √2 times larger. Spacecraft change orbits with carefully timed engine burns. In any two-body system, there are five Lagrange points where a small object can stay in a fixed position relative to both; JWST orbits near the Sun–Earth L2 point, about 1.5 million km from Earth.","Tides come from the difference in gravity across an object. The Moon pulls the near side of Earth harder than the center, and the center harder than the far side, creating two bulges of water. Tidal friction slows Earth's spin, making the day about 2 milliseconds longer each century, and pushes the Moon away by about 3.8 cm per year.","Newton's physics fails at speeds close to light (special relativity), in strong gravity (general relativity) and at the scale of atoms (quantum mechanics). Within its range, it's extremely accurate and is still the main tool for engineering and nearly all spaceflight."],"x":["Newton published his laws in the Principia in 1687, using them to derive Kepler's laws of planetary motion. A huge success came in 1846, when Urbain Le Verrier used unexplained wobbles in Uranus's orbit to predict where an unknown planet should be, and Neptune was found within a degree of that spot.\nIn 1798, Henry Cavendish measured the gravitational constant G with a delicate twisting balance, which let him calculate Earth's mass.","Astronauts in orbit aren't weightless because there's no gravity. At the International Space Station's height, gravity is about 90% as strong as on the ground. They float because they're constantly falling around Earth.\nHeavier objects don't fall faster in a vacuum; all objects speed up at the same rate. Apollo 15 astronaut David Scott demonstrated this on the Moon by dropping a hammer and a feather together.","G is the least precisely known fundamental constant; different high-precision experiments disagree slightly. Some galaxy data have led to proposals to modify Newton's gravity (MOND), though most physicists favor dark matter."],"terms":["An object's resistance to changes in its motion, measured by its mass.","The total of all forces acting on an object.","Three laws describing planetary orbits: ellipses, equal areas in equal times, and T² ∝ a³.","The minimum speed needed to escape an object's gravity without any more pushing.","A position where a small object can stay fixed relative to two larger orbiting bodies.","The difference in gravitational pull across an object."],"s":"Newton's three laws of motion and his law of universal gravitation describe everyday motion and planetary orbits very accurately. They're an approximation of relativity that works well when speeds are much slower than light and gravity is weak. NASA still steers most spacecraft using Newton's physics plus small corrections from relativity.","why":"Newton's laws are the foundation of mechanical engineering, architecture and spaceflight. They allow precise predictions of where planets will be, when eclipses will happen and how spacecraft will travel. They were also the first proof that the same physical laws work on Earth and in space."},"conservation":{"how":["Energy comes in many forms: kinetic (motion), gravitational and elastic potential, thermal, chemical, nuclear and light. In an isolated system it changes form, but the total stays the same. In thermodynamics, this is the first law: the change in a system's internal energy equals the heat added minus the work it does.","Momentum, mass times velocity, is conserved whenever no outside force acts. It explains recoil, collisions and rockets. A rocket speeds up by throwing mass backward, and the rocket equation, Δv = v<sub>e</sub> ln(m<sub>0</sub>/m<sub>f</sub>), shows why reaching orbit requires a vehicle that's mostly fuel. In elastic collisions, kinetic energy is also conserved; in inelastic collisions, some turns into heat or bending, but momentum is always conserved.","Angular momentum is the spinning version of momentum, L = Iω (moment of inertia times spin rate). When a spinning object pulls inward, it spins faster. A figure skater pulling in her arms, a collapsing star core becoming a fast-spinning neutron star, and a collapsing gas cloud flattening into a disk all show this. It also explains why planets move faster when they're closer to the Sun.","Particle physics adds more conservation laws, including electric charge, which has never been seen to change. Apparent violations have led to discoveries: in 1930, energy seemed to go missing in beta decay, which led Wolfgang Pauli to propose the neutrino.","Emmy Noether's 1918 theorem explains why these laws exist: every continuous symmetry of physical laws corresponds to a conserved quantity. Laws that don't change over time give energy conservation; laws that don't change from place to place give momentum conservation; and laws that don't change with direction give angular momentum conservation."],"x":["Conservation of energy was established in the 1840s by James Joule, Julius von Mayer and Hermann von Helmholtz, who showed that mechanical work and heat can turn into each other. Emmy Noether's 1918 theorem gave the deep reason behind conservation laws.\nThese laws are tested constantly in particle collisions, where the energy, momentum and charge of the particles coming out always balance those going in.","'Conserved' in physics doesn't mean the same as 'conserving energy' in everyday life (saving it). Energy is always conserved; what gets wasted is useful energy, as it spreads out as heat.\nMass alone isn't strictly conserved; mass and energy together are.","How to define the tot
