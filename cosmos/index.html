ub> and h<sub>×</sub>) propagating at c. They stretch and squeeze proper distances perpendicular to the propagation direction in a quadrupolar pattern, so a ring of test masses oscillates into ellipses.","Mass conservation forbids monopole radiation, and momentum conservation forbids dipole radiation, so the leading emission is quadrupolar:<span class=\"eq\"><span class=\"eql\">h<sub>ij</sub> ≈ (2G / c⁴r) Ï<sub>ij</sub></span><span class=\"eql\">L<sub>GW</sub> = (G/5c⁵)⟨I⃛<sub>ij</sub>I⃛<sup>ij</sup>⟩</span></span>where I<sub>ij</sub> is the reduced (traceless) mass quadrupole. The factor G/c⁵ ≈ 3 × 10<sup>−53</sup> W<sup>−1</sup> makes laboratory sources hopeless; only compact, relativistic astrophysical masses radiate detectably.","For a circular binary, radiation reaction shrinks the orbit, and the frequency f (twice the orbital frequency) rises as<span class=\"eq\"><span class=\"eql\">ḟ = (96/5) π<sup>8/3</sup> (Gℳ/c³)<sup>5/3</sup> f<sup>11/3</sup></span></span>where the chirp mass ℳ = (m<sub>1</sub>m<sub>2</sub>)<sup>3/5</sup>/(m<sub>1</sub> + m<sub>2</sub>)<sup>1/5</sup> is measured precisely from the phase evolution. The full signal has inspiral, merger and ringdown phases; ringdown quasinormal-mode frequencies depend only on the final mass and spin, allowing 'black hole spectroscopy'.","Ground-based detectors are Michelson interferometers with 4 km (LIGO) or 3 km (Virgo, KAGRA) Fabry–Pérot arms storing about 400 kW of circulating power. They reach strain sensitivity of about 4 × 10<sup>−24</sup> Hz<sup>−1/2</sup> near 100 Hz, corresponding to measuring arm-length changes of about 10<sup>−19</sup> m. Seismic noise limits low frequencies, while quantum shot noise limits high frequencies; squeezed vacuum injection now reduces quantum noise. Since the signal amplitude falls as 1/r, doubling sensitivity increases the surveyed volume eightfold.","Different frequency bands require different detectors. Pulsar timing arrays (NANOGrav, EPTA, PPTA, CPTA, MeerKAT) correlate arrival-time residuals of millisecond pulsars to detect nanohertz waves through the Hellings–Downs angular correlation. The space mission LISA (ESA, adopted 2024, launch planned around 2035) will cover millihertz frequencies from massive black hole binaries and galactic white-dwarf binaries. The CMB B-mode program seeks primordial waves at about 10<sup>−17</sup> Hz."],"m":["When really heavy things like black holes move around fast, they make ripples in space itself, a bit like a boat making waves on a lake. These ripples travel at the speed of light and stretch and squeeze everything they pass through, including you!","By the time they reach Earth, the ripples are unbelievably tiny. A gravitational wave might change the length of a 4 km tunnel by about a thousandth of a proton's width.","To catch them, LIGO uses lasers sent down two long tunnels at right angles. The light bounces back and forth, and when a wave passes, one tunnel stretches while the other squeezes, so the light patterns change. The mirrors hang from special shock-absorbing systems to block out tiny shakes like passing trucks and ocean waves.","When two black holes spiral together, the signal rises in pitch like a bird's 'chirp'. In 2017, scientists caught two neutron stars crashing and also saw the explosion with telescopes. That crash made heavy elements like gold and platinum."]},"why":{"s":"Gravitational waves carry information that light cannot: the masses and spins of black holes that are otherwise dark, the internal structure of neutron stars via tidal deformation, and the dynamics of strong-field gravity. They provide 'standard sirens', distances calibrated by general relativity alone, enabling independent H<sub>0</sub> measurements. GW170817 confirmed that gravitational waves travel at c to within one part in 10<sup>15</sup>, ruling out many modified-gravity dark-energy models.","m":"It's like astronomy suddenly got ears. We can now 'hear' black holes colliding, which we could never see with telescopes."},"terms":[["Strain","h = ΔL/L, the fractional change in proper separation; typical for LIGO sources at Earth, 10<sup>−22</sup>–10<sup>−21</sup>.","How much a gravitational wave stretches things."],["Chirp","The inspiral signal's frequency and amplitude sweep upward; its rate determines the chirp mass ℳ.","The rising 'whoop' sound of a black hole crash."],["Interferometer","A device measuring phase differences between beams in two arms; LIGO adds Fabry–Pérot cavities, power and signal recycling, and squeezed light.","A laser ruler for measuring super-tiny changes."],["Kilonova","A transient powered by radioactive decay of r-process nuclei in merger ejecta, about 10<sup>3</sup> times brighter than a nova; observed as AT2017gfo.","The glow from neutron stars crashing and making gold."],["Pulsar timing array","A set of millisecond pulsars timed to ~100 ns over decades, sensitive to nanohertz gravitational waves through correlated timing residuals.","Using spinning stars as a galaxy-sized detector."]]},"galaxies":{"how":{"s":["Galaxies form inside dark matter halos. Gas falling into a halo is shock-heated to the virial temperature T<sub>vir</sub> ≈ μm<sub>p</sub>v<sub>c</sub>²/2k and then must cool radiatively. Cooling is efficient when t<sub>cool</sub> < t<sub>ff</sub> ≈ (Gρ)<sup>−1/2</sup>; this favors halo masses of about 10<sup>11</sup>–10<sup>12</sup> M<sub>☉</sub>, explaining why the stellar-to-halo mass ratio peaks there at only about 3%. Below this mass, supernova feedback ejects gas; above it, AGN feedback keeps hot halos from cooling.","Disks form because cooling gas conserves its specific angular momentum, acquired from tidal torques (dimensionless spin parameter λ ≈ 0.035). Disks typically have exponential surface brightness profiles Σ(R) ∝ e<sup>−R/R<sub>d</sub></sup>. Spiral arms are density waves (Lin–Shu theory) or transient, swing-amplified features, and bars redistribute angular momentum. Ellipticals are pressure-supported by random stellar motions and follow de Vaucouleurs (Sérsic n ≈ 4) profiles; they form largely through mergers.","Star formation follows the Kennicutt–Schmidt relation, Σ<sub>SFR</sub> ∝ Σ<sub>gas</sub><sup>1.4</sup>: only about 1% of molecular gas forms stars per free-fall time. Star-forming galaxies form a 'main sequence' in star formation rate versus stellar mass, while quenched galaxies are red and passive; the population is bimodal in color. The cosmic star formation rate density peaked at z ≈ 2 ('cosmic noon') and has since declined by a factor of about 10.","Scaling relations encode formation physics. The Tully–Fisher relation (L ∝ v<sub>c</sub><sup>~4</sup>) for spirals and the fundamental plane for ellipticals follow from the virial theorem combined with roughly constant mass-to-light ratios. The M<sub>BH</sub>–σ relation, M<sub>BH</sub> ∝ σ<sup>4–5</sup>, links central black holes to bulge kinematics far beyond the black hole's sphere of influence, implying coevolution through feedback.","Galaxies cluster hierarchically. The Milky Way and Andromeda dominate the Local Group (about 100 galaxies within about 3 Mpc), part of the Virgo Supercluster and of the larger Laniakea basin of attraction. Galaxy clusters (10<sup>14</sup>–10<sup>15</sup> M<sub>☉</sub>) contain hot intracluster gas at 10⁷–10⁸ K, which holds more baryons than their stars. Filaments connecting clusters trace the cosmic web, and much of the remaining 'missing' baryons reside in warm-hot filamentary gas."],"m":["Galaxies come in different shapes. Spiral galaxies look like pinwheels and are busy making new stars. Elliptical galaxies look like fuzzy footballs and are full of old stars. Irregular galaxies are messy blobs. The most common kind of all are small 'dwarf' galaxies.","Our home, the Milky Way, is a spiral with a bar across its middle. It's about 100,000 light-years wide but pretty thin, like two dinner plates stacked together. The Sun zooms around the center at about 230 km per second, yet one lap still takes about 230 million years. The last time the Sun was in this spot, the first dinosaurs were just appearing!","Galaxies grow by eating smaller galaxies. Our Milky Way has swallowed several dwarf galaxies in the past, and it will merge with the Andromeda galaxy in the far future.","Galaxies aren't scattered randomly. They form a giant cosmic web, with long strings of galaxies around huge empty bubbles, like a sponge or the foam on a bubble bath."]},"why":{"s":"Galaxies are the visible tracers of large-scale structure, the sites of nearly all star and planet formation, and the cosmic factories of heavy elements. Their properties test models of dark matter (through rotation curves and satellite counts), of feedback physics and of cosmology (through clustering and BAO). The Milky Way provides a uniquely detailed case: Gaia's six-dimensional phase-space map of over a billion stars reveals its accretion history and its dark matter distribution.","m":"Galaxies are where stars, planets and life happen. Studying them tells us how our cosmic home formed."},"terms":[["Spiral galaxy","A rotationally supported disk with spiral arms, usually with a central bulge and often a bar; actively star-forming. About 60% of nearby massive galaxies.","A pinwheel-shaped galaxy."],["Elliptical galaxy","A pressure-supported, ellipsoidal system of mostly old stars with little cold gas; dominant in galaxy clusters.","A smooth, egg-shaped galaxy of old stars."],["Active galactic nucleus","A galaxy center whose luminosity is dominated by accretion onto a supermassive black hole, sometimes outshining the host (quasars, Seyferts, blazars).","A galaxy whose central black hole is glowing while it eats."],["Local Group","The gravitationally bound group of about 100 galaxies within about 3 Mpc dominated by the Milky Way and M31; it will eventually merge into one elliptical.","Our galaxy's neighborhood."],["Cosmic web","The network of filaments, sheets, nodes (clusters) and voids into which matter organizes under gravity, seen in galaxy surveys and simulations.","The giant web pattern that galaxies form."],["Galactic year","The Sun's orbital period around the Galactic Center, about 230 million years at R ≈ 8.2 kpc and v ≈ 230 km/s.","One lap of the Sun around our galaxy."]]},"exoplanets":{"how":{"s":["A transit dims the star by depth δ ≈ (R<sub>p</sub>/R<sub>*</sub>)², which is 0.01% for Earth crossing the Sun and 1% for Jupiter. The geometric transit probability is about R<sub>*</sub>/<i>a</i> (0.5% for an Earth analog). Transit duration and shape constrain the impact parameter and stellar density, and transit-timing variations reveal gravitational interactions between planets, giving masses. Kepler (2009–2018) and TESS (since 2018) found most known planets this way.","Radial velocity measures the stellar reflex motion along the line of sight:<span class=\"eq\"><span class=\"eql\">K = (2πG/P)<sup>1/3</sup> m<sub>p</sub> sin <i>i</i></span><span class=\"eql\">/ [M<sub>*</sub><sup>2/3</sup> √(1 − e²)]</span></span>for m<sub>p</sub> ≪ M<sub>*</sub>. Jupiter induces 12.5 m/s on the Sun and Earth only 9 cm/s. Spectrographs such as ESPRESSO and NEID achieve about 0.3–1 m/s precision, now limited by stellar activity ('jitter'), not instruments. Combined transit and RV data give bulk density.","Other methods probe different regimes. Gravitational microlensing detects cold planets at a few AU and free-floating planets. Direct imaging, using coronagraphs and adaptive optics, finds young, self-luminous giant planets at tens of AU, at contrasts of 10<sup>−5</sup>–10<sup>−6</sup> in the infrared. Gaia astrometry, with DR4 expected in December 2026, should reveal thousands of giant planets through stellar wobble.","Population statistics reveal structure. A deficit of planets near 1.5–2 Earth radii, the 'radius valley', separates rocky super-Earths from volatile-rich sub-Neptunes, consistent with photoevaporation or core-powered loss of H/He envelopes. Hot Jupiters orbit about 1% of Sun-like stars, and giant-planet occurrence rises steeply with stellar metallicity, supporting core accretion. M dwarfs host more small planets per star than Sun-like stars.","Transmission spectroscopy measures wavelength-dependent transit depth: the atmosphere adds an annulus whose effective height is a few scale heights H = kT/μg, giving signals of order 2HR<sub>p</sub>/R<sub>*</sub>². Emission spectra and phase curves map temperature structure. JWST detected CO<sub>2</sub> in WASP-39 b and SO<sub>2</sub> produced by photochemistry; for temperate rocky M-dwarf planets such as TRAPPIST-1 b and c, thermal emission favors thin or absent atmospheres."],"m":["Planets around other stars are almost impossible to see directly because their stars are millions to billions of times brighter. So astronomers use clever tricks.","Trick 1, the shadow: when a planet passes in front of its star, the star gets a tiny bit dimmer. Measuring the dip tells us how big the planet is. Trick 2, the wobble: a planet's gravity makes its star wobble back and forth a little. Earth makes the Sun wobble only about 9 centimeters per second, slower than a crawling baby!","Using both tricks together, we can find how heavy and how big a planet is, which tells us if it's rocky like Earth or puffy like Neptune.","The most common planets out there are a size we don't even have in our solar system: bigger than Earth but smaller than Neptune. One famous system, TRAPPIST-1, has seven Earth-sized planets packed close to a small red star.","When a planet passes in front of its star, some starlight shines through its air. Different gases leave different 'fingerprints' in that light. The James Webb Space Telescope is now reading these fingerprints, looking for gases that could hint at life."]},"why":{"s":"Exoplanets establish the statistical context of the Solar System, test planet formation theory and define the targets for searches for life. They show that planetary systems are common, that compact multi-planet systems and sub-Neptunes, absent from the Solar System, are typical, and that migration is important. Atmospheric spectroscopy is turning exoplanet science into comparative planetology, with direct imaging of Earth analogs the long-term goal of NASA's planned Habitable Worlds Observatory.","m":"They help answer one of the biggest questions ever: are we alone in the universe?"},"terms":[["Transit","Passage of a planet across its star's disk, producing a periodic dip of depth ≈ (R<sub>p</sub>/R<sub>*</sub>)².","When a planet passes in front of its star."],["Radial velocity","Line-of-sight stellar velocity measured from Doppler shifts of spectral lines; yields m<sub>p</sub> sin <i>i</i>.","The star's back-and-forth wobble."],["Habitable zone","The range of orbital distances where a planet with an Earth-like atmosphere could sustain surface liquid water; for the Sun roughly 0.95–1.67 AU, depending on the climate model and on conservative or optimistic limits.","The 'not too hot, not too cold' zone around a star."],["Hot Jupiter","A gas giant with an orbital period under about 10 days and T<sub>eq</sub> ≳ 1,000 K; many are inflated beyond structure-model radii.","A giant planet super close to its star."],["Super-Earth","A planet of about 1–1.7 Earth radii, likely rocky; distinct from sub-Neptunes above the radius valley.","A planet bigger than Earth but smaller than Neptune."],["Transmission spectrum","The wavelength-dependent transit depth caused by absorption in the planet's limb atmosphere, revealing composition and haze.","Starlight that shows what a planet's air is made of."]]},"special-rel":{"how":{"s":["For frames in standard configuration with relative velocity v along x, the Lorentz transformation is<span class=\"eq\"><span class=\"eql\">t′ = γ(t − vx/c²)</span><span class=\"eql\">x′ = γ(x − vt)</span></span>with γ = 1/√(1 − β²) and β = v/c. The term vx/c² shows that events simultaneous in one frame are not simultaneous in another. Composing two boosts gives the velocity-addition law u′ = (u − v)/(1 − uv/c²), which never yields speeds above c; rapidities φ = artanh β add linearly.","A moving clock runs slow relative to a frame's synchronized clocks: Δt = γΔτ, where τ is proper time measured by the clock itself. A moving rod is contracted along its motion: L = L<sub>0</sub>/γ. These effects are symmetric between frames; the apparent paradoxes dissolve once relativity of simultaneity is included. In the twin paradox, the traveling twin's worldline is not inertial throughout, and the proper time along it, τ = ∫√(1 − v²/c²) dt, is shorter.","Minkowski (1908) recast the theory geometrically. Events are points in four-dimensional spacetime, and the invariant interval is<span class=\"eq\"><span class=\"eql\">Δs² = −c²Δt² + Δx² + Δy² + Δz²</span></span>Negative Δs² (timelike) means one event can causally influence the other, and the time order is the same for all observers; positive (spacelike) means no signal can connect them and their order is frame-dependent; zero (null) describes light rays.","Physical quantities combine into four-vectors with Lorentz-invariant magnitudes. The four-momentum p<sup>μ</sup> = (E/c, <b>p</b>) satisfies p<sup>μ</sup>p<sub>μ</sub> = −m²c², giving E² = (pc)² + (mc²)², with E = γmc² and <b>p</b> = γm<b>v</b>. Massless particles have E = pc and must move at c. The electric and magnetic fields combine into the field tensor F<sup>μν</sup>, so a pure electric field in one frame has a magnetic component in another; Maxwell's equations are already Lorentz covariant.","Relativistic kinematics is routine in particle physics. Muons produced at about 15 km altitude with γ ≈ 20–40 survive to sea level despite a proper lifetime of 2.2 μs. At the LHC, 6.8 TeV protons have γ ≈ 7,250 and v = c(1 − 9.5 × 10<sup>−9</sup>). Synchrotron radiation, threshold energies for particle production (computed from the invariant mass √s) and the Doppler shift f′ = f√[(1 + β)/(1 − β)] all follow from the same transformations."],"m":["Einstein discovered that space and time are woven together into one thing, called spacetime. How much time passes, and how long things are, depends on how fast you're moving. But everyone always agrees on the speed of light.","Imagine lightning hits both ends of a speeding train at once, as seen by someone on the platform. A passenger in the middle of the train is rushing toward one flash and away from the other, so for them, the strikes don't happen at the same time! 'At the same time' depends on who's watching.","Speeds don't add up the normal way. If a rocket going 90% of light speed fires a probe forward at 90% of light speed, the probe doesn't go 180%. It goes about 99.4%. Nothing with mass can ever reach light speed, because it would take infinite energy.","Here's a surprise: magnetism is partly an effect of relativity! When electric charges move through a wire, relativity changes how their electric forces look from different viewpoints, and that shows up as magnetism. Every electric motor depends on it."]},"why":{"s":"Special relativity is the kinematic framework for all fundamental physics except gravity: quantum field theories are built to be Lorentz invariant, and the CPT theorem and spin–statistics connection depend on it. Its practical consequences range from accelerator design and GPS timing to the energy release in nuclear reactions. Tests of Lorentz invariance remain an active probe for quantum-gravity effects.","m":"Without relativity we wouldn't understand nuclear energy, particle colliders or even how electric motors really work."},"terms":[["Reference frame","A coordinate system plus synchronized clocks; inertial frames are those in which free particles move uniformly.","The point of view you're measuring from."],["Lorentz factor (γ)","γ = 1/√(1 − v²/c²), the factor governing time dilation, length contraction and relativistic energy E = γmc².","A number that tells how much time slows at a certain speed."],["Proper time","τ, the time measured by a clock along its own worldline, dτ = dt/γ; Lorentz invariant.","The time on your own wristwatch."],["Spacetime interval","Δs² = −c²Δt² + |Δ<b>x</b>|², invariant under Lorentz transformations; its sign classifies event pairs as timelike, null or spacelike.","A 'distance' in spacetime that everyone agrees on."],["Light cone","The null cone Δs² = 0 through an event, separating its causal future and past from events it cannot influence.","All the places and times you could ever send a message to."]]},"emc2":{"how":{"s":["Einstein's 1905 argument considered a body emitting two equal light pulses in opposite directions. Analyzing the energy in a moving frame, he showed that the body's mass decreased by L/c², where L is the energy emitted. In modern language, the invariant mass of a system is defined by<span class=\"eq\"><span class=\"eql\">M²c⁴ = E<sub>tot</sub>² − |<b>p</b><sub>tot</sub>|²c²</span></span>so a system's rest mass includes the kinetic and potential energy of its parts, as measured in its center-of-momentum frame.","Nuclear binding energy appears as a mass defect: B = [Zm<sub>p</sub> + Nm<sub>n</sub> − M(A,Z)]c². For ⁴He, B = 28.3 MeV, about 0.75% of its mass. The binding energy per nucleon peaks near ⁶²Ni and ⁵⁶Fe at about 8.8 MeV, which is why fusion of light nuclei and fission of heavy nuclei both release energy. The semi-empirical (Bethe–Weizsäcker) formula models B(A,Z) with volume, surface, Coulomb, asymmetry and pairing terms.","Energy release is the mass difference between initial and final states. Fission of ²³⁵U releases about 200 MeV (0.09% of the mass), D–T fusion 17.6 MeV (0.38%), and matter–antimatter annihilation 100%. Chemical reactions obey the same rule, but at the 10<sup>−10</sup> level: forming a mole of water from hydrogen and oxygen reduces the mass by about 3 ng, far below routine measurement.","In particle physics, rest energies are the natural units: m<sub>e</sub>c² = 0.511 MeV, m<sub>p</sub>c² = 938.27 MeV. Pair production γ → e<sup>+</sup>e<sup>−</sup> requires E<sub>γ</sub> ≥ 2m<sub>e</sub>c² and a nearby nucleus to conserve momentum. The threshold for producing final-state mass ΣM in a collision follows from the invariant √s ≥ ΣMc². Only about 1% of the proton's mass comes from the Higgs-generated quark masses; the rest is QCD field energy and quark kinetic energy, through E = mc².","Mass is not 'converted' into energy as if they were different substances. Energy is conserved; what changes is the form it takes, from rest energy of constituents to kinetic energy or radiation. A hot object, compressed spring or charged battery is slightly heavier than when cold, relaxed or discharged, by ΔE/c². Photons are massless individually, but a box of photons has inertial mass E/c² because their momenta sum to zero while their energies add."],"m":["Mass and energy are two forms of the same thing. That means energy has a tiny bit of mass: a hot cup of cocoa weighs a teeny bit more than the same cup cold, and a charged phone battery weighs a teeny bit more than a dead one. The difference is far too small to measure on a scale.","When protons and neutrons stick together into a nucleus, the result weighs slightly less than the separate pieces. The 'missing' mass is released as energy. That's how the Sun and nuclear power plants work.","Here's a wild fact: almost all of your weight comes from energy! The quarks inside each proton and neutron are very light. Most of a proton's mass comes from the energy of the forces holding the quarks together.","It works backward too: energy can turn into matter. Particle colliders smash things together so hard that the energy becomes brand-new particles. Hospitals use the reverse in PET scans, where matter and antimatter meet, turn into flashes of energy, and help doctors see inside your body."]},"why":{"s":"E = mc² explains stellar power, nuclear energy and weapons, radioactive heating of Earth's interior, and the mass of ordinary matter itself, which is dominated by strong-interaction energy rather than fundamental particle masses. It allows particle accelerators to create new particles from kinetic energy, the basis for discovering the W, Z and Higgs bosons. It also sets the energy accounting in astrophysics, from accretion efficiencies to the gravitational-wave energy radiated by black hole mergers.","m":"It explains sunlight, nuclear power, medical PET scans and even why you weigh what you do."},"terms":[["Rest energy","E<sub>0</sub> = mc², the energy of a system in its center-of-momentum frame, including the internal kinetic and potential energy of its parts.","The energy locked inside something's mass."],["Mass defect","Δm = Σm<sub>parts</sub> − M<sub>bound</sub>, the mass by which a bound system is lighter than its separated constituents; equal to B/c².","The bit of mass that 'goes missing' when particles stick together."],["Binding energy","The energy required to separate a bound system into its constituents; for nuclei, about 8 MeV per nucleon over most of the periodic table.","The energy holding an atom's center together."],["Annihilation","A particle–antiparticle pair converting into other particles, often photons, conserving four-momentum; e<sup>+</sup>e<sup>−</sup> at rest yields two 511 keV photons.","When matter and antimatter meet and turn into pure energy."],["Pair production","Creation of a particle–antiparticle pair from energy, for example γ + nucleus → e<sup>+</sup>e<sup>−</sup> + nucleus, with threshold 2m<sub>e</sub>c² (plus recoil).","When energy turns into a pair of new particles."]]},"general-rel":{"how":{"s":["The equivalence principle states that locally, a freely falling frame is indistinguishable from an inertial frame in the absence of gravity. Gravity therefore cannot be a force in the usual sense, and its effects are encoded in a metric g<sub>μν</sub> that determines proper time and distance, ds² = g<sub>μν</sub>dx<sup>μ</sup>dx<sup>ν</sup>. Free particles extremize proper time along geodesics:<span class=\"eq\"><span class=\"eql\">d²x<sup>μ</sup>/dτ² + Γ<sup>μ</sup><sub>αβ</sub> (dx<sup>α</sup>/dτ)(dx<sup>β</sup>/dτ) = 0</span></span>The Christoffel symbols Γ, built from derivatives of g, play the role of the gravitational field.","Curvature is the part of gravity that cannot be transformed away: tidal effects measured by the Riemann tensor R<sup>ρ</sup><sub>σμν</sub>. Nearby geodesics deviate according to D²ξ<sup>μ</sup>/dτ² = −R<sup>μ</sup><sub>νρσ</sub>u<sup>ν</sup>ξ<sup>ρ</sup>u<sup>σ</sup>. The Einstein tensor G<sub>μν</sub> = R<sub>μν</sub> − ½Rg<sub>μν</sub> is the unique combination that is divergence-free, ensuring local energy–momentum conservation ∇<sub>μ</sub>T<sup>μν</sup> = 0.","In the weak-field, slow-motion limit, g<sub>00</sub> ≈ −(1 + 2Φ/c²) and the geodesic equation reduces to Newton's law with ∇²Φ = 4πGρ. Corrections appear at order Φ/c² ≈ 10<sup>−8</sup> in the Solar System, organized by the parametrized post-Newtonian (PPN) formalism. General relativity predicts PPN parameters γ = β = 1. Gravitational time dilation is Δτ/τ ≈ ΔΦ/c², about 4 × 10<sup>−16</sup> per meter of height near Earth's surface.","Classic predictions follow from the Schwarzschild solution. Mercury's perihelion advances by<span class=\"eq\"><span class=\"eql\">Δφ = 6πGM / [c²<i>a</i>(1 − e²)]</span><span class=\"eql\">≈ 43″ per century</span></span>Light grazing the Sun is deflected by 4GM/(c²b) = 1.75″, twice the Newtonian value, because space curvature (γ) contributes equally with time curvature. Radar signals passing the Sun are delayed by up to about 200 μs (Shapiro delay).","Rotating masses drag inertial frames (gravitomagnetism). Gravity Probe B (2011) measured Earth's frame-dragging precession of 37 milliarcseconds per year to 19% and geodetic precession of 6.6 arcseconds per year to 0.3%; LAGEOS satellite ranging also confirms frame dragging. In strong fields the full nonlinear theory is needed: numerical relativity solved the binary black hole problem in 2005, enabling the waveform models used in gravitational-wave detection."],"m":["Imagine you're in an elevator with no windows. If it's sitting still on Earth, you feel your normal weight. If it's floating in space but speeding up like a rocket, you'd feel exactly the same! Einstein realized gravity and acceleration are basically the same thing. And if the elevator's cable snapped, you'd float, just like astronauts do in orbit.","Einstein's big idea: heavy things bend space and time. Other things then follow the bends, like marbles rolling on a curved surface. The famous 'bowling ball on a trampoline' picture helps, but there's a twist: mostly, it's time that bends. Clocks tick slower close to heavy objects, and things naturally move toward where time runs slower. That's what falling is!","This is real and measurable. A clock on the floor ticks very slightly slower than one on a table. Scientists have even measured the difference across a distance of one millimeter!","Gravity also bends light. Huge galaxy clusters act as giant magnifying glasses, letting telescopes see even more distant galaxies behind them. Astronomers use these 'gravitational lenses' as free cosmic telescopes."]},"why":{"s":"General relativity is the foundation of cosmology, black hole physics and gravitational-wave astronomy. Its predictions are engineering requirements: GPS satellites' clocks gain about 45 μs per day from weaker gravity and lose about 7 μs per day from orbital speed, a net 38 μs per day that must be corrected. It is also the main obstacle to a unified theory, because it is a classical field theory that is perturbatively non-renormalizable when quantized.","m":"Your phone's map uses Einstein's ideas every time you check where you are. It also explains black holes and the whole expanding universe."},"terms":[["Equivalence principle","Local indistinguishability of free fall from inertial motion (weak form: universality of free fall; Einstein form: all local non-gravitational physics).","The idea that gravity and speeding up feel exactly the same."],["Geodesic","A curve that extremizes proper time (for timelike paths) in curved spacetime, the trajectory of a freely falling body.","The path something follows when gravity is the only thing acting on it."],["Spacetime curvature","The Riemann tensor's measure of how parallel transport around a loop fails to return a vector to itself; physically, tidal acceleration.","How heavy things bend space and time."],["Gravitational lensing","Deflection of light by mass; for a point mass the angle is 4GM/(c²b), producing arcs, Einstein rings, multiple images and magnification.","When gravity bends light like a magnifying glass."],["Frame dragging","The dragging of local inertial frames by a rotating mass (Lense–Thirring effect), measured by Gravity Probe B and LAGEOS.","When a spinning object drags space around with it."],["Shapiro delay","Extra light-travel time Δt ≈ (2GM/c³)ln(4r<sub>1</sub>r<sub>2</sub>/b²) for signals passing near a mass; confirmed by radar ranging and pulsar timing.","When light takes a little longer to pass near something heavy."]]},"duality":{"how":{"s":["In a double-slit experiment, the amplitude at the screen is the sum of the amplitudes for each path, ψ = ψ<sub>1</sub> + ψ<sub>2</sub>, so the probability is<span class=\"eq\"><span class=\"eql\">P = |ψ<sub>1</sub>|² + |ψ<sub>2</sub>|² + 2Re(ψ<sub>1</sub>*ψ<sub>2</sub>)</span></span>The cross term produces fringes with spacing Δy = λL/d. Sending particles one at a time, each lands at a single point, yet the accumulated distribution shows fringes, so interference is a property of the single-particle state, not of particles interacting.","The de Broglie wavelength λ = h/p sets when wave effects matter. A 50 eV electron has λ ≈ 0.17 nm, comparable to atomic spacings, which is why Davisson and Germer (1927) observed electron diffraction from nickel. Thermal neutrons (λ ≈ 0.18 nm) are used for crystallography. A 1 kg ball at 1 m/s has λ ≈ 10<sup>−34</sup> m, far too small to observe. Electron microscopes exploit the short wavelength of keV electrons to reach sub-ångström resolution.","The free-particle Schrödinger equation iħ ∂ψ/∂t = −(ħ²/2m)∇²ψ has plane-wave solutions e<sup>i(kx−ωt)</sup> with p = ħk and E = ħω, encoding de Broglie and Planck–Einstein relations. Localized particles are wave packets, superpositions of many k; a packet of width Δx contains momenta spanning Δp ≳ ħ/2Δx. Measurement outcomes are eigenvalues of Hermitian operators, and after measurement the state is updated to the corresponding eigenstate.","Which-path information destroys interference. If the slit a particle passes through becomes correlated with an environmental record |E<sub>1</sub>⟩ or |E<sub>2</sub>⟩, the interference term is multiplied by the overlap ⟨E<sub>1</sub>|E<sub>2</sub>⟩. Perfectly distinguishable records eliminate fringes, partial information reduces their visibility V, and the duality relation V² + D² ≤ 1 (D = path distinguishability) quantifies the tradeoff. This decoherence explains why macroscopic objects, continuously monitored by their environment, show no interference.","Photons show the same structure. The photoelectric effect, with kinetic energy K<sub>max</sub> = hf − φ independent of intensity, and Compton scattering, Δλ = (h/m<sub>e</sub>c)(1 − cos θ), require quantized energy and momentum exchanges. Yet single-photon interferometry produces fringes, and antibunching measurements (g<sup>(2)</sup>(0) < 1) show that individual photons cannot be split at a beam splitter. Quantum field theory unifies these: particles are excitations (quanta) of fields."],"m":["Light comes in tiny packets of energy called photons. Shining red light on certain metals does nothing, no matter how bright it is. But even dim blue or ultraviolet light knocks electrons out. That's because each blue photon packs more energy. Einstein won his Nobel Prize for explaining this.","And it goes the other way: things we think of as particles, like electrons, act like waves too. Everything has a wavelength, even you! But for big things like a baseball, the wavelength is unbelievably tiny, so you'd never notice.","In quantum physics, a particle is described by a 'wave of possibilities' that tells where it's likely to be found. Two of these waves can add up or cancel out, which is what makes the striped patterns in the double-slit experiment.","Why don't we see weird quantum stuff in daily life? Because big things are constantly bumping into air, light and everything else. Those bumps act like gossip, spreading information around and wiping out the quantum weirdness. Scientists call this decoherence."]},"why":{"s":"Wave–particle duality is the empirical core of quantum mechanics, and it underlies chemistry (electron orbitals are standing waves), solid-state physics (band structure from Bloch waves), lasers, semiconductors, electron and neutron microscopy, and atom interferometry, which provides some of the most precise measurements of gravity, rotation and the fine-structure constant. Understanding where interference disappears also sets the practical limits of quantum technologies.","m":"Computers, phones, lasers and LED lights all depend on electrons and light behaving like both waves and particles."},"terms":[["Photon","The quantum of the electromagnetic field, with E = hf, p = h/λ, spin 1 and zero rest mass.","A tiny packet of light energy."],["de Broglie wavelength","λ = h/p, the wavelength associated with a particle of momentum p; matters when comparable to apparatus or interatomic scales.","The 'wave size' of a moving particle."],["Wavefunction","ψ(<b>x</b>, t), the complex amplitude whose squared modulus gives probability density; evolves by the Schrödinger equation.","A 'map of possibilities' for where a particle could be."],["Superposition","A linear combination of quantum states, α|a⟩ + β|b⟩, with relative phase producing interference; |α|² and |β|² give outcome probabilities.","Being in a mix of possibilities at the same time."],["Decoherence","The loss of phase coherence between components of a superposition through entanglement with an environment, suppressing interference without true collapse.","When bumping into the world wipes out quantum weirdness."],["Photoelectric effect","Electron emission when light of frequency f > φ/h strikes a surface, with K<sub>max</sub> = hf − φ; explained by Einstein (1905; Nobel 1921).","When light knocks electrons out of metal."]]},"uncertainty":{"how":{"s":["For any two observables, the Robertson inequality follows from the Cauchy–Schwarz inequality:<span class=\"eq\"><span class=\"eql\">σ<sub>A</sub>σ<sub>B</sub> ≥ ½|⟨[Â, B̂]⟩|</span></span>With [x̂, p̂] = iħ this gives σ<sub>x</sub>σ<sub>p</sub> ≥ ħ/2. Equality holds only for Gaussian wave packets. Commuting observables, such as p<sub>x</sub> and y, have simultaneous eigenstates and no such limit.","The relation is a property of waves. The momentum-space wavefunction φ(p) is the Fourier transform of ψ(x), and any function and its Fourier transform cannot both be narrow. The same mathematics gives the bandwidth theorem for signals, Δt Δω ≥ 1/2: a short laser pulse must contain many frequencies. A 10 fs (full width) Gaussian pulse must span at least about 44 THz.","Uncertainty fixes atomic size. For hydrogen, confining an electron to radius r costs kinetic energy ~ħ²/(2m<sub>e</sub>r²), while the Coulomb energy is −e²/(4πε<sub>0</sub>r). Minimizing the sum gives r = a<sub>0</sub> = 4πε<sub>0</sub>ħ²/(m<sub>e</sub>e²) = 0.529 Å and E = −13.6 eV, the exact ground-state values. The same argument applied to degenerate electrons gives white-dwarf radii, and the zero-point energy of a harmonic oscillator, E<sub>0</sub> = ½ħω, keeps helium liquid at atmospheric pressure down to absolute zero.","Energy and time obey a different kind of relation, ΔE Δt ≳ ħ/2, because time is a parameter rather than an operator. Δt is the time scale over which a state changes appreciably (Mandelstam–Tamm). An excited state with lifetime τ has an energy width Γ = ħ/τ: the 2p state of hydrogen (τ = 1.6 ns) has a natural linewidth of about 100 MHz, and the Z boson's width of 2.50 GeV corresponds to a lifetime of 2.6 × 10<sup>−25</sup> s.","In precision measurement, uncertainty appears as quantum noise. In an interferometer, photon shot noise in phase (Δφ ~ 1/√N) and radiation-pressure noise in momentum trade off to give the standard quantum limit. Squeezed states reduce noise in one quadrature below the vacuum level at the cost of increasing it in the other; LIGO's frequency-dependent squeezing, introduced for the 2023–2025 run, increased its binary-neutron-star range by roughly 15–20%, which enlarges the surveyed volume by about 60%."],"m":["Think about sound. A very short 'click' doesn't have a clear pitch; it's a jumble of many notes. A long, steady hum has a clear pitch. You can't have a sound that is both super short and one exact note. Tiny particles are waves too, so they follow the same kind of rule.","For a particle, being in one exact spot is like a short click: its 'motion' becomes a jumble. Having one exact motion is like a long hum: it spreads out in space. Nature won't let both be perfectly pinned down at once.","This rule is why atoms don't collapse! If an electron got squeezed too close to the nucleus, it would jiggle with so much energy that it would bounce back out. That sets how big atoms are.","It also means nothing is ever perfectly still, even at absolute zero, the coldest possible temperature. Because of this leftover jiggling, liquid helium never freezes at normal pressure, no matter how cold it gets."]},"why":{"s":"The uncertainty principle explains why matter is stable and has the size it does, why atoms don't collapse, and why the vacuum has zero-point fluctuations with observable effects (the Lamb shift and Casimir force). It sets the quantum limits of sensors, clocks and imaging, and it enables quantum key distribution, which relies on the fact that measuring one basis disturbs the conjugate one.","m":"Without it, atoms would collapse and nothing, including you, could exist."},"terms":[["Reduced Planck constant (ħ)","ħ = h/2π = 1.054 571 817 × 10<sup>−34</sup> J·s, the quantum of action; exact in SI since the 2019 redefinition fixed h.","The tiny number that sets how strong quantum effects are."],["Commutator","[Â, B̂] = ÂB̂ − B̂Â; nonzero commutators imply incompatible observables and a lower bound on the product of their uncertainties.","A way to check if two measurements interfere with each other."],["Zero-point energy","The lowest energy of a quantum system, above the classical minimum because of uncertainty; ½ħω for a harmonic oscillator.","The leftover jiggle that never stops, even at the coldest temperature."],["Natural linewidth","The intrinsic spectral width Γ = ħ/τ of a transition from an excited state with lifetime τ, giving a Lorentzian line shape.","Why each color of light from atoms is a little fuzzy."],["Squeezed light","A state of light with quadrature variance below the vacuum level in one quadrature and above it in the conjugate one, used to reduce measurement noise.","Specially tuned light that's less 'fuzzy' in one way."]]},"entanglement":{"how":{"s":["The singlet state of two spin-½ particles,<span class=\"eq\"><span class=\"eql\">|Ψ⁻⟩ = (|↑↓⟩ − |↓↑⟩)/√2</span></span>has total spin zero, so measurements along the same axis always give opposite results, whatever axis is chosen. For measurements along directions separated by angle θ, quantum mechanics predicts the correlation E(θ) = −cos θ. Neither particle has a definite spin before measurement; the reduced state of each, ρ<sub>A</sub> = Tr<sub>B</sub>|Ψ⟩⟨Ψ|, is maximally mixed.","Bell (1964) showed that if outcomes are determined by local hidden variables λ, correlations must satisfy inequalities. The CHSH form is<span class=\"eq\"><span class=\"eql\">S = |E(a,b) − E(a,b′)</span><span class=\"eql\">+ E(a′,b) + E(a′,b′)| ≤ 2</span></span>Quantum mechanics predicts up to S = 2√2 ≈ 2.83 (Tsirelson's bound) with appropriately chosen angles. Experiments measure S ≈ 2.4–2.8 depending on efficiency and fidelity.","Entanglement does not allow faster-than-light communication. The no-signaling theorem shows that Bob's local outcome statistics, given by ρ<sub>B</sub>, are independent of Alice's measurement choice; correlations become visible only after classical comparison of results. Quantum teleportation transfers an unknown state using one shared entangled pair and two classical bits, so it too is limited by c.","Entanglement is quantified for pure bipartite states by the entanglement entropy S = −Tr(ρ<sub>A</sub> log<sub>2</sub>ρ<sub>A</sub>), which is 1 ebit for a Bell state. For mixed states, measures such as concurrence and negativity are used. Interactions with an uncontrolled environment spread entanglement into it and destroy coherence; this decoherence is the central engineering challenge for quantum technologies.","Quantum computers use entangled qubits: n qubits span a 2<sup>n</sup>-dimensional Hilbert space, and algorithms such as Shor's (factoring) and Grover's (search) exploit interference across it. Fault-tolerant operation requires quantum error correction, in which logical qubits are encoded in entangled states of many physical qubits. In 2024 Google's Willow processor demonstrated surface-code logical error rates that decrease as code size increases, operating below threshold."],"m":["Imagine you have a pair of gloves and send one to a friend across the world without looking. When you open your box and see a left glove, you instantly know your friend has the right one. That's easy, because the gloves were left and right all along.","Entanglement is stranger. Before you look, entangled particles don't have set answers. And John Bell found a clever test, a bit like a game with special rules, where pre-set answers can only win a certain percentage of the time. Entangled particles beat that limit, again and again, in real experiments.","Still, you can't send messages with it. Each person just sees random results. Only when they compare notes, using a normal phone or internet, do the matching patterns appear.","Entanglement is super delicate: almost any bump from the outside world breaks it. Scientists are learning to protect it, because it powers quantum computers and super-secure codes that reveal if anyone tries to spy."]},"why":{"s":"Entanglement is the feature of quantum theory most sharply in conflict with classical intuition, and Bell tests show that nature is not locally realistic. It is the operational resource behind quantum computing, device-independent cryptography, quantum networks and Heisenberg-limited sensing. In fundamental physics, entanglement entropy is central to black hole thermodynamics, holography and condensed-matter phases with topological order.","m":"It shows the universe is stranger than common sense says, and it's the key ingredient for quantum computers and unbreakable codes."},"terms":[["Bell inequality","An inequality on correlations (for example CHSH, S ≤ 2) satisfied by any local hidden-variable theory and violated by quantum mechanics up to 2√2.","A test that proves entanglement is truly strange."],["Local realism","The joint assumption that measurement outcomes are predetermined by local properties (realism) and unaffected by spacelike-separated choices (locality).","The common-sense idea that things have set answers and don't affect each other instantly."],["Qubit","A two-level quantum system, α|0⟩ + β|1⟩ with |α|² + |β|² = 1, represented on the Bloch sphere.","A quantum computer's basic unit, which can be 0 and 1 at once."],["Quantum key distribution","Generation of a shared secret key whose security follows from quantum mechanics (BB84 or entanglement-based E91); eavesdropping introduces detectable errors.","A way to make secret codes that show if anyone spied."],["No-cloning theorem","The impossibility of a unitary operation that copies an arbitrary unknown quantum state, |ψ⟩|0⟩ → |ψ⟩|ψ⟩; follows from linearity.","You can't make a perfect copy of a quantum particle's state."]]},"atoms":{"how":{"s":["For hydrogen, the Schrödinger equation with the Coulomb potential gives energy levels<span class=\"eq\"><span class=\"eql\">E<sub>n</sub> = −(m<sub>e</sub>e⁴ / 2(4πε<sub>0</sub>)²ħ²)(1/n²)</span><span class=\"eql\">= −13.6 eV / n²</span></span>with Bohr radius a<sub>0</sub> = 0.529 Å. Transition wavelengths follow the Rydberg formula 1/λ = R<sub>∞</sub>(1/n<sub>1</sub>² − 1/n<sub>2</sub>²); the Balmer series (n<sub>1</sub> = 2) includes Hα at 656.3 nm. Wavefunctions factor as ψ = R<sub>nℓ</sub>(r)Y<sub>ℓm</sub>(θ, φ).","Each state is labeled by n (principal), ℓ = 0 to n − 1 (orbital angular momentum, letters s, p, d, f), m<sub>ℓ</sub> = −ℓ to ℓ, and m<sub>s</sub> = ±½. In hydrogen, the energy depends only on n (an accidental degeneracy), giving 2n² states per shell. Fine structure from relativistic and spin–orbit effects splits levels at order α² ≈ 5 × 10<sup>−5</sup>, hyperfine interactions with the nuclear spin split them further (the 21 cm line), and QED radiative corrections produce the Lamb shift.","In multielectron atoms, electron–electron repulsion lifts ℓ degeneracy: inner electrons screen the nucleus, so s orbitals, which penetrate closer, are more tightly bound than p, d or f. Filling follows approximately the Madelung (n + ℓ) rule, with Hund's rules for ground-state terms. Effective nuclear charge rises across a period, producing periodic trends in ionization energy and atomic radius. Heavy elements require relativistic treatment: relativistic contraction of 6s orbitals gives gold its color and mercury its low melting point.","Electric-dipole transitions obey selection rules Δℓ = ±1 and Δm = 0, ±1, and have rates scaling as ω³|⟨f|<b>r</b>|i⟩|². Forbidden transitions, such as hyperfine or electric-quadrupole lines, are slower by many orders of magnitude, so they dominate in low-density astrophysical plasmas (nebular [O III] lines). Lines are broadened by natural lifetime, by Doppler motion (Δλ/λ ≈ √(8kT ln2/mc²)) and by collisional pressure; their shapes measure temperature and density.","The nucleus contains essentially all the mass in about 10<sup>−15</sup> of the volume. Its radius scales as R ≈ 1.2 fm × A<sup>1/3</sup>, implying a nearly constant density of about 2.3 × 10<sup>17</sup> kg/m³. Isotopes share Z but differ in N; nuclear stability requires N ≈ Z for light nuclei and N > Z for heavy ones, because Coulomb repulsion grows as Z². Optical atomic clocks using narrow transitions in Sr, Yb<sup>+</sup> or Al<sup>+</sup> reach fractional uncertainties near 10<sup>−18</sup>."],"m":["Electrons around an atom live in 'shells', a bit like seats in a stadium. Each seat holds at most two electrons, and the inner rows fill up first. How many electrons sit in the outer row decides how an atom behaves, and that's why the periodic table is arranged in columns of similar elements.","The nucleus is a tiny, heavy center made of protons and neutrons. Protons all push each other away, but the strong force glues them together, like super-strong velcro that only works up close. Atoms of the same element with different numbers of neutrons are called isotopes; some are unstable and radioactive.","Every element glows with its own special colors, like a barcode. That's how we know what stars are made of without ever visiting them. Helium was actually discovered in the Sun first, decades before anyone found it on Earth! Its name comes from 'Helios', the Greek word for Sun.","Atoms even keep time. The official second is defined by how fast cesium atoms 'tick'. The best atomic clocks today wouldn't lose a second in the entire age of the universe."]},"why":{"s":"Atomic structure is the foundation of chemistry, materials science and astrophysical spectroscopy: element identification, temperatures, densities, velocities and magnetic fields of stars and gas all come from atomic lines. Precision atomic physics measures fundamental constants (α to 81 parts per trillion from atom recoil), defines the SI second, tests QED and searches for new physics such as variations in constants and electric dipole moments.","m":"Atoms are the building blocks of everything you can touch. Understanding them explains chemistry, medicine, electronics and what stars are made of."},"terms":[["Orbital","A one-electron stationary-state wavefunction ψ<sub>nℓm</sub>, whose |ψ|² gives the electron's probability density; labeled 1s, 2p, 3d and so on.","The cloud where an electron hangs out."],["Quantum number","Integers or half-integers (n, ℓ, m<sub>ℓ</sub>, m<sub>s</sub>) labeling eigenvalues of commuting operators (H, L², L<sub>z</sub>, S<sub>z</sub>) for an atomic state.","A label describing an electron's 'address'."],["Pauli exclusion principle","No two identical fermions can occupy the same quantum state; the total wavefunction is antisymmetric under exchange.","The rule that electrons can't share the same exact seat."],["Isotope","Atoms with the same Z but different N; nearly identical chemistry but different mass, nuclear spin and stability.","Versions of the same element with different numbers of neutrons."],["Spectral line","A narrow feature in a spectrum at the photon energy of a transition, E = hc/λ = E<sub>upper</sub> − E<sub>lower</sub>.","A single color in an element's light barcode."]]},"standard-model":{"how":{"s":["In quantum field theory, each particle type is an excitation of a field defined throughout spacetime. Interactions follow from requiring the Lagrangian to be invariant under local (gauge) transformations: demanding local U(1) phase invariance of the electron field forces the introduction of a vector field, the photon, with coupling D<sub>μ</sub> = ∂<sub>μ</sub> + ieA<sub>μ</sub>. Applying the same principle to non-Abelian groups produces gluons (8, from SU(3)) and the W and B fields (from SU(2) × U(1)), which carry charge under their own forces and therefore self-interact.","Fermions come in three generations with identical gauge charges but very different masses. Each generation contains an up-type quark (u, c, t), a down-type quark (d, s, b), a charged lepton (e, μ, τ) and a neutrino. The weak interaction acts only on left-handed components (SU(2) doublets), violating parity maximally. Mass eigenstates of quarks differ from weak eigenstates; the mismatch is encoded in the 3 × 3 unitary Cabibbo–Kobayashi–Maskawa matrix, whose one irreducible complex phase is the Standard Model's source of CP violation.","Quantum chromodynamics (QCD) has a coupling that decreases at high energy (asymptotic freedom; Gross, Wilczek, Politzer, 2004 Nobel Prize):<span class=\"eq\"><span class=\"eql\">α<sub>s</sub>(Q²) ≈</span><span class=\"eql\">12π / [(33 − 2n<sub>f</sub>) ln(Q²/Λ<sub>QCD</sub>²)]</span></span>with α<sub>s</sub>(m<sub>Z</sub>) = 0.118 and Λ<sub>QCD</sub> ≈ 200 MeV. At low energy the coupling becomes strong and quarks are confined into colorless hadrons. Lattice QCD computes hadron masses from first principles, reproducing the proton mass to about 1%.","Electroweak symmetry is spontaneously broken when the Higgs doublet acquires a vacuum expectation value v = 246 GeV. Three of its four components become the longitudinal polarizations of the W<sup>±</sup> and Z, giving m<sub>W</sub> = gv/2 = 80.37 GeV and m<sub>Z</sub> = m<sub>W</sub>/cos θ<sub>W</sub> = 91.19 GeV, with sin²θ<sub>W</sub> ≈ 0.231. The photon remains massless, combining W⁰ and B as A = B cos θ<sub>W</sub> + W⁰ sin θ<sub>W</sub>. Fermion masses arise from Yukawa couplings to the Higgs field.","Quantum corrections make precision tests possible. Loop diagrams with virtual top quarks and Higgs bosons shift m<sub>W</sub>, sin²θ<sub>eff</sub> and Z-pole observables, allowing the top and Higgs masses to be predicted before discovery. The theory is renormalizable ('t Hooft and Veltman, 1999 Nobel Prize): infinities are absorbed into a finite number of parameters, and couplings run with energy scale according to renormalization-group equations."],"m":["Scientists think the universe is filled with invisible 'fields', a bit like the surface of an endless pond. Particles are ripples on those fields: an electron is a ripple in the electron field, and a particle of light is a ripple in the electromagnetic field.","Matter is made of two families: quarks and leptons. Quarks come in six types with funny names (up, down, charm, strange, top, bottom) and are always stuck together in groups. Two ups and a down make a proton; two downs and an up make a neutron. Leptons include the electron and the ghostly neutrinos.","Each matter particle has two heavier 'cousins'. The muon, for example, is like a heavy electron. But the heavier cousins quickly break down, so everything around you is made of just the lightest ones: up quarks, down quarks and electrons.","Forces work by trading messenger particles. Photons carry electric and magnetic forces, gluons glue quarks together, and W and Z particles handle the weak force. The Higgs boson is linked to the field that gives particles their mass."]},"why":{"s":"The Standard Model is the most precisely tested theory in physics, and every calculation in nuclear physics, atomic physics, chemistry and astrophysics ultimately rests on it. Its known gaps define the frontier: neutrino masses, dark matter, the matter–antimatter asymmetry, the hierarchy between the electroweak and Planck scales, and the inclusion of gravity. Precision measurements at colliders and at low energy search for small deviations that would reveal what lies beyond it.","m":"It's the best 'parts list' for the universe that scientists have ever made, and the missing pieces tell us where to look next."},"terms":[["Quantum field","An operator-valued function on spacetime whose quantized excitations are particles; interactions are local products of fields in the Lagrangian.","An invisible 'pond' everywhere that particles ripple across."],["Fermion","A half-integer-spin particle obeying Fermi–Dirac statistics and the exclusion principle; quarks and leptons are the fundamental fermions.","A matter particle."],["Boson","An integer-spin particle obeying Bose–Einstein statistics; the gauge bosons (spin 1) mediate forces, and the Higgs is spin 0.","A force-carrying particle."],["Hadron","A color-neutral bound state of quarks: baryons (qqq), mesons (qq̄), and exotic tetraquark and pentaquark states observed at LHCb and elsewhere.","A particle made of quarks stuck together."],["Generation","One of three copies of the fermion content (u, d, e, ν<sub>e</sub>), (c, s, μ, ν<sub>μ</sub>), (t, b, τ, ν<sub>τ</sub>) with the same gauge charges and increasing mass.","One of three 'sets' of matter particles."],["Confinement","The absence of isolated color charges: QCD flux tubes between separating quarks store energy linearly (string tension about 1 GeV/fm) until new quark pairs form.","The rule that quarks are always stuck in groups."]]},"higgs":{"how":{"s":["The Higgs field is a complex SU(2) doublet φ with potential<span class=\"eq\"><span class=\"eql\">V(φ) = −μ²φ†φ + λ(φ†φ)²</span></span>For μ² > 0 the minimum lies not at φ = 0 but on a circle of radius |φ| = v/√2, with v = μ/√λ = 246 GeV. Choosing one point on this circle breaks the SU(2)<sub>L</sub> × U(1)<sub>Y</sub> symmetry to U(1)<sub>EM</sub>. Expanding about the minimum, φ = (0, (v + h)/√2), the physical Higgs boson h has mass m<sub>H</sub> = √(2λ)v, so λ ≈ 0.13.","Three of the doublet's four real degrees of freedom would be massless Goldstone bosons; in a gauge theory they are absorbed as the longitudinal polarization states of W<sup>+</sup>, W<sup>−</sup> and Z. This is the Brout–Englert–Higgs mechanism (1964; 2013 Nobel Prize to Englert and Higgs). The kinetic term |D<sub>μ</sub>φ|² then generates mass terms m<sub>W</sub>² = g²v²/4, and the hWW and hZZ couplings are proportional to the boson masses squared, a key test.","Fermion masses come from Yukawa interactions −y<sub>f</sub> f̄φf, giving m<sub>f</sub> = y<sub>f</sub>v/√2. The Higgs couples to each fermion in proportion to its mass, so it decays preferentially to the heaviest kinematically allowed particles: about 58% to bb̄, 21% to WW*, 6% to ττ and 2.6% to ZZ*, with rare channels γγ (0.23%) and μμ (0.02%). The top Yukawa coupling, y<sub>t</sub> ≈ 1, dominates gluon-fusion production through a top-quark loop.","At the LHC, Higgs bosons are produced mainly by gluon fusion (about 50 pb at 13–13.6 TeV), with smaller contributions from vector-boson fusion, associated WH/ZH and tt̄H production. Only about one collision in 10⁹ produces a Higgs. The discovery channels were H → γγ and H → ZZ* → 4ℓ, which give sharp mass peaks above smooth backgrounds; both reached 5σ significance in July 2012.","Higgs pair production (gg → HH) measures λ directly, but its cross section is about 1,000 times smaller than single Higgs production, and destructive interference suppresses it further. Current ATLAS and CMS combinations constrain the self-coupling to within about −1 to 7 times the Standard Model value. The High-Luminosity LHC (from about 2030) aims for roughly 50% precision, and proposed Higgs factories (FCC-ee, CEPC, a linear collider) target percent-level couplings."],"m":["Imagine a busy party. If an ordinary guest walks across the room, they move easily. If a celebrity walks in, everyone crowds around, and it's hard for them to get through. The Higgs field is like that crowd, filling all of space. Particles that interact with it strongly act 'heavier'; those that ignore it, like light, have no mass at all.","The Higgs boson is a ripple in that field, like a wave of excitement spreading through the crowd. Finding it in 2012 proved the field is real.","Making one is really hard. In the Large Hadron Collider, only about one collision in a billion produces a Higgs boson, and it falls apart almost instantly. Scientists spot it by catching the pieces it breaks into.","Important note: the Higgs field gives electrons and quarks their mass, but most of your mass actually comes from the energy inside protons and neutrons. Still, without the Higgs, electrons would have no mass, atoms couldn't hold together, and nothing like us could exist."]},"why":{"s":"The Higgs boson completes the Standard Model and confirms that elementary-particle masses arise from a field filling space, while leaving open why its mass is 125 GeV rather than near the Planck scale. Its potential determines the stability of the electroweak vacuum, the nature of the electroweak phase transition in the early universe (relevant to baryogenesis), and whether the Higgs might connect to dark matter through a 'Higgs portal'.","m":"Without the Higgs field, electrons would have no mass, atoms couldn't form, and the universe would have no planets or people."},"terms":[["Higgs field","The SU(2) doublet scalar field with a 'Mexican hat' potential whose nonzero vacuum value breaks electroweak symmetry.","The invisible field that gives tiny particles their mass."],["Vacuum expectation value","⟨φ⟩ = v/√2, with v = (√2 G<sub>F</sub>)<sup>−1/2</sup> ≈ 246 GeV, fixed by the Fermi constant measured in muon decay.","How 'switched on' the Higgs field is everywhere."],["Symmetry breaking","Spontaneous symmetry breaking: the Lagrangian has a symmetry not shared by the ground state; gauge versions give vector bosons mass.","When nature 'chooses' one option out of many equal ones."],["Yukawa coupling","A coupling y<sub>f</sub> between the Higgs field and fermion f, giving mass m<sub>f</sub> = y<sub>f</sub>v/√2; ranges from about 3 × 10<sup>−6</sup> (electron) to about 1 (top).","How strongly a particle feels the Higgs field."],["Sigma (σ)","A measure of statistical significance: the number of Gaussian standard deviations corresponding to the background-only p-value; 5σ (p ≈ 3 × 10<sup>−7</sup>) is the discovery convention.","How sure scientists are that a discovery is real."]]},"forces":{"how":{"s":["In quantum field theory, forces arise from exchange of virtual gauge bosons. A massive mediator produces a short-range Yukawa potential,<span class=\"eq\"><span class=\"eql\">V(r) ∝ (g²/r) e<sup>−r/λ</sup></span><span class=\"eql\">λ = ħ/(mc)</span></span>so the W (80.4 GeV) and Z (91.2 GeV) give the weak force a range of about 2.5 × 10<sup>−18</sup> m. Massless photons and gravitons (if gravity is quantized) give 1/r potentials of infinite range. The strong force has massless gluons but is short-range because of confinement.","Electromagnetism couples to electric charge with fine-structure constant α = e²/(4πε<sub>0</sub>ħc) ≈ 1/137.036 at low energy, rising to about 1/128 at the Z mass because vacuum polarization screens the bare charge less at short distance. The strong force couples to three color charges; gluons themselves carry color, causing antiscreening, so α<sub>s</sub> decreases at high energy (asymptotic freedom) and grows to order 1 below about 1 GeV.","The weak force couples to weak isospin of left-handed fermions and changes flavor via W exchange (as in n → p e<sup>−</sup> ν̄<sub>e</sub>). At low energy it is effectively a contact interaction with Fermi constant G<sub>F</sub> = 1.166 × 10<sup>−5</sup> GeV<sup>−2</sup>; its weakness, G<sub>F</sub> = √2g²/8m<sub>W</sub>², comes mostly from the large W mass, while its intrinsic coupling g ≈ 0.65 exceeds e ≈ 0.31. It violates parity and CP and is the only interaction that changes quark and lepton flavor.","Gravity couples universally to energy–momentum with strength set by G = 6.674 × 10<sup>−11</sup> N·m²/kg². Its dimensionless strength for two protons, Gm<sub>p</sub>²/ħc ≈ 6 × 10<sup>−39</sup>, is negligible in particle physics. Gravity dominates astronomy anyway because it is always attractive and unscreened, whereas the electromagnetic charges of bulk matter cancel. The coupling becomes order 1 at the Planck energy, E<sub>P</sub> = √(ħc⁵/G) ≈ 1.22 × 10<sup>19</sup> GeV.","Running couplings suggest unification. Extrapolated with Standard Model particle content, the three gauge couplings approach one another near 10<sup>14</sup>–10<sup>16</sup> GeV but do not meet at a single point; with supersymmetric particles near the TeV scale they would meet near 2 × 10<sup>16</sup> GeV. Grand unified theories (such as SU(5) or SO(10)) embed quarks and leptons in common multiplets and predict proton decay, which has not been seen (τ > 2.4 × 10<sup>34</sup> yr for p → e<sup>+</sup>π⁰)."],"m":["Forces work by passing tiny messenger particles back and forth, a bit like two skaters throwing a heavy ball between them and drifting apart. Heavy messengers can't travel far, so their forces are short-range. Light messengers, like photons, can reach forever.","The strong force is weird: it gets stronger the farther apart quarks get, like a rubber band. If you pull really hard, the band 'snaps' and the energy makes brand-new quarks instead of freeing one. That's why nobody has ever seen a quark by itself.","The weak force is the shape-shifter. It's the only force that can change one kind of particle into another, like turning a neutron into a proton. That's how the Sun starts its fusion and how some atoms are radioactive.","Gravity is by far the weakest. Two protons push each other apart electrically about a trillion trillion trillion times harder than gravity pulls them together. But gravity always pulls and never cancels out, so with enough mass, like a planet or a star, it wins."]},"why":{"s":"The relative strengths of the four forces determine the structure of matter at every scale: the strong force binds nuclei, electromagnetism governs atoms, chemistry and light, the weak force enables stellar fusion and radioactivity, and gravity organizes planets, stars and galaxies. Small changes in their couplings would alter nuclear stability and stellar lifetimes. Searches for a 'fifth force' test for new light particles and possible modifications of gravity.","m":"Everything that happens in the universe, from you reading this to stars shining, is one of these four forces at work."},"terms":[["Gauge boson","A spin-1 boson mediating a gauge interaction: photon (U(1)<sub>EM</sub>), W<sup>±</sup> and Z (weak), and eight gluons (SU(3) color).","A messenger particle that carries a force."],["Color charge","The charge (three 'colors' and anticolors) under SU(3) QCD; physical hadrons are color singlets.","The strong force's version of electric charge."],["Fine-structure constant","α = e²/(4πε<sub>0</sub>ħc) ≈ 1/137.035 999, the dimensionless coupling of electromagnetism; measured to 81 parts per trillion.","A number that sets how strong electricity and magnetism are."],["Parity violation","Non-invariance under spatial inversion, x → −x; maximal in charged-current weak interactions, which couple only to left-handed fermions.","When nature isn't the same in a mirror."],["Unification","The description of distinct forces as low-energy manifestations of one gauge symmetry, as achieved for electroweak theory and proposed in grand unification.","The idea that forces were once one force."]]},"neutrinos":{"how":{"s":["Flavor eigenstates are rotations of mass eigenstates by the Pontecorvo–Maki–Nakagawa–Sakata (PMNS) matrix, |ν<sub>α</sub>⟩ = Σ<sub>i</sub>U*<sub>αi</sub>|ν<sub>i</sub>⟩. Mass states of energy E propagate with different phases, so in a two-flavor approximation the oscillation probability is<span class=\"eq\"><span class=\"eql\">P(ν<sub>α</sub>→ν<sub>β</sub>) =</span><span class=\"eql\">sin²2θ · sin²(1.27 Δm²L/E)</span></span>with Δm² in eV², L in km and E in GeV. Oscillations measure mass-squared differences and mixing angles, not absolute masses.","Measured parameters are Δm²<sub>21</sub> ≈ 7.5 × 10<sup>−5</sup> eV² (solar and KamLAND reactor data), |Δm²<sub>31</sub>| ≈ 2.5 × 10<sup>−3</sup> eV² (atmospheric and accelerator data), and mixing angles θ<sub>12</sub> ≈ 33.5°, θ<sub>23</sub> ≈ 42–49° and θ<sub>13</sub> ≈ 8.5°. PMNS mixing is large, unlike the nearly diagonal quark CKM matrix. Whether m<sub>3</sub> is heaviest (normal ordering) or lightest (inverted ordering) is not yet determined.","In matter, electron neutrinos scatter coherently off electrons via W exchange, gaining an effective potential V = √2 G<sub>F</sub>n<sub>e</sub>. This modifies oscillation (the Mikheyev–Smirnov–Wolfenstein effect) and produces a resonance in the Sun: high-energy ⁸B neutrinos leave the core almost entirely as ν<sub>2</sub>, producing a ν<sub>e</sub> survival probability of about 1/3, while low-energy pp neutrinos show vacuum-averaged survival near 0.55.","Absolute mass is probed three ways. Beta-decay endpoint measurements constrain m<sub>β</sub>² = Σ|U<sub>ei</sub>|²m<sub>i</sub>²; KATRIN's 2025 tritium result gives m<sub>β</sub> < 0.45 eV (90% confidence). Cosmology measures Σm<sub>ν</sub> through suppressed small-scale structure growth. Neutrinoless double beta decay, (A,Z) → (A,Z+2) + 2e<sup>−</sup>, would occur only if neutrinos are their own antiparticles (Majorana); KamLAND-Zen's bound T<sub>1/2</sub>(¹³⁶Xe) > 3.8 × 10<sup>26</sup> yr limits the effective mass to below about 28–122 meV, depending on nuclear matrix elements.","Detection exploits rare interactions in huge targets. Water Cherenkov detectors (Super-Kamiokande, 50 kton) see the light cone from charged leptons produced in charged-current interactions; liquid scintillators (Borexino, JUNO) measure low-energy events calorimetrically; IceCube instruments a cubic kilometer of Antarctic ice. Coherent elastic neutrino–nucleus scattering, observed by COHERENT in 2017, has a much larger cross section scaling as N² and is now detected from solar ⁸B neutrinos in dark matter experiments."],"m":["Neutrinos are the ghosts of the particle world. They have almost no mass, no electric charge and hardly ever touch anything. A neutrino from the Sun could fly through a block of lead a light-year thick and still have about a 50-50 chance of making it out the other side!","About 65 billion neutrinos from the Sun pass through every square centimeter of your body each second, day and night. At night they come up through the Earth beneath you, since the planet barely slows them down.","Neutrinos come in three 'flavors', and as they travel they can switch from one flavor to another, like an ice cream changing from chocolate to vanilla to strawberry. That switching proved neutrinos have a little bit of mass, which won a Nobel Prize.","To catch them, scientists build gigantic detectors deep underground or in ice, so other particles get blocked. Super-Kamiokande is a giant tank of 50,000 tonnes of super-pure water. IceCube uses a whole cubic kilometer of Antarctic ice! When a supernova exploded in 1987, neutrinos reached Earth hours before its light."]},"why":{"s":"Neutrino masses are evidence for new physics, perhaps the seesaw mechanism, in which very heavy right-handed neutrinos (~10<sup>14</sup> GeV) suppress light masses as m<sub>ν</sub> ≈ y²v²/M. Their decays could produce the baryon asymmetry through leptogenesis. Neutrinos also drive core-collapse supernovae, carry information from the solar core and cosmic accelerators, affect the CMB and structure formation, and make up a relic background of about 336 per cm³.","m":"They let us 'see' inside the Sun and exploding stars, and they might explain why the universe is made of matter at all."},"terms":[["Flavor","The charged-lepton partner (e, μ or τ) with which a neutrino is produced or detected in a charged-current interaction.","A neutrino's 'type', like an ice cream flavor."],["Neutrino oscillation","Periodic variation of flavor-detection probability with L/E, caused by interference between mass eigenstates with different Δm².","When neutrinos switch flavors as they fly."],["Cherenkov radiation","Radiation emitted when a charged particle moves through a medium faster than light's phase velocity there (v > c/n), at cos θ = 1/(nβ).","A blue flash made by particles racing through water."],["Majorana particle","A fermion that is its own antiparticle; Majorana neutrinos would allow lepton-number-violating neutrinoless double beta decay.","A particle that is its own anti-twin."],["Cosmic neutrino background","Relic neutrinos decoupled at T ≈ 1 MeV (t ≈ 1 s), now at T<sub>ν</sub> = (4/11)<sup>1/3</sup>T<sub>γ</sub> ≈ 1.95 K, about 112 per cm³ per flavor (including antineutrinos).","Leftover neutrinos from the Big Bang, still flying around."]]},"newton":{"how":{"s":["The first law defines inertial frames: those in which a free particle moves at constant velocity. The second law, F<sub>net</sub> = dp/dt = ma (for constant mass), relates force to acceleration with inertial mass as the proportionality constant. The third law, F<sub>12</sub> = −F<sub>21</sub>, implies conservation of total momentum for isolated systems. In non-inertial frames, fictitious forces appear: centrifugal (mω²r), Coriolis (−2m<b>ω</b> × <b>v</b>) and Euler forces, which shape weather systems and ocean currents.","Gravity from a spherically symmetric mass acts as if concentrated at its center (Newton's shell theorem). Writing gravity as the gradient of a potential, <b>g</b> = −∇Φ, with<span class=\"eq\"><span class=\"eql\">∇²Φ = 4πGρ</span></span>allows extended mass distributions to be handled. Because inertial and gravitational mass are equal (tested to 10<sup>−15</sup>), all bodies fall with the same acceleration, g = GM/r² ≈ 9.81 m/s² at Earth's surface.","The two-body problem reduces to one body of reduced mass μ = m<sub>1</sub>m<sub>2</sub>/(m<sub>1</sub> + m<sub>2</sub>) in a central potential. Conservation of energy and angular momentum gives conic-section orbits, r = p/(1 + e cos θ), and Kepler's three laws: elliptical orbits, equal areas in equal times (from constant angular momentum L), and<span class=\"eq\"><span class=\"eql\">T² = 4π²<i>a</i>³ / [G(M + m)]</span></span>The vis-viva equation, v² = GM(2/r − 1/<i>a</i>), gives speed anywhere on an orbit.","Escape velocity follows from setting kinetic plus potential energy to zero: v<sub>esc</sub> = √(2GM/r), 11.19 km/s from Earth's surface and √2 times the circular orbital speed at the same radius. In the circular restricted three-body problem, five Lagrange points exist where a small body co-rotates with two masses. L1–L3 are collinear and unstable, requiring station-keeping (SOHO at Sun–Earth L1, JWST in a halo orbit about L2), while L4 and L5 are stable if the mass ratio exceeds about 25, as for Jupiter's Trojan asteroids.","Tidal acceleration is the difference in gravitational pull across a body: for separation Δr along the line to a mass M at distance d, Δa ≈ 2GMΔr/d³. The Moon's tidal effect on Earth is about 2.2 times the Sun's despite the Sun's much stronger pull, because of the 1/d³ dependence. Tidal friction transfers angular momentum from Earth's spin to the Moon's orbit, lengthening the day by about 2.3 ms per century and moving the Moon outward by 3.8 cm/yr, measured by lunar laser ranging."],"m":["Newton's first law: things keep doing what they're doing unless something pushes or pulls them. A hockey puck slides a long way on smooth ice because there's little friction to stop it. In space, a thrown ball would keep going forever.","Second law: the harder you push, the faster something speeds up, and heavier things need a bigger push. Third law: every push has an equal push back. When a rocket shoves hot gas downward, the gas shoves the rocket upward.","Newton realized the same gravity that pulls an apple down also holds the Moon in orbit. The Moon IS falling toward Earth, but it's moving sideways so fast that it keeps missing. Using gravity's rules, scientists can weigh planets and stars just by watching things orbit them.","Gravity also makes tides. The Moon pulls the side of Earth facing it a bit harder than the far side, stretching the oceans into two bulges. Over time, tides are slowly pushing the Moon away from us, about 4 cm a year, roughly as fast as your fingernails grow.","There are special 'parking spots' in space called Lagrange points, where gravity from the Sun and Earth balance out. The James Webb Space Telescope is parked near one, 1.5 million km from Earth."]},"why":{"s":"Newtonian mechanics remains the working theory for engineering, ballistics, orbital mechanics, fluid dynamics and most of astronomy; interplanetary trajectories are computed with Newtonian dynamics plus small relativistic corrections. Its structure, through Lagrangian and Hamiltonian reformulations, carried directly into quantum mechanics and field theory. Its failures, such as Mercury's perihelion and the behavior of light, motivated relativity and revealed its domain of validity.","m":"Everything from bridges to roller coasters to Mars rovers is designed with Newton's laws."},"terms":[["Inertia","The tendency of a body to maintain its velocity absent net force, quantified by inertial mass.","How much something resists being pushed or stopped."],["Net force","The vector sum of all forces on a body, equal to its rate of change of momentum, dp/dt.","All the pushes and pulls added together."],["Kepler's laws","Elliptical orbits with the central body at a focus; equal areas swept in equal times; T² ∝ <i>a</i>³.","Three rules for how planets orbit."],["Escape velocity","v<sub>esc</sub> = √(2GM/r), the minimum speed at which an unpowered body reaches infinite distance with zero speed.","The speed needed to leave a planet for good."],["Lagrange point","One of five equilibrium points in the rotating frame of a two-body system; L4 and L5 lead and trail by 60°.","A gravity 'parking spot' in space."],["Tidal force","The differential gravitational acceleration across an extended body, scaling as GMΔr/d³, which stretches it along the line to the attracting mass.","The stretch caused by gravity pulling harder on one side."]]},"conservation":{"how":{"s":["For a Lagrangian L(q, q̇, t), the Euler–Lagrange equations d/dt(∂L/∂q̇) = ∂L/∂q imply that if L does not depend on a coordinate q, its conjugate momentum p = ∂L/∂q̇ is conserved. If L has no explicit time dependence, the energy function<span class=\"eq\"><span class=\"eql\">H = Σ q̇<sub>i</sub> ∂L/∂q̇<sub>i</sub> − L</span></span>is conserved. Noether's theorem generalizes this: any continuous symmetry δq leaving the action invariant yields a conserved Noether charge.","Momentum conservation follows from homogeneity of space and governs collisions. In an elastic collision both kinetic energy K = ½mv² and momentum are conserved; in inelastic collisions, kinetic energy is converted to internal energy while momentum is still conserved. Rocket propulsion is momentum conservation: ejecting mass dm at exhaust speed v<sub>e</sub> changes the vehicle's velocity by dv = −v<sub>e</sub> dm/m, integrating to the Tsiolkovsky equation.","Angular momentum, <b>L</b> = <b>r</b> × <b>p</b>, is conserved when no net external torque acts, a consequence of isotropy. It explains Kepler's second law, the spin-up of collapsing stars (a solar-type core collapsing to 10 km increases its spin rate by about 10<sup>10</sup>), the flattening of protoplanetary disks and the stability of spinning gyroscopes. In quantum mechanics, angular momentum is quantized in units of ħ, and total angular momentum (orbital plus spin) is conserved in all interactions.","Conservation laws apply locally through continuity equations, ∂ρ/∂t + ∇·<b>J</b> = 0: a conserved quantity can change in a region only by flowing through its boundary. Electric charge conservation follows from U(1) gauge symmetry and is tested by searches for electron decay (Borexino: τ(e → γν) > 6.6 × 10<sup>28</sup> yr). Baryon and lepton number are conserved in all observed reactions but are accidental symmetries of the Standard Model, which nonperturbative effects violate at high temperature.","Discrete symmetries give multiplicative conservation laws. Parity
