oday.","A planet's atmosphere depends on its size, distance from the Sun and history. Mercury is too small and hot to hold much air. Venus and Earth probably started with similar amounts of water and carbon, but stronger sunlight on Venus evaporated any oceans. Water vapor trapped more heat, and carbon dioxide built up in the air: a runaway greenhouse effect. On Earth, oceans and rocks lock carbon away through the carbonate–silicate cycle, which works like a natural thermostat.","Mars is about half Earth's width and cooled faster. Ancient riverbeds, deltas and minerals that form in water show it was once wetter, with thicker air. After its magnetic field faded, the solar wind slowly stripped away much of its atmosphere, as NASA's MAVEN orbiter has measured. Today its air pressure is less than 1% of Earth's, and liquid water can't last on the surface.","Earth is the only one with active plate tectonics, which recycles crust, builds continents and helps control climate over millions of years. Why Earth has moving plates while Venus, nearly the same size, seems to have one solid outer shell is a big question in planetary science."],"x":["Spacecraft have visited all four. MESSENGER orbited Mercury from 2011 to 2015, and BepiColombo is due to arrive in November 2026. Soviet Venera landers survived on Venus's surface for up to about two hours, and Magellan mapped it with radar through the clouds. Mars has been explored by orbiters, landers and rovers since the 1960s, including Curiosity and Perseverance, which is collecting samples meant to be returned to Earth.\nNASA's InSight lander used marsquakes to measure the size of Mars's core.","Mercury isn't the hottest planet. Venus is, at about 465 °C, because its thick CO<sub>2</sub> atmosphere traps heat, while Mercury's night side drops below −170 °C.\nMars is red because of iron oxide (rust) in its dust, not because it's hot.\nVenus is called Earth's twin because of its size, but the air pressure on its surface is about 92 times Earth's, like being 900 m underwater.","Did Mars once have life, and could microbes survive underground today? Perseverance has found interesting rock features in Jezero crater, but confirming life would probably require bringing samples back to Earth. Whether Venus ever had oceans, and how volcanically active it is today, are also open questions."],"terms":["The separation of a planet's interior into layers by density.","Warming that feeds on itself until oceans evaporate, as happened on Venus.","The movement of large pieces of a planet's outer shell, which recycles crust.","The region around a planet controlled by its magnetic field, which deflects the solar wind.","The geological cycle that moves CO₂ between air, oceans and rocks, helping control climate."],"s":"Mercury, Venus, Earth and Mars formed from rock and metal in the hot inner solar system. They all have an iron core, rocky mantle and crust, but they turned out very differently. Mercury is scorched and nearly airless. Venus has a crushing carbon dioxide atmosphere and a runaway greenhouse effect. Earth has oceans, moving plates and life. Mars became a cold desert after losing most of its air.","why":"The rocky planets are natural experiments in how Earth-like worlds can change. Venus shows how a greenhouse effect can run out of control; Mars shows how a planet can lose its air and water. Comparing them helps us understand Earth's climate and judge which exoplanets might be habitable."},"giant-planets":{"how":["The giants probably formed beyond the frost line, where ice let solid cores grow to about ten Earth masses. Once a core is that big, its gravity can quickly pull in hydrogen and helium gas. Jupiter and Saturn captured a lot of gas; Uranus and Neptune formed later or farther out, when less gas remained, so they have more ice and rock.","Deep inside Jupiter and Saturn, pressure reaches millions of times Earth's air pressure, and hydrogen becomes a metallic liquid that conducts electricity. Its motion creates huge magnetic fields; Jupiter's magnetosphere is the largest structure in the solar system. Data from NASA's Juno spacecraft suggest Jupiter's core is 'fuzzy', blending into the surrounding hydrogen instead of having a sharp edge.","Their weather is driven by internal heat and fast spinning; a day on Jupiter is less than 10 hours. Their atmospheres form bands of jet streams blowing in alternating directions. Jupiter's Great Red Spot is a storm wider than Earth that has lasted for centuries, though it's been shrinking. Neptune has the fastest winds measured in the solar system, over 2,000 km/h.","Saturn's rings are mostly chunks of water ice, from dust grains to pieces the size of houses, spread over about 280,000 km but usually only about 10 meters thick. Data from the Cassini spacecraft suggest they might be fairly young, perhaps a few hundred million years old, though this is debated. Moons shape the rings with their gravity, carving gaps and keeping narrow ringlets in place."],"x":["Pioneer and Voyager flybys in the 1970s and 80s gave the first close-up views, and Voyager 2 is still the only spacecraft to visit Uranus (1986) and Neptune (1989). Galileo orbited Jupiter and dropped a probe into its atmosphere in 1995. Cassini orbited Saturn for 13 years before diving into it in 2017. Juno, orbiting Jupiter since 2016, maps its gravity to study its interior.\nNeptune was discovered in 1846 using math: astronomers predicted its position from unexplained wobbles in Uranus's orbit.","Gas giants aren't gas all the way down. Under increasing pressure, hydrogen becomes a hot, dense fluid and, deeper down, a metallic liquid.\nSaturn isn't the only planet with rings; all four giants have them, but Saturn's are by far the brightest.\nJupiter isn't a 'failed star' that almost made it: it would need about 80 times its mass to fuse hydrogen.","How did the giants form quickly enough, before the gas disk disappeared? How big and how mixed are their cores? Why does Uranus spin on its side, tilted 98°, possibly after a giant impact? Uranus and Neptune are the least explored planets; a Uranus orbiter and probe was ranked the top new flagship mission in the 2022 US planetary science survey."],"terms":["A giant planet made mostly of hydrogen and helium, like Jupiter and Saturn.","A giant planet with a large share of water, ammonia and methane, like Uranus and Neptune.","Hydrogen squeezed so much that it conducts electricity like a metal.","A giant, long-lasting storm in Jupiter's southern half.","When orbital periods form a simple whole-number ratio, so bodies tug on each other regularly."],"s":"Jupiter and Saturn are gas giants made mostly of hydrogen and helium. Uranus and Neptune are ice giants, with more water, ammonia and methane beneath hydrogen-rich atmospheres. Together they hold over 99% of the mass of all the planets. None has a solid surface, and all have powerful storms, jet streams, rings and many moons.","why":"The giant planets shaped the whole solar system. Their gravity steered smaller bodies, may have delivered water to the inner planets and still redirects comets. They are also models for the many giant planets found around other stars."},"ocean-moons":{"how":["Far from the Sun, sunlight can't keep water liquid, so these oceans rely on heat from inside. The main source is tidal heating: moons on slightly oval orbits get squeezed and stretched as their distance from the planet changes, like a ball warming up when you squeeze it repeatedly. Orbital resonances keep the orbits oval; Io, Europa and Ganymede orbit Jupiter in a 1:2:4 rhythm that keeps pumping in energy. Radioactive decay in their rocky cores adds more heat.","Europa's ocean lies under an ice shell perhaps 15–25 km thick and touches a rocky seafloor. That matters because water reacting with rock can release chemical energy and nutrients, like at hydrothermal vents on Earth's ocean floor, where whole ecosystems live without sunlight.","Enceladus is only 500 km across, but cracks near its south pole, nicknamed 'tiger stripes', shoot out plumes of water vapor and ice. The Cassini spacecraft found hydrogen gas in the plumes, a possible food source for microbes, and in 2023 scientists reported phosphates in ice grains, one of the last key ingredients for life as we know it.","Titan is unique: it has a thick nitrogen atmosphere, methane rain, rivers and lakes, complex carbon chemistry and probably a water ocean deep under its crust. It lets scientists study chemistry that might resemble early steps toward life, in a world very different from Earth."],"x":["The Galileo spacecraft's magnetometer showed that Europa reacts to Jupiter's magnetic field as if it contains a salty ocean that conducts electricity. At Enceladus, Cassini discovered geysers of water vapor and ice, flew through them, and detected salts, silica, organic molecules and hydrogen gas, suggesting hot water activity on the seafloor. A slight wobble in Enceladus's spin showed that its icy crust floats on a global ocean.\nNASA's Europa Clipper (launched 2024) and the European Space Agency's JUICE are on their way to Jupiter.","These oceans aren't shallow puddles; Europa's is estimated to hold about twice as much water as all of Earth's oceans.\nLiquid water doesn't mean life exists there. Life also needs energy and the right chemistry, and even then it might never have started.\nTitan's famous lakes are liquid methane and ethane, not water; its water ocean is deep below.","Are these oceans habitable, with enough chemical energy and the right elements? How thick are the ice shells, and does material move between the ocean and the surface? Does anything live there? Europa Clipper, arriving in 2030, will study whether Europa could support life, and Dragonfly, a nuclear-powered drone, is scheduled to launch to Titan in 2028."],"terms":["Heat produced inside a moon as a planet's changing gravity flexes it.","A body of liquid water hidden beneath a world's icy or rocky surface.","The frozen outer crust covering an ocean moon.","A jet of gas and particles erupting from a surface.","An opening in the seafloor where hot, mineral-rich water flows out."],"s":"Several moons of the outer planets hide oceans of liquid water beneath icy shells. Jupiter's moon Europa and Saturn's moon Enceladus are the strongest cases, and Ganymede, Callisto and Titan very likely have oceans too. Heat from being squeezed by their planet's gravity keeps the water from freezing. Because liquid water, energy and the right chemicals are thought to be key ingredients for life, these moons are top places to search for life beyond Earth.","why":"Ocean moons show that habitable environments might be common in places once thought far too cold, greatly expanding where we can search. Finding life in an ocean that formed separately from Earth's would suggest life starts easily in the universe."},"small-bodies":{"how":["Most asteroids orbit in the main belt between Mars and Jupiter, where Jupiter's gravity kept a planet from forming. The biggest object there, Ceres, is a dwarf planet about 940 km across. Asteroids come in types: carbon-rich (the most common), stony and metallic. Gaps in the belt, called Kirkwood gaps, are orbits cleared out by Jupiter's regular gravitational tugs.","Comets formed in the cold outer solar system and are stored in the Kuiper belt (short-period comets, with orbits under 200 years) and the distant Oort cloud (long-period comets). A comet's nucleus is a dark, porous mix of ice, dust and organic material, usually a few kilometers across. Near the Sun, its ice turns straight into gas, forming a coma that can be bigger than the Sun, a straight blue ion tail pushed by the solar wind and a curved dust tail pushed by sunlight.","Near-Earth objects are asteroids and comets whose orbits come close to Earth's. Small impacts are common and big ones are rare. Dust and tiny rocks arrive constantly; objects tens of meters across, like the 2013 Chelyabinsk meteor, hit about once or twice a century; kilometer-sized ones that could affect the whole planet hit about every few hundred thousand to a million years; and dinosaur-killer-sized ones about every hundred million years.","Three visitors from other star systems have been confirmed: 'Oumuamua in 2017, a long, thin object with no visible coma; comet 2I/Borisov in 2019; and comet 3I/ATLAS, discovered in July 2025. They are real samples of material from planetary systems around other stars."],"x":["Spacecraft have visited dozens of small bodies. Rosetta orbited comet 67P and landed the Philae probe on it in 2014. Japan's Hayabusa2 and NASA's OSIRIS-REx brought back samples from asteroids Ryugu (2020) and Bennu (2023). Bennu's samples contain amino acids and all five bases used in DNA and RNA. NASA's DART spacecraft deliberately crashed into the small moon Dimorphos in 2022, shortening its orbit by about 32 minutes, the first test of planetary defense.\nThe 180 km Chicxulub crater in Mexico records the impact that ended the age of dinosaurs 66 million years ago.","The asteroid belt isn't crowded; its total mass is only about 3% of the Moon's, and spacecraft fly through it without dodging anything.\nComet tails don't stream behind the comet along its path; they point away from the Sun, pushed by sunlight and the solar wind.\nMeteors, or 'shooting stars', aren't stars; most are grains the size of sand burning up in the atmosphere, often debris left along a comet's orbit.","How much of Earth's water and organic material came from asteroids versus comets is still debated, because different comets give conflicting chemical clues. The Vera C. Rubin Observatory is expected to discover millions of new small bodies and improve the list of potentially dangerous asteroids: most kilometer-sized ones are known, but many smaller ones aren't."],"terms":["The region between Mars and Jupiter where most asteroids orbit.","The solid, icy core of a comet, usually a few kilometers across.","The cloud of gas and dust surrounding an active comet's nucleus.","An asteroid or comet whose orbit brings it close to Earth's.","A piece of space rock that survives its fall through the atmosphere and reaches the ground."],"s":"Asteroids and comets are leftovers from when the planets formed. Asteroids are rocky or metal, and most orbit between Mars and Jupiter. Comets are icy bodies from the Kuiper belt and Oort cloud that grow glowing clouds and tails when they get close to the Sun. They preserve material from the solar system's birth, may have brought water and organic molecules to Earth, and sometimes crash into planets.","why":"Small bodies are time capsules from the early solar system, possible sources of Earth's water and the chemistry that led to life, potential future resources, and the one natural disaster that could cause global catastrophe but might be prevented with technology."},"rockets":{"how":["Thrust comes from throwing mass out the back: it equals roughly how much mass leaves per second times how fast it leaves. The most important measure of an engine's efficiency is its exhaust velocity, often given as 'specific impulse'. Kerosene–oxygen engines reach about 3 km/s, hydrogen–oxygen engines about 4.4 km/s in space, and ion engines over 30 km/s, but with very tiny thrust.","The Tsiolkovsky rocket equation, Δv = v<sub>e</sub> ln(m<sub>0</sub>/m<sub>f</sub>), connects the speed change a rocket can achieve (Δv) to its exhaust velocity (v<sub>e</sub>) and the ratio of its fueled mass to its empty mass. Because of the natural logarithm, each extra km/s needs exponentially more fuel. A single-stage rocket reaching orbit would need about 90% or more of its launch mass to be fuel.","Staging solves this. When a stage runs out of fuel, its empty tanks and engines are dropped, so the rest of the rocket doesn't have to carry that dead weight. Most orbital rockets use two or three stages. Launching eastward near the equator adds a free boost from Earth's rotation of up to about 0.46 km/s.","Missions are planned with a 'Δv budget'. Reaching low Earth orbit costs about 9.4 km/s including losses. From there, it takes about 3.2 km/s more to head to the Moon, about 3.6 km/s to head to Mars, plus extra to enter orbit or land. Leaving the solar system directly from low Earth orbit takes about 8.8 km/s more, which is why missions use gravity assists."],"x":["Konstantin Tsiolkovsky worked out the rocket equation in 1903. Robert Goddard launched the first liquid-fueled rocket in 1926. Germany's V-2 became the first human-made object to reach space in 1944. Sputnik 1 reached orbit in 1957, Yuri Gagarin became the first human in orbit in 1961, and Apollo 11 landed on the Moon in 1969, launched by the giant Saturn V. Since 2015, reusable boosters that land upright, pioneered by SpaceX's Falcon 9, have greatly lowered the cost of launches.","Rockets don't push against air or the ground; they push against their own exhaust, which is why they work even better in a vacuum.\nAstronauts in orbit aren't beyond Earth's gravity; at the International Space Station's height it's about 90% as strong as on the ground. They float because they're constantly falling around Earth.\nGetting to space isn't mostly about going up. Space starts around 100 km up, but staying there requires enormous sideways speed.","Fully reusable heavy rockets like SpaceX's Starship aim to cut costs further and carry large loads to the Moon and Mars. Beyond chemical rockets, ion engines (already used on deep-space missions), nuclear thermal rockets with about twice the efficiency of chemical engines, and solar sails are in use or being developed. Reaching other stars within a human lifetime would need technology far beyond today's, like light sails pushed by giant lasers."],"terms":["The force a rocket engine produces by shooting out exhaust.","How fast exhaust leaves an engine; higher means more efficient.","The total change in speed a spacecraft can achieve or a mission needs.","Dropping empty sections of a rocket during flight to get rid of weight.","Δv = v<sub>e</sub> ln(m<sub>0</sub>/m<sub>f</sub>); connects the speed change a rocket can reach to its exhaust speed and fuel-to-empty mass ratio."],"s":"Rockets shoot mass backward at high speed, and because momentum is conserved, they move forward. Unlike jet engines, they carry their own oxygen supply (oxidizer), so they work in the vacuum of space. Reaching low Earth orbit means moving sideways at about 7.8 km/s; with air drag and gravity working against the rocket, a launch needs a total speed change of roughly 9.3–10 km/s. The rocket equation explains why rockets are mostly fuel and are built in stages.","why":"Rockets made satellites, human spaceflight and planetary exploration possible, which gave us weather forecasting, GPS, global communications and nearly every mission in this guide. Their limits shape what missions can do and how much they cost."},"missions":{"how":["Missions get harder in stages: flyby, orbiter, lander, rover, sample return and human exploration. Flybys are the cheapest way to get a first look; orbiters map a world for years; landers and rovers study the surface directly; and sample returns bring material back to labs on Earth, which are far more capable than any instrument on a spacecraft.","Distance affects everything. Radio signals take 3 to 22 minutes to reach Mars one way, so rovers drive partly on their own. Beyond Jupiter, sunlight is too weak for most solar panels, so probes like Voyager, Cassini and New Horizons use generators powered by the heat of decaying plutonium-238. Juno is an exception, using huge solar panels at Jupiter.","NASA's Deep Space Network, with giant antennas in California, Spain and Australia spread around the globe, stays in contact with distant probes. Voyager 1's transmitter puts out about 23 watts, roughly as much as a fridge light bulb. By the time its signal crosses about 25 billion km, it's incredibly faint, and 70-meter dishes are needed to pick it up.","Human spaceflight also needs life support, radiation protection and a safe way home. Apollo astronauts spent up to about three days on the Moon. Space station crews have shown people can live in orbit for a year or more, but a trip to Mars would mean much more radiation and long periods of weightlessness, which weakens bones and muscles."],"x":["Sputnik 1, the first satellite (1957). Luna 2, the first spacecraft to reach the Moon (1959); Luna 3 photographed the far side. Vostok 1, with Yuri Gagarin, the first human in space (1961). Apollo 11, the first humans on the Moon (1969); 12 people walked there through 1972. Venera 7, the first successful landing on another planet, Venus (1970). Viking 1, the first long-lasting Mars lander (1976). Huygens, the first landing in the outer solar system, on Titan (2005). Voyager 1, the first to enter interstellar space (2012). Philae, the first comet landing (2014). Chang'e 4, the first landing on the Moon's far side (2019).","Voyager 1 hasn't left the solar system in every sense. It crossed the heliopause, where the solar wind ends, but the Oort cloud is far beyond, and passing through it will take tens of thousands of years.\nThe ISS isn't deep in space; it orbits about 400 km up, a distance you could drive in about four hours.\nMost exploration has been done by robots, which have visited far more of the solar system than humans.","In April 2026, Artemis II carried four astronauts around the Moon, the first crewed lunar flight since 1972. Later Artemis missions aim to land astronauts near the Moon's south pole, and China plans crewed Moon landings by 2030. Europa Clipper and JUICE are heading to Jupiter's moons, Dragonfly is headed for Titan, and the ISS is planned to retire around 2030, to be replaced by commercial stations."],"terms":["A mission that passes a planet or moon without stopping or orbiting.","A mission that collects material and brings it back to Earth.","NASA's worldwide set of giant antennas for communicating with distant spacecraft.","Radioisotope thermoelectric generator: makes electricity from the heat of decaying radioactive material.","Orbits about 160–2,000 km above Earth, where the ISS and most satellites fly."],"s":"Since 1957, robotic and human missions have explored every planet; landed on the Moon, Mars, Venus, Titan, asteroids and a comet; and sent probes beyond the Sun's influence into interstellar space. Humans have walked on the Moon and have lived continuously in orbit on the International Space Station since 2000. Each mission was built to answer specific questions, and many found surprises.","why":"Space missions turned planets from points of light into detailed worlds, discovered ocean moons and ancient lakes on Mars, and sent back images like Earthrise and the Pale Blue Dot that changed how humanity sees itself."},"interplanetary":{"how":["Planets orbit the Sun at different speeds: Earth at about 30 km/s and Mars at about 24 km/s. A spacecraft leaving Earth already moves at Earth's speed, so to reach an outer planet it speeds up a little, which stretches its orbit outward; to reach an inner planet it slows down.","A Hohmann transfer is the lowest-energy, two-burn path between two circular orbits: an ellipse whose closest point touches the inner orbit and whose farthest point touches the outer one. From Earth to Mars, it takes about 8.5 months. The spacecraft has to arrive when Mars gets there, so launch windows open only about every 26 months.","In a gravity assist, a spacecraft flies close to a planet. Compared with the planet, it leaves at the same speed it arrived, just in a new direction. But compared with the Sun, the planet's own motion adds to or subtracts from the spacecraft's speed. Passing behind a moving planet speeds the craft up; passing in front slows it down.","Arriving requires braking. Spacecraft fire engines to enter orbit or use aerobraking, dipping into a planet's atmosphere again and again to lose speed. Mars landers use a heat shield, parachutes and rockets; Curiosity and Perseverance were lowered on cables by a 'sky crane'. The landing takes about seven minutes and runs completely on its own because radio signals take too long to send commands."],"x":["Walter Hohmann described the minimum-energy transfer in 1925. In the early 1960s, Michael Minovitch showed how gravity assists could make missions to the outer planets practical, and Gary Flandro identified a rare alignment of the outer planets in the late 1970s, which happens about every 175 years. Voyager 2 used it to visit Jupiter, Saturn, Uranus and Neptune. Mariner 10 made the first planetary gravity assist, at Venus, in 1974.","Gravity assists don't create energy from nothing: the spacecraft gains speed by taking a tiny, unnoticeable amount of orbital energy from the planet.\nGoing toward the Sun isn't easy just because you're 'falling'. Reaching Mercury or the Sun means getting rid of much of Earth's 30 km/s orbital speed, which takes a lot of energy; Parker Solar Probe needed seven Venus flybys.\nThe shortest path is rarely the cheapest.","Faster trips to Mars would reduce radiation exposure for astronauts, and nuclear propulsion is being studied for this. Missions increasingly use low-thrust ion engines, like NASA's Psyche mission to a metal-rich asteroid, and complicated multi-flyby routes, like the European Space Agency's JUICE, which loops past Earth, the Moon and Venus on its way to Jupiter."],"terms":["The lowest-energy, two-burn path between two circular orbits.","The time period when planet positions allow an efficient trip.","Using a planet's gravity and motion to change a spacecraft's speed and direction.","Slowing a spacecraft by passing through a planet's upper atmosphere.","The time it takes for two planets to return to the same alignment."],"s":"Spacecraft don't travel in straight lines between planets; they follow curved orbits around the Sun. The most fuel-efficient path, called a Hohmann transfer, is half of an ellipse that touches both planets' orbits, and it only works when the planets are lined up correctly, during a launch window. Gravity assists, swinging past planets to gain or lose speed, let missions reach the outer solar system with much less fuel.","why":"Orbital mechanics decides when we can go, how long the trip takes, what it costs and what we can reach at all. Clever paths made missions like Voyager, Cassini and New Horizons possible with modest rockets."}},HSF={"cosmology":"How the universe began, what it's made of, how it's changing and how it might end.","astrophysics":"How stars, galaxies and black holes work, and the physics that powers them.","solar":"The Sun, planets, moons, comets and asteroids, and how our solar system formed.","astrobio":"How life started, where it can survive and how scientists search for it beyond Earth.","observing":"Telescopes, light, the night sky and the different signals that bring us information from space.","space":"Rockets, orbits and the missions that have explored the solar system.","relativity":"How speed and gravity change space and time, and why nothing outruns light.","quantum":"The surprising rules that atoms, light and tiny particles follow.","particle":"The basic building blocks of everything, and the forces that act between them.","nuclear":"Radioactivity, nuclear power, fusion and the machines that study the nucleus.","classical":"Motion, energy, heat, electricity and light: the foundations of physics.","frontier":"Unsolved questions at the edge of physics: quantum gravity, antimatter, time and the multiverse. Mostly unproven."},HSM={"big-bang":"The main stages of the universe's history. The horizontal axis is time since the Big Bang and the vertical axis is temperature, both on logarithmic scales: each step to the right is ten times later. The universe cools as it expands.","expansion":"Each dot is a galaxy. Pick one, and arrows show how fast every other galaxy moves away from it. Farther galaxies have longer arrows (Hubble's law), and the pattern looks the same from every galaxy, so there's no center.","dark-matter":"How fast stars orbit at different distances from a galaxy's center. Visible matter alone predicts speeds that drop off far from the center, but measured speeds stay roughly flat. Adding a dark matter halo fixes the difference. The curves are a simplified model of a galaxy like the Milky Way, not real data.","dark-energy":"What share of the universe's energy each ingredient makes up, today compared with 380,000 years after the Big Bang. Matter and radiation thin out as space expands, but dark energy doesn't, so it grew from almost nothing to the largest share. Values are rounded from Planck satellite data.","stellar-life":"Choose a set, then move through it with the slider or by tapping the strip. Sizes use a logarithmic scale so a tiny white dwarf and a huge supergiant both fit; the dashed circle shows the Sun at the same scale. Colors roughly match surface temperature. Times and sizes are approximate.","black-holes":"Choose a mass to see how big the black hole's event horizon is. Its radius, r<sub>s</sub> = 2GM/c², grows in direct proportion to mass: double the mass, double the size. The drawing uses a log scale; the exact size is printed below.","exoplanets":"A planet passing in front of its star blocks a fraction (R<sub>p</sub>/R<sub>★</sub>)² of its light. The graph shows the star's brightness over time; the vertical axis rescales so even tiny dips are visible. Earth passing in front of the Sun would dim it by only 0.0084%, which is why small planets are hard to find.","special-rel":"Set the ship's speed. Each clock makes one full turn per year of its own time. Seen from Earth, the ship's clock runs slow by the Lorentz factor γ, and the ship is shorter in its direction of motion by the same factor (the dashed outline shows its length at rest).","emc2":"The energy you'd get if a mass turned completely into energy, E = mc², compared with familiar energies on a log scale (each gridline is ten times more). Real processes only convert a fraction: fission about 0.1% of the fuel's mass and fusion about 0.7%; only matter–antimatter annihilation converts all of it.","general-rel":"How fast a clock in orbit runs compared with one on the ground, in microseconds per day. Weaker gravity higher up makes it run fast (general relativity), while its orbital speed makes it run slow (special relativity). Below about 3,200 km the speed effect wins. GPS satellites gain about 38 microseconds per day overall.","duality":"Particles are sent through two slits one at a time. Each one lands at a single random spot, but as they build up, an interference pattern appears. Turn on a detector that records which slit each particle goes through, and the pattern disappears, leaving two plain bands.","uncertainty":"A wave passing through a slit of width Δx comes out spread over a range of directions, which means a spread in sideways momentum Δp. Narrowing the slit pins down the position more, but the pattern on the screen gets wider. Their product never drops below ħ/2. Units are illustrative.","atoms":"Hydrogen's energy levels, E<sub>n</sub> = −13.6 eV / n². When the electron drops from a higher level to a lower one, it gives off a photon with exactly the energy difference. Drops to level 2 (the Balmer series) make the visible colors astronomers use to spot hydrogen in stars and nebulae.","standard-model":"The 17 named fundamental particles. Columns I, II and III are the three generations of matter, which are identical except for mass. Tap a tile for details. Masses are official measured values; neutrino masses are only known to be very small.","forces":"Roughly how strong each force is at the scale of a proton, on a logarithmic scale, along with the particle that carries it and how far it reaches. These comparisons change with energy and distance, so treat them as rough values. Tap a force for details.","newton":"A cannonball fired sideways from a mountain 500 km high (exaggerated). Too slow and it falls back to Earth; at exactly the right speed it orbits along the dashed circle; faster gives a stretched ellipse; and at escape speed (√2 times circular speed) it leaves forever. Uses Newton's law of gravity.","entropy":"160 gas particles start in the left half of a box. Remove the wall and they spread out. Entropy, S = k<sub>B</sub> ln W, counts how many arrangements W match each left/right split. The even split has by far the most arrangements, so the gas ends up there and stays.","em":"Slide across 15 powers of ten in wavelength. The bar shows where each type of light sits on a log scale, and the wave above stretches or shrinks to match (not to scale). Photon energy is E = hc/λ; above about 10 eV, photons have enough energy to knock electrons off atoms.","units":"Distances on a log scale (each gridline is ten times farther), with markers for how long light takes. Pick a destination to compare how long light, a car at 100 km/h and the Voyager 1 probe (about 17 km/s) would take to get there.","rocky-planets":"Pick a planet to compare it with Earth, drawn to the same scale. Giant planets have no solid surface, so their gravity and temperature are measured at the cloud tops. Day length means the time from one noon to the next.","giant-planets":"Pick a planet to compare it with Earth, drawn to the same scale. Giant planets have no solid surface, so their gravity and temperature are measured at the cloud tops. Day length means the time from one noon to the next.","the-moon":"Left: looking down from above Earth's North Pole, with sunlight coming from the right; the Moon's sunlit half always faces the Sun. Right: how the Moon looks from Earth's Northern Hemisphere at that point. Sizes and distances aren't to scale.","habitable-worlds":"Choose a star and how far the planet orbits. The green band is a cautious estimate of the habitable zone, where liquid water could exist. Temperatures are estimates: one assumes the planet reflects light like Earth, and the 'with greenhouse' value adds Earth's ~33 °C of greenhouse warming. Real habitability depends on much more.","seti":"Set each factor in the Drake equation to estimate N, the number of civilizations in the Milky Way that could be communicating right now. The first three factors are now roughly measured; the rest are guesses that could be off by huge amounts. Dots show N spread through a simple model of the galaxy's disk.","telescopes":"Light-gathering power grows with mirror area, and the sharpest possible detail improves as the mirror gets wider (shown here for green light, 550 nm). On the ground, the atmosphere usually blurs images to about 0.5–1 arcsecond unless adaptive optics correct it. JWST is built for infrared light, where its detail is coarser than the visible-light value shown.","rockets":"How much speed a single-stage rocket can gain, from the rocket equation Δv = v<sub>e</sub> ln(m<sub>0</sub>/m<sub>f</sub>). Everything that isn't fuel (structure, engines and cargo) counts as the final mass. The targets are approximate speed changes needed from Earth's surface, including losses to air drag and gravity.","radioactivity":"400 radioactive nuclei, each set to decay at a random moment following the exponential law. You can't predict when any single nucleus will decay, but the group always halves every half-life. Pick an isotope to change the time units; the statistics stay the same.","fate-universe":"How the size of the universe changes over time in four possible futures (today's size = 1). The curves are illustrations: the 'cosmological constant' curve uses the standard model of cosmology, while the Big Rip and Big Crunch curves show dark energy getting stronger or reversing after today."};
const E=[{"id":"big-bang","t":"The Big Bang","c":"Cosmology","st":"est","sc":26.6,"fig":"Age of the universe: <b>13.787 ± 0.020 billion years</b> (Planck 2018)","s":"The Big Bang model is the description, within general relativity, of a homogeneous and isotropic universe that has expanded and cooled adiabatically from an extremely hot, dense early state. It is not an explosion from a point: the scale factor <i>a</i>(t) multiplies all intergalactic distances at once, and every comoving observer sees the same recession pattern. Three quantitative pillars support it: the redshift–distance relation, the 2.7255 K blackbody cosmic microwave background, and primordial light-element abundances that match nucleosynthesis calculations. The model is predictive only after the Planck time, t<sub>P</sub> = √(ħG/c⁵) ≈ 5.4 × 10<sup>−44</sup> s; earlier epochs require a quantum theory of gravity.","m":"About 13.8 billion years ago, everything in the universe was packed into a tiny, super-hot space. Since then, space has been stretching and cooling. It was not a bomb going off in one spot. Space itself grew everywhere at once, like dough rising with raisins spreading apart.","r":["cmb","expansion","bbn","inflation"]},{"id":"cmb","t":"Cosmic Microwave Background","c":"Cosmology","st":"est","sc":26.6,"fig":"Temperature today: <b>2.7255 K</b>; released ~380,000 years after the Big Bang","s":"The cosmic microwave background is relic radiation from the epoch of recombination at z ≈ 1,090, when the plasma cooled to about 3,000 K and photons decoupled from matter. Its spectrum is a blackbody at T<sub>0</sub> = 2.7255 ± 0.0006 K, with spectral distortions limited to parts in 10<sup>5</sup>. Temperature anisotropies of ΔT/T ~ 10<sup>−5</sup>, decomposed in spherical harmonics, encode acoustic oscillations of the photon–baryon fluid. Fits to the Planck angular power spectrum fix the ΛCDM parameters at the percent level or better.","m":"There is a faint glow left over from the early universe, coming from every direction in the sky. It started as hot light and has cooled to just under 3 degrees above absolute zero. Tiny hot and cold spots in it are like a baby picture of the universe, showing where galaxies would later form.","r":["big-bang","dark-matter","bbn"]},{"id":"expansion","t":"Cosmic Expansion and Hubble's Law","c":"Cosmology","st":"strong","sc":24,"fig":"Hubble constant H<sub>0</sub>: <b>~67 km/s/Mpc</b> (CMB) vs <b>~73 km/s/Mpc</b> (supernovae): the 'Hubble tension'","s":"Hubble–Lemaître's law, v = H<sub>0</sub>d, is the low-redshift limit of FLRW kinematics, in which proper distances grow in proportion to the scale factor. Redshift measures the ratio of scale factors between emission and observation, not a velocity through space. The present expansion rate is in significant dispute: CMB-calibrated ΛCDM gives H<sub>0</sub> = 67.4 ± 0.5 km/s/Mpc, while the SH0ES Cepheid–supernova distance ladder gives about 73.0 ± 1.0. This roughly 5σ discrepancy, the Hubble tension, is either an unidentified systematic or evidence for physics beyond ΛCDM.","m":"Almost every galaxy is moving away from us, and the farther away it is, the faster it moves. We know this because their light is stretched toward red. Scientists agree space is expanding, but two different ways of measuring the speed give slightly different answers, and nobody is sure why yet.","r":["big-bang","dark-energy","units"]},{"id":"dark-matter","t":"Dark Matter","c":"Cosmology","st":"strong","sc":21,"fig":"About <b>27%</b> of the universe's energy content; ~5× more than ordinary matter","s":"Dark matter is nonbaryonic, nonrelativistic, effectively collisionless mass whose existence is inferred purely from gravity. Independent probes agree on its abundance: rotation curves, cluster virial masses, weak and strong lensing, the CMB acoustic peaks and the growth of structure all require Ω<sub>c</sub>h² ≈ 0.120, about 5.4 times the baryon density. Its particle identity is unknown. Underground xenon experiments now constrain WIMP–nucleon cross sections below about 10<sup>−47</sup> cm² near 30–40 GeV, and no collider or indirect-detection signal has been confirmed.","m":"Galaxies spin so fast they should fly apart, unless there is a lot of extra mass we cannot see. Scientists call this invisible stuff dark matter. We can measure its pull, but no one knows yet what it is made of.","r":["dark-energy","galaxies","cmb"]},{"id":"dark-energy","t":"Dark Energy","c":"Cosmology","st":"strong","sc":26.6,"fig":"About <b>68%</b> of the universe's energy content; expansion has been accelerating for ~6 billion years","s":"Dark energy is the component, Ω<sub>Λ</sub> ≈ 0.685, whose negative pressure drives the accelerating expansion first detected in 1998 from Type Ia supernova distances (2011 Nobel Prize). In the simplest model it is a cosmological constant with equation of state w = p/ρc² = −1, physically equivalent to a vacuum energy density of about 6 × 10<sup>−27</sup> kg/m³. DESI baryon acoustic oscillation data from 2024–2025, combined with the CMB and supernovae, prefer an evolving w(<i>a</i>) at 2.8–4.2σ depending on the supernova sample. That preference is suggestive but not yet a discovery.","m":"The universe is not just expanding, it is expanding faster and faster. Something is pushing it apart, and scientists call it dark energy. It makes up most of the universe, but we do not know what it actually is.","r":["expansion","dark-matter"]},{"id":"inflation","t":"Cosmic Inflation","c":"Cosmology","st":"open","sc":-35,"fig":"Proposed duration: roughly <b>10<sup>-36</sup> to 10<sup>-32</sup> s</b> after the Big Bang","s":"Inflation is a hypothesized epoch of quasi-exponential expansion, <i>a</i> ∝ e<sup>Ht</sup>, lasting at least about 60 e-folds, driven by the potential energy of a scalar field before the hot Big Bang. It explains the observed flatness and large-scale homogeneity, and, more importantly, it predicts the statistical properties of the primordial perturbations. Planck measures a nearly scale-invariant, Gaussian, adiabatic spectrum with n<sub>s</sub> = 0.965 ± 0.004, as slow-roll models predict. Inflation is supported but not confirmed: its distinctive signal, primordial tensor modes, is constrained to r < 0.036.","m":"Some scientists think that in the first tiny fraction of a second, the universe grew incredibly fast, much faster than it does now. This idea explains why the universe looks so even in every direction. It fits a lot of evidence, but it has not been proven.","r":["big-bang","cmb","grav-waves"]},{"id":"bbn","t":"Big Bang Nucleosynthesis","c":"Cosmology","st":"est","sc":-15,"fig":"Primordial mix by mass: <b>~75% hydrogen, ~25% helium</b>, traces of lithium","s":"Big Bang nucleosynthesis (BBN) produced the light nuclei D, ³He, ⁴He and ⁷Li between about 10 seconds and 20 minutes after the Big Bang, as the universe cooled from about 1 MeV to 30 keV. With Standard Model physics the only free parameter is the baryon-to-photon ratio η. The CMB measures η = (6.1 ± 0.04) × 10<sup>−10</sup>, and BBN then predicts a helium mass fraction Y<sub>p</sub> ≈ 0.247 and D/H ≈ 2.5 × 10<sup>−5</sup>, in agreement with observations. Lithium-7 is the exception: it is observed at roughly one-third of the predicted abundance.","m":"In the first few minutes after the Big Bang, the universe was like a giant star core and made the first elements: mostly hydrogen and helium. Heavier elements like carbon and iron were made much later inside stars.","r":["big-bang","fusion"]},{"id":"observable","t":"The Observable Universe","c":"Cosmology","st":"est","sc":26.6,"fig":"Radius: <b>~46.5 billion light-years</b> (≈4.4 × 10<sup>26</sup> m)","s":"The observable universe is the region within our particle horizon, the comoving distance light could have traveled since the Big Bang, about 46 billion light-years (14 Gpc) in Planck ΛCDM. It is larger than 13.8 billion light-years because space expanded while the light was in transit. The observable universe contains roughly 10<sup>80</sup> baryons and, depending on the method, 10<sup>11</sup>–10<sup>12</sup> galaxies. Whatever lies beyond the horizon is unobservable in principle, and it may be finite or infinite.","m":"We can only see as far as light has had time to travel to us. That bubble is about 46 billion light-years across in each direction, bigger than you might expect because space kept stretching while the light was on its way. The whole universe could be much bigger.","r":["big-bang","units","expansion"]},{"id":"fusion","t":"Stellar Fusion","c":"Astrophysics","st":"est","sc":9,"fig":"Sun's core: <b>~15 million K</b>; converts ~4 million tonnes of mass to energy per second","s":"Stars are powered by thermonuclear fusion: the conversion of about 0.7% of the rest mass of hydrogen into energy as four protons become one ⁴He nucleus, releasing 26.73 MeV per helium nucleus. In the Sun's core, at T ≈ 1.57 × 10⁷ K and ρ ≈ 150 g/cm³, this proceeds mainly by the proton–proton chain; in stars above about 1.3 solar masses the CNO cycle dominates. Reactions occur only through quantum tunneling of the Coulomb barrier, so rates depend steeply on temperature. Solar neutrino measurements, including Borexino's 2020 detection of CNO neutrinos, confirm the predicted reaction network directly.","m":"Stars are giant fusion power plants. In the Sun's center, hydrogen atoms are squeezed together to make helium, and a tiny bit of mass turns into a huge amount of energy. Almost every atom in your body heavier than hydrogen was made inside a star.","r":["emc2","stellar-life","bbn"]},{"id":"stellar-life","t":"The Life Cycle of Stars","c":"Astrophysics","st":"est","sc":9,"fig":"Mass sets fate: below ~8 M<sub>☉</sub> → white dwarf; above → supernova, neutron star or black hole","s":"A star's evolution is set mainly by its initial mass, with secondary effects from metallicity, rotation and binarity. Main-sequence luminosity scales roughly as L ∝ M<sup>3.5</sup>, so lifetime scales as t ≈ 10<sup>10</sup> yr (M/M<sub>☉</sub>)<sup>−2.5</sup>, from trillions of years for red dwarfs to a few million for O stars. After core hydrogen exhaustion, stars below about 8 M<sub>☉</sub> become red giants, lose their envelopes and leave carbon–oxygen white dwarfs. More massive stars burn successively heavier fuels to an iron core that collapses into a neutron star or black hole.","m":"Stars are born in clouds of gas, shine for millions or billions of years, and then die. Small stars like our Sun puff up and then shrink into a white dwarf. Very big stars explode as supernovas. Bigger stars actually live shorter lives because they use up their fuel faster.","r":["fusion","compact","black-holes"]},{"id":"compact","t":"White Dwarfs and Neutron Stars","c":"Astrophysics","st":"est","sc":4.3,"fig":"Neutron star: <b>~20 km across</b>, density <b>~10<sup>17</sup> kg/m³</b>; white-dwarf mass limit <b>~1.4 M<sub>☉</sub></b>","s":"White dwarfs and neutron stars are supported against gravity not by thermal pressure but by degeneracy pressure, a consequence of the Pauli exclusion principle. A white dwarf packs about 0.6 solar masses into an Earth-sized sphere (ρ ~ 10⁶ g/cm³) and cannot exceed the Chandrasekhar limit, about 1.4 M<sub>☉</sub>. A neutron star packs 1.2–2.3 M<sub>☉</sub> into a radius of about 12 km, near nuclear density. Pulsar timing, X-ray spectroscopy (NICER) and gravitational waves constrain the dense-matter equation of state, but the composition of neutron-star cores remains uncertain.","m":"When a star dies, its core can shrink into something tiny and extremely heavy. A white dwarf packs a Sun's worth of mass into something Earth-sized. A neutron star is even denser: a teaspoon would weigh about a billion tonnes on Earth.","r":["stellar-life","black-holes","uncertainty"]},{"id":"black-holes","t":"Black Holes","c":"Astrophysics","st":"est","sc":4.5,"fig":"Event-horizon radius r<sub>s</sub> = 2GM/c²: <b>~3 km</b> for one solar mass","s":"A black hole is a region of spacetime from which no future-directed causal curve reaches infinity, bounded by an event horizon. In general relativity an isolated, stationary black hole is described completely by its mass, spin and charge (the Kerr–Newman family). The Schwarzschild radius is r<sub>s</sub> = 2GM/c² ≈ 2.95 km per solar mass. Black holes are observed as X-ray binaries, as supermassive objects of 10⁶–10<sup>10</sup> M<sub>☉</sub> in galactic nuclei, through horizon-scale imaging by the Event Horizon Telescope, and through roughly 300 gravitational-wave merger detections.","m":"A black hole is where so much mass is crushed into a small space that its gravity traps everything, even light. We cannot see them directly, but we have photographed the glowing ring around two of them, and we have 'heard' them collide through gravitational waves.","r":["general-rel","grav-waves","compact"]},{"id":"grav-waves","t":"Gravitational Waves","c":"Astrophysics","st":"est","sc":7,"fig":"First detection: <b>14 Sept 2015</b> (GW150914); strain at Earth <b>~10<sup>-21</sup></b>","s":"Gravitational waves are transverse, propagating perturbations of spacetime curvature traveling at c, predicted by general relativity in 1916. Their dimensionless strain amplitude h = ΔL/L from astrophysical sources at Earth is about 10<sup>−21</sup>. Since LIGO's 2015 detection of GW150914, the LIGO–Virgo–KAGRA network has catalogued roughly 300 compact-binary mergers, mainly binary black holes, plus binary neutron stars and neutron star–black hole systems. Pulsar timing arrays reported evidence in 2023 for a nanohertz background, most likely from supermassive black hole binaries.","m":"When huge objects like black holes crash together, they shake space itself, sending out ripples. By the time those ripples reach Earth, they are unbelievably tiny, smaller than a proton, but special detectors can measure them.","r":["general-rel","black-holes"]},{"id":"galaxies","t":"Galaxies","c":"Astrophysics","st":"est","sc":21,"fig":"Milky Way: <b>~100,000 light-years</b> across, <b>100–400 billion</b> stars","s":"Galaxies are gravitationally bound systems of stars, gas, dust and dark matter, spanning stellar masses from about 10³ to over 10<sup>12</sup> M<sub>☉</sub>. Their structure and evolution are governed by hierarchical assembly of dark matter halos, gas cooling and star formation, and feedback from supernovae and active galactic nuclei. Most massive galaxies host a central supermassive black hole whose mass correlates with the bulge's velocity dispersion. The Milky Way's, Sagittarius A*, has 4.3 × 10⁶ M<sub>☉</sub>. JWST now observes galaxies at z > 14, less than 300 million years after the Big Bang.","m":"A galaxy is a huge city of stars held together by gravity. Our galaxy, the Milky Way, has hundreds of billions of stars and a giant black hole in its middle. There are billions of other galaxies in the universe.","r":["dark-matter","black-holes","units"]},{"id":"exoplanets","t":"Exoplanets","c":"Astrophysics","st":"est","sc":7,"fig":"Confirmed exoplanets: <b>more than 6,000</b> (NASA archive, 2025)","s":"More than 6,000 exoplanets are confirmed (NASA Exoplanet Archive, as of late 2025), mostly through transits and radial velocities. Planet occurrence statistics show that small planets are common: Kepler data imply roughly one planet per Sun-like star with periods under a year, and about 5–50% of Sun-like stars host an Earth-sized planet in the habitable zone, the large spread reflecting extrapolation uncertainties. Architectures differ greatly from the Solar System. Atmospheric characterization with JWST has detected H<sub>2</sub>O, CO<sub>2</sub>, SO<sub>2</sub> and CH<sub>4</sub>, while claimed biosignatures such as the 2025 K2-18 b report remain disputed.","m":"Exoplanets are planets around other stars. We usually find them by watching a star get slightly dimmer when a planet passes in front of it. Thousands have been found, and most stars probably have planets.","r":["solar-system","fusion"]},{"id":"special-rel","t":"Special Relativity","c":"Relativity","st":"est","sc":null,"fig":"Speed of light: <b>c = 299,792,458 m/s</b> (exact, by definition of the meter)","s":"Special relativity (Einstein, 1905) follows from two postulates: the laws of physics are identical in all inertial frames, and the speed of light in vacuum, c = 299,792,458 m/s, is frame-independent. Together they replace Galilean transformations with Lorentz transformations, under which time intervals, lengths and simultaneity depend on the observer while the spacetime interval is invariant. Its predictions, including time dilation, relativistic momentum and E² = (pc)² + (mc²)², are confirmed to parts in 10<sup>9</sup> or better, and special relativity underpins all of quantum field theory.","m":"Light always travels at the same speed, no matter how fast you are moving. Because of that, time actually runs slower for things moving very fast. Particles from space reach the ground only because their 'clocks' slow down while they zoom toward Earth.","r":["emc2","general-rel"]},{"id":"emc2","t":"Mass–Energy Equivalence","c":"Relativity","st":"est","sc":null,"fig":"<b>E = mc²</b>: 1 gram of mass ≈ <b>9 × 10<sup>13</sup> J</b> (~21 kilotons of TNT)","s":"Mass–energy equivalence states that a body at rest has energy E<sub>0</sub> = mc², and that any change in a system's internal energy changes its inertial mass by ΔE/c². It is the zero-momentum case of the relativistic energy–momentum relation E² = (pc)² + (mc²)². Nuclear and particle physics measure it directly: binding energies appear as mass defects, and the Sun converts about 4.3 × 10⁹ kg of mass into radiation each second. The relation has been verified to better than 1 part in 10⁶ by comparing nuclear γ-ray energies with precision atomic masses.","m":"Einstein showed that mass and energy are two forms of the same thing. A tiny bit of mass holds a gigantic amount of energy. That is how the Sun and nuclear power plants make energy.","r":["fusion","special-rel","standard-model"]},{"id":"general-rel","t":"General Relativity","c":"Relativity","st":"est","sc":null,"fig":"GPS satellite clocks run fast by <b>~38 μs/day</b> net and must be corrected","s":"General relativity (Einstein, 1915) describes gravity as the curvature of spacetime by energy, momentum and stress, encoded in the field equations G<sub>μν</sub> + Λg<sub>μν</sub> = (8πG/c⁴)T<sub>μν</sub>. Freely falling bodies follow geodesics, so inertial and gravitational mass are identical by construction. The theory has passed every precision test: perihelion precession, light deflection, Shapiro delay, gravitational redshift, frame dragging, binary-pulsar orbital decay, black hole imaging and gravitational-wave detection. It fails only where quantum effects become important, at singularities and the Planck scale.","m":"Einstein said gravity is not exactly a pull. Heavy things bend space and time, like a bowling ball on a trampoline, and other things roll along the curves. GPS in your phone only works because engineers correct for this.","r":["black-holes","grav-waves","newton"]},{"id":"duality","t":"Wave–Particle Duality","c":"Quantum","st":"est","sc":-10,"fig":"de Broglie wavelength <b>λ = h/p</b>; Planck constant h = 6.626 × 10<sup>-34</sup> J·s","s":"Quantum objects exhibit both wave-like interference and particle-like localized detection, and neither classical picture alone describes them. Quantum mechanics resolves this with the wavefunction ψ, a complex probability amplitude that evolves deterministically under the Schrödinger equation, with detection probabilities given by |ψ|² (the Born rule). The de Broglie relation λ = h/p assigns a wavelength to any particle: interference has been observed with electrons, neutrons, atoms and molecules of over 2,000 atoms. Light shows the complementary behavior, being emitted and absorbed in quanta of energy E = hf.","m":"Tiny things like light and electrons act like waves sometimes and like little particles other times. In a famous experiment, electrons shot one at a time still make a wave pattern, as if each one goes through two slits at once.","r":["uncertainty","atoms","entanglement"]},{"id":"uncertainty","t":"The Uncertainty Principle","c":"Quantum","st":"est","sc":-10,"fig":"<b>Δx · Δp ≥ ħ/2</b>, with ħ = 1.055 × 10<sup>-34</sup> J·s","s":"The Heisenberg uncertainty principle states that conjugate observables cannot both have sharp values: for position and momentum, σ<sub>x</sub>σ<sub>p</sub> ≥ ħ/2, with ħ = 1.0546 × 10<sup>−34</sup> J·s. It follows from the noncommutativity [x̂, p̂] = iħ and the Fourier relationship between position and momentum wavefunctions, not from measurement imprecision. It sets zero-point energies, the sizes of atoms, natural linewidths and the standard quantum limit of precision measurement, which squeezed light now surpasses in gravitational-wave detectors.","m":"For very tiny particles, the more exactly you know where something is, the less exactly you can know how fast it is moving. This is not because our tools are bad. It is just how nature works at small scales.","r":["duality","compact","atoms"]},{"id":"entanglement","t":"Quantum Entanglement","c":"Quantum","st":"est","sc":null,"fig":"Bell-test experiments recognized by the <b>2022 Nobel Prize</b> in Physics","s":"Two or more quantum systems are entangled when their joint state cannot be written as a product of individual states, |Ψ⟩ ≠ |ψ<sub>A</sub>⟩ ⊗ |ψ<sub>B</sub>⟩. Measurements on entangled systems show correlations that violate Bell inequalities, which any local hidden-variable theory must obey. Loophole-free experiments since 2015 confirm the violation, ruling out local realism (2022 Nobel Prize). Entanglement cannot transmit signals, but it is the key resource for quantum computing, quantum cryptography and quantum-enhanced sensing.","m":"Two particles can be linked so that measuring one instantly tells you something about the other, even far apart. This does not let you send messages faster than light, but it is useful for quantum computers.","r":["duality","special-rel"]},{"id":"atoms","t":"Atomic Structure","c":"Quantum","st":"est","sc":-10,"fig":"Atom: <b>~10<sup>-10</sup> m</b>; nucleus: <b>~10<sup>-15</sup> m</b>, holds >99.9% of the mass","s":"An atom consists of a nucleus of Z protons and N neutrons, radius about 1–7 fm, bound electrostatically to Z electrons in quantized states extending to about 0.1 nm. The electron states are solutions of the Schrödinger (or, more precisely, Dirac) equation labeled by quantum numbers n, ℓ, m<sub>ℓ</sub> and m<sub>s</sub>. The Pauli exclusion principle fills them in shells, producing the periodic table. Transitions between levels emit and absorb photons at discrete wavelengths, which spectroscopy measures to parts in 10<sup>18</sup>, making atoms the basis of modern timekeeping.","m":"Everything is made of atoms. Each atom has a tiny heavy center (the nucleus) and electrons around it. If an atom were a football stadium, the nucleus would be a marble in the middle. Each kind of atom gives off its own colors of light, so we can tell what stars are made of.","r":["standard-model","duality","em"]},{"id":"standard-model","t":"The Standard Model","c":"Particle physics","st":"est","sc":-18,"fig":"<b>17</b> named fundamental particles: 12 fermions (6 quarks, 6 leptons) and 5 bosons","s":"The Standard Model is a relativistic quantum field theory with gauge symmetry SU(3)<sub>C</sub> × SU(2)<sub>L</sub> × U(1)<sub>Y</sub>, describing the strong, weak and electromagnetic interactions of 12 matter fermions (six quarks and six leptons) through gauge bosons, with masses generated by the Higgs mechanism. With 19 free parameters (plus neutrino masses and mixings) it accounts for essentially all laboratory particle physics, with predictions such as the electron magnetic moment confirmed to about 1 part in 10<sup>12</sup>. It omits gravity, dark matter, dark energy, neutrino-mass origin and the baryon asymmetry, so it is regarded as an effective theory.","m":"The Standard Model is a list of the smallest building blocks we know: quarks, electrons, neutrinos and force-carrying particles. It explains almost every experiment, but it leaves out gravity and dark matter, so it is not the whole story.","r":["higgs","forces","neutrinos"]},{"id":"higgs","t":"The Higgs Boson","c":"Particle physics","st":"est","sc":-18,"fig":"Mass: <b>~125 GeV/c²</b>; discovered at CERN's LHC in <b>2012</b>","s":"The Higgs boson, discovered by ATLAS and CMS in 2012 with mass m<sub>H</sub> = 125.1 ± 0.1 GeV, is the spin-0 excitation of the Higgs field, whose nonzero vacuum expectation value v = 246 GeV breaks electroweak symmetry. This mechanism gives mass to the W and Z bosons and, through Yukawa couplings, to the charged fermions; it does not explain most of the mass of protons, which comes from QCD. Measured couplings agree with Standard Model predictions at the 5–10% level, while the Higgs self-coupling, which fixes the shape of the potential, is not yet measured.","m":"There is an invisible field everywhere in space, and some particles get their mass by interacting with it. Scientists found the particle linked to this field in 2012 using the world's biggest particle collider.","r":["standard-model","emc2"]},{"id":"forces","t":"The Four Fundamental Forces","c":"Particle physics","st":"est","sc":null,"fig":"Relative strength: strong <b>1</b> · electromagnetic <b>~1/137</b> · weak <b>~10<sup>-6</sup></b> · gravity <b>~10<sup>-38</sup></b>","s":"All known interactions reduce to four: gravity, electromagnetism, the weak interaction and the strong interaction. The latter three are quantum gauge theories mediated by spin-1 bosons; gravity is described classically by general relativity. Their strengths at low energy differ enormously: the electric repulsion between two protons exceeds their gravitational attraction by about 1.2 × 10<sup>36</sup>. Couplings run with energy, and electromagnetism and the weak force unify into the electroweak interaction above about 100 GeV. Full unification with the strong force, and especially with gravity, remains hypothetical.","m":"There are four basic forces in nature: strong (holds atom centers together), electromagnetic (magnets, electricity, light), weak (some radioactivity), and gravity. Gravity is by far the weakest, but it wins on big scales because it only pulls and never pushes.","r":["standard-model","newton","em"]},{"id":"neutrinos","t":"Neutrinos","c":"Particle physics","st":"strong","sc":-18,"fig":"Mass upper limit: <b>< 0.45 eV</b> (KATRIN, 2025); ~65 billion pass through each cm² of you per second from the Sun","s":"Neutrinos are electrically neutral, spin-½ leptons that interact only through the weak force and gravity, with cross sections of about 10<sup>−44</sup> cm² at MeV energies. They come in three flavors (ν<sub>e</sub>, ν<sub>μ</sub>, ν<sub>τ</sub>) that are quantum superpositions of three mass states, causing flavor oscillation (2015 Nobel Prize). Oscillations require nonzero masses, the first established physics beyond the minimal Standard Model. Absolute masses are below 0.45 eV from KATRIN and, assuming ΛCDM, the sum Σm<sub>ν</sub> is below about 0.064 eV from DESI plus CMB data.","m":"Neutrinos are ghost-like particles that pass through almost anything, including you and the whole Earth. Trillions from the Sun go through your body every second without doing anything. They have a tiny mass, but nobody knows exactly how much.","r":["standard-model","fusion"]},{"id":"newton","t":"Newton's Laws and Gravitation","c":"Classical physics","st":"est","sc":null,"fig":"<b>F = ma</b>; F = Gm<sub>1</sub>m<sub>2</sub>/r², G = 6.674 × 10<sup>-11</sup> N·m²/kg²","s":"Newtonian mechanics describes motion through three laws, most compactly F = dp/dt in inertial frames, together with universal gravitation, F = Gm<sub>1</sub>m<sub>2</sub>/r². It reproduces Kepler's laws of planetary motion, tides, orbital transfers and spacecraft navigation to high precision whenever speeds are much less than c and gravitational potentials satisfy |Φ|/c² ≪ 1. It is the weak-field, low-velocity limit of general relativity and the classical limit of quantum mechanics. Its gravitational constant, G = 6.674 × 10<sup>−11</sup> N·m²/kg², is the least precisely known fundamental constant.","m":"Newton figured out that things keep moving unless a force stops them, that force equals mass times acceleration, and that every push has an equal push back. He also showed the same gravity that drops an apple keeps the Moon in orbit.","r":["general-rel","conservation","forces"]},{"id":"conservation","t":"Conservation Laws","c":"Classical physics","st":"est","sc":null,"fig":"Noether's theorem (1918): every continuous symmetry ↔ a conserved quantity","s":"Conservation laws state that certain quantities in an isolated system, including energy, linear momentum, angular momentum and electric charge, remain constant in time. Noether's theorem (1918) shows that each continuous symmetry of a system's action implies a conserved current: time-translation symmetry gives energy conservation, spatial translation gives momentum and rotation gives angular momentum. Conservation laws constrain processes without solving equations of motion, and observed violations, such as of parity or CP, reveal broken symmetries in fundamental interactions.","m":"Some things can never be created or destroyed, only moved around or changed in form, like energy and momentum. A spinning ice skater speeds up when she pulls her arms in because spin is conserved.","r":["newton","entropy"]},{"id":"entropy","t":"Entropy and the Second Law","c":"Classical physics","st":"est","sc":null,"fig":"<b>S = k<sub>B</sub> ln W</b>, Boltzmann constant k<sub>B</sub> = 1.380649 × 10<sup>-23</sup> J/K (exact)","s":"Entropy measures the number of microscopic configurations consistent with a system's macroscopic state, S = k<sub>B</sub> ln Ω (Boltzmann), with k<sub>B</sub> = 1.380 649 × 10<sup>−23</sup> J/K. The second law states that the entropy of an isolated system does not decrease, because macrostates with overwhelmingly more microstates are overwhelmingly more probable. It limits heat-engine efficiency, makes heat flow from hot to cold and gives time its thermodynamic arrow. The arrow traces back to the very low-entropy initial state of the universe, whose origin is unexplained.","m":"Entropy is a measure of how spread out or mixed up energy and stuff are. Left alone, things naturally get more mixed: ice melts in a warm drink, but a warm drink never freezes on its own. This is part of why time seems to only go forward.","r":["conservation","big-bang"]},{"id":"em","t":"Electromagnetism and Light","c":"Classical physics","st":"est","sc":-6.4,"fig":"Visible light: <b>~380–750 nm</b>, a small slice of the spectrum from radio to gamma rays","s":"Classical electromagnetism is summarized by Maxwell's four equations, which relate electric and magnetic fields to charges and currents and predict self-sustaining electromagnetic waves traveling at c = 1/√(μ<sub>0</sub>ε<sub>0</sub>). Light is one band of a spectrum running from radio waves (wavelengths of kilometers) to gamma rays (below 10<sup>−12</sup> m). Thermal emission follows Planck's blackbody law, whose peak and total power give Wien's and the Stefan–Boltzmann laws. Quantum electrodynamics completes the theory, describing light as photons with energy E = hf.","m":"Electricity and magnetism are two sides of one force, and light is a wave of that force. Radio waves, microwaves, X-rays and the colors we see are all the same thing with different wavelengths. Our eyes see only a tiny slice.","r":["special-rel","atoms","cmb"]},{"id":"solar-system","t":"Formation of the Solar System","c":"Solar system","st":"est","sc":13,"fig":"Age: <b>~4.57 billion years</b>, dated from the oldest meteorite minerals","s":"The Solar System formed 4.567 billion years ago, a date from uranium–lead ages of calcium–aluminum-rich inclusions in meteorites, when a fragment of a molecular cloud collapsed into the proto-Sun and a rotating protoplanetary disk. Dust grains grew into planetesimals, rocky planets assembled inside the water-ice line, and giant-planet cores grew rapidly beyond it, capturing gas before the disk dispersed within about 3–10 Myr. Subsequent giant-planet migration reshaped the asteroid belt, the Kuiper belt and the Oort cloud. ALMA images of young disks and isotopic analyses of meteorites constrain each stage.","m":"About 4.6 billion years ago, a cloud of gas and dust collapsed. The middle became the Sun, and leftover bits clumped into planets. Rocky planets formed close to the Sun, and giant gas planets formed farther out where it was cold.","r":["exoplanets","fusion"]},{"id":"the-sun","t":"The Sun","c":"Solar system","st":"est","sc":8.84,"fig":"","s":"The Sun is a G2V main-sequence star of mass 1.989 × 10<sup>30</sup> kg, radius 696,000 km and luminosity 3.828 × 10<sup>26</sup> W, about 4.6 billion years old and roughly halfway through its hydrogen-burning life. Energy produced by the proton–proton chain in its core diffuses outward radiatively and then convectively, emerging from the photosphere at T<sub>eff</sub> = 5,772 K. Its magnetic field, generated by a dynamo, drives an approximately 11-year activity cycle, a million-kelvin corona, the solar wind and space weather. Solar Cycle 25 reached its maximum around late 2024.","m":"The Sun is a star, the closest one to us. It holds almost all the mass in the solar system; about 1.3 million Earths could fit inside it. Deep in its center it fuses hydrogen into helium, making the light and heat that keep Earth alive. Its surface is a stormy sea of hot gas with dark sunspots and huge explosions called flares.","r":["fusion","stellar-life","solar-system","em"]},{"id":"the-moon","t":"The Moon","c":"Solar system","st":"est","sc":6.24,"fig":"","s":"The Moon, with mass 7.35 × 10<sup>22</sup> kg (1/81.3 of Earth's) and radius 1,737 km, orbits at a mean distance of 384,400 km. The leading explanation for its origin is a giant impact about 4.5 billion years ago between the proto-Earth and a Mars-sized body, consistent with the Moon's small iron core, depletion of volatile elements and near-identical isotopic composition to Earth's mantle. It is tidally locked, so the same hemisphere always faces Earth, and tidal friction drives it outward by 3.8 cm/yr. Lunar samples provide the calibration for crater-count ages across the Solar System.","m":"The Moon is Earth's companion, about a quarter as wide as Earth and about 384,000 km away. Scientists think it formed when a planet the size of Mars crashed into the young Earth. The Moon always shows us the same face, it makes the ocean tides, and 12 astronauts have walked on it.","r":["solar-system","newton","rocky-planets","the-sun"]},{"id":"rocky-planets","t":"The Rocky Planets","c":"Solar system","st":"est","sc":6.8,"fig":"","s":"The four terrestrial planets, Mercury, Venus, Earth and Mars, are differentiated silicate–iron bodies that formed from the same inner disk but diverged dramatically. Their outcomes depend on mass, distance from the Sun, volatile inventory, internal heat flow and magnetic protection. Venus underwent a runaway greenhouse to a 92 bar, 737 K CO<sub>2</sub> atmosphere; Mars lost most of its atmosphere and surface water; Mercury has an iron core filling about 85% of its radius; and only Earth has active plate tectonics, a long-lived carbonate–silicate climate thermostat and confirmed life.","m":"The four planets closest to the Sun are made of rock and metal: Mercury, Venus, Earth and Mars. They're built alike, with a metal center and a rocky outside, but they turned out very differently. Mercury is baked and airless, Venus is a super-hot pressure cooker, Earth has oceans and life, and Mars is a cold, dusty desert.","r":["solar-system","the-moon","giant-planets","habitable-worlds"]},{"id":"giant-planets","t":"The Giant Planets","c":"Solar system","st":"est","sc":7.84,"fig":"","s":"Jupiter and Saturn are gas giants composed mostly of hydrogen and helium (318 and 95 Earth masses); Uranus and Neptune are ice giants (14.5 and 17.1 Earth masses) dominated by water, ammonia and methane 'ices' in fluid form. Juno and Cassini gravity data show that Jupiter and Saturn have dilute cores in which heavy elements are spread through much of the interior. Their deep atmospheres support long-lived storms and zonal jets, and their moon and ring systems are shaped by orbital resonances. Jupiter and Saturn emit about 1.7 and 1.8 times the solar energy they absorb; Uranus emits barely more.","m":"The four outer planets are giants. Jupiter and Saturn are huge balls of mostly hydrogen and helium, and Uranus and Neptune have lots of icy stuff like water and methane inside. None of them has a solid surface to stand on! They all have rings and lots of moons.","r":["solar-system","rocky-planets","ocean-moons","exoplanets"]},{"id":"ocean-moons","t":"Ocean Moons","c":"Solar system","st":"strong","sc":6.19,"fig":"","s":"Several icy moons have global subsurface oceans of liquid water beneath ice shells, maintained by tidal heating and radiogenic heat. The evidence is strongest for Europa (induced magnetic field), Enceladus (plumes and librations) and Titan (gravity tides and rotation), with good evidence for Ganymede and possibly Callisto. Enceladus's plumes contain salts, silica nanoparticles, molecular hydrogen, organics and phosphates, indicating water–rock interaction at its seafloor. These oceans are prime targets in the search for life; Europa Clipper arrives at Jupiter in 2030 and JUICE in 2031.","m":"Some moons of Jupiter and Saturn have giant oceans of liquid water hidden under thick ice! Europa and Enceladus are the most famous. Their planets' gravity squeezes and stretches them, which heats their insides and keeps the water from freezing. That makes them some of the best places to look for alien life.","r":["giant-planets","extremophiles","habitable-worlds","origin-of-life"]},{"id":"small-bodies","t":"Comets and Asteroids","c":"Solar system","st":"est","sc":4,"fig":"","s":"Asteroids and comets are remnant planetesimals that never assembled into planets. Asteroids, concentrated in the main belt between Mars and Jupiter, are rocky or metallic and have a combined mass of only about 3% of the Moon's. Comets are icy bodies stored in the Kuiper belt and Oort cloud; when perturbed into the inner Solar System, they sublimate, producing comae and tails. Sample-return missions have recovered material from asteroids Itokawa, Ryugu and Bennu, whose primitive composition records the early Solar System. Impact hazards are monitored by survey telescopes, and DART demonstrated in 2022 that asteroid deflection is feasible.","m":"Asteroids and comets are leftover building blocks from when the planets formed. Asteroids are rocky or metal chunks, mostly in a belt between Mars and Jupiter. Comets are dirty snowballs from the far edges of the solar system that grow glowing tails when they come near the Sun. An asteroid impact helped wipe out the dinosaurs!","r":["solar-system","giant-planets","origin-of-life","missions"]},{"id":"origin-of-life","t":"The Origin of Life","c":"Astrobiology","st":"open","sc":-8,"fig":"","s":"Abiogenesis is the emergence of self-replicating, evolving chemical systems from nonliving chemistry on the early Earth, sometime between about 4.4 billion years ago (when liquid water was present) and 3.5 billion years ago (the oldest widely accepted microfossils and stromatolites). Phylogenetic reconstructions place the last universal common ancestor (LUCA) at roughly 4.2 billion years ago, already a complex prokaryote. No complete pathway is known. Laboratory prebiotic chemistry has produced nucleotides, amino acids, lipids and catalytic RNAs under plausible conditions, but how these combined into a self-sustaining system remains unresolved.","m":"Life on Earth began at least 3.5 billion years ago, but nobody knows exactly how. Somehow, simple chemicals came together into something that could copy itself. Scientists have ideas, like special molecules called RNA, hot vents on the ocean floor or warm ponds that dried out and refilled, and they test them in the lab.","r":["extremophiles","habitable-worlds","small-bodies","entropy"]},{"id":"extremophiles","t":"Life at the Extremes","c":"Astrobiology","st":"est","sc":-6,"fig":"","s":"Extremophiles are organisms that thrive under conditions once considered incompatible with life: temperatures from about −20 °C to 122 °C, pH from about 0 to 12.5, pressures above 100 MPa, high salinity, desiccation and ionizing radiation. Most are archaea or bacteria. They define the physical and chemical envelope of life on Earth, which is mainly limited by the stability of liquid water and biomolecules, and they show that ecosystems can be powered by chemical energy without sunlight. The deep subsurface biosphere may hold a substantial fraction of Earth's microbial biomass.","m":"Extremophiles are living things that love extreme places: boiling hot springs, super-salty lakes, acid, freezing ice and even deep underground. Most are microbes, but tiny animals called tardigrades, or 'water bears', can survive being frozen, dried out and even sent into space!","r":["origin-of-life","ocean-moons","habitable-worlds","rocky-planets"]},{"id":"habitable-worlds","t":"Habitable Worlds","c":"Astrobiology","st":"strong","sc":7,"fig":"","s":"A habitable world is one able to sustain liquid water, energy sources and the chemical elements needed by life as we know it, over long periods. The classical circumstellar habitable zone is the range of stellar fluxes where a rocky planet with an Earth-like CO<sub>2</sub>–H<sub>2</sub>O atmosphere could keep surface water liquid, about 0.95–1.67 AU for the Sun in commonly used models. Habitability also depends on planetary mass, atmosphere, tectonics, magnetic field, stellar activity and history. Subsurface oceans broaden the concept beyond surfaces. JWST is now testing whether rocky planets around M dwarfs keep atmospheres.","m":"A habitable world is a place where life like ours could live. The most important ingredient is liquid water. The 'habitable zone', sometimes called the Goldilocks zone, is the distance from a star that's not too hot and not too cold for water. But a planet also needs the right air, protection from its star and more.","r":["exoplanets","ocean-moons","rocky-planets","seti"]},{"id":"seti","t":"The Search for Intelligent Life","c":"Astrobiology","st":"open","sc":20.5,"fig":"","s":"The Search for Extraterrestrial Intelligence (SETI) looks for technosignatures, evidence of technology, rather than biology. Radio searches since 1960 have surveyed narrowband (Hz-wide) signals, which natural astrophysical sources do not produce; optical searches look for nanosecond laser pulses; and infrared and archival searches look for waste heat or artificial structures. No confirmed technosignature has been found. The searches so far have covered only a tiny fraction of the possible parameter space of frequency, direction, power, time and modulation, so the absence of detections constrains only bright, persistent transmitters near Earth.","m":"Are we alone? SETI scientists listen for radio signals or other signs of alien technology. The Drake equation is a way to estimate how many alien civilizations might be out there. The Fermi paradox asks: if there are lots of them, where is everybody? So far, no alien signal has been confirmed.","r":["habitable-worlds","origin-of-life","em","telescopes"]},{"id":"telescopes","t":"How Telescopes Work","c":"Observing","st":"est","sc":0.5,"fig":"","s":"A telescope's performance is set mainly by its aperture D. Light-gathering power scales as D², determining how faint a source can be detected, and the diffraction limit θ ≈ 1.22λ/D determines the finest resolvable detail. On
