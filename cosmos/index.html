 at over 100 million degrees. The fuel is plentiful, and fusion makes no carbon emissions or long-lasting high-level waste, but holding plasma that hot together long enough to get more energy out than you put in is extremely difficult. In 2022, the National Ignition Facility got more fusion energy out of a fuel target than the laser energy delivered to it, a major milestone, though not yet enough for a power plant.","why":"Fusion could provide plentiful, carbon-free electricity around the clock, with fuel that would last millions of years, without long-lasting high-level waste or meltdown risk. Achieving it would transform the world's energy supply."},"colliders":{"how":["Accelerators push particles using radio-frequency cavities, which have electric fields timed to kick the particles forward each time they pass. In a circular collider, powerful magnets bend the beam around the ring. The LHC uses 1,232 superconducting magnets cooled to 1.9 K (colder than outer space) with liquid helium.","Protons travel in bunches of about 100 billion, crossing up to 40 million times per second at four collision points. Smashing two beams head-on is much more efficient than hitting a fixed target, because all the beam energy can go into making new particles.","Detectors like ATLAS (46 meters long) and CMS (about 14,000 tonnes) are built in layers like an onion. Inner silicon trackers record the paths of charged particles, which curve in strong magnetic fields, revealing their momentum. Calorimeters absorb particles and measure their energy. Outer chambers catch muons, which pass through everything else. Neutrinos escape unseen and show up as missing momentum.","Because collisions happen so often, fast 'trigger' systems decide in microseconds which events to keep, cutting 40 million crossings per second down to about a thousand saved events per second. Physicists then look for 'bumps', extra events at a particular mass above the expected background, and need 5-sigma confidence to claim a discovery. The data is processed on a worldwide computer network."],"x":["Ernest Lawrence built the first cyclotron in 1931, small enough to hold in one hand. Accelerators grew quickly: the Stanford Linear Accelerator revealed quarks inside protons in the late 1960s, CERN found the W and Z bosons in 1983, Fermilab's Tevatron found the top quark in 1995, and the LHC began collisions in 2009 and discovered the Higgs boson in 2012.","The LHC couldn't create a dangerous black hole or destroy Earth. Cosmic rays have hit Earth, the Moon and other objects with much higher energies for billions of years without any harm.\nColliders don't just break particles into smaller pieces; they create new particles from the collision energy, and many are heavier than the protons that collided.\nMost collisions are boring; trigger systems keep only a tiny fraction to study.","The High-Luminosity LHC upgrade, due around 2030, will increase collision rates about tenfold to study rare processes like Higgs bosons being made in pairs. Proposed successors include CERN's Future Circular Collider, a ring about 91 km around, and China's CEPC. Muon colliders and plasma wakefield accelerators, which could make accelerators much shorter, are being researched."],"terms":["A machine that uses electric fields to speed charged particles up to high energies.","A measure of how many collisions a collider produces in a given time and area.","A detector layer that absorbs particles and measures their energy.","A fast system that chooses which collision events to save.","The energy an electron gains crossing 1 volt; 1 TeV is a trillion eV."],"s":"Particle colliders speed up beams of particles to nearly the speed of light and smash them together, turning energy into new particles through E = mc². Giant detectors around the collision points record the debris, and physicists work out what happened. The Large Hadron Collider (LHC) at CERN, a 27 km ring under the border of France and Switzerland, is the most powerful, colliding protons at 13.6 TeV.","why":"Colliders test the Standard Model, discovered most of its particles and are still the most direct way to create and study new heavy particles. Their technology, including superconducting magnets, detectors and data processing, spreads into medicine, industry and computing; the World Wide Web was invented at CERN in 1989."},"telescopes":{"how":["Light-gathering power depends on collecting area, which grows with the square of the aperture's diameter. Your pupil is at most about 7 mm wide in the dark; an 8-meter mirror collects over a million times more light, and long camera exposures reach even fainter objects.","Resolution, the smallest angle a telescope can separate, is limited by diffraction to about 1.22 λ/D, where λ is the wavelength and D is the aperture. Bigger mirrors and shorter wavelengths give sharper images. On the ground, though, turbulence in the air ('seeing') usually blurs images no matter how big the telescope is. Adaptive optics fix this by measuring the blur hundreds of times per second, often using a laser 'guide star', and correcting it with a flexible mirror.","Very large mirrors are built from segments: JWST uses 18 hexagonal segments, and the Extremely Large Telescope will use 798. Separate radio telescopes can be linked as an interferometer, which gives the resolution of one dish as wide as the distance between them. The Event Horizon Telescope linked dishes around the world, acting like an Earth-sized telescope, to image black holes.","Each kind of light needs its own approach. Radio dishes can be made of wire mesh. Infrared detectors must be kept cold; JWST's sunshield keeps its optics below about 50 K (−223 °C). X-rays pass straight through normal mirrors, so X-ray telescopes like Chandra use mirrors that reflect X-rays at shallow, glancing angles. Gamma rays can't be focused at all; detectors record the particles they create."],"x":["Hans Lipperhey applied for a telescope patent in 1608, and in 1609–1610 Galileo pointed one at the sky, discovering Jupiter's four large moons and the phases of Venus. Isaac Newton built the first practical reflecting telescope in 1668, avoiding the color fringes of early lenses. Telescopes kept growing: the 5-meter Hale (1948), the twin 10-meter Kecks (1990s), Hubble in orbit (1990) and JWST, with a 6.5-meter gold-coated mirror, launched in 2021.\nIn 1932, Karl Jansky detected radio waves from the Milky Way, starting the field of radio astronomy.","A telescope's main job isn't magnifying. Any image can be enlarged; what really limits a telescope is how much light it collects and how fine a detail it can resolve, and both depend on aperture.\nSpace telescopes don't orbit to get closer to stars; the distance gained is meaningless. They get above the blurring atmosphere, which also blocks some types of light and, for infrared, glows with heat.\nAstronomers rarely look through eyepieces on research telescopes; cameras and spectrographs record the light.","Huge ground telescopes are being built: the European Southern Observatory's 39-meter Extremely Large Telescope in Chile, with first light planned for 2029 and science starting around 2030, plus the Giant Magellan Telescope and Thirty Meter Telescope, whose timelines depend on funding. The Vera C. Rubin Observatory began a 10-year survey of the southern sky in 2025, and NASA's Nancy Grace Roman Space Telescope launched in August 2026 to study dark energy and exoplanets."],"terms":["The diameter of a telescope's main mirror or lens.","The smallest angle between two points that a telescope can tell apart.","Technology that corrects blurring from the atmosphere in real time using a flexible mirror.","Combining signals from separate telescopes to get the sharpness of a much larger one.","The blurring of starlight caused by turbulence in Earth's atmosphere."],"s":"Telescopes collect and focus light. Their two most important abilities, gathering light and seeing fine detail (resolution), both improve with the size of the main mirror or lens, called the aperture. Refracting telescopes use lenses, while nearly all large modern telescopes are reflectors that use curved mirrors. Different types of light need different designs, from huge radio dishes to X-ray mirrors, and many telescopes must work in space, above the atmosphere.","why":"Telescopes are astronomy's main tools. Nearly every discovery in this guide, from exoplanets to the CMB to dark energy, depended on building a telescope that could collect more light, see more sharply or detect a new type of light."},"spectroscopy":{"how":["A spectrograph spreads out light by wavelength using a prism or, more often, a diffraction grating, a surface with thousands of tiny parallel lines per millimeter, and records it with a digital camera. Modern instruments can observe thousands of objects at once; DESI uses 5,000 optical fibers moved into place by robots.","Kirchhoff's rules explain what spectra show. A hot, dense object gives off a continuous rainbow of colors. A thin, hot gas gives off bright lines at specific wavelengths. Cooler gas in front of a hotter source absorbs those same wavelengths, producing dark lines. Each element's lines come from electrons jumping between specific energy levels, so each element has its own unique pattern.","Spectra reveal more than what something is made of. The relative strengths of lines show temperature and pressure; line widths show turbulence, spinning or density; Doppler shifts measure how fast something moves toward or away from us, down to less than one meter per second for stars; and the Zeeman effect, the splitting of lines by magnetic fields, measures a star's magnetism.","The star types O, B, A, F, G, K and M are basically a temperature scale read from which lines are strongest. Redshifts of galaxies measure cosmic expansion, repeating shifts reveal orbiting planets and pairs of stars, and lines from molecules at radio wavelengths map the cold gas where stars are born."],"x":["Isaac Newton split sunlight with a prism in 1666. In 1814, Joseph von Fraunhofer mapped hundreds of dark lines in the Sun's spectrum. Around 1860, Gustav Kirchhoff and Robert Bunsen showed that each element makes its own set of lines and identified elements in the Sun; helium was discovered in the Sun's spectrum in 1868, before it was found on Earth. In 1925, Cecilia Payne-Gaposchkin showed that stars are made mostly of hydrogen and helium, overturning the belief that they were made of the same stuff as Earth. Vesto Slipher's spectra of galaxies in the 1910s revealed the redshifts that led to the discovery of cosmic expansion.","Absorption lines don't come from deep inside a star. They form in its cooler outer atmosphere, where atoms absorb specific wavelengths from the hotter light below.\nA redshifted object doesn't necessarily look red. Every line shifts to longer wavelengths by the same factor; a very distant galaxy's light may be shifted completely into the infrared.\nSpectroscopy isn't limited to visible light; it's used for everything from radio waves to gamma rays.","Ultra-precise spectrographs aim to detect the roughly 9 cm/s wobble that an Earth-like planet causes in a Sun-like star, which means filtering out 'noise' from the star's own bubbling surface. Spectra of exoplanet atmospheres from JWST and future giant telescopes will search for gases that might signal life. Some projects even plan to watch the universe's expansion change in real time by measuring tiny redshift changes over decades."],"terms":["An instrument that spreads light out by wavelength and records it.","A surface with many fine parallel lines that spreads light into its wavelengths.","A dark line where atoms absorbed a specific wavelength of light.","A bright line where atoms gave off a specific wavelength of light.","The change in measured wavelength caused by motion toward or away from the observer.","The splitting of spectral lines by a magnetic field."],"s":"Spectroscopy splits light into its different wavelengths, revealing a 'fingerprint' of whatever produced it. Dark absorption lines and bright emission lines identify chemical elements, their strengths reveal temperature and density, their shifts reveal motion, and their splitting reveals magnetic fields. It's how astronomers know what stars are made of, how fast galaxies are moving away and that planets orbit other stars.","why":"Without spectroscopy, astronomy would be limited to positions and brightness. Spectroscopy provides composition, temperature, motion, distance (through redshift) and magnetic fields, turning points of light into real physical understanding."},"night-sky":{"how":["Earth rotates once every 23 hours 56 minutes relative to the stars, called a sidereal day, so stars rise about four minutes earlier each night. Over a year that adds up to a full day, which is why the constellations you see at night change with the seasons: at night you look out from the side of Earth facing away from the Sun.","Astronomers locate objects using sky coordinates called right ascension and declination, which work like longitude and latitude projected onto the sky. The celestial poles are directly above Earth's poles. Polaris, the North Star, is within about a degree of the north celestial pole, so it seems to stay still while other stars circle around it. The Southern Hemisphere has no bright pole star.","The Sun's yearly path against the background stars is the ecliptic. Because the planets orbit in nearly the same flat plane, they always appear near it, passing through the zodiac constellations. Planets shift position from night to night and usually shine steadily instead of twinkling, because they appear as tiny disks rather than points of light.","Brightness is measured in magnitudes, where bigger numbers mean fainter objects. Under dark skies you can see down to about magnitude 6; in a bright city, maybe only magnitude 2 or 3, which leaves just a few dozen stars. Highlights worth watching include meteor showers, when Earth passes through comet debris (like the Perseids every August), eclipses, planets lining up and auroras."],"x":["Many cultures mapped the sky for navigation, calendars and storytelling. Ptolemy's Almagest, written in the 2nd century, listed 48 constellations, many of which are still used. Polynesian navigators crossed the Pacific Ocean guided by where stars rose and set. Between 1922 and 1930, the International Astronomical Union officially set 88 constellations with exact boundaries. Ancient astronomers also discovered precession: Earth's axis slowly wobbles over about 26,000 years, so the North Star changes over thousands of years.","Stars in a constellation usually aren't close to each other; they only look lined up from where we are, and often sit at very different distances.\nPolaris isn't the brightest star; it ranks around 48th. Sirius is the brightest star in the night sky.\nSeasons aren't caused by Earth's distance from the Sun but by its 23.4° tilt, and Earth's orbit is why the visible constellations change with the seasons.","Light pollution is growing: a 2023 study using observations from volunteers found the visible night sky getting brighter by about 10% per year. Large groups of satellites add streaks to astronomical images and may interfere with radio astronomy. Dark-sky reserves and better lighting, like shielded, warmer-colored, dimmable lights, aim to protect the night sky for people and wildlife."],"terms":["One of 88 officially defined regions of the sky, often named after a traditional star pattern.","The Sun's apparent yearly path across the sky; the planets stay close to it.","The point in the sky directly above Earth's North or South Pole.","How long Earth takes to rotate once relative to the stars, about 23 hours 56 minutes.","Extra artificial light that brightens the night sky and hides stars.","The slow wobble of Earth's axis over about 26,000 years."],"s":"The night sky is the view from a spinning planet that orbits the Sun. Stars seem to rise and set because Earth rotates, and different constellations appear during the year because Earth orbits the Sun. The sky is divided into 88 official constellations, and the planets move along a path called the ecliptic. Under truly dark skies, a few thousand stars and the band of the Milky Way are visible without a telescope, but light pollution hides most of them for most people.","why":"The night sky was humanity's first science lab, calendar and navigation system, and learning its patterns is still the easiest way to get into astronomy. Understanding how it moves connects what you see to Earth's rotation, its orbit and its place in the galaxy."},"multi-messenger":{"how":["Each messenger is made and travels differently. Light interacts with matter, so it reveals surfaces and gas, but it can be blocked or scattered. Gravitational waves pass through matter almost untouched and directly reveal how masses move. Neutrinos escape from the densest places, like collapsing star cores, and travel in straight lines. Cosmic rays come from extreme natural particle accelerators but get bent by magnetic fields along the way.","Teamwork is essential. Gravitational-wave and neutrino detectors send automatic alerts within minutes, with sky locations, and telescopes around the world rush to search those areas. The SuperNova Early Warning System (SNEWS) connects neutrino detectors so they can warn astronomers about a supernova in our galaxy before its light appears.","The 2017 event GW170817 shows what combined data can do. The gravitational waves gave the masses and distance; the gamma rays, arriving 1.7 seconds later, confirmed that gravitational waves travel at the speed of light; the glowing kilonova revealed freshly made heavy elements; and together they gave an independent measurement of the universe's expansion rate.","Cosmic rays hit Earth's atmosphere constantly, creating showers of secondary particles. The Pierre Auger Observatory in Argentina spreads detectors over 3,000 km² to catch the rare highest-energy showers, and has found that their directions aren't completely random, pointing to sources outside our galaxy."],"x":["In 1987, neutrinos from supernova 1987A arrived hours before its light, confirming models of collapsing stars. On August 17, 2017, LIGO and Virgo detected gravitational waves from colliding neutron stars; 1.7 seconds later the Fermi satellite saw a gamma-ray burst, and within hours telescopes found the glowing kilonova in the galaxy NGC 4993, about 130 million light-years away. Around 70 observatories took part. Also in 2017, the IceCube detector caught a high-energy neutrino traced back to a flaring blazar, TXS 0506+056.","Gravitational waves and neutrinos aren't 'better' than light; they complement it. Light reveals temperature, composition and surroundings in detail; gravitational waves reveal masses and motions directly; neutrinos reveal nuclear reactions deep inside dense cores.\nCosmic rays aren't rays; they're charged particles, mostly protons. Magnetic fields bend their paths, so most can't be traced back to where they came from, unlike neutrinos and light.","What speeds up the highest-energy cosmic rays, which carry over 10<sup>20</sup> eV, millions of times more than protons at the Large Hadron Collider? Which sources produce most high-energy neutrinos? Planned detectors, including next-generation gravitational-wave observatories (Cosmic Explorer and Einstein Telescope) and IceCube-Gen2, aim to catch many more events seen with multiple messengers."],"terms":["Studying cosmic events with more than one type of signal: light, gravitational waves, neutrinos or cosmic rays.","A high-energy charged particle, usually a proton, arriving from space.","A cascade of secondary particles created when a cosmic ray hits the atmosphere.","A brief, extremely powerful flash of gamma rays from a collapsing star or colliding neutron stars.","The SuperNova Early Warning System, which links neutrino detectors to give early supernova alerts."],"s":"For most of history, astronomy relied on light alone. Multi-messenger astronomy combines four completely different signals: light (all types of electromagnetic radiation), gravitational waves, neutrinos and cosmic rays. Each carries different information and travels through matter differently. When one event is seen with several messengers, as with the neutron star collision in 2017, scientists learn far more than any single messenger could reveal.","why":"Multi-messenger astronomy reveals events that light alone can't, and lets independent signals check each other. That makes possible some of the sharpest tests of fundamental physics and new ways to measure cosmic expansion."},"units":{"how":["The astronomical unit (AU) is the average distance between Earth and the Sun, set in 2012 at exactly 149,597,870,700 m. A light-year, the distance light travels in a year, is about 9.46 trillion km, or 63,241 AU. A parsec (pc) is the distance at which 1 AU would appear to span one arcsecond (1/3,600 of a degree), about 206,265 AU or 3.26 light-years. Astronomers use kiloparsecs for distances within galaxies and megaparsecs (Mpc) for distances between them.","Parallax gives distances directly. As Earth orbits the Sun, a nearby star seems to shift slightly against faraway background objects, just as your thumb seems to jump when you close one eye and then the other. The star's distance in parsecs equals 1 divided by its shift in arcseconds. Friedrich Bessel first measured a stellar parallax in 1838, for the star 61 Cygni. The Gaia mission has measured parallaxes for over a billion stars.","Beyond parallax, astronomers use 'standard candles': objects whose true brightness is known, so how faint they look reveals how far away they are. In 1912, Henrietta Leavitt discovered that Cepheid variable stars pulse with periods linked to their true brightness. Other steps include the brightest red giant stars and Type Ia supernovae, which can be seen billions of light-years away. Each step calibrates the next, so errors can carry up the ladder.","On cosmic scales, 'distance' gets tricky because space expands while light travels. For a galaxy at redshift 10, the light traveled for about 13.3 billion years, but the galaxy is now about 32 billion light-years away. News headlines that say '13 billion light-years away' usually mean light-travel time.","Brightness uses the magnitude scale, which goes back to ancient Greek astronomers: fainter objects have larger magnitudes, and a difference of 5 magnitudes means exactly 100 times brighter or fainter. The faintest stars you can see without a telescope are about magnitude 6; JWST can detect objects fainter than magnitude 29."],"x":["Parallax, the apparent shift of a nearby star as Earth orbits the Sun, was first measured by Friedrich Bessel in 1838 for the star 61 Cygni. The European Space Agency's Gaia mission has since measured parallaxes for over a billion stars.\nThe astronomical unit is now set at exactly 149,597,870,700 m by international agreement, after radar measurements of distances to planets.","A light-year is a distance, not a time.\nLooking back in time works for everything: the Sun we see is 8 minutes and 20 seconds old, the Moon about 1.3 seconds old, and the Andromeda galaxy about 2.5 million years old.","The methods are well understood, but small calibration errors in the distance ladder feed directly into the Hubble tension, so improving them is still important."],"terms":["The average distance between Earth and the Sun, exactly 149,597,870,700 m.","The distance light travels in one year, about 9.46 × 10<sup>12</sup> km.","About 3.26 light-years; the distance at which 1 AU appears to span one arcsecond.","The apparent shift of a nearby object against faraway ones when viewed from different positions.","An object with known true brightness, used to measure distance from how bright it looks.","A brightness scale where bigger numbers mean fainter objects; 5 magnitudes equals a factor of 100."],"s":"Astronomers measure distance with a 'ladder' of methods: parallax for nearby stars, standard candles like Cepheid stars and Type Ia supernovae for galaxies, and redshift for the farthest objects. Distances are given in astronomical units, light-years (a distance, not a time) and parsecs, each about 3.26 light-years. Because light takes time to travel, looking far away means looking back in time.","why":"Almost every quantity in astronomy, including how bright, big and massive things are and how fast the universe expands, depends on knowing distance. Better distance measurements are directly tied to solving the Hubble tension."},"standard-model":{"how":["The Standard Model is a quantum field theory. Every type of particle corresponds to a field that fills all of space, and particles are small ripples in those fields. An electron is a ripple in the electron field; a photon is a ripple in the electromagnetic field. The forces come from symmetries: requiring the equations to stay the same under certain transformations determines which force-carrying particles must exist and how they interact.","Matter is made of fermions. Quarks come in six 'flavors' and carry 'color charge' (red, green or blue), plus a fractional electric charge of +2/3 or −1/3. Leptons include the electron, muon and tau, plus three neutrinos. Both come in three generations, each heavier than the last; only the first generation (up and down quarks, the electron and the electron neutrino) makes up ordinary matter. Every fermion has an antiparticle.","Quarks are never found alone, a property called confinement. They combine into hadrons: baryons made of three quarks (a proton is up-up-down, a neutron is up-down-down) and mesons made of a quark and an antiquark.","Forces are carried by bosons. Eight gluons carry the strong force, which actually gets weaker at short distances and stronger at long distances, trapping quarks. The photon carries electromagnetism. The W and Z bosons carry the weak force, which is combined with electromagnetism in the electroweak theory. The Higgs boson comes from the field that gives particles mass.","The model has about 19 numbers that have to be measured rather than predicted, like particle masses and force strengths. Its predictions have been confirmed with amazing precision; for example, the electron's magnetic strength matches theory to about one part in a trillion."],"x":["The theory was built from the 1960s to the 1970s by Sheldon Glashow, Steven Weinberg, Abdus Salam, Murray Gell-Mann, Gerard 't Hooft and others. Its predicted particles were then found one by one: the W and Z bosons (1983), the top quark (1995), the tau neutrino (2000) and the Higgs boson (2012).\nIts predictions have been confirmed with incredible precision; for example, the electron's magnetic moment matches theory to about one part in a trillion.","The Standard Model isn't a 'model' in the sense of a rough guess; it's a precise mathematical theory. Physicists call it incomplete, not wrong.\nProtons and neutrons aren't fundamental; they're made of quarks held together by gluons. Counts of 'how many particles' vary because sources count antiparticles and quark colors differently.","Things the model can't explain: gravity, dark matter, dark energy, neutrino masses, why there's more matter than antimatter and why there are exactly three generations of particles. In 2025, Fermilab's Muon g−2 experiment published its final result; updated theory calculations now mostly agree with it, easing an earlier disagreement."],"terms":["A field filling all of space whose ripples are particles.","A matter particle with half-integer spin, like quarks and electrons.","A particle with whole-number spin; includes the force carriers and the Higgs.","A particle made of quarks, such as a proton, neutron or meson.","One of three families of fermions that are identical except for mass.","The rule that quarks are never found alone, only inside hadrons."],"s":"The Standard Model describes all known fundamental particles and three of the four forces: electromagnetism, the weak force and the strong force. Its predictions match experiments with incredible precision. But it's known to be incomplete: it doesn't include gravity, dark matter or dark energy, and it originally assumed neutrinos have no mass.","why":"The Standard Model explains all of chemistry, nuclear physics and particle physics as we know them, and it's the most precisely tested theory in science. Its known gaps, including gravity, dark matter, neutrino masses and why there's more matter than antimatter, point toward the next breakthroughs."},"higgs":{"how":["In electroweak theory, a perfect symmetry would require the W and Z bosons to have no mass, like the photon. But experiments show they're heavy, about 80 and 91 GeV. The Higgs mechanism explains this. The Higgs field's energy curve is shaped like a 'Mexican hat': its lowest energy isn't at zero but around a ring, so the field settles at a value that isn't zero everywhere in space. This breaks the symmetry.","When the symmetry breaks, three parts of the Higgs field are absorbed by the W⁺, W⁻ and Z bosons, giving them mass. The fourth part remains as a real particle: the Higgs boson.","Fermions like electrons and quarks get mass through their 'Yukawa couplings' to the Higgs field: the stronger a particle interacts with the field, the heavier it is. The top quark interacts very strongly, while the electron interacts very weakly. Why these strengths have their particular values is unexplained.","Making a Higgs boson is rare: at the Large Hadron Collider, only about one collision in a billion produces one, and it decays almost instantly. ATLAS and CMS found it in 2012 mainly through decays into two photons and into four leptons. Since then, its interactions with other particles have been measured and agree with predictions so far."],"x":["Peter Higgs, François Englert, Robert Brout and others proposed the mechanism in 1964. The Large Hadron Collider, a 27 km ring at CERN near Geneva, produced enough collisions for ATLAS and CMS to announce the discovery on July 4, 2012.\nSince then, its properties, including having zero spin and how often it decays into various particles, have matched Standard Model predictions.","The nickname 'God particle' came from a book title and has nothing to do with religion; most physicists dislike it.\nThe Higgs field gives fundamental particles their mass, but most of the mass of you and everything around you comes from the energy of quarks and gluons inside protons and neutrons.","Why the Higgs is so light compared with the scale where gravity becomes strong (the 'hierarchy problem') is unexplained. Its measured mass also suggests our universe's vacuum might be only 'metastable', a theoretical point with no practical effect on any relevant timescale."],"terms":["A field filling all of space whose nonzero value gives mass to fundamental particles.","The constant value a field has in empty space; about 246 GeV for the Higgs.","When a system's lowest-energy state doesn't have a symmetry that its underlying laws do.","How strongly a fermion interacts with the Higgs field; proportional to its mass.","A measure of statistical confidence; 5σ, about a 1 in 3.5 million chance of being a fluke, is the standard for a discovery."],"s":"The Higgs field gives mass to the W and Z bosons and to fundamental particles like electrons and quarks. Its particle, the Higgs boson, was discovered at CERN by the ATLAS and CMS experiments in 2012, and Peter Higgs and François Englert won the 2013 Nobel Prize. However, it doesn't explain most of the mass of ordinary matter; that comes from the energy of the strong force inside protons and neutrons.","why":"The Higgs mechanism completes the Standard Model and explains why the weak force only acts over tiny distances. Without it, electrons would have no mass, atoms couldn't form and chemistry as we know it wouldn't exist. Studying the Higgs in detail is one of the most promising ways to find new physics."},"forces":{"how":["In quantum field theory, particles interact by exchanging force-carrying bosons. A force's range depends on how heavy its carrier is: roughly ħ/(mc). The photon has no mass, so electromagnetism reaches infinitely far, getting weaker with distance. The W and Z bosons are about 85–100 times heavier than a proton, so the weak force only reaches about 10<sup>−18</sup> m.","The strong force acts on particles with color charge. Unlike photons, gluons carry color charge themselves and interact with each other. This makes the force get stronger as quarks are pulled apart, like a rubber band. Pull hard enough and the energy creates new quark–antiquark pairs instead of freeing a single quark. The force that holds protons and neutrons together in nuclei is a leftover effect of this, acting over about 1–2 femtometers.","Electromagnetism's strength is set by the fine-structure constant α ≈ 1/137. Force strengths actually change with energy: at very high energies, electromagnetism gets a bit stronger while the strong force gets weaker.","The weak force is the only force that can change one type of particle into another, like turning a down quark into an up quark in beta decay. It also breaks mirror symmetry: in 1957, Chien-Shiung Wu showed that cobalt-60 atoms give off electrons more in one direction than the other. At high enough energies, above about 100 GeV, the weak and electromagnetic forces combine into one electroweak force.","Gravity is described by general relativity, not by the Standard Model. Between two protons, electric repulsion is about 10<sup>36</sup> times stronger than gravitational attraction. Grand unified theories propose that the strong and electroweak forces merge at extremely high energies, but the proton decay they predict hasn't been seen."],"x":["James Clerk Maxwell unified electricity and magnetism in the 1860s. The electromagnetic and weak forces were unified into the electroweak theory in the 1960s–70s, confirmed when the W and Z bosons were discovered. The strong force is described by quantum chromodynamics, confirmed by collider experiments.\nGravity is described separately by general relativity.","Friction, tension and 'normal' forces aren't separate fundamental forces; they're all electromagnetism acting between atoms.\nGravity's weakness shows up in daily life: a small fridge magnet can hold up a paper clip against the pull of the entire Earth.","Whether all the forces combine at very high energies is unproven; the proton decay that grand unified theories predict hasn't been seen, and protons are known to last longer than 10<sup>34</sup> years. Why gravity is so much weaker than the others is unexplained. A possible 'fifth force' shows up in experiments now and then, but none has been confirmed."],"terms":["A force-carrying particle, like the photon, gluon, W or Z.","The property of quarks and gluons that the strong force acts on; it has nothing to do with actual color.","α ≈ 1/137; the number that sets the strength of electromagnetism.","The weak force's preference for one 'handedness' over its mirror image.","The idea that separate forces are parts of a single force at high energies."],"s":"Every known interaction comes down to four forces. The strong force holds quarks and nuclei together. Electromagnetism controls chemistry and light. The weak force causes radioactive decay and makes the Sun's fusion possible. Gravity is by far the weakest, but it dominates on large scales because it always attracts and adds up over huge masses. Comparing their strengths depends on energy and distance, so these comparisons are approximate.","why":"Every process in nature, from chemistry and light to radioactivity and planetary orbits, comes down to these four forces. Understanding how they're related, and whether they're all part of one force, is a central goal of physics."},"neutrinos":{"how":["Neutrinos come in three flavors, electron, muon and tau, matching the three charged leptons. They're only made in weak-force reactions, and they interact so rarely that a typical neutrino from the Sun could pass through about a light-year of solid lead with only about a 50% chance of being stopped.","Neutrinos oscillate because each flavor is actually a quantum mixture of three different mass states. As a neutrino travels, these mass parts change at slightly different rates, so its flavor mix changes with distance and energy. Oscillation experiments measure the differences between the masses, but not the masses themselves.","Neutrinos come from everywhere. The Sun sends about 65 billion through every square centimeter facing it every second. Nuclear reactors, cosmic rays hitting the atmosphere and particle accelerators also make them. Supernova 1987A produced a burst of about two dozen detected neutrinos, arriving a few hours before its light. The Big Bang left a background of about 336 neutrinos per cubic centimeter, which hasn't been detected directly.","Detectors have to be huge and shielded. Super-Kamiokande in Japan holds 50,000 tonnes of ultra-pure water lined with light sensors that catch the faint blue Cherenkov light made when particles hit by neutrinos move faster than light travels in water. IceCube uses a cubic kilometer of Antarctic ice and has traced high-energy neutrinos back to a blazar, a nearby active galaxy and the Milky Way itself.","Experiments are testing key questions now. KATRIN studies tritium decay to measure the electron neutrino's mass. Other experiments test whether neutrinos are their own antiparticles. DUNE will compare neutrinos and antineutrinos sent 1,300 km underground."],"x":["Wolfgang Pauli proposed the neutrino in 1930 to explain missing energy in radioactive decay. Clyde Cowan and Frederick Reines detected neutrinos from a nuclear reactor in 1956.\nThe 'solar neutrino problem', where detectors found fewer neutrinos from the Sun than expected, was solved by Super-Kamiokande (1998) and SNO (2001), which showed neutrinos change type as they travel. That's only possible if they have mass.","Neutrinos aren't truly massless, even though they were assumed to be for a long time. They also aren't rare; they're among the most common particles in the universe.\nThe 2011 'faster-than-light neutrino' result from the OPERA experiment turned out to be caused by a loose fiber-optic cable and a clock problem.","The exact neutrino masses, their order from lightest to heaviest and whether neutrinos are their own antiparticles are unknown. The DUNE experiment, under construction, aims to measure whether neutrinos and antineutrinos behave differently, which might help explain why there's more matter than antimatter."],"terms":["One of the three neutrino types: electron, muon or tau.","A neutrino changing from one flavor to another as it travels.","Light given off when a charged particle moves faster than light travels through a material like water.","A particle that is its own antiparticle; neutrinos might be.","Leftover neutrinos from about one second after the Big Bang that fill the universe."],"s":"Neutrinos are nearly massless particles with no electric charge that only interact through the weak force and gravity. The discovery that they change between three types (oscillate) proved they have mass, which earned the 2015 Nobel Prize; the original Standard Model said they had none. Their exact masses, and whether a neutrino is its own antiparticle, are still unknown.","why":"Neutrinos are the clearest evidence of physics beyond the original Standard Model. They let us see inside the Sun's core and collapsing stars, carry information from the most violent events in the universe, and might help explain why the universe contains more matter than antimatter."},"duality":{"how":["Light's particle side: each photon carries energy E = hf and momentum p = h/λ, where h is Planck's constant. In the photoelectric effect, light knocks electrons out of a metal only if its frequency is above a certain threshold, no matter how bright it is; brighter light just releases more electrons. In 1923, Arthur Compton showed that X-ray photons bounce off electrons like billiard balls, proving they carry momentum.","Matter's wave side: Louis de Broglie proposed that every particle has a wavelength λ = h/p. An electron with 100 electron-volts of energy has a wavelength of about 0.12 nanometers, similar to the spacing between atoms in a crystal, which is why electrons bounce off crystals in wave-like patterns. A thrown baseball has a wavelength of around 10<sup>−34</sup> m, far too small to ever notice, which is why everyday objects don't act like waves.","Quantum mechanics describes a particle with a wavefunction, ψ. It changes over time according to the Schrödinger equation, and |ψ|² gives the probability of finding the particle at each location (the Born rule). The key to interference is that wave amplitudes add before squaring, so two paths can cancel each other (a dark band) or reinforce each other (a bright band). Ordinary probabilities can never cancel.","Why don't we see objects in two places at once in everyday life? Because of decoherence: when a quantum system interacts with its surroundings, information about which path it took leaks out into countless air molecules, photons and vibrations. The interference becomes impossible to observe, and the system acts classically.","Wave–particle behavior underlies technology: electron microscopes can see details smaller than a tenth of a nanometer, neutron beams reveal the structure of materials, and the way electrons act as waves inside crystals explains semiconductors, the basis of every transistor."],"x":["Thomas Young's double-slit experiment (around 1801) showed that light creates interference patterns like a wave. In 1905, Einstein explained the photoelectric effect by saying light arrives in packets (photons), which earned him the 1921 Nobel Prize.\nIn 1927, Clinton Davisson and Lester Germer, and separately G. P. Thomson, showed that electrons spread out like waves when passing through crystals, confirming de Broglie's idea. Interference has since been shown with atoms and even molecules made of over 2,000 atoms.","Particles don't switch between being waves and particles. Quantum objects are neither ordinary waves nor ordinary particles; those are two incomplete pictures of one underlying quantum description.\n'Observation' in quantum mechanics doesn't need a conscious person. Any interaction that records which path a particle took, like a detector or even a stray air molecule, destroys the interference pattern.","The measurement problem: why a spread-out wavefunction gives one definite result when measured is explained differently by the Copenhagen, many-worlds, pilot-wave and objective-collapse interpretations. They make nearly identical predictions, so experiments haven't been able to decide between them."],"terms":["A particle (quantum) of light, carrying energy hf.","The wavelength of a particle, λ = h/p.","The mathematical description of a quantum system; its size squared gives probabilities.","A combination of several possible states existing at once until measured.","The loss of observable quantum interference because of interaction with the surroundings.","Electrons being knocked out of a material by light above a certain frequency."],"s":"Light and matter act like waves in some experiments and like particles in others. In the double-slit experiment, an interference pattern appears even when particles are sent through one at a time. Electron microscopes work because electrons have very short wavelengths. Quantum mechanics describes all this with wavefunctions: the square of a wavefunction's size gives the probability of finding a particle in each place.","why":"Wave–particle duality is at the heart of quantum mechanics, which explains chemistry, lasers, LEDs, solar cells, transistors and every computer chip. Electron and neutron beams are essential tools in biology and materials science."},"uncertainty":{"how":["The uncertainty principle is true of all waves. To make a wave that's squeezed into a small region, you have to combine many different wavelengths. Since momentum depends on wavelength (p = h/λ), a narrow spread in position means a wide spread in momentum. Sound works the same way: a very short click contains a wide range of frequencies, while a pure musical note has to last a long time.","For position and momentum, the rule is Δx · Δp ≥ ħ/2, where ħ (h-bar) is Planck's constant divided by 2π. Similar rules apply to other pairs of quantities, like spin in different directions: you can't know an electron's spin along both the x-axis and the z-axis at once.","A related energy–time relationship, ΔE · Δt ≳ ħ/2, connects how long something lasts to how spread out its energy is. Particles that exist only briefly, like the Z boson, have a broad range of measured masses, and spectral lines from atoms that decay quickly have a measurable 'natural width'.","The principle has real effects. It sets the size of atoms: squeezing an electron closer to the nucleus increases its energy of motion, and the balance with electric attraction gives a hydrogen atom a radius of about 0.053 nm. It gives every system a minimum 'zero-point' energy, which is why helium stays liquid even near absolute zero at normal pressure. And it rules out electrons living inside nuclei.","Modern technology works right at these limits. LIGO uses 'squeezed light', which reduces uncertainty in one property of the light while increasing it in another, to lower noise in the measurement that matters. Similar tricks improve atomic clocks and other quantum sensors."],"x":["Werner Heisenberg formulated the principle in 1927 from the mathematics of quantum mechanics. It shows up in experiments when a beam of light or particles passes through a narrow slit: the narrower the slit, the more the beam spreads out.\nIt also explains measurable facts, like the stability and size of atoms and zero-point motion, the leftover jiggling that keeps helium liquid near absolute zero.","Uncertainty isn't just a result of measurements disturbing things, although that's how Heisenberg first described it. It's built into what a quantum state is: a particle doesn't have an exact position and momentum at the same time.\nIt also doesn't mean 'nothing can be known'. Quantum mechanics makes extremely precise statistical predictions.","The principle itself is settled. Researchers study how to use or work around it, like the 'squeezed light' in LIGO, which reduces uncertainty in one quantity at the cost of another to improve sensitivity."],"terms":["h/2π ≈ 1.055 × 10<sup>−34</sup> J·s; the basic size of quantum effects.","A mathematical tool that shows whether the order of two measurements matters.","The lowest possible energy of a quantum system, which is never exactly zero.","The natural spread in a spectral line's frequency caused by an excited state lasting only a short time.","Light designed to have less uncertainty in one property at the cost of more in another."],"s":"A particle's position and momentum can't both be precisely defined at the same time. This isn't because our instruments are clumsy; it comes from the wave nature of matter. It explains why electrons don't collapse into the nucleus, and it helps hold up white dwarfs and neutron stars.","why":"The uncertainty principle keeps atoms stable, sets their sizes and chemistry, and puts basic limits on measurement. Engineers now use those limits cleverly to build more sensitive gravitational-wave detectors, clocks and quantum sensors."},"entanglement":{"how":["An entangled pair of particles can't be described as two separate states. The standard example is a 'singlet': the pair's total spin is zero, but neither particle has a definite spin direction on its own. If you measure both in the same direction, the results are always opposite. If you measure them in directions separated by an angle θ, their results are correlated by −cos θ.","In 1964, John Bell proved that no theory where particles carry pre-set answers ('local hidden variables') can match these correlations. In the common CHSH version of the test, such theories must give a combined score S ≤ 2, while quantum mechanics allows up to 2√2 ≈ 2.83. Experiments consistently measure values well above 2.","Early experiments had loopholes, like detectors missing particles. In 2015, teams in the Netherlands, Austria and the United States closed the main loopholes at the same time. Later experiments even used light from distant quasars to choose measurement settings, pushing any possible hidden coordination back billions of years.","Entanglement doesn't allow faster-than-light communication: each side's results are random on their own, and the correlation only shows up when the records are compared through ordinary communication. A related rule, the no-cloning theorem, says you can't make a perfect copy of an unknown quantum state.","Uses are growing. Quantum key distribution uses entangled or single photons to create encryption keys where any eavesdropping leaves detectable traces. Quantum teleportation transfers a quantum state using entanglement plus normal messages. Quantum computers use entanglement among qubits, but entanglement is fragile: interaction with the surroundings destroys it, which is why error correction is the field's biggest challenge."],"x":["In 1935, Einstein, Podolsky and Rosen argued that quantum mechanics must be incomplete. In 1964, John Bell showed that hidden local properties would limit how strongly measurements could be correlated. Experiments by John Clauser, Alain Aspect and Anton Zeilinger broke those limits, earning the 2022 Nobel Prize.\nIn 2015, several teams ran 'loophole-free' Bell tests. China's Micius satellite has shared entanglement between ground stations over 1,200 km apart.","Entanglement doesn't allow faster-than-light communication. Each side sees random results; the correlation only appears when the records are compared over a normal channel.\nQuantum teleportation transfers a quantum state, not matter, and it requires sending ordinary information too.","How to interpret these nonlocal correlations is still debated. A practical challenge is keeping large entangled systems stable for quantum computing, since interaction with the environment destroys entanglement quickly."],"terms":["A limit on correlations that any theory with local hidden properties must obey; quantum mechanics breaks it.","The assumption that objects have definite properties before measurement and can't be affected faster than light.","A quantum bit, which can be in superpositions and be entangled with other qubits.","A way of sharing encryption keys whose security is guaranteed by quantum physics.","The rule that an unknown quantum state can't be copied perfectly."],"s":"Entangled particles share a single quantum state, so their measurement results are linked more strongly than any explanation based on hidden, pre-set properties allows. Experiments called Bell tests have confirmed this, even with all major loopholes closed. Entanglement can't send information faster than light, because each individual result is random. It's the basis of quantum computing and quantum encryption.","why":"Entanglement forced physicists to give up the idea that the world can be fully described by local, pre-existing properties. It's now a resource for technology, making possible quantum encryption, quantum computing and extremely precise sensors."},"atoms":{"how":["In quantum mechanics, electrons in atoms occupy orbitals, which are standing-wave patterns described by quantum numbers: n (energy level), l (orbital shape: s, p, d or f), m<sub>l</sub> (orientation) and m<sub>s</sub> (spin). The Pauli exclusion principle allows at most two electrons, with opposite spins, in each orbital. Filling orbitals in order of energy creates the shell structure behind the periodic table, which is why elements in the same column have similar chemistry.","Hydrogen, with one electron, can be solved exactly: its energy levels are E<sub>n</sub> = −13.6 eV / n². Very precise measurements reveal tiny extra splittings caused by relativity, electron spin and quantum effects, making hydrogen one of the most precise tests of physics.","The nucleus holds protons and neutrons together with the strong nuclear force, which overpowers electric repulsion only at very short distances. Isotopes are atoms with the same number of protons but different numbers of neutrons. Unstable nuclei decay by alpha decay (giving off a helium nucleus), beta decay (a neutron turning into a proton, or the reverse) or gamma decay (giving off high-energy light).","Each element absorbs and gives off light at specific wavelengths, creating a unique fingerprint. Joseph von Fraunhofer cataloged dark lines in sunlight in 1814. In 1868, astronomers found an unknown line in the Sun's spectrum that turned out to be helium, which wasn't found on Earth until 1895. Today, spectral lines reveal stars' composition, temperature, magnetic fields and motion.","Atoms also define time. The second is defined by a cesium-133 atom: exactly 9,192,631,770 vibrations of a specific transition. Newer optical clocks, using atoms like strontium and ytterbium, would lose less than a second over the entire age of the universe."],"x":["J. J. Thomson discovered the electron in 1897. In 1909–1911, Ernest Rutherford's team fired alpha particles at thin gold foil; a few bounced straight back, revealing a tiny, dense nucleus. Niels Bohr's 1913 model explained hydrogen's spectral lines, and full quantum mechanics followed in the 1920s.\nScanning tunneling microscopes can now image individual atoms, and in 1989 IBM researchers arranged single atoms to spell out their company logo.","Electrons don't orbit the nucleus like planets around the Sun. They occupy orbitals, which are probability clouds with specific shapes and energies.\nAtoms aren't simply 'mostly empty space'; the electron cloud fills the atom, and solid objects feel solid because of electric repulsion and the Pauli exclusion principle.","The 'proton radius puzzle', a disagreement between different measurements of the proton's size, has mostly been resolved in favor of the smaller value, about 0.84 femtometers. Precision atomic measurements remain a sensitive way to search for new physics."],"terms":["A region showing where an electron is likely to be found around a nucleus.","A number that labels an electron's state, such as its energy level, shape or spin.","The rule that no two identical fermions, like electrons, can be in the same quantum state.","Atoms of the same element with different numbers of neutrons.","A specific wavelength of light given off or absorbed when an electron changes energy level."],"s":"Atoms have a tiny, dense nucleus of protons and neutrons, surrounded by electrons in specific orbitals. The number of protons decides which element it is. Electrons can only have certain energy levels, which is why each element gives off and absorbs specific wavelengths of light. That's the basis of spectroscopy and how we know what distant stars are made of.","why":"Atomic structure explains all of chemistry, the properties of materials, how stars shine and what they're made of. Spectroscopy is astronomy's most powerful tool, and atomic clocks keep GPS, the internet and tests of fundamental physics running."},"special-rel":{"how":["From his two ideas, Einstein derived the Lorentz transformations, the rules for converting times and positions between observers moving relative to each other. In 1908, Hermann Minkowski showed that space and time together form a single four-dimensional spacetime. Observers can disagree about time and distance separately, but they all agree on a combination called the spacetime interval, s² = (cΔt)² − Δx².","Three effects follow. Time dilation: a moving clock ticks slower by the Lorentz factor γ. Length contraction: a moving object is shorter in its direction of motion by the same factor. Relativity of simultaneity: two events that happen at the same time for one observer may not for another. Einstein's example: lightning strikes both ends of a moving train. Someone on the platform and someone on the train disagree about which strike came first, and neither is wrong.","Speeds don't simply add. Combining speeds u and v gives (u + v)/(1 + uv/c²), which never goes over c. If a spaceship moving at 0.9c fires a probe forward at 0.9c, Earth measures the probe at about 0.994c, not 1.8c.","Momentum and energy grow without limit as speed gets close to c: p = γmv and E = γmc². Speeding any object with mass up to light speed would take infinite energy, while massless particles like photons always travel at exactly c. At the Large Hadron Collider, protons move within about 3 m/s of light speed.","Cause and effect are protected by light cones: you can only influence events that a light-speed signal could reach. A faster-than-light signal would, for some observers, arrive before it was sent, which would create paradoxes. In the 'twin paradox', the traveling twin ages less, because only the traveler turns around and changes reference frames, so the situation isn't symmetric."],"x":["In 1887, the Michelson–Morley experiment found that light's speed doesn't change with Earth's motion, which contradicted the idea of a fixed 'ether' that light travels through. Special relativity explained this and has passed every test since.\nParticle accelerators routinely see unstable particles live longer when moving near light speed. In 1971, the Hafele–Keating experiment flew atomic clocks around the world on airplanes and measured the predicted time differences. Modern optical clocks can detect time dilation at speeds of just a few meters per second.","Time dilation isn't an illusion or a broken clock; the amount of time that actually passes really is different along different paths through spacetime. In the twin paradox, the traveling twin really does age less.\n'Relativity' doesn't mean everything is relative. The speed of light, the laws of physics and the spacetime interval between events are the same for all observers.","Special relativity is extremely well tested and isn't considered an open question. Physicists keep testing it with more and more precision, because some ideas about quantum gravity predict tiny violations; none has been found."],"terms":["A point of view, with its own clocks and rulers, from which motion is measured.","1/√(1 − v²/c²): how much time slows and lengths shrink at speed v.","The time measured by a clock traveling along with the object itself.","A combination of time and distance between two events that all observers agree on.","The region of spacetime that signals traveling at or below light speed can reach."],"s":"Einstein's 1905 theory of special relativity is built on two ideas: the laws of physics are the same for everyone moving at a steady speed, and the speed of light in a vacuum is the same for every observer. From those follow time dilation, length contraction and the idea that 'at the same time' depends on who is watching. All of these effects are controlled by the Lorentz factor, γ = 1/√(1 − v²/c²). It's confirmed every day, for example by fast muons from cosmic rays that survive long enough to reach the ground.","why":"Special relativity is the basis of particle physics, nuclear energy, particle accelerators and the satellite timing used in GPS. It shows that electricity and magnetism are connected through relativity, and it set the stage for general relativity and all of modern quantum field theory."},"emc2":{"how":["In 1905, Einstein showed that when an object gives off energy E as light, its mass decreases by E/c². He extended this into mass–energy equivalence: an object at rest has 'rest energy' mc², and any change in its internal energy, including heat, chemical bonds or nuclear binding, changes its mass.","This explains nuclear energy. A helium-4 nucleus is about 0.75% lighter than the two protons and two neutrons it's made from. That 'mass defect' is the binding energy released when it formed. If you graph binding energy per particle, it rises steeply for light nuclei, peaks around iron and nickel, and slowly drops for heavy ones. That's why fusing light nuclei and splitting heavy ones both release energy.","Most of the mass of ordinary matter is actually energy. A proton has a mass of about 938 MeV/c², but its three quarks only contribute about 9 MeV/c². The other ~99% comes from the energy of the strong force field and the quarks' motion.","Energy can turn into matter, and matter into energy. A high-energy photon near a nucleus can create an electron and a positron. When an electron and a positron meet, they annihilate into two gamma rays of 511 keV each. PET medical scanners detect exactly these gamma-ray pairs. Particle colliders turn the energy of motion into heavy particles like top quarks and Higgs bosons.","How much mass turns into energy varies enormously. Burning fuel converts about one part in ten billion of its mass. Nuclear fission converts about 0.1%, hydrogen fusion about 0.7%, matter falling into a spinning black hole up to about 40%, and matter–antimatter annihilation 100%."],"x":["In 1932, John Cockcroft and Ernest Walton split lithium nuclei and measured energy releases that matched the mass that was lost. Modern precision tests compare mass differences with gamma-ray energies and confirm E = mc² to better than one part in a million.\nEvery nuclear reactor, the Sun and particle colliders that create heavy particles from collision energy are working demonstrations.","E = mc² doesn't only apply to bombs and reactors. Any change in energy changes mass: a hot cup of coffee has very slightly more mass than a cold one, though far too little to measure.\nThe full equation for a moving object is E² = (mc²)² + (pc)², which also covers light, which has no mass but still carries energy and momentum.","The relationship itself is settled. Deeper questions are about why fundamental particles have the masses they do, which the Standard Model doesn't predict."],"terms":["The energy an object has because of its mass alone, mc².","The difference between a nucleus's mass and the total mass of its separate protons and neutrons.","The energy needed to break a nucleus into its parts, equal to the mass defect times c².","When a particle and its antiparticle meet and turn completely into energy.","Creating a particle and its antiparticle from energy."],"s":"Mass is a form of energy, related by E = mc². Because c² is such a huge number, a small amount of mass equals a large amount of energy. This explains the energy released by nuclear fission and fusion. It also explains most of your body's mass, which comes from the energy of the quarks and gluons inside protons and neutrons, not from the quarks' own mass.","why":"Mass–energy equivalence explains how stars shine, how nuclear reactors and weapons work, where most of the mass of ordinary matter comes from and how particle accelerators create new particles. It's also used every day in hospitals through PET scans."},"general-rel":{"how":["General relativity starts from the equivalence principle: in a small region, gravity can't be told apart from acceleration. An astronaut in a closed elevator can't tell whether it's sitting on Earth or speeding up at 9.8 m/s² in empty space, and someone falling freely feels weightless. Experiments like the MICROSCOPE satellite have confirmed that all objects fall the same way to about one part in 10<sup>15</sup>.","Einstein concluded that gravity is the shape of spacetime. His field equations connect the curvature of spacetime to the energy and momentum of matter. As physicist John Wheeler put it: 'Spacetime tells matter how to move; matter tells spacetime how to curve.' Objects in free fall follow geodesics, the straightest possible paths through curved spacetime.","For everyday gravity, the curving of time matters most. Clocks run slower deeper in a gravitational field, and objects naturally move toward where time runs slower, which is why things fall. Atomic clocks can detect this: in 2022, physicists measured time running at different rates across a sample of atoms just a millimeter tall.","The theory has passed every test: the 43 arcseconds per century shift in Mercury's orbit; starlight bending by 1.75 arcseconds near the Sun; radar signals delayed when passing the Sun; spacetime being twisted by Earth's rotation, measured by Gravity Probe B; gravitational lensing; gravitational waves; black hole images; and stars orbiting the Milky Way's central black hole.","Where general relativity predicts singularities, like at the centers of black holes and the beginning of the universe, it shows that it's breaking down. A quantum theory of gravity is expected to take over there."],"x":["In 1915, general relativity explained a long-known puzzle: Mercury's orbit shifts by an extra 43 arcseconds per century. In 1919, Arthur Eddington's eclipse expedition measured starlight bending around the Sun by the predicted amount, making Einstein world-famous.\nLater tests include light losing energy as it climbs out of gravity (the Pound–Rebka experiment, 1959), radar time delays to planets, Gravity Probe B, gravitational lensing, gravitational waves and black hole images. Clocks on a mountain really do run measurably faster than clocks at sea level.","The 'rubber sheet' picture is only an analogy, and it's misleading in one way: it uses gravity to explain gravity. In real general relativity, the curving of time matters most for everyday gravity; objects fall mainly because clocks run slower closer to Earth.\nGeneral relativity didn't prove Newton wrong for most purposes; Newton's law of gravity is an excellent approximation when gravity is weak and speeds are low.","General relativity and quantum mechanics don't work together in extreme conditions like singularities and the Big Bang. String theory and loop quantum gravity are leading candidates for combining them, but neither has been confirmed by experiment."],"terms":["The principle that, in a small region, gravity can't be told apart from acceleration.","The straightest possible path through curved spacetime; the path of an object in free fall.","The bending of space and time by mass and energy, which we experience as gravity.","The bending of light by mass, which can magnify, distort or multiply images of objects behind it.","The twisting of spacetime by a spinning mass.","The extra time light takes to travel when it passes near a massive object."],"s":"Einstein's 1915 theory of general relativity describes gravity as the curving of spacetime by mass and energy; objects follow the straightest possible paths through that curved spacetime. It predicted the shift in Mercury's orbit, the bending of light, time running slower in strong gravity, black holes and gravitational waves, and all have been confirmed. It doesn't fit together with quantum mechanics, which is one of the biggest open problems in physics.","why":"General relativity is the foundation of modern cosmology, black hole physics and gravitational-wave astronomy. Without its corrections, GPS would drift by kilometers every day, and gravitational lensing lets astronomers map dark matter and see the most distant galaxies."},"solar-system":{"how":["About 4.57 billion years ago, part of a cold gas cloud collapsed. Radioactive atoms like aluminum-26 found in meteorites suggest that material from a nearby massive star or supernova was mixed in. Most of the mass fell to the center to become the Sun; the rest flattened into a spinning disk called a protoplanetary disk.","Planets built up in stages. Dust grains stuck together into pebbles, pebbles gathered into planetesimals kilometers across, and planetesimals collided and merged into protoplanets. Inside the frost line it was too warm for water ice, so only rock and metal were available, making small rocky planets. Beyond it, ice added extra material, letting cores grow to about 10 Earth masses, big enough to pull in hydrogen and helium gas before the young Sun blew the gas away within a few million years.","Planets moved after forming. The 'Grand Tack' idea says Jupiter moved inward and then back out, which could explain why Mars is so small and why the asteroid belt has mixed materials. The 'Nice model' says the giant planets later went through an unstable period that rearranged their orbits and scattered icy bodies, shaping the Kuiper belt.","Earth's Moon most likely formed when a Mars-sized body, called Theia, crashed into the young Earth and threw material into orbit that clumped together. This explains why the Moon has a small iron core and is chemically similar to Earth's mantle.","The solar system extends far beyond the planets. The asteroid belt's total mass is only about 3% of the Moon's. Beyond Neptune is the Kuiper belt, home to Pluto and other dwarf planets. The heliopause, where the Sun's solar wind meets interstellar space, is about 120 AU away (120 times Earth's distance from the Sun); Voyager 1 crossed it in 2012. The proposed Oort cloud, a huge shell of icy bodies reaching perhaps 100,000 AU, is thought to be where long-period comets come from."],"x":["The idea that the solar system formed from a spinning cloud goes back to Kant and Laplace in the 1700s. Modern telescopes support it by showing disks around young stars; ALMA's 2014 image of the young star HL Tauri showed gaps probably carved by forming planets.\nRadioactive dating of the oldest grains in meteorites gives the solar system's age, about 4.567 billion years. Samples brought back from asteroids Ryugu and Bennu provide untouched early material.","The asteroid belt isn't crowded like in movies; asteroids are usually hundreds of thousands of kilometers apart.\nSeasons aren't caused by Earth's distance from the Sun; they come from the tilt of Earth's axis. Earth is actually closest to the Sun in early January.","The 'Planet Nine' idea proposes an undiscovered planet beyond Neptune to explain why some distant objects have clustered orbits; it hasn't been confirmed. Where Earth's water came from, whether asteroids, comets or local material, is debated."],"terms":["A spinning disk of gas and dust around a young star, where planets form.","A solid body from about a kilometer to hundreds of kilometers across; a building block of planets.","The distance from a young star beyond which water ice can survive.","A region of icy bodies beyond Neptune, including Pluto.","A proposed distant shell of icy bodies, likely the source of long-period comets.","The boundary where the Sun's solar wind meets interstellar space."],"s":"The solar system formed from a collapsing cloud of gas and dust. Most of the mass fell to the center and became the Sun, while the leftover spinning disk built planets by clumping material together. Rocky planets formed close to the Sun where it was hot; gas and ice giants formed farther out, beyond the 'frost line' where ice could exist. The planets probably shifted their orbits after forming, which helps explain features like the asteroid belt.","why":"Understanding how the solar system formed explains what Earth is made of, where its water came from and why it can support life. Comparing it with thousands of planetary systems around other stars shows which features are common and which may be rare."},"the-sun":{"how":["The Sun has layers. The core, the inner quarter of its radius, produces nearly all its energy at densities over 150 times that of water. The energy then travels through the radiative zone as light that is absorbed and re-emitted so many times that the trip takes tens of thousands of years or more. In the outer 30%, the convection zone, hot plasma rises in huge bubbles, cools at the surface and sinks again.","The visible surface, the photosphere, is about 5,800 K and looks grainy: each grain is the top of a convection cell about the size of Texas that lasts around ten minutes. Above it are the chromosphere and the corona, the faint outer atmosphere seen during total solar eclipses. The corona is over a million kelvin and streams outward as the solar wind at 300 to 800 km/s.","The Sun spins faster at its equator (about 25 days) than near its poles (about 35 days). This uneven spinning, along with convection, twists and strengthens its magnetic field, a process called the solar dynamo. Where strong fields block convection, cooler, darker sunspots appear. About every 11 years the Sun's magnetic field flips, so a full magnetic cycle lasts about 22 years.","Stored magnetic energy is released in flares, bursts of radiation lasting minutes to hours, and in coronal mass ejections, which hurl billions of tonnes of magnetized plasma into space. When these hit Earth, they can cause geomagnetic storms that push auroras far from the poles, as in May 2024, disrupt radio and GPS, damage satellites and, in extreme cases, overload power grids. The 1859 Carrington Event even started fires in telegraph offices."],"x":["Helioseismology, the study of sound waves vibrating through the Sun, maps its interior the way earthquake waves map Earth's. Neutrinos caught by underground detectors confirm the fusion reactions in its core. Spacecraft like SOHO, the Solar Dynamics Observatory and Parker Solar Probe watch it constantly; in December 2024, Parker passed about 6.1 million km from the surface, closer than any spacecraft before.\nThe sunspot cycle has been tracked since the early 1600s, when Galileo and others first saw sunspots through telescopes.","The Sun isn't really yellow. Its combined light is basically white; it looks yellow from the ground because the atmosphere scatters some blue light away, and orange-red at sunset when that scattering is strongest.\nThe Sun isn't on fire, and it will never explode as a supernova because it isn't massive enough. It will become a red giant in about 5 billion years.\nThe corona really is far hotter, over a million kelvin, than the visible surface at about 5,800 K.","Why is the corona hundreds of times hotter than the surface? Leading ideas involve magnetic waves and countless tiny magnetic explosions called nanoflares, and Parker Solar Probe and the Daniel K. Inouye Solar Telescope are testing them. Predicting how strong upcoming solar cycles will be, and when big flares will happen, is still difficult."],"terms":["The Sun's visible surface, at about 5,800 K.","The Sun's outer atmosphere, over a million kelvin, visible during total solar eclipses.","A steady stream of charged particles flowing out from the corona.","A cooler, darker area where strong magnetic fields block convection.","A huge eruption of magnetized plasma from the corona into space.","The roughly 11-year rise and fall of the Sun's activity."],"s":"The Sun is a medium-sized G-type star, 4.6 billion years old, holding 99.86% of the solar system's mass. Its core fuses about 600 million tonnes of hydrogen into helium every second at 15 million K, giving off 3.8 × 10<sup>26</sup> watts. Its outer layers are a churning magnetic plasma, and its activity, including sunspots, flares and eruptions, rises and falls over an 11-year cycle and causes 'space weather' at Earth.","why":"The Sun powers Earth's climate and nearly all life. Understanding its activity is essential for forecasting space weather that threatens satellites, astronauts and power grids. As the only star we can study up close, it's also the reference for understanding every other star."},"the-moon":{"how":["The Moon takes 27.3 days to orbit Earth relative to the stars, but 29.5 days from one new Moon to the next, because Earth moves along its own orbit in the meantime. The Sun always lights half of the Moon; as it orbits, we see that lit half from different angles, which gives the phases: new, crescent, quarter, gibbous and full.","Eclipses only happen when the Sun, Earth and Moon line up closely. The Moon's orbit is tilted about 5° compared with Earth's, so that doesn't happen every month. By coincidence, the Sun is about 400 times wider than the Moon and also about 400 times farther away, so they look almost the same size in the sky, which makes total solar eclipses possible.","Long ago, Earth's gravity slowed the Moon's spin until it became tidally locked. The Moon's gravity raises tides on Earth, and friction from those tides slowly transfers spin energy from Earth to the Moon's orbit. As a result, Earth's day gets about 2 milliseconds longer every century, and the Moon drifts about 3.8 cm farther away each year.","The Moon's surface preserves history. The dark areas, called maria, are ancient lava plains; the bright highlands are older and heavily cratered. With no air, liquid water or plate tectonics, craters billions of years old survive. Temperatures swing from about 120 °C in sunlight to below −170 °C at night. Some craters near the poles never get sunlight and hold water ice."],"x":["Apollo astronauts brought back 382 kg of Moon rocks between 1969 and 1972, and Soviet Luna and Chinese Chang'e missions returned more, including samples from the far side by Chang'e 6 in 2024. The rocks' chemistry closely matches Earth's mantle, supporting the giant-impact idea. Reflectors left by Apollo let scientists bounce lasers off the Moon and measure its distance to within millimeters.\nCounting craters on surfaces dated by these samples gives a timeline used to date surfaces across the solar system.","Phases aren't caused by Earth's shadow. They show how much of the Moon's sunlit half we can see as it orbits. Earth's shadow only falls on the Moon during a lunar eclipse.\nThe 'dark side' isn't always dark; the far side gets as much sunlight as the near side. We just never see it from Earth.\nThe Moon does rotate, exactly once per orbit, which is why one side always faces us.","The details of the giant impact are debated. The Moon's makeup is so similar to Earth's that simple models struggle to explain it, so scientists have proposed alternatives like a more violent collision or a 'synestia', a spinning cloud of vaporized rock. How much water ice is in the permanently shadowed craters, and in what form, is a major goal of NASA's Artemis program and robotic missions."],"terms":["When an object's spin matches its orbit, so the same side always faces its partner.","How much of the Moon's sunlit half is visible from Earth.","Dark, smooth plains on the Moon formed by ancient lava flows.","The 29.5 days between one full Moon (or new Moon) and the next.","The theory that the Moon formed from debris after a Mars-sized body hit the early Earth."],"s":"The Moon is Earth's only natural satellite. It is about a quarter of Earth's width and 1.2% of its mass, and it orbits at an average distance of 384,400 km. It most likely formed from debris after a Mars-sized body hit the young Earth about 4.5 billion years ago. It is tidally locked, so it always shows us the same face. Its gravity causes ocean tides, slowly lengthens Earth's day and helps keep Earth's tilt steady.","why":"The Moon keeps Earth's tilt steady, which keeps our climate more stable over long periods, and its tides shaped coastlines and possibly early life. Its preserved surface records the early history of the solar system, and it's the stepping stone for human exploration deeper into space."},"rocky-planets":{"how":["Early on, the rocky planets 'differentiated': heat from impacts and radioactivity melted their interiors, heavy iron sank to form cores, and lighter rock floated up. Moving molten iron in a core can create a magnetic field. Earth's strong field shields its atmosphere from the solar wind. Mars lost its global field early, and Venus doesn't have one t
