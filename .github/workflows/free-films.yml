# Rebuilds Rolling Credits' free films (Internet Archive public-domain films and classic cartoons, Blender shorts)
# every week and publishes them to the free-data branch.
name: Free films
on:
  schedule:
    - cron: '41 10 * * 0'         # Sundays, ~4-5 AM Central
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/free-films.yml', 'scripts/free_films.py']
permissions:
  contents: write
concurrency: free-films
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download IMDb datasets
        run: |
          mkdir -p data
          for f in title.ratings title.basics; do
            curl -sSfL --retry 3 -o "data/$f.tsv.gz" "https://datasets.imdbws.com/$f.tsv.gz"
          done
      - name: Match the Internet Archive's films
        run: python -u scripts/free_films.py data out
      - name: Publish to the free-data branch
        run: |
          cd out
          git init -q -b free-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Free films $(date -u +%F)"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" free-data
