# Builds the Rolling Credits Android app (android-app/) and publishes the APK as the "android-latest" release.
name: Android app
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android-app/**', '.github/workflows/android-app.yml']
permissions:
  contents: write
concurrency: android-app
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Android SDK (preinstalled on GitHub's runners)
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME/platforms" | tail -3
      - name: Install Capacitor
        run: npm install --no-audit --no-fund
      - name: Create the Android project
        run: |
          cp node_modules/@capacitor/core/dist/capacitor.js www/capacitor.js
          sed -i "s/__BUILD__/${GITHUB_RUN_NUMBER} · $(TZ=America/Chicago date '+%b %-d, %-I:%M %p')/" www/index.html
          npx cap add android
          ./scripts/patch-android.sh
          npx cap sync android
      - name: Build APK
        working-directory: android-app/android
        run: ./gradlew --no-daemon assembleDebug
      - name: Rename and check it's signed with the app's own key
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk rolling-credits.apk
          want=$(keytool -list -v -keystore debug.keystore -storepass android | grep -m1 'SHA256:' | awk '{print $2}')
          got=$(keytool -printcert -jarfile rolling-credits.apk | grep -m1 'SHA256:' | awk '{print $2}')
          echo "want $want"; echo "got  $got"
          test "$want" = "$got"
      - uses: actions/upload-artifact@v4
        with:
          name: rolling-credits-apk
          path: android-app/rolling-credits.apk
      - name: Publish as the android-latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Rolling Credits for Android (latest build)
          body: "Latest build from ${{ github.sha }}. Download rolling-credits.apk on your phone and open it to install or update."
          prerelease: false
          make_latest: false
          files: android-app/rolling-credits.apk
