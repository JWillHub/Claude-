# Builds the Banking+ Android app (banking-plus-app/, screens from banking-plus/) and publishes the APK as the "banking-plus-latest" release.
name: Banking+ app
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['banking-plus/**', 'banking-plus-app/**', '.github/workflows/banking-plus-app.yml']
permissions:
  contents: write
concurrency: banking-plus-app
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: banking-plus-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Android SDK (preinstalled on GitHub's runners)
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME/platforms" | tail -3
      - name: Install Capacitor
        run: npm install --no-audit --no-fund
      - name: Create the Android project
        run: |
          # the screens are the published Banking+ page, so the app and the web version always match
          cp ../banking-plus/index.html ../banking-plus/bp-icon-192.png ../banking-plus/bp-icon-512.png ../banking-plus/bp-apple-touch.png www/
          echo "{\"build\": ${GITHUB_RUN_NUMBER}}" > version.json
          npx cap add android
          ./scripts/patch-android.sh
          npx cap sync android
      - name: Unlock the private signing key (SIGNING_PASSPHRASE secret)
        env:
          PASSPHRASE: ${{ secrets.SIGNING_PASSPHRASE }}
        run: |
          if [ -n "$PASSPHRASE" ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in signing.keystore.enc -out debug.keystore -pass env:PASSPHRASE
            echo "KS_PASS=$PASSPHRASE" >> "$GITHUB_ENV"
          else
            echo "::warning::SIGNING_PASSPHRASE secret is not set, so this build uses the old public key"
            echo "KS_PASS=android" >> "$GITHUB_ENV"
          fi
      - name: Build APK
        working-directory: banking-plus-app/android
        run: ./gradlew --no-daemon assembleDebug
      - name: Rename and check it's signed with the app's own key
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk banking-plus.apk
          want=$(keytool -list -v -keystore debug.keystore -storepass "$KS_PASS" | grep -m1 'SHA256:' | awk '{print $2}')
          got=$(keytool -printcert -jarfile banking-plus.apk | grep -m1 'SHA256:' | awk '{print $2}')
          echo "want $want"; echo "got  $got"
          test "$want" = "$got"
      - uses: actions/upload-artifact@v4
        with:
          name: banking-plus.apk
          path: banking-plus-app/banking-plus.apk
      - name: Publish as the banking-plus-latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: banking-plus-latest
          name: Banking+ for Android (latest build)
          body: "Latest build from ${{ github.sha }}. Download banking-plus.apk on your phone and open it to install or update."
          prerelease: false
          make_latest: false
          files: |
            banking-plus-app/banking-plus.apk
            banking-plus-app/version.json
