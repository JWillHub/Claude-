# Rebuilds Rolling Credits' free YouTube rows (official channels only, see scripts/yt_channels.json) every week
# and publishes them to the yt-data branch.
name: YouTube rows
on:
  schedule:
    - cron: '17 11 * * 0'         # Sundays, ~5-6 AM Central
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/youtube-free.yml', 'scripts/youtube_free.py', 'scripts/yt_channels.json']
permissions:
  contents: write
concurrency: youtube-free
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch the channels
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python -u scripts/youtube_free.py out
      - name: Publish to the yt-data branch
        run: |
          cd out
          git init -q -b yt-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "YouTube rows $(date -u +%F)"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" yt-data
