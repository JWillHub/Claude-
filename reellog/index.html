<title>Reel Log has moved</title>
<style>html,body{margin:0;height:100%;background:#0c0a0f;color:#f4efe9;font:16px system-ui,sans-serif}body{display:grid;place-items:center;text-align:center;padding:0 24px}a{color:#ffb547}</style>
</head>
<body>
<p>Reel Log has moved to <a href="../reel-log/">jwillhub.github.io/Claude-/reel-log/</a>.</p>
<script>
if('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => { if(r.scope.endsWith('/reellog/')) r.unregister(); })).catch(() => {});
location.replace('../reel-log/' + location.hash);
</script>
</body>
</html>
