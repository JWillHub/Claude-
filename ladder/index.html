<html lang="en">

<style>
:root{--bg:#000;--panel:#0e0f11;--ink:#dde1e6;--mute:#8e959d;--line:#2b2e33;--key:#18191c;--keyh:#292b30;--acc:#d3d9df;--chip:#1b1d20;--chipink:#0a0a0b;--yel:#f2c40d}
#v-home,#v-home *,#v-guide,#v-guide *{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;display:flex;flex-direction:column;overflow:hidden;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.view{display:none;flex:1 1 auto;min-height:0;width:100%;max-width:420px;margin:0 auto;padding:0 12px;flex-direction:column}
.view.raw{max-width:none;padding:0;margin:0}
[data-home]{cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;user-select:none;-webkit-user-select:none}
[data-home]:active{background:rgba(255,255,255,.07)}
[data-home]:focus-visible{outline:2px solid var(--yel);outline-offset:-2px}
.view.show{display:flex}
.view.show[data-dir="r"]{animation:inR .3s cubic-bezier(.2,.8,.2,1)}
.view.show[data-dir="l"]{animation:inL .3s cubic-bezier(.2,.8,.2,1)}
@keyframes inR{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
@keyframes inL{from{opacity:0;transform:translateX(-40px)}to{opacity:1;transform:none}}

/* home */
.brand{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px 0 4px}
.ttl{margin:0;font-family:"Black Ops One",Impact,"Arial Black","Arial Narrow",sans-serif;font-weight:400;font-size:clamp(22px,7.6vw,32px);line-height:1.1;letter-spacing:.06em;text-transform:uppercase;text-align:center;white-space:nowrap;color:var(--ink)}
.emb{display:block;flex:0 1 auto;min-height:0;height:clamp(48px,13vh,112px);width:auto;aspect-ratio:1}
@keyframes ttlglow{0%,100%{text-shadow:0 0 4px rgba(255,70,50,.25),0 0 12px rgba(220,30,20,.15)}50%{text-shadow:0 0 6px rgba(255,80,60,.95),0 0 18px rgba(235,40,30,.8),0 0 36px rgba(200,20,15,.55)}}
.ttl{animation:ttlglow 3.6s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.ttl{animation:none;text-shadow:0 0 8px rgba(255,70,50,.6),0 0 20px rgba(220,30,20,.4)}}
.tag{margin:0;padding-left:.3em;font-size:12px;line-height:1.2;letter-spacing:.3em;text-transform:uppercase;text-align:center;color:var(--mute)}
.sub{font-size:11px;letter-spacing:.2em;color:var(--mute);text-align:center}
.menu{flex:0 0 auto;display:flex;flex-direction:column;gap:10px;padding:14px 0}
.big{flex:0 0 auto;height:clamp(76px,15vh,132px);display:flex;align-items:center;gap:14px;padding:0 16px;appearance:none;-webkit-appearance:none;background-color:var(--panel);background-image:repeating-linear-gradient(135deg,rgba(225,230,236,.05) 0 1px,transparent 1px 5px);border:1px solid var(--line);border-left:4px solid var(--acc);border-radius:14px;color:var(--ink);text-decoration:none;font:inherit;text-align:left;cursor:pointer;touch-action:manipulation;transition:background-color .15s,transform .1s}
.big:active{background-color:var(--keyh);transform:scale(.985)}
.ic,.chev{flex:0 0 auto;fill:none;stroke-linecap:round;stroke-linejoin:round}
.ic{width:34px;height:34px;stroke:var(--acc);stroke-width:1.6}
.chev{width:22px;height:22px;stroke:var(--mute);stroke-width:2}
.tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.tt{font-size:clamp(20px,3.2vh,26px);font-weight:800;letter-spacing:.1em}
.ts{font-size:11px;letter-spacing:.16em;color:var(--mute)}

/* guide */
.gh{flex:0 0 auto;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:50px;margin:4px -12px 0;padding:0 12px}
.gh h1{margin:0;font-size:15px;font-weight:800;letter-spacing:.2em}
.gs{font-size:10px;letter-spacing:.16em;color:var(--mute)}
.sc{flex:1 1 auto;min-height:0;display:flex;gap:10px;margin:0 -12px;padding:0 12px;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scroll-padding:0 12px;overscroll-behavior-x:contain;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.sc::-webkit-scrollbar{display:none}
.cd{flex:0 0 calc(100% - 22px);scroll-snap-align:start;scroll-snap-stop:always;display:flex;flex-direction:column;min-height:0;background-color:var(--panel);background-image:repeating-linear-gradient(135deg,rgba(225,230,236,.05) 0 1px,transparent 1px 5px);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.ch{flex:0 0 auto;display:flex;justify-content:space-between;align-items:baseline;padding:12px 14px 9px;border-bottom:1px solid var(--line)}
.ch h2{margin:0;font-size:17px;font-weight:800;letter-spacing:.1em;color:var(--yel)}
.ch span{font-size:11px;letter-spacing:.1em;color:var(--mute);font-variant-numeric:tabular-nums}
.cb{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior-y:contain;padding:12px 14px 24px;font-size:14px;line-height:1.42;scrollbar-width:none;-webkit-mask-image:linear-gradient(#000 calc(100% - 20px),transparent);mask-image:linear-gradient(#000 calc(100% - 20px),transparent)}
.cb::-webkit-scrollbar{display:none}
.it{margin:0 0 11px;padding-left:10px;border-left:2px solid var(--line);color:#c4c9cf}
.it b{color:var(--acc);font-weight:700}
.sb{margin:7px 0 0}
.sb .it{margin:0 0 7px;font-size:13px}
kbd{display:inline-block;padding:0 5px;margin:0 1px;border:1px solid #4a4f56;border-radius:4px;background:var(--key);color:var(--acc);font:600 11px/17px system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;vertical-align:1px}
.tbl{margin:0 0 12px}
.tbl h4{margin:0 0 4px;font-size:11px;font-weight:700;letter-spacing:.14em;color:var(--mute)}
.tr{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px dashed var(--line);color:#c4c9cf}
.tr span:last-child{color:var(--acc);font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.mt{flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;color:var(--mute);font-size:12px;letter-spacing:.16em}
.gdots{flex:0 0 auto;display:flex;justify-content:center;gap:7px;padding:12px 0 10px}
.gdot{position:relative;width:7px;height:7px;padding:0;border:0;border-radius:4px;background:var(--line);appearance:none;-webkit-appearance:none;cursor:pointer;touch-action:manipulation;transition:width .2s,background-color .2s}
.gdot::after{content:"";position:absolute;inset:-10px -3px}
.gdot.on{width:18px;background:var(--acc)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ===== Artillery (scoped) ===== */
#v-art{--bg:#000;--panel:#0b0303;--ink:#ff6b5c;--mute:#a1443a;--line:#3a0f0b;--key:#150504;--keyh:#2b0a07;--acc:#ff3b2f;--chip:#1c0705;--chipon:#ff3b2f;--chipink:#1a0302;--fire:#d6291a;--fireh:#a01a0f;
}
#v-art .app{max-width:420px;margin:0 auto;padding:0 12px 84px;display:flex;flex-direction:column;gap:10px;min-height:100%;box-sizing:border-box}
#v-art .top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:8px 0 2px;display:flex;flex-direction:column;gap:6px}
#v-art .tabs{position:relative;display:grid;grid-template-columns:repeat(2,1fr);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:3px}
#v-art .ind{position:absolute;top:3px;bottom:3px;left:3px;width:calc((100% - 6px)/2);background:var(--acc);border-radius:9px;transform:translateX(calc(var(--i,0)*100%));transition:transform .3s cubic-bezier(.4,0,.2,1)}
#v-art .tab{position:relative;z-index:1;border:0;background:none;color:var(--mute);padding:9px 0;font-size:11px;font-weight:700;letter-spacing:.06em;cursor:pointer;touch-action:manipulation;transition:color .25s}
#v-art .tab.on{color:var(--chipink)}
#v-art .panel{display:none;flex-direction:column;gap:10px}
#v-art .panel.show{display:flex;flex:1;animation:a-in .25s ease}
@keyframes a-in{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
#v-art .row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
#v-art .chip{flex:1;min-width:0;padding:8px 4px;border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:8px;font-size:12px;font-weight:600;touch-action:manipulation;cursor:pointer;transition:background .2s,color .2s,transform .1s}
#v-art .chip.on{background:var(--chipon);color:var(--chipink);border-color:var(--chipon)}
#v-art .chip:active{opacity:.75}
#v-art .fac .chip{padding:11px 4px;font-size:13px}
#v-art .th{flex:0 0 auto;padding:6px 10px;font-size:11px;letter-spacing:.08em}
#v-art .hd{position:relative;display:flex;justify-content:center;align-items:center}
#v-art h1{font-family:"Black Ops One",Impact,"Arial Black","Arial Narrow",sans-serif;font-size:22px;letter-spacing:.06em;margin:0;font-weight:400;text-transform:uppercase}
#v-art .tools .chip{padding:10px 4px;font-size:12px}
#v-art .hb{flex:1.6}
#v-art .disp{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;transition:border-color .3s}
#v-art .disp.spa{border-color:var(--acc)}
#v-art .k{font-size:11px;letter-spacing:.1em;color:var(--mute)}
#v-art .v{font-variant-numeric:tabular-nums;font-weight:700;line-height:1.05}
#v-art .dist{font-size:40px}
#v-art .adj{font-size:30px}
#v-art .mil{font-size:64px;color:var(--acc)}
#v-art .hint{font-size:12px;color:var(--mute);text-align:right}
#v-art .kr{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
#v-art .hint.err{color:var(--fire)}
#v-art .dist.bad,#v-art .mil.bad{color:var(--fire)}
#v-art .mil{transform-origin:left center}
#v-art .mil.pulse{animation:a-pulse .35s ease}
@keyframes a-pulse{0%{transform:scale(1)}40%{transform:scale(1.08)}100%{transform:scale(1)}}
#v-art .disp{background-image:repeating-linear-gradient(135deg,rgba(128,128,100,.07) 0 1px,transparent 1px 5px),radial-gradient(circle at 15% 25%,rgba(110,130,60,.10),transparent 45%),radial-gradient(circle at 85% 80%,rgba(110,130,60,.08),transparent 40%)}
#v-art .fld{border-radius:8px;padding:0 6px;margin:0 -6px;border:2px solid transparent;cursor:pointer}
#v-art .fld.on{border-color:var(--acc)}
#v-art .adjrow{display:flex;gap:8px;align-items:center;margin-top:4px}
#v-art .adjrow .fld{flex:1}
#v-art .sign{flex:0 0 64px;padding:10px 0}
#v-art .pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
#v-art .key{height:62px;border:1px solid var(--line);background:var(--key);color:var(--ink);border-radius:10px;font-size:26px;font-weight:600;touch-action:manipulation;cursor:pointer}
#v-art .key:active{background:var(--keyh)}
#v-art .key.sm{font-size:16px;color:var(--mute)}
#v-art .key.dl{font-size:22px;color:var(--mute)}
#v-art .key.nx{color:var(--acc);font-weight:800}
#v-art .last{display:block;width:100%;margin-top:10px;padding:8px 6px;font-size:13px;color:var(--mute);background:transparent;border:1px dashed var(--line);border-radius:8px;font-family:inherit;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#v-art .last:disabled{cursor:default;opacity:.75}
#v-art .last[hidden]{display:none}
#v-art .key.fk{background:var(--fire);border:2px solid var(--fireh);color:#fff;font-size:20px;font-weight:800;letter-spacing:.12em;box-shadow:inset 0 -5px 0 var(--fireh)}
#v-art .key.fk:active{background:var(--fireh)}
#v-art .fire{height:52px;border:0;border-radius:10px;background:var(--fire);color:#fff;font-size:22px;font-weight:800;letter-spacing:.2em;touch-action:manipulation;cursor:pointer}
#v-art .fire:active{background:var(--fireh);transform:scale(.99)}
#v-art .hist{display:flex;flex-direction:column;gap:4px}
#v-art .hh{font-size:12px;letter-spacing:.1em;color:var(--mute);margin:2px 0}
#v-art .hrow{display:flex;justify-content:space-between;align-items:center;width:100%;padding:10px 12px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;font-size:15px;font-variant-numeric:tabular-nums;cursor:pointer;touch-action:manipulation}
#v-art .hrow span:last-child{color:var(--mute)}
#v-art .hrow:active{background:var(--keyh)}
#v-art .note{font-size:11px;color:var(--mute);text-align:center;margin-top:auto}
#v-art .vbar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--bg);border-top:1px solid var(--line);padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px))}
#v-art .vin{max-width:420px;margin:0 auto;display:flex;gap:8px;align-items:center}
#v-art .vbtn{flex:0 0 auto;min-width:110px;height:48px;border:0;border-radius:10px;background:var(--acc);color:var(--chipink);font-size:15px;font-weight:800;letter-spacing:.12em;cursor:pointer;touch-action:manipulation}
#v-art .vbtn.on{background:var(--fire);color:#fff}
#v-art .heard{flex:1;min-width:0;font-size:12px;color:var(--mute);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
#v-art .heard.err{color:var(--fire)}
#v-art .vr{flex:0 0 auto;padding:10px 8px;font-size:11px}
#v-art .panel.show[data-dir="r"]{animation:a-inR .3s cubic-bezier(.2,.8,.2,1)}
#v-art .panel.show[data-dir="l"]{animation:a-inL .3s cubic-bezier(.2,.8,.2,1)}
@keyframes a-inR{from{opacity:0;transform:translateX(48px)}to{opacity:1;transform:none}}
@keyframes a-inL{from{opacity:0;transform:translateX(-48px)}to{opacity:1;transform:none}}
#v-art .od{display:inline-block;height:1.05em;overflow:hidden;vertical-align:top}
#v-art .dg{display:block;transition:transform .3s cubic-bezier(.2,.9,.25,1);will-change:transform}
#v-art .dg i{display:block;font-style:normal;height:1.05em;line-height:1.05em}
#v-art .key.fk.boom{animation:a-shake .3s linear}
@keyframes a-shake{0%{transform:translate(0,0);filter:brightness(1.9)}10%{transform:translate(-8px,4px) rotate(-5deg)}22%{transform:translate(8px,-6px) rotate(5deg)}34%{transform:translate(-7px,-4px) rotate(-4deg)}46%{transform:translate(7px,4px) rotate(4deg)}58%{transform:translate(-5px,3px) rotate(-3deg)}72%{transform:translate(4px,-2px) rotate(2deg)}86%{transform:translate(-2px,1px) rotate(-1deg)}100%{transform:translate(0,0);filter:none}}
#v-art .disp{background-image:repeating-linear-gradient(135deg,rgba(255,60,40,.06) 0 1px,transparent 1px 5px)}
#v-art .rm{height:6px;border-radius:3px;background:var(--line);margin-top:6px;overflow:hidden}
#v-art .rm i{display:block;height:100%;width:0;background:var(--acc);border-radius:3px;transition:width .3s ease,background .2s}
#v-art .rm.bad i{background:var(--fire)}
#v-art .app{flex:1 1 auto;min-height:0;width:100%;box-sizing:border-box;padding:0 12px 6px;gap:8px;overflow-x:hidden;overflow-y:auto}
#v-art .top{position:static;padding:6px 0 0}
#v-art .panel{gap:8px}
#v-art .panel.show{min-height:0}
#v-art .pad{flex:1 1 auto;min-height:208px;max-height:320px;grid-template-rows:repeat(4,minmax(0,1fr))}
#v-art .key{height:auto;min-height:0}
#v-art .vbar{position:static;flex:0 0 auto;padding:6px 12px}
#v-art .vbtn{height:44px}
#v-art .tools .chip{padding:8px 4px}
#v-art .app{gap:6px;padding:0 12px 4px}
#v-art .panel{gap:6px}
#v-art .top{padding:4px 0 0;gap:4px}
#v-art h1{font-size:20px}
#v-art .tab{padding:7px 0}
#v-art .fac .chip{padding:8px 4px}
#v-art .disp{padding:8px 12px}
#v-art .dist{font-size:34px}
#v-art .adj{font-size:26px}
#v-art .mil{font-size:56px}
#v-art .sign{padding:6px 0}
#v-art .last{margin-top:6px;padding:5px 6px;font-size:12px}
#v-art .pad{min-height:200px}
#v-art .tools .chip{padding:6px 4px}
#v-art .vbar{padding:4px 12px}
#v-art .vbtn{height:40px}
#v-art .vr{padding:8px 8px}
#v-art .key.fk.nx{background:var(--key);border:2px solid var(--acc);color:var(--acc);box-shadow:none}
#v-art .vbtn{touch-action:none;-webkit-touch-callout:none}
#v-art .sub{text-align:center;font-size:11px;letter-spacing:.2em;color:var(--mute)}
@media (prefers-reduced-motion:reduce){#v-art *{transition:none!important;animation:none!important}}
#v-art .fire{margin-top:auto;height:58px}
#v-art .tlk{margin-top:0;width:100%;min-width:0;height:50px;font-size:16px;letter-spacing:.3em;background:var(--key);border:1px solid var(--line);color:var(--ink)}
#v-art .tlk.on{background:var(--acc);border-color:var(--acc);color:var(--chipink)}
#v-art .fire.boom{animation:a-shake .3s linear}
#v-art .arm{display:flex;align-items:center;gap:6px;font-size:11px;letter-spacing:.16em;color:var(--mute)}
#v-art .arm i{width:9px;height:9px;border-radius:50%;background:#4fd45f;box-shadow:0 0 6px #4fd45f;animation:a-slowblink 2.4s ease-in-out infinite}
#v-art .arm.on{color:#ff4a3a}
#v-art .arm.on i{background:#ff3b2f;box-shadow:0 0 8px #ff3b2f}
@keyframes a-slowblink{0%,100%{opacity:1}50%{opacity:.2}}
#v-art .disp{padding:7px 12px}
#v-art .dist{font-size:30px}
#v-art .mil{font-size:50px}
#v-art .rm{margin-top:4px}

#v-art{--yel:#f2c40d;--bg:#000;--panel:#0e0f11;--ink:#dde1e6;--mute:#8e959d;--line:#2b2e33;--key:#18191c;--keyh:#292b30;--acc:#d3d9df;--chip:#1b1d20;--chipon:#d3d9df;--chipink:#0a0a0b;--fire:#c0281e;--fireh:#8f1d16}
#v-art .disp{background-image:repeating-linear-gradient(135deg,rgba(225,230,236,.05) 0 1px,transparent 1px 5px)}

#v-art .disp{display:grid;grid-template-columns:1fr 128px;column-gap:10px;align-items:start}

/* ===== Commander (scoped) ===== */

<script>
const $=id=>document.getElementById(id);
function vib(ms){try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}}

/* ---------- Field guide content (from the HLL New Player Guide, Update 10) ---------- */
const GUIDE=[
{t:"GAME MODES",b:[
["Warfare","Tug of war with no tickets, only territory and a 1 hr 30 min timer. Win by capturing all enemy territory or by holding the majority of sectors when time runs out."],
["The map","A 10x6 or 6x10 grid of 200 m squares, grouped into 5 sectors. Only 2 sectors are active at a time, one on each side; the rest stay locked until the sector beside them is captured."],
["Offensive","One side attacks, the other defends. Defenders win by holding out for the timer (30 min per sector); attackers win by capturing all 5 sectors. Only the active sector's strong point is visible."],
["Attack or defend, not both","A sector lost as a defender can't be retaken. A sector captured as an attacker doesn't need defending."],
["Offensive setup","Defenders get 3 forward garrison spawns in their 4th sector (10 s respawn; destroyed by hand, and you can build another garrison beside one) and start with 250 resources. Attackers start with 500 of each type and need nodes for more. Artillery is for defenders only."],
["Overtime","If attackers are mid-capture when the timer ends and still have manpower, the match runs on until they cap or run out."]
]},
{t:"CAPTURING",b:[
["Strong point","The black striped circle on an active sector. The chevrons beside it show cap strength and only appear while you are standing in it."],
["Cap strength, Warfare","1x players in the active sector plus 3x players in the strong point."],
["Cap strength, Offensive","3x players in the strong point only. Nobody outside it counts."],
["Tiers","Chevrons step up at 1-14, 15-29 and 30+ cap strength."],
["Speed","A cap takes a steady 2 min once you hold the advantage. Adding more soldiers does not make it faster."],
["Read the HUD","Press [[T]]. Capturing means more friendlies than enemies, losing means more enemies, contesting means equal numbers."],
["Balance","All offense leaves you vulnerable, all defense gets you overwhelmed. Check [[M]] to see where you are needed."]
]},
{t:"GETTING IN",b:[
["Find a server","Hit Enlist on the home page. Look for good ping (under 200 ms) and a population between 40 and 97, then pick a nation. Controls are standard FPS; see Options, Keybindings."],
["Join a squad","[[Tab]] opens the player list. Pick a veteran squad leader with a high level, click the join squad arrow, then use squad chat [[C]] to check in and say you're new."],
["First game","Start as a Rifleman."],
["Garrison","40 s spawn, anyone can use it."],
["Outpost","20 s spawn, your squad only."],
["Airhead","30 s spawn, a temporary air-dropped garrison."],
["HQ","10 s spawn. Locked if a nearby point begins to fall."],
["Before you spawn","Take in the game mode and map first, or ask your squad leader where to spawn."]
]},
{t:"STAYING ALIVE",b:[
["Kit","Scroll wheel or [[1]]-[[6]] to select. Grenades: [[LMB]] overhand, [[RMB]] underhand. Heal yourself or a buddy with bandages. Build with your hammer or resupply ammo by dropping your crate."],
["Take it slow","Use cover and concealment, and move with a purpose."],
["Stay with your squad","The green dots. Suppressing fire and movement work in your favor."],
["Check indicators","Look at friendly indicators before engaging a target and use proximity chat [[V]] to talk to nearby soldiers."],
["Ping enemies","[[MMB]] to ping. Fallen comrades in front of you mean the enemy is near."],
["Stay aware","[[T]] shows squad leader marks and strong point status. Check the map [[M]] often."],
["After the battle","Combat efficiency (kills), offensive and defensive score (time in enemy or friendly territory) and support score (supplies, resources, medical aid, spawns). Use the commendation button by a name for 10% extra XP before the timer runs out. Leaving early still keeps the XP you earned."]
]},
{t:"SUPPORT ROLES",b:[
["Medic","Revives fallen teammates. A red syringe means a revive is needed; a red-and-white bandage means a heal is enough. Tell them you're coming with [[V]]. Smoke grenades screen you while you heal. Prioritize squad leaders."],
["Support","Carries supplies for garrisons, resource nodes, defenses and AT guns. Scroll to the supply box (50 resources) and place it with [[LMB]]."],
["Engineer","Builds resource nodes (manpower, munitions, fuel), defenses (barricades, barbed wire) and repair stations. Select the wrench, press [[RMB]], pick the item, then finish the blueprint with a hammer. Repairs friendly armor with the torch and dismantles enemy defenses with the wrench or a satchel."]
]},
{t:"COMBAT ROLES",b:[
["Assault","Close-quarters fighter who clears the way. Screen your advance with smokes."],
["Automatic Rifleman","Mobility plus a high rate of fire, ideal from mid range to close quarters."],
["Machine Gunner","Highest rate of fire and the biggest magazine. Suppress to blur enemy vision. Most accurate with the bipod deployed ([[F]]), hip-fire in close quarters. Don't stay in one spot too long."],
["Anti-Tank","Rockets, AT rifle and/or AT mines. Be patient, stay concealed and hit the weak rear plating. Hide mines in foliage or mud along likely tank routes. You can also place AT gun blueprints, which need supplies and hammers."],
["Ammo","Out of ammo? Check the map [[M]] for ammo and explosives boxes, or ask nearby teammates over [[V]]."]
]},
{t:"SUPPLIES",b:[
["Everything starts with supplies","Supports, supply trucks and airdrops provide them."],
{h:"SOURCES",r:[["Support player","50"],["Airdrop","100"],["Supply truck","150 x2"]]},
{h:"COSTS",r:[["Garrison, blue zone","50"],["Garrison, red zone","100"],["AT gun","50"],["Resource node","50"],["Repair station","100"],["Defensive deployables","10-350"]]},
["Regeneration","Your supplies regenerate after 5 min. Passing through a Manpower Node circle halves the wait."],
["Building","Engineers must be within 50 m of supplies. Nodes can only be built in friendly sectors and are lost with the sector. Garrisons must be 200 m apart."]

{t:"SQUAD LEAD",b:[

["Watch","Your main tool. Scroll to it, face the ground, hold [[RMB]] for the blueprint, scroll between Outpost and Garrison, then [[LMB]] to deploy."],
["Garrison","The whole team can spawn. Needs supplies from your support player and commander. 200 m apart."],
["Outpost","Squad-only spawn. Place it in friendly territory or up to two grid squares into enemy territory. No supplies needed. One every 2 min; the cooldown resets if you dismantle it with [[F]]."],

["Binoculars","Hold [[MMB]] for the Command Wheel, rotate the mouse to pick a mark, then click the map. Your squad cannot see other unit marks, so you must mark them."],

{t:"COMMANDER",b:[
["Garrisons first","Keep at least 3 defensive garrisons around your point. A triangle pattern shows where the enemy push is coming from."],
["Manage the team","Assign squads to attack on a front line, flank or defend. Stay flexible; the enemy is making plans too."],
["Command chat","Keep the channel clear: professional, direct and short."],
["Don't sit in HQ","Build garrisons with your supply drops, hop on an artillery gun or drive a supply truck."],
["Orders","20 orders, each with a cooldown and a cost in manpower, ammunition or fuel. Six to focus on:",[
["Supply Drop","Pick a spot on the map and radio it in."],
["Airhead","A 3 min spawn in a friendly or enemy active sector. Too close to an objective and it gets spotted and destroyed."],
["Recon Run","Fly a recon plane over suspected enemy positions (set the path with [[LMB]]). The map shows them in red."],
["Bombing Run","Same steps as recon to set the attack angle. Tell your team."],
["Spawning Vehicles","Choose a tank from the fuel menu, then one of the three HQ spawns. One tank or truck per HQ at a time."],
["Reinforce","Rally defenders on your active defensive strong point. Each defender counts as two."]
]]

{t:"ARTILLERY",b:[
["Gunner [[F1]]","[[A]] and [[D]] traverse, [[W]] and [[S]] adjust distance, [[LMB]] fires."],
["Loader [[F2]]","Loads the gun and can pivot it ([[A]] and [[D]]) beyond the gunner's limits. [[R]] pulls munitions from the team pool: HE costs 3, smoke costs 5."],
["Flight time","Shells take 24 seconds to land. A hit is signaled with an audio cue."],
["Ranging","Line a map marker up in the center of the gunner's sight and use its distance to range the gun. Convert linear distance to mils with the chart or a calculator (the Artillery tool here)."],
["Good targets","Infantry and trucks. Garrisons and OPs are not destroyed but make target-rich areas. It can damage armor, but other roles handle tanks better. Useless against constructions and nodes."],
["Communicate","Coordinate targets with your team to avoid friendly fire and wasted resources."]
]},
{t:"ARMOR CREW",b:[
["Roles","Driver [[F1]], Gunner [[F2]], Spotter [[F3]]. Press [[F]] to enter and use the function keys to switch. The tank commander is an officer with command chat, so they should take Spotter."],
["Driver","Hold [[E]] to start the engine, [[Shift]] into first gear and gas with [[W]]. When RPM passes 25, shift up and repeat. [[Ctrl]] downshifts to turn, slow or stop. To reverse, be in R, then [[W]]. The coax MG dot (bottom right) shows where rounds land."],
["Gunner","[[R]] reloads; [[1]], [[2]] or [[3]] picks the round. Once loaded, the only way to change type is to fire what is chambered. [[LMB]] fires, wheel zooms, [[A]]/[[D]] traverse, [[W]]/[[S]] elevation."],
["Spotter","360 degree view; wheel zooms. Ping with [[MMB]] and call it out: target type, side (left or right) and exact bearing from your compass."]

{t:"ARMOR COMBAT",b:[

["Ammo","Load AP. HE is only good against soft targets like infantry. Aim for the turret or hull."],
["AT infantry","They are everywhere. Call them out; the commander decides whether to move the tank, the turret or hop out with a pistol or SMG."],
["AT mines","US M1A1, German Tellermine 43, Soviet TM35. Avoid obvious choke points, watch the road, and destroy visible mines with the main gun."],
["Repairs","A crew member with a blowtorch can hop out and repair, but never within range of enemies."]
]},
{t:"RECON",b:[
["Squads","Each team gets 2 two-man Recon squads."],
["Spotter","Short to medium range. Relays information over command chat. A Spotter's OP can go anywhere in enemy territory and is not destroyed when a sector is lost."],
["Sniper","The only scoped rifle in the game. Long range, plus information gathering."],
["Jobs","Hunt enemy spawns (follow movement back to its source, walk the line between sectors, watch for supply drops and airheads), harass or silence artillery, interrupt logistics, coordinate strikes with artillery and relay enemy tank and infantry positions."],
["Remember","Your spawns are at less risk of being taken out. Information is Recon's greatest weapon; share it with your team."]
]},
{t:"COMMUNITY",b:[
["Why join","A regular group of friends, support in your language, organized events (convoys, destruction derby, zombies), competitive play and server whitelisting."],
["Where","The Hell Let Loose Discord (Community Divisions / LFG category, #divisions_recruitment), YouTube and social media, or community servers. Look for clan tags in game and ask."],
["Reddit","r/HellLetLoose for tips, tricks and discussion."],
["Source","Summarized from the HLL New Player Guide, Update 10 (July 2021). Some details may have changed since."]
]}

const fmt=s=>s.replace(/\[\[(.+?)\]\]/g,"<kbd>$1</kbd>").replace(/\*\*(.+?)\*\*/g,"<b>$1</b>");
function itemHTML(x){
  if(x.h){
    return '<div class="tbl"><h4>'+x.h+'</h4>'+x.r.map(r=>'<div class="tr"><span>'+fmt(r[0])+'</span><span>'+fmt(r[1])+'</span></div>').join("")+'</div>';
  }
  let h='<div class="it"><b>'+fmt(x[0])+'.</b> '+fmt(x[1]||"");
  if(x[2])h+='<div class="sb">'+x[2].map(itemHTML).join("")+'</div>';
  return h+'</div>';
}
const sc=$("sc"),dots=$("gdots");
GUIDE.forEach((c,i)=>{
  const d=document.createElement("article");d.className="cd";
  d.innerHTML='<div class="ch"><h2>'+c.t+'</h2><span>'+(i+1)+' / '+GUIDE.length+'</span></div><div class="cb">'+c.b.filter(x=>x.h||x[1]).map(itemHTML).join("")+'</div>';
  sc.appendChild(d);
  const b=document.createElement("button");b.type="button";b.className="gdot";b.setAttribute("aria-label","Go to "+c.t);
  b.addEventListener("click",()=>{vib(8);goCard(i)});
  dots.appendChild(b);
});
function step(){const c=sc.firstElementChild;return c?c.offsetWidth+10:1}
function goCard(i){
  const reduce=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
  sc.scrollTo({left:i*step(),behavior:reduce?"auto":"smooth"});
}
let cur=-1,raf=0;
function sync(){
  raf=0;
  const i=Math.max(0,Math.min(GUIDE.length-1,Math.round(sc.scrollLeft/step())));
  if(i===cur)return;
  if(cur>=0)vib(6);
  cur=i;
  [...dots.children].forEach((d,k)=>d.classList.toggle("on",k===i));
}
sc.addEventListener("scroll",()=>{if(!raf)raf=requestAnimationFrame(sync)},{passive:true});
sync();

/* ---------- Views (no address-bar changes, so it also runs inside sandboxed previews) ---------- */
let pushed=false;
function show(name,dir){
  document.querySelectorAll(".view").forEach(v=>{
    const on=v.id==="v-"+name;
    v.classList.remove("show");
    if(on){v.dataset.dir=dir||"r";void v.offsetWidth;v.classList.add("show")}
  });
  if(name==="guide")sync();
  if(name!=="art"&&window.HLL_ART)window.HLL_ART.hide();
  if(name==="art"){if(!window.HLL_ART)HLL_initArt();window.HLL_ART.show()}
  if(name==="cmd"&&window.HLL_CMD)window.HLL_CMD.show();
}
function openView(name){
  vib(10);
  show(name,"r");
  if(!pushed){try{history.pushState({v:name},"");pushed=true}catch(e){}}
}
function goHome(){
  vib(10);
  if(pushed){pushed=false;try{history.back();return}catch(e){}}
  show("home","l");
}
document.querySelectorAll("[data-go]").forEach(b=>b.addEventListener("click",()=>openView(b.dataset.go)));
document.querySelectorAll("[data-home]").forEach(b=>b.addEventListener("click",goHome));
document.querySelectorAll("[data-home]").forEach(b=>b.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();e.stopPropagation();goHome()}}));
window.addEventListener("popstate",()=>{pushed=false;show("home","l")});
show("home","r");

/* one screen wake lock for the whole app */
let wl=null,wakeFails=0;
async function wake(){try{if(wakeFails<3&&"wakeLock" in navigator&&!wl){wl=await navigator.wakeLock.request("screen");wl.addEventListener("release",()=>{wl=null})}}catch(e){wakeFails++}}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")wake()});
document.addEventListener("pointerdown",()=>{if(!wl)wake()});
wake();

function tapUp(el,fn,tick=true){   // fires on release; ignored when the touch turned into a swipe or was dragged away

    if(e.pointerId!==id)return;

const FLIGHT=24,SETTLE_MS=1000,FX_MS=0; // shell flight time (s), wait before logging a 3-digit 1xx distance

function tpl(cfg){
  const spa=!!cfg.spa;
  let h='<div class="disp'+(spa?' spa':'')+'">'
    +'<div class="kr"><div class="k">DISTANCE (M)</div><div class="arm" data-r="arm"><i></i>ARMED</div></div><div class="v dist'+(spa?' fld':'')+'" data-r="dist">---</div>'+(spa?'':'<div class="rm"><i data-r="rmf"></i></div>');
  if(spa)h+='<div class="k" style="margin-top:4px">TERRAIN ADJUST (MIL)</div><div class="adjrow"><div class="v adj fld" data-r="adj">+0</div><button class="chip sign" data-r="sign">+/&minus;</button></div>';
  h+='<div class="k" style="margin-top:6px">ELEVATION (MIL)</div><div class="v mil" data-r="mil">---</div><button class="last" data-r="last" style="visibility:hidden" disabled>Last shot: ---</button></div>';
  if(cfg.hold){
    h+='<div class="row tools">';
    [-50,-10,10,50].forEach(n=>{h+='<button class="chip nud" data-n="'+n+'">'+(n<0?'&minus;'+(-n):'+'+n)+'</button>'});
    h+='</div>';
  }
  return h;
}

function makeCalc(id,cfg){
  const root=$("p-"+id),spa=!!cfg.spa,P=spa?SPA:GUN,KP="hll."+id+".";
  let digits="",adjD="",adjNeg=false,act="d",prof=Object.keys(P)[0],last=null,logged=false,lt=0;
  const store=(k,v)=>{try{if(v===undefined)return localStorage.getItem(KP+k);localStorage.setItem(KP+k,v)}catch(e){}return null};
  const sp=store("prof");if(sp&&P[sp])prof=sp;
  root.innerHTML=tpl(cfg);
  const g=n=>root.querySelector('[data-r="'+n+'"]');

  const fac=$("fac");
  for(const k in P){
    const b=document.createElement("button");
    b.className="chip";b.innerHTML='<span class="ft"></span>';b.firstChild.textContent=P[k].n;b.dataset.k=k;
    b.addEventListener("click",()=>{prof=k;store("prof",k);render()});
    fac.appendChild(b);
  }
  let ck=null;
  if(spa){
    tap(g("dist"),()=>{act="d";render()});
    tap(g("adj"),()=>{act="a";render()});
    tap(g("sign"),()=>{act="a";adjNeg=!adjNeg;render()});
  }
  if(cfg.hold){
    root.querySelectorAll(".nud").forEach(b=>tap(b,()=>{
      if(!digits)return;
      digits=String(Math.max(1,Math.min(9999,parseInt(digits,10)+parseInt(b.dataset.n,10))));render();
    }));
  }

  /* shot list (page 2): a shot logs itself when its final mil appears, then counts down to impact */
  let shots=[],tm=0;   // shots = rows still in flight; the newest shot sits at the top, older ones below it, empty rectangles last
  const sbox=$("slist"),fdots=document.querySelectorAll('.pgd i[data-k="1"]');
  function makeRow(){
    const row=document.createElement("div"),cell='<div class="sl"><span></span><span></span></div>';
    row.className="sr empty";
    row.innerHTML=cell+'<div class="ov">'+cell+'</div>';
    row._t=[...row.querySelectorAll(".sl span")];      // 0-1 dark layer, 2-3 red filled layer
    row._ov=row.querySelector(".ov");
    row._t[0].textContent="Last shot elevation (mil)";                 // faint placeholders, replaced when a shot takes the top slot
    row._t[1].textContent="---";
    return row;
  }
  function addSlot(){const r=makeRow();sbox.appendChild(r);return r}
  /* mil ladder: round 5 m steps within 100 m of the called distance, plus the called distance itself (highlighted, centred) */
  const LSTEP=5,LSPAN=100;
  let ladCur=null;
  function centerLadder(smooth){
    if(!sbox||!ladCur||!sbox.clientHeight)return;     // hidden view: it is centred again when the page is shown
    const top=Math.max(0,ladCur.offsetTop-(sbox.clientHeight-ladCur.offsetHeight)/2);
    const still=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
    if(smooth&&!still)sbox.scrollTo({top,behavior:"smooth"});else sbox.scrollTop=top;
  }
  function renderLadder(r){
    if(!sbox)return;
    if(r.d===null||r.mil===null){sbox.textContent="";ladCur=null;return}
    const d=r.d,set=new Set([d]);
    for(let x=Math.ceil((d-LSPAN)/LSTEP)*LSTEP;x<=d+LSPAN;x+=LSTEP)set.add(x);
    const list=[...set].filter(x=>milFor(x)!==null).sort((a,b)=>a-b);
    const keep=sbox.scrollTop,had=sbox.children.length>0,frag=document.createDocumentFragment();
    ladCur=null;
    for(const x of list){
      const row=document.createElement("div");row.className="sr lad"+(x===d?" cur":"");
      row.innerHTML='<div class="sl"><span></span><span><b></b><small>(mil)</small></span></div>';
      row.querySelector("span").textContent=x+" m";
      row.querySelector("b").textContent=milFor(x);
      if(x===d)ladCur=row;
      frag.appendChild(row);
    }
    sbox.textContent="";sbox.appendChild(frag);
    sbox.scrollTop=keep;
    centerLadder(had);
  }
  function fillSlots(){centerLadder(false)}
  function placeShot(s){
    const row=makeRow(),t=row._t;
    row.className="sr";
    const dd='<i class="sdist">'+s.d+' m</i>';t[0].innerHTML=t[2].innerHTML="<b>"+s.mil+"</b><small>(mil)</small>"+dd;   // number, then (mil), on the left
    const atTop=sbox.scrollTop<=2;                         // at the top: the newest shot stays in view; scrolled down: keep your place
    sbox.insertBefore(row,sbox.firstChild);
    sbox.scrollTop=atTop?0:sbox.scrollTop+row.offsetHeight+parseFloat(getComputedStyle(sbox).rowGap||0);
    while(sbox.children.length>7)sbox.removeChild(sbox.lastChild);   // the last seven shots are kept; the list scrolls
    s.t=t;s.ov=row._ov;s.row=row;
  }
  function renderShots(){
    const now=Date.now();
    let hitNow=false;
    for(const s of shots){
      const el=(now-s.at)/1000,rem=FLIGHT-el;
      if(rem>0){
        const x=rem.toFixed(1)+" s";
        s.t[1].textContent=s.t[3].textContent=x;
        s.ov.style.clipPath="inset(0 "+(100-el/FLIGHT*100).toFixed(2)+"% 0 0)";
      }else{
        s.t[1].textContent=s.t[3].textContent="IMPACT";
        s.row.className="sr hit shake";s.done=true;hitNow=true;{const rw=s.row;setTimeout(()=>rw.classList.remove("shake"),800)}
      }
    }
    shots=shots.filter(s=>!s.done);
    if(hitNow){vib([70,50,70]);fdots.forEach(d=>{d.classList.remove("shake");void d.offsetWidth;d.classList.add("shake");setTimeout(()=>d.classList.remove("shake"),800)})}
    fdots.forEach(d=>d.classList.toggle("fly",shots.length>0));
    if(!shots.length&&tm){clearInterval(tm);tm=0}
  }
  addEventListener("resize",fillSlots);
  addEventListener("load",fillSlots);

  g("last").onclick=()=>undo();
  {const card=root.querySelector(".disp"),chip=document.getElementById("aflag");let sid=null,sx=0,sy=0;
   card.addEventListener("pointerdown",e=>{if(e.pointerType==="mouse"&&e.button>0)return;sid=e.pointerId;sx=e.clientX;sy=e.clientY});
   card.addEventListener("pointerup",e=>{
     if(e.pointerId!==sid)return;sid=null;
     const dx=e.clientX-sx,dy=e.clientY-sy;
     if(Math.abs(dx)<40||Math.abs(dx)<Math.abs(dy)*1.5)return;
     const ks=Object.keys(P),n=(ks.indexOf(prof)+(dx<0?1:-1)+ks.length)%ks.length;
     prof=ks[n];store("prof",prof);render();
     chip.classList.remove("swl","swr");void chip.offsetWidth;chip.classList.add(dx<0?"swl":"swr");
   });
   card.addEventListener("pointercancel",()=>{sid=null});}
  const getF=()=>act==="a"?adjD:digits;
  const setF=v=>{if(act==="a")adjD=v;else digits=v};
  function press(c){
    clearTimeout(lt);clearTimeout(fxT);
    if(logged&&!spa){digits="";logged=false}
    const v=getF();
    if(v.length>=4)return;
    setF(v==="0"?c:v+c);
    if(act==="a"&&parseInt(adjD,10)>1000)adjD="1000";
    if(spa&&act==="d"&&digits.length>=4)act="a";
    render();
    settle();
  }
  function clear(){clearTimeout(lt);clearTimeout(fxT);logged=false;digits="";adjD="";adjNeg=false;act="d";render()}
  function back(){clearTimeout(lt);clearTimeout(fxT);logged=false;digits=digits.slice(0,-1);render()}
  const adjVal=()=>Math.max(-1000,Math.min(1000,(adjNeg?-1:1)*(parseInt(adjD,10)||0)));
  function milFor(d){
    if(spa){if(d<=0)return null;const m=Math.round(P[prof].f(d)-adjVal());return m<0?null:m}
    if(d<100||d>1600)return null;
    return Math.round(P[prof].f(d));
  }
  function calc(){
    const d=parseInt(digits,10),rng="Range 100\u20131600 m";
    if(!digits||isNaN(d))return{d:null,mil:null,msg:spa?"":rng};
    const mil=milFor(d);
    if(mil===null){
      if(spa&&d<=0)return{d,mil:null,msg:""};
      return{d,mil:null,msg:spa?"Out of range for this SPA":"Out of range (100\u20131600 m)",err:1};
    }
    return{d,mil,msg:spa?"":rng};
  }
  function render(){
    {const fb=document.getElementById("aflag");if(fb&&fb.dataset.k!==prof){fb.dataset.k=prof;fb.innerHTML=FLAGS[prof]||""}}
    document.querySelectorAll("#fac .chip").forEach(c=>c.classList.toggle("on",c.dataset.k===prof));
    const r=calc();
    g("dist").textContent=r.d===null?"---":r.d;
    g("dist").classList.toggle("bad",!!r.err);
    if(!spa){
      const f=g("rmf");
      f.style.width=(r.d===null?0:r.err?(r.d>1600?100:4):Math.max(2,(r.d-100)/15))+"%";
      f.parentNode.classList.toggle("bad",!!r.err);
    }
    setOdo(g("mil"),r.mil===null?null:String(r.mil));
    g("mil").classList.toggle("bad",!!r.err);
    g("arm").classList.toggle("on",!!digits);
    if(spa){g("adj").textContent=(adjNeg?"\u2212":"+")+(adjD||"0");g("adj").classList.toggle("on",act==="a")}
    if(ck){const nx=spa&&act==="d"&&!!digits;ck.textContent=nx?"NEXT":"FIRE";ck.classList.toggle("nx",nx)}
    const lb=g("last");
    if(last){lb.disabled=false;lb.textContent="Last shot: "+last.d+" m \u2192 "+last.mil+" mil"+(spa&&last.adjD?" ("+(last.adjNeg?"\u2212":"+")+last.adjD+")":"")+" - tap to restore"}
    else{lb.disabled=true;lb.textContent="Last shot: ---"}
    lb.style.visibility=last?"visible":"hidden";
    renderLadder(r);
  }
  function logNow(hd){
    const r=calc();
    if(r.mil===null||logged)return;
    logged=true;
    last={d:r.d,mil:r.mil,prof,adjD,adjNeg};
    explode(hd);
    speak(String(r.mil).split("").join(" "));
  }
  // log as soon as the elevation is final: 3 digits not starting with 1, or 4 digits, are final at once;
  // a 3-digit 1xx waits briefly in case a 4th digit follows (1000-1600 m)
  function settle(now){
    clearTimeout(lt);
    if(spa||logged)return;
    const r=calc();
    if(r.mil===null)return;
    if(!now&&digits.length===3&&digits[0]==="1")lt=setTimeout(logNow,SETTLE_MS);
    else logNow(FX_MS);
  }
  function fire(){logNow()}
  function undo(){
    if(!last)return;
    prof=last.prof;digits=String(last.d);adjD=last.adjD;adjNeg=last.adjNeg;act="d";render();
  }
  render();fillSlots();renderShots();
  return{press,fire,back,clear,fill:fillSlots,
    next:()=>{if(spa){act=act==="d"?"a":"d";render()}},
    setDist:n=>{clearTimeout(lt);logged=false;digits=String(Math.min(9999,Math.max(0,n)));render();settle(true)},
    setAdj:(n,sg)=>{if(!spa)return;adjD=String(Math.min(1000,n));adjNeg=sg<0;render()},
    undo,lastMil:()=>last?last.mil:calc().mil,
    mil:()=>calc().mil};
}

/* ---------- spoken distance parsing ---------- */
/*PARSE-START*/
const NW={zero:0,oh:0,o:0,naught:0,nought:0,one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,niner:9,fife:5,tree:3,ten:10,eleven:11,twelve:12,thirteen:13,fourteen:14,fifteen:15,sixteen:16,seventeen:17,eighteen:18,nineteen:19,twenty:20,thirty:30,forty:40,fourty:40,fifty:50,sixty:60,seventy:70,eighty:80,ninety:90};
const HOM={won:1,wan:1,to:2,too:2,tu:2,free:3,for:4,fore:4,ate:8};   // sound-alikes the recogniser may write for a leading digit ("for fifty" = 450)
function norm(t){return String(t).toLowerCase().replace(/(\d),(?=\d{3}(?!\d))/g,"$1").replace(/[-‐-―]/g," ")}
function items(s,hom){
  const out=[];let lead=true;          // sound-alike words only count before the number starts, never after it ("... to the left")
  for(const t of s.match(/\d+|[a-z]+/g)||[]){
    if(/^\d+$/.test(t)){
      lead=false;
      if(t.length>1&&t[0]==="0")for(const c of t)out.push({v:+c,g:c});   // "05" = oh five
      else out.push({v:parseInt(t,10),g:t});
      continue;
    }
    if(t==="hundred"||t==="hundreds"){lead=false;out.push({h:1});continue}
    if(t==="thousand"||t==="grand"){lead=false;out.push({k:1});continue}
    let v=NW[t];
    if(v===undefined&&hom&&lead)v=HOM[t];
    if(v!==undefined){lead=false;out.push({v,g:String(v),w:1})}
  }
  return out;
}
// number pieces -> digit strings; a tens word followed by a single digit is one piece ("fifty five" = 55)
function groups(it){
  const gs=[];
  for(let i=0;i<it.length;i++){
    const x=it[i];
    if(x.v===undefined)continue;
    if(x.w&&x.v>=20&&x.v<100&&x.v%10===0){
      const y=it[i+1];
      if(y&&y.v!==undefined&&y.v>=1&&y.v<=9&&(y.w||y.g.length===1)){gs.push(String(x.v+y.v));i++;continue}
    }
    gs.push(x.g);
  }
  return gs;
}
const small=a=>{const g=groups(a);return g.length?parseInt(g.join(""),10):0};
function combine(it){
  if(!it.some(x=>x.v!==undefined||x.h||x.k))return null;
  let n;
  if(it.some(x=>x.h||x.k)){
    // "[one] thousand [four] hundred [and] [fifty]", also "fourteen hundred fifty" and "a hundred"
    let rest=it,tot=0;
    const ki=rest.findIndex(x=>x.k);
    if(ki>=0){const l=rest.slice(0,ki).filter(x=>x.v!==undefined);tot+=1000*(l.length?small(l):1);rest=rest.slice(ki+1)}
    const hi=rest.findIndex(x=>x.h);
    if(hi>=0){const l=rest.slice(0,hi).filter(x=>x.v!==undefined);tot+=100*(l.length?small(l):1);rest=rest.slice(hi+1)}
    n=tot+small(rest);
  }else n=parseInt(groups(it).join(""),10);   // spoken in pieces: "four fifty", "fourteen fifty", "eleven oh five", "one four five zero", "11:10"
  return isFinite(n)?n:null;
}
function parseNum(t){
  const s=norm(t),ok=n=>n!==null&&n>=100&&n<=1600;
  const strict=items(s,false),hom=items(s,true);
  const a=combine(strict);
  const used=hom.length!==strict.length||hom.some((x,i)=>x.v!==strict[i].v);
  const b=used?combine(hom):null;                 // only when a sound-alike word was really read as a digit
  if(ok(b))return b;                              // "for hundred" = 400 beats the bare "hundred" = 100
  if(ok(a))return a;
  const d=strict.find(x=>x.g&&/^\d+$/.test(x.g)&&x.v>=100&&x.v<=1600);   // last resort: a plain 100-1600 figure anywhere in the sentence
  if(d)return d.v;
  return a!==null?a:b;
}
/*PARSE-END*/

/* ---------- output: the elevation is always read aloud (mute the phone to silence it) ---------- */
function say(t,err){}   // no on-screen text and no buzz: the lit TALK button is the only feedback
function speak(t){
  try{
    if(!("speechSynthesis" in window))return;
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=1.05;
    speechSynthesis.speak(u);
  }catch(e){}
}
function stopSpeak(){try{"speechSynthesis" in window&&speechSynthesis.cancel()}catch(e){}}

/* ---------- apply a spoken answer ---------- */
function applyVoice(txt){
  const s=norm(txt),C=CALC[cur];
  if(/\b(clear|cancel|reset)\b/.test(s)){C.clear();say("Cleared");return}
  const n=parseNum(txt);
  if(n===null){say("No number heard: \u201c"+txt+"\u201d",1);return}
  if(n>9999){say(n+" m is out of range",1);return}
  C.setDist(n);
  const m=C.mil();
  if(m===null){say(n+" m - out of range (100\u20131600 m)",1);return}
  say(n+" m \u2192 "+m+" mil");
}

/* ---------- hold-to-talk ---------- */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const talk=$("talk");
let rec=null,busy=false,holding=false,txt="",verr="",fatal=false,tries=0,tail=0;

function begin(){
  const me=new SR();rec=me;busy=true;
  me.lang="en-US";me.continuous=false;me.interimResults=true;me.maxAlternatives=1;
  me.onstart=()=>{if(rec===me&&holding&&!txt)say("Listening...")};
  me.onresult=e=>{
    if(rec!==me)return;
    let t="";
    for(let i=0;i<e.results.length;i++)t+=" "+e.results[i][0].transcript;
    txt=t.trim();
    say(txt);
  };
  me.onerror=e=>{
    if(rec!==me)return;
    const c=e.error;
    if(c==="not-allowed"||c==="service-not-allowed"){verr="Microphone blocked. Allow mic access for this app.";fatal=true}
    else if(c==="audio-capture"){verr="No microphone found.";fatal=true}
    else if(c==="network"){verr="Voice needs an internet connection.";fatal=true}
    if(verr)say(verr,1);
  };
  me.onend=()=>{
    if(rec!==me)return;
    busy=false;
    if(holding){
      // recognizer stopped on its own (silence) while the button is still held
      if(!txt&&!fatal&&tries<2){tries++;begin()}
      return;
    }
    finish();
  };
  try{me.start()}catch(e){busy=false;verr="Voice failed to start.";fatal=true;say(verr,1)}
}
function finish(){
  talk.classList.remove("on");
  const t=txt.trim();txt="";
  if(t){applyVoice(t);verr="";return}
  if(!verr)say("Nothing heard",1);
  verr="";
}
function pressTalk(e){
  if(e.button>0)return;
  e.preventDefault();
  if(holding)return;
  if(!SR){say("Voice input is not supported in this browser.",1);return}
  clearTimeout(tail);clearTimeout(fxT);
  stopSpeak();
  if(rec&&busy){const o=rec;rec=null;busy=false;try{o.abort()}catch(x){}}
  holding=true;txt="";verr="";fatal=false;tries=0;
  try{talk.setPointerCapture(e.pointerId)}catch(x){}
  talk.classList.add("on");
  say("Listening...");
  begin();
}
function release(){
  if(!holding)return;
  holding=false;
  if(busy){
    // short tail so the last word is not clipped, then let onend apply the answer
    const me=rec;
    tail=setTimeout(()=>{try{me.stop()}catch(x){}},180);
  }else finish();
}
if(talk){
  talk.addEventListener("pointerdown",pressTalk);
  ["pointerup","pointercancel","lostpointercapture"].forEach(ev=>talk.addEventListener(ev,release));
  talk.addEventListener("contextmenu",e=>e.preventDefault());
  talk.addEventListener("touchstart",e=>e.preventDefault(),{passive:false});   // no native long-press gesture, so no system haptic
  talk.addEventListener("selectstart",e=>e.preventDefault());
}

window.HLL_ART={show:function(){try{CALC.stat.fill()}catch(e){}},hide:function(){try{release();stopSpeak()}catch(e){}}};

}
</script>
<script>
(function(){

const $=id=>document.getElementById(id);
/* Names, costs and cooldowns (seconds) as given from in-game info. cd = cooldown, du = effect duration, pre = lead time in seconds before the effect (pl = label while counting, pd = label after, pt = seconds to show pd, blank = rest of cooldown). Edit the numbers below if the game changes them. */
const CATS=[
 {k:"man",n:"MANPOWER",items:[
  {id:"airhead",n:"ESTABLISH AIRHEAD",c:"400 MAN",cd:600,pre:90,pl:"SPAWN IN",pd:"SPAWN AVAILABLE"},
  {id:"reinf",n:"REINFORCE",c:"200 MAN",cd:300,du:120},
  {id:"gen",n:"GENERATE RESOURCE",c:"100 → 60",cd:300},
  {id:"dism",n:"DISMANTLE GARRISON",c:"100 MAN",cd:300},
  {id:"enc",n:"ENCOURAGE",c:"400 MAN",cd:600,du:300}]},
 {k:"mun",n:"MUNITIONS",items:[
  {id:"supply",n:"SUPPLY DROP",c:"50 MUN",cd:120,pre:50,pl:"LANDS IN",pd:"LANDED",pt:10},
  {id:"recon",n:"RECON PLANE",c:"150 MUN",cd:300},
  {id:"straf",n:"STRAFING RUN",c:"150 MUN",cd:240},
  {id:"bomb",n:"BOMBING / KATYUSHA",c:"300 MUN",cd:600,pre:30,pl:"HITS IN",pd:"IMPACT",pt:10},
  {id:"prec",n:"PRECISION STRIKE",c:"250 MUN",cd:1200},
  {id:"ammo",n:"AMMO DROP",c:"250 MUN",cd:300}]},
 {k:"fuel",n:"FUEL",items:[
  {id:"stk",n:"SUPPLY TRUCK",c:"100 FUEL",cd:90,pg:0},
  {id:"ttk",n:"TRANSPORT TRUCK",c:"100 FUEL",cd:90,pg:0},
  {id:"jeep",n:"JEEP",c:"80 FUEL",cd:300,pg:0},
  {id:"half",n:"HALF-TRACK",c:"300 FUEL",cd:300,pg:0},
  {id:"hvy",n:"HEAVY TANK",c:"500-600 FUEL",cd:300,pg:1},
  {id:"med",n:"MEDIUM TANK",c:"350-400 FUEL",cd:300,pg:1},
  {id:"lgt",n:"LIGHT TANK",c:"100-200 FUEL",cd:90,pg:1},
  {id:"rcn",n:"RECON VEHICLE",c:"100-200 FUEL",cd:90,pg:1}]}
];
const ALL=[];CATS.forEach(c=>c.items.forEach(a=>{a.cat=c.k;ALL.push(a)}));
const LS="hll.cmd2.";
const ld=(k,d)=>{try{const v=localStorage.getItem(LS+k);return v===null?d:JSON.parse(v)}catch(e){return d}};
const sv=(k,v)=>{try{localStorage.setItem(LS+k,JSON.stringify(v))}catch(e){}};
let cds={},ends=ld("ends",{}),cat=ld("cat",CATS[0].k);
if(!CATS.some(c=>c.k===cat))cat=CATS[0].k;
ALL.forEach(a=>{cds[a.id]=a.cd});
const fmt=s=>{s=Math.max(0,Math.ceil(s));return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")};
const rem=a=>Math.max(0,((ends[a.id]||0)-Date.now())/1000);

/* feedback */
function vib(ms){try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}}
let AC=null;
function initAudio(){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==="suspended")AC.resume()}catch(e){}}
function beep(f,d){try{if(!AC)return;const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f;g.gain.value=.12;o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d/1000)}catch(e){}}
document.addEventListener("pointerdown",()=>{initAudio()});

/* category chips */
const CB={};
CATS.forEach(c=>{
  const b=document.createElement("button");b.className="chip";
  b.innerHTML='<span></span><span class="bd"></span>';
  b.firstChild.textContent=c.n;
  b.onclick=()=>goCat(c.k);
  $("cats").appendChild(b);CB[c.k]={b,bd:b.querySelector(".bd")};
});

/* tiles (only the current category is in the DOM; state lives in ends/cds) */
let T={},PAGES=[],curPage=0,lock=false,lockT=0;   // PAGES: one entry per page, in swipe order
function build(){
  $("grid").textContent="";T={};PAGES=[];
  CATS.forEach(c=>{
  const pages=[];c.items.forEach(a=>{const i=a.pg||0;(pages[i]=pages[i]||[]).push(a)});
  pages.forEach((list,pi)=>{
  PAGES.push({cat:c.k,i:pi});
  const pg=document.createElement("div");pg.className="pg";$("grid").appendChild(pg);
  const n=list.length,rows=Math.ceil(n/2);
  pg.style.gridTemplateRows=n%2?"repeat("+(rows-1)+",minmax(0,1fr)) minmax(0,.62fr)":"";
  list.forEach(a=>{
    const b=document.createElement("button");
    b.className="tile ready"+(n%2&&a===list[n-1]?" wide":"");
    b.innerHTML='<div><div class="nm"></div><div class="cs"></div></div><div class="tm"></div><div class="st"><i></i><span></span></div>';
    b.querySelector(".nm").textContent=a.n;
    b.querySelector(".cs").textContent=a.c;
    pg.appendChild(b);
    T[a.id]={b,tm:b.querySelector(".tm"),st:b.querySelector(".st span")};
    let hold=0,held=false;
    b.addEventListener("pointerdown",e=>{
      held=false;clearTimeout(hold);
      if(rem(a)>0)hold=setTimeout(()=>{held=true;ends[a.id]=0;sv("ends",ends);vib([12,30,12]);beep(660,90);draw()},700);
    });
    const stop=()=>clearTimeout(hold);
    b.addEventListener("pointerup",stop);b.addEventListener("pointercancel",stop);b.addEventListener("pointerleave",stop);
    b.addEventListener("click",e=>{
      if(held){held=false;return}
      if(rem(a)>0)return;
      ends[a.id]=Date.now()+cds[a.id]*1000;sv("ends",ends);
      b.classList.remove("boom");void b.offsetWidth;b.classList.add("boom");
      vib(18);beep(880,90);draw();
    });
    b.addEventListener("contextmenu",e=>e.preventDefault());
  });
  });
  });
  curPage=Math.max(0,PAGES.findIndex(p=>p.cat===cat));
  buildDots();
  draw();
}
function buildDots(){
  const d=$("cdots");d.textContent="";
  const base=PAGES.findIndex(p=>p.cat===cat),n=PAGES.filter(p=>p.cat===cat).length;
  if(n<2)return;
  for(let k=0;k<n;k++){
    const b=document.createElement("button");b.innerHTML="<i></i>";
    b.onclick=()=>toPage(base+k);
    d.appendChild(b);
  }
  paintDots();
}
function paintDots(){
  const k=PAGES[curPage]?PAGES[curPage].i:0;
  [...$("cdots").querySelectorAll("i")].forEach((x,n)=>x.classList.toggle("on",n===k));
}
/* scroll to a page; while we drive the scroll ourselves the chips are not re-read from the scroll position */
function toPage(i,instant){
  const g=$("grid");
  lock=true;clearTimeout(lockT);lockT=setTimeout(()=>{lock=false},instant?0:700);
  g.scrollTo({left:i*(g.clientWidth+12),behavior:instant?"auto":"smooth"});
}
function goCat(k){
  const first=PAGES.findIndex(p=>p.cat===k);
  if(first<0)return;
  curPage=first;
  if(k!==cat){cat=k;sv("cat",cat);buildDots();draw()}
  toPage(first);
}
/* the page in view decides the category: chips and dots follow the swipe */
function onScroll(){
  const g=$("grid"),w=g.clientWidth;if(!w)return;
  const i=Math.max(0,Math.min(PAGES.length-1,Math.round(g.scrollLeft/(w+12))));
  if(i===curPage)return;
  curPage=i;
  if(PAGES[i].cat!==cat){cat=PAGES[i].cat;sv("cat",cat);buildDots();draw()}
  else paintDots();
}
$("grid").addEventListener("scroll",()=>{
  if(lock){clearTimeout(lockT);lockT=setTimeout(()=>{lock=false;onScroll()},140);return}
  onScroll();
},{passive:true});
window.addEventListener("resize",()=>{try{toPage(curPage,true)}catch(e){}});

const was={},wasPre={};
const chime=()=>{beep(784,110);setTimeout(()=>beep(1175,170),130)};
const isPreNow=(a,r)=>r>0&&a.pre&&(cds[a.id]-r)<a.pre;
function draw(){
  const counts={};
  ALL.forEach(a=>{
    const r=rem(a),isR=r<=0;
    if(!isR)counts[a.cat]=(counts[a.cat]||0)+1;
    const pn=isPreNow(a,r);
    if(wasPre[a.id]&&!pn&&!isR){vib([20,40,20,40,20]);beep(988,90);setTimeout(()=>beep(988,90),160)}
    wasPre[a.id]=!!pn;
    if(was[a.id]&&isR){vib([25,50,25]);chime();const t=T[a.id];if(t){t.b.classList.remove("pop");void t.b.offsetWidth;t.b.classList.add("pop")}}
    was[a.id]=!isR;
  });
  CATS.forEach(c=>{
    CB[c.k].b.classList.toggle("on",c.k===cat);
    const n=counts[c.k]||0;
    CB[c.k].bd.textContent=n;CB[c.k].bd.classList.toggle("show",n>0);
  });
  ALL.forEach(a=>{
    const t=T[a.id];if(!t)return;
    const r=rem(a),isR=r<=0;
    const elapsed=cds[a.id]-r,pre=!isR&&a.pre&&elapsed<a.pre,spawn=!isR&&a.pre&&elapsed>=a.pre&&(a.pt===undefined||elapsed<a.pre+a.pt),active=pre||spawn||(!isR&&a.du&&elapsed<a.du);
    t.b.classList.toggle("ready",isR);
    t.b.classList.toggle("cool",!isR);
    t.b.classList.toggle("act",!!active);
    t.tm.textContent=isR?fmt(cds[a.id]):fmt(r);
    t.st.textContent=isR?"READY":pre?a.pl+" "+fmt(a.pre-elapsed):spawn?a.pd:active?"ACTIVE "+fmt(a.du-elapsed):"COOLDOWN";
  });
  
}
setInterval(draw,250);
ALL.forEach(a=>{was[a.id]=rem(a)>0;wasPre[a.id]=!!isPreNow(a,rem(a))});
build();
window.HLL_CMD={show:function(){try{toPage(curPage,true);paintDots()}catch(e){}}};

})();
</script>

if("serviceWorker" in navigator && location.protocol!=="file:"){
