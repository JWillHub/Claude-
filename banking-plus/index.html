:root{--bg:#0E1218;--bar:#151B26;--card:#171D29;--input:#222B3B;--border:#2A3446;--text:#EDF1F7;--muted:#A3AEC0;--gh:#2B3650;--sgh:#212A3B;--accent:#446FDC;--accent-soft:rgba(68,111,220,.20);--accent-text:#A9C4FF;--green:#36CC8E;--red:#F26F6F;--amber:#F6C65B;--dark:#0E1218;--topH:52px;--tabH:64px;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-text-size-adjust:100%}
html,body{overflow-x:hidden;overflow-x:clip}
body{min-height:100vh;overscroll-behavior-x:none}
button,input,select,textarea{font:inherit;color:inherit}
.top{position:fixed;top:0;left:0;right:0;height:calc(var(--topH) + env(safe-area-inset-top));padding-top:env(safe-area-inset-top);background:var(--bar);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:center;z-index:20}
.top h1{margin:0;font-size:21px;line-height:1}
.brand{background:none;border:0;padding:8px 14px;border-radius:10px;cursor:pointer;color:var(--text);font:300 21px/1 'BP Mark',-apple-system,'Segoe UI',Roboto,sans-serif;letter-spacing:.6px}
.brand b{font-weight:400;color:var(--accent-text);margin-left:1px}
.brand:focus-visible{outline:2px solid var(--accent)}
main{padding:calc(var(--topH) + env(safe-area-inset-top) + 14px) 12px calc(var(--tabH) + env(safe-area-inset-bottom) + 24px)}
.wrap{max-width:720px;margin:0 auto}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--bar);border-top:1px solid var(--border);display:flex;gap:2px;padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:20}
.tab{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;color:var(--muted);font-size:11px;padding:6px 2px;border-radius:12px;cursor:pointer}
.tab svg{width:22px;height:22px;flex:none}
.tab.on{color:var(--accent-text);background:var(--accent-soft)}
@media (min-width:768px){
 .tabs{top:calc(var(--topH) + env(safe-area-inset-top));right:auto;width:210px;flex-direction:column;border-top:0;border-right:1px solid var(--border);padding:14px 10px;gap:4px}
 .tab{flex:none;flex-direction:row;justify-content:flex-start;gap:12px;font-size:15px;padding:11px 14px}
 main{margin-left:210px;padding-left:24px;padding-right:24px;padding-bottom:40px}
}
.monthbar{display:flex;align-items:center;justify-content:space-between;margin:0 0 14px}
.monthbar .mt{font-size:17px;font-weight:700}
.iconbtn{width:42px;height:42px;border-radius:12px;border:1px solid var(--border);background:var(--input);display:flex;align-items:center;justify-content:center;cursor:pointer}
.iconbtn svg{width:20px;height:20px}
.btn{background:var(--accent);color:#fff;border:0;border-radius:12px;padding:11px 16px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-align:center}
.btn.sec{background:var(--input);color:var(--text);border:1px solid var(--border)}
.btn.warnbtn{background:var(--red);color:var(--dark)}
.btn.danger{background:transparent;color:var(--red);border:1px solid var(--red)}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.45}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 14px}
.btnrow .btn{flex:1 1 140px}
/* grouped cards */
.grp{margin:0 0 18px}
.grp-h{background:var(--gh);color:#fff;border:1px solid var(--border);border-bottom:0;border-radius:14px 14px 0 0;padding:9px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:12.5px;font-weight:700;letter-spacing:.7px}
.grp-h .gn{text-transform:uppercase;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grp-h .gt{letter-spacing:0;font-variant-numeric:tabular-nums;white-space:nowrap;font-size:13.5px}
.grp-c{background:var(--card);border:1px solid var(--border);border-radius:0 0 14px 14px;overflow:hidden}
.row{padding:13px 14px;border-top:1px solid var(--border)}
.grp-c>.row:first-child,.grp-c>.colh+.row{border-top:0}
.colh{background:var(--sgh);color:#fff;font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;padding:6px 14px}
.sub-h{background:var(--sgh);color:#fff;font-size:12px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;padding:7px 14px;border-top:1px solid var(--border);display:flex;justify-content:space-between}
.cat,.colh.cg{display:grid;grid-template-columns:minmax(0,1fr) 68px 58px 76px;gap:6px;align-items:center}
.row.cat .cname{display:block;-webkit-line-clamp:unset;line-height:1.3}
.cn{display:block;white-space:nowrap;overflow:hidden}
.row.cat .pill{font-size:12.5px;padding:4px 7px}
.row.cat .num{font-size:13.5px}
@media (max-width:440px){.row.cat .bud{font-size:14px;padding:6px 6px}}
.colh.cg span:not(:first-child){text-align:right}
.cname{min-width:0;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow-wrap:anywhere;line-height:1.25}
.cnote{display:block;font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bud.tgt{border-color:var(--accent)}
.edbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 14px;color:var(--muted);font-size:13.5px}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;font-size:14px}
.bud{width:100%;min-width:0;text-align:right;background:var(--input);border:1px solid var(--border);border-radius:9px;padding:6px 8px;font-size:16px;font-variant-numeric:tabular-nums}
.bud:focus,.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
.pill{display:block;justify-self:end;max-width:100%;padding:4px 8px;border-radius:999px;font-weight:700;font-size:13px;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pos{background:var(--green);color:var(--dark)}
.neg{background:var(--red);color:var(--dark)}
.zero{background:var(--input);color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:13px}
.in{color:var(--green)}
/* summary */
.summary{border-radius:16px;padding:16px;margin:0 0 18px;background:var(--green);color:var(--dark)}
.summary.neg{background:var(--red)}
.summary.neutral{background:var(--card);color:var(--text);border:1px solid var(--border)}
.s-lbl{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;opacity:.85}
.s-big{font-size:34px;font-weight:800;line-height:1.15;font-variant-numeric:tabular-nums;margin:2px 0 10px;overflow-wrap:anywhere}
.s-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;border-top:1px solid rgba(14,18,24,.25);padding-top:10px}
.summary.neutral .s-grid{border-top-color:var(--border)}
.s-grid div{display:flex;flex-direction:column;min-width:0}
.s-grid.s3{grid-template-columns:1fr 1fr 1fr}
.s-grid span{font-size:12px;opacity:.85}
.s-grid b{font-size:16px;font-variant-numeric:tabular-nums}
.s-foot{margin-top:10px;padding-top:10px;border-top:1px solid rgba(14,18,24,.25);display:flex;justify-content:space-between;font-weight:700;gap:8px}
.warn{border:1px solid var(--amber);background:rgba(246,198,91,.10);color:var(--text);border-radius:14px;padding:12px 14px;margin:0 0 18px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.warn b{color:var(--amber)}
.note{color:var(--muted);font-size:13px;margin:-6px 2px 18px}
/* transactions */
.filters{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;margin:0 0 10px}
.chip{border:1px solid var(--border);background:var(--input);border-radius:999px;padding:8px 13px;font-size:14px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--accent-soft);color:var(--accent-text);border-color:var(--accent)}
.chip.amber{border-color:var(--amber);color:var(--amber)}
.field{display:block;margin:0 0 12px}
.field>span{display:block;font-size:13px;color:var(--muted);margin:0 0 5px}
.field input,.field select,.field textarea,select.inp,input.inp{width:100%;min-width:0;background:var(--input);border:1px solid var(--border);border-radius:10px;padding:10px 12px;font-size:16px}
.field textarea{min-height:120px;resize:vertical;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
input[type=date]{min-height:44px}
.tx{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;cursor:pointer}
.tx-d{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx-s{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx-a{font-weight:700;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.tx-c{grid-column:1/-1}
.catsel{width:100%;min-width:0;background:var(--input);border:1px solid var(--border);border-radius:9px;padding:6px 9px;font-size:16px;color:var(--text)}
.catsel.uncat{border-color:var(--amber);color:var(--amber)}
.tag{display:inline-block;font-size:12.5px;padding:3px 9px;border-radius:999px;background:var(--input);color:var(--muted);border:1px solid var(--border)}
.tag.amber{color:var(--amber);border-color:var(--amber)}
.tag.blue{color:var(--accent-text);border-color:var(--accent)}
.listinfo{color:var(--muted);font-size:13px;margin:0 2px 12px}
.empty{padding:22px 14px;text-align:center;color:var(--muted)}
/* key-value rows */
.kv{display:flex;align-items:center;justify-content:space-between;gap:12px}
.kv>:first-child{min-width:0}
.kv b{font-variant-numeric:tabular-nums;white-space:nowrap}
.kv input{width:130px;flex:none;text-align:right;background:var(--input);border:1px solid var(--border);border-radius:9px;padding:7px 9px;font-size:16px}
.kv input[type=date]{width:160px;text-align:left}
.prog{height:10px;border-radius:999px;background:var(--input);overflow:hidden;margin-top:8px}
.prog>i{display:block;height:100%;background:var(--green);border-radius:999px}
/* charts */
.hbar .lab{display:flex;justify-content:space-between;gap:10px;font-size:14px;margin-bottom:6px}
.hbar .lab span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar .lab span:last-child{font-variant-numeric:tabular-nums;white-space:nowrap}
.track{height:12px;background:var(--input);border-radius:999px;overflow:hidden}
.track>i{display:block;height:100%;background:var(--accent);border-radius:999px;min-width:3px}
.track>i.over{background:var(--red)}
.track>i.amb{background:var(--amber)}
.cols{display:flex;align-items:flex-end;gap:6px;height:170px;padding:14px 12px 0}
.colg{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;height:100%}
.colg .bars{flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center;gap:3px}
.colg .bars i{display:block;width:42%;max-width:22px;border-radius:5px 5px 0 0;min-height:2px}
.b-sp{background:var(--accent)}.b-in{background:var(--green)}.b-bal{background:var(--red)}
.colg .ml{font-size:11.5px;color:var(--muted);padding:6px 0 8px;white-space:nowrap}
.colg.cur .ml{color:var(--accent-text);font-weight:700}
.legend{display:flex;gap:16px;padding:8px 14px 12px;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) 1fr 1fr 1fr;gap:8px;font-variant-numeric:tabular-nums;font-size:14px}
.mrow span:not(:first-child){text-align:right;white-space:nowrap}
/* import preview */
.prev{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:2px 10px;align-items:center}
.prev input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent)}
.prev .pd{font-size:12.5px;color:var(--muted);grid-column:2/-1}
.prev.skip{opacity:.55}
.map{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.seg{display:flex;background:var(--input);border:1px solid var(--border);border-radius:11px;padding:3px;margin:0 0 12px}
.seg label{flex:1;text-align:center;padding:8px 6px;border-radius:9px;cursor:pointer;font-size:14px}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked){background:var(--accent);color:#fff;font-weight:600}
.hidden{display:none!important}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);border:1px solid var(--border);border-bottom:0;border-radius:18px 18px 0 0;width:100%;max-width:560px;max-height:90vh;overflow:auto;padding:18px 16px calc(16px + env(safe-area-inset-bottom))}
.sheet h2{margin:0 0 14px;font-size:18px}
.sheet-btns{display:flex;gap:10px;align-items:center;margin-top:16px}
.sheet-btns .sp{flex:1}

<script>
'use strict';
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,9);
const NF=new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'});
const r2=n=>Math.round((+n||0)*100)/100;
const m=n=>{const v=r2(n);return NF.format(v===0?0:v)};
const NF0=new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0});
const mc=n=>{const v=r2(n);return Number.isInteger(v)||Math.abs(v)>=1000?NF0.format(Math.round(v)||0):NF.format(v)};
const mk=n=>{const a=Math.abs(n);const s=a>=1000?'$'+(a/1000).toFixed(a>=10000?0:1)+'k':'$'+Math.round(a);return (n<0?'-':'')+s};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const p2=n=>String(n).padStart(2,'0');
const today=()=>{const d=new Date();return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())};
const addMonth=(ym,k)=>{let [y,mo]=ym.split('-').map(Number);mo+=k;y+=Math.floor((mo-1)/12);mo=((mo-1)%12+12)%12+1;return y+'-'+p2(mo)};
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
const monthLabel=ym=>{const [y,mo]=ym.split('-');return MONTHS[+mo-1]+' '+y};
const monthShort=ym=>MONTHS[+ym.slice(5,7)-1].slice(0,3);
const dayDiff=(a,b)=>Math.round((Date.parse(a+'T12:00:00')-Date.parse(b+'T12:00:00'))/864e5);
const dateLabel=d=>new Date(d+'T12:00:00').toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric',year:'numeric'});
const numVal=s=>{const v=parseAmt(s);return v==null?0:v};

/* ---------- storage (IndexedDB only, on this device) ---------- */
const DB={db:null,
 open(){return new Promise((res,rej)=>{const r=indexedDB.open('bankingplus',1);r.onupgradeneeded=()=>r.result.createObjectStore('data');r.onsuccess=()=>{this.db=r.result;res()};r.onerror=()=>rej(r.error)})},
 get(k){return new Promise((res,rej)=>{const q=this.db.transaction('data').objectStore('data').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})},
 put(k,v){return new Promise((res,rej)=>{const t=this.db.transaction('data','readwrite');t.objectStore('data').put(v,k);t.oncomplete=()=>res();t.onerror=()=>rej(t.error)})}};
let state,saveT;
function save(now){clearTimeout(saveT);const go=()=>DB.put('state',state).catch(e=>toast('Could not save: '+e.message));if(now)go();else saveT=setTimeout(go,200)}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'&&state)save(true)});

function defaults(){
 const ap={id:uid(),name:'Apple Card',type:'credit',startBal:0,startDate:today(),apr:0,payment:0,match:'apple card, applecard, gsbank'};
 const di={id:uid(),name:'Discover',type:'credit',startBal:0,startDate:today(),apr:0,payment:0,match:'discover'};
 const cb={id:uid(),name:'Commerce Bank',type:'bank',startBal:0,startDate:''};
 const G=(name,income,cats)=>({g:{id:uid(),name,income:!!income},cats});
 const spec=[G('Income',1,['Paycheck']),G('Housing',0,['Rent / Mortgage','Utilities','Internet & Phone']),G('Food',0,['Groceries','Dining out']),G('Transportation',0,['Gas','Car payment','Car insurance','Car maintenance']),G('Personal & Family',0,['Health','Kids','Clothing','Subscriptions','Gifts','Fun money']),G('Debt',0,[])];
 const groups=[],cats=[];
 for(const s of spec){groups.push(s.g);for(const n of s.cats)cats.push({id:uid(),gid:s.g.id,name:n})}
 const debt=groups.find(g=>g.name==='Debt');
 cats.push({id:uid(),gid:debt.id,name:'Apple Card payment',cardId:ap.id},{id:uid(),gid:debt.id,name:'Discover payment',cardId:di.id});
 return {version:1,accounts:[ap,di,cb],groups,cats,budgets:{},paid:{},targets:{},txns:[]};
}
function fixState(s){
 s.accounts=s.accounts||[];s.groups=s.groups||[];s.cats=s.cats||[];s.budgets=s.budgets||{};s.txns=s.txns||[];s.paid=s.paid||{};s.targets=s.targets||{};return s}

/* ---------- lookups ---------- */
const acct=id=>state.accounts.find(a=>a.id===id);
const cat=id=>state.cats.find(c=>c.id===id);
const grp=id=>state.groups.find(g=>g.id===id);
const isBank=id=>{const a=acct(id);return !!a&&a.type!=='credit'};
const isUncat=t=>isBank(t.acct)&&t.cat!=='__transfer'&&!(t.cat&&cat(t.cat));
const normDesc=s=>String(s||'').toLowerCase().replace(/\s+/g,' ').trim();
const looseDesc=s=>normDesc(s).replace(/[0-9#*x]{3,}|[0-9]+/g,'').replace(/[^a-z& ]/g,' ').replace(/\s+/g,' ').trim().slice(0,28);

function monthStats(ym){
 const st={spent:{},recv:{},uncatOut:0,uncatIn:0,uncatN:0,transfers:0};
 for(const t of state.txns){
  if(t.date.slice(0,7)!==ym||!isBank(t.acct))continue;
  if(t.cat==='__transfer'){st.transfers++;continue}
  const c=t.cat&&cat(t.cat);
  if(!c){st.uncatN++;if(t.amt<0)st.uncatOut-=t.amt;else st.uncatIn+=t.amt;continue}
  const g=grp(c.gid);
  if(g&&g.income)st.recv[c.id]=(st.recv[c.id]||0)+t.amt;else st.spent[c.id]=(st.spent[c.id]||0)-t.amt;
 }
 return st;
}
const FREQ={biweekly:'Every 2 weeks',monthly:'Monthly',once:'One time'};
function payDates(c,ym){
 if(!c.amt||!c.date)return [];const out=[],first=ym+'-01',last=addMonth(ym,1)+'-01';
 if(c.freq==='once')return c.date>=first&&c.date<last?[c.date]:[];
 if(c.freq==='monthly'){const day=+c.date.slice(8,10),[y,mo]=ym.split('-').map(Number),dim=new Date(y,mo,0).getDate(),d=ym+'-'+p2(Math.min(day,dim));return d>=c.date.slice(0,7)+'-01'?[d]:[]}
 const U=x=>Date.UTC(+x.slice(0,4),+x.slice(5,7)-1,+x.slice(8,10)),D=864e5,base=U(c.date);
 for(let k=Math.ceil((U(first)-base)/(14*D));;k++){const d=new Date(base+k*14*D),iso=d.getUTCFullYear()+'-'+p2(d.getUTCMonth()+1)+'-'+p2(d.getUTCDate());if(iso>=last)break;out.push(iso)}
 return out;
}
function incomeMonth(ym){
 let total=0;const rows=[];
 for(const c of state.cats){const g=grp(c.gid);if(!g||!g.income)continue;
  const ds=payDates(c,ym),deps=state.txns.filter(t=>t.cat===c.id&&t.amt>0&&isBank(t.acct));
  const hits=ds.map(d=>({d,got:deps.some(t=>Math.abs(dayDiff(t.date,d))<=3)}));
  total+=ds.length*(+c.amt||0);rows.push({c,hits,sum:r2(ds.length*(+c.amt||0))})}
 return {total:r2(total),rows};
}
function incomeSheet(c){
 const isNew=!c;c=c||{name:'',amt:0,date:today(),freq:'biweekly'};
 sheet(isNew?'Add income':'Edit income',`
 <label class="field"><span>Paid by</span><input name="name" required value="${esc(c.name)}" placeholder="e.g. The Guidance Center" autocomplete="off"></label>
 <label class="field"><span>Check amount</span><input name="amt" inputmode="numeric" data-money="1" value="${c.amt?(+c.amt).toFixed(2):''}" placeholder="0.00"></label>
 <label class="field"><span>Date a check hit</span><input type="date" name="date" value="${esc(c.date||today())}"></label>
 <label class="field"><span>How often</span><select name="freq">${Object.entries(FREQ).map(([k,v])=>`<option value="${k}"${c.freq===k?' selected':''}>${v}</option>`).join('')}</select></label>`,
 fd=>{const n=fd.name.trim();if(!n){toast('Enter who pays it');return false}
  if(isNew){let g=state.groups.find(g=>g.income);if(!g){g={id:uid(),name:'Income',income:true};state.groups.unshift(g)}c={id:uid(),gid:g.id};state.cats.push(c)}
  Object.assign(c,{name:n,amt:Math.abs(numVal(fd.amt)),date:fd.date||today(),freq:fd.freq});save();render();toast('Saved')},
 {del:isNew?null:'Delete',onDel:()=>{state.txns.forEach(t=>{if(t.cat===c.id)t.cat=''});state.cats=state.cats.filter(x=>x!==c);save();render()}});
}
function targetFor(id,ym){const ks=Object.keys(state.targets).filter(k=>k<=ym).sort().reverse();for(const k of ks){const v=state.targets[k][id];if(v!=null)return +v}return 0}
function catNums(c,g,st,ym){const tx=g.income?(st.recv[c.id]||0):(st.spent[c.id]||0),typed=+((state.paid[ym]||{})[c.id])||0,amt=r2(tx+typed),tgt=targetFor(c.id,ym);return {tx,amt,tgt,left:r2(tgt-amt)}}
function monthTotals(ym){
 const st=monthStats(ym);let inc=0,out=st.uncatOut,incT=0,outT=0;const per={};
 for(const c of state.cats){const g=grp(c.gid);if(!g)continue;if(g.income)continue;const n=per[c.id]=catNums(c,g,st,ym);{out+=n.amt;outT+=n.tgt}}
 inc=incomeMonth(ym).total;return {st,per,inc:r2(inc),out:r2(out),incT:r2(incT),outT:r2(outT),spent:r2(out),incRec:r2(inc)};
}

/* ---------- card payoff ---------- */
function cardInfo(a){
 const sd=a.startDate||'';
 const payCats=new Set(state.cats.filter(c=>c.cardId===a.id).map(c=>c.id));
 const bank=state.txns.filter(t=>payCats.has(t.cat)&&isBank(t.acct)&&t.date>sd).map(t=>({date:t.date,amt:-t.amt,t})).sort((x,y)=>x.date.localeCompare(y.date));
 const cardTx=state.txns.filter(t=>t.acct===a.id&&t.date>sd);
 const credits=cardTx.filter(t=>t.amt>0).map(t=>({date:t.date,amt:t.amt,t,matched:false})).sort((x,y)=>x.date.localeCompare(y.date));
 const ev=[];
 for(const b of bank){
  const c=credits.find(c=>!c.matched&&Math.abs(c.amt-b.amt)<0.005&&Math.abs(dayDiff(c.date,b.date))<=10);
  if(c){c.matched=true;c.bankDate=b.date}else ev.push({date:b.date,delta:-b.amt,pay:b.amt,kind:'bank',desc:b.t.desc});
 }
 for(const c of credits)ev.push({date:c.date,delta:-c.amt,pay:c.amt,kind:c.matched?'both':'card',desc:c.t.desc});
 for(const t of cardTx)if(t.amt<0)ev.push({date:t.date,delta:-t.amt,pay:0,kind:'charge',desc:t.desc});
 ev.sort((x,y)=>x.date.localeCompare(y.date));
 const start=+a.startBal||0;
 const owed=r2(start+ev.reduce((s,e)=>s+e.delta,0));
 const paid=r2(ev.reduce((s,e)=>s+e.pay,0));
 const charges=r2(ev.filter(e=>e.kind==='charge').reduce((s,e)=>s+e.delta,0));
 const curYm=today().slice(0,7);
 // monthly payment: custom > category target > average of last 3 full months
 let pay=+a.payment||0,src=pay?'your planned payment':'';
 if(!pay){const b=[...payCats].reduce((s,id)=>s+targetFor(id,curYm),0);if(b>0){pay=b;src="the category target"}}
 if(!pay){let tot=0,n=0;for(let k=0;k<=3;k++){const ym=addMonth(curYm,-k);const v=ev.filter(e=>e.date.slice(0,7)===ym).reduce((s,e)=>s+e.pay,0);if(v>0&&(k>0||n===0)){tot+=v;n++}if(n===3)break}if(n){pay=r2(tot/n);src=n>1?`your average payment (last ${n} months)`:'your last monthly payment'}}
 let months=null,interest=0,never=false;
 if(owed>0.005&&pay>0){const r=(+a.apr||0)/1200;let bal=owed,n=0;while(bal>0.005&&n<600){const i=bal*r;interest+=i;bal=bal+i-pay;n++;if(n===1&&pay<=i){never=true;break}}if(n>=600)never=true;months=n}
 // month-end balances for the chart
 const hist=[];const sm=sd?sd.slice(0,7):(ev[0]?ev[0].date.slice(0,7):curYm);
 let ym=addMonth(curYm,-11)>sm?addMonth(curYm,-11):sm;
 while(ym<=curYm){const end=ym+'-31';hist.push({ym,bal:r2(start+ev.filter(e=>e.date<=end).reduce((s,e)=>s+e.delta,0))});ym=addMonth(ym,1)}
 return {owed,paid,charges,pay,src,months,interest:r2(interest),never,ev,hist,start};
}

/* ---------- CSV ---------- */
function parseCSV(text){
 text=String(text).replace(/^﻿/,'');
 const head=text.split(/\r?\n/).slice(0,6).join('\n');
 const cnt=d=>head.split(d).length-1;
 const delim=[',','\t',';'].reduce((b,d)=>cnt(d)>cnt(b)?d:b,',');
 const rows=[];let row=[],f='',q=false;
 for(let i=0;i<text.length;i++){const ch=text[i];
  if(q){if(ch==='"'){if(text[i+1]==='"'){f+='"';i++}else q=false}else f+=ch}
  else if(ch==='"')q=true;
  else if(ch===delim){row.push(f);f=''}
  else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&text[i+1]==='\n')i++;row.push(f);rows.push(row);row=[];f=''}
  else f+=ch}
 if(f!==''||row.length){row.push(f);rows.push(row)}
 return rows.map(r=>r.map(c=>c.trim())).filter(r=>r.some(c=>c!==''));
}
function parseDate(s){
 if(!s)return null;s=String(s).trim();let x;
 const ok=(y,mo,d)=>mo>=1&&mo<=12&&d>=1&&d<=31&&y>1900&&y<2200?y+'-'+p2(mo)+'-'+p2(d):null;
 if((x=s.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/)))return ok(+x[1],+x[2],+x[3]);
 if((x=s.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})\b/))){let y=+x[3];if(y<100)y+=2000;return ok(y,+x[1],+x[2])}
 if(/[a-z]{3}/i.test(s)&&/\d{4}/.test(s)){const d=new Date(s);if(!isNaN(d))return ok(d.getFullYear(),d.getMonth()+1,d.getDate())}
 return null;
}
function parseAmt(s){
 if(s==null)return null;s=String(s).trim();if(!s)return null;let neg=false;
 if(/^\(.*\)$/.test(s)){neg=true;s=s.slice(1,-1)}
 if(/\s*(cr)$/i.test(s)){s=s.replace(/\s*cr$/i,'')}
 if(/\s*(dr)$/i.test(s)){neg=!neg;s=s.replace(/\s*dr$/i,'')}
 if(/-\s*$/.test(s)){neg=!neg;s=s.replace(/-\s*$/,'')}
 s=s.replace(/usd/i,'').replace(/[$,\s]/g,'');
 if(s[0]==='-'){neg=!neg;s=s.slice(1)}else if(s[0]==='+')s=s.slice(1);
 if(s[0]==='$')s=s.slice(1);
 if(!/^(\d+\.?\d*|\.\d+)$/.test(s))return null;
 const v=parseFloat(s);return neg?-v:v;
}
function detectCols(rows){
 let hi=-1;
 for(let i=0;i<Math.min(rows.length,12);i++){const r=rows[i].map(c=>c.toLowerCase());if(r.some(c=>/date/.test(c))&&r.some(c=>/amount|debit|credit|withdraw|deposit/.test(c))){hi=i;break}}
 const ncol=Math.max(...rows.map(r=>r.length));const names=[];
 for(let j=0;j<ncol;j++)names.push(hi>=0&&rows[hi][j]?rows[hi][j]:'Column '+(j+1));
 const H=names.map(n=>n.toLowerCase());
 const find=(...res)=>{for(const re of res){const j=H.findIndex(h=>re.test(h));if(j>=0)return j}return -1};
 let date=-1,desc=-1,amt=-1,debit=-1,credit=-1;
 if(hi>=0){
  date=find(/trans.*date/,/^date$/,/date/);
  desc=find(/merchant/,/desc/,/payee/,/^name$/,/memo/,/detail/,/narrative/);
  amt=find(/^amount/,/amount/);
  debit=find(/debit|withdraw/);credit=find(/credit(?! card)|deposit/);
  if(amt<0&&debit>=0&&credit>=0)amt='split';
 }
 const data=rows.slice(hi+1,hi+31);
 const frac=(j,fn)=>data.length?data.filter(r=>fn(r[j])).length/data.length:0;
 if(date<0){let best=0;for(let j=0;j<ncol;j++){const f=frac(j,v=>parseDate(v));if(f>best+.01){best=f;date=j}}if(best<.5)date=-1}
 if(amt===-1){let best=0;for(let j=0;j<ncol;j++){if(j===date)continue;const f=frac(j,v=>parseAmt(v)!=null&&/[.]\d\d\b/.test(v));if(f>best+.01){best=f;amt=j}}if(best<.5)amt=-1}
 if(desc<0){let best=0;for(let j=0;j<ncol;j++){if(j===date||j===amt)continue;const L=data.reduce((s,r)=>s+(r[j]&&parseAmt(r[j])==null?r[j].length:0),0);if(L>best){best=L;desc=j}}}
 return {start:hi+1,names,map:{date,desc,amt,debit,credit}};
}

 if(!sw.mode){if(Math.abs(dx)>8&&Math.abs(dx)>Math.abs(dy)*1.2){sw.mode='h';closeSw(sw.w);sw.fg.style.transition='none';try{sw.fg.setPointerCapture(e.pointerId)}catch(_){}}else if(Math.abs(dy)>8){sw=null;return}else return}
 e.preventDefault();sw.pos=Math.max(-110,Math.min(0,sw.base+dx));sw.fg.style.transform=`translateX(${sw.pos}px)`},{passive:false});
function swEnd(){if(!sw)return;if(sw.mode==='h'){sw.fg.style.transition='';const open=sw.pos<-44;sw.w.classList.toggle('open',open);sw.fg.style.transform=open?'translateX(-88px)':'';swNoClick=true;setTimeout(()=>swNoClick=false,80)}sw=null}
document.addEventListener('pointerup',swEnd);document.addEventListener('pointercancel',swEnd);

/* swipe the top card left/right to change month */
let ms=null;
document.addEventListener('pointerdown',e=>{const c=e.target.closest('.summary.mswipe');if(!c||e.target.closest('input,button')||(e.pointerType==='mouse'&&e.button))return;ms={c,x:e.clientX,y:e.clientY,id:e.pointerId,mode:null,dx:0}});
document.addEventListener('pointermove',e=>{if(!ms||e.pointerId!==ms.id)return;const dx=e.clientX-ms.x,dy=e.clientY-ms.y;
 if(!ms.mode){if(Math.abs(dx)>8&&Math.abs(dx)>Math.abs(dy)*1.2){ms.mode='h';ms.c.style.transition='none';try{ms.c.setPointerCapture(e.pointerId)}catch(_){}}else if(Math.abs(dy)>8){ms=null;return}else return}
 e.preventDefault();ms.dx=dx;ms.c.style.transform=`translateX(${dx}px)`;ms.c.style.opacity=String(Math.max(.35,1-Math.abs(dx)/320))},{passive:false});
function msEnd(){if(!ms)return;const {c,dx,mode}=ms;ms=null;if(mode!=='h')return;swNoClick=true;setTimeout(()=>swNoClick=false,80);
 const rm=matchMedia('(prefers-reduced-motion: reduce)').matches,W=c.offsetWidth;
 if(Math.abs(dx)<70){c.style.transition=rm?'none':'transform .2s ease,opacity .2s ease';c.style.transform='';c.style.opacity='';return}
 const dir=dx<0?1:-1;c.style.transition=rm?'none':'transform .16s ease-in,opacity .16s ease-in';c.style.transform=`translateX(${-dir*W}px)`;c.style.opacity='0';
 setTimeout(()=>{ui.month=addMonth(ui.month,dir);render();const n=$('.summary.mswipe');if(!n||rm)return;
  n.style.transition='none';n.style.transform=`translateX(${dir*W*0.6}px)`;n.style.opacity='0';n.offsetHeight;
  n.style.transition='transform .22s ease-out,opacity .22s ease-out';n.style.transform='';n.style.opacity=''},rm?0:160)}
document.addEventListener('pointerup',msEnd);document.addEventListener('pointercancel',msEnd);

/* ---------- files ---------- */
function backupText(){return JSON.stringify({app:'Banking+',format:1,saved:new Date().toISOString(),data:state})}
async function saveFile(name,text,type){
 const blob=new Blob([text],{type});
 const ios=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
 if(ios&&navigator.canShare){try{const f=new File([blob],name,{type});if(navigator.canShare({files:[f]})){await navigator.share({files:[f]});return}}catch(e){if(e&&e.name==='AbortError')return}}
 const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);
}
function restoreFrom(text){
 let o;try{o=JSON.parse(text)}catch(e){toast('That is not a valid backup file');return false}
 const d=o&&(o.data||o);if(!d||!Array.isArray(d.accounts)||!Array.isArray(d.txns)||!Array.isArray(d.cats)||!Array.isArray(d.groups)){toast('That file is not a Banking+ backup');return false}
 ask(`Replace everything on this device with this backup (${d.txns.length} transactions, ${d.accounts.length} accounts)?`,'Replace',()=>{$$('.scrim').forEach(x=>x.remove());state=fixState(d);save(true);ui.f={acct:'',uncat:false,q:''};render();toast('Backup restored')});return false;
}
function csvCell(v){v=String(v??'');return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
function exportCsv(){
 const rows=[['Date','Account','Description','Category','Group','Amount','Note']];
 for(const t of [...state.txns].sort((a,b)=>a.date.localeCompare(b.date))){const a=acct(t.acct),c=cat(t.cat),g=c&&grp(c.gid);
  rows.push([t.date,a?a.name:'',t.desc,!isBank(t.acct)?(t.amt>0?'Card payment/credit':'Card charge'):t.cat==='__transfer'?'Transfer':c?c.name:'Uncategorized',g?g.name:'',t.amt.toFixed(2),t.note||''])}
 saveFile(`banking-plus-transactions-${today()}.csv`,rows.map(r=>r.map(csvCell).join(',')).join('\r\n'),'text/csv');
}

/* ---------- sheet + toast ---------- */
function sheet(title,body,onSave,o={}){
 const el=document.createElement('div');el.className='scrim';
 el.innerHTML=`<div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}"><h2>${esc(title)}</h2><form novalidate>${body}<div class="sheet-btns">${o.del?`<button type="button" class="btn danger" data-s="del">${o.del}</button>`:''}<span class="sp"></span><button type="button" class="btn sec" data-s="cancel">Cancel</button>${o.noOk?'':`<button type="submit" class="btn${o.okCls?' '+o.okCls:''}">${o.ok||'Save'}</button>`}</div></form></div>`;
 document.body.appendChild(el);const close=()=>el.remove();
 el.addEventListener('click',e=>{if(e.target===el)return close();const s=e.target.closest('[data-s]');if(!s)return;if(s.dataset.s==='cancel')close();else if(s.dataset.s==='del'){if(!s.dataset.armed){s.dataset.armed=1;s.textContent=o.delConfirm||'Tap again to confirm';return}if(o.onDel()!==false)close()}});
 $('form',el).addEventListener('submit',e=>{e.preventDefault();const fd=Object.fromEntries(new FormData(e.target));if(onSave(fd,el)!==false)close()});
 if(o.onOpen)o.onOpen(el);return el;
}
function ask(msg,ok,fn){sheet('Please confirm',`<p style="margin:0;line-height:1.5">${esc(msg)}</p>`,()=>{fn()},{ok,okCls:'warnbtn'})}
let toastT;function toast(msg){let t=$('.toast');if(!t){t=document.createElement('div');t.className='toast';t.setAttribute('role','status');document.body.appendChild(t)}t.textContent=msg;clearTimeout(toastT);toastT=setTimeout(()=>t.remove(),2600)}

/* ---------- events ---------- */
const act={
 prevM(){ui.month=addMonth(ui.month,-1);render()},nextM(){ui.month=addMonth(ui.month,1);render()},
 reviewUncat(){ui.tab='tx';ui.sub=null;ui.f={acct:'',uncat:true,q:''};render();scrollTo(0,0)},
 swDel,
 editIncome(b){incomeSheet(cat(b.dataset.id))},addIncome(){incomeSheet(null)},
 editTargets(){ui.editT=!ui.editT;const y=scrollY;render();scrollTo(0,y);if(!ui.editT)toast('Targets saved')},
 goHome(){$$('.scrim').forEach(x=>x.remove());closeSw&&closeSw();ui.tab='budget';ui.sub=null;ui.imp=null;ui.editT=false;ui.month=today().slice(0,7);render();scrollTo({top:0,behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'})},
 fUncat(){ui.f.uncat=!ui.f.uncat;render()},
 addTx(){txSheet(null)},editTx(b){txSheet(state.txns.find(t=>t.id===b.dataset.id))},
 openImport(){ui.sub='import';ui.imp={acct:ui.f.acct||(state.accounts.find(a=>a.type!=='credit')||state.accounts[0]||{}).id,text:'',rows:null};render();scrollTo(0,0)},
 closeImport(){ui.sub=null;ui.imp=null;render()},
 impRead(){const t=$('#impText').value;if(!t.trim())return toast('Paste the CSV text first');impSetText(t)},
 impGo,
 editAcct(b){acctSheet(acct(b.dataset.id))},addAcct(){acctSheet(null)},
 editCat(b){catSheet(cat(b.dataset.id))},addCat(b){catSheet(null,b.dataset.id)},
 toggleCard(b){toggleCard(b.closest('.fold'))},
 editGroup(b){groupSheet(grp(b.dataset.id))},addGroup(){groupSheet(null)},
 backup(){saveFile(`banking-plus-backup-${today()}.json`,backupText(),'application/json')},
 copyBackup(){navigator.clipboard.writeText(backupText()).then(()=>toast('Backup copied. Paste it into Restore on the other device.'),()=>toast('Copy not allowed here; use Save backup'))},
 restore(){sheet('Restore backup',`<label class="btn sec" style="width:100%;margin-bottom:12px">Choose backup file<input type="file" class="hidden" data-rf></label><label class="field"><span>…or paste the backup text</span><textarea name="txt" spellcheck="false"></textarea></label><p class="hint">This replaces all data on this device.</p>`,
  fd=>{if(!fd.txt.trim()){toast('Choose a file or paste the backup');return false}return restoreFrom(fd.txt)},{ok:'Restore',onOpen:el=>$('[data-rf]',el).addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;f.text().then(restoreFrom)})})},
 exportCsv,
 eraseAll(){ask('Erase all Banking+ data on this device? This cannot be undone. Save a backup first if you need one.','Erase everything',()=>{state=defaults();save(true);render();toast('Erased')})},
};
document.addEventListener('click',e=>{
 const tab=e.target.closest('.tab');if(tab){ui.tab=tab.dataset.tab;ui.editT=false;if(tab.dataset.tab!=='tx'){ui.sub=null}render();scrollTo(0,0);return}
 if(e.target.closest('select,input,textarea,label.btn'))return;
 if(swNoClick||dragNoClick)return;
 if($('.sw.open')&&!e.target.closest('.sw-del')){closeSw();return}
 const b=e.target.closest('[data-act]');if(b&&!b.disabled&&act[b.dataset.act])act[b.dataset.act](b,e);
});
document.addEventListener('change',e=>{
 const t=e.target;
 if(t.dataset.amt||t.dataset.tgt){const id=t.dataset.amt||t.dataset.tgt,v=parseAmt(t.value),c=cat(id),g=c&&grp(c.gid);if(!g)return;
  if(t.dataset.tgt){const T=state.targets[ui.month]=state.targets[ui.month]||{};T[id]=v==null?0:r2(Math.abs(v))}
  else{const n=catNums(c,g,monthStats(ui.month),ui.month),P=state.paid[ui.month]=state.paid[ui.month]||{},typed=v==null?0:r2(Math.abs(v)-n.tx);if(Math.abs(typed)<0.005)delete P[id];else P[id]=typed}
  save();const y=scrollY;render();scrollTo(0,y);return}
 if(t.dataset.txcat){const x=state.txns.find(x=>x.id===t.dataset.txcat);if(x){x.cat=t.value;save();const y=scrollY;$('#txlist').innerHTML=txList();scrollTo(0,y);const n=$('[data-act=fUncat]');if(n){const k=state.txns.filter(t=>t.date.slice(0,7)===ui.month&&isUncat(t)).length;n.textContent=`Uncategorized (${k})`;n.classList.toggle('amber',!!k&&!ui.f.uncat)}}return}
 if(t.dataset.card){const a=acct(t.dataset.card),k=t.dataset.k;a[k]=k==='startDate'?t.value:Math.abs(numVal(t.value));save();render();return}
 const c=t.dataset.chg;
 if(c==='fAcct'){ui.f.acct=t.value;render()}
 else if(c==='impAcct'){ui.imp.acct=t.value;if(ui.imp.rows)impSetText(ui.imp.text);else render()}
 else if(c==='impMap'){ui.imp.map[t.dataset.k]=t.value==='split'?'split':+t.value;ui.imp.override=null;render()}
 else if(c==='impSign'){ui.imp.outNeg=t.value==='neg';ui.imp.override=null;render()}
 else if(c==='impInc'){ui.imp.override=ui.imp.override||{};ui.imp.override[+t.dataset.i]=t.checked;const y=scrollY;render();scrollTo(0,y)}
 else if(t.id==='impFile'){const f=t.files[0];if(!f)return;f.text().then(x=>{ui.imp.text=x;impSetText(x)}).catch(()=>toast('Could not read that file. Try pasting the text instead.'))}
});
/* cents-first money entry: digits fill in from the right (5 → 0.05, 50 → 0.50, 5000 → 50.00) */
const centsFmt=d=>{d=d.replace(/\D/g,'').replace(/^0+/,'').slice(0,9);return d?(+d/100).toFixed(2):''};
const caretEnd=el=>{try{const n=el.value.length;el.setSelectionRange(n,n)}catch(_){}};
document.addEventListener('beforeinput',e=>{const el=e.target;if(!el.dataset||!el.dataset.money)return;
 if(e.inputType==='insertFromPaste'||e.inputType==='insertReplacementText'){const t=(e.data??(e.dataTransfer&&e.dataTransfer.getData('text'))??'');const v=parseAmt(t);if(v!=null){e.preventDefault();el.value=Math.abs(v).toFixed(2);el.dispatchEvent(new Event('input',{bubbles:true}))}}});
document.addEventListener('focusin',e=>{const el=e.target;if(el.dataset&&el.dataset.money)setTimeout(()=>caretEnd(el),0)});
document.addEventListener('click',e=>{const el=e.target;if(el.dataset&&el.dataset.money)caretEnd(el)},true);
document.addEventListener('input',e=>{if(e.target.dataset&&e.target.dataset.money){const el=e.target,v=centsFmt(el.value);if(el.value!==v)el.value=v;caretEnd(el);if(el.matches('.row.cat .bud'))fitOne(el)}});
document.addEventListener('input',e=>{if(e.target.id==='txq'){ui.f.q=e.target.value;$('#txlist').innerHTML=txList()}else if(e.target.id==='impText'&&ui.imp)ui.imp.text=e.target.value});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('.fold>.grp-h')){e.preventDefault();toggleCard(e.target.closest('.fold'));return}if(e.key==='Enter'&&e.target.matches('.bud,.kv input'))e.target.blur();if(e.key==='Escape'){const s=$('.scrim');if(s)s.remove()}});

/* ---------- start ---------- */
(async()=>{
 try{await DB.open();state=await DB.get('state')}catch(e){toast('Storage unavailable: '+e.message)}
 if(!state){state=defaults();save(true)}else fixState(state);
 // pull-to-refresh / reload: come back to the same tab, month, filters and scroll spot
 let back=null;try{back=JSON.parse(sessionStorage.getItem('bp-view')||'null')}catch(_){}
 if(back&&['budget','tx','payoff','charts','settings'].includes(back.tab)){ui.tab=back.tab;if(/^\d{4}-\d{2}$/.test(back.month||''))ui.month=back.month;if(back.f)ui.f={acct:back.f.acct&&acct(back.f.acct)?back.f.acct:'',uncat:!!back.f.uncat,q:String(back.f.q||'')}}
 render();
 if(back&&back.y)requestAnimationFrame(()=>scrollTo(0,back.y));
 if(navigator.storage&&navigator.storage.persist){navigator.storage.persisted().then(p=>p||navigator.storage.persist()).then(p=>{persisted=p;if(ui.tab==='settings')render()}).catch(()=>{})}
 if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
