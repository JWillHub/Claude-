// One logo per service: "Paramount+ Premium", "Paramount+ Essential", "Paramount+ Amazon Channel" and
// "Paramount+ Roku Premium Channel" all count as Paramount+. The plainest name's logo is the one kept.
const PROV_EXTRA = new Set(['premium','essential','basic','standard','with','ads','ad','supported','showtime','amazon','apple','tv','channel','channels','roku','plus','kids','the']);
function provKey(n){
  const w = (n || '').toLowerCase().replace(/\+/g, ' plus ').replace(/[^a-z0-9 ]+/g, ' ').split(/\s+/).filter(Boolean);
  while(w.length > 1 && PROV_EXTRA.has(w[w.length - 1])) w.pop();
  // "Amazon Channel", "Apple TV Channel" and similar in the middle: cut at the first add-on word after the brand
  const cut = w.findIndex((x, i) => i > 0 && ['amazon','apple','roku','with','premium','essential','basic','standard'].includes(x));
  return (cut > 0 ? w.slice(0, cut) : w).filter((x, i, a) => !(i === a.length - 1 && x === 'plus' && a.length > 1)).join(' ') || n;
}
function uniqProv(list){
  const out = [], at = new Map();
  (list || []).forEach(x => {
    const k = provKey(x.n);
    if(!at.has(k)){ at.set(k, out.length); out.push(x); }
    else if(x.n.length < out[at.get(k)].n.length) out[at.get(k)] = x;
  });
  return out;
}
function provHTML(p){

async function saveReviewImage(d, btn){
  btn.textContent = 'Making image…';
  const W = 1080, H = 1350, c = document.createElement('canvas'); c.width = W; c.height = H;
  const x = c.getContext('2d');
  const g = x.createLinearGradient(0, 0, W, H); g.addColorStop(0, '#2a1d2e'); g.addColorStop(1, '#0c0a0f');
  x.fillStyle = g; x.fillRect(0, 0, W, H);
  try{ await document.fonts.load('700 100px "Barlow Condensed"'); }catch(e){}
  const disp = (sz) => `700 ${sz}px "Barlow Condensed", "Arial Narrow", sans-serif`;
  x.textAlign = 'center';
  x.fillStyle = '#b8242c'; x.font = disp(54); x.fillText('ROLLING CREDITS', W / 2, 110);
  x.fillStyle = '#9c93a9'; x.font = '600 34px system-ui, sans-serif'; x.fillText(d.thisYear ? `MY ${d.yr} IN FILM` : 'MY FILM LIFE SO FAR', W / 2, 165);
  x.fillStyle = '#b8242c'; x.font = disp(230); x.fillText(String(d.count), W / 2, 390);
  x.fillStyle = '#f4efe9'; x.font = '600 38px system-ui, sans-serif'; x.fillText('films rated', W / 2, 445);
  const load = src => new Promise(res => { const im = new Image(); im.crossOrigin = 'anonymous'; im.onload = () => res(im); im.onerror = () => res(null); im.src = src; });
  const imgs = await Promise.all(d.top.map(f => f.poster ? load(IMG + 'w342' + f.poster) : Promise.resolve(null)));
  const pw = 176, ph = 264, gap = 22, total = d.top.length * pw + (d.top.length - 1) * gap; let px = (W - total) / 2;
  d.top.forEach((f, i) => {
    x.save(); x.beginPath(); x.roundRect(px, 510, pw, ph, 16); x.clip();
    if(imgs[i]) x.drawImage(imgs[i], px, 510, pw, ph); else { x.fillStyle = '#262030'; x.fillRect(px, 510, pw, ph); x.fillStyle = '#9c93a9'; x.font = '600 22px system-ui'; x.fillText(f.title.slice(0, 14), px + pw / 2, 650); }
    x.restore();
    x.fillStyle = '#b8242c'; x.font = disp(40); x.fillText(fmtR(f.r) + '★', px + pw / 2, 830);
    px += pw + gap;
  });
  const stats = [[d.avg ? d.avg.toFixed(1) + '★' : '—', 'AVERAGE RATING'], [d.genre.toUpperCase(), 'FAVORITE GENRE'], [d.decade.toUpperCase(), 'YOUR DECADE'], [String(d.fives), 'FIVE-STAR FILMS']];
  stats.forEach(([v, l], i) => {
    const cx = i % 2 ? W * 0.72 : W * 0.28, cy = 960 + Math.floor(i / 2) * 170;
    x.fillStyle = '#f4efe9'; x.font = disp(76); x.fillText(v, cx, cy);
    x.fillStyle = '#9c93a9'; x.font = '700 26px system-ui, sans-serif'; x.fillText(l, cx, cy + 46);
  });
  let blob = null;
  try{ blob = await new Promise(r => c.toBlob(r, 'image/png')); }catch(e){}
  if(!blob){ btn.textContent = 'Could not make the image'; return; }
  const file = new File([blob], `reel-log-${d.yr}.png`, { type:'image/png' });
  btn.textContent = 'Save as image';
  if(navigator.canShare && navigator.canShare({ files:[file] })){ try{ await navigator.share({ files:[file], title:'My year in film' }); return; }catch(e){ if(e.name === 'AbortError') return; } }
  // sharing isn't available here: show the image so it can be pressed and held to save
  const url = URL.createObjectURL(blob);
  const holder = btn.parentElement.querySelector('.revimg') || btn.insertAdjacentElement('afterend', Object.assign(document.createElement('div'), { className:'revimg' }));
  holder.innerHTML = `<img src="${url}" alt="Your year in film" style="width:100%;border-radius:14px;margin-top:14px">`;
}

let rdHeaderMode = false;
async function rd(path, opt = {}){
  const key = store.get(K_RD, ''); if(!key) throw new Error('rdnokey');
  const base = new URL(RD_API + path);
  Object.entries(opt.q || {}).forEach(([k, v]) => base.searchParams.set(k, v));
  const send = hdr => {

    if(opt.form){ init.method = 'POST'; init.body = new URLSearchParams(opt.form).toString(); init.headers = { ...(init.headers || {}), 'Content-Type':'application/x-www-form-urlencoded' }; }
    return fetch(u, init);
  };
  let r;
  try{
    r = await send(rdHeaderMode);
    if(!rdHeaderMode && r.status === 401){
      const j = await r.clone().json().catch(() => ({}));
      if(j.error === 'No token'){ rdHeaderMode = true; r = await send(true); }
    }
  }catch(e){ throw new Error('rdblocked'); }
  if(r.status === 401) throw new Error('rdbadkey');
  if(r.status === 403) throw new Error('rddenied');
  if(r.status === 204) return null;
  if(!r.ok){ let msg = 'http ' + r.status; try{ const j = await r.json(); if(j && j.error) msg = String(j.error).replace(/_/g, ' '); }catch(e){} throw new Error(msg); }

// Save what the player reports: episodes it finished on its own, and where you stopped
function applyPlayerResult(r, ctx){

  const byKey = {}; (ctx.queue || []).forEach(q => byKey[q.key] = q);
  let played = r.played; if(typeof played === 'string'){ try{ played = JSON.parse(played); }catch(e){ played = []; } }
  (Array.isArray(played) ? played : []).forEach(p => {
    if(!p || !p.key || !p.finished || done[p.key]) return;
    const q = byKey[p.key];
    finishWatch(p.key, q ? { key:p.key, tid:q.tid, id:meta.id, label:q.label } : meta);
  });
  if(r.lastKey && r.lastKey !== meta.key && byKey[r.lastKey]){
    const q = byKey[r.lastKey];
    link = q.link; meta = { key:q.key, tid:q.tid, id:meta.id, label:q.label };
  }
  const t = (r.positionMs || 0) / 1000, d = (r.durationMs || 0) / 1000;
  const finished = !!(d > 0 && (r.finished || r.ended || t / d >= 0.9));
  if(meta.key && d > 0){
    if(finished){ if(!done[meta.key] || prog[meta.key]) finishWatch(meta.key, meta); }
    else if(t > 5){ prog[meta.key] = { t, d, at:Date.now(), tid:meta.tid, id:meta.id, title, label:meta.label || '', link, ...progMeta(meta) }; saveProg(); }
  }
  store.del(K_INPLAYER); callNative('RCPlayer', 'clearSaved', {}).catch(() => {});
  afterChange(); refreshLibBlocks();
  return { t, d, finished, error:r.error };
}

      o.onSave && o.onSave(v);
      if(o.key === K_KEY && (first || !v)){ built.discover = built.genres = built.tv = false; setView(view); }
      ks.close(); paint(); sheetStack.forEach(x => x.refresh && x.refresh()); toast(v ? `${esc(o.name)} connected` : `${esc(o.name)} disconnected`);
    };
    btn.onclick = async () => {
      const v = $('#ks-in', kb).value.trim(); if(!v){ $('#ks-in', kb).focus(); return; }
      if(!store.set(o.key, v)){ btn.textContent = 'Could not save — storage is full'; return; }
      if(!o.verify){ finish(v, !cur); return; }
      btn.textContent = 'Checking…'; btn.disabled = true;
      try{ await tmdb('/configuration'); finish(v, !cur); }
      catch(err){
        btn.disabled = false;
        if(err.message === 'badkey'){ store.set(o.key, cur); btn.textContent = 'TMDB rejected that key — check it and try again'; }
        else{ btn.textContent = 'Saved (could not check it right now)'; setTimeout(() => finish(v, !cur), 900); }
      }
    };
    const del = $('#ks-del', kb); if(del) del.onclick = () => { store.set(o.key, ''); finish('', false); };
    o.wire && o.wire(kb, ks);
  }
  async function importBackup(ev){
    const f = ev.target.files[0]; if(!f) return;
    try{
      const data = JSON.parse(await f.text());
      const list = Array.isArray(data) ? data : data.entries || [];
      const ids = new Set(entries.map(e => e.id)); let n = 0, rn = 0;
      for(const e of list) if(e && e.id && e.tmdb && e.date && !ids.has(e.id)){ entries.push(e); n++; }
      if(data.watch) for(const [id, w] of Object.entries(data.watch)) if(!watch[id] && !ratings[id]) watch[id] = w;
      if(data.seen) for(const [id, w] of Object.entries(data.seen)) if(!seen[id] && !ratings[id]) seen[id] = w;
      if(data.favs) for(const [id, p] of Object.entries(data.favs)) if(!favs[id]) favs[id] = p;
      if(data.ratings) for(const [id, r] of Object.entries(data.ratings)) if(!ratings[id] || (r.at || 0) > (ratings[id].at || 0)){ ratings[id] = r; rn++; }
      if(!data.ratings) list.forEach(e => { if(e.rating && !ratings[e.tmdb]){ ratings[e.tmdb] = { r:e.rating, title:e.title, year:e.year, poster:e.poster, at:e.added || 0 }; rn++; } });
      saveAll(); afterChange(); paint(); toast(`Restored ${n} diary entr${n === 1 ? 'y' : 'ies'} and ${rn} rating${rn === 1 ? '' : 's'}`);
    }catch(e){ toast('That file is not a Rolling Credits backup.'); }
  }
  paint();
}
