<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c0a0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Reel Log</title>
<link rel="icon" href="../reellog/icon-192.png">
<link rel="apple-touch-icon" href="../reellog/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0c0a0f;--bg2:#141119;--card:#1c1823;--card2:#262030;--line:#30293b;
  --text:#f4efe9;--muted:#9c93a9;--accent:#ffb547;--accent2:#ff6f61;--good:#5ad19a;
  --disp:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overscroll-behavior-y:none}
body{padding-bottom:calc(80px + env(safe-area-inset-bottom))}
body.locked{overflow:hidden}
button{font:inherit;color:inherit}
.disp{font-family:var(--disp);font-weight:700;letter-spacing:-.01em}
svg{display:block}

/* top bar */
.top{position:sticky;top:0;z-index:8;display:flex;align-items:center;justify-content:space-between;
  padding:calc(10px + env(safe-area-inset-top)) 16px 12px;background:linear-gradient(var(--bg) 65%,rgba(12,10,15,0))}
.logo{font-family:var(--disp);font-weight:700;font-size:25px;margin:0;white-space:nowrap;cursor:pointer}
.logo b{color:var(--accent);font-weight:700}
.ib{background:var(--card);border:1px solid var(--line);border-radius:12px;width:40px;height:40px;display:grid;place-items:center;cursor:pointer;color:var(--muted);flex:none}
.ib svg{width:20px;height:20px}
main{max-width:1100px;margin:0 auto}
.vt{font-family:var(--disp);font-weight:700;font-size:34px;line-height:1.05;margin:2px 16px 4px}
.vs{color:var(--muted);margin:0 16px 16px;font-size:14px}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:9;display:flex;justify-content:space-around;
  padding:8px 8px calc(8px + env(safe-area-inset-bottom));background:rgba(20,17,25,.9);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line)}
.tb{flex:1;max-width:120px;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;
  color:var(--muted);font-size:11px;font-weight:650;cursor:pointer;padding:4px 0;position:relative}
.tb svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tb.on{color:var(--accent)}
.tb.on::after{content:"";position:absolute;top:-8px;width:26px;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}

/* hero */
.hero{position:relative;margin:0 16px;border-radius:22px;overflow:hidden;aspect-ratio:16/10;max-height:420px;width:calc(100% - 32px);
  background:var(--card) center/cover no-repeat;cursor:pointer;box-shadow:0 20px 50px rgba(0,0,0,.45)}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(12,10,15,0) 30%,rgba(12,10,15,.92) 100%)}
.hero .hin{position:absolute;left:16px;right:16px;bottom:14px;z-index:1}
.tag{display:inline-block;font-size:11px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:var(--bg);background:var(--accent);border-radius:6px;padding:2px 7px}
.hero h2{font-family:var(--disp);font-weight:700;font-size:30px;line-height:1.05;margin:8px 0 4px;text-shadow:0 2px 12px rgba(0,0,0,.5)}
.hero .hm{color:#d8d0e0;font-size:13px}
.hbtns{display:flex;gap:8px;margin-top:10px}
.pill{border:0;border-radius:999px;padding:9px 16px;font-weight:750;font-size:14px;cursor:pointer;background:var(--accent);color:#1a1206;display:inline-flex;align-items:center;gap:6px}
.pill.ghost{background:rgba(255,255,255,.14);color:var(--text);backdrop-filter:blur(8px)}
.pill.line{background:transparent;border:1px solid var(--line);color:var(--text)}

.searchpill{display:flex;align-items:center;gap:10px;margin:16px;padding:13px 16px;width:calc(100% - 32px);text-align:left;
  background:var(--card);border:1px solid var(--line);border-radius:16px;color:var(--muted);cursor:pointer;font-size:15px}
.searchpill svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2}

/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding:0 16px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar,.track::-webkit-scrollbar{display:none}
.chip{flex:none;background:var(--card);border:1px solid var(--line);color:var(--text);border-radius:999px;padding:7px 13px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--accent);border-color:var(--accent);color:#1a1206}
.chips.dim{opacity:.35;pointer-events:none}

/* rows */
.row{margin-top:26px}
.rowhead{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;padding:0 16px 10px}
.rowhead h3{margin:0;font-family:var(--disp);font-weight:700;font-size:22px;line-height:1.1}
.rowhead p{margin:2px 0 0;color:var(--muted);font-size:12.5px}
.rowhead button{flex:none;background:none;border:0;color:var(--accent);font-size:13px;font-weight:700;cursor:pointer;padding:4px 0}
.track{display:flex;gap:12px;overflow-x:auto;padding:0 16px 6px;scroll-snap-type:x proximity;scrollbar-width:none;min-height:150px}
.track>.pc{flex:none;width:112px;scroll-snap-align:start}
.track>.pc.ranked{width:136px;padding-left:28px}
.track .msg{padding:50px 0}

/* poster card */
.pc{position:relative;cursor:pointer;-webkit-touch-callout:none;user-select:none;-webkit-user-select:none}
.pc .pw{position:relative;transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.pc img,.pc .ph{width:100%;aspect-ratio:2/3;object-fit:cover;border-radius:12px;background:var(--card2);display:block;pointer-events:none;
  box-shadow:0 8px 18px rgba(0,0,0,.35)}
.ph{display:flex!important;align-items:center;justify-content:center;text-align:center;padding:8px;font-size:12px;color:var(--muted)}
.pc.pressing .pw{transform:scale(.93)}
.bd{position:absolute;left:6px;bottom:6px;background:rgba(12,10,15,.82);backdrop-filter:blur(6px);color:var(--accent);
  font-size:12px;font-weight:800;border-radius:7px;padding:2px 6px;pointer-events:none}
.bd:empty{display:none}
.bd.seen{color:var(--good)}
.rk{position:absolute;left:0;bottom:-4px;font-family:var(--disp);font-weight:700;font-size:54px;line-height:1;
  color:var(--bg);-webkit-text-stroke:1.6px var(--accent);pointer-events:none;z-index:0}
.pc.ranked .pw{z-index:1}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:14px 12px}
.grid .pc.ranked{padding-left:0}
.grid .rk{font-size:30px;left:-2px;bottom:auto;top:-8px;z-index:2;color:var(--accent);-webkit-text-stroke:0;text-shadow:0 2px 8px rgba(0,0,0,.8)}

/* saga tiles */
.sagas{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:14px;padding:0 16px}
.saga{background:linear-gradient(160deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:18px;padding:12px 12px 12px;cursor:pointer;
  position:relative;overflow:hidden;user-select:none}
.track>.saga{flex:none;width:172px;scroll-snap-align:start}
.fan{position:relative;height:150px;margin-bottom:10px}
.fan img,.fan .ph{position:absolute;width:84px;aspect-ratio:2/3;object-fit:cover;border-radius:9px;left:50%;bottom:0;background:var(--card2);
  box-shadow:0 10px 20px rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.06)}
.fan>:nth-child(1){transform:translateX(-50%) translateX(-36px) rotate(-11deg);transform-origin:bottom center}
.fan>:nth-child(2){transform:translateX(-50%) translateX(36px) rotate(11deg);transform-origin:bottom center}
.fan>:nth-child(3){transform:translateX(-50%) translateY(-4px);z-index:2}
.sname{font-family:var(--disp);font-weight:700;font-size:17px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.smeta{color:var(--muted);font-size:12px;margin-top:2px;white-space:nowrap}
.bar{height:4px;border-radius:4px;background:var(--line);margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent2),var(--accent));border-radius:4px;transition:width .4s}
.saga.off{opacity:.45}
.sec{margin:26px 16px 12px;font-size:12px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted)}
.findsaga{margin:0 16px 4px;position:relative}
.findsaga input{padding-left:40px}
.findsaga svg{position:absolute;left:13px;top:13px;width:18px;height:18px;fill:none;stroke:var(--muted);stroke-width:2}

/* forms */
input,textarea,select{background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:12px;font:inherit;width:100%}
select{width:auto;padding:7px 10px}
label.f{display:block;color:var(--muted);font-size:13px;margin:14px 0 6px}
.btn{background:var(--accent);color:#1a1206;border:0;border-radius:14px;padding:13px;font-weight:800;font-size:15px;width:100%;cursor:pointer;margin-top:14px}
.btn.ghost{background:var(--card2);color:var(--text)}
.btn.danger{background:transparent;color:var(--accent2);border:1px solid var(--accent2)}
.toggle{display:flex;align-items:center;gap:10px;margin-top:14px}
.toggle input{width:auto;transform:scale(1.3)}
.small{font-size:12px;color:var(--muted)}
.msg{color:var(--muted);text-align:center;padding:24px 10px}
.empty{text-align:center;color:var(--muted);padding:50px 24px}

/* stars */
.s5{display:inline-flex;gap:var(--g,4px);touch-action:none;cursor:pointer;vertical-align:middle}
.st{position:relative;width:var(--sz,30px);height:var(--sz,30px);flex:none}
.st svg{width:100%;height:100%;fill:var(--line)}
.st .f{position:absolute;left:0;top:0;bottom:0;overflow:hidden;width:0}
.st .f svg{width:var(--sz,30px);height:var(--sz,30px);fill:var(--accent)}
.mini{color:var(--accent);font-weight:800;white-space:nowrap;font-size:13px}

/* list rows */
.lrow{display:flex;align-items:center;gap:12px;padding:8px;background:var(--card);border-radius:14px;margin-bottom:8px;cursor:pointer}
.lrow .thumb{width:46px;aspect-ratio:2/3;border-radius:7px;object-fit:cover;background:var(--card2);flex:none}
.li{flex:1;min-width:0}
.lt{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ls{color:var(--muted);font-size:12.5px}
.day{width:34px;text-align:center;flex:none}
.day b{display:block;font-family:var(--disp);font-size:22px;line-height:1}
.day span{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
.rw{font-size:10px;color:var(--good);border:1px solid var(--good);border-radius:4px;padding:0 4px;margin-left:6px;font-weight:700}
.month{font-family:var(--disp);font-weight:700;font-size:20px;margin:22px 0 10px}
.pad{padding:0 16px}

/* stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:0 16px 14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;text-align:center}
.stat b{display:block;font-family:var(--disp);font-size:26px;color:var(--accent);line-height:1.1}
.stat span{font-size:11.5px;color:var(--muted)}
.hist{display:flex;align-items:flex-end;gap:4px;height:64px;margin:0 16px 4px;padding:0 4px}
.hist i{flex:1;background:linear-gradient(var(--accent),var(--accent2));border-radius:4px 4px 0 0;min-height:3px;opacity:.85}
.histl{display:flex;justify-content:space-between;margin:0 20px 16px;font-size:11px;color:var(--muted)}
.toolbar{display:flex;gap:8px;align-items:center;margin:0 16px 12px;color:var(--muted);font-size:13px}

/* sheets */
.sbk{position:fixed;inset:0;background:rgba(5,4,8,.62);opacity:0;transition:opacity .28s}
.sbk.in{opacity:1}
.sh{position:fixed;left:0;right:0;bottom:0;max-width:680px;margin:0 auto;max-height:calc(100dvh - 40px - env(safe-area-inset-top));
  display:flex;flex-direction:column;background:var(--bg2);border-radius:24px 24px 0 0;border:1px solid var(--line);border-bottom:0;
  transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.85,.25,1);box-shadow:0 -20px 50px rgba(0,0,0,.5)}
.sh.in{transform:none}
.sh.tall{height:calc(100dvh - 40px - env(safe-area-inset-top))}
.sh.drag{transition:none}
.grab{flex:none;height:26px;display:grid;place-items:center;cursor:grab;touch-action:none;position:relative;z-index:3}
.grab i{width:44px;height:5px;border-radius:5px;background:#5a5166}
.sbody{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:0 16px calc(24px + env(safe-area-inset-bottom))}
.sh h2.stitle{font-family:var(--disp);font-weight:700;font-size:26px;margin:0 0 12px;line-height:1.1}
.sh .chips{padding:0 0 8px;margin:0 -16px;padding-left:16px;padding-right:16px}

/* movie sheet */
.mvsheet .grab{position:absolute;left:0;right:0;top:0}
.mvsheet .grab i{background:rgba(255,255,255,.7)}
.mvsheet .sbody{padding-top:0}
.bdrop{margin:0 -16px;height:210px;background:var(--card) center/cover no-repeat;position:relative;border-radius:24px 24px 0 0}
.bdrop::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,17,25,.15),var(--bg2) 98%);border-radius:inherit}
.mvhead{display:flex;gap:14px;margin-top:-92px;position:relative;z-index:1;align-items:flex-end}
.mvhead img,.mvhead .ph{width:108px;flex:none;aspect-ratio:2/3;border-radius:12px;object-fit:cover;box-shadow:0 12px 26px rgba(0,0,0,.55);background:var(--card2)}
.mvhead h2{font-family:var(--disp);font-weight:700;font-size:25px;line-height:1.08;margin:0 0 4px}
.meta{color:var(--muted);font-size:13px}
.ratebox{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-top:16px;text-align:center}
.ratebox .lbl{font-size:12px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.ratebox .rv{font-family:var(--disp);font-size:15px;color:var(--muted);margin-top:6px;min-height:20px}
.acts{display:flex;gap:8px;margin-top:12px}
.acts .pill{flex:1;justify-content:center;padding:12px}
.sagachip{display:flex;align-items:center;gap:10px;width:100%;margin-top:12px;padding:12px 14px;border-radius:16px;cursor:pointer;text-align:left;
  background:linear-gradient(120deg,rgba(255,111,97,.18),rgba(255,181,71,.12));border:1px solid rgba(255,181,71,.35)}
.sagachip b{color:var(--accent);margin-left:auto;white-space:nowrap}
.ov{color:#d3cbdb;font-size:14.5px;margin:14px 0 4px}
.hrow{border-top:1px solid var(--line);padding:11px 0;display:flex;justify-content:space-between;align-items:center;cursor:pointer;gap:10px}
.note{white-space:pre-wrap;color:var(--muted);font-size:13px;margin-top:3px}

/* run (stack) */
.runhead{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.runhead h2{font-family:var(--disp);font-weight:700;font-size:24px;margin:0;line-height:1.1}
.prog{color:var(--muted);font-size:12.5px;margin-top:3px}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:3px;flex:none}
.seg button{background:none;border:0;border-radius:7px;padding:5px 10px;font-size:12.5px;font-weight:700;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--card2);color:var(--text)}
.stack{position:relative;margin:18px auto 0;width:min(70vw,300px,calc((100dvh - 360px)/1.5));aspect-ratio:2/3}
.card{position:absolute;inset:0;border-radius:20px;overflow:hidden;background:var(--card2);box-shadow:0 20px 44px rgba(0,0,0,.6);
  transition:transform .32s cubic-bezier(.2,.85,.25,1),opacity .32s;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
.card img{width:100%;height:100%;object-fit:cover;pointer-events:none;display:block}
.card .cap{position:absolute;left:0;right:0;bottom:0;padding:50px 14px 12px;background:linear-gradient(transparent,rgba(8,6,10,.92))}
.card .cap b{display:block;font-family:var(--disp);font-size:21px;line-height:1.1}
.card .cap span{font-size:12.5px;color:#cfc6d8}
.card .num{position:absolute;top:10px;left:10px;background:rgba(12,10,15,.75);border-radius:8px;padding:2px 8px;font-size:12px;font-weight:800;color:var(--accent)}
.card.d1{transform:translateY(16px) scale(.94);opacity:.85}
.card.d2{transform:translateY(30px) scale(.88);opacity:.55}
.card .stamp{position:absolute;top:22px;right:16px;border:3px solid;border-radius:8px;padding:2px 10px;font-weight:900;font-size:18px;letter-spacing:2px;transform:rotate(12deg);opacity:0}
.card .stamp.skip{color:var(--muted);left:16px;right:auto;transform:rotate(-12deg)}
.card .stamp.keep{color:var(--good)}
.runctl{text-align:center;margin-top:30px}
.runctl .rv{font-family:var(--disp);color:var(--muted);height:22px;margin-top:4px}
.runbtns{display:flex;justify-content:center;gap:10px;margin-top:12px}
.runbtns .pill{min-width:120px;justify-content:center}
.hint{font-size:12px;color:var(--muted);text-align:center;margin-top:10px}
.done{text-align:center;padding:10px 0 4px}
.done .big{font-family:var(--disp);font-weight:700;font-size:56px;color:var(--accent);line-height:1}

/* rate pad */
.rp{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;background:rgba(5,4,8,.7);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.rp.on{display:flex}
.rpc{width:min(92vw,380px);background:var(--bg2);border:1px solid var(--line);border-radius:24px;padding:18px;text-align:center;
  box-shadow:0 30px 70px rgba(0,0,0,.6);animation:pop .22s cubic-bezier(.2,.9,.3,1.3)}
@keyframes pop{from{transform:scale(.85);opacity:0}}
.rpc .rph{display:flex;gap:12px;align-items:center;text-align:left;margin-bottom:16px}
.rpc .rph img,.rpc .rph .ph{width:54px;aspect-ratio:2/3;border-radius:8px;object-fit:cover;flex:none;background:var(--card2)}
.rpc .rph b{font-family:var(--disp);font-size:19px;line-height:1.15;display:block}
.rpc .rv{font-family:var(--disp);font-size:17px;color:var(--accent);height:24px;margin-top:8px}
.rpc .hint{margin-top:6px}
.rpbtns{display:flex;gap:8px;margin-top:14px}
.rpbtns .pill{flex:1;justify-content:center}
.rpc.saved{animation:saved .5s ease forwards}
@keyframes saved{50%{transform:scale(1.04)}100%{transform:scale(.9);opacity:0}}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;z-index:70;
  background:#2b2434;border:1px solid var(--line);border-radius:14px;padding:10px 12px 10px 16px;display:flex;align-items:center;gap:14px;
  box-shadow:0 12px 30px rgba(0,0,0,.5);transition:all .25s;pointer-events:none;max-width:calc(100vw - 32px);font-size:14px}
.toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toast button{background:none;border:0;color:var(--accent);font-weight:800;cursor:pointer;flex:none}

.onb{margin:10px 16px;background:linear-gradient(150deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:22px;padding:24px;text-align:center}
.onb h2{font-family:var(--disp);font-size:26px;margin:0 0 8px}
.onb p{color:var(--muted);margin:0 0 6px}

/* marquee type */
.logo,.vt,.disp,.hero h2,.rowhead h3,.sname,.month,.stat b,.mvhead h2,.runhead h2,.card .cap b,.rpc .rph b,.sh h2.stitle,.rk,.done .big,.ratebox .rv,.runctl .rv,.rpc .rv,.day b{font-family:var(--disp);font-weight:700;text-transform:uppercase;letter-spacing:.02em}
.hero h2{font-size:31px}
</style>
</head>
<body>
<header class="top">
  <h1 class="logo" id="logo">Reel <b>Log</b></h1>

<div id="sheets"></div>
<div class="rp" id="rp"></div>
<div class="toast" id="toast"><span></span><button>Undo</button></div>

<script>
/* ================= basics ================= */
const IMG = 'https://image.tmdb.org/t/p/';
const K_LOG = 'reellog.entries', K_RATE = 'reellog.ratings', K_KEY = 'reellog.tmdbkey', CK = 'reellog.c2.';
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); return true; }catch(e){ return false; } },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0,10); };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const fmtR = r => r ? (r % 1 ? r.toFixed(1) : String(r)) : '';
const starTxt = r => r ? '★'.repeat(Math.floor(r)) + (r % 1 ? '½' : '') : '';
const RWORDS = {0.5:'Awful',1:'Bad',1.5:'Poor',2:'Meh',2.5:'Okay',3:'Good',3.5:'Really good',4:'Great',4.5:'Superb',5:'Masterpiece'};

let entries = store.get(K_LOG, []);
let ratings = store.get(K_RATE, null);
if(!ratings){            // migrate ratings from older diary-only data
  ratings = {};
  [...entries].sort((a,b) => a.date.localeCompare(b.date)).forEach(e => {
    if(e.rating) ratings[e.tmdb] = { r:e.rating, title:e.title, year:e.year, poster:e.poster, at:e.added || 0 };
  });
  store.set(K_RATE, ratings);
}
(function prune(){ try{
  for(let i = localStorage.length - 1; i >= 0; i--){
    const k = localStorage.key(i);
    if(k && (k.startsWith('reellog.c.') || (k.startsWith(CK) && Date.now() - (store.get(k,{}).t||0) > 8*86400e3))) localStorage.removeItem(k);
  }
}catch(e){} })();

const saveAll = () => { const a = store.set(K_LOG, entries), b = store.set(K_RATE, ratings); if(!a || !b) toast('Could not save — storage is full or blocked.'); };
const getR = id => ratings[id]?.r || 0;
const logCount = id => entries.filter(e => e.tmdb === id).length;

const GENRES = [[28,'Action'],[12,'Adventure'],[16,'Animation'],[35,'Comedy'],[80,'Crime'],[99,'Documentary'],[18,'Drama'],[10751,'Family'],
  [14,'Fantasy'],[36,'History'],[27,'Horror'],[10402,'Music'],[9648,'Mystery'],[10749,'Romance'],[878,'Sci-Fi'],[53,'Thriller'],[10752,'War'],[37,'Western']];
const GNAME = Object.fromEntries(GENRES);
const DECADES = ['2020s','2010s','2000s','1990s','1980s','1970s','1960s','1950s','Older'];
const SORTS = [['popular','Most popular'],['rated','Highest rated'],['newest','Newest'],['oldest','Oldest']];

const STAR = '<svg viewBox="0 0 24 24"><path d="M12 2.4l2.95 6.1 6.65.8-4.9 4.6 1.3 6.6L12 17.2l-6 3.3 1.3-6.6-4.9-4.6 6.65-.8z"/></svg>';
const SEARCH_SVG = '<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>';

/* ================= TMDB ================= */
const movies = new Map();
const mem = new Map();
async function tmdb(path, params = {}){
  const key = store.get(K_KEY, '');
  if(!key) throw new Error('nokey');
  const url = new URL('https://api.themoviedb.org/3' + path);
  Object.entries(params).forEach(([k,v]) => url.searchParams.set(k, v));
  const opts = {};
  if(key.length > 40) opts.headers = { Authorization:'Bearer ' + key, accept:'application/json' };
  else url.searchParams.set('api_key', key);
  let r;
  try{ r = await fetch(url, opts); }catch(e){ throw new Error('blocked'); }
  if(r.status === 401) throw new Error('badkey');
  if(!r.ok) throw new Error('http ' + r.status);
  return r.json();
}
const errText = e => e.message === 'badkey' ? 'Your TMDB key was rejected. Check it in Settings.'
  : e.message === 'nokey' ? 'Add your TMDB key in Settings.'
  : e.message === 'blocked' ? 'Could not reach TMDB. App previews block outside connections — open Reel Log from its GitHub Pages link.'
  : 'TMDB returned an error (' + esc(e.message) + '). Try again in a minute.';
const slim = m => ({ id:m.id, title:m.title, year:(m.release_date||'').slice(0,4), date:m.release_date||'', poster:m.poster_path,
  backdrop:m.backdrop_path, overview:m.overview||'', genres:m.genre_ids || (m.genres||[]).map(g => g.id), vote:m.vote_average||0 });
function remember(list){ list.forEach(m => { const old = movies.get(m.id); movies.set(m.id, old ? { ...old, ...m } : m); }); }
async function cached(k, ttlH, fn){
  if(mem.has(k)) return mem.get(k);
  const c = store.get(CK + k, null);
  if(c && Date.now() - c.t < ttlH*3600e3){ mem.set(k, c.d); return c.d; }
  const d = await fn();
  mem.set(k, d); store.set(CK + k, { t:Date.now(), d });
  return d;
}
async function listPage(path, params, page){
  const p = { include_adult:'false', ...params, page };
  const k = path + '?' + new URLSearchParams(p);
  const run = async () => {
    const d = await tmdb(path, p);
    return { page:d.page, total:Math.min(d.total_pages||1, 500), results:(d.results||[]).filter(m => m.title).map(slim) };
  };
  const out = page === 1 && !params.query ? await cached(k, 6, run) : (mem.get(k) || await run().then(d => (mem.set(k, d), d)));
  remember(out.results);
  return out;
}
function filmOf(id){
  const m = movies.get(id), r = ratings[id], e = entries.find(x => x.tmdb === id);
  return { id, title:m?.title || r?.title || e?.title || 'Untitled', year:m?.year || r?.year || e?.year || '',
    poster:m?.poster || r?.poster || e?.poster || null, backdrop:m?.backdrop || null };
}
function poster(p, cls = '', size = 'w185', title = ''){
  return p ? `<img class="${cls}" loading="lazy" draggable="false" src="${IMG}${size}${p}" alt="${esc(title)}">`
           : `<div class="${cls} ph">${esc(title)}</div>`;
}

/* ================= stars ================= */
function starsHTML(size = 30, gap = 4){
  return `<div class="s5" style="--sz:${size}px;--g:${gap}px">` + Array(5).fill(`<span class="st">${STAR}<span class="f">${STAR}</span></span>`).join('') + '</div>';
}
function paintStars(el, r){ $$('.st', el).forEach((s, i) => { $('.f', s).style.width = Math.max(0, Math.min(1, r - i)) * 100 + '%'; }); }
function rFromX(el, x){
  const b = el.getBoundingClientRect();
  const v = Math.ceil(((x - b.left) / b.width) * 10) / 2;
  return Math.max(0.5, Math.min(5, v));
}
/* tap or drag across stars; onChange(r, final) */
function bindStars(el, onChange){
  let down = false;
  el.addEventListener('pointerdown', e => { down = true; el.setPointerCapture?.(e.pointerId); onChange(rFromX(el, e.clientX), false); e.preventDefault(); });
  el.addEventListener('pointermove', e => { if(down) onChange(rFromX(el, e.clientX), false); });
  const end = e => { if(!down) return; down = false; onChange(rFromX(el, e.clientX), true); };
  el.addEventListener('pointerup', end);
  el.addEventListener('pointercancel', () => { down = false; });
}

/* ================= rating actions ================= */
let changeHooks = [];
function setRating(f, r, quiet){
  const prev = ratings[f.id] ? { ...ratings[f.id] } : null;
  if(r > 0) ratings[f.id] = { r, title:f.title, year:f.year, poster:f.poster, at:Date.now() };
  else delete ratings[f.id];
  saveAll(); afterChange();
  if(!quiet) toast(r > 0 ? `<span>${starTxt(r)}&nbsp; ${esc(f.title)}</span>` : `<span>Rating removed · ${esc(f.title)}</span>`, () => {
    if(prev) ratings[f.id] = prev; else delete ratings[f.id];
    saveAll(); afterChange();
  });
}
function afterChange(){
  refreshBadges(); refreshTiles();
  sheetStack.forEach(s => s.refresh && s.refresh());
  if(view === 'diary') renderDiary();
  if(view === 'films') renderFilms();
}
function badge(id){
  const r = getR(id);
  if(r) return `${fmtR(r)}★`;
  return logCount(id) ? '✓' : '';
}
function refreshBadges(){
  $$('.pc[data-id]').forEach(el => { const b = $('.bd', el); if(!b) return; const t = badge(+el.dataset.id); b.textContent = t; b.classList.toggle('seen', t === '✓'); });
}
function cardHTML(m, rank){
  const b = badge(m.id);
  return `<div class="pc${rank ? ' ranked' : ''}" data-id="${m.id}">${rank ? `<span class="rk">${rank}</span>` : ''}
    <div class="pw">${poster(m.poster, '', 'w185', m.title)}<span class="bd${b === '✓' ? ' seen' : ''}">${b}</span></div></div>`;
}

/* ================= toast ================= */
let toastT;
function toast(html, undo){
  const t = $('#toast');
  $('span', t).outerHTML = html.startsWith('<span') ? html : `<span>${html}</span>`;
  const b = $('button', t);
  b.style.display = undo ? '' : 'none';
  b.onclick = () => { t.classList.remove('on'); undo && undo(); };
  t.classList.add('on'); clearTimeout(toastT);
  toastT = setTimeout(() => t.classList.remove('on'), 3800);
}

/* ================= sheets ================= */
const sheetStack = [];
let popSkip = 0;
function sheet(html, opt = {}){
  const host = $('#sheets'), z = 30 + sheetStack.length * 2;
  const bk = document.createElement('div'); bk.className = 'sbk'; bk.style.zIndex = z;
  const sh = document.createElement('div'); sh.className = 'sh' + (opt.tall ? ' tall' : '') + (opt.cls ? ' ' + opt.cls : ''); sh.style.zIndex = z + 1;
  sh.innerHTML = `<div class="grab"><i></i></div><div class="sbody">${html}</div>`;
  host.append(bk, sh);
  const s = { el:sh, body:$('.sbody', sh), bk, close:() => closeSheet(s) };
  sheetStack.push(s);
  document.body.classList.add('locked');
  history.pushState({ rl:sheetStack.length }, '');
  requestAnimationFrame(() => requestAnimationFrame(() => { bk.classList.add('in'); sh.classList.add('in'); }));
  bk.onclick = () => s.close();
  makeDraggable(s);
  return s;
}
function closeSheet(s, fromPop){
  const i = sheetStack.indexOf(s); if(i < 0) return;
  // close any sheets above it too
  while(sheetStack.length > i){
    const t = sheetStack.pop();
    t.el.classList.remove('in'); t.el.style.transform = ''; t.bk.classList.remove('in');
    setTimeout(() => { t.el.remove(); t.bk.remove(); }, 330);
    t.onClose && t.onClose();
    if(!fromPop){ popSkip++; history.back(); }
    fromPop = false;
  }
  if(!sheetStack.length) document.body.classList.remove('locked');
}
addEventListener('popstate', () => {
  if(popSkip){ popSkip--; return; }
  if(rp.on){ closeRatepad(); history.pushState({ rl:sheetStack.length }, ''); return; }
  if(sheetStack.length) closeSheet(sheetStack[sheetStack.length - 1], true);
});
function makeDraggable(s){
  const sh = s.el, body = s.body;
  let y0, x0, t0, dy = 0, dragging = false, can = false, decided = false;
  const start = (x, y, target) => {
    x0 = x; y0 = y; t0 = Date.now(); dy = 0; dragging = false; decided = false;
    can = !!target.closest('.grab') || (body.scrollTop <= 0 && !target.closest('.nodrag'));
  };
  const move = (x, y, ev) => {
    if(!can) return;
    const ddy = y - y0, ddx = x - x0;
    if(!decided){
      if(Math.abs(ddy) < 7 && Math.abs(ddx) < 7) return;
      decided = true;
      dragging = ddy > 0 && Math.abs(ddy) > Math.abs(ddx);
      if(dragging) sh.classList.add('drag');
    }
    if(!dragging) return;
    ev && ev.cancelable && ev.preventDefault();
    dy = Math.max(0, ddy);
    sh.style.transform = `translateY(${dy}px)`;
    s.bk.style.opacity = String(Math.max(0, 1 - dy / 500));
  };
  const end = () => {
    if(!dragging) return;
    dragging = false; sh.classList.remove('drag'); s.bk.style.opacity = '';
    const v = dy / Math.max(1, Date.now() - t0);
    if(dy > 120 || (dy > 40 && v > 0.6)) s.close();
    else sh.style.transform = '';
  };
  sh.addEventListener('touchstart', e => { if(e.touches.length === 1) start(e.touches[0].clientX, e.touches[0].clientY, e.target); }, { passive:true });
  sh.addEventListener('touchmove', e => { if(e.touches.length === 1) move(e.touches[0].clientX, e.touches[0].clientY, e); }, { passive:false });
  sh.addEventListener('touchend', end);
  sh.addEventListener('touchcancel', end);
  const g = $('.grab', sh);
  g.addEventListener('pointerdown', e => { if(e.pointerType !== 'mouse') return; g.setPointerCapture(e.pointerId); start(e.clientX, e.clientY, g); });
  g.addEventListener('pointermove', e => { if(e.pointerType === 'mouse' && e.buttons) move(e.clientX, e.clientY); });
  g.addEventListener('pointerup', e => { if(e.pointerType === 'mouse') end(); });
}

/* ================= long-press rate pad ================= */
const rp = { on:false, tracking:false, moved:false, r:0, film:null, startX:0 };
let lp = null, suppressClick = 0;
document.addEventListener('contextmenu', e => { if(e.target.closest('.pc,.card,.saga')) e.preventDefault(); });
document.addEventListener('pointerdown', e => {
  const pc = e.target.closest('.pc[data-id]');
  if(!pc || e.button > 0 || rp.on) return;
  lp = { pc, x:e.clientX, y:e.clientY, fired:false };
  pc.classList.add('pressing');
  lp.timer = setTimeout(() => {
    if(!lp) return;
    lp.fired = true; pc.classList.remove('pressing');
    navigator.vibrate && navigator.vibrate(14);
    openRatepad(+pc.dataset.id, true, lp.x);
  }, 420);
});
document.addEventListener('pointermove', e => {
  if(lp && !lp.fired && Math.hypot(e.clientX - lp.x, e.clientY - lp.y) > 9){ clearTimeout(lp.timer); lp.pc.classList.remove('pressing'); lp = null; }
  if(rp.on && rp.tracking && e.pointerType === 'mouse') rpTrack(e.clientX);
});
const lpEnd = () => {
  if(!lp) return;
  clearTimeout(lp.timer); lp.pc.classList.remove('pressing');
  if(lp.fired){ suppressClick = Date.now(); rpRelease(); }
  lp = null;
};
document.addEventListener('pointerup', lpEnd);
document.addEventListener('pointercancel', () => { if(lp && !lp.fired){ clearTimeout(lp.timer); lp.pc.classList.remove('pressing'); lp = null; } });
document.addEventListener('touchmove', e => { if(rp.on && rp.tracking){ e.preventDefault(); rpTrack(e.touches[0].clientX); } }, { passive:false });
document.addEventListener('touchend', () => { if(rp.on && rp.tracking){ suppressClick = Date.now(); rpRelease(); lp = null; } });

function openRatepad(id, tracking, x){
  const f = filmOf(id), cur = getR(id), el = $('#rp');
  Object.assign(rp, { on:true, tracking, moved:false, r:cur, film:f, startX:x || 0 });
  el.innerHTML = `<div class="rpc" id="rpc">
    <div class="rph">${poster(f.poster, '', 'w92', f.title)}<div><b>${esc(f.title)}</b><span class="small">${esc(f.year)}${cur ? ' · you gave it ' + fmtR(cur) + '★' : ''}</span></div></div>
    ${starsHTML(46, 6)}
    <div class="rv" id="rpv">${cur ? esc(RWORDS[cur]) : ''}</div>
    <div class="hint" id="rph">${tracking ? 'Slide across the stars, let go to save' : 'Tap a star — tap its left half for ½'}</div>
    <div class="rpbtns"><button class="pill line" id="rpd">Details</button><button class="pill line" id="rpl">Log a watch</button>
      ${cur ? '<button class="pill line" id="rpx">Clear</button>' : ''}</div></div>`;
  el.classList.add('on');
  const s5 = $('.s5', el); paintStars(s5, cur);
  bindStars(s5, (r, fin) => { if(rp.tracking) return; rp.r = r; paintStars(s5, r); $('#rpv').textContent = RWORDS[r]; if(fin) commitRatepad(); });
  el.onclick = e => { if(e.target === el) closeRatepad(); };
  $('#rpd').onclick = () => { closeRatepad(); openMovie(id); };
  $('#rpl').onclick = () => { closeRatepad(); openLog(f); };
  const x2 = $('#rpx'); if(x2) x2.onclick = () => { closeRatepad(); setRating(f, 0); };
}
function rpTrack(x){
  if(!rp.moved && Math.abs(x - rp.startX) < 12) return;
  rp.moved = true;
  const s5 = $('#rp .s5'); if(!s5) return;
  const r = rFromX(s5, x);
  if(r !== rp.r){ rp.r = r; paintStars(s5, r); $('#rpv').textContent = RWORDS[r]; navigator.vibrate && navigator.vibrate(4); }
}
function rpRelease(){
  if(!rp.on || !rp.tracking) return;
  rp.tracking = false;
  if(rp.moved && rp.r) commitRatepad();
  else { const h = $('#rph'); if(h) h.textContent = 'Tap a star — tap its left half for ½'; }
}
function commitRatepad(){
  const f = rp.film, r = rp.r;
  $('#rpc').classList.add('saved');
  setTimeout(() => { closeRatepad(); setRating(f, r); }, 380);
}
function closeRatepad(){ rp.on = false; rp.tracking = false; $('#rp').classList.remove('on'); $('#rp').innerHTML = ''; }

/* ================= global clicks ================= */
document.addEventListener('click', e => {
  if(Date.now() - suppressClick < 500){ e.preventDefault(); e.stopPropagation(); return; }
  const pc = e.target.closest('.pc[data-id]'); if(pc){ openMovie(+pc.dataset.id); return; }
  const sg = e.target.closest('[data-saga]'); if(sg){ const s = sagaByK(sg.dataset.saga); if(s) openRun(s); return; }
  const all = e.target.closest('[data-all]'); if(all){ openSeeAll(ROWS[+all.dataset.all]); return; }
  const go = e.target.closest('[data-go]'); if(go){ setView(go.dataset.go); return; }
}, true);

/* ================= views ================= */
let view = 'discover';
const built = {};
function setView(v){
  view = v;
  $$('.tb').forEach(t => t.classList.toggle('on', t.dataset.v === v));
  ['discover','sagas','diary','films'].forEach(n => $('#v-' + n).hidden = n !== v);
  if(v === 'discover' && !built.discover) buildDiscover();
  if(v === 'sagas' && !built.sagas) buildSagas();
  if(v === 'diary') renderDiary();
  if(v === 'films') renderFilms();
  scrollTo(0, 0);
}
$$('.tb').forEach(t => t.onclick = () => setView(t.dataset.v));
$('#logo').onclick = () => setView('discover');
$('#setBtn').onclick = openSettings;

/* ---------- Discover ---------- */
const ROWS = [
  { title:'Top 100 of all time', sub:'Ranked by TMDB voters', path:'/movie/top_rated', ranked:true, max:100 },
  { title:'Trending this week', path:'/trending/movie/week' },
  { title:'Popular right now', path:'/movie/popular' },
  { title:'In theaters', path:'/movie/now_playing' },
  { title:'Coming soon', path:'/movie/upcoming' },
  ...GENRES.map(([id, name]) => ({ title:name, path:'/discover/movie', params:{ with_genres:id, sort_by:'popularity.desc', 'vote_count.gte':150 } }))
];
let rowObs;
function buildDiscover(){
  const v = $('#v-discover');
  if(!store.get(K_KEY, '')){
    built.discover = false;
    v.innerHTML = `<div class="onb"><h2>Your film catalog awaits</h2><p>Reel Log pulls every film and poster from TMDB. Add your free key once to switch it on.</p>
      <button class="btn" id="needKey">Add TMDB key</button></div>`;
    $('#needKey').onclick = openSettings;
    return;
  }
  built.discover = true;
  v.innerHTML = `<div class="hero" id="hero"></div>
    <button class="searchpill" id="sp">${SEARCH_SVG}Search any film, or browse by genre & decade</button>
    <div class="chips">${GENRES.map(([id, n]) => `<button class="chip" data-g="${id}">${n}</button>`).join('')}</div>
    ${rowHTML(0)}
    <section class="row"><div class="rowhead"><div><h3>Saga Runs</h3><p>Stack up a whole franchise and rate it card by card</p></div><button data-go="sagas">All sagas</button></div>

async function loadRow(sec){
  const def = ROWS[+sec.dataset.row], track = $('.track', sec);
  let page = 0, total = 1, busy = false, n = 0;
  const more = async () => {
    if(busy || page >= total || (def.max && n >= def.max)) return;
    busy = true;
    try{
      const d = await listPage(def.path, def.params || {}, page + 1);
      if(page === 0) track.innerHTML = '';
      page = d.page; total = d.total;
      let list = d.results; if(def.max) list = list.slice(0, def.max - n);
      track.insertAdjacentHTML('beforeend', list.map(m => cardHTML(m, def.ranked ? ++n : (n++, 0))).join(''));
    }catch(e){ if(page === 0) track.innerHTML = `<div class="msg">${errText(e)}</div>`; }
    busy = false;
  };
  track.onscroll = () => { if(track.scrollLeft + track.clientWidth > track.scrollWidth - 500) more(); };
  await more();
}

/* generic infinite grid inside a sheet or page */
function feed(root, grid, sent, msgEl, def){
  const gen = (grid._gen = (grid._gen || 0) + 1);
  grid.innerHTML = ''; msgEl.textContent = 'Loading…';
  let page = 0, total = 1, busy = false, n = 0;
  const more = async () => {
    if(gen !== grid._gen || busy || page >= total || (def.max && n >= def.max)) return;
    busy = true;
    try{
      const d = await listPage(def.path, def.params || {}, page + 1);
      if(gen !== grid._gen) return;
      page = d.page; total = d.total;
      let list = d.results; if(def.max) list = list.slice(0, def.max - n);
      grid.insertAdjacentHTML('beforeend', list.map(m => cardHTML(m, def.ranked ? ++n : (n++, 0))).join(''));
      const end = page >= total || (def.max && n >= def.max);
      msgEl.textContent = end ? (n ? '' : 'No films found.') : '';
    }catch(e){ if(gen === grid._gen) msgEl.innerHTML = errText(e); }
    busy = false;
    if(gen === grid._gen && sent.getBoundingClientRect().top < innerHeight + 600) more();
  };
  grid._obs?.disconnect();
  grid._obs = new IntersectionObserver(es => { if(es[0].isIntersecting) more(); }, { root, rootMargin:'600px 0px' });
  grid._obs.observe(sent);
  more();
}
function openSeeAll(def){

    <div class="grid"></div><div class="sent" style="height:30px"></div><div class="msg"></div>`, { tall:true });
  feed(s.body, $('.grid', s.body), $('.sent', s.body), $('.msg', s.body), def);
}

function discoverDef(f){
  const p = { 'vote_count.gte':50 }, label = [];
  if(f.genre){ p.with_genres = f.genre; label.push(GNAME[f.genre]); }
  let lte = null;
  if(f.decade){
    label.push(f.decade);
    if(f.decade === 'Older') lte = '1949-12-31';
    else { const y = +f.decade.slice(0, 4); p['primary_release_date.gte'] = `${y}-01-01`; lte = `${y + 9}-12-31`; }
  }
  if(lte) p['primary_release_date.lte'] = lte;
  if(f.sort === 'popular') p.sort_by = 'popularity.desc';
  if(f.sort === 'rated'){ p.sort_by = 'vote_average.desc'; p['vote_count.gte'] = 300; }
  if(f.sort === 'newest'){ p.sort_by = 'primary_release_date.desc'; p['vote_count.gte'] = 20; p['primary_release_date.lte'] = lte && lte < today() ? lte : today(); }

  return { title:label.join(' · '), path:'/discover/movie', params:p };

async function resolveCollection(name){
  return cached('colid:' + name, 24*30, async () => {
    const d = await tmdb('/search/collection', { query:name.replace(/ Collection$/, '') });
    const res = d.results || [];
    const hit = res.find(r => r.name.toLowerCase() === name.toLowerCase()) || res[0];
    return hit ? hit.id : null;
  });
}
async function resolveKeyword(name){
  return cached('kwid:' + name, 24*30, async () => {
    const d = await tmdb('/search/keyword', { query:name.replace(/\s*\(.*\)$/, '') });
    const res = d.results || [];
    const hit = res.find(r => r.name.toLowerCase() === name.toLowerCase()) || res.find(r => r.name.toLowerCase().startsWith(name.split(' (')[0].toLowerCase())) || res[0];
    return hit ? hit.id : null;
  });
}
function loadSaga(s){
  if(sagaData[s.k]) return sagaData[s.k];
  sagaData[s.k] = cached('saga:' + s.k, 24*7, async () => {
    let films = [];
    if(s.kw){
      const id = await resolveKeyword(s.kw);
      if(id){
        let page = 1, total = 1;
        do{
          const d = await tmdb('/discover/movie', { with_keywords:id, sort_by:'primary_release_date.asc', include_adult:'false', 'with_runtime.gte':60, page });
          films.push(...d.results.map(slim)); total = Math.min(d.total_pages || 1, 5); page++;
        }while(page <= total);
      }
    }
    for(const c of (s.col || [])){
      const id = await resolveCollection(c).catch(() => null);
      if(!id) continue;
      const d = await tmdb('/collection/' + id).catch(() => null);
      if(d) films.push(...(d.parts || []).map(slim));
    }
    for(const id of (s.cid || [])){
      const d = await tmdb('/collection/' + id);
      films.push(...(d.parts || []).map(slim));
    }
    const seen = new Set();
    films = films.filter(f => f.title && !seen.has(f.id) && seen.add(f.id))
      .map(({ overview, ...f }) => f)
      .sort((a, b) => (a.date || '9999').localeCompare(b.date || '9999'));
    return films;
  }).then(f => { remember(f); return f; }).catch(e => { delete sagaData[s.k]; throw e; });
  return sagaData[s.k];
}

    $$('.lrow', box).forEach(r => r.onclick = () => openMovie(+r.dataset.f));

  function renderStack(){

    box.innerHTML = `<div class="stack nodrag">${cards.map((f, n) => `<div class="card d${n}" data-n="${n}">

      <div class="runctl nodrag">${starsHTML(42, 6)}<div class="rv" id="rrv"></div>
        <div class="runbtns"><button class="pill line" id="rundo" ${histI.length ? '' : 'disabled style="opacity:.4"'}>↶ Back</button><button class="pill line" id="rskip">Haven't seen →</button></div>
        <div class="hint">Tap or slide the stars to rate · swipe the card to skip</div></div>`;
    paintTop();

  }
  function dragCard(card){
    if(!card) return;
    let x0, y0, dx = 0, down = false, moved = false;
    card.addEventListener('pointerdown', e => { down = true; moved = false; x0 = e.clientX; y0 = e.clientY; dx = 0; card.setPointerCapture(e.pointerId); card.style.transition = 'none'; });
    card.addEventListener('pointermove', e => {

    });
    const up2 = () => {
      if(!down) return; down = false; card.style.transition = '';
      if(Math.abs(dx) > 90) advance(dx > 0 ? 1 : -1);
      else { card.style.transform = ''; $$('.stamp', card).forEach(x => x.style.opacity = 0); if(!moved) openMovie(rel[i].id); }
    };
    card.addEventListener('pointerup', up2);
    card.addEventListener('pointercancel', () => { down = false; card.style.transition = ''; card.style.transform = ''; });
  }
  function advance(dir){
    const box = $('#rbody', b), top = $('.card.d0', box);
    if(!top || top._gone) return;
    top._gone = true;
    top.style.transition = 'transform .35s ease-in, opacity .35s';
    top.style.transform = `translate(${dir * 130}%, -4%) rotate(${dir * 22}deg)`; top.style.opacity = 0;
    $$('.card.d1', box).forEach(c => { c.style.transform = 'none'; c.style.opacity = 1; });
    $$('.card.d2', box).forEach(c => { c.style.transform = 'translateY(16px) scale(.94)'; c.style.opacity = .85; });
    histI.push(i); i++;
    setTimeout(render, 300);
  }
  function renderDone(){
    const box = $('#rbody', b), rated = rel.filter(f => getR(f.id));
    const avg = rated.length ? rated.reduce((a, f) => a + getR(f.id), 0) / rated.length : 0;
    const best = [...rated].sort((a, c) => getR(c.id) - getR(a.id))[0];
    box.innerHTML = `<div class="done"><div class="small" style="letter-spacing:1.4px;font-weight:800;text-transform:uppercase">Saga complete</div>
      <div class="big">${avg ? avg.toFixed(1) + '★' : '—'}</div><div class="small">your average across ${rated.length} of ${rel.length} films</div>
      ${best ? `<p style="margin:14px 0 4px">Your favorite: <b>${esc(best.title)}</b> <span class="mini">${starTxt(getR(best.id))}</span></p>` : ''}</div>
      <div style="margin-top:12px">${rel.map(f => `<div class="lrow" data-f="${f.id}">${poster(f.poster, 'thumb', 'w92', f.title)}
        <div class="li"><div class="lt">${esc(f.title)}</div><div class="ls">${esc(f.year)}</div></div><span class="mini">${starTxt(getR(f.id)) || '<span class="small">skipped</span>'}</span></div>`).join('')}</div>
      <div class="acts"><button class="pill line" id="ragain">Run it again</button><button class="pill" id="rclose">Done</button></div>`;
    $$('.lrow', box).forEach(r => r.onclick = () => openMovie(+r.dataset.f));
    $('#ragain', box).onclick = () => { i = 0; histI = []; render(); };
    $('#rclose', box).onclick = () => s.close();
  }
  loadSaga(saga).then(f => {
    films = f; rel = films.filter(released); up = films.filter(x => !released(x));
    if(!rel.length){ $('#rbody', b).innerHTML = '<div class="msg">No released films found for this series.</div>'; setProg(); return; }
    i = rel.findIndex(x => !getR(x.id)); if(i < 0) i = rel.length;
    render(); fillTile(saga.k);
  }).catch(e => { $('#rbody', b).innerHTML = `<div class="msg">${e && e.message ? errText(e) : 'Could not find this series.'}</div>`; $('#rprog', b).textContent = ''; });
}

/* ---------- Movie sheet ---------- */
async function openMovie(id){
  const f = filmOf(id), m = movies.get(id) || {};
  const s = sheet(`<div class="bdrop" style="${f.backdrop || m.backdrop ? `background-image:url(${IMG}w780${f.backdrop || m.backdrop})` : ''}"></div>
    <div class="mvhead">${poster(f.poster, '', 'w342', f.title)}<div><h2>${esc(f.title)}</h2><div class="meta" id="mm">${esc(f.year)}</div><div class="meta" id="md"></div></div></div>
    <div class="ratebox nodrag"><div class="lbl">Your rating</div>${starsHTML(40, 6)}<div class="rv" id="mrv"></div></div>
    <div class="acts"><button class="pill" id="mlog">＋ Log a watch</button><button class="pill line" id="mclr">Clear rating</button></div>
    <div id="msaga"></div><p class="ov" id="mov">${esc(m.overview || '')}</p><div class="small" id="mvote"></div><div id="mhist" style="margin-top:14px"></div>`, { tall:true, cls:'mvsheet' });
  const b = s.body, s5 = $('.ratebox .s5', b);
  const paint = () => {
    const r = getR(id); paintStars(s5, r);
    $('#mrv', b).textContent = r ? `${fmtR(r)} — ${RWORDS[r]}` : 'Tap or slide to rate';
    $('#mclr', b).style.display = r ? '' : 'none';
    const logs = entries.filter(e => e.tmdb === id).sort((a, c) => c.date.localeCompare(a.date) || c.added - a.added);
    $('#mhist', b).innerHTML = logs.length ? `<div class="sec" style="margin:4px 0 4px">Your watches</div>` + logs.map(l => `<div class="hrow" data-e="${l.id}">
      <div><div>${new Date(l.date + 'T12:00').toLocaleDateString(undefined, { month:'short', day:'numeric', year:'numeric' })}${l.rewatch ? '<span class="rw">REWATCH</span>' : ''}</div>
      ${l.note ? `<div class="note">${esc(l.note)}</div>` : ''}</div><span class="mini">${starTxt(l.rating)}</span></div>`).join('') : '';
    $$('#mhist .hrow', b).forEach(h => h.onclick = () => openEntry(h.dataset.e));
  };
  s.refresh = paint; paint();
  bindStars(s5, (r, fin) => {
    paintStars(s5, r); $('#mrv', b).textContent = `${fmtR(r)} — ${RWORDS[r]}`;
    if(fin && r !== getR(id)) setRating(filmOf(id), r);
  });
  $('#mlog', b).onclick = () => openLog(filmOf(id));
  $('#mclr', b).onclick = () => setRating(filmOf(id), 0);
  try{
    const d = await cached('movie:' + id, 24*3, () => tmdb('/movie/' + id, { append_to_response:'credits' }).then(x => ({
      ...slim(x), runtime:x.runtime, gnames:(x.genres || []).map(g => g.name),
      director:((x.credits && x.credits.crew) || []).filter(c => c.job === 'Director').map(c => c.name).slice(0, 2).join(', '),
      cast:((x.credits && x.credits.cast) || []).slice(0, 4).map(c => c.name).join(', '),
      col:x.belongs_to_collection ? { id:x.belongs_to_collection.id, name:x.belongs_to_collection.name } : null })));
    remember([d]);
    if(!s.el.isConnected) return;
    if(d.backdrop) $('.bdrop', b).style.backgroundImage = `url(${IMG}w780${d.backdrop})`;
    const rt = d.runtime ? `${Math.floor(d.runtime / 60)}h ${d.runtime % 60}m` : '';
    $('#mm', b).textContent = [d.year, rt, d.gnames.slice(0, 3).join(', ')].filter(Boolean).join(' · ');
    $('#md', b).textContent = d.director ? 'Directed by ' + d.director : '';
    $('#mov', b).textContent = d.overview;
    $('#mvote', b).textContent = [d.cast ? 'Starring ' + d.cast : '', d.vote ? `TMDB average ${d.vote.toFixed(1)}/10` : ''].filter(Boolean).join(' · ');
    if(d.col){
      $('#msaga', b).innerHTML = `<button class="sagachip"><span>Part of <b style="color:var(--text);margin:0">${esc(d.col.name.replace(/ Collection$/, ''))}</b></span><b>Run the saga →</b></button>`;
      $('#msaga .sagachip', b).onclick = () => openCollectionRun(d.col.id, d.col.name);
    }
  }catch(e){ if(!m.overview && s.el.isConnected) $('#mov', b).innerHTML = `<span class="small">${errText(e)}</span>`; }
}

/* ---------- Log sheet ---------- */
function openLog(film, existing){
  const e = existing || { date:today(), rating:getR(film.id), rewatch:logCount(film.id) > 0, note:'' };
  let rating = e.rating || 0;
  const s = sheet(`<div style="display:flex;gap:14px;align-items:center;margin-bottom:6px">${poster(film.poster, 'thumb', 'w92', film.title)}
      <div><h2 class="stitle" style="margin:0">${esc(film.title)}</h2><div class="small">${esc(film.year || '')}</div></div></div>
    <label class="f">Watched on</label><input type="date" id="dt" value="${e.date}" max="${today()}">
    <label class="f">Rating for this watch</label><div class="nodrag" style="display:flex;align-items:center;gap:12px">${starsHTML(36, 5)}<button class="pill line" id="clr" style="padding:6px 12px">Clear</button></div>
    <label class="toggle"><input type="checkbox" id="rw" ${e.rewatch ? 'checked' : ''}> Rewatch</label>
    <label class="f">Note (optional)</label><textarea id="nt" rows="2">${esc(e.note || '')}</textarea>
    <button class="btn" id="sv">${existing ? 'Save changes' : 'Log it'}</button>
    ${existing ? '<button class="btn danger" id="del">Delete entry</button>' : ''}`);
  const b = s.body, s5 = $('.s5', b);
  paintStars(s5, rating);
  bindStars(s5, r => { rating = r; paintStars(s5, r); });
  $('#clr', b).onclick = () => { rating = 0; paintStars(s5, 0); };
  $('#sv', b).onclick = () => {
    const rec = { ...(existing || { id:uid(), added:Date.now() }), tmdb:film.id, title:film.title, year:film.year, poster:film.poster,
      date:$('#dt', b).value || today(), rating, rewatch:$('#rw', b).checked, note:$('#nt', b).value.trim() };
    if(existing) entries = entries.map(x => x.id === rec.id ? rec : x); else entries.push(rec);
    // newest diary entry with a rating sets the film's rating
    const latest = entries.filter(x => x.tmdb === film.id && x.rating).sort((a, c) => c.date.localeCompare(a.date) || c.added - a.added)[0];
    if(latest && latest.id === rec.id) ratings[film.id] = { r:rating, title:film.title, year:film.year, poster:film.poster, at:Date.now() };
    saveAll(); s.close(); afterChange(); toast(existing ? 'Entry updated' : `Logged · ${esc(film.title)}`);
  };
  if(existing) $('#del', b).onclick = () => {
    if(confirm('Delete this diary entry?')){ entries = entries.filter(x => x.id !== existing.id); saveAll(); s.close(); afterChange(); }
  };
}
function openEntry(id){
  const e = entries.find(x => x.id === id); if(!e) return;
  openLog({ id:e.tmdb, title:e.title, year:e.year, poster:e.poster }, e);
}

/* ---------- Diary ---------- */
function renderDiary(){
  const v = $('#v-diary');
  const head = `<h2 class="vt">Diary</h2><p class="vs">Every watch, by date.</p>`;
  if(!entries.length){ v.innerHTML = head + `<div class="empty">Nothing logged yet.<br>Open any film and tap “Log a watch”.</div>`; return; }
  const sorted = [...entries].sort((a, b) => b.date.localeCompare(a.date) || b.added - a.added);
  let html = head + '<div class="pad">', cur = '';
  for(const e of sorted){
    const [y, mo, d] = e.date.split('-');
    const dt = new Date(+y, +mo - 1, +d);
    const label = dt.toLocaleString(undefined, { month:'long', year:'numeric' });
    if(label !== cur){ html += `<div class="month">${label}</div>`; cur = label; }
    html += `<div class="lrow" data-e="${e.id}"><div class="day"><b>${+d}</b><span>${dt.toLocaleString(undefined, { weekday:'short' })}</span></div>
      ${poster(e.poster, 'thumb', 'w92', e.title)}<div class="li"><div class="lt">${esc(e.title)}</div>
      <div class="ls">${esc(e.year || '')}${e.rewatch ? '<span class="rw">REWATCH</span>' : ''}${e.note ? ' · ' + esc(e.note.slice(0, 40)) : ''}</div></div>
      <span class="mini">${starTxt(e.rating)}</span></div>`;
  }
  v.innerHTML = html + '</div>';
  $$('.lrow', v).forEach(r => r.onclick = () => openEntry(r.dataset.e));
}

/* ---------- My Films ---------- */
let filmSort = 'recent';
function renderFilms(){
  const v = $('#v-films');
  const map = new Map();
  Object.entries(ratings).forEach(([id, r]) => map.set(+id, { id:+id, title:r.title, year:r.year, poster:r.poster, r:r.r, at:r.at || 0 }));
  entries.forEach(e => {
    const f = map.get(e.tmdb) || { id:e.tmdb, title:e.title, year:e.year, poster:e.poster, r:0, at:0 };
    f.at = Math.max(f.at, e.added || 0); map.set(e.tmdb, f);
  });
  const films = [...map.values()];
  const rated = films.filter(f => f.r), avg = rated.length ? rated.reduce((a, f) => a + f.r, 0) / rated.length : 0;
  const yr = String(new Date().getFullYear());
  const counts = Array(10).fill(0); rated.forEach(f => counts[f.r * 2 - 1]++);
  const mx = Math.max(1, ...counts);
  const sorter = { recent:(a, b) => b.at - a.at, rating:(a, b) => b.r - a.r || b.at - a.at, title:(a, b) => a.title.localeCompare(b.title), year:(a, b) => (b.year || 0) - (a.year || 0) }[filmSort];
  films.sort(sorter);
  v.innerHTML = `<h2 class="vt">My Films</h2><p class="vs">Everything you've rated or logged. Hold a poster to change its rating.</p>
    <div class="stats"><div class="stat"><b>${films.length}</b><span>Films</span></div><div class="stat"><b>${avg ? avg.toFixed(1) : '–'}</b><span>Avg rating</span></div>
      <div class="stat"><b>${entries.filter(e => e.date.startsWith(yr)).length}</b><span>Watches in ${yr}</span></div></div>
    ${rated.length ? `<div class="hist">${counts.map(c => `<i style="height:${c / mx * 100}%" title="${c}"></i>`).join('')}</div><div class="histl"><span>½★</span><span>★★★★★</span></div>` : ''}
    ${films.length ? `<div class="toolbar"><span style="flex:1"></span>Sort <select id="fs"><option value="recent">Recently added</option><option value="rating">Your rating</option><option value="title">Title</option><option value="year">Release year</option></select></div>
    <div class="grid pad">${films.map(f => cardHTML(f)).join('')}</div>` : '<div class="empty">Nothing yet. Hold any poster to rate it, or start a Saga Run.</div>'}`;
  const sel = $('#fs'); if(sel){ sel.value = filmSort; sel.onchange = () => { filmSort = sel.value; renderFilms(); }; }
}

/* ---------- Settings ---------- */
function openSettings(){
  const hadKey = !!store.get(K_KEY, '');
  const s = sheet(`<h2 class="stitle">Settings</h2>
    <label class="f">TMDB API key or read access token</label>
    <input id="key" value="${esc(store.get(K_KEY, ''))}" placeholder="Paste your key" autocomplete="off">
    <div class="small" style="margin-top:6px">Free at themoviedb.org → Settings → API.</div>
    <button class="btn" id="saveKey">Save key</button>
    <label class="f">Backup</label>
    <button class="btn ghost" id="exp" style="margin-top:0">Export ratings & diary (.json)</button>
    <button class="btn ghost" id="imp">Import backup</button>
    <input type="file" id="file" accept=".json,application/json" hidden>
    <p class="small" style="margin-top:18px">Film data and posters from TMDB. This product uses the TMDB API but is not endorsed or certified by TMDB.</p>`);
  const b = s.body;
  $('#saveKey', b).onclick = async () => {
    const k = $('#key', b).value.trim(); store.set(K_KEY, k);
    const done = () => { s.close(); if(!hadKey || !k){ built.discover = built.sagas = false; setView(view); } };
    if(!k){ done(); return; }
    $('#saveKey', b).textContent = 'Checking…';
    try{ await tmdb('/configuration'); done(); }
    catch(err){
      $('#saveKey', b).textContent = err.message === 'badkey' ? 'Key rejected — try again' : 'Saved (could not verify)';
      if(err.message !== 'badkey') setTimeout(done, 900);
    }
  };
  $('#exp', b).onclick = () => {
    const blob = new Blob([JSON.stringify({ app:'reellog', v:2, entries, ratings }, null, 1)], { type:'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = `reellog-${today()}.json`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  };
  $('#imp', b).onclick = () => $('#file', b).click();
  $('#file', b).onchange = async ev => {
    const f = ev.target.files[0]; if(!f) return;
    try{
      const data = JSON.parse(await f.text());
      const list = Array.isArray(data) ? data : data.entries || [];
      const ids = new Set(entries.map(e => e.id)); let n = 0, rn = 0;
      for(const e of list) if(e && e.id && e.tmdb && e.date && !ids.has(e.id)){ entries.push(e); n++; }
      if(data.ratings) for(const [id, r] of Object.entries(data.ratings)) if(!ratings[id] || (r.at || 0) > (ratings[id].at || 0)){ ratings[id] = r; rn++; }
      if(!data.ratings) list.forEach(e => { if(e.rating && !ratings[e.tmdb]){ ratings[e.tmdb] = { r:e.rating, title:e.title, year:e.year, poster:e.poster, at:e.added || 0 }; rn++; } });
      saveAll(); s.close(); afterChange(); toast(`Imported ${n} diary entr${n === 1 ? 'y' : 'ies'} and ${rn} rating${rn === 1 ? '' : 's'}`);
    }catch(e){ toast('That file is not a Reel Log backup.'); }
  };
}
