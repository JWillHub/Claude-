<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c0a0f">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Rolling Credits</title>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rolling Credits">
<link rel="icon" href="../reel-log/icon-192.png">
<link rel="apple-touch-icon" href="../reel-log/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0c0a0f;--bg2:#141119;--card:#1c1823;--card2:#262030;--line:#30293b;
  --text:#f4efe9;--muted:#9c93a9;--accent:#ffb547;--accent2:#ff6f61;--good:#5ad19a;
  --disp:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overscroll-behavior-y:none}
body{padding-bottom:calc(80px + env(safe-area-inset-bottom))}
html:has(body.locked),body.locked{overflow:hidden}
.sbk{touch-action:none}
button{font:inherit;color:inherit}
.disp{font-family:var(--disp);font-weight:700;letter-spacing:-.01em}
svg{display:block}

/* top bar */
.top{position:sticky;top:0;z-index:8;display:flex;align-items:center;justify-content:space-between;gap:10px;height:calc(52px + env(safe-area-inset-top));
  padding:calc(6px + env(safe-area-inset-top)) 16px 6px;background:linear-gradient(180deg,#120f17,var(--bg));border-bottom:1px solid rgba(255,181,71,.55)}
.logo{margin:0;cursor:pointer;display:flex;flex-direction:column;line-height:.86;user-select:none;-webkit-user-select:none}
.logo .w1{font-family:var(--disp);font-weight:600;font-size:11px;letter-spacing:.42em;text-transform:uppercase;color:var(--muted);padding-left:2px}
.logo .w2{font-family:var(--disp);font-weight:700;font-size:25px;letter-spacing:.04em;text-transform:uppercase;color:var(--accent)}
.logo{min-width:0;flex:1}
.logo .w2{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logo.sub .w1{display:none}
.logo.sub .w2{font-size:26px;line-height:1}
.ib.hback{width:30px;height:30px;border-radius:9px;color:var(--accent);background:rgba(255,181,71,.08);border-color:rgba(255,181,71,.35);margin-right:-2px}
.ib.hback[hidden]{display:none}
.hback svg{width:16px;height:16px}
.hact{display:flex;gap:8px}
.hsearch{display:none;flex:1;align-items:center;gap:8px;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:0 6px 0 10px;height:38px}
.hsearch svg{width:17px;height:17px;color:var(--muted);flex:none}
.hsearch input{flex:1;min-width:0;background:none;border:0;padding:0;height:100%;font-size:15px;outline:none}
.hsearch button{flex:none;background:none;border:0;color:var(--accent);font-weight:800;font-size:14px;cursor:pointer;padding:6px}
.top.searching .logo,.top.searching .hact,.top.searching .hback{display:none}
.hproj{width:34px;height:34px;flex:none;display:block;margin-right:-4px;cursor:pointer}
.hproj[hidden],.top.searching .hproj{display:none}
.top.searching .hsearch{display:flex;animation:fadein .2s ease}
.srch{position:fixed;left:0;right:0;top:calc(52px + env(safe-area-inset-top));bottom:0;z-index:7;overflow-y:auto;overscroll-behavior:contain;
  background:var(--bg);padding:12px 16px calc(96px + env(safe-area-inset-bottom));animation:fadein .2s ease}
.srch[hidden]{display:none}
.hact .ib{width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,.04)}
.hact .ib[hidden],#hcar[hidden],.top.searching #hcar{display:none}
#hcar{width:34px;display:grid;place-items:center;padding:0;border-radius:10px;border:0;color:#1a1206;
  background:linear-gradient(135deg,#ffc56b,#ff9f2e);box-shadow:0 4px 14px rgba(255,166,50,.35),inset 0 1px 0 rgba(255,255,255,.35);
  font-family:var(--disp);font-weight:700;font-size:15px;letter-spacing:.08em;text-transform:uppercase}
#hcar svg{width:19px;height:19px}
#hcar:active{transform:scale(.95)}
.hact .ib.on{color:var(--accent);border-color:rgba(255,181,71,.5)}
.hact .ib.gen{width:auto;display:flex;gap:6px;padding:0 12px;font-weight:800;font-size:13.5px;color:var(--text)}
.hact .ib.gen svg{color:var(--accent);width:17px;height:17px}
.hact .ib svg{width:19px;height:19px}
@keyframes viewin{from{opacity:0;transform:translateY(8px)}}
main>section.enter{animation:viewin .26s ease}
.ib{background:var(--card);border:1px solid var(--line);border-radius:12px;width:40px;height:40px;display:grid;place-items:center;cursor:pointer;color:var(--muted);flex:none}
.ib svg{width:20px;height:20px}
main{max-width:1100px;margin:0 auto}
.vt{font-family:var(--disp);font-weight:700;font-size:34px;line-height:1.05;margin:2px 16px 4px}
.vs{color:var(--muted);margin:0 16px 16px;font-size:14px}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:9;display:flex;justify-content:space-around;
  padding:14px 8px calc(8px + env(safe-area-inset-bottom));pointer-events:none;
  background:linear-gradient(to top,rgba(12,10,15,.85),rgba(12,10,15,.4) 60%,rgba(12,10,15,0))}
.tb{flex:1;max-width:110px;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;
  color:rgba(236,232,242,.78);font-size:11px;font-weight:650;cursor:pointer;padding:4px 0;position:relative;pointer-events:auto;
  text-shadow:0 1px 3px rgba(0,0,0,.9),0 0 10px rgba(0,0,0,.6)}
.tb svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;
  filter:drop-shadow(0 1px 2px rgba(0,0,0,.9)) drop-shadow(0 0 6px rgba(0,0,0,.5))}
.tb.on{color:var(--accent)}
.tb[hidden]{display:none}

/* hero */
.hero{position:relative;margin:0 16px;border-radius:22px;overflow:hidden;aspect-ratio:16/10;max-height:420px;width:calc(100% - 32px);
  background:var(--card) center/cover no-repeat;cursor:pointer;box-shadow:0 20px 50px rgba(0,0,0,.45)}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(12,10,15,0) 30%,rgba(12,10,15,.92) 100%)}
.hero .hin{position:absolute;left:16px;right:16px;bottom:14px;z-index:1}
.tag{display:inline-block;font-size:11px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:var(--bg);background:var(--accent);border-radius:6px;padding:2px 7px}
.hero h2{font-family:var(--disp);font-weight:700;font-size:30px;line-height:1.05;margin:8px 0 4px;text-shadow:0 2px 12px rgba(0,0,0,.5)}
.hero .hm{color:#d8d0e0;font-size:13px}
.hbtns{display:flex;gap:8px;margin-top:10px}
.pill{border:0;border-radius:999px;padding:9px 16px;font-weight:750;font-size:14px;cursor:pointer;background:var(--accent);color:#1a1206;display:inline-flex;align-items:center;gap:6px}
.pill.ghost{background:rgba(255,255,255,.14);color:var(--text);backdrop-filter:blur(8px)}
.pill.line{background:transparent;border:1px solid var(--line);color:var(--text)}

.searchpill{display:flex;align-items:center;gap:10px;margin:16px;padding:13px 16px;width:calc(100% - 32px);text-align:left;
  background:var(--card);border:1px solid var(--line);border-radius:16px;color:var(--muted);cursor:pointer;font-size:15px}
.searchpill svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2}

/* search + genres bar */
.sbar{display:flex;gap:10px;margin:16px}
.sbar.stick{position:sticky;top:calc(62px + env(safe-area-inset-top));z-index:7;margin:0 0 14px;padding:4px 16px 10px;background:var(--bg)}
.sbar .searchpill{margin:0;width:auto;flex:1;min-width:0}
.gbtn{flex:none;display:flex;align-items:center;gap:8px;padding:0 16px;border-radius:16px;background:var(--card);border:1px solid var(--line);color:var(--text);font-weight:700;font-size:15px;cursor:pointer}
.gbtn svg{width:18px;height:18px;fill:none;stroke:var(--accent);stroke-width:2}
.gsticky{position:sticky;top:calc(52px + env(safe-area-inset-top));z-index:3;background:var(--bg);margin:0 -16px;padding:12px 16px 8px;border-bottom:1px solid var(--line)}
.gsticky .chip{padding:6px 12px;font-size:12.5px}
.gsticky .gopts{margin-top:7px}
.gsticky .seg button{padding:4px 10px;font-size:12px}
.gsticky select{padding:4px 8px;font-size:12.5px}
.gsticky .chips{padding:0 16px 4px;margin:0 -16px}
.gopts{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:8px}
.gk{padding:14px 16px 2px}
.gk .seg{display:inline-flex}
.gpane{margin-top:14px;padding-bottom:20px;transition:transform .28s cubic-bezier(.2,.85,.25,1),opacity .28s;touch-action:pan-y}
/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding:0 16px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar,.track::-webkit-scrollbar{display:none}
.chip{flex:none;background:var(--card);border:1px solid var(--line);color:var(--text);border-radius:999px;padding:7px 13px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--accent);border-color:var(--accent);color:#1a1206}
.chips.dim{opacity:.35;pointer-events:none}

/* rows */
.row{margin-top:26px}
.rowhead{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;padding:0 16px 10px}
.rowhead h3{margin:0;font-family:var(--disp);font-weight:700;font-size:22px;line-height:1.1}
.rowhead p{margin:2px 0 0;color:var(--muted);font-size:12.5px}
.rowhead button{flex:none;background:none;border:0;color:var(--accent);font-size:13px;font-weight:700;cursor:pointer;padding:4px 0}
.track{display:flex;gap:12px;overflow-x:auto;overflow-y:hidden;overscroll-behavior-x:contain;padding:0 16px 6px;scroll-padding:0 16px;scroll-snap-type:x proximity;scrollbar-width:none;min-height:150px}
.track>.pc{flex:none;width:112px;scroll-snap-align:start}
.track>.pc.ranked{width:136px;padding-left:28px}
.track .msg{padding:50px 0}

/* poster card */
.pc{position:relative;cursor:pointer;-webkit-touch-callout:none;user-select:none;-webkit-user-select:none}
.pc .pw{position:relative;transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.pc img,.pc .ph{width:100%;aspect-ratio:2/3;object-fit:cover;border-radius:12px;background:var(--card2);display:block;pointer-events:none;
  box-shadow:0 8px 18px rgba(0,0,0,.35)}
.ph{display:flex!important;align-items:center;justify-content:center;text-align:center;padding:8px;font-size:12px;color:var(--muted)}
.pc.pressing .pw{transform:scale(.94);transition-delay:.12s}
.bd{position:absolute;left:6px;bottom:6px;background:rgba(12,10,15,.82);backdrop-filter:blur(6px);color:var(--accent);
  font-size:12px;font-weight:800;border-radius:7px;padding:2px 6px;pointer-events:none}
.bd:empty:not(.wl){display:none}
.bd.wl{padding:4px 5px}
.bd.wl::before{content:"";display:block;width:9px;height:12px;background:var(--accent);clip-path:polygon(0 0,100% 0,100% 100%,50% 70%,0 100%)}
.bd.seen{color:var(--good)}
.rk{position:absolute;left:0;bottom:-4px;font-family:var(--disp);font-weight:700;font-size:54px;line-height:1;
  color:var(--bg);-webkit-text-stroke:1.6px var(--accent);pointer-events:none;z-index:0}
.pc.ranked .pw{z-index:1}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:14px 12px}
.grid .pc.ranked{padding-left:0}
.grid .rk{font-size:30px;left:-2px;bottom:auto;top:-8px;z-index:2;color:var(--accent);-webkit-text-stroke:0;text-shadow:0 2px 8px rgba(0,0,0,.8)}

/* saga tiles */
.sagas{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px 16px;padding:0 16px}
.saga{cursor:pointer;position:relative;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.track>.saga{flex:none;width:136px;scroll-snap-align:start}
.fan{position:relative;width:100%;aspect-ratio:2/3;margin:10px 0 10px}
.fan img,.fan .ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:12px;background:var(--card2);
  transform-origin:top center;box-shadow:0 10px 24px rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.07)}
.fan>:nth-child(1){transform:translateY(-6px) scale(.94);filter:brightness(.4)}
.fan>:nth-child(2){transform:translateY(-3px) scale(.97);filter:brightness(.62)}
.fan>:nth-child(3){z-index:2}
.saga:active .fan>:nth-child(3){transform:scale(.97)}
.sname{font-family:var(--disp);font-weight:700;font-size:17px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.smeta{color:var(--muted);font-size:12px;margin-top:2px;white-space:nowrap}
.bar{height:4px;border-radius:4px;background:var(--line);margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent2),var(--accent));border-radius:4px;transition:width .4s}
.saga.off{opacity:.45}
.sec{margin:26px 16px 12px;font-size:12px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted)}
.findsaga{margin:0 16px 4px;position:relative}
.findsaga input{padding-left:40px}
.findsaga svg{position:absolute;left:13px;top:13px;width:18px;height:18px;fill:none;stroke:var(--muted);stroke-width:2}

/* forms */
input,textarea,select{background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:12px;font:inherit;width:100%}
select{width:auto;padding:7px 10px}
label.f{display:block;color:var(--muted);font-size:13px;margin:14px 0 6px}
.btn{background:var(--accent);color:#1a1206;border:0;border-radius:14px;padding:13px;font-weight:800;font-size:15px;width:100%;cursor:pointer;margin-top:14px}
.btn.ghost{background:var(--card2);color:var(--text)}
.btn.danger{background:transparent;color:var(--accent2);border:1px solid var(--accent2)}
.toggle{display:flex;align-items:center;gap:10px;margin-top:14px}
.toggle input{width:auto;transform:scale(1.3)}
.small{font-size:12px;color:var(--muted)}
.msg{color:var(--muted);text-align:center;padding:24px 10px}
.empty{text-align:center;color:var(--muted);padding:50px 24px}

/* stars */
.s5{display:inline-flex;gap:var(--g,4px);touch-action:none;cursor:pointer;vertical-align:middle}
.st{position:relative;width:var(--sz,30px);height:var(--sz,30px);flex:none}
.st svg{width:100%;height:100%;fill:var(--line)}
.st .f{position:absolute;left:0;top:0;bottom:0;overflow:hidden;width:0}
.st .f svg{width:var(--sz,30px);height:var(--sz,30px);fill:var(--accent)}
.mini{color:var(--accent);font-weight:800;white-space:nowrap;font-size:13px}

/* list rows */
.lrow{display:flex;align-items:center;gap:12px;padding:8px;background:var(--card);border-radius:14px;margin-bottom:8px;cursor:pointer}
.lrow .thumb{width:46px;aspect-ratio:2/3;border-radius:7px;object-fit:cover;background:var(--card2);flex:none}
.li{flex:1;min-width:0}
.lt{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ls{color:var(--muted);font-size:12.5px}
.day{width:34px;text-align:center;flex:none}
.day b{display:block;font-family:var(--disp);font-size:22px;line-height:1}
.day span{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
.rw{font-size:10px;color:var(--good);border:1px solid var(--good);border-radius:4px;padding:0 4px;margin-left:6px;font-weight:700}
.month{font-family:var(--disp);font-weight:700;font-size:20px;margin:22px 0 10px}
.pad{padding:0 16px}

/* stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:0 16px 14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;text-align:center}
.stat b{display:block;font-family:var(--disp);font-size:26px;color:var(--accent);line-height:1.1}
.stat span{font-size:11.5px;color:var(--muted)}
.hist{display:flex;align-items:flex-end;gap:4px;height:64px;margin:0 16px 4px;padding:0 4px}
.hist i{flex:1;background:linear-gradient(var(--accent),var(--accent2));border-radius:4px 4px 0 0;min-height:3px;opacity:.85}
.histl{display:flex;justify-content:space-between;margin:0 20px 16px;font-size:11px;color:var(--muted)}
.toolbar{display:flex;gap:8px;align-items:center;margin:0 16px 12px;color:var(--muted);font-size:13px}

/* sheets */
.sbk{position:fixed;inset:0;background:rgba(5,4,8,.62);opacity:0;transition:opacity .28s}
.sbk.in{opacity:1}
.sh{position:fixed;left:0;right:0;bottom:0;max-width:680px;margin:0 auto;max-height:calc(100dvh - 40px - env(safe-area-inset-top));
  display:flex;flex-direction:column;background:var(--bg2);border-radius:24px 24px 0 0;border:1px solid var(--line);border-bottom:0;
  transform:translateY(105%);transition:transform .32s cubic-bezier(.22,.9,.28,1);box-shadow:0 -20px 50px rgba(0,0,0,.5);
  will-change:transform;contain:layout paint}
.sh.in{transform:none}
.sh.tall{height:calc(100dvh - 40px - env(safe-area-inset-top))}
.sh.drag{transition:none}
.grab{flex:none;height:26px;display:grid;place-items:center;cursor:grab;touch-action:none;position:relative;z-index:3}
.grab i{width:44px;height:5px;border-radius:5px;background:#5a5166}
.sbody{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:0 16px calc(24px + env(safe-area-inset-bottom))}
.sh h2.stitle{font-family:var(--disp);font-weight:700;font-size:26px;margin:0 0 12px;line-height:1.1}
.sh .chips{padding:0 0 8px;margin:0 -16px;padding-left:16px;padding-right:16px}

/* movie sheet */
.mvsheet .grab{position:absolute;left:0;right:0;top:0}
.mvsheet .grab i{background:rgba(255,255,255,.7)}
.mvsheet .sbody{padding-top:0;display:flex;flex-direction:column}
.mvsheet .sbody>*{flex-shrink:0}
.mvsheet #mhist,.mvsheet .ov{margin-bottom:18px}
.bdrop{margin:0 -16px;height:210px;background:var(--card) center/cover no-repeat;position:relative;border-radius:24px 24px 0 0}
.bdrop::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,17,25,.15),var(--bg2) 98%);border-radius:inherit}
.mvhead{display:flex;gap:14px;margin-top:-92px;position:relative;z-index:1;align-items:flex-end}
.mvhead img,.mvhead .ph{width:108px;flex:none;aspect-ratio:2/3;border-radius:12px;object-fit:cover;box-shadow:0 12px 26px rgba(0,0,0,.55);background:var(--card2)}
.mvhead > div:last-child{align-self:stretch;min-width:0;padding-top:66px;min-height:200px}
.mvsheet #md{min-height:19px}.mvsheet #mimdb{min-height:26px;margin-top:4px}.mvsheet #mact{min-height:30px}
.mvhead h2{font-family:var(--disp);font-weight:700;font-size:25px;line-height:1.08;margin:0 0 4px}
.meta{color:var(--muted);font-size:13px}
.ratebar{position:sticky;bottom:calc(-24px - env(safe-area-inset-bottom));z-index:4;display:flex;align-items:center;justify-content:space-between;gap:10px;
  margin:auto -16px calc(-24px - env(safe-area-inset-bottom));padding:12px 16px calc(14px + env(safe-area-inset-bottom));
  background:var(--bg2);border-top:1px solid var(--line);box-shadow:0 -10px 24px rgba(0,0,0,.35)}
.ratebar .lbl{font-size:10.5px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted)}
.rv2{font-family:var(--disp);font-weight:700;text-transform:uppercase;font-size:16px;color:var(--accent);min-height:20px}
.rv2.dim{color:var(--muted);font-family:inherit;text-transform:none;font-weight:500;font-size:13px}
.myrow{display:flex;align-items:center;gap:4px}
.myrow .s5{padding:8px 0;margin:-8px 0}
.xr{background:none;border:0;color:var(--muted);font-size:15px;cursor:pointer;padding:6px;line-height:1}
.ratebox{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-top:16px;text-align:center}
.ratebox .lbl{font-size:12px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.ratebox .rv{font-family:var(--disp);font-size:15px;color:var(--muted);margin-top:6px;min-height:20px}
.acts{display:flex;gap:8px;margin-top:12px}
.acts .pill{flex:1;justify-content:center;padding:12px}
.sagachip{display:flex;align-items:center;gap:10px;width:100%;margin-top:12px;padding:12px 14px;border-radius:16px;cursor:pointer;text-align:left;
  background:linear-gradient(120deg,rgba(255,111,97,.18),rgba(255,181,71,.12));border:1px solid rgba(255,181,71,.35)}
.sagachip>span{flex:1;min-width:0}
.sagachip>b{color:var(--accent);margin-left:auto;white-space:nowrap;flex-shrink:0}
.ov{color:#d3cbdb;font-size:14.5px;margin:14px 0 4px}
.hrow{border-top:1px solid var(--line);padding:11px 0;display:flex;justify-content:space-between;align-items:center;cursor:pointer;gap:10px}
.note{white-space:pre-wrap;color:var(--muted);font-size:13px;margin-top:3px}

/* run (stack) */
.runhead{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.wbtn{flex:none;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:7px 13px;font-weight:800;font-size:13px;cursor:pointer;color:var(--text)}
.wbtn.on{border-color:var(--good);color:var(--good)}
.wbtn:disabled{cursor:default;opacity:.85}
.runhead h2{font-family:var(--disp);font-weight:700;font-size:24px;margin:0;line-height:1.1}
.prog{color:var(--muted);font-size:12.5px;margin-top:3px}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:3px;flex:none}
.seg button{background:none;border:0;border-radius:7px;padding:5px 10px;font-size:12.5px;font-weight:700;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--card2);color:var(--text)}
.stack{position:relative;margin:18px auto 0;width:min(70vw,300px,calc((100dvh - 360px)/1.5));aspect-ratio:2/3}
.car{position:relative;margin:18px -16px 0;height:calc(min(70vw,300px,(100dvh - 360px)/1.5) * 1.5);overflow:hidden;touch-action:pan-y;user-select:none}
.card.cc{inset:auto;top:0;left:50%;width:min(70vw,300px,calc((100dvh - 360px)/1.5));height:100%;
  transition:transform .38s cubic-bezier(.2,.85,.25,1),opacity .38s;box-shadow:0 14px 30px rgba(0,0,0,.55)}
.card .rb{position:absolute;top:10px;right:10px;background:rgba(12,10,15,.8);border-radius:8px;padding:2px 8px;font-size:13px;font-weight:800;color:var(--accent)}
.card .rb:empty{display:none}
.card{position:absolute;inset:0;border-radius:20px;overflow:hidden;background:var(--card2);box-shadow:0 20px 44px rgba(0,0,0,.6);
  transition:transform .32s cubic-bezier(.2,.85,.25,1),opacity .32s;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
.card img{width:100%;height:100%;object-fit:cover;pointer-events:none;display:block}
.card .cap{position:absolute;left:0;right:0;bottom:0;padding:50px 14px 12px;background:linear-gradient(transparent,rgba(8,6,10,.92))}
.card .cap b{display:block;font-family:var(--disp);font-size:21px;line-height:1.1}
.card .cap span{font-size:12.5px;color:#cfc6d8}
.card .num{position:absolute;top:10px;left:10px;background:rgba(12,10,15,.75);border-radius:8px;padding:2px 8px;font-size:12px;font-weight:800;color:var(--accent)}
.card.d1{transform:translateY(16px) scale(.94);opacity:.85}
.card.d2{transform:translateY(30px) scale(.88);opacity:.55}
.card .stamp{position:absolute;top:22px;right:16px;border:3px solid;border-radius:8px;padding:2px 10px;font-weight:900;font-size:18px;letter-spacing:2px;transform:rotate(12deg);opacity:0}
.card .stamp.skip{color:var(--muted);left:16px;right:auto;transform:rotate(-12deg)}
.card .stamp.keep{color:var(--good)}
.runctl{text-align:center;margin-top:30px}
.runctl .rv{font-family:var(--disp);color:var(--muted);height:22px;margin-top:4px}
.runbtns{display:flex;justify-content:center;gap:10px;margin-top:12px}
.runbtns .pill{min-width:120px;justify-content:center}
.hint{font-size:12px;color:var(--muted);text-align:center;margin-top:10px}
.done{text-align:center;padding:10px 0 4px}
.done .big{font-family:var(--disp);font-weight:700;font-size:56px;color:var(--accent);line-height:1}

/* rate pad */
.rp{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;background:rgba(5,4,8,.74);opacity:0;visibility:hidden;transition:opacity .24s ease,visibility 0s linear .24s}
.rp.on{opacity:1;visibility:visible;transition:opacity .24s ease}
.rpc{position:relative;overflow:hidden;width:min(88vw,340px);background:var(--bg2);border:1px solid rgba(255,255,255,.09);border-radius:28px;padding:22px 18px 16px;text-align:center;
  box-shadow:0 30px 80px rgba(0,0,0,.65);transform:translateY(18px) scale(.94);opacity:0;transition:transform .36s cubic-bezier(.2,.9,.25,1.12),opacity .24s ease}
.rp.on .rpc{transform:none;opacity:1}
.rpbg{position:absolute;inset:-30px;background:center/cover no-repeat;filter:blur(16px) saturate(1.4);opacity:.6;pointer-events:none;transform:translateZ(0)}
.rpc::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,17,25,.15) 0%,rgba(20,17,25,.55) 45%,var(--bg2) 78%);pointer-events:none}
.rpposter{width:58%;margin:0 auto 14px}
.rpposter img,.rpposter .ph{width:100%;aspect-ratio:2/3;object-fit:cover;border-radius:16px;display:block;background:var(--card2);
  box-shadow:0 18px 40px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.08)}
.rptitle{font-family:var(--disp);font-weight:700;text-transform:uppercase;letter-spacing:.02em;font-size:22px;line-height:1.08;text-wrap:balance}
.rpyear{color:var(--muted);font-size:13px;margin:3px 0 14px}
.rpp{display:inline-flex;align-items:center;justify-content:center;gap:6px;flex:1;padding:10px 12px;border-radius:999px;font-weight:800;font-size:13.5px;cursor:pointer;
  background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);color:var(--text);transition:background .15s,border-color .15s,color .15s}
.rpp svg{width:11px;height:14px;fill:currentColor}
.rpp.on{border-color:var(--accent);color:var(--accent);background:rgba(255,181,71,.1)}
.rpp:active{background:rgba(255,255,255,.14)}
.rpc>*:not(.rpbg){position:relative;z-index:1}
.rpc .st .f{transition:width .14s ease-out}
.rpc .st .f svg{filter:drop-shadow(0 0 7px rgba(255,181,71,.5))}
.rpc .rv.bump{animation:bump .25s ease}
.rpc .s5.pulse{animation:bump .3s ease}
@keyframes bump{40%{transform:scale(1.12)}}
@keyframes pop{from{transform:scale(.85);opacity:0}}
.rpc .rph{display:flex;gap:12px;align-items:center;text-align:left;margin-bottom:16px}
.rpc .rph img,.rpc .rph .ph{width:62px;aspect-ratio:2/3;border-radius:9px;object-fit:cover;flex:none;background:var(--card2);box-shadow:0 8px 18px rgba(0,0,0,.5)}
.rpc .rph b{font-family:var(--disp);font-size:19px;line-height:1.15;display:block}
.rpc .rv{font-family:var(--disp);font-size:17px;color:var(--accent);height:24px;margin-top:8px}
.rpc .s5{margin:0 auto}
.rpc .hint{margin-top:6px}
.rpbtns{display:flex;gap:8px;margin-top:14px}
.rpbtns .pill{flex:1;justify-content:center}
.rp.on .rpc.saved{transform:translateY(-10px) scale(.97);opacity:0;transition:transform .3s ease,opacity .26s ease}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;z-index:70;
  background:#2b2434;border:1px solid var(--line);border-radius:14px;padding:10px 12px 10px 16px;display:flex;align-items:center;gap:14px;
  box-shadow:0 12px 30px rgba(0,0,0,.5);transition:all .25s;pointer-events:none;max-width:calc(100vw - 32px);font-size:14px}
.toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toast button{background:none;border:0;color:var(--accent);font-weight:800;cursor:pointer;flex:none}

.onb{margin:10px 16px;background:linear-gradient(150deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:22px;padding:24px;text-align:center}
.onb h2{font-family:var(--disp);font-size:26px;margin:0 0 8px}
.onb p{color:var(--muted);margin:0 0 6px}

/* TV episode chart */
.imdbbox{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-top:12px}
.ib2{background:#f5c518;color:#000;font-weight:900;border-radius:5px;padding:1px 5px;font-size:11.5px;letter-spacing:0}
.imdbbox .ib2{padding:2px 6px;font-size:13px}
.wz{display:flex;align-items:center;justify-content:center;gap:8px;margin:-2px 0 14px;padding:9px;border:1px dashed var(--line);border-radius:14px;color:var(--muted);font-size:13px;font-weight:700;cursor:pointer;transition:all .15s}
.wz svg{width:12px;height:15px;fill:currentColor}
.wz.on{border-style:solid;border-color:var(--accent);background:rgba(255,181,71,.14);color:var(--accent);transform:scale(1.04)}
.rpc.wzmode .s5{opacity:.25}
.qs{display:flex;align-items:center;gap:14px;margin:22px 16px 0;width:calc(100% - 32px);padding:14px 16px;border-radius:18px;border:1px solid rgba(255,181,71,.35);
  background:linear-gradient(120deg,rgba(255,111,97,.2),rgba(255,181,71,.1));text-align:left;cursor:pointer}
.qs .qi{flex:none;width:46px;height:46px;border-radius:12px;background:var(--accent);display:grid;place-items:center}
.qs .qi svg{width:24px;height:24px;fill:#1a1206}
.qs b{display:block;font-family:var(--disp);font-weight:700;text-transform:uppercase;font-size:18px;letter-spacing:.02em}
.qs span{color:var(--muted);font-size:12.5px}
.mact{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
.mact a{text-decoration:none}
.mact button,.mact a{background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:12.5px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:5px;color:var(--text)}
.mact button.on{border-color:var(--accent);color:var(--accent)}
.mact svg{width:11px;height:13px;fill:currentColor}
.imdbm{display:inline-flex;align-items:center;gap:6px;margin-top:6px;font-size:14px;font-weight:800}
.scores{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center}
.rt{display:inline-flex;align-items:center;gap:5px;margin-top:6px;font-size:14px;font-weight:800}
.rt svg{width:18px;height:18px;flex:none}
.rt .small{font-weight:500}
.imdbm .small{font-weight:500}
.prov{margin-top:6px;margin-bottom:6px}
.prov .lbl{font-size:10.5px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);margin:10px 0 7px}
.plogos{display:flex;gap:8px;flex-wrap:wrap}
.plogos img{width:42px;height:42px;border-radius:11px;box-shadow:0 4px 10px rgba(0,0,0,.4)}
.revbtn{display:flex;align-items:center;justify-content:space-between;margin:0 16px 16px;width:calc(100% - 32px);padding:13px 16px;border-radius:16px;cursor:pointer;
  background:linear-gradient(120deg,rgba(255,111,97,.2),rgba(255,181,71,.12));border:1px solid rgba(255,181,71,.35);font-weight:800}
.revbtn b{color:var(--accent)}
.rev{text-align:center}
.rev .big{font-family:var(--disp);font-weight:700;font-size:84px;line-height:.9;color:var(--accent)}
.rev .tops{display:flex;gap:8px;justify-content:center;margin:16px 0 6px}
.rev .tops div{width:19%;position:relative}
.rev .tops img,.rev .tops .ph{width:100%;aspect-ratio:2/3;border-radius:9px;object-fit:cover;background:var(--card2)}
.rev .tops span{position:absolute;left:4px;top:4px;background:rgba(12,10,15,.8);border-radius:6px;font-size:11px;font-weight:800;color:var(--accent);padding:1px 5px}
.rgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.rgrid div{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px}
.rgrid b{display:block;font-family:var(--disp);font-weight:700;text-transform:uppercase;font-size:22px;color:var(--text)}
.rgrid span{font-size:11.5px;color:var(--muted)}
.imdbbox b{font-family:var(--disp);font-size:28px;line-height:1}
.chartwrap{overflow-x:auto;margin:10px -16px 0;padding:0 16px 6px;scrollbar-width:none}
.chartwrap::-webkit-scrollbar{display:none}
.hm{border-collapse:separate;border-spacing:3px;font-size:12.5px;font-weight:750;margin:0}
.hm th{color:var(--muted);font-weight:700;font-size:11px;padding:0 2px;white-space:nowrap}
.hm td{width:38px;min-width:38px;height:30px;text-align:center;border-radius:6px;cursor:pointer}
.hm td.na{background:var(--card);color:var(--muted)}
.hm td.sel{outline:2px solid #fff;outline-offset:1px}
.hm th.sl{position:sticky;left:0;z-index:1;background:var(--bg2);padding-right:6px;text-align:left}
.hm td.avgc{font-weight:900;box-shadow:inset 0 0 0 2px rgba(255,255,255,.55)}
.hm th.avgh{color:var(--text)}
.c9{background:#1d7a4a;color:#fff}.c8{background:#3dbb6f;color:#0b1a10}.c7{background:#e6c52f;color:#1c1600}
.c6{background:#ef8b2c;color:#1f0f00}.c5{background:#d9443a;color:#fff}.c4{background:#7c3fbf;color:#fff}
.legend{display:flex;flex-wrap:wrap;gap:6px 10px;justify-content:center;font-size:11px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:4px}
.epinfo[hidden]{display:none}
.epinfo{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-top:10px;min-height:44px;font-size:13.5px}
.epinfo b{font-family:var(--disp);font-size:18px}
.hl{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.hl div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;font-size:12.5px;color:var(--muted);cursor:pointer}
.hl b{display:block;color:var(--text);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* people */
.ppl{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;padding:2px 0 6px}
.ppl::-webkit-scrollbar{display:none}
.pp{flex:none;width:74px;text-align:center;cursor:pointer;background:none;border:0;padding:0;color:var(--text)}
.pp img,.pp .pi{width:64px;height:64px;border-radius:50%;object-fit:cover;display:block;margin:0 auto 6px;background:var(--card2);box-shadow:0 6px 14px rgba(0,0,0,.4)}
.pp .pi{display:grid!important;place-items:center;font-family:var(--disp);font-weight:700;font-size:22px;color:var(--muted)}
.pp b{display:block;font-size:12px;font-weight:700;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pp span{display:block;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plink{background:none;border:0;padding:0;color:var(--text);font:inherit;text-decoration:underline;text-decoration-color:rgba(255,181,71,.6);text-underline-offset:3px;cursor:pointer}
.castsec .lbl{font-size:10.5px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);margin:14px 0 8px}
.phead{display:flex;gap:16px;align-items:flex-end;margin-top:6px}
.phead img,.phead .pi{width:112px;height:150px;border-radius:14px;object-fit:cover;flex:none;background:var(--card2);box-shadow:0 12px 26px rgba(0,0,0,.5)}
.phead .pi{display:grid!important;place-items:center;font-family:var(--disp);font-size:40px;color:var(--muted)}
.phead h2{font-family:var(--disp);font-weight:700;text-transform:uppercase;letter-spacing:.02em;font-size:28px;line-height:1.02;margin:0 0 6px}
.favbtn{display:inline-flex;align-items:center;gap:6px;margin-top:10px;background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-weight:800;font-size:13px;cursor:pointer;color:var(--text)}
.favbtn.on{border-color:var(--accent2);color:var(--accent2)}
.favbtn svg{width:14px;height:14px;fill:currentColor}
.bio{color:#d3cbdb;font-size:14px;margin:14px 0 4px;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.bio.open{-webkit-line-clamp:unset;display:block}
.pbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:16px 0 12px}
/* smoothness */
html{touch-action:manipulation}
.row{content-visibility:auto;contain-intrinsic-size:auto 280px}
.card.cc{will-change:transform,opacity}
.fadein{animation:fadein .28s ease both}
@keyframes fadein{from{opacity:0;transform:translateY(4px)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
/* marquee type */
.vt,.disp,.imdbbox b,.epinfo b,.hero h2,.rowhead h3,.sname,.month,.stat b,.mvhead h2,.runhead h2,.card .cap b,.rpc .rph b,.sh h2.stitle,.rk,.done .big,.ratebox .rv,.runctl .rv,.rpc .rv,.day b{font-family:var(--disp);font-weight:700;text-transform:uppercase;letter-spacing:.02em}
.hero h2{font-size:31px}
</style>
</head>
<body>
<header class="top">
  <button class="ib hback" id="hback" aria-label="Back" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
  <svg class="hproj" id="hproj" viewBox="0 0 40 40" aria-hidden="true">
    <circle cx="10" cy="11" r="7.5" fill="#ffb547"/><g fill="#0c0a0f"><circle cx="10" cy="7" r="1.7"/><circle cx="13.8" cy="12.2" r="1.7"/><circle cx="6.2" cy="12.2" r="1.7"/><circle cx="10" cy="11" r=".9"/></g>
    <circle cx="24" cy="12.5" r="6" fill="#ffb547"/><g fill="#0c0a0f"><circle cx="24" cy="9.3" r="1.4"/><circle cx="27" cy="13.6" r="1.4"/><circle cx="21" cy="13.6" r="1.4"/><circle cx="24" cy="12.5" r=".8"/></g>
    <rect x="3" y="19" width="26" height="13" rx="3" fill="#ffb547"/><rect x="6" y="22" width="9" height="2" rx="1" fill="#0c0a0f" opacity=".55"/>
    <path d="M29 22.5 L36 20 L36 31 L29 28.5 Z" fill="#ffb547"/><circle cx="36" cy="25.5" r="2.4" fill="#fff3d6"/>
    <path d="M9 32 L7 37 M23 32 L25 37" stroke="#ffb547" stroke-width="2" stroke-linecap="round"/>
  </svg>
  <h1 class="logo" id="logo" role="link" tabindex="0"><span class="w1">Rolling</span><span class="w2">Credits</span></h1>
  <div class="hsearch" id="hsbar">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <input id="hq" type="search" autocomplete="off" enterkeyhint="search">
    <button id="hcancel">Cancel</button>
  </div>
  <div class="hact">
    <button class="ib" id="hcar" aria-label="Carousel"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"><rect x="7.5" y="4" width="9" height="16" rx="1.8"/><path d="M4 6.5v11M20 6.5v11"/></svg></button>
    <button class="ib" id="hsearch" aria-label="Search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></button>
  </div>
</header>
<main>
  <section id="v-discover"></section>
  <section id="v-sagas" hidden></section>
  <section id="v-diary" hidden></section>
  <section id="v-films" hidden></section>
  <section id="v-tv" hidden></section>
  <section id="v-genres" hidden></section>
  <section id="v-genre" hidden></section>
  <section id="v-franchises" hidden></section>
  <section id="v-list" hidden></section>
</main>
<div class="srch" id="srch" hidden><div id="fpeople"></div><div class="grid"></div><div class="sent" style="height:30px"></div><div class="msg"></div></div>
<nav class="tabbar">
  <button class="tb on" data-v="discover"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></svg>Discover</button>

async function tmdb(path, params = {}){
  const key = store.get(K_KEY, '');
  if(!key) throw new Error('nokey');
  const url = new URL('https://api.themoviedb.org/3' + path);
  Object.entries(params).forEach(([k,v]) => url.searchParams.set(k, v));
  const opts = {};
  if(key.length > 40) opts.headers = { Authorization:'Bearer ' + key, accept:'application/json' };
  else url.searchParams.set('api_key', key);

    await slot();
    let r;
    try{ r = await fetch(url, opts); }catch(e){ release(); throw new Error('blocked'); }
    release();
    if(r.status === 401) throw new Error('badkey');
    if((r.status === 429 || r.status >= 500) && attempt < 4){
      await new Promise(res => setTimeout(res, (+(r.headers.get('Retry-After')) || 0) * 1000 || 600 * (attempt + 1)));
      continue;
    }
    if(!r.ok) throw new Error('http ' + r.status);
    return r.json();
  }
}
// at most 6 TMDB requests in flight, so opening Sagas doesn't trip the rate limit

function remember(list){ list.forEach(m => { const old = movies.get(m.id); movies.set(m.id, old ? { ...old, ...m } : m); }); }
const isCached = (k, ttlH) => { if(mem.has(k)) return true; const c = store.get(CK + k, null); return !!(c && Date.now() - c.t < ttlH*3600e3); };
const inflight = new Map();
async function cached(k, ttlH, fn){
  if(mem.has(k)) return mem.get(k);
  const c = store.get(CK + k, null);
  if(c && Date.now() - c.t < ttlH*3600e3){ mem.set(k, c.d); return c.d; }
  if(inflight.has(k)) return inflight.get(k);
  const pr = (async () => {
    let d;
    try{ d = await fn(); }
    catch(e){ if(c && c.d != null){ mem.set(k, c.d); return c.d; } throw e; }   // out of date beats nothing
    mem.set(k, d); store.set(CK + k, { t:Date.now(), d }); return d;

}

}

}

  const sh = document.createElement('div'); sh.className = 'sh' + (opt.tall ? ' tall' : '') + (opt.cls ? ' ' + opt.cls : ''); sh.style.zIndex = z + 1;
  sh.innerHTML = `<div class="grab"><i></i></div><div class="sbody">${html}</div>`;

// Swiping a card down (or tapping above it) clears every open card and puts you back on the page.
// The phone's Back gesture still steps back one card at a time.
// A carousel holds its place: cards opened on top of one clear back to it, not past it.
const closeAllSheets = () => {
  if(!sheetStack.length) return;
  const top = sheetStack.length - 1;
  let to = 0;
  for(let n = top - 1; n >= 0; n--) if(sheetStack[n].anchor){ to = n + 1; break; }
  closeSheet(sheetStack[to]);
};
// Keep the page behind an open card from scrolling: block touch scrolls that would fall through to it.
// It listens only on the cards layer, so ordinary page scrolling never waits on the app.
$('#sheets').addEventListener('touchmove', e => {
  if(!sheetStack.length || !e.cancelable) return;
  const top = sheetStack[sheetStack.length - 1], body = top.body;
  if(!body.contains(e.target)){ if(!top.el.contains(e.target)) e.preventDefault(); return; }
  for(let n = e.target; n && n !== body; n = n.parentElement){
    if(n.scrollWidth > n.clientWidth + 1 && /auto|scroll/.test(getComputedStyle(n).overflowX)) return;
  }
  if(body.scrollHeight <= body.clientHeight + 1) e.preventDefault();
}, { passive:false });

function makeDraggable(s){
  const sh = s.el, body = s.body;
  let y0, x0, t0, dy = 0, dragging = false, can = false, decided = false;
  const start = (x, y, target) => {
    x0 = x; y0 = y; t0 = Date.now(); dy = 0; dragging = false; decided = false;
    can = !!target.closest('.grab') || (body.scrollTop <= 0 && !target.closest('.nodrag'));
  };
  const move = (x, y, ev) => {
    if(!can) return;
    const ddy = y - y0, ddx = x - x0;
    if(!decided){
      if(Math.abs(ddy) < 7 && Math.abs(ddx) < 7) return;
      decided = true;
      dragging = ddy > 0 && Math.abs(ddy) > Math.abs(ddx);
      if(dragging) sh.classList.add('drag');
    }
    if(!dragging) return;
    ev && ev.cancelable && ev.preventDefault();
    dy = Math.max(0, ddy);
    sh.style.transform = `translateY(${dy}px)`;
    s.bk.style.opacity = String(Math.max(0, 1 - dy / 500));
  };
  const end = () => {
    if(!dragging) return;
    dragging = false; sh.classList.remove('drag'); s.bk.style.opacity = '';
    const v = dy / Math.max(1, Date.now() - t0);
    if(dy > 120 || (dy > 40 && v > 0.6)) closeAllSheets();
    else sh.style.transform = '';
  };
  sh.addEventListener('touchstart', e => { if(e.touches.length === 1) start(e.touches[0].clientX, e.touches[0].clientY, e.target); }, { passive:true });
  sh.addEventListener('touchmove', e => { if(e.touches.length === 1) move(e.touches[0].clientX, e.touches[0].clientY, e); }, { passive:false });
  sh.addEventListener('touchend', end);
  sh.addEventListener('touchcancel', end);
  const g = $('.grab', sh);
  g.addEventListener('pointerdown', e => { if(e.pointerType !== 'mouse') return; g.setPointerCapture(e.pointerId); start(e.clientX, e.clientY, g); });
  g.addEventListener('pointermove', e => { if(e.pointerType === 'mouse' && e.buttons) move(e.clientX, e.clientY); });
  g.addEventListener('pointerup', e => { if(e.pointerType === 'mouse') end(); });
}

async function imdbTopPage(kind, page){
  const list = await cached('imdbtop:' + kind, 12, () => fetch(`${IMDB_DATA}top/${kind}.json`).then(r => r.ok ? r.json() : null));
  if(!list || !list.length) return null;
  const per = 20, part = list.slice((page - 1) * per, page * per);
  const found = await Promise.all(part.map((x, i) => cached('find:' + x[0], 24*30, async () => {
    const d = await tmdb('/find/' + x[0], { external_source:'imdb_id' });

    return hit ? (kind === 'tv' ? slimTV(hit) : slim(hit)) : null;
  }).then(m => m && { ...m, rank:(page - 1) * per + i + 1 }).catch(() => null)));
  const results = found.filter(m => m && keep(m)); remember(results);
  return { page, total:Math.ceil(list.length / per), results };

/* generic infinite grid inside a sheet or page */
function feed(root, grid, sent, msgEl, def){
  const gen = (grid._gen = (grid._gen || 0) + 1);
  grid.innerHTML = ''; msgEl.textContent = 'Loading…';
  let page = 0, total = 1, busy = false, n = 0;
  const more = async () => {
    if(gen !== grid._gen || busy || page >= total || (def.max && n >= def.max)) return;
    busy = true;
    try{
      const d = await pageOf(def, page + 1);
      if(gen !== grid._gen) return;
      page = d.page; total = d.total;
      let list = d.results; if(def.max) list = list.slice(0, def.max - n);
      grid.insertAdjacentHTML('beforeend', list.map(m => { const rk = def.ranked ? (m.rank || n + 1) : 0; n++; return hideRated && getR(m.id) ? '' : cardHTML(m, rk); }).join(''));
      const end = page >= total || (def.max && n >= def.max);
      msgEl.textContent = end ? (n ? '' : 'No films found.') : '';
    }catch(e){ if(gen === grid._gen) msgEl.innerHTML = errText(e); }

async function resolveCollection(name){
  // match on the series' core name ("Evil Dead"), so "Evil Dead Collection" is found when we asked for "The Evil Dead Collection",
  // and never fall back to an unrelated first result
  const core = name.replace(/ Collection$/i, '').replace(/^The /i, '').toLowerCase();
  const norm = n => (n || '').toLowerCase().replace(/^the /, '');
  return cached('colid2:' + name, 24*30, async () => {
    const ask = async q => ((await tmdb('/search/collection', { query:q })).results || []);
    let res = await ask(core);
    if(!res.some(r => norm(r.name).includes(core))) res = res.concat(await ask(name));
    const ok = res.filter(r => norm(r.name).includes(core));
    const score = r => (norm(r.name) === norm(name) ? 100 : 0) + (norm(r.name).startsWith(core) ? 30 : 0) + (/collection$/i.test(r.name) ? 10 : 0) - r.name.length / 10;
    const best = ok.sort((a, b) => score(b) - score(a))[0];
    return best ? best.id : null;
  });
}
async function resolveKeyword(name){
  return cached('kwid:' + name, 24*30, async () => {
    const d = await tmdb('/search/keyword', { query:name.replace(/\s*\(.*\)$/, '') });
    const res = d.results || [];
    const hit = res.find(r => r.name.toLowerCase() === name.toLowerCase()) || res.find(r => r.name.toLowerCase().startsWith(name.split(' (')[0].toLowerCase())) || res[0];
    return hit ? hit.id : null;
  });
}
const QUICK = { k:'quick', name:"Rate what you've seen", quick:true };
function loadSaga(s){
  if(sagaData[s.k]) return sagaData[s.k];
  if(s.src){
    sagaData[s.k] = (async () => {
      if(s.src.items) return s.src.items.filter(Boolean).map(m => ({ ...m, date:m.date || '0000' }));   // saved titles may not carry a date
      const def = s.src.def, cap = def.max || 60, out = [], dup = new Set();
      for(let page = 1, total = 1; page <= total && out.length < cap; page++){
        const d = await pageOf(def, page); total = d.total;
        d.results.forEach(m => { if(!dup.has(m.id) && out.length < cap){ dup.add(m.id); out.push(m); } });
      }
      remember(out);
      return out;
    })();
    return sagaData[s.k];
  }
  if(s.quick){
    sagaData[s.k] = (async () => {
      const pages = await Promise.all([1, 2, 3, 4].flatMap(p => [listPage('/movie/popular', {}, p), listPage('/movie/top_rated', {}, p)]));
      const dup = new Set(), out = [];
      const lists = pages.map(d => d.results);
      for(let i = 0; i < 20; i++) lists.forEach(l => { const m = l[i]; if(m && !dup.has(m.id) && !getR(m.id) && !seen[m.id]){ dup.add(m.id); out.push(m); } });
      return out.slice(0, 60);
    })();
    return sagaData[s.k];
  }
  sagaData[s.k] = cached('saga5:' + s.k, 24*7, async () => {
    let films = [];
    if(s.kw){
      const id = await resolveKeyword(s.kw);
      if(id){
        let page = 1, total = 1;
        do{
          const d = await tmdb('/discover/movie', { with_keywords:id, sort_by:'primary_release_date.asc', include_adult:'false', 'with_runtime.gte':60, with_original_language:'en|ko', page });
          films.push(...d.results.map(slim)); total = Math.min(d.total_pages || 1, 5); page++;
        }while(page <= total);
      }
    }
    for(const c of (s.col || [])){
      const id = await resolveCollection(c).catch(() => null);
      if(!id) continue;
      const d = await tmdb('/collection/' + id).catch(() => null);
      if(d) films.push(...(d.parts || []).map(slim));
    }
    for(const [q, y] of (s.extra || [])){        // films TMDB leaves out of a collection (spin-offs etc.)
      const d = await tmdb('/search/movie', { query:q, year:y, include_adult:'false' }).catch(() => null);
      const nm = t => (t || '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim(), want = nm(q), res = (d && d.results) || [];
      const hit = res.find(m => nm(m.title) === want) || res.find(m => nm(m.title).includes(want) || want.includes(nm(m.title)) && nm(m.title).length > 3);
      if(hit) films.push(slim(hit));
    }
    for(const id of (s.cid || [])){
      const d = await tmdb('/collection/' + id);
      films.push(...(d.parts || []).map(slim));
    }
    const seen = new Set();
    films = films.filter(f => f.title && keep(f) && !seen.has(f.id) && seen.add(f.id))
      .map(({ overview, ...f }) => f)
      .sort((a, b) => (a.date || '9999').localeCompare(b.date || '9999'));
    return films;
  }).then(f => { remember(f); return f; }).catch(e => { delete sagaData[s.k]; throw e; });
  return sagaData[s.k];
}

/* the stack */
function openRun(saga){
  const s = sheet(`<div class="runhead"><div><h2>${esc(saga.name)}</h2><div class="prog" id="rprog">Loading…</div></div>
    <button class="wbtn" id="rwatched">✓ Watched</button></div>
    <div id="rbody"><div class="msg" style="padding-top:80px">Stacking the films…</div></div>`, { tall:true });
  s.anchor = true;
  const b = s.body;
  let films = [], rel = [], up = [], i = 0;
  const setProg = () => {
    const done = rel.filter(f => getR(f.id)).length, w = rel.filter(f => !getR(f.id) && seen[f.id]).length;
    $('#rprog', b).textContent = `${rel.length} films · ${done} rated` + (w ? ` · ${w} watched` : '') + (up.length ? ` · ${up.length} coming` : '');
  };
  const paintWatched = () => {
    const wb = $('#rwatched', b), f = rel[i];
    wb.style.visibility = f ? '' : 'hidden';
    if(f){ const on = !!seen[f.id] || !!getR(f.id); wb.classList.toggle('on', on); wb.textContent = on ? '✓ Watched' : 'Watched?'; wb.disabled = !!getR(f.id); }
  };
  $('#rwatched', b).onclick = () => {
    const f = rel[i]; if(!f || getR(f.id)) return;
    const was = !!seen[f.id], undo = toggleSeen(f), at = i;
    paintBadges(); paintWatched(); setProg();
    if(!was) toast(`<span>Marked watched · ${esc(f.title)}</span>`, () => { undo(); paintBadges(); paintWatched(); setProg(); });
  };
  const render = () => { setProg(); i >= rel.length ? renderDone() : renderStack(); paintWatched(); };
  s.refresh = () => { setProg(); if(i < rel.length){ paintTop(); paintBadges(); paintWatched(); } };

  /* carousel: cards stay put in a row; swipe left for the next film, right to bring the previous one back */
  function renderStack(){
    const box = $('#rbody', b);
    box.innerHTML = `<div class="car nodrag">${rel.map((f, n) => `<div class="card cc" data-n="${n}">
        ${poster(f.poster, '', 'w500', f.title)}<span class="num">${n + 1} / ${rel.length}</span><span class="rb"></span>
        <div class="cap"><b>${esc(f.title)}</b><span>${esc(f.year)}</span></div></div>`).join('')}</div>
      <div class="runctl nodrag">${starsHTML(42, 6)}<div class="rv" id="rrv"></div>
        <div class="runbtns"><button class="pill line" id="rprev">‹ Previous</button><button class="pill line" id="rskip">Next ›</button></div></div>`;
    const s5 = $('.runctl .s5', box);
    bindStars(s5, (r, fin) => {
      paintStars(s5, r); $('#rrv', b).textContent = RWORDS[r];
      if(fin && r !== getR(rel[i].id)){ setRating(rel[i], r, true); paintBadges(); paintWatched(); }
    });
    $('#rskip', box).onclick = () => go(i + 1);
    $('#rprev', box).onclick = () => go(i - 1);
    paintBadges(); layout(i, false); paintTop(); dragCar($('.car', box));
  }
  function paintBadges(){
    $$('#rbody .cc', b).forEach(c => { const id = rel[+c.dataset.n].id, r = getR(id); $('.rb', c).textContent = r ? fmtR(r) + '★' : seen[id] ? '✓ Watched' : ''; });
  }
  function layout(pos, anim){
    const cards = $$('#rbody .cc', b); if(!cards.length) return;
    const w = cards[0].offsetWidth, step = w * 0.84;
    cards.forEach(c => {
      const d = +c.dataset.n - pos, ad = Math.abs(d);
      if(ad > 3.5){ if(c.style.visibility !== 'hidden') c.style.visibility = 'hidden'; return; }
      c.style.transition = anim ? '' : 'none';
      c.style.visibility = ad > 2.5 ? 'hidden' : '';
      c.style.transform = `translateX(calc(-50% + ${d * step}px)) scale(${1 - Math.min(ad, 1) * 0.14})`;
      c.style.opacity = String(Math.max(0, 1 - Math.min(ad, 2) * 0.42));
      c.style.zIndex = String(10 - Math.round(ad));
    });
    const p = $('#rprev', b); if(p) p.style.opacity = pos <= 0 ? .35 : 1;
  }
  function go(n){
    if(n < 0) n = 0;
    if(n >= rel.length){ i = rel.length; renderDone(); setProg(); paintWatched(); return; }
    i = n; layout(i, true); paintTop(); paintWatched();
  }
  function paintTop(){
    const s5 = $('#rbody .runctl .s5', b); if(!s5 || !rel[i]) return;
    const r = getR(rel[i].id); paintStars(s5, r); $('#rrv', b).textContent = r ? RWORDS[r] : '';
  }
  function dragCar(car){
    let x0, y0, dx = 0, down = false, moved = false, step = 1, startN = -1;
    car.addEventListener('pointerdown', e => {
      down = true; moved = false; x0 = e.clientX; y0 = e.clientY; dx = 0;
      const c = e.target.closest('.cc'); startN = c ? +c.dataset.n : -1;
      step = ($('.cc', car)?.offsetWidth || 300) * 0.84; car.setPointerCapture(e.pointerId);
    });
    car.addEventListener('pointermove', e => {
      if(!down) return;
      dx = e.clientX - x0;
      if(Math.abs(dx) > 6 || Math.abs(e.clientY - y0) > 6) moved = true;
      let pos = i - dx / step;
      if(pos < 0) pos = pos / 3; if(pos > rel.length - 1) pos = rel.length - 1 + (pos - rel.length + 1) / 3;
      layout(pos, false);
    });
    const end = () => {
      if(!down) return; down = false;
      if(dx < -50) go(i + 1);
      else if(dx > 50) go(i - 1);
      else { layout(i, true); if(!moved && startN >= 0){ suppressClick = Date.now(); if(startN === i) openMovie(rel[i].id); else go(startN); } }
    };
    car.addEventListener('pointerup', end);
    car.addEventListener('pointercancel', () => { down = false; layout(i, true); });
  }
  function renderDone(){
    const box = $('#rbody', b), rated = rel.filter(f => getR(f.id));
    const avg = rated.length ? rated.reduce((a, f) => a + getR(f.id), 0) / rated.length : 0;
    const best = [...rated].sort((a, c) => getR(c.id) - getR(a.id))[0];
    box.innerHTML = `<div class="done"><div class="small" style="letter-spacing:1.4px;font-weight:800;text-transform:uppercase">Franchise complete</div>
      <div class="big">${avg ? avg.toFixed(1) + '★' : '—'}</div><div class="small">your average across ${rated.length} of ${rel.length} films</div>
      ${best ? `<p style="margin:14px 0 4px">Your favorite: <b>${esc(best.title)}</b> <span class="mini">${starTxt(getR(best.id))}</span></p>` : ''}</div>
      <div style="margin-top:12px">${rel.map(f => `<div class="lrow" data-f="${f.id}">${poster(f.poster, 'thumb', 'w92', f.title)}
        <div class="li"><div class="lt">${esc(f.title)}</div><div class="ls">${esc(f.year)}</div></div><span class="mini">${starTxt(getR(f.id)) || (seen[f.id] ? '<span class="small">watched</span>' : '<span class="small">skipped</span>')}</span></div>`).join('')}</div>
      <div class="acts"><button class="pill line" id="rback">‹ Back</button><button class="pill line" id="ragain">Run it again</button><button class="pill" id="rclose">Done</button></div>`;
    $$('.lrow', box).forEach(r => r.onclick = () => openMovie(+r.dataset.f));
    $('#ragain', box).onclick = () => { i = 0; render(); };
    $('#rback', box).onclick = () => { i = rel.length - 1; render(); };
    $('#rclose', box).onclick = () => s.close();
  }
  loadSaga(saga).then(f => {
    films = f; rel = films.filter(released); up = films.filter(x => !released(x));
    if(!rel.length){ $('#rbody', b).innerHTML = '<div class="msg">No released films found for this series.</div>'; setProg(); return; }
    i = rel.findIndex(x => !getR(x.id) && !seen[x.id]); if(i < 0) i = rel.length;
    render(); fillTile(saga.k);
  }).catch(e => { $('#rbody', b).innerHTML = `<div class="msg">${e && e.message ? errText(e) : 'Could not find this series.'}</div>`; $('#rprog', b).textContent = ''; });
}

function renderChart(box, d, meta){

  ss.forEach(n => {

    rowsH += `<tr><th class="sl">S${n}</th><td class="avgc ${heat(a)}">${a == null ? '–' : a.toFixed(1)}</td>` + Array.from({ length:maxE }, (_, k) => {
      const e = k + 1, x = d.s[n].find(q => q[0] === e);

  box.innerHTML = `<div class="imdbbox"><span class="ib2">IMDb</span><b>${d.r.toFixed(1)}</b><span class="small">${fmtV(d.v)} votes · ${all.length} rated episodes</span></div>
    ${best ? `<div class="hl"><div data-s="${best.s}" data-e="${best.e}">Best episode<b>${esc(best.t || lbl(best))}</b>${lbl(best)} · ${best.r.toFixed(1)}</div>
      <div data-s="${worst.s}" data-e="${worst.e}">Lowest rated<b>${esc(worst.t || lbl(worst))}</b>${lbl(worst)} · ${worst.r.toFixed(1)}</div></div>` : ''}
    <div class="chartwrap"><table class="hm">${rowsH}</table></div>

  const info = (n, e) => {
    const x = (d.s[n] || []).find(q => q[0] === e); if(!x) return;
    $$('.hm td.sel', box).forEach(c => c.classList.remove('sel'));

const trailerURL = k => /^https?:/.test(k) ? k : 'https://www.youtube.com/watch?v=' + k;
function pickTrailer(v){

  const t = list.find(x => x.type === 'Trailer' && x.official) || list.find(x => x.type === 'Trailer') || list.find(x => x.type === 'Teaser');
  return t ? t.key : null;
}
function pickProviders(p){
  const us = p && p.results && p.results.US; if(!us) return null;
  const sl = a => (a || []).slice(0, 20).map(x => ({ n:x.provider_name, l:x.logo_path }));
  const rent = sl([...(us.rent || []), ...(us.buy || [])].filter((x, i, a) => a.findIndex(y => y.provider_id === x.provider_id) === i));
  return { link:us.link, stream:sl([...(us.flatrate || []), ...(us.free || []), ...(us.ads || [])]), rent };
}
// One logo per service: "Paramount+ Premium", "Paramount+ Essential", "Paramount+ Amazon Channel" and
// "Paramount+ Roku Premium Channel" all count as Paramount+. The plainest name's logo is the one kept.
const PROV_EXTRA = new Set(['premium','essential','basic','standard','with','ads','ad','supported','showtime','amazon','apple','tv','channel','channels','roku','plus','kids','the']);
function provKey(n){
  const w = (n || '').toLowerCase().replace(/\+/g, ' plus ').replace(/[^a-z0-9 ]+/g, ' ').split(/\s+/).filter(Boolean);
  while(w.length > 1 && PROV_EXTRA.has(w[w.length - 1])) w.pop();
  // "Amazon Channel", "Apple TV Channel" and similar in the middle: cut at the first add-on word after the brand
  const cut = w.findIndex((x, i) => i > 0 && ['amazon','apple','roku','with','premium','essential','basic','standard'].includes(x));
  return (cut > 0 ? w.slice(0, cut) : w).filter((x, i, a) => !(i === a.length - 1 && x === 'plus' && a.length > 1)).join(' ') || n;
}
function uniqProv(list){
  const out = [], at = new Map();
  (list || []).forEach(x => {
    const k = provKey(x.n);
    if(!at.has(k)){ at.set(k, out.length); out.push(x); }
    else if(x.n.length < out[at.get(k)].n.length) out[at.get(k)] = x;
  });
  return out;
}
function provHTML(p){
  if(p) p = { ...p, stream:uniqProv(p.stream), rent:uniqProv(p.rent) };
  if(!p || (!p.stream.length && !p.rent.length)) return '';
  const row = a => `<div class="plogos">${a.slice(0, 8).map(x => `<img src="${IMG}w92${x.l}" alt="${esc(x.n)}" title="${esc(x.n)}">`).join('')}</div>`;
  return `<div class="prov fadein">${p.stream.length ? '<div class="lbl">Stream it on</div>' + row(p.stream) : ''}
    ${p.rent.length ? '<div class="lbl">Rent or buy</div>' + row(p.rent) : ''}<div class="small" style="margin-top:8px">US availability from JustWatch</div></div>`;
}

      const d = await r.json();

/* ---------- Year in review ---------- */
function reviewData(){
  const yr = new Date().getFullYear();
  const list = Object.entries(ratings).filter(([k, r]) => !k.startsWith('tv') && r.at && new Date(r.at).getFullYear() === yr).map(([k, r]) => ({ id:+k, ...r }));
  const all = list.length ? list : Object.entries(ratings).filter(([k]) => !k.startsWith('tv')).map(([k, r]) => ({ id:+k, ...r }));
  const avg = all.length ? all.reduce((a, f) => a + f.r, 0) / all.length : 0;
  const top = [...all].sort((a, b) => b.r - a.r || b.at - a.at).slice(0, 5);
  const gc = {}; all.forEach(f => (f.g || (movies.get(f.id) || {}).genres || []).forEach(g => { if(GNAME[g]) gc[g] = (gc[g] || 0) + 1; }));
  const topG = Object.entries(gc).sort((a, b) => b[1] - a[1])[0];
  const dc = {}; all.forEach(f => { if(f.year) { const d = Math.floor(+f.year / 10) * 10; dc[d] = (dc[d] || 0) + 1; } });
  const topD = Object.entries(dc).sort((a, b) => b[1] - a[1])[0];
  const fives = all.filter(f => f.r === 5).length;
  return { yr, count:all.length, thisYear:list.length > 0, avg, top, genre:topG ? GNAME[topG[0]] : '—', decade:topD ? topD[0] + 's' : '—', fives };
}
function openReview(){
  const d = reviewData();
  const s = sheet(`<div class="rev"><div class="small" style="letter-spacing:1.4px;font-weight:800;text-transform:uppercase">${d.thisYear ? 'Your ' + d.yr + ' in film' : 'Your film life so far'}</div>
    <div class="big">${d.count}</div><div class="small">films rated</div>
    <div class="tops">${d.top.map(f => `<div>${poster(f.poster, '', 'w185', f.title)}<span>${fmtR(f.r)}★</span></div>`).join('')}</div>
    <div class="small">Your top ${d.top.length}</div>
    <div class="rgrid"><div><b>${d.avg ? d.avg.toFixed(1) + '★' : '—'}</b><span>Average rating</span></div><div><b>${esc(d.genre)}</b><span>Favorite genre</span></div>
      <div><b>${esc(d.decade)}</b><span>Your decade</span></div><div><b>${d.fives}</b><span>Five-star films</span></div></div>
    <button class="btn" id="rsave">Save as image</button></div>`);
  $('#rsave', s.body).onclick = () => saveReviewImage(d, $('#rsave', s.body));
}
async function saveReviewImage(d, btn){
  btn.textContent = 'Making image…';
  const W = 1080, H = 1350, c = document.createElement('canvas'); c.width = W; c.height = H;
  const x = c.getContext('2d');
  const g = x.createLinearGradient(0, 0, W, H); g.addColorStop(0, '#2a1d2e'); g.addColorStop(1, '#0c0a0f');
  x.fillStyle = g; x.fillRect(0, 0, W, H);
  try{ await document.fonts.load('700 100px "Barlow Condensed"'); }catch(e){}
  const disp = (sz) => `700 ${sz}px "Barlow Condensed", "Arial Narrow", sans-serif`;
  x.textAlign = 'center';
  x.fillStyle = '#ffb547'; x.font = disp(54); x.fillText('ROLLING CREDITS', W / 2, 110);
  x.fillStyle = '#9c93a9'; x.font = '600 34px system-ui, sans-serif'; x.fillText(d.thisYear ? `MY ${d.yr} IN FILM` : 'MY FILM LIFE SO FAR', W / 2, 165);
  x.fillStyle = '#ffb547'; x.font = disp(230); x.fillText(String(d.count), W / 2, 390);
  x.fillStyle = '#f4efe9'; x.font = '600 38px system-ui, sans-serif'; x.fillText('films rated', W / 2, 445);
  const load = src => new Promise(res => { const im = new Image(); im.crossOrigin = 'anonymous'; im.onload = () => res(im); im.onerror = () => res(null); im.src = src; });
  const imgs = await Promise.all(d.top.map(f => f.poster ? load(IMG + 'w342' + f.poster) : Promise.resolve(null)));
  const pw = 176, ph = 264, gap = 22, total = d.top.length * pw + (d.top.length - 1) * gap; let px = (W - total) / 2;
  d.top.forEach((f, i) => {
    x.save(); x.beginPath(); x.roundRect(px, 510, pw, ph, 16); x.clip();
    if(imgs[i]) x.drawImage(imgs[i], px, 510, pw, ph); else { x.fillStyle = '#262030'; x.fillRect(px, 510, pw, ph); x.fillStyle = '#9c93a9'; x.font = '600 22px system-ui'; x.fillText(f.title.slice(0, 14), px + pw / 2, 650); }
    x.restore();
    x.fillStyle = '#ffb547'; x.font = disp(40); x.fillText(fmtR(f.r) + '★', px + pw / 2, 830);
    px += pw + gap;
  });
  const stats = [[d.avg ? d.avg.toFixed(1) + '★' : '—', 'AVERAGE RATING'], [d.genre.toUpperCase(), 'FAVORITE GENRE'], [d.decade.toUpperCase(), 'YOUR DECADE'], [String(d.fives), 'FIVE-STAR FILMS']];
  stats.forEach(([v, l], i) => {
    const cx = i % 2 ? W * 0.72 : W * 0.28, cy = 960 + Math.floor(i / 2) * 170;
    x.fillStyle = '#f4efe9'; x.font = disp(76); x.fillText(v, cx, cy);
    x.fillStyle = '#9c93a9'; x.font = '700 26px system-ui, sans-serif'; x.fillText(l, cx, cy + 46);
  });
  let blob = null;
  try{ blob = await new Promise(r => c.toBlob(r, 'image/png')); }catch(e){}
  if(!blob){ btn.textContent = 'Could not make the image'; return; }
  const file = new File([blob], `reel-log-${d.yr}.png`, { type:'image/png' });
  btn.textContent = 'Save as image';
  if(navigator.canShare && navigator.canShare({ files:[file] })){ try{ await navigator.share({ files:[file], title:'My year in film' }); return; }catch(e){ if(e.name === 'AbortError') return; } }
  // sharing isn't available here: show the image so it can be pressed and held to save
  const url = URL.createObjectURL(blob);
  const holder = btn.parentElement.querySelector('.revimg') || btn.insertAdjacentElement('afterend', Object.assign(document.createElement('div'), { className:'revimg' }));
  holder.innerHTML = `<img src="${url}" alt="Your year in film" style="width:100%;border-radius:14px;margin-top:14px">`;
}

/* ---------- Settings ---------- */
function openSettings(){
  const hadKey = !!store.get(K_KEY, '');
  const s = sheet(`<h2 class="stitle">Settings</h2>
    <label class="f">TMDB API key or read access token</label>
    <input id="key" value="${esc(store.get(K_KEY, ''))}" placeholder="Paste your key" autocomplete="off">
    <div class="small" style="margin-top:6px">Free at themoviedb.org → Settings → API.</div>
    <button class="btn" id="saveKey">Save key</button>
    <label class="f">OMDb key for Rotten Tomatoes scores (optional)</label>
    <input id="okey" value="${esc(store.get(K_OMDB, ''))}" placeholder="Paste your OMDb key" autocomplete="off">
    <div class="small" style="margin-top:6px">Free at omdbapi.com (API Key, free tier). Up to 1,000 lookups a day; each film is looked up once a week.</div>
    <label class="toggle"><input type="checkbox" id="hide" ${hideRated ? 'checked' : ''}> Hide films and shows I've rated while browsing</label>
    <label class="f">Backup</label>
    <button class="btn ghost" id="exp" style="margin-top:0">Export ratings & diary (.json)</button>
    <button class="btn ghost" id="imp">Import backup</button>
    <input type="file" id="file" accept=".json,application/json" hidden>
    <p class="small" style="margin-top:18px">Film data and posters from TMDB. This product uses the TMDB API but is not endorsed or certified by TMDB. IMDb ratings: information courtesy of IMDb (imdb.com), used with permission for personal, non-commercial use. Streaming availability from JustWatch. Rotten Tomatoes scores via OMDb.</p>`);
  const b = s.body;
  $('#saveKey', b).onclick = async () => {
    const k = $('#key', b).value.trim(); store.set(K_KEY, k);
    const done = () => { s.close(); if(!hadKey || !k){ built.discover = built.genres = built.tv = false; setView(view); } };
    if(!k){ done(); return; }
    $('#saveKey', b).textContent = 'Checking…';
    try{ await tmdb('/configuration'); done(); }
    catch(err){
      $('#saveKey', b).textContent = err.message === 'badkey' ? 'Key rejected — try again' : 'Saved (could not verify)';
      if(err.message !== 'badkey') setTimeout(done, 900);
    }
  };
  $('#okey', b).onchange = e => { store.set(K_OMDB, e.target.value.trim()); toast(e.target.value.trim() ? 'OMDb key saved' : 'OMDb key removed'); };
  $('#hide', b).onchange = e => { hideRated = e.target.checked; store.set(K_HIDE, hideRated); built.discover = built.genres = built.tv = false; setView(view); };
  $('#exp', b).onclick = () => {
    const blob = new Blob([JSON.stringify({ app:'reellog', v:5, entries, ratings, watch, seen, favs }, null, 1)], { type:'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = `rolling-credits-${today()}.json`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  };
  $('#imp', b).onclick = () => $('#file', b).click();
  $('#file', b).onchange = async ev => {
    const f = ev.target.files[0]; if(!f) return;
    try{
      const data = JSON.parse(await f.text());
      const list = Array.isArray(data) ? data : data.entries || [];
      const ids = new Set(entries.map(e => e.id)); let n = 0, rn = 0;
      for(const e of list) if(e && e.id && e.tmdb && e.date && !ids.has(e.id)){ entries.push(e); n++; }
      if(data.watch) for(const [id, w] of Object.entries(data.watch)) if(!watch[id] && !ratings[id]) watch[id] = w;
      if(data.seen) for(const [id, w] of Object.entries(data.seen)) if(!seen[id] && !ratings[id]) seen[id] = w;
      if(data.favs) for(const [id, p] of Object.entries(data.favs)) if(!favs[id]) favs[id] = p;
      if(data.ratings) for(const [id, r] of Object.entries(data.ratings)) if(!ratings[id] || (r.at || 0) > (ratings[id].at || 0)){ ratings[id] = r; rn++; }
      if(!data.ratings) list.forEach(e => { if(e.rating && !ratings[e.tmdb]){ ratings[e.tmdb] = { r:e.rating, title:e.title, year:e.year, poster:e.poster, at:e.added || 0 }; rn++; } });
      saveAll(); s.close(); afterChange(); toast(`Imported ${n} diary entr${n === 1 ? 'y' : 'ies'} and ${rn} rating${rn === 1 ? '' : 's'}`);
    }catch(e){ toast('That file is not a Rolling Credits backup.'); }
  };
}
