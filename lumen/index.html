<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Lumen</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@200;300;400;500;600&family=Orbitron:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --bg:#000;--lc:255,255,255;--bgc:#000;--text:#f2f2f2;--muted:rgba(var(--lc),.52);--faint:rgba(var(--lc),.28);
  --font:'Sora',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);
  --ease:cubic-bezier(.22,.9,.24,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bgc);transition:background .5s;color:var(--text);font:15px/1.45 var(--font);overflow:hidden;overscroll-behavior:none}
button,input{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
svg{display:block}
img{display:block}
.ico{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

/* ---------- background: soft drifting light so the glass has something to bend ---------- */
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.orb{position:absolute;border-radius:50%;filter:blur(70px);opacity:.55}
.orb.a{width:70vmax;height:70vmax;left:-25vmax;top:-30vmax;background:radial-gradient(circle,rgba(var(--lc),.16),transparent 62%);animation:drift1 26s ease-in-out infinite alternate}
.orb.b{width:60vmax;height:60vmax;right:-28vmax;bottom:-22vmax;background:radial-gradient(circle,rgba(200,200,210,.13),transparent 62%);animation:drift2 32s ease-in-out infinite alternate}
@keyframes drift1{to{transform:translate(18vmax,14vmax) scale(1.1)}}
@keyframes drift2{to{transform:translate(-16vmax,-12vmax) scale(1.15)}}

/* ---------- liquid glass ---------- */
.glass{position:relative;isolation:isolate;
  background:linear-gradient(150deg,rgba(var(--lc),.13),rgba(var(--lc),.035) 42%,rgba(var(--lc),.07));
  -webkit-backdrop-filter:blur(24px) saturate(170%) brightness(1.08);backdrop-filter:blur(24px) saturate(170%) brightness(1.08);
  box-shadow:inset 0 1px 0 rgba(var(--lc),.32),inset 0 -1px 0 rgba(var(--lc),.05),inset 0 0 24px rgba(var(--lc),.035),0 14px 40px rgba(0,0,0,.55)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;z-index:-1;
  background:linear-gradient(135deg,rgba(var(--lc),.62),rgba(var(--lc),.08) 30%,rgba(var(--lc),0) 55%,rgba(var(--lc),.22) 85%,rgba(var(--lc),.45));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
.glass::after{content:"";position:absolute;left:12%;right:12%;top:1px;height:min(42%,22px);border-radius:0 0 999px 999px;pointer-events:none;z-index:-1;
  background:linear-gradient(180deg,rgba(var(--lc),.10),rgba(var(--lc),0));filter:blur(1px)}
.press{transition:transform .25s var(--ease),background .25s}
.press:active{transform:scale(.96)}

/* ---------- home ---------- */
#home{position:fixed;inset:0;z-index:1}
.stage{position:absolute;left:0;right:0;top:44%;transform:translateY(-50%);display:flex;flex-direction:column;align-items:center;padding:0 22px;
  transition:top .55s var(--ease),transform .55s var(--ease)}
body.q .stage{transform:translateY(-50%) translateY(var(--lift,0px))}
.mark{font-family:'Orbitron','Sora',sans-serif;font-weight:500;font-size:38px;line-height:1;letter-spacing:.3em;text-indent:.3em;color:#fff;margin:0 0 40px;text-transform:uppercase;
  text-shadow:0 0 18px rgba(var(--lc),.35),0 0 42px rgba(var(--lc),.12);transition:opacity .3s,filter .45s;height:36px}
body.q .mark{opacity:0;filter:blur(6px)}
.sw{position:relative;width:min(560px,100%)}
.halo{position:absolute;inset:0;border-radius:999px;pointer-events:none;
  box-shadow:0 0 14px rgba(var(--lc),.28),0 0 38px rgba(var(--lc),.12),inset 0 0 12px rgba(var(--lc),.08);
  animation:breathe 5s ease-in-out infinite;transition:opacity .4s}
/* the search bar: clear glass with a thin lit outline */
.sbar.glass{background:rgba(var(--lc),.015);-webkit-backdrop-filter:none;backdrop-filter:none;box-shadow:none}
.sbar.glass::after{display:none}
.sbar.glass::before{padding:1.2px;background:linear-gradient(100deg,rgba(var(--lc),.95),rgba(var(--lc),.35) 25%,rgba(var(--lc),.18) 50%,rgba(var(--lc),.35) 75%,rgba(var(--lc),.95))}
.sw:focus-within .halo{box-shadow:0 0 18px rgba(var(--lc),.4),0 0 52px rgba(var(--lc),.16),inset 0 0 14px rgba(var(--lc),.1)}
.sw:focus-within .halo{animation-duration:3s}
body.q .halo{opacity:.45}
@keyframes breathe{0%,100%{opacity:.45}50%{opacity:1}}
.sbar{height:60px;border-radius:999px;display:flex;align-items:center;gap:12px;padding:0 10px 0 22px}
.sbar .ico{width:21px;height:21px;color:rgba(var(--lc),.7);flex:none}
.sbar input{flex:1;min-width:0;height:100%;background:none;border:0;outline:none;font-size:16.5px;font-weight:300;letter-spacing:.01em}
.sbar input::placeholder{color:rgba(var(--lc),.42)}
.sbar input::-webkit-search-cancel-button{display:none}
.clr{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:rgba(var(--lc),.65);opacity:0;pointer-events:none;transition:opacity .2s}
body.typed .clr{opacity:1;pointer-events:auto}
.clr .ico{width:16px;height:16px}
.hint{margin-top:22px;font-size:12px;font-weight:300;color:rgba(var(--lc),.4);letter-spacing:.06em;text-align:center;transition:opacity .3s;min-height:18px}
body.q .hint{opacity:0}

/* results */
.res{position:absolute;left:0;right:0;top:calc(var(--st) + 92px);bottom:0;overflow-y:auto;padding:4px 22px calc(120px + var(--sb));
  opacity:0;pointer-events:none;transition:opacity .35s .1s;overscroll-behavior:contain;scrollbar-width:none}
.res::-webkit-scrollbar{display:none}
body.q .res{opacity:1;pointer-events:auto}
.res .in{width:min(560px,100%);margin:0 auto;display:flex;flex-direction:column;gap:10px}
.ri{display:flex;align-items:center;gap:14px;border-radius:20px;padding:9px 16px 9px 9px;text-align:left;width:100%;animation:rise .35s var(--ease) both}
.ri img,.ri .np{width:46px;height:69px;border-radius:11px;object-fit:cover;flex:none;background:rgba(var(--lc),.06)}
.ri .t{flex:1;min-width:0}
.ri .t b{display:block;font-weight:400;font-size:15px;line-height:1.25}
.ri .t span{display:block;font-size:12px;color:var(--muted);font-weight:300;margin-top:3px}
.ri .chev{width:18px;height:18px;color:var(--faint)}
.empty{text-align:center;color:var(--muted);font-weight:300;font-size:13.5px;padding:40px 10px;line-height:1.6}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}

/* ---------- dock ---------- */
.dock{position:fixed;left:50%;bottom:calc(var(--sb) + 18px);transform:translateX(-50%);z-index:30;display:flex;gap:6px;padding:7px;border-radius:20px;width:min(560px,calc(100% - 44px));
  transition:transform .45s var(--ease),opacity .3s}
body.playing .dock,body.kb .dock,body.tp .dock{transform:translate(-50%,140%);opacity:0;pointer-events:none}
.dk{flex:1;display:flex;align-items:center;justify-content:center;gap:9px;height:50px;padding:0 20px;border-radius:14px;color:rgba(var(--lc),.72);font-size:13px;font-weight:400;letter-spacing:.04em;transition:background .3s,color .3s}
.dk .ico{width:20px;height:20px}
.dk.on{background:rgba(var(--lc),.16);color:#fff;box-shadow:inset 0 1px 0 rgba(var(--lc),.25),0 0 18px rgba(var(--lc),.08)}

/* ---------- sheets ---------- */
.sheet{position:fixed;inset:0;z-index:10;background:rgba(0,0,0,.62);-webkit-backdrop-filter:blur(34px) saturate(140%);backdrop-filter:blur(34px) saturate(140%);
  transform:translateY(102%);transition:transform .5s var(--ease);display:flex;flex-direction:column}
.sheet.open{transform:none}
.sheet.z2{z-index:20;background:var(--bgc)}
#tbody{padding-top:0}
.shead{flex:none;display:flex;align-items:center;gap:12px;padding:calc(var(--st) + 16px) 20px 12px}
.shead h2{margin:0;font-weight:300;font-size:26px;letter-spacing:.02em;flex:1}
.shead small{font-size:12px;color:var(--muted);font-weight:300;letter-spacing:.04em}
.ibtn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;flex:none;color:#fff}
.ibtn .ico{width:19px;height:19px}
.ibtn.spin .ico{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.sbody{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:4px 20px calc(120px + var(--sb));scrollbar-width:none}
.sbody::-webkit-scrollbar{display:none}

/* segmented control */
.ctrls{display:flex;gap:10px;align-items:center;margin:4px 0 18px}
.seg{display:flex;padding:4px;border-radius:999px;flex:1}
.seg button{flex:1;height:34px;border-radius:999px;font-size:12.5px;color:rgba(var(--lc),.6);letter-spacing:.03em;transition:background .3s,color .3s}
.seg button.on{background:rgba(var(--lc),.17);color:#fff;box-shadow:inset 0 1px 0 rgba(var(--lc),.22)}
.sortb{height:42px;padding:0 16px;border-radius:999px;font-size:12.5px;color:rgba(var(--lc),.8);display:flex;align-items:center;gap:7px;flex:none}
.sortb .ico{width:15px;height:15px}

/* poster grid */
.pg{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 12px}
@media(min-width:640px){.pg{grid-template-columns:repeat(5,1fr)}}
.pt{text-align:left;animation:rise .4s var(--ease) both}
.pt .pf{position:relative;aspect-ratio:2/3;border-radius:14px;overflow:hidden;background:rgba(var(--lc),.05);
  box-shadow:0 0 0 1px rgba(var(--lc),.09) inset,0 10px 24px rgba(0,0,0,.5)}
.pt .pf img{width:100%;height:100%;object-fit:cover;filter:grayscale(.15)}
.pt .pf::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(160deg,rgba(var(--lc),.16),transparent 35%);pointer-events:none}
.pt .np{position:absolute;inset:0;display:grid;place-items:center;padding:10px;text-align:center;font-size:12px;font-weight:300;color:var(--muted)}
.pt .pb{position:absolute;left:8px;right:8px;bottom:8px;height:2px;border-radius:2px;background:rgba(var(--lc),.2);overflow:hidden}
.pt .pb i{display:block;height:100%;background:rgb(var(--lc))}
.pt .cap{margin-top:7px;font-size:11.5px;font-weight:300;color:rgba(var(--lc),.75);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- title page ---------- */
.hero{position:relative;height:min(52vh,460px);margin:0 -20px;background:#000 center/cover no-repeat}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.35),rgba(0,0,0,0) 30%,rgba(0,0,0,.6) 70%,#000)}
.hero .bk{position:absolute;left:16px;top:calc(var(--st) + 14px);z-index:2}
.tbody{position:relative;margin-top:-90px;z-index:1}
.ttl{margin:0;font-weight:300;font-size:30px;line-height:1.12;letter-spacing:.005em}
.meta{margin-top:8px;font-size:12.5px;color:var(--muted);font-weight:300;letter-spacing:.04em}
.ov{margin:16px 0 0;font-size:14px;font-weight:300;line-height:1.65;color:rgba(var(--lc),.78);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.ov.full{-webkit-line-clamp:unset}
.play{margin-top:22px;width:100%;height:58px;border-radius:999px;display:flex;align-items:center;justify-content:center;gap:12px;font-size:15px;font-weight:400;letter-spacing:.06em;
  color:#000;background:linear-gradient(180deg,rgb(var(--lc)),#d9d9d9);box-shadow:0 0 0 1px rgba(var(--lc),.6) inset,0 0 34px rgba(var(--lc),.22),0 12px 30px rgba(0,0,0,.6)}
.play svg{width:16px;height:16px;fill:#000}
.play[disabled]{opacity:.5}
.psub{text-align:center;margin-top:10px;font-size:11.5px;color:var(--muted);font-weight:300;letter-spacing:.04em;min-height:16px}
.row2{display:flex;gap:10px;margin-top:12px}
.row2 button{flex:1;height:44px;border-radius:999px;font-size:12.5px;letter-spacing:.04em;color:rgba(var(--lc),.85)}
.lbl{margin:28px 0 12px;font-size:11px;font-weight:400;letter-spacing:.32em;text-transform:uppercase;color:var(--faint)}
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -20px;padding:2px 20px 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:38px;padding:0 16px;border-radius:999px;font-size:12.5px;color:rgba(var(--lc),.7);letter-spacing:.03em}
.chip.on{color:#000;background:rgb(var(--lc));box-shadow:0 0 18px rgba(var(--lc),.25)}
.chip.on::before,.chip.on::after{display:none}
.eps{display:flex;flex-direction:column;gap:10px}
.ep{display:flex;align-items:center;gap:14px;border-radius:18px;padding:10px 14px 10px 10px;text-align:left;width:100%}
.ep .th{position:relative;width:112px;aspect-ratio:16/9;border-radius:11px;overflow:hidden;flex:none;background:rgba(var(--lc),.06)}
.ep .th img{width:100%;height:100%;object-fit:cover;filter:grayscale(.2)}
.ep .th .pb{position:absolute;left:0;right:0;bottom:0;height:2px;background:rgba(var(--lc),.2)}
.ep .th .pb i{display:block;height:100%;background:rgb(var(--lc))}
.ep .et{flex:1;min-width:0}
.ep .et b{display:block;font-weight:400;font-size:13.5px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ep .et span{display:block;font-size:11.5px;color:var(--muted);font-weight:300;margin-top:3px}
.ep .ck{width:20px;height:20px;color:rgba(var(--lc),.85);flex:none}

/* ---------- settings ---------- */
.card{border-radius:24px;padding:18px;margin-bottom:14px}
.card h3{margin:0 0 4px;font-weight:400;font-size:15px}
.card p{margin:0 0 14px;font-size:12.5px;color:var(--muted);font-weight:300;line-height:1.55}
.card p a{color:#fff}
.fld{display:flex;align-items:center;gap:8px;height:50px;border-radius:16px;padding:0 6px 0 16px;background:rgba(0,0,0,.35);box-shadow:inset 0 0 0 1px rgba(var(--lc),.12)}
.fld input{flex:1;min-width:0;background:none;border:0;outline:none;font-size:14px;font-weight:300;height:100%}
.fld button{height:38px;padding:0 14px;border-radius:12px;font-size:12.5px;color:rgba(var(--lc),.75)}
.fld button.sv{background:rgb(var(--lc));color:#000}
.stat{margin-top:10px;font-size:12px;color:var(--muted);font-weight:300;min-height:16px}
.tg{display:flex;align-items:center;justify-content:space-between;gap:14px;width:100%;text-align:left;padding:4px 0}
.tg + .tg{margin-top:12px}
.tg span{font-size:14px;font-weight:300}
.tg small{display:block;font-size:11.5px;color:var(--muted)}
.sw2{width:50px;height:30px;border-radius:999px;background:rgba(var(--lc),.12);position:relative;flex:none;transition:background .3s;box-shadow:inset 0 0 0 1px rgba(var(--lc),.14)}
.sw2::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#bbb;transition:transform .35s var(--ease),background .3s}
.tg.on .sw2{background:rgba(var(--lc),.85)}
.tg.on .sw2::after{transform:translateX(20px);background:#000}
.wide{width:100%;height:48px;border-radius:999px;font-size:13px;letter-spacing:.05em}
.ver{text-align:center;font-size:11px;color:var(--faint);letter-spacing:.2em;margin-top:22px}

/* ---------- player ---------- */
#player{position:fixed;inset:0;z-index:50;background:#000;display:none}
body.playing #player{display:block}
#player video{position:absolute;inset:0;width:100%;height:100%;background:#000}
.ptop{position:absolute;left:0;right:0;top:0;z-index:2;display:flex;align-items:center;gap:10px;padding:calc(var(--st) + 12px) 14px 30px;
  background:linear-gradient(180deg,rgba(0,0,0,.7),transparent);transition:opacity .4s}
.ptop.hide{opacity:0;pointer-events:none}
.ptop .pt2{flex:1;min-width:0;font-size:13.5px;font-weight:300;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ptop .pill{height:40px;padding:0 16px;border-radius:999px;font-size:12.5px;letter-spacing:.04em;flex:none}
.pmsg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:1;text-align:center;font-weight:300;font-size:14px;color:var(--muted);width:80%;line-height:1.6}
.pmsg .dots{display:inline-block;width:28px;height:28px;border-radius:50%;border:1.5px solid rgba(var(--lc),.2);border-top-color:rgb(var(--lc));animation:spin 1s linear infinite;margin-bottom:14px}
.pnext{position:absolute;right:16px;bottom:calc(var(--sb) + 80px);z-index:2;height:46px;padding:0 20px;border-radius:999px;font-size:13px;display:none}
.pnext.show{display:block}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(var(--sb) + 92px);transform:translate(-50%,20px);z-index:60;padding:12px 20px;border-radius:999px;font-size:13px;font-weight:300;
  opacity:0;pointer-events:none;transition:opacity .3s,transform .4s var(--ease);max-width:88vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ================= outlined light glass (applies everywhere) ================= */
@property --a{syntax:'<angle>';inherits:false;initial-value:0deg}
.glass{background:linear-gradient(180deg,rgba(var(--lc),.04),rgba(var(--lc),.012));-webkit-backdrop-filter:none;backdrop-filter:none;
  box-shadow:0 0 14px rgba(var(--lc),.045),inset 0 0 14px rgba(var(--lc),.025);transition:box-shadow .35s,transform .25s var(--ease),color .3s}
.glass::after{display:none}
.glass::before{background:linear-gradient(100deg,rgba(var(--lc),.6),rgba(var(--lc),.2) 22%,rgba(var(--lc),.09) 50%,rgba(var(--lc),.2) 78%,rgba(var(--lc),.6))}
.glass.on{color:#fff;box-shadow:0 0 16px rgba(var(--lc),.22),0 0 42px rgba(var(--lc),.07),inset 0 0 12px rgba(var(--lc),.09)}
.glass.on::before{display:block;background:linear-gradient(100deg,rgb(var(--lc)),rgba(var(--lc),.6) 30%,rgba(var(--lc),.42) 50%,rgba(var(--lc),.6) 70%,rgb(var(--lc)))}
.chip.on{background:linear-gradient(180deg,rgba(var(--lc),.07),rgba(var(--lc),.015));color:#fff}
.lit,.seg button.on,.dk.on{color:#fff;background:rgba(var(--lc),.045);box-shadow:inset 0 0 0 1px rgba(var(--lc),.72),0 0 14px rgba(var(--lc),.2),inset 0 0 10px rgba(var(--lc),.08)}
/* a light that travels around the outline while something loads */
.glass.busy::before,.sbar.glass.busy::before{background:conic-gradient(from var(--a),rgba(var(--lc),.16) 0deg,rgba(var(--lc),.16) 220deg,rgba(var(--lc),.7) 285deg,rgb(var(--lc)) 310deg,rgba(var(--lc),.16) 350deg);animation:orbit 1.8s linear infinite}
@keyframes orbit{to{--a:360deg}}
.sheet{background:color-mix(in srgb,var(--bgc) 94%,transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
/* dock: a pill with four tabs; a little dark tint so it reads over posters */
.dock{border-radius:999px;width:min(430px,calc(100% - 36px));gap:4px;padding:6px;background:rgba(0,0,0,.55);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
.dk{flex-direction:column;gap:4px;height:54px;padding:0;border-radius:999px;font-size:10.5px;letter-spacing:.08em;color:rgba(var(--lc),.55)}
.dk .ico{width:21px;height:21px}
/* posters wait in black and white and come into color when touched */
.pt .pf{box-shadow:inset 0 0 0 1px rgba(var(--lc),.14),0 0 14px rgba(var(--lc),.04)}
.pt .pf::after{background:linear-gradient(160deg,rgba(var(--lc),.08),transparent 35%);box-shadow:inset 0 0 0 1px rgba(var(--lc),.14)}
.pt:active .pf::after{box-shadow:inset 0 0 0 1px rgba(var(--lc),.7),0 0 14px rgba(var(--lc),.2)}
.play{color:#fff;background:linear-gradient(180deg,rgba(var(--lc),.07),rgba(var(--lc),.015));box-shadow:0 0 18px rgba(var(--lc),.24),0 0 50px rgba(var(--lc),.08),inset 0 0 14px rgba(var(--lc),.1);animation:breathe2 5s ease-in-out infinite}
.play svg{fill:#fff}
@keyframes breathe2{0%,100%{box-shadow:0 0 12px rgba(var(--lc),.16),0 0 34px rgba(var(--lc),.05),inset 0 0 12px rgba(var(--lc),.07)}50%{box-shadow:0 0 20px rgba(var(--lc),.3),0 0 56px rgba(var(--lc),.1),inset 0 0 16px rgba(var(--lc),.12)}}

/* watching */

/* search bar: a soft light that travels clockwise around the outline */
.sbar.glass{box-shadow:0 0 16px rgba(var(--lc),.08),inset 0 0 14px rgba(var(--lc),.03)}
.sbar.glass::before{padding:1.2px;background:conic-gradient(from var(--a),rgba(var(--lc),.24) 0deg,rgba(var(--lc),.24) 190deg,rgba(var(--lc),.7) 275deg,rgb(var(--lc)) 312deg,rgba(var(--lc),.24) 356deg);animation:orbit 10s linear infinite}
.halo{inset:-4px;box-shadow:none;animation:none;filter:blur(9px);opacity:.95}
.halo::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:5px;
  background:conic-gradient(from var(--a),transparent 0deg,transparent 210deg,rgba(var(--lc),.55) 285deg,rgb(var(--lc)) 314deg,transparent 356deg);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);
  animation:orbit 10s linear infinite}
.sw:focus-within .halo{box-shadow:none;opacity:1}

body.q .halo{opacity:.5}
/* pages fade in instead of sliding up */
.sheet,.sheet.z2{transform:translateY(12px) scale(.992);opacity:0;visibility:hidden;

/* library carousel on the home screen */

.ctrack{display:flex;gap:26px;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain;

/* ================= title page: tall art, centered white title logo, one lit Play ================= */
#tbody{position:relative}

  background-image:linear-gradient(45deg,transparent 50%,rgba(var(--lc),.8) 50%),linear-gradient(135deg,rgba(var(--lc),.8) 50%,transparent 50%);
  background-position:calc(100% - 17px) 55%,calc(100% - 12px) 55%;background-size:5px 5px;background-repeat:no-repeat}

<body>

<script>
'use strict';
/* ================= basics ================= */
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const IMG = 'https://image.tmdb.org/t/p/';
const P = 'lumen.';
const K_RD = P + 'rdkey', K_TM = P + 'tmdbkey', K_LIB = P + 'lib', K_PROG = P + 'progress', K_DONE = P + 'done', K_VLC = P + 'vlc', K_SORT = P + 'sort', K_KIND = P + 'kind';
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){
    const j = JSON.stringify(v);
    try{ localStorage.setItem(k, j); return true; }catch(e){}
    try{ Object.keys(localStorage).filter(x => x.startsWith(P + 'd.')).forEach(x => localStorage.removeItem(x)); localStorage.setItem(k, j); return true; }catch(e){ return false; }
  }
};
// First launch: copy the keys, library list and resume points from the Rolling Credits library app on this site. Its data is only read.
(function importRC(){ try{
  if(localStorage.getItem(P + 'imported')) return;
  [['rclib.rdkey', K_RD], ['rclib.tmdbkey', K_TM], ['reellog.tmdbkey', K_TM], ['rclib.rdlib', K_LIB], ['rclib.progress', K_PROG], ['rclib.done', K_DONE]].forEach(([from, to]) => {
    const v = localStorage.getItem(from); if(v != null && localStorage.getItem(to) == null) localStorage.setItem(to, v);
  });
  localStorage.setItem(P + 'imported', String(Date.now()));
}catch(e){} })();

// appearance: the colour of the light, and the background
const K_THEME = P + 'theme';
const LIGHTS = [['White', '255,255,255'], ['Ice', '165,212,255'], ['Mint', '150,250,210'], ['Amber', '255,198,120'], ['Violet', '196,168,255'], ['Rose', '255,165,190']];
const BGS = [['Black', '#000000'], ['Graphite', '#0b0c10'], ['Midnight', '#03060f']];
function applyTheme(){
  const th = store.get(K_THEME, {});
  const lc = (LIGHTS.find(x => x[0] === th.light) || LIGHTS[0])[1], bg = (BGS.find(x => x[0] === th.bg) || BGS[0])[1];
  document.documentElement.style.setProperty('--lc', lc);
  document.documentElement.style.setProperty('--bgc', bg);
  const m = document.querySelector('meta[name=theme-color]'); if(m) m.content = bg;
}
applyTheme();
let toastT;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2600); }
const clock = s => { s = Math.max(0, Math.floor(s)); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60; return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(x).padStart(2, '0'); };
const left = p => { const m = Math.round((p.d - p.t) / 60); return m >= 60 ? Math.floor(m / 60) + 'h ' + (m % 60) + 'm left' : m + 'm left'; };
const fmtSize = x => x ? (x >= 1e9 ? (x / 1e9).toFixed(1) + ' GB' : Math.round(x / 1e6) + ' MB') : '';
const ago = t => { const s = (Date.now() - t) / 1000; return s < 90 ? 'just now' : s < 3600 ? Math.round(s / 60) + ' min ago' : s < 86400 ? Math.round(s / 3600) + ' h ago' : Math.round(s / 86400) + ' d ago'; };
const PLAY = '<svg viewBox="0 0 24 24"><path d="M7 4.5v15l12.5-7.5z"/></svg>';
const CHEV = '<svg class="ico chev" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>';
const CHECK = '<svg class="ico ck" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="m8.3 12.3 2.5 2.5 5-5.2"/></svg>';
const poster = (p, w = 'w342') => p ? IMG + w + p : '';

/* ================= Android app ================= */
// Inside the Lumen Android app: Real-Debrid is called directly and Play opens the native player.
const NATIVE = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
function callNative(plugin, method, opts){
  const C = window.Capacitor || {};
  if(C.Plugins && C.Plugins[plugin] && typeof C.Plugins[plugin][method] === 'function') return C.Plugins[plugin][method](opts);
  if(typeof C.registerPlugin === 'function') return C.registerPlugin(plugin)[method](opts);
  return Promise.reject(new Error('not available'));
}
const K_PL_AUTO = P + 'pl.autoplay', K_PL_SKIP = P + 'pl.autoskip', K_PL_MID = P + 'pl.midnight', K_PL_AUD = P + 'pl.audio', K_PL_TXT = P + 'pl.text', K_PL_SIZE = P + 'pl.subsize', K_PL_STYLE = P + 'pl.substyle';
const playerPrefs = () => ({ autoSkip:!!store.get(K_PL_SKIP, false), midnightDefault:!!store.get(K_PL_MID, false), audioLang:store.get(K_PL_AUD, ''),
  textLang:store.get(K_PL_TXT, ''), subSize:store.get(K_PL_SIZE, 'm'), subStyle:store.get(K_PL_STYLE, 'shadow') });
const APP_BUILD = parseInt('__BUILDNUM__', 10) || 0;
const REL = 'https://github.com/JWillHub/Claude-/releases/download/lumen-latest/';
let latestBuild = 0;
async function checkForUpdate(){
  if(!NATIVE || !APP_BUILD) return;
  try{ const r = await fetch(REL + 'version.json?t=' + Date.now()); latestBuild = +JSON.parse(await r.text()).build || 0; }catch(e){ return; }
  const d = $('.dk[data-sheet=set]'); if(d) d.classList.toggle('upd', latestBuild > APP_BUILD);
  if($('#set').classList.contains('open') && $('#appver')) fillVersion();
}
if(NATIVE){
  document.documentElement.classList.add('native');
  window.rcBack = () => false;   // nothing left to close: Android's back leaves the app
  setTimeout(() => callNative('RCUpdate', 'setBars', { light:false }).catch(() => {}), 300);
  setTimeout(checkForUpdate, 2500);
  document.addEventListener('visibilitychange', () => { if(!document.hidden) checkForUpdate(); });
}

/* ================= TMDB ================= */
let inF = 0; const waitQ = [];
const slot = () => inF < 6 ? (inF++, Promise.resolve()) : new Promise(r => waitQ.push(r));
const release = () => { const n = waitQ.shift(); if(n) n(); else inF--; };
async function tmdb(path, params = {}){
  const key = store.get(K_TM, ''); if(!key) throw new Error('nokey');
  const url = new URL('https://api.themoviedb.org/3' + path);
  Object.entries(params).forEach(([k, v]) => url.searchParams.set(k, v));
  const opts = {};
  if(key.length > 40) opts.headers = { Authorization:'Bearer ' + key, accept:'application/json' }; else url.searchParams.set('api_key', key);
  for(let i = 0; ; i++){
    await slot(); let r;
    try{ r = await fetch(url, opts); }catch(e){ release(); throw new Error('blocked'); }
    release();
    if(r.status === 401) throw new Error('badkey');
    if((r.status === 429 || r.status >= 500) && i < 3){ await new Promise(res => setTimeout(res, 700 * (i + 1))); continue; }
    if(!r.ok) throw new Error('http ' + r.status);
    return r.json();
  }
}
// small details for a title page, kept for a week
// Genres and cast for every title, so search can find "Ryan Gosling" or "sci-fi". Kept until the title leaves the library.
const K_IDX = P + 'idx';
let idx = store.get(K_IDX, {}), idxT = null;
const saveIdx = () => { clearTimeout(idxT); idxT = setTimeout(() => store.set(K_IDX, idx), 800); };
let indexing = null;
function indexAll(){
  if(indexing || !store.get(K_TM, '')) return indexing;
  const need = titles().filter(t => !t.raw && !idx[t.id]);
  if(!need.length) return null;
  indexing = Promise.all(need.map(t => details(t).catch(() => {}))).finally(() => { indexing = null; busy(); store.set(K_IDX, idx); if(qi.value) drawResults(); });
  busy(); return indexing;
}
function busy(){ $('.sw').classList.toggle('busy', !!(syncing || indexing)); }
async function details(m){
  const k = P + 'd.' + m.id, c = store.get(k, null);
  if(c && c.v === 2 && Date.now() - c.at < 7 * 864e5) return c;

async function play(o, fresh){

    if(!link){ const fs = await files(o.f.tid); const f = fs.find(x => x.path === o.f.path); if(!f) throw new Error('This file is no longer in your Real-Debrid account.'); link = f.link; }
    s = await stream(link, fresh);

  if(pl !== me) return;

}
async function nextSrc(why){
  const me = pl; if(!me || me.busy) return; me.busy = true;
  if(!me.srcs.length && me.s && !me.s.tc){ const tc = await transcode(me.s); [v.canPlayType('application/vnd.apple.mpegurl') ? tc.hls : null, tc.mp4].filter(x => x && !me.tried.has(x)).forEach(x => me.srcs.push(x)); }
  if(pl !== me) return;
  const src = me.srcs.shift();
  if(!src){
    me.busy = false;
    if(!me.retried && Date.now() - me.s.at > 10000){ me.retried = true; delete linkMem[me.link]; return play(me, true); }   // link may have expired
    $('#pmsg').style.display = ''; $('#pmsg').innerHTML = esc(why || "This file can't play here.") + '<br><br>Tap VLC at the top to open it there.';
    if(IS_ANDROID || IS_IOS){ saveNow(); location.href = vlcLink(me.s.url, me.full, v.currentTime || me.start); }
    return;
  }
  me.tried.add(src);
  const at = v.currentTime > 1 ? v.currentTime : me.start;
  v.src = src;
  v.addEventListener('loadedmetadata', () => { if(at) try{ v.currentTime = at; }catch(e){} }, { once:true });

/* ================= native player (Android app) ================= */
const K_INPL = P + 'inplayer';
let launching = 0;
async function nativePlay(o, retry = false){
  if(!retry && Date.now() - launching < 4000) return;   // ignore a double tap
  launching = Date.now();
  const key = o.f.tid + '|' + o.f.path, full = o.title + (o.label ? ' · ' + o.label : '');
  if(!retry) toast('Opening the player…');
  try{
    let link = o.f.link;
    if(!link){ const f = (await files(o.f.tid)).find(x => x.path === o.f.path); if(!f) throw new Error('This file is no longer in your Real-Debrid account.'); link = f.link; }
    const s = await stream(link, retry);
    const remembered = !retry && Date.now() - s.at > 10000;
    const startT = !o.fromStart && prog[key] && prog[key].t > 20 ? prog[key].t : 0;
    const queue = (o.queue || []).map(x => { const k = x.tid + '|' + x.path;
      return { link:x.link, key:k, tid:x.tid, s:x.ep.s, e:x.ep.e, label:`S${x.ep.s} E${x.ep.e}`, url:'', startMs:prog[k] && prog[k].t > 20 ? Math.floor(prog[k].t * 1000) : 0 }; });
    const opts = { ...playerPrefs(), url:s.url, title:full, startMs:Math.floor(startT * 1000), key };
    if(o.tv) Object.assign(opts, { show:o.title, tmdbId:o.tmdbId || 0, season:o.ep ? o.ep.s : 0, episode:o.ep ? o.ep.e : 0,
      queue:JSON.stringify(queue), rdToken:store.get(K_RD, ''), autoplay:store.get(K_PL_AUTO, true) });
    const ctx = { key, tid:o.f.tid, link, o:{ id:o.id, title:o.title, label:o.label || '', poster:o.poster || null }, queue, at:Date.now() };
    store.set(K_INPL, ctx);
    let r;
    try{ r = await callNative('RCPlayer', 'play', opts); }
    catch(e){ store.set(K_INPL, null); toast('Could not open the player'); return; }
    if(r.error && remembered && (!r.lastKey || r.lastKey === key)){ delete linkMem[link]; launching = 0; return nativePlay({ ...o, f:{ ...o.f, link } }, true); }
    if(r.error) toast(r.error === 'NEXT_EPISODE_UNAVAILABLE' ? "Couldn't load the next episode" : "The player couldn't play this file");
    applyResult(r, ctx);
  }catch(e){ toast(e.message && e.message.startsWith('This file') ? e.message : errMsg(e)); }
  finally{ launching = 0; }
}
// what the player reports when it closes: episodes it finished on its own, and where you stopped
function applyResult(r, ctx){
  const byKey = {}; (ctx.queue || []).forEach(q => byKey[q.key] = q);
  let played = r.played; if(typeof played === 'string'){ try{ played = JSON.parse(played); }catch(e){ played = []; } }
  (Array.isArray(played) ? played : []).forEach(x => { if(x && x.key && x.finished){ done[x.key] = Date.now(); delete prog[x.key]; } });
  let key = ctx.key, tid = ctx.tid, link = ctx.link, label = ctx.o.label;
  if(r.lastKey && r.lastKey !== key && byKey[r.lastKey]){ const q = byKey[r.lastKey]; key = q.key; tid = q.tid; link = q.link; label = q.label; }
  const t = (r.positionMs || 0) / 1000, d = (r.durationMs || 0) / 1000;
  if(d > 0){
    if(r.finished || r.ended || t / d >= 0.92){ done[key] = Date.now(); delete prog[key]; }
    else if(t > 5) prog[key] = { t, d, at:Date.now(), tid, id:ctx.o.id, title:ctx.o.title, name:ctx.o.title, label, link, poster:ctx.o.poster };
  }
  saveProg(); store.set(K_INPL, null); callNative('RCPlayer', 'clearSaved', {}).catch(() => {});
  refresh();
}
// the player wrote its spot down but the app was closed before it could report back
async function recoverSpot(){
  if(!NATIVE || launching) return;
  const ctx = store.get(K_INPL, null); if(!ctx || !ctx.key) return;
  if(Date.now() - (ctx.at || 0) > 14 * 864e5){ store.set(K_INPL, null); return; }
  let r; try{ r = await callNative('RCPlayer', 'saved', {}); }catch(e){ return; }
  if(launching) return;
  if(!r || !r.lastKey || !r.durationMs){ store.set(K_INPL, null); return; }
  if(r.at && r.at < ctx.at - 60000) return;
  applyResult(r, ctx);
}
if(NATIVE){ setTimeout(recoverSpot, 1500); document.addEventListener('visibilitychange', () => { if(!document.hidden) setTimeout(recoverSpot, 1500); }); }

  btn.onclick = async () => {
    const url = REL + 'lumen.apk?v=' + latestBuild;
    btn.disabled = true; btn.classList.add('busy'); btn.textContent = 'Downloading…'; updating = true;
    const C = window.Capacitor || {}, Pl = (C.Plugins && C.Plugins.RCUpdate) || (C.registerPlugin && C.registerPlugin('RCUpdate'));
    let h = null;
    try{ if(Pl && Pl.addListener) h = await Pl.addListener('progress', e => { btn.textContent = e.pct >= 0 ? `Downloading… ${e.pct}%` : `Downloading… ${e.mb} MB`; }); }catch(e){}
    try{
      const r = await callNative('RCUpdate', 'install', { url });
      if(r && r.needsPermission){ toast('Turn on "Allow from this source", come back, then tap Update again'); btn.textContent = 'Update to ' + latestBuild; btn.disabled = false; }
      else btn.textContent = 'Installing…';
    }catch(e){ btn.textContent = 'Download in browser'; btn.disabled = false; btn.onclick = () => callNative('RCUpdate', 'openInBrowser', { url }).catch(() => { location.href = url; }); }
    finally{ updating = false; btn.classList.remove('busy'); h && h.remove && h.remove(); }
  };
}

/* ================= settings ================= */
const LANGS = [['en', 'English'], ['es', 'Spanish'], ['fr', 'French'], ['de', 'German'], ['it', 'Italian'], ['pt', 'Portuguese'], ['ja', 'Japanese'], ['ko', 'Korean'], ['zh', 'Chinese'], ['hi', 'Hindi'], ['ru', 'Russian']];
const tgl = (id, label, sub, on) => `<button class="tg ${on ? 'on' : ''}" id="${id}"><span>${label}<small>${sub}</small></span><i class="sw2"></i></button>`;
const sel = (id, label, v, opts) => `<label class="selr"><span>${label}</span><select id="${id}">${opts.map(([k, l]) => `<option value="${k}" ${k === v ? 'selected' : ''}>${l}</option>`).join('')}</select></label>`;
function drawSettings(){
  const b = $('#setbody'), rk = store.get(K_RD, ''), tk = store.get(K_TM, ''), n = titles().length;
  const mobile = IS_ANDROID || IS_IOS;
  b.innerHTML = `
  <div class="card glass"><h3>Real-Debrid</h3><p>Your API token from <a href="https://real-debrid.com/apitoken" target="_blank" rel="noopener">real-debrid.com/apitoken</a>. It stays on this device.</p>
    <div class="fld"><input id="rdk" type="password" placeholder="Paste token" value="${esc(rk)}" autocomplete="off"><button id="rdshow">Show</button><button class="sv" id="rdsave">Save</button></div>
    <div class="stat" id="rdstat">${rk ? (n ? n + ' titles · ' : '') + (lib.synced ? 'synced ' + ago(lib.synced) : 'not synced yet') : 'Not connected'}</div></div>
  <div class="card glass"><h3>TMDB</h3><p>Used for posters, names and episode titles. Your free key or read token from themoviedb.org.</p>
    <div class="fld"><input id="tmk" type="password" placeholder="Paste key" value="${esc(tk)}" autocomplete="off"><button id="tmshow">Show</button><button class="sv" id="tmsave">Save</button></div></div>
  <div class="card glass"><h3>Appearance</h3>
    <div class="sub">Light</div><div class="sws" id="swl">${LIGHTS.map(([n, c]) => `<button class="swc ${(store.get(K_THEME, {}).light || 'White') === n ? 'on' : ''}" data-n="${n}" style="--c:${c}"><i></i>${n}</button>`).join('')}</div>
    <div class="sub">Background</div><div class="seg glass" id="swb">${BGS.map(([n]) => `<button data-n="${n}" class="${(store.get(K_THEME, {}).bg || 'Black') === n ? 'on' : ''}">${n}</button>`).join('')}</div></div>
  ${NATIVE ? `<div class="card glass"><h3>Player</h3>
    <div class="sub">Episodes</div>
    ${tgl('pauto', 'Play next episode', 'A countdown when the credits start', store.get(K_PL_AUTO, true))}
    ${tgl('pskip', 'Skip intros', 'Jumps past intros and recaps, with a tap to undo', store.get(K_PL_SKIP, false))}
    <div class="sub">Sound</div>
    ${tgl('pmid', 'Midnight mode', 'Evens out loud peaks from the start', store.get(K_PL_MID, false))}
    ${sel('pal', 'Audio language', store.get(K_PL_AUD, ''), [['', 'Last used'], ...LANGS])}
    <div class="sub">Subtitles</div>
    ${sel('ptl', 'Language', store.get(K_PL_TXT, ''), [['', 'Last used'], ['off', 'Off'], ...LANGS])}
    ${sel('pts', 'Size', store.get(K_PL_SIZE, 'm'), [['s', 'Small'], ['m', 'Medium'], ['l', 'Large'], ['xl', 'Extra large']])}
    ${sel('pst', 'Style', store.get(K_PL_STYLE, 'shadow'), [['shadow', 'Shadow'], ['outline', 'Outline'], ['box', 'Dark box'], ['yellow', 'Yellow']])}
    <button class="tg" id="tclear" style="margin-top:16px"><span>Clear watch progress<small>Resume points and watched marks</small></span></button></div>`
  : `<div class="card glass"><h3>Playback</h3><p>Videos play here when the format allows. 4K and HEVC files open in VLC automatically on phones.</p>
    ${mobile ? `<button class="tg ${store.get(K_VLC, false) ? 'on' : ''}" id="tvlc"><span>Always open in VLC<small>Skip the built-in player</small></span><i class="sw2"></i></button>` : ''}
    <button class="tg" id="tclear" style="margin-top:${mobile ? 12 : 0}px"><span>Clear watch progress<small>Resume points and watched marks</small></span></button></div>`}
  <div class="card glass"><h3>Library</h3><p>Lumen reads what is already in your Real-Debrid account. New downloads show up after a sync.</p>
    <button class="wide glass press" id="ssync">Sync now</button>
    <button class="wide glass press" id="rematch" style="margin-top:10px">Re-match all titles</button></div>
  ${NATIVE ? '<div class="card glass"><h3>App</h3><div id="appver"></div></div>' : ''}
  <div class="ver">LUMEN${APP_BUILD ? ' · BUILD ' + APP_BUILD : ''}</div>`;
  if(NATIVE){
    fillVersion();
    [['pauto', K_PL_AUTO, true], ['pskip', K_PL_SKIP, false], ['pmid', K_PL_MID, false]].forEach(([id, k, d]) => $('#' + id).onclick = e => { const on = !store.get(k, d); store.set(k, on); e.currentTarget.classList.toggle('on', on); });
    [['pal', K_PL_AUD], ['ptl', K_PL_TXT], ['pts', K_PL_SIZE], ['pst', K_PL_STYLE]].forEach(([id, k]) => $('#' + id).onchange = e => store.set(k, e.target.value));
  }
  $$('#swl .swc').forEach(x => x.onclick = () => { store.set(K_THEME, { ...store.get(K_THEME, {}), light:x.dataset.n }); applyTheme(); $$('#swl .swc').forEach(y => y.classList.toggle('on', y === x)); });
  $$('#swb button').forEach(x => x.onclick = () => { store.set(K_THEME, { ...store.get(K_THEME, {}), bg:x.dataset.n }); applyTheme(); $$('#swb button').forEach(y => y.classList.toggle('on', y === x)); });
  const show = (i, btn) => { const x = $(i); x.type = x.type === 'password' ? 'text' : 'password'; $(btn).textContent = x.type === 'password' ? 'Show' : 'Hide'; };
  $('#rdshow').onclick = () => show('#rdk', '#rdshow'); $('#tmshow').onclick = () => show('#tmk', '#tmshow');
  $('#rdsave').onclick = () => {
    const k = $('#rdk').value.trim(); store.set(K_RD, k); if(!k){ drawSettings(); return; }
    $('#rdstat').textContent = 'Checking…';
    sync().then(() => { toast('Real-Debrid connected'); if($('#set').classList.contains('open')) drawSettings(); }).catch(e => { $('#rdstat').textContent = errMsg(e); });
  };
  $('#tmsave').onclick = () => {
    const k = $('#tmk').value.trim(); store.set(K_TM, k);
    tmdb('/configuration').then(() => { toast('TMDB key saved'); if(store.get(K_RD, '')) sync().catch(() => {}); }).catch(e => toast(errMsg(e)));
  };
  if($('#tvlc')) $('#tvlc').onclick = e => { const on = !store.get(K_VLC, false); store.set(K_VLC, on); e.currentTarget.classList.toggle('on', on); };
  $('#tclear').onclick = () => { if(!confirmTap('#tclear')) return; prog = {}; done = {}; saveProg(); refresh(); toast('Watch progress cleared'); };
  $('#ssync').onclick = () => sync().then(() => { toast('Library up to date'); drawSettings(); }).catch(e => toast(errMsg(e)));
  $('#rematch').onclick = () => { Object.values(lib.items).forEach(it => delete it.m); saveLib(); sync().then(() => { toast('Titles re-matched'); drawSettings(); }).catch(e => toast(errMsg(e))); };
}
// a second tap confirms (no pop-up dialogs)
function confirmTap(sel){ const el = $(sel); if(el.dataset.arm){ delete el.dataset.arm; return true; } el.dataset.arm = 1; const s = $('span', el).firstChild; const old = s.textContent; s.textContent = 'Tap again to confirm'; setTimeout(() => { delete el.dataset.arm; if(s.isConnected) s.textContent = old; }, 2600); return false; }

/* ================= start ================= */
function refresh(){
  drawHome(); if(qi.value) drawResults();
  if($('#lib').classList.contains('open')) drawLib();
  if($('#watch').classList.contains('open')) drawWatch();
  if(cur && $('#title').classList.contains('open') && cur.files){ const eps = cur.files.filter(f => epOf(f.path)); if(cur.t.tv || eps.length > 1) drawShow(eps.length ? eps : cur.files); else drawMovie(cur.files); }
}
drawHome(); indexAll();
if(store.get(K_RD, '') && Date.now() - lib.synced > 10 * 60e3) sync().catch(e => { if(!titles().length) $('#hint').textContent = errMsg(e); });
document.addEventListener('visibilitychange', () => { if(!document.hidden && !pl && store.get(K_RD, '') && Date.now() - lib.synced > 30 * 60e3) sync().catch(() => {}); });
if(!NATIVE && 'serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
