<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Lumen</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@200;300;400;500;600&family=Orbitron:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --bg:#000;--text:#f2f2f2;--muted:rgba(255,255,255,.52);--faint:rgba(255,255,255,.28);
  --font:'Sora',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);
  --ease:cubic-bezier(.22,.9,.24,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:15px/1.45 var(--font);overflow:hidden;overscroll-behavior:none}
button,input{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
svg{display:block}
img{display:block}
.ico{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

/* ---------- background: soft drifting light so the glass has something to bend ---------- */
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.orb{position:absolute;border-radius:50%;filter:blur(70px);opacity:.55}
.orb.a{width:70vmax;height:70vmax;left:-25vmax;top:-30vmax;background:radial-gradient(circle,rgba(255,255,255,.16),transparent 62%);animation:drift1 26s ease-in-out infinite alternate}
.orb.b{width:60vmax;height:60vmax;right:-28vmax;bottom:-22vmax;background:radial-gradient(circle,rgba(200,200,210,.13),transparent 62%);animation:drift2 32s ease-in-out infinite alternate}
@keyframes drift1{to{transform:translate(18vmax,14vmax) scale(1.1)}}
@keyframes drift2{to{transform:translate(-16vmax,-12vmax) scale(1.15)}}

/* ---------- liquid glass ---------- */
.glass{position:relative;isolation:isolate;
  background:linear-gradient(150deg,rgba(255,255,255,.13),rgba(255,255,255,.035) 42%,rgba(255,255,255,.07));
  -webkit-backdrop-filter:blur(24px) saturate(170%) brightness(1.08);backdrop-filter:blur(24px) saturate(170%) brightness(1.08);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.32),inset 0 -1px 0 rgba(255,255,255,.05),inset 0 0 24px rgba(255,255,255,.035),0 14px 40px rgba(0,0,0,.55)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;z-index:-1;
  background:linear-gradient(135deg,rgba(255,255,255,.62),rgba(255,255,255,.08) 30%,rgba(255,255,255,0) 55%,rgba(255,255,255,.22) 85%,rgba(255,255,255,.45));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
.glass::after{content:"";position:absolute;left:12%;right:12%;top:1px;height:min(42%,22px);border-radius:0 0 999px 999px;pointer-events:none;z-index:-1;
  background:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,0));filter:blur(1px)}
.press{transition:transform .25s var(--ease),background .25s}
.press:active{transform:scale(.96)}

/* ---------- home ---------- */
#home{position:fixed;inset:0;z-index:1}
.stage{position:absolute;left:0;right:0;top:44%;transform:translateY(-50%);display:flex;flex-direction:column;align-items:center;padding:0 22px;
  transition:top .55s var(--ease),transform .55s var(--ease)}
body.q .stage{top:calc(var(--st) + 18px);transform:none}
.mark{font-family:'Orbitron','Sora',sans-serif;font-weight:500;font-size:38px;line-height:1;letter-spacing:.3em;text-indent:.3em;color:#fff;margin:0 0 40px;text-transform:uppercase;
  text-shadow:0 0 18px rgba(255,255,255,.35),0 0 42px rgba(255,255,255,.12);transition:opacity .35s,margin .55s var(--ease),height .55s var(--ease);height:36px}
body.q .mark{opacity:0;margin:0;height:0}
.sw{position:relative;width:min(560px,100%)}
.halo{position:absolute;inset:0;border-radius:999px;pointer-events:none;
  box-shadow:0 0 14px rgba(255,255,255,.28),0 0 38px rgba(255,255,255,.12),inset 0 0 12px rgba(255,255,255,.08);
  animation:breathe 5s ease-in-out infinite;transition:opacity .4s}
/* the search bar: clear glass with a thin lit outline */
.sbar.glass{background:rgba(255,255,255,.015);-webkit-backdrop-filter:none;backdrop-filter:none;box-shadow:none}
.sbar.glass::after{display:none}
.sbar.glass::before{padding:1.2px;background:linear-gradient(100deg,rgba(255,255,255,.95),rgba(255,255,255,.35) 25%,rgba(255,255,255,.18) 50%,rgba(255,255,255,.35) 75%,rgba(255,255,255,.95))}
.sw:focus-within .halo{box-shadow:0 0 18px rgba(255,255,255,.4),0 0 52px rgba(255,255,255,.16),inset 0 0 14px rgba(255,255,255,.1)}
.sw:focus-within .halo{animation-duration:3s}
body.q .halo{opacity:.45}
@keyframes breathe{0%,100%{opacity:.45}50%{opacity:1}}
.sbar{height:60px;border-radius:999px;display:flex;align-items:center;gap:12px;padding:0 10px 0 22px}
.sbar .ico{width:21px;height:21px;color:rgba(255,255,255,.7);flex:none}
.sbar input{flex:1;min-width:0;height:100%;background:none;border:0;outline:none;font-size:16.5px;font-weight:300;letter-spacing:.01em}
.sbar input::placeholder{color:rgba(255,255,255,.42)}
.sbar input::-webkit-search-cancel-button{display:none}
.clr{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:rgba(255,255,255,.65);opacity:0;pointer-events:none;transition:opacity .2s}
body.typed .clr{opacity:1;pointer-events:auto}
.clr .ico{width:16px;height:16px}
.hint{margin-top:22px;font-size:12px;font-weight:300;color:rgba(255,255,255,.4);letter-spacing:.06em;text-align:center;transition:opacity .3s;min-height:18px}
body.q .hint{opacity:0}

/* results */
.res{position:absolute;left:0;right:0;top:calc(var(--st) + 92px);bottom:0;overflow-y:auto;padding:4px 22px calc(120px + var(--sb));
  opacity:0;pointer-events:none;transition:opacity .35s .1s;overscroll-behavior:contain;scrollbar-width:none}
.res::-webkit-scrollbar{display:none}
body.q .res{opacity:1;pointer-events:auto}
.res .in{width:min(560px,100%);margin:0 auto;display:flex;flex-direction:column;gap:10px}
.ri{display:flex;align-items:center;gap:14px;border-radius:20px;padding:9px 16px 9px 9px;text-align:left;width:100%;animation:rise .35s var(--ease) both}
.ri img,.ri .np{width:46px;height:69px;border-radius:11px;object-fit:cover;flex:none;background:rgba(255,255,255,.06)}
.ri .t{flex:1;min-width:0}
.ri .t b{display:block;font-weight:400;font-size:15px;line-height:1.25}
.ri .t span{display:block;font-size:12px;color:var(--muted);font-weight:300;margin-top:3px}
.ri .chev{width:18px;height:18px;color:var(--faint)}
.empty{text-align:center;color:var(--muted);font-weight:300;font-size:13.5px;padding:40px 10px;line-height:1.6}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}

/* ---------- dock ---------- */
.dock{position:fixed;left:50%;bottom:calc(var(--sb) + 18px);transform:translateX(-50%);z-index:30;display:flex;gap:6px;padding:7px;border-radius:20px;width:min(560px,calc(100% - 44px));
  transition:transform .45s var(--ease),opacity .3s}
body.playing .dock,body.kb .dock,body.tp .dock{transform:translate(-50%,140%);opacity:0;pointer-events:none}
.dk{flex:1;display:flex;align-items:center;justify-content:center;gap:9px;height:50px;padding:0 20px;border-radius:14px;color:rgba(255,255,255,.72);font-size:13px;font-weight:400;letter-spacing:.04em;transition:background .3s,color .3s}
.dk .ico{width:20px;height:20px}
.dk.on{background:rgba(255,255,255,.16);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 0 18px rgba(255,255,255,.08)}

/* ---------- sheets ---------- */
.sheet{position:fixed;inset:0;z-index:10;background:rgba(0,0,0,.62);-webkit-backdrop-filter:blur(34px) saturate(140%);backdrop-filter:blur(34px) saturate(140%);
  transform:translateY(102%);transition:transform .5s var(--ease);display:flex;flex-direction:column}
.sheet.open{transform:none}
.sheet.z2{z-index:20;background:#000}
#tbody{padding-top:0}
.shead{flex:none;display:flex;align-items:center;gap:12px;padding:calc(var(--st) + 16px) 20px 12px}
.shead h2{margin:0;font-weight:300;font-size:26px;letter-spacing:.02em;flex:1}
.shead small{font-size:12px;color:var(--muted);font-weight:300;letter-spacing:.04em}
.ibtn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;flex:none;color:#fff}
.ibtn .ico{width:19px;height:19px}
.ibtn.spin .ico{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.sbody{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:4px 20px calc(120px + var(--sb));scrollbar-width:none}
.sbody::-webkit-scrollbar{display:none}

/* segmented control */
.ctrls{display:flex;gap:10px;align-items:center;margin:4px 0 18px}
.seg{display:flex;padding:4px;border-radius:999px;flex:1}
.seg button{flex:1;height:34px;border-radius:999px;font-size:12.5px;color:rgba(255,255,255,.6);letter-spacing:.03em;transition:background .3s,color .3s}
.seg button.on{background:rgba(255,255,255,.17);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.22)}
.sortb{height:42px;padding:0 16px;border-radius:999px;font-size:12.5px;color:rgba(255,255,255,.8);display:flex;align-items:center;gap:7px;flex:none}
.sortb .ico{width:15px;height:15px}

/* poster grid */
.pg{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 12px}
@media(min-width:640px){.pg{grid-template-columns:repeat(5,1fr)}}
.pt{text-align:left;animation:rise .4s var(--ease) both}
.pt .pf{position:relative;aspect-ratio:2/3;border-radius:14px;overflow:hidden;background:rgba(255,255,255,.05);
  box-shadow:0 0 0 1px rgba(255,255,255,.09) inset,0 10px 24px rgba(0,0,0,.5)}
.pt .pf img{width:100%;height:100%;object-fit:cover;filter:grayscale(.15)}
.pt .pf::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(160deg,rgba(255,255,255,.16),transparent 35%);pointer-events:none}
.pt .np{position:absolute;inset:0;display:grid;place-items:center;padding:10px;text-align:center;font-size:12px;font-weight:300;color:var(--muted)}
.pt .pb{position:absolute;left:8px;right:8px;bottom:8px;height:2px;border-radius:2px;background:rgba(255,255,255,.2);overflow:hidden}
.pt .pb i{display:block;height:100%;background:#fff}
.pt .cap{margin-top:7px;font-size:11.5px;font-weight:300;color:rgba(255,255,255,.75);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- title page ---------- */
.hero{position:relative;height:min(52vh,460px);margin:0 -20px;background:#000 center/cover no-repeat}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.35),rgba(0,0,0,0) 30%,rgba(0,0,0,.6) 70%,#000)}
.hero .bk{position:absolute;left:16px;top:calc(var(--st) + 14px);z-index:2}
.tbody{position:relative;margin-top:-90px;z-index:1}
.ttl{margin:0;font-weight:300;font-size:30px;line-height:1.12;letter-spacing:.005em}
.meta{margin-top:8px;font-size:12.5px;color:var(--muted);font-weight:300;letter-spacing:.04em}
.ov{margin:16px 0 0;font-size:14px;font-weight:300;line-height:1.65;color:rgba(255,255,255,.78);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.ov.full{-webkit-line-clamp:unset}
.play{margin-top:22px;width:100%;height:58px;border-radius:999px;display:flex;align-items:center;justify-content:center;gap:12px;font-size:15px;font-weight:400;letter-spacing:.06em;
  color:#000;background:linear-gradient(180deg,#fff,#d9d9d9);box-shadow:0 0 0 1px rgba(255,255,255,.6) inset,0 0 34px rgba(255,255,255,.22),0 12px 30px rgba(0,0,0,.6)}
.play svg{width:16px;height:16px;fill:#000}
.play[disabled]{opacity:.5}
.psub{text-align:center;margin-top:10px;font-size:11.5px;color:var(--muted);font-weight:300;letter-spacing:.04em;min-height:16px}
.row2{display:flex;gap:10px;margin-top:12px}
.row2 button{flex:1;height:44px;border-radius:999px;font-size:12.5px;letter-spacing:.04em;color:rgba(255,255,255,.85)}
.lbl{margin:28px 0 12px;font-size:11px;font-weight:400;letter-spacing:.32em;text-transform:uppercase;color:var(--faint)}
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -20px;padding:2px 20px 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:38px;padding:0 16px;border-radius:999px;font-size:12.5px;color:rgba(255,255,255,.7);letter-spacing:.03em}
.chip.on{color:#000;background:#fff;box-shadow:0 0 18px rgba(255,255,255,.25)}
.chip.on::before,.chip.on::after{display:none}
.eps{display:flex;flex-direction:column;gap:10px}
.ep{display:flex;align-items:center;gap:14px;border-radius:18px;padding:10px 14px 10px 10px;text-align:left;width:100%}
.ep .th{position:relative;width:112px;aspect-ratio:16/9;border-radius:11px;overflow:hidden;flex:none;background:rgba(255,255,255,.06)}
.ep .th img{width:100%;height:100%;object-fit:cover;filter:grayscale(.2)}
.ep .th .pb{position:absolute;left:0;right:0;bottom:0;height:2px;background:rgba(255,255,255,.2)}
.ep .th .pb i{display:block;height:100%;background:#fff}
.ep .et{flex:1;min-width:0}
.ep .et b{display:block;font-weight:400;font-size:13.5px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ep .et span{display:block;font-size:11.5px;color:var(--muted);font-weight:300;margin-top:3px}
.ep .ck{width:20px;height:20px;color:rgba(255,255,255,.85);flex:none}

/* ---------- settings ---------- */
.card{border-radius:24px;padding:18px;margin-bottom:14px}
.card h3{margin:0 0 4px;font-weight:400;font-size:15px}
.card p{margin:0 0 14px;font-size:12.5px;color:var(--muted);font-weight:300;line-height:1.55}
.card p a{color:#fff}
.fld{display:flex;align-items:center;gap:8px;height:50px;border-radius:16px;padding:0 6px 0 16px;background:rgba(0,0,0,.35);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.fld input{flex:1;min-width:0;background:none;border:0;outline:none;font-size:14px;font-weight:300;height:100%}
.fld button{height:38px;padding:0 14px;border-radius:12px;font-size:12.5px;color:rgba(255,255,255,.75)}
.fld button.sv{background:#fff;color:#000}
.stat{margin-top:10px;font-size:12px;color:var(--muted);font-weight:300;min-height:16px}
.tg{display:flex;align-items:center;justify-content:space-between;gap:14px;width:100%;text-align:left;padding:4px 0}
.tg + .tg{margin-top:12px}
.tg span{font-size:14px;font-weight:300}
.tg small{display:block;font-size:11.5px;color:var(--muted)}
.sw2{width:50px;height:30px;border-radius:999px;background:rgba(255,255,255,.12);position:relative;flex:none;transition:background .3s;box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}
.sw2::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#bbb;transition:transform .35s var(--ease),background .3s}
.tg.on .sw2{background:rgba(255,255,255,.85)}
.tg.on .sw2::after{transform:translateX(20px);background:#000}
.wide{width:100%;height:48px;border-radius:999px;font-size:13px;letter-spacing:.05em}
.ver{text-align:center;font-size:11px;color:var(--faint);letter-spacing:.2em;margin-top:22px}

/* ---------- player ---------- */
#player{position:fixed;inset:0;z-index:50;background:#000;display:none}
body.playing #player{display:block}
#player video{position:absolute;inset:0;width:100%;height:100%;background:#000}
.ptop{position:absolute;left:0;right:0;top:0;z-index:2;display:flex;align-items:center;gap:10px;padding:calc(var(--st) + 12px) 14px 30px;
  background:linear-gradient(180deg,rgba(0,0,0,.7),transparent);transition:opacity .4s}
.ptop.hide{opacity:0;pointer-events:none}
.ptop .pt2{flex:1;min-width:0;font-size:13.5px;font-weight:300;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ptop .pill{height:40px;padding:0 16px;border-radius:999px;font-size:12.5px;letter-spacing:.04em;flex:none}
.pmsg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:1;text-align:center;font-weight:300;font-size:14px;color:var(--muted);width:80%;line-height:1.6}
.pmsg .dots{display:inline-block;width:28px;height:28px;border-radius:50%;border:1.5px solid rgba(255,255,255,.2);border-top-color:#fff;animation:spin 1s linear infinite;margin-bottom:14px}
.pnext{position:absolute;right:16px;bottom:calc(var(--sb) + 80px);z-index:2;height:46px;padding:0 20px;border-radius:999px;font-size:13px;display:none}
.pnext.show{display:block}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(var(--sb) + 92px);transform:translate(-50%,20px);z-index:60;padding:12px 20px;border-radius:999px;font-size:13px;font-weight:300;
  opacity:0;pointer-events:none;transition:opacity .3s,transform .4s var(--ease);max-width:88vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ================= outlined light glass (applies everywhere) ================= */
@property --a{syntax:'<angle>';inherits:false;initial-value:0deg}
.glass{background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.012));-webkit-backdrop-filter:none;backdrop-filter:none;
  box-shadow:0 0 14px rgba(255,255,255,.045),inset 0 0 14px rgba(255,255,255,.025);transition:box-shadow .35s,transform .25s var(--ease),color .3s}
.glass::after{display:none}
.glass::before{background:linear-gradient(100deg,rgba(255,255,255,.6),rgba(255,255,255,.2) 22%,rgba(255,255,255,.09) 50%,rgba(255,255,255,.2) 78%,rgba(255,255,255,.6))}
.glass.on{color:#fff;box-shadow:0 0 16px rgba(255,255,255,.22),0 0 42px rgba(255,255,255,.07),inset 0 0 12px rgba(255,255,255,.09)}
.glass.on::before{display:block;background:linear-gradient(100deg,#fff,rgba(255,255,255,.6) 30%,rgba(255,255,255,.42) 50%,rgba(255,255,255,.6) 70%,#fff)}
.chip.on{background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.015));color:#fff}
.lit,.seg button.on,.dk.on{color:#fff;background:rgba(255,255,255,.045);box-shadow:inset 0 0 0 1px rgba(255,255,255,.72),0 0 14px rgba(255,255,255,.2),inset 0 0 10px rgba(255,255,255,.08)}
/* a light that travels around the outline while something loads */
.glass.busy::before,.sbar.glass.busy::before{background:conic-gradient(from var(--a),rgba(255,255,255,.16) 0deg,rgba(255,255,255,.16) 220deg,rgba(255,255,255,.7) 285deg,#fff 310deg,rgba(255,255,255,.16) 350deg);animation:orbit 1.8s linear infinite}
@keyframes orbit{to{--a:360deg}}
.sheet{background:rgba(0,0,0,.94);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
/* dock: a pill with four tabs; a little dark tint so it reads over posters */
.dock{border-radius:999px;width:min(430px,calc(100% - 36px));gap:4px;padding:6px;background:rgba(0,0,0,.55);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
.dk{flex-direction:column;gap:4px;height:54px;padding:0;border-radius:999px;font-size:10.5px;letter-spacing:.08em;color:rgba(255,255,255,.55)}
.dk .ico{width:21px;height:21px}
/* posters wait in black and white and come into color when touched */
.pt .pf{box-shadow:inset 0 0 0 1px rgba(255,255,255,.14),0 0 14px rgba(255,255,255,.04)}
.pt .pf::after{background:linear-gradient(160deg,rgba(255,255,255,.08),transparent 35%);box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}
.pt:active .pf::after{box-shadow:inset 0 0 0 1px rgba(255,255,255,.7),0 0 14px rgba(255,255,255,.2)}
.play{color:#fff;background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.015));box-shadow:0 0 18px rgba(255,255,255,.24),0 0 50px rgba(255,255,255,.08),inset 0 0 14px rgba(255,255,255,.1);animation:breathe2 5s ease-in-out infinite}
.play svg{fill:#fff}
@keyframes breathe2{0%,100%{box-shadow:0 0 12px rgba(255,255,255,.16),0 0 34px rgba(255,255,255,.05),inset 0 0 12px rgba(255,255,255,.07)}50%{box-shadow:0 0 20px rgba(255,255,255,.3),0 0 56px rgba(255,255,255,.1),inset 0 0 16px rgba(255,255,255,.12)}}
.cast{margin-top:10px;font-size:12px;color:var(--muted);font-weight:300;line-height:1.6}
.fld{background:transparent;box-shadow:inset 0 0 0 1px rgba(255,255,255,.16)}

<script>
'use strict';
/* ================= basics ================= */
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const IMG = 'https://image.tmdb.org/t/p/';
const P = 'lumen.';
const K_RD = P + 'rdkey', K_TM = P + 'tmdbkey', K_LIB = P + 'lib', K_PROG = P + 'progress', K_DONE = P + 'done', K_VLC = P + 'vlc', K_SORT = P + 'sort', K_KIND = P + 'kind';
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){
    const j = JSON.stringify(v);
    try{ localStorage.setItem(k, j); return true; }catch(e){}
    try{ Object.keys(localStorage).filter(x => x.startsWith(P + 'd.')).forEach(x => localStorage.removeItem(x)); localStorage.setItem(k, j); return true; }catch(e){ return false; }
  }
};
// First launch: copy the keys, library list and resume points from the Rolling Credits library app on this site. Its data is only read.
(function importRC(){ try{
  if(localStorage.getItem(P + 'imported')) return;
  [['rclib.rdkey', K_RD], ['rclib.tmdbkey', K_TM], ['reellog.tmdbkey', K_TM], ['rclib.rdlib', K_LIB], ['rclib.progress', K_PROG], ['rclib.done', K_DONE]].forEach(([from, to]) => {
    const v = localStorage.getItem(from); if(v != null && localStorage.getItem(to) == null) localStorage.setItem(to, v);
  });
  localStorage.setItem(P + 'imported', String(Date.now()));
}catch(e){} })();

let toastT;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2600); }
const clock = s => { s = Math.max(0, Math.floor(s)); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60; return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(x).padStart(2, '0'); };
const left = p => { const m = Math.round((p.d - p.t) / 60); return m >= 60 ? Math.floor(m / 60) + 'h ' + (m % 60) + 'm left' : m + 'm left'; };
const fmtSize = x => x ? (x >= 1e9 ? (x / 1e9).toFixed(1) + ' GB' : Math.round(x / 1e6) + ' MB') : '';
const ago = t => { const s = (Date.now() - t) / 1000; return s < 90 ? 'just now' : s < 3600 ? Math.round(s / 60) + ' min ago' : s < 86400 ? Math.round(s / 3600) + ' h ago' : Math.round(s / 86400) + ' d ago'; };
const PLAY = '<svg viewBox="0 0 24 24"><path d="M7 4.5v15l12.5-7.5z"/></svg>';
const CHEV = '<svg class="ico chev" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>';
const CHECK = '<svg class="ico ck" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="m8.3 12.3 2.5 2.5 5-5.2"/></svg>';
const poster = (p, w = 'w342') => p ? IMG + w + p : '';

/* ================= TMDB ================= */
let inF = 0; const waitQ = [];
const slot = () => inF < 6 ? (inF++, Promise.resolve()) : new Promise(r => waitQ.push(r));
const release = () => { const n = waitQ.shift(); if(n) n(); else inF--; };
async function tmdb(path, params = {}){
  const key = store.get(K_TM, ''); if(!key) throw new Error('nokey');
  const url = new URL('https://api.themoviedb.org/3' + path);
  Object.entries(params).forEach(([k, v]) => url.searchParams.set(k, v));
  const opts = {};
  if(key.length > 40) opts.headers = { Authorization:'Bearer ' + key, accept:'application/json' }; else url.searchParams.set('api_key', key);
  for(let i = 0; ; i++){
    await slot(); let r;
    try{ r = await fetch(url, opts); }catch(e){ release(); throw new Error('blocked'); }
    release();
    if(r.status === 401) throw new Error('badkey');
    if((r.status === 429 || r.status >= 500) && i < 3){ await new Promise(res => setTimeout(res, 700 * (i + 1))); continue; }
    if(!r.ok) throw new Error('http ' + r.status);
    return r.json();
  }
}
// small details for a title page, kept for a week
// Genres and cast for every title, so search can find "Ryan Gosling" or "sci-fi". Kept until the title leaves the library.
const K_IDX = P + 'idx';
let idx = store.get(K_IDX, {}), idxT = null;
const saveIdx = () => { clearTimeout(idxT); idxT = setTimeout(() => store.set(K_IDX, idx), 800); };
let indexing = null;
function indexAll(){
  if(indexing || !store.get(K_TM, '')) return indexing;
  const need = titles().filter(t => !t.raw && !idx[t.id]);
  if(!need.length) return null;
  indexing = Promise.all(need.map(t => details(t).catch(() => {}))).finally(() => { indexing = null; busy(); store.set(K_IDX, idx); if(qi.value) drawResults(); });
  busy(); return indexing;
}
function busy(){ $('.sw').classList.toggle('busy', !!(syncing || indexing)); }
async function details(m){
  const k = P + 'd.' + m.id, c = store.get(k, null);
  if(c && c.cast && Date.now() - c.at < 7 * 864e5) return c;
  if(typeof m.id !== 'number' && !m.tv) return null;
  const d = await tmdb(m.tv ? '/tv/' + m.tid : '/movie/' + m.id, { append_to_response:m.tv ? 'aggregate_credits' : 'credits' });
  const cr = (m.tv ? d.aggregate_credits : d.credits) || {};
  const out = { at:Date.now(), backdrop:d.backdrop_path, overview:d.overview || '', runtime:d.runtime || (d.episode_run_time || [])[0] || 0,
    genres:(d.genres || []).map(g => g.name), cast:(cr.cast || []).slice(0, 12).map(c => c.name), vote:d.vote_average || 0, seasons:(d.seasons || []).filter(s => s.season_number > 0).length };
  store.set(k, out);
  idx[m.id] = { g:out.genres, c:out.cast }; saveIdx();
  return out;
}
async function seasonEps(tid, n){
  const k = P + 'd.s' + tid + '.' + n, c = store.get(k, null);
  if(c && Date.now() - c.at < 3 * 864e5) return c.eps;
  const d = await tmdb(`/tv/${tid}/season/${n}`);
  const eps = {}; (d.episodes || []).forEach(e => { eps[e.episode_number] = { name:e.name, still:e.still_path, rt:e.runtime }; });
  store.set(k, { at:Date.now(), eps }); return eps;
}

/* ================= Real-Debrid ================= */
// Browsers can't call Real-Debrid directly; requests go through the rc-relay worker (allowed for jwillhub.github.io)
const RD_API = 'https://rc-relay-3cfe.jwill-personalacc.workers.dev/rd';
async function rd(path, opt = {}){
  const key = store.get(K_RD, ''); if(!key) throw new Error('rdnokey');
  const u = new URL(RD_API + path); Object.entries(opt.q || {}).forEach(([k, v]) => u.searchParams.set(k, v));
  u.searchParams.set('auth_token', key);
  const init = {};
  if(opt.form){ init.method = 'POST'; init.body = new URLSearchParams(opt.form).toString(); init.headers = { 'Content-Type':'application/x-www-form-urlencoded' }; }
  let r; try{ r = await fetch(u, init); }catch(e){ throw new Error('rdblocked'); }
  if(r.status === 401) throw new Error('rdbadkey');
  if(r.status === 403) throw new Error('rddenied');
  if(r.status === 204) return null;
  if(!r.ok){ let m = 'http ' + r.status; try{ const j = await r.json(); if(j.error) m = String(j.error).replace(/_/g, ' '); }catch(e){} throw new Error(m); }
  return r.json();
}
const errMsg = e => ({ rdnokey:'Add your Real-Debrid token in Settings.', rdbadkey:'Real-Debrid rejected the token. Check it in Settings.',
  rddenied:'Real-Debrid refused the request. Check your subscription.', rdblocked:'Could not reach Real-Debrid. Check your connection.',
  nokey:'Add your TMDB key in Settings.', badkey:'TMDB rejected the key. Check it in Settings.', blocked:'Could not reach TMDB.' })[e.message] || 'Something went wrong (' + e.message + ').';

const VIDEO = /\.(mkv|mp4|m4v|avi|mov|webm|ts|wmv)$/i;
const CUT = /\b(S\d{1,2}(E\d{1,3})?|Season\s*\d+|\d{1,2}x\d{2}|2160p|1080p|720p|480p|4k|uhd|blu ?ray|brrip|bdrip|web ?dl|webrip|web|hdtv|dvdrip|remux|x26[45]|h ?26[45]|hevc|10bit|complete|proper|repack|extended|unrated|imax|hdr|multi)\b/i;
function parseName(n){
  let t = String(n || '').replace(VIDEO, '').replace(/^\s*(\[[^\]]*\]|www\.\S+)\s*[-–]?\s*/i, '').replace(/[._]+/g, ' ').replace(/\s+/g, ' ').trim();
  const tv = /\bS\d{1,2}(E\d{1,3})?\b|\bSeason\s*\d+|\b\d{1,2}x\d{2}\b|\bComplete Series\b/i.test(t);
  const c = t.search(CUT); let head = c > 0 ? t.slice(0, c) : t, year = null, at = -1;
  for(const m of head.matchAll(/(?:^|[\s(\[])((?:19|20)\d{2})(?=[\s)\]]|$)/g)) if(m.index > 0){ year = m[1]; at = m.index; }
  if(at > 0) head = head.slice(0, at);
  return { title:head.replace(/[\[(][^\])]*[\])]/g, ' ').replace(/[\s\-–:(\[]+$/, '').replace(/\s+/g, ' ').trim() || t, year, tv };
}
const epOf = p => { const m = String(p).match(/S(\d{1,2})\s?E(\d{1,3})/i) || String(p).match(/\b(\d{1,2})x(\d{2})\b/); return m ? { s:+m[1], e:+m[2] } : null; };
const qualOf = n => { const m = String(n).match(/2160p|1080p|720p|480p|\b4k\b/i); return m ? m[0].toLowerCase().replace('4k', '2160p') : ''; };

let lib = store.get(K_LIB, null) || { synced:0, items:{} };
let prog = store.get(K_PROG, {}), done = store.get(K_DONE, {});
const saveLib = () => store.set(K_LIB, lib);
function saveProg(){ Object.keys(prog).sort((a, b) => prog[b].at - prog[a].at).slice(60).forEach(k => delete prog[k]); store.set(K_PROG, prog); store.set(K_DONE, done); }

async function matchItem(it){
  const q = parseName(it.name), path = q.tv ? '/search/tv' : '/search/movie', yk = q.tv ? 'first_air_date_year' : 'year';
  for(const params of (q.year ? [{ query:q.title, [yk]:q.year }, { query:q.title }] : [{ query:q.title }])){
    const r = ((await tmdb(path, { include_adult:'false', ...params })).results || [])[0];
    if(r) return q.tv ? { id:'tv' + r.id, tid:r.id, tv:true, title:r.name, year:(r.first_air_date || '').slice(0, 4), poster:r.poster_path }
                      : { id:r.id, title:r.title, year:(r.release_date || '').slice(0, 4), poster:r.poster_path };
  }
  return null;
}
let syncing = null;
function sync(){
  if(syncing) return syncing;
  $('#sync').classList.add('spin');
  setTimeout(busy);
  syncing = (async () => {
    const all = [];
    for(let page = 1; page <= 40; page++){ const l = await rd('/torrents', { q:{ page, limit:500 } }) || []; all.push(...l); if(l.length < 500) break; }
    const items = {};
    all.filter(t => t.status === 'downloaded').forEach(t => { const o = lib.items[t.id]; items[t.id] = o && o.name === t.filename ? o : { name:t.filename, bytes:t.bytes, added:t.added }; });
    lib.items = items;
    Object.keys(prog).forEach(k => { if(prog[k].tid && !items[prog[k].tid]) delete prog[k]; }); saveProg();
    let fatal = null;
    if(store.get(K_TM, '')) await Promise.all(Object.values(items).filter(it => it.m === undefined).map(async it => {
      if(fatal) return;
      try{ it.m = await matchItem(it); }catch(e){ if(['nokey', 'badkey', 'blocked'].includes(e.message)) fatal = e; }
    }));
    lib.synced = Date.now(); saveLib();
    if(fatal) throw fatal;
  })();
  syncing.finally(() => { syncing = null; $('#sync').classList.remove('spin'); busy(); refresh(); indexAll(); }).catch(() => {});
  return syncing;
}
// One entry per title; a film or show with several torrents (copies, seasons) shows once
function titles(){
  const at = new Map();
  Object.entries(lib.items).forEach(([tid, it]) => {
    const m = it.m || (() => { const q = parseName(it.name); return { id:'rd:' + tid, title:q.title, year:q.year || '', tv:q.tv, poster:null, raw:true }; })();
    const t = at.get(m.id) || { ...m, tors:[], added:'' };
    t.tors.push(tid); if((it.added || '') > t.added) t.added = it.added || '';
    at.set(m.id, t);
  });
  return [...at.values()];
}
const titleById = id => titles().find(t => String(t.id) === String(id));
const progOf = t => Object.values(prog).filter(p => t.tors.includes(p.tid)).sort((a, b) => b.at - a.at)[0] || null;
const lastWatched = t => Math.max(0, ...Object.values(prog).filter(p => t.tors.includes(p.tid)).map(p => p.at),
  ...Object.entries(done).filter(([k]) => t.tors.includes(k.split('|')[0])).map(([, v]) => v));

const infoMem = {};
async function files(tid){
  const c = infoMem[tid]; if(c) return c;
  const info = await rd('/torrents/info/' + encodeURIComponent(tid));
  const sel = (info.files || []).filter(f => f.selected), links = info.links || [];
  let fs = sel.length === links.length ? sel.map((f, i) => ({ path:f.path, bytes:f.bytes, link:links[i] })) : links.length === 1 ? [{ path:info.filename, bytes:info.bytes, link:links[0] }] : [];
  fs = fs.filter(f => VIDEO.test(f.path) && !/(^|[\W_])sample([\W_]|$)/i.test(f.path)).map(f => ({ ...f, tid }));
  return infoMem[tid] = fs;
}
const linkMem = {};
const pickUrl = o => !o ? null : typeof o === 'string' ? o : o.full || Object.values(o).find(x => typeof x === 'string') || null;
async function stream(link, fresh){

const layers = [];
function pushLayer(name, close){ layers.push({ name, close }); history.pushState({ l:layers.length }, ''); }
function popLayer(){ const l = layers.pop(); if(l) l.close(); }
addEventListener('popstate', e => { const n = (e.state && e.state.l) || 0; if(n >= layers.length && layers.length) popLayer(); while(layers.length > n) popLayer(); });
const back = () => { if(layers.length) history.back(); };

function openSheet(id){
  const el = $('#' + id); if(el.classList.contains('open')) return;
  // the two dock sheets replace each other
  ['lib', 'set', 'watch'].filter(x => x !== id && $('#' + x).classList.contains('open')).forEach(x => { const i = layers.findIndex(l => l.name === x); if(i >= 0){ layers.splice(i, 1); } $('#' + x).classList.remove('open'); });
  el.classList.add('open'); dockState();
  if(id === 'lib') drawLib(); if(id === 'set') drawSettings(); if(id === 'watch') drawWatch();
  pushLayer(id, () => { el.classList.remove('open'); dockState(); });
}

// posters grow and brighten toward the middle, and fade out evenly on both sides
const CAR_STEP = 100 + 26;
let carList = [], carN = 0, carLoop = false, carMid = -1, carRaf = 0, capT, carSettle;
function carPaint(){
  carRaf = 0;
  const tr = $('#ctrack'), items = tr.children; if(!items.length) return;
  const pos = tr.scrollLeft / CAR_STEP, lo = Math.max(0, Math.floor(pos) - 5), hi = Math.min(items.length - 1, Math.ceil(pos) + 5);
  for(let i = lo; i <= hi; i++){
    const d = Math.min(Math.abs(i - pos), 4);
    items[i].style.transform = `scale(${(1.28 - d * 0.2).toFixed(3)})`;
    items[i].style.opacity = (1 - d * 0.2).toFixed(3);
    items[i].style.zIndex = String(10 - Math.round(d));
  }
  const mid = Math.max(0, Math.min(items.length - 1, Math.round(pos)));
  if(mid !== carMid){
    if(items[carMid]) items[carMid].classList.remove('mid');
    items[mid].classList.add('mid'); carMid = mid;
    const t = carList[mid % carN], cap = $('#ccap');
    cap.classList.add('fade'); clearTimeout(capT);
    capT = setTimeout(() => { cap.innerHTML = t ? `<b>${esc(t.title)}</b><span>${esc([t.year, t.tv ? 'Series' : 'Film'].filter(Boolean).join(' · '))}</span>` : ''; cap.classList.remove('fade'); }, 160);
  }
}

    const tr = $('#ctrack'); if(!carLoop) return;

v.addEventListener('pause', showTop);

async function play(o, fresh){
  const key = o.f.tid + '|' + o.f.path, full = o.title + (o.label ? ' · ' + o.label : '');
  if(pl) stopPlayer(true);
  pl = { ...o, key, full, busy:false, finished:false, lastSave:0 };
  const me = pl;
  document.body.classList.add('playing');
  $('#ptitle').textContent = full; $('#pnext').classList.remove('show');
  $('#pmsg').innerHTML = '<div class="dots"></div><br>Getting the stream'; $('#pmsg').style.display = '';
  v.removeAttribute('src'); v.load();
  if(!layers.length || layers[layers.length - 1].name !== 'player') pushLayer('player', () => stopPlayer());
  showTop();
  let link = o.f.link, s;
  try{
    if(!link){ const fs = await files(o.f.tid); const f = fs.find(x => x.path === o.f.path); if(!f) throw new Error('This file is no longer in your Real-Debrid account.'); link = f.link; }
    s = await stream(link, fresh);
  }catch(e){ if(pl === me) $('#pmsg').textContent = e.message.startsWith('rd') || ['nokey', 'badkey', 'blocked'].includes(e.message) ? errMsg(e) : e.message; return; }
  if(pl !== me) return;
  me.link = link; me.s = s;
  const start = prog[key] && prog[key].t > 20 ? prog[key].t : 0;
  const vlc = vlcLink(s.url, full, start);
  $('#pvlc').href = vlc;
  $('#pvlc').onclick = () => { saveNow(); };
  if((IS_ANDROID || IS_IOS) && (store.get(K_VLC, false) || needsVLC(s.name))){
    $('#pmsg').innerHTML = `Opening in VLC${start ? ' at ' + clock(start) : ''}…<br><small style="font-size:12px">${esc(s.name || '')}</small>`;
    location.href = vlc; return;
  }
  const hlsOk = !!v.canPlayType('application/vnd.apple.mpegurl');
  me.srcs = (isDirect(s.name) || isH264(s.name)) ? [s.url] : [];
  me.tried = new Set();
  if(!me.srcs.length){ const tc = await transcode(s); if(pl !== me) return; me.srcs = [hlsOk ? tc.hls : null, tc.mp4, s.url].filter(Boolean); }
  me.start = start;
  nextSrc();
}
async function nextSrc(why){
  const me = pl; if(!me || me.busy) return; me.busy = true;
  if(!me.srcs.length && me.s && !me.s.tc){ const tc = await transcode(me.s); [v.canPlayType('application/vnd.apple.mpegurl') ? tc.hls : null, tc.mp4].filter(x => x && !me.tried.has(x)).forEach(x => me.srcs.push(x)); }
  if(pl !== me) return;
  const src = me.srcs.shift();
  if(!src){
    me.busy = false;
    if(!me.retried && Date.now() - me.s.at > 10000){ me.retried = true; delete linkMem[me.link]; return play(me, true); }   // link may have expired
    $('#pmsg').style.display = ''; $('#pmsg').innerHTML = esc(why || "This file can't play here.") + '<br><br>Tap VLC at the top to open it there.';
    if(IS_ANDROID || IS_IOS){ saveNow(); location.href = vlcLink(me.s.url, me.full, v.currentTime || me.start); }
    return;
  }
  me.tried.add(src);
  const at = v.currentTime > 1 ? v.currentTime : me.start;
  v.src = src;
  v.addEventListener('loadedmetadata', () => { if(at) try{ v.currentTime = at; }catch(e){} }, { once:true });
  v.play().catch(() => {});
  me.busy = false;
}
v.addEventListener('playing', () => {
  $('#pmsg').style.display = 'none'; showTop();
  setTimeout(() => { if(pl && !v.paused && v.readyState >= 2 && !v.videoWidth) nextSrc("This browser can't show this video's picture."); }, 2500);
});
v.addEventListener('error', () => { if(pl && v.getAttribute('src')) nextSrc("This file's format can't play in the browser."); });
function saveNow(){
  const me = pl; if(!me || me.finished || !v.duration || !isFinite(v.duration) || v.currentTime < 5) return;
  prog[me.key] = { t:v.currentTime, d:v.duration, at:Date.now(), tid:me.f.tid, id:me.id, title:me.title, name:me.title, label:me.label || '', link:me.link, poster:me.poster || null };
  saveProg();
}
v.addEventListener('timeupdate', () => {
  const me = pl; if(!me || !v.duration || !isFinite(v.duration)) return;
  if(!me.finished && v.currentTime / v.duration >= 0.92){ me.finished = true; delete prog[me.key]; done[me.key] = Date.now(); saveProg(); }
  if(me.next && v.duration - v.currentTime < Math.max(60, v.duration * .04)) $('#pnext').classList.add('show');
  if(Date.now() - me.lastSave > 5000){ me.lastSave = Date.now(); saveNow(); }
});
v.addEventListener('pause', saveNow);
v.addEventListener('ended', () => { if(pl && pl.next) $('#pnext').classList.add('show'); });
addEventListener('pagehide', saveNow);
document.addEventListener('visibilitychange', () => { if(document.hidden) saveNow(); });
function stopPlayer(keepLayer){
  saveNow(); v.pause(); v.removeAttribute('src'); v.load();
  pl = null; document.body.classList.remove('playing');
  if(!keepLayer){ refresh(); }
}
$('#pclose').onclick = back;
$('#pnext').onclick = () => { const n = pl && pl.next; if(n){ saveNow(); n(); } };

/* ================= settings ================= */
function drawSettings(){
  const b = $('#setbody'), rk = store.get(K_RD, ''), tk = store.get(K_TM, ''), n = titles().length;
  const mobile = IS_ANDROID || IS_IOS;
  b.innerHTML = `
  <div class="card glass"><h3>Real-Debrid</h3><p>Your API token from <a href="https://real-debrid.com/apitoken" target="_blank" rel="noopener">real-debrid.com/apitoken</a>. It stays on this device.</p>
    <div class="fld"><input id="rdk" type="password" placeholder="Paste token" value="${esc(rk)}" autocomplete="off"><button id="rdshow">Show</button><button class="sv" id="rdsave">Save</button></div>
    <div class="stat" id="rdstat">${rk ? (n ? n + ' titles · ' : '') + (lib.synced ? 'synced ' + ago(lib.synced) : 'not synced yet') : 'Not connected'}</div></div>
  <div class="card glass"><h3>TMDB</h3><p>Used for posters, names and episode titles. Your free key or read token from themoviedb.org.</p>
    <div class="fld"><input id="tmk" type="password" placeholder="Paste key" value="${esc(tk)}" autocomplete="off"><button id="tmshow">Show</button><button class="sv" id="tmsave">Save</button></div></div>
  <div class="card glass"><h3>Playback</h3><p>Videos play here when the format allows. 4K and HEVC files open in VLC automatically on phones.</p>
    ${mobile ? `<button class="tg ${store.get(K_VLC, false) ? 'on' : ''}" id="tvlc"><span>Always open in VLC<small>Skip the built-in player</small></span><i class="sw2"></i></button>` : ''}
    <button class="tg" id="tclear" style="margin-top:${mobile ? 12 : 0}px"><span>Clear watch progress<small>Resume points and watched marks</small></span></button></div>
  <div class="card glass"><h3>Library</h3><p>Lumen reads what is already in your Real-Debrid account. New downloads show up after a sync.</p>
    <button class="wide glass press" id="ssync">Sync now</button>
    <button class="wide glass press" id="rematch" style="margin-top:10px">Re-match all titles</button></div>
  <div class="ver">LUMEN · 1.0</div>`;
  const show = (i, btn) => { const x = $(i); x.type = x.type === 'password' ? 'text' : 'password'; $(btn).textContent = x.type === 'password' ? 'Show' : 'Hide'; };
  $('#rdshow').onclick = () => show('#rdk', '#rdshow'); $('#tmshow').onclick = () => show('#tmk', '#tmshow');
  $('#rdsave').onclick = () => {
    const k = $('#rdk').value.trim(); store.set(K_RD, k); if(!k){ drawSettings(); return; }
    $('#rdstat').textContent = 'Checking…';
    sync().then(() => { toast('Real-Debrid connected'); if($('#set').classList.contains('open')) drawSettings(); }).catch(e => { $('#rdstat').textContent = errMsg(e); });
  };
  $('#tmsave').onclick = () => {
    const k = $('#tmk').value.trim(); store.set(K_TM, k);
    tmdb('/configuration').then(() => { toast('TMDB key saved'); if(store.get(K_RD, '')) sync().catch(() => {}); }).catch(e => toast(errMsg(e)));
  };
  if($('#tvlc')) $('#tvlc').onclick = e => { const on = !store.get(K_VLC, false); store.set(K_VLC, on); e.currentTarget.classList.toggle('on', on); };
  $('#tclear').onclick = () => { if(!confirmTap('#tclear')) return; prog = {}; done = {}; saveProg(); refresh(); toast('Watch progress cleared'); };
  $('#ssync').onclick = () => sync().then(() => { toast('Library up to date'); drawSettings(); }).catch(e => toast(errMsg(e)));
  $('#rematch').onclick = () => { Object.values(lib.items).forEach(it => delete it.m); saveLib(); sync().then(() => { toast('Titles re-matched'); drawSettings(); }).catch(e => toast(errMsg(e))); };
}
// a second tap confirms (no pop-up dialogs)
function confirmTap(sel){ const el = $(sel); if(el.dataset.arm){ delete el.dataset.arm; return true; } el.dataset.arm = 1; const s = $('span', el).firstChild; const old = s.textContent; s.textContent = 'Tap again to confirm'; setTimeout(() => { delete el.dataset.arm; if(s.isConnected) s.textContent = old; }, 2600); return false; }

/* ================= start ================= */
function refresh(){
  drawHome(); if(qi.value) drawResults();
  if($('#lib').classList.contains('open')) drawLib();
  if($('#watch').classList.contains('open')) drawWatch();
  if(cur && $('#title').classList.contains('open') && cur.files){ const eps = cur.files.filter(f => epOf(f.path)); if(cur.t.tv || eps.length > 1) drawShow(eps.length ? eps : cur.files); else drawMovie(cur.files); }
}
drawHome(); indexAll();
if(store.get(K_RD, '') && Date.now() - lib.synced > 10 * 60e3) sync().catch(e => { if(!titles().length) $('#hint').textContent = errMsg(e); });
document.addEventListener('visibilitychange', () => { if(!document.hidden && !pl && store.get(K_RD, '') && Date.now() - lib.synced > 30 * 60e3) sync().catch(() => {}); });
if('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
